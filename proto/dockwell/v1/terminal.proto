syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// TerminalService opens a shell on a server, through its agent, and carries
// what's typed and what it prints. A server's shell is root's, so it's as good
// as root: see docs/adr/0037-a-terminal-on-a-server.md and
// docs/security/terminal.md.
//
// Every method needs an admin in a signed-in session: no API token can call them, whatever
// its scope. A terminal belongs to the person and the session that opened it,
// and nobody else can reach it. Opening one takes a passkey, just now. Opening
// and closing one are on record in Activity, and what's typed and printed is
// never recorded.
//
// A terminal runs on its server apart from any connection, so a client that
// loses its stream attaches again from the last byte it had, and misses
// nothing that fits in what the server keeps. AttachTerminal streams, so it
// has no REST path.
service TerminalService {
  // OpenTerminal starts root's login shell on a server, or the first of bash, ash
  // and sh a container on it has, in it, as the container's own user. A server's
  // terminal needs a proof from FinishStepUp, for opening a terminal on that
  // server, and so does a container's, for it, where the container is as good as
  // root on the server: call without it first, and it checks everything else, then
  // refuses with the reason needs_step_up. A server has room for 8 terminals. No API
  // token can call it.
  rpc OpenTerminal(OpenTerminalRequest) returns (OpenTerminalResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "open"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/terminals"
      body: "*"
    };
  }

  // ListTerminals returns your terminals on a server that are still open, from
  // this session, oldest first. No API token can call it.
  rpc ListTerminals(ListTerminalsRequest) returns (ListTerminalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "list"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/terminals"};
  }

  // AttachTerminal follows what a terminal prints, from a byte offset, then as it
  // comes, with a heartbeat every 10 s, until it ends or you attach to it from
  // somewhere else. A terminal has one attachment at a time. No API token can
  // call it.
  rpc AttachTerminal(AttachTerminalRequest) returns (stream AttachTerminalResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "attach"
    };
  }

  // WriteTerminal types into a terminal you're attached to, and changes its
  // size. Each write says where it starts in all that's been typed, so one sent
  // twice types nothing twice. A write the terminal hasn't room for is taken in
  // part, and offset in the response says how much: send the rest after. No API
  // token can call it.
  rpc WriteTerminal(WriteTerminalRequest) returns (WriteTerminalResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "write"
    };
    option (google.api.http) = {
      post: "/v1/terminals/{terminal_id}:write"
      body: "*"
    };
  }

  // CloseTerminal hangs up a terminal's shell, as closing an SSH session does,
  // and ends it. No API token can call it.
  rpc CloseTerminal(CloseTerminalRequest) returns (CloseTerminalResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "close"
    };
    option (google.api.http) = {
      post: "/v1/terminals/{terminal_id}:close"
      body: "*"
    };
  }

  // GetTerminalWorkingDirectory returns a host terminal's current working
  // directory on the server when the agent can read it from /proc, and its home
  // folder as a fallback. For a container shell or an older agent, known is
  // false and home is empty so the panel falls back to Files' own default. No
  // API token can call it.
  rpc GetTerminalWorkingDirectory(GetTerminalWorkingDirectoryRequest) returns (GetTerminalWorkingDirectoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "cwd"
    };
    option (google.api.http) = {get: "/v1/terminals/{terminal_id}/workingDirectory"};
  }

  // GetTerminalPreferences returns your saved terminal display settings. No API
  // token can call it.
  rpc GetTerminalPreferences(GetTerminalPreferencesRequest) returns (GetTerminalPreferencesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "get-preferences"
    };
    option (google.api.http) = {get: "/v1/terminal/preferences"};
  }

  // UpdateTerminalPreferences saves your terminal display settings. No API
  // token can call it.
  rpc UpdateTerminalPreferences(UpdateTerminalPreferencesRequest) returns (UpdateTerminalPreferencesResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "set-preferences"
    };
    option (google.api.http) = {
      post: "/v1/terminal/preferences"
      body: "*"
    };
  }

  // ListSavedCommands returns your personal saved terminal commands and the
  // install's shared commands. No API token can call it.
  rpc ListSavedCommands(ListSavedCommandsRequest) returns (ListSavedCommandsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "list-commands"
    };
    option (google.api.http) = {get: "/v1/terminal/commands"};
  }

  // SaveCommand creates or updates a saved terminal command, either personal to
  // you or shared across admins on the install. A command that looks like it
  // contains a secret is refused with the reason looks_like_secret unless
  // allow_plain_text_secret is set. No API token can call it.
  rpc SaveCommand(SaveCommandRequest) returns (SaveCommandResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "save-command"
    };
    option (google.api.http) = {
      post: "/v1/terminal/commands"
      body: "*"
    };
  }

  // DeleteSavedCommand removes a personal or shared saved terminal command. No
  // API token can call it.
  rpc DeleteSavedCommand(DeleteSavedCommandRequest) returns (DeleteSavedCommandResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "delete-command"
    };
    option (google.api.http) = {
      post: "/v1/terminal/commands/{id}:delete"
      body: "*"
    };
  }

  // ImportSavedCommands adds a batch of saved terminal commands from a file. If
  // any command looks like it contains a secret, the import is refused with the
  // reason looks_like_secret unless allow_plain_text_secret is set. No API
  // token can call it.
  rpc ImportSavedCommands(ImportSavedCommandsRequest) returns (ImportSavedCommandsResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "terminals"
      verb: "import-commands"
    };
    option (google.api.http) = {
      post: "/v1/terminal/commands:import"
      body: "*"
    };
  }
}

// Terminal is a shell on a server.
message Terminal {
  // Its ID, such as "trm_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // The server it runs on.
  string server_id = 2;
  // Who it runs as and where, as a prompt says it, such as "root@hz-1".
  string title = 3;
  // When it opened.
  google.protobuf.Timestamp open_time = 4;
  // Its width, in characters.
  uint32 columns = 5;
  // Its height, in lines.
  uint32 rows = 6;
  // The container it runs in, by name, for a shell in a container.
  string container = 7;
}

// OpenTerminalRequest names a server.
message OpenTerminalRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The terminal's width, from 2 to 500 characters.
  uint32 columns = 2;
  // Its height, from 1 to 200 lines.
  uint32 rows = 3;
  // The proof from FinishStepUp, for opening a terminal on this server, as the
  // target "srv_…", or in this container, as "srv_…:container". Call without it
  // first: it checks everything else, then refuses with the reason needs_step_up
  // where it takes one.
  string proof = 4;
  // A container on the server, by name or full ID, to open a shell in, in place of
  // the server's own.
  string container = 5;
  // Open the container's database client (psql, mysql, mariadb, redis-cli,
  // valkey-cli, or mongosh) as its admin user, signing in with what its
  // environment holds so no password appears on a command line. Needs container
  // or container_id, and cannot be combined with argv.
  bool database_console = 6;
  // The database inside the container to connect to when database_console is
  // set. Empty uses the engine's default.
  string database = 7 [(dockwell.v1.flag) = "database-name"];
  // The host shell's starting directory. Empty uses its usual directory.
  string working_directory = 8;
  // Full Engine ID in place of container. The passkey target includes this ID.
  string container_id = 400;
  // Run an executable directly in the container, with no shell expansion.
  // Empty selects an available shell. The arguments are not audited.
  repeated string argv = 401;
}

// OpenTerminalResponse is the terminal, running.
message OpenTerminalResponse {
  Terminal terminal = 1;
}

// ListTerminalsRequest names a server.
message ListTerminalsRequest {
  // The server's ID.
  string server_id = 1;
}

// ListTerminalsResponse is your open terminals there.
message ListTerminalsResponse {
  repeated Terminal terminals = 1;
}

// AttachTerminalRequest names a terminal, and where to read it from.
message AttachTerminalRequest {
  // The terminal's ID.
  string terminal_id = 1;
  // The first byte of what it printed to send: how much you have already, or 0
  // for all the server still keeps.
  uint64 offset = 2;
  // The terminal's width now, to set it as the attachment starts. 0 leaves it.
  uint32 columns = 3;
  // Its height now. 0 leaves it.
  uint32 rows = 4;
}

// AttachTerminalResponse is one message of an attachment: what the terminal
// printed, a heartbeat, or how it ended.
message AttachTerminalResponse {
  // Where data starts, in all the terminal has printed. Past the offset asked
  // for, or past the end of the last message, when the server no longer kept
  // what came between, which is then lost.
  uint64 offset = 1;
  // What it printed, as the shell wrote it: bytes, not always whole characters.
  bytes data = 2;
  // How much of what's been typed the terminal has taken, on the first message,
  // so a client sends again what it typed past that.
  uint64 input_offset = 3;
  // True on the first message, once the terminal is attached here.
  bool attached = 4;
  // True when this message says only that the attachment is still there.
  bool heartbeat = 5;
  // True when the terminal was attached from somewhere else, which ends this
  // attachment. The terminal goes on.
  bool moved = 6;
  // How the terminal ended, on the last message. It ended for good.
  TerminalEnd end = 7;
}

// TerminalEnd says how a terminal ended.
message TerminalEnd {
  // Why.
  TerminalEndReason reason = 1;
  // The shell's exit status, when it exited.
  int32 exit_code = 2;
  // When.
  google.protobuf.Timestamp time = 3;
  // What happened, for people, such as "The shell exited with code 0".
  string message = 4;
}

// TerminalEndReason is why a terminal ended.
enum TerminalEndReason {
  TERMINAL_END_REASON_UNSPECIFIED = 0;
  // The shell exited, as after exit or logout.
  TERMINAL_END_REASON_EXITED = 1;
  // Someone closed it, with CloseTerminal.
  TERMINAL_END_REASON_CLOSED = 2;
  // Nobody was attached to it for 10 minutes.
  TERMINAL_END_REASON_DETACHED = 3;
  // Nothing was typed into it for an hour.
  TERMINAL_END_REASON_IDLE = 4;
  // The session that opened it ended: signed out, revoked or past its limits.
  TERMINAL_END_REASON_SIGNED_OUT = 5;
  // Its server's agent restarted, and its shell with it.
  TERMINAL_END_REASON_AGENT_RESTARTED = 6;
  // The control plane restarted, and no longer knew it.
  TERMINAL_END_REASON_CONTROL_PLANE_RESTARTED = 7;
  // Its server was removed from Dockwell.
  TERMINAL_END_REASON_SERVER_REMOVED = 8;
  // Its server couldn't keep it going: what it reads or writes failed.
  TERMINAL_END_REASON_FAILED = 9;
}

// WriteTerminalRequest is what's typed, and the terminal's size.
message WriteTerminalRequest {
  // The terminal's ID.
  string terminal_id = 1;
  // Where data starts in all that's been typed into the terminal.
  uint64 offset = 2;
  // What's typed, 64 KiB at most.
  bytes data = 3;
  // The terminal's width, to change it. 0 leaves it.
  uint32 columns = 4;
  // Its height, to change it. 0 leaves it.
  uint32 rows = 5;
}

// WriteTerminalResponse says how much the terminal has taken.
message WriteTerminalResponse {
  // How much of what's been typed the terminal has taken, in all. Short of the
  // write's end when it hadn't room for all of it.
  uint64 offset = 1;
}

// CloseTerminalRequest names a terminal.
message CloseTerminalRequest {
  // The terminal's ID.
  string terminal_id = 1;
}

// CloseTerminalResponse says how it ended.
message CloseTerminalResponse {
  TerminalEnd end = 1;
}

// GetTerminalWorkingDirectoryRequest names a terminal.
message GetTerminalWorkingDirectoryRequest {
  // The terminal's ID.
  string terminal_id = 1;
}

// GetTerminalWorkingDirectoryResponse reports where the terminal's shell is
// working on the server, or its fallback home directory.
message GetTerminalWorkingDirectoryResponse {
  // The shell's current working directory on the server, when known.
  string path = 1;
  // The fallback home directory on the server, such as "/root".
  string home = 2;
  // True when path is the shell's live working directory rather than a fallback.
  bool known = 3;
}

// TerminalCursorStyle chooses the terminal cursor shape.
enum TerminalCursorStyle {
  // Default cursor style (block).
  TERMINAL_CURSOR_STYLE_UNSPECIFIED = 0;
  // A filled block cursor.
  TERMINAL_CURSOR_STYLE_BLOCK = 1;
  // An underline cursor.
  TERMINAL_CURSOR_STYLE_UNDERLINE = 2;
  // A vertical bar cursor.
  TERMINAL_CURSOR_STYLE_BAR = 3;
}

// TerminalPreferences holds a person's terminal display settings. Zero or unset
// fields use Dockwell's defaults.
message TerminalPreferences {
  // Font size in pixels, from 10 to 24. Zero uses Dockwell's default (12.5 on
  // desktop, 13 on a phone).
  double font_size = 1;
  // Named font preset: empty or "default" for JetBrains Mono (panel mono), or
  // "system-mono", "fira-code", "ibm-plex-mono", "source-code-pro".
  string font_family = 2;
  // Line height multiplier, from 1.0 to 2.0. Zero matches Dockwell's default
  // row spacing.
  double line_height = 3;
  // Cursor shape. Unspecified uses block.
  TerminalCursorStyle cursor_style = 4;
  // Whether the cursor blinks. Unset defaults to true.
  optional bool cursor_blink = 5;
  // Number of scrollback lines kept in the browser, from 500 to 50000. Zero
  // uses the default (5000).
  uint32 scrollback = 6;
}

// GetTerminalPreferencesRequest asks for the caller's terminal settings.
message GetTerminalPreferencesRequest {}

// GetTerminalPreferencesResponse carries the caller's terminal settings.
message GetTerminalPreferencesResponse {
  // The saved preferences.
  TerminalPreferences preferences = 1;
}

// UpdateTerminalPreferencesRequest updates the caller's terminal settings.
message UpdateTerminalPreferencesRequest {
  // The settings to store.
  TerminalPreferences preferences = 1;
}

// UpdateTerminalPreferencesResponse carries the saved terminal settings.
message UpdateTerminalPreferencesResponse {
  // The stored preferences.
  TerminalPreferences preferences = 1;
}

// SavedCommand is a reusable terminal command stored in plain text for one
// person or shared across admins on the install.
message SavedCommand {
  // Its ID, such as "tcm_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // Short label shown in the saved commands list, at most 80 characters.
  string name = 2;
  // Command text typed into the terminal, at most 4096 characters.
  string command = 3;
  // Optional group name for organizing commands, at most 64 characters.
  string group = 4;
  // True when shared across admins on the install; false when personal.
  bool shared = 5;
  // When it was created.
  google.protobuf.Timestamp create_time = 6;
  // When it was last edited.
  google.protobuf.Timestamp update_time = 7;
  // Who created this command, for shared commands.
  string created_by = 8;
  // Who last edited this command, for shared commands.
  string updated_by = 9;
}

// SavedCommandInput describes one command to create during import.
message SavedCommandInput {
  // Short label shown in the saved commands list.
  string name = 1;
  // Command text typed into the terminal.
  string command = 2;
  // Optional group name.
  string group = 3;
  // True to store as a shared install command; false for personal.
  bool shared = 4;
}

// ListSavedCommandsRequest lists the caller's personal and shared commands.
message ListSavedCommandsRequest {}

// ListSavedCommandsResponse carries personal and shared saved commands.
message ListSavedCommandsResponse {
  // Personal commands and shared install commands.
  repeated SavedCommand commands = 1;
}

// SaveCommandRequest creates or updates a saved terminal command.
message SaveCommandRequest {
  // Existing command ID to edit, or empty to create a new command.
  string id = 1;
  // Short label, 1 to 80 characters.
  string name = 2;
  // Command text, 1 to 4096 characters.
  string command = 3;
  // Optional group name, at most 64 characters.
  string group = 4;
  // True to store as a shared install command; false for personal.
  bool shared = 5;
  // Set true to acknowledge plain-text storage when the command looks like a
  // secret.
  bool allow_plain_text_secret = 6;
}

// SaveCommandResponse carries the saved command.
message SaveCommandResponse {
  // The created or updated command.
  SavedCommand command = 1;
}

// DeleteSavedCommandRequest names a saved command to remove.
message DeleteSavedCommandRequest {
  // The command's ID.
  string id = 1;
  // True when deleting a shared install command; false for a personal command.
  bool shared = 2;
}

// DeleteSavedCommandResponse is empty.
message DeleteSavedCommandResponse {}

// ImportSavedCommandsRequest adds a batch of commands from an exported file.
message ImportSavedCommandsRequest {
  // Commands to import, at most 200 per call.
  repeated SavedCommandInput commands = 1;
  // Set true to acknowledge plain-text storage when any imported command looks
  // like a secret.
  bool allow_plain_text_secret = 2;
}

// ImportSavedCommandsResponse reports how many commands were imported and
// returns the full list.
message ImportSavedCommandsResponse {
  // All saved commands now available to the caller.
  repeated SavedCommand commands = 1;
  // How many commands were added by this import.
  uint32 imported = 2;
}

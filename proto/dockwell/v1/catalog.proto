// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package dockwell.v1;

import "dockwell/catalog/v1alpha1/entry.proto";
import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// CatalogService lists the apps you can install, and plans installing one as a
// project of its own: a Compose file with sensible ports and generated
// passwords, sealed, through the same plan as any other change. Nothing runs
// until you apply it. See
// docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
service CatalogService {
  // ListCatalogEntries returns the apps in the catalog that match its filters, a page
  // at a time, sorted by name or featured first, with how many match in all.
  rpc ListCatalogEntries(ListCatalogEntriesRequest) returns (ListCatalogEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SHARED;
    option (google.api.http) = {get: "/v1/catalog/entries"};
  }

  // GetCatalogEntry returns one app, with what InstallCatalogEntry would use if
  // you give it nothing: a name that's free, and ports nothing Dockwell runs has
  // taken.
  rpc GetCatalogEntry(GetCatalogEntryRequest) returns (GetCatalogEntryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SHARED;
    option (google.api.http) = {get: "/v1/catalog/entries/{id}"};
  }

  // ListCatalogInstalls returns what's installed from the catalog and still has
  // services, by project.
  rpc ListCatalogInstalls(ListCatalogInstallsRequest) returns (ListCatalogInstallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "installs"};
    option (google.api.http) = {get: "/v1/catalog/installs"};
  }

  // UpgradeCatalogInstall plans moving an install to the newest release of its
  // entry, ready to apply or discard, as a three-way merge of the entry's old file,
  // its new one and what runs. What the file gave and the new one changes follows
  // the new one, what the new one dropped goes, and what a person added or changed
  // stays, with anything else in the environment left alone. Where a person and the
  // release both changed one thing, the person's stays and the plan says so, but for
  // the image. Its secrets stay as they are, and the plan says that no backup is
  // taken, as Dockwell can't take one yet. Undoing it puts the old version back, but
  // not what the new one changed in its data. It's refused with the reason up_to_date
  // when there's nothing newer, and no_record for an install from before Dockwell
  // kept what its file gave.
  rpc UpgradeCatalogInstall(UpgradeCatalogInstallRequest) returns (UpgradeCatalogInstallResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "upgrade"};
    option (google.api.http) = {
      post: "/v1/catalog/installs/{id}:upgrade"
      body: "*"
    };
  }

  // SetCatalogCompanion plans adding one of an install's companions, or taking
  // it away, ready to apply or discard, at the release the install is on. Adding
  // one publishes it on a port that's free unless values names one. Taking one
  // away keeps any volume it had, as an upgrade does. The pin records the choice
  // in the same change, so an upgrade keeps it and an undo puts both back. It's
  // refused with the reason unchanged when the companion is as asked already,
  // and upgrade_first when the release installed has no such service.
  rpc SetCatalogCompanion(SetCatalogCompanionRequest) returns (SetCatalogCompanionResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "set-companion"};
    option (google.api.http) = {
      post: "/v1/catalog/installs/{id}:set-companion"
      body: "*"
    };
  }

  // SetCatalogNeed plans meeting one of an install's needs another way, ready to
  // apply or discard, at the release the install is on: Use another database. For
  // now the way is a server Dockwell runs, as InstallCatalogEntryRequest.needs
  // names one: the plan makes the app a database and user there, sets the need's
  // values again, links the server in, and restarts the app. Where both run the same
  // engine, the plan copies the app's database across first, and the app keeps
  // serving from the old one until the copy is done; otherwise it's refused with
  // cant_copy unless start_empty asks to start empty. What met it before stays as it
  // is, with its data. It's refused with the reason unchanged when the need is met so
  // already.
  rpc SetCatalogNeed(SetCatalogNeedRequest) returns (SetCatalogNeedResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "set-need"};
    option (google.api.http) = {
      post: "/v1/catalog/installs/{id}:set-need"
      body: "*"
    };
  }

  // OpenCatalogInstall plans opening an install that SetCatalogNeed held as it
  // started empty: each of its routes answers again, and each port its services
  // publish listens where it did, as the person who set it up asks. It's refused
  // with the reason not_held when nothing of it is held (ADR 0084).
  rpc OpenCatalogInstall(OpenCatalogInstallRequest) returns (OpenCatalogInstallResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "open"};
    option (google.api.http) = {
      post: "/v1/catalog/installs/{id}:open"
      body: "*"
    };
  }

  // InstallCatalogEntry plans installing an app as a project of its own, ready
  // to apply or discard, as ImportCompose does with a file. The plan makes the
  // project, its secrets and what its Compose file runs, and pins the project to
  // this entry. A secret that no one types is generated and sealed here: no
  // response carries it, and revealing it takes a passkey. Making a project is
  // an admin's (ADR 0049).
  rpc InstallCatalogEntry(InstallCatalogEntryRequest) returns (InstallCatalogEntryResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {
      post: "/v1/catalog/entries/{id}:install"
      body: "*"
    };
  }
  // SetCatalogSource plans adding a catalog from a public Git repository, or moving
  // one to another commit, or having it follow a branch or stay where it is, ready
  // to apply or discard: a folder of Dockwell's entries, or 1Panel's app store,
  // Dokploy's templates or Coolify's, which Dockwell tells from the commit and
  // converts as it reads it, running nothing. Dockwell reads the commit over Git's
  // own protocol, checking what it reads against its names, and checks each entry,
  // and each image an entry names, as it checks its own. The plan's notes say what
  // the commit holds, and what Dockwell leaves out of it and why: an entry it
  // refuses, or one whose ID another has. A source decides what anyone can install,
  // so setting one is an admin's. See docs/adr/0055-catalogs-from-a-git-url.md,
  // docs/adr/0077-dockwells-catalog-in-its-own-repository.md and
  // docs/adr/0078-other-stores-read-on-the-server.md.
  rpc SetCatalogSource(SetCatalogSourceRequest) returns (SetCatalogSourceResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "set-source"};
    option (google.api.http) = {
      post: "/v1/catalog/sources/{name}:set"
      body: "*"
    };
  }
  // ListCatalogSources returns the catalogs Dockwell reads beside its own, with
  // how many of each one's entries it shows, and why it leaves out the rest.
  rpc ListCatalogSources(ListCatalogSourcesRequest) returns (ListCatalogSourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SHARED;
    option (dockwell.v1.command) = {verb: "sources"};
    option (google.api.http) = {get: "/v1/catalog/sources"};
  }
  // ListCatalogStores returns the other stores Dockwell reads directly, each one
  // click from being a catalog source: what it is, its repository, format, branch
  // and licence, how many of its apps install, as this build measured or as its
  // source reads it now, and the source that reads it, if one does. See
  // docs/adr/0083-a-stores-own-logos-and-words-and-stores-one-click-away.md.
  rpc ListCatalogStores(ListCatalogStoresRequest) returns (ListCatalogStoresResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SHARED;
    option (dockwell.v1.command) = {verb: "stores"};
    option (google.api.http) = {get: "/v1/catalog/stores"};
  }
  // ListCatalogSourceRefs lists the branches and tags of a public Git repository,
  // each with the commit it's at now, so a form can check a repository as it's
  // typed and offer its branches to pin a source to. It reads the repository as
  // SetCatalogSource does, at public addresses alone, and changes nothing. An
  // admin's, as it reads the network for whoever asks.
  rpc ListCatalogSourceRefs(ListCatalogSourceRefsRequest) returns (ListCatalogSourceRefsResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "source-refs"};
    option (google.api.http) = {
      post: "/v1/catalog/sources:refs"
      body: "*"
    };
  }
  // CheckCatalogSource looks at the branch a source follows now, rather than at its
  // next hourly look, and when the branch has moved, moves the source to its new
  // commit by Dockwell's own change, applied at once, with the notes a person's
  // move has. What runs doesn't change: an install with a newer release in it
  // shows an upgrade, which a person plans. A commit Dockwell can't read, or whose
  // entries all fail its checks, leaves the source where it is, and the answer
  // says why. An admin's, as it reads the network.
  rpc CheckCatalogSource(CheckCatalogSourceRequest) returns (CheckCatalogSourceResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "check-source"};
    option (google.api.http) = {
      post: "/v1/catalog/sources/{name}:check"
      body: "*"
    };
  }
  // RemoveCatalogSource plans no longer reading a catalog, ready to apply or
  // discard. What's installed from it stays as it runs, and can't upgrade from it.
  // An admin's, as setting one is.
  rpc RemoveCatalogSource(RemoveCatalogSourceRequest) returns (RemoveCatalogSourceResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "remove-source"};
    option (google.api.http) = {
      post: "/v1/catalog/sources/{name}:remove"
      body: "*"
    };
  }
}

// ListCatalogEntriesRequest asks for a page of the catalog. The filters narrow it,
// and combine: an entry must pass each one that is set. See
// docs/adr/0091-the-catalog-a-page-at-a-time.md.
message ListCatalogEntriesRequest {
  // How many entries a page holds, at most 200. Unset lists every entry that
  // matches, in one answer, as the catalog did before it paged.
  int32 page_size = 1;
  // Where to start: the next_page_token of the page before. Pass the same filters
  // with it. Empty starts at the first.
  string page_token = 2;
  // Words an entry has, case aside: in its name, what it does in its own words or
  // in language's, its category or its features. Empty matches every entry.
  string search = 3;
  // Categories a client names with the search's words, in the reader's language,
  // as the control plane doesn't translate a category's name: an entry in one of
  // them matches the search too.
  repeated string search_categories = 4;
  // The reader's language, such as "zh-CN", whose words for what an entry does the
  // search reads beside its own.
  string language = 5;
  // Only entries of one category, such as "databases". Empty is every category.
  string category = 6;
  // Only the apps one catalog has, by its source's name: the entries it lists,
  // and its own entry of each app another catalog lists first, in that entry's
  // place. Empty is every catalog.
  string catalog = 7;
  // Only the apps installed here, from the catalog the entry comes from.
  bool installed = 8;
  // Only the entries of these IDs.
  repeated string ids = 9;
  // How the entries are ordered: by name unless set.
  CatalogOrder order = 10;
}

// CatalogOrder is how the catalog's entries are ordered.
enum CatalogOrder {
  // By name, as the reader's alphabet sorts it, accents aside.
  CATALOG_ORDER_UNSPECIFIED = 0;
  // The apps most people start with first, then those installed here most often,
  // then the rest by name: what New app shows before any words are typed.
  CATALOG_ORDER_FEATURED = 1;
}

// ListCatalogEntriesResponse is a page of the catalog.
message ListCatalogEntriesResponse {
  // The entries of the page, in the order asked for: one for each app, from the
  // first catalog that has it, Dockwell's own first, then each source by its name.
  repeated dockwell.catalog.v1alpha1.Entry entries = 1;
  // The same apps from the other catalogs that have them, each beside the entry of
  // its ID in entries, for the page's entries: an entry of the same ID, name and
  // image is the same app, and anything less certain is another app, which a
  // source leaves out (ADR 0078).
  repeated CatalogAlternative also = 20;
  // How many entries match, across every page.
  int32 total = 21;
  // Pass it as page_token for the next page. Empty on the last page.
  string next_page_token = 22;
  // The categories of the entries that match every filter but category and the
  // search, by name, each with how many of those, and how many of them match the
  // search too: the choices a page of them offers, which stay as words are typed,
  // and where else the words find something. No one page can say either.
  repeated CatalogCategoryCount categories = 23;
}

// CatalogCategoryCount is a category and how many entries are in it.
message CatalogCategoryCount {
  // The category, such as "databases".
  string category = 1;
  // How many entries in it match the search, and every filter but category.
  int32 count = 2;
  // How many entries it has under every filter but category and the search.
  int32 listed = 3;
}

// CatalogAlternative is an app's entry in another catalog than the one it's listed
// from.
message CatalogAlternative {
  // The app's ID, as its entry in ListCatalogEntriesResponse.entries has it.
  string id = 1;
  // The catalog, by its source's name.
  string catalog = 2;
  // Its entry in that catalog.
  dockwell.catalog.v1alpha1.Entry entry = 3;
}

// GetCatalogEntryRequest names an entry.
message GetCatalogEntryRequest {
  // The entry's ID, such as "postgres".
  string id = 1;
  // A name for its project to start from, such as one a person typed. Left
  // out, or not a name a project can have, it's the entry's ID.
  string project = 2;
  // The catalog to read it from, by its source's name, where more than one has
  // the app. Left out, the one it's listed from.
  string catalog = 20;
}

// GetCatalogEntryResponse is an entry, with what installing it would use.
message GetCatalogEntryResponse {
  // The entry.
  dockwell.catalog.v1alpha1.Entry entry = 1;
  // A name for its project that's free: the one asked for, or the entry's ID,
  // such as "mysql", or once that's taken or was used before, the next that
  // isn't, such as "mysql-2", and "mysql-3" for "mysql-2".
  string project = 2;
  // What each input takes if you give it nothing, by name. A port is one that
  // nothing Dockwell runs has taken. A secret isn't here.
  map<string, string> values = 3;
  // What installing it runs, one part for each service its Compose file names: what
  // a person reads before the plan, which says the rest. The one a person opens
  // comes first.
  repeated CatalogPart parts = 4;
  // The catalogs that have the app, the one it's listed from first, by their
  // sources' names, empty for Dockwell's own. One alone has nothing to choose.
  repeated string catalogs = 20;
  // What can meet each of the entry's needs as it's installed, as a person picks:
  // for now a new one beside the app, of each engine it takes that the entry or
  // the catalog brings. The first for each need is what an install takes unless
  // told otherwise. Numbered apart, as open work adds to this message. See
  // docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  repeated CatalogNeedOption needs = 80;
}

// CatalogNeedOption is one way to meet an entry's need.
message CatalogNeedOption {
  // The need, by its name in the entry, such as "db".
  string need = 1;
  // What InstallCatalogEntryRequest.needs takes for it, such as "new:mysql".
  string choice = 2;
  // The engine, and the version it installs.
  dockwell.catalog.v1alpha1.Engine engine = 3;
  string version = 4;
  // The catalog entry a new one comes from, such as "mysql", with its name, where
  // it isn't the entry's own service. Empty: the entry's own.
  string entry = 5;
  string entry_name = 6;
  // A server Dockwell runs already, shared because a person chooses it: its
  // project, environment and service, by name, and its service's ID. Empty for a
  // new one.
  string project = 7;
  string environment = 8;
  string service = 9;
  string service_id = 10;
  // Why it can't meet the need, where it can't, in one line, such as "Nextcloud
  // signs in to it as its administrator". Such an option is listed, greyed,
  // never chosen.
  string why = 11;
  // The apps that use it already, through links of theirs, by project name.
  repeated string shared_with = 12;
  // The servers it runs on, by name, where the app would go with it.
  repeated string servers = 13;
}

// CatalogPart is one service an entry installs.
message CatalogPart {
  // Its name in the entry's Compose file, such as "db".
  string service = 1;
  // The image it runs, by repository and tag, such as "postgres:17.11". The entry
  // pins it by digest too, which this leaves out.
  string image = 2;
  // It's a database the app beside it keeps its data in: one its entry marks as
  // one, or, for an entry that marks none, one of the images Dockwell knows as a
  // database, such as postgres or mariadb.
  bool database = 3;
  // The volumes it keeps its data on, by name, such as "data".
  repeated string volumes = 4;
  // It's what a person opens once it's installed.
  bool opens = 5;
  // What it reaches on its server beyond its own containers, as the plan will say
  // it: a server path, Docker's socket, the server's own network and the like.
  repeated HostAccess host_access = 6;
  // The input each server path in host_access comes from, by the path as it reads
  // here, which is the input's default, so a form shows what a person typed in its
  // place, such as "MEDIA_DIR" for "/srv/media".
  map<string, string> path_inputs = 7;
  // The most memory it may use, as the entry gives it, such as "1G". Empty has no
  // limit.
  string memory = 8;
  // The most CPUs it may use, as the entry gives them, such as "0.5". Empty has no
  // limit.
  string cpus = 9;
  // When Docker restarts it, as the entry gives it. Unspecified is the driver's
  // default, unless-stopped.
  dockwell.resource.v1alpha1.RestartPolicy restart = 10;
  // For a database, the engine Dockwell knows it runs, by its image, such as
  // PostgreSQL for postgres:17.11. Unspecified for any other part, and for a
  // database whose image Dockwell doesn't know. Numbered in the block catalog
  // sources' presentation holds (ADR 0083).
  dockwell.catalog.v1alpha1.Engine engine = 30;
}

// ListCatalogInstallsRequest asks for everything installed.
message ListCatalogInstallsRequest {}

// ListCatalogInstallsResponse lists what's installed from the catalog.
message ListCatalogInstallsResponse {
  // The installs, sorted by project.
  repeated CatalogInstall installs = 1;
}

// CatalogInstall is one project installed from the catalog.
message CatalogInstall {
  // The project's ID.
  string project_id = 1;
  // The project's name, such as "postgres".
  string project = 2;
  // What it's pinned to.
  dockwell.resource.v1alpha1.CatalogPin pin = 3;
  // The app's name, such as "PostgreSQL". Empty once the catalog no longer has
  // the entry, as the install stays pinned to it.
  string name = 4;
  // The ID of the service a person opens: what its entry names, or one of its
  // services when that names none, as a tunnel's.
  string web_service_id = 5;
  // What to do first, as the entry says it. Empty when it says nothing.
  string first_steps = 6;
  // The environment its services run in, by ID, whose secrets it uses.
  string environment_id = 7;
  // What it can move to, when the catalog has a release that changes what runs. A
  // version the same as the pin's is a change to how that version runs. Unset when
  // it's up to date, when a release changes only an entry's words, when the catalog
  // no longer has its entry, or when the install has no record of its file.
  CatalogUpgrade upgrade = 8;
  // Whether each of its entry's companions runs, by service, such as adminer:
  // false. Empty when the catalog no longer has its entry, or it has none.
  map<string, bool> companions = 9;
}

// CatalogUpgrade is a newer release of an install's entry.
message CatalogUpgrade {
  // The app's version in it, such as "17.12".
  string version = 1;
  // The entry's release.
  uint32 release = 2;
}

// InstallCatalogEntryRequest is an app to install.
message InstallCatalogEntryRequest {
  // The entry's ID, such as "postgres".
  string id = 1;
  // What to call its project, which must not be taken. Left out, the one
  // GetCatalogEntry suggests.
  string project = 2;
  // A value for each input, by name. An input left out takes its default; one
  // with neither is refused, unless it's optional. It may hold a secret a person
  // typed, such as a tunnel's token, which the CLI takes only from your environment.
  map<string, string> values = 3 [(dockwell.resource.v1alpha1.sensitive) = true];
  // Where it runs, by server ID, as an edit's servers. Empty runs it on the only
  // server; once there are several, name them.
  repeated string servers = 4;
  // The most memory a service may use, by its name in the entry's Compose file,
  // such as "1G" for db, as a service's resources.memory takes it. A service left
  // out keeps what the entry gives it. An upgrade keeps what you set here, as it
  // keeps what you change on the app.
  map<string, string> memory = 5;
  // The most CPUs a service may use, by its name, such as "0.5" for db, as
  // resources.cpus takes it.
  map<string, string> cpus = 6;
  // When Docker restarts a service's container, by its name, such as always for
  // db.
  map<string, dockwell.resource.v1alpha1.RestartPolicy> restart = 7;
  // Which of the entry's companions to install, by service, such as adminer:
  // true. One left out is as its entry says. An input only a companion left out
  // uses is refused.
  map<string, bool> companions = 8;
  // The catalog to install it from, by its source's name, where more than one has
  // the app. Left out, the one it's listed from. It upgrades from that catalog
  // alone.
  string catalog = 20;
  // How to meet each of the entry's needs, by the need's name: "new" for a new one
  // beside the app, of the engine its first option has, "new:<engine>" for one of
  // another engine it takes (postgresql, mysql, mariadb, redis, valkey, mongodb or
  // clickhouse), or "service:<project>/<environment>/<service>" for a server
  // Dockwell runs already, which a database and user are made on for the app, as
  // GetCatalogEntry lists. A need left out takes its first option. Numbered apart,
  // as open work adds to this message.
  map<string, string> needs = 80;
}

// InstallCatalogEntryResponse carries the planned change.
message InstallCatalogEntryResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// UpgradeCatalogInstallRequest names an install to upgrade.
message UpgradeCatalogInstallRequest {
  // Its project, by name or ID.
  string id = 1;
  // A value for each input the newer release adds, by name, as InstallCatalogEntry
  // takes them. What it was installed with carries over, and its secrets stay.
  map<string, string> values = 2 [(dockwell.resource.v1alpha1.sensitive) = true];
  // Leaves out the backup of its volumes that comes first, and the plan says so.
  bool skip_backup = 3;
}

// UpgradeCatalogInstallResponse carries the planned change.
message UpgradeCatalogInstallResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// SetCatalogCompanionRequest names an install's companion, and whether it runs.
message SetCatalogCompanionRequest {
  // The install's project, by name or ID.
  string id = 1;
  // The companion, by its service's name in the entry, such as "adminer".
  string service = 2;
  // Whether it runs: true adds it, false takes it away.
  bool on = 3;
  // A value for each input it uses, by name, such as ADMIN_PORT. Left out, a
  // port is one that nothing Dockwell runs has taken.
  map<string, string> values = 4;
}

// SetCatalogCompanionResponse carries the planned change.
message SetCatalogCompanionResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// SetCatalogNeedRequest names an install's need, and what meets it now.
message SetCatalogNeedRequest {
  // The install's project, by name or ID.
  string id = 1;
  // The need, by its name in the entry, such as "db".
  string need = 2;
  // What meets it, as GetCatalogEntryResponse.needs offers it: a server Dockwell
  // runs, as "service:<project>/<environment>/<service>".
  string choice = 3;
  // Start the app on an empty database there, rather than copying its own across.
  // Copying is the default where both ends run the same engine; where they don't,
  // the plan is refused with the reason cant_copy until this asks for it. An app
  // whose first visitor makes its owner then has every way in held before it
  // restarts: its routes answer that it isn't open, and the ports its services
  // publish listen on the server alone, until OpenCatalogInstall opens them, so
  // its owner sets it up first, through the panel. Where nothing can be held, it's
  // refused with the reason cant_hold.
  bool start_empty = 4;
}

// SetCatalogNeedResponse carries the planned change.
message SetCatalogNeedResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// OpenCatalogInstallRequest names the install to open.
message OpenCatalogInstallRequest {
  // The install's project, by name or ID.
  string id = 1;
}

// OpenCatalogInstallResponse carries the planned change.
message OpenCatalogInstallResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// SetCatalogSourceRequest names a source, and what it reads.
message SetCatalogSourceRequest {
  // What to call it, such as "community", which its entries show beside them.
  string name = 1;
  // The repository's URL, over HTTPS.
  string repository = 2;
  // The folder of entries in it. Empty is its top.
  string path = 3;
  // The commit to read it at, in full, as 40 hex digits. Left out with follow
  // set, it's the commit the branch is at now.
  string commit = 4;
  // The branch to follow, such as "main", which Dockwell moves the source along
  // as it moves, by changes of its own. Empty pins it at commit.
  string follow = 10;
  // How its folder is laid out. Left out, Dockwell tells from the commit, and the
  // plan says which it read it as; a folder that could be more than one is refused,
  // naming each, for you to pick.
  dockwell.resource.v1alpha1.CatalogFormat format = 20;
}

// SetCatalogSourceResponse is the change that sets it.
message SetCatalogSourceResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// ListCatalogSourcesRequest asks for every source.
message ListCatalogSourcesRequest {}

// ListCatalogSourcesResponse is every source.
message ListCatalogSourcesResponse {
  // Each source, by name.
  repeated CatalogSourceInfo sources = 1;
}

// CatalogSourceInfo is a source, and what Dockwell made of it.
message CatalogSourceInfo {
  // Its name.
  string name = 1;
  // What it reads, as the resource says.
  dockwell.resource.v1alpha1.CatalogSource source = 2;
  // The IDs of the entries the catalog shows from it, sorted.
  repeated string entries = 3;
  // What it leaves out, by file.
  repeated CatalogSourceRefusal refused = 4;
  // Why its entries can't be read now, such as a host that doesn't answer. Empty
  // when they can.
  string unread = 5;
  // When Dockwell last looked at the branch it follows. Unset for a source that
  // doesn't follow one, or one not looked at since the control plane started.
  google.protobuf.Timestamp checked = 10;
  // Why it isn't at the branch's commit after that look: the branch can't be
  // read, or its commit can't, or all of that commit's entries fail Dockwell's
  // checks. Empty when it's where it should be.
  string problem = 11;
  // The commit the branch was at when Dockwell last looked.
  string branch_commit = 12;
  // When Dockwell looks at the branch next, later after each look that failed.
  google.protobuf.Timestamp next_check = 13;
  // It's Dockwell's own catalog: it reads Dockwell/catalog's entries, and comes
  // before every other source. See
  // docs/adr/0077-dockwells-catalog-in-its-own-repository.md.
  bool own = 14;
  // The IDs of the apps it has that the catalog lists from a catalog before it,
  // whose entries in it are another choice of the same app, sorted.
  repeated string also = 20;
  // The store it reads, by the ID ListCatalogStores gives it, such as "onepanel",
  // where it reads one at that store's own repository, in its format. Empty for
  // any other source. Numbered in the block catalog sources' presentation holds
  // (ADR 0083).
  string store = 30;
  // For another store's catalog, the licence its repository states, as an SPDX
  // identifier: NONE where it has no licence file, which the panel says as "None
  // stated", or NOASSERTION where its licence file is none Dockwell recognises,
  // "Not recognised". Empty for a catalog of Dockwell's own format, whose entries
  // each say theirs (ADR 0083).
  string license = 31;
}

// CatalogSourceRefusal is a file of a source the catalog leaves out, and why.
message CatalogSourceRefusal {
  // The file's name in the source's folder, such as "notes.yaml", or for another
  // store's app, its folder or file there, such as "apps/memos".
  string file = 1;
  // Why, such as what the catalog's check says of it.
  string reason = 2;
  // For another store's app, what kind of reason it is, to count them by, such as
  // "scripts" for an app that runs scripts on the server. Empty for an entry of
  // Dockwell's own format.
  string kind = 20;
  // For another store's app, its ID as an entry would have it, such as "memos".
  string id = 21;
}

// ListCatalogStoresRequest asks for every store Dockwell reads directly.
message ListCatalogStoresRequest {}

// ListCatalogStoresResponse is every store Dockwell reads directly.
message ListCatalogStoresResponse {
  // Each store, the one with the most apps that install first.
  repeated CatalogStore stores = 1;
}

// CatalogStore is another store's catalog that Dockwell reads directly and
// converts as it reads it (ADR 0078), as a person adds it in one click.
message CatalogStore {
  // Its ID, such as "onepanel", which a source of it is named by unless that's
  // taken.
  string id = 1;
  // What it's called, such as "1Panel's app store".
  string name = 2;
  // How a source of it reads, short, such as "1Panel".
  string label = 3;
  // Its repository's URL, over HTTPS.
  string repository = 4;
  // How its folder is laid out.
  dockwell.resource.v1alpha1.CatalogFormat format = 5;
  // The branch a source of it follows, as the repository names its default, such
  // as "dev".
  string branch = 6;
  // The licence its entries come under, as an SPDX identifier, such as
  // "GPL-3.0-only".
  string license = 7;
  // The store's own project site, at an HTTPS address.
  string homepage = 8;
  // How many apps it holds.
  uint32 apps = 9;
  // How many of them install: those Dockwell converts into entries.
  uint32 installs = 10;
  // The commit apps and installs were counted at, in full: the one its source reads
  // now, or the one this build measured.
  string commit = 11;
  // apps and installs are its source's, as Dockwell read it, rather than what this
  // build measured.
  bool live = 12;
  // The source that reads it, by name. Empty when none does.
  string source = 13;
}

// ListCatalogSourceRefsRequest names a repository.
message ListCatalogSourceRefsRequest {
  // The repository's URL, over HTTPS.
  string repository = 1;
}

// ListCatalogSourceRefsResponse is the repository's branches and tags.
message ListCatalogSourceRefsResponse {
  // The default branch, then each other branch, then each tag, by name. At most
  // 500: more are left out.
  repeated CatalogSourceRef refs = 1;
  // Whether some were left out.
  bool more = 2;
  // The branch the repository's HEAD names, its default, such as
  // "refs/heads/main", which leads refs. Empty when it names none.
  string head = 3;
  // How the default branch's commit is laid out, as Dockwell tells from its
  // folders: the likeliest first. One is what a source of it reads as; more than one
  // is for a person to pick from; none means it holds no catalog Dockwell reads, or
  // it couldn't be read.
  repeated CatalogSourceGuess formats = 20;
}

// CatalogSourceGuess is a layout a repository's folders look like.
message CatalogSourceGuess {
  // The format.
  dockwell.resource.v1alpha1.CatalogFormat format = 1;
  // The folder that holds it, as a source names it, such as "entries". Empty is
  // the repository's top.
  string path = 2;
  // How many apps or entries it looks to hold, by their files' names.
  uint32 apps = 3;
}

// CatalogSourceRef is a branch or a tag, and the commit it's at.
message CatalogSourceRef {
  // Its full name, such as "refs/heads/main" or "refs/tags/v1".
  string name = 1;
  // The commit it's at, in full. A tag's is the commit it names.
  string commit = 2;
}

// CheckCatalogSourceRequest names a source that follows a branch.
message CheckCatalogSourceRequest {
  // The source's name.
  string name = 1;
}

// CheckCatalogSourceResponse is what the look found.
message CheckCatalogSourceResponse {
  // The source as it is after the look.
  CatalogSourceInfo source = 1;
  // The change that moved it, applied. Unset when it was where the branch is, or
  // couldn't move, as source.problem says.
  Change change = 2;
}

// RemoveCatalogSourceRequest names the source to stop reading.
message RemoveCatalogSourceRequest {
  // The source's name.
  string name = 1;
}

// RemoveCatalogSourceResponse is the change that removes it.
message RemoveCatalogSourceResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

syntax = "proto3";

package dockwell.v1;

import "dockwell/catalog/v1alpha1/entry.proto";
import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";

// CatalogService lists the apps you can install, and plans installing one as a
// project of its own: a Compose file with sensible ports and generated
// passwords, sealed, through the same plan as any other change. Nothing runs
// until you apply it. See
// docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
service CatalogService {
  // ListCatalogEntries returns every app in the catalog, sorted by name.
  rpc ListCatalogEntries(ListCatalogEntriesRequest) returns (ListCatalogEntriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (google.api.http) = {get: "/v1/catalog/entries"};
  }

  // GetCatalogEntry returns one app, with what InstallCatalogEntry would use if
  // you give it nothing: a name that's free, and ports nothing Dockwell runs has
  // taken.
  rpc GetCatalogEntry(GetCatalogEntryRequest) returns (GetCatalogEntryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (google.api.http) = {get: "/v1/catalog/entries/{id}"};
  }

  // ListCatalogInstalls returns what's installed from the catalog and still has
  // services, by project.
  rpc ListCatalogInstalls(ListCatalogInstallsRequest) returns (ListCatalogInstallsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.command) = {verb: "installs"};
    option (google.api.http) = {get: "/v1/catalog/installs"};
  }

  // UpgradeCatalogInstall plans moving an install to the newest release of its
  // entry, ready to apply or discard, as a three-way merge of the entry's old file,
  // its new one and what runs. What the file gave and the new one changes follows
  // the new one, what the new one dropped goes, and what a person added or changed
  // stays, with anything else in the environment left alone. Where a person and the
  // release both changed one thing, the person's stays and the plan says so, but for
  // the image. Its secrets stay as they are, and the plan says that no backup is
  // taken, as Dockwell can't take one yet. Undoing it puts the old version back, but
  // not what the new one changed in its data. It's refused with the reason up_to_date
  // when there's nothing newer, and no_record for an install from before Dockwell
  // kept what its file gave.
  rpc UpgradeCatalogInstall(UpgradeCatalogInstallRequest) returns (UpgradeCatalogInstallResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.command) = {verb: "upgrade"};
    option (google.api.http) = {
      post: "/v1/catalog/installs/{id}:upgrade"
      body: "*"
    };
  }

  // InstallCatalogEntry plans installing an app as a project of its own, ready
  // to apply or discard, as ImportCompose does with a file. The plan makes the
  // project, its secrets and what its Compose file runs, and pins the project to
  // this entry. A secret that no one types is generated and sealed here: no
  // response carries it, and revealing it takes a passkey.
  rpc InstallCatalogEntry(InstallCatalogEntryRequest) returns (InstallCatalogEntryResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (google.api.http) = {
      post: "/v1/catalog/entries/{id}:install"
      body: "*"
    };
  }
}

// ListCatalogEntriesRequest asks for the whole catalog.
message ListCatalogEntriesRequest {}

// ListCatalogEntriesResponse is the catalog.
message ListCatalogEntriesResponse {
  // Every entry, sorted by name.
  repeated dockwell.catalog.v1alpha1.Entry entries = 1;
}

// GetCatalogEntryRequest names an entry.
message GetCatalogEntryRequest {
  // The entry's ID, such as "postgres".
  string id = 1;
}

// GetCatalogEntryResponse is an entry, with what installing it would use.
message GetCatalogEntryResponse {
  // The entry.
  dockwell.catalog.v1alpha1.Entry entry = 1;
  // A name for its project that's free, such as "postgres", or "postgres-2"
  // once that's taken.
  string project = 2;
  // What each input takes if you give it nothing, by name. A port is one that
  // nothing Dockwell runs has taken. A secret isn't here.
  map<string, string> values = 3;
}

// ListCatalogInstallsRequest asks for everything installed.
message ListCatalogInstallsRequest {}

// ListCatalogInstallsResponse lists what's installed from the catalog.
message ListCatalogInstallsResponse {
  // The installs, sorted by project.
  repeated CatalogInstall installs = 1;
}

// CatalogInstall is one project installed from the catalog.
message CatalogInstall {
  // The project's ID.
  string project_id = 1;
  // The project's name, such as "postgres".
  string project = 2;
  // What it's pinned to.
  dockwell.resource.v1alpha1.CatalogPin pin = 3;
  // The app's name, such as "PostgreSQL". Empty once the catalog no longer has
  // the entry, as the install stays pinned to it.
  string name = 4;
  // The ID of the service a person opens: what its entry names, or one of its
  // services when that names none, as a tunnel's.
  string web_service_id = 5;
  // What to do first, as the entry says it. Empty when it says nothing.
  string first_steps = 6;
  // The environment its services run in, by ID, whose secrets it uses.
  string environment_id = 7;
  // What it can move to, when the catalog has a release that changes what runs. A
  // version the same as the pin's is a change to how that version runs. Unset when
  // it's up to date, when a release changes only an entry's words, when the catalog
  // no longer has its entry, or when the install has no record of its file.
  CatalogUpgrade upgrade = 8;
}

// CatalogUpgrade is a newer release of an install's entry.
message CatalogUpgrade {
  // The app's version in it, such as "17.12".
  string version = 1;
  // The entry's release.
  uint32 release = 2;
}

// InstallCatalogEntryRequest is an app to install.
message InstallCatalogEntryRequest {
  // The entry's ID, such as "postgres".
  string id = 1;
  // What to call its project, which must not be taken. Left out, the one
  // GetCatalogEntry suggests.
  string project = 2;
  // A value for each input, by name. An input left out takes its default; one
  // with neither is refused, unless it's optional. It may hold a secret a person
  // typed, such as a tunnel's token, which the CLI takes only from your environment.
  map<string, string> values = 3 [(dockwell.resource.v1alpha1.sensitive) = true];
  // Where it runs, by server ID, as an edit's servers. Empty runs it on the only
  // server; once there are several, name them.
  repeated string servers = 4;
}

// InstallCatalogEntryResponse carries the planned change.
message InstallCatalogEntryResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// UpgradeCatalogInstallRequest names an install to upgrade.
message UpgradeCatalogInstallRequest {
  // Its project, by name or ID.
  string id = 1;
  // A value for each input the newer release adds, by name, as InstallCatalogEntry
  // takes them. What it was installed with carries over, and its secrets stay.
  map<string, string> values = 2 [(dockwell.resource.v1alpha1.sensitive) = true];
}

// UpgradeCatalogInstallResponse carries the planned change.
message UpgradeCatalogInstallResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

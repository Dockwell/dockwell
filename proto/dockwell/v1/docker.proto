syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/build.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/container.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

// DockerService reads the Engine inventory on selected servers through their agents.
service DockerService {
  option (dockwell.v1.nouns) = {
    name: "docker"
    help: "Inspect the Docker Engine and the containers on a server."
  };

  // GetDockerOverview counts the inventory on each selected server.
  rpc GetDockerOverview(GetDockerOverviewRequest) returns (GetDockerOverviewResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "overview"
    };
    option (google.api.http) = {get: "/v1/docker/overview"};
  }

  // ListDockerObjects reads one bounded page of the selected inventory.
  rpc ListDockerObjects(ListDockerObjectsRequest) returns (ListDockerObjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "list"
    };
    option (google.api.http) = {get: "/v1/docker/objects"};
  }

  // GetDockerObject reads details at one immutable Engine identity.
  rpc GetDockerObject(GetDockerObjectRequest) returns (GetDockerObjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "inspect"
    };
    option (google.api.http) = {get: "/v1/docker/object"};
  }

  // PreviewDockerCleanup lists the artifacts each selected Engine can account for.
  rpc PreviewDockerCleanup(PreviewDockerCleanupRequest) returns (PreviewDockerCleanupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "preview-cleanup"
    };
    option (google.api.http) = {get: "/v1/docker/cleanup"};
  }

  // PlanDockerMaintenance prepares reviewed targets or the current pause for ApplyChange.
  rpc PlanDockerMaintenance(PlanDockerMaintenanceRequest) returns (PlanDockerMaintenanceResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "plan-maintenance"
    };
    option (google.api.http) = {
      post: "/v1/docker/maintenance"
      body: "*"
    };
  }

  // WatchDockerImageBuild follows one standalone build from a saved line cursor.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc WatchDockerImageBuild(WatchDockerImageBuildRequest) returns (stream WatchBuildResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "watch-build"
    };
  }

  // CancelDockerImageBuild asks the builder to stop before publication.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc CancelDockerImageBuild(CancelDockerImageBuildRequest) returns (CancelBuildResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/docker/builds/{server_id}/{change_id}/cancel"
      body: "*"
    };
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "cancel-build"
    };
  }

  // CheckDockerNetwork validates a candidate against selected Engines.
  // REST carries the address pools in the request body.
  rpc CheckDockerNetwork(CheckDockerNetworkRequest) returns (CheckDockerNetworkResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {
      post: "/v1/docker/networks:check"
      body: "*"
    };
  }

  // PlanDockerNetworkAttachment records a normal workload revision for one attachment.
  rpc PlanDockerNetworkAttachment(PlanDockerNetworkAttachmentRequest) returns (PlanDockerNetworkAttachmentResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {
      post: "/v1/docker/networks:planAttachment"
      body: "*"
    };
  }

  // BeginDockerArtifactUpload reserves space and returns the new upload lease.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc BeginDockerArtifactUpload(BeginDockerArtifactUploadRequest) returns (DockerArtifactInfo) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/docker/artifacts/{server_id}"
      body: "*"
    };
  }

  // GetDockerArtifact reads the current lease for its creating actor and session.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetDockerArtifact(GetDockerArtifactRequest) returns (DockerArtifactInfo) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {get: "/v1/docker/artifacts/{server_id}/{artifact_id}"};
  }

  // ListDockerArtifacts lists live leases created by this actor and session on one server.
  rpc ListDockerArtifacts(ListDockerArtifactsRequest) returns (ListDockerArtifactsResponse) {
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "list-artifacts"
    };
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {get: "/v1/docker/artifacts/{server_id}"};
  }

  // FinishDockerArtifactUpload queues validation of a completed upload.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc FinishDockerArtifactUpload(FinishDockerArtifactUploadRequest) returns (DockerArtifactInfo) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/docker/artifacts/{server_id}/{artifact_id}/finish"
      body: "*"
    };
  }

  // AbortDockerArtifact discards the staged bytes for the selected lease.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc AbortDockerArtifact(AbortDockerArtifactRequest) returns (DockerArtifactInfo) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/docker/artifacts/{server_id}/{artifact_id}:abort"
      body: "*"
    };
  }

  // UploadDockerArtifact appends one verified extent to an upload.
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc UploadDockerArtifact(stream UploadDockerArtifactRequest) returns (DockerArtifactInfo) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      put: "/v1/docker/artifacts/{server_id}/{artifact_id}/bytes"
      body: "content"
    };
  }

  // DownloadDockerArtifact streams an exact extent from a sealed export.
  rpc DownloadDockerArtifact(DownloadDockerArtifactRequest) returns (stream DownloadDockerArtifactResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      get: "/v1/docker/artifacts/{server_id}/{artifact_id}/bytes"
      response_body: "body"
    };
  }

  // GetDockerSettings reads the effective Engine settings and known configuration sources.
  rpc GetDockerSettings(GetDockerSettingsRequest) returns (GetDockerSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "get-settings"
    };
    option (google.api.http) = {get: "/v1/docker/settings"};
  }

  // CheckDockerSettings validates proposed defaults on one server before review.
  rpc CheckDockerSettings(CheckDockerSettingsRequest) returns (CheckDockerSettingsResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "check-settings"
    };
    option (google.api.http) = {
      post: "/v1/docker/settings/check"
      body: "*"
    };
  }

  // PlanDockerContainerLogging reviews finite logging limits for a managed workload.
  rpc PlanDockerContainerLogging(PlanDockerContainerLoggingRequest) returns (PlanDockerContainerLoggingResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {
      post: "/v1/docker/settings/logging/plan"
      body: "*"
    };
  }

  // WatchDockerObjects streams invalidations and samples while a view is open.
  rpc WatchDockerObjects(WatchDockerObjectsRequest) returns (stream WatchDockerObjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "docker"
      verb: "watch"
    };
  }
}

// DockerObjectKind names the types of Engine object this inventory can read.
enum DockerObjectKind {
  DOCKER_OBJECT_KIND_UNSPECIFIED = 0;
  DOCKER_OBJECT_KIND_CONTAINER = 1;
  DOCKER_OBJECT_KIND_COMPOSE = 2;
  DOCKER_OBJECT_KIND_IMAGE = 3;
  DOCKER_OBJECT_KIND_NETWORK = 4;
  DOCKER_OBJECT_KIND_VOLUME = 5;
}

// DockerOwnership says who is responsible for a container.
enum DockerOwnership {
  DOCKER_OWNERSHIP_UNSPECIFIED = 0;
  DOCKER_OWNERSHIP_MANAGED = 1;
  DOCKER_OWNERSHIP_EXTERNAL = 2;
  DOCKER_OWNERSHIP_SYSTEM = 3;
}

// DockerHealth is what the Engine reports for a configured health check.
enum DockerHealth {
  DOCKER_HEALTH_UNSPECIFIED = 0;
  DOCKER_HEALTH_STARTING = 1;
  DOCKER_HEALTH_HEALTHY = 2;
  DOCKER_HEALTH_UNHEALTHY = 3;
}

// DockerReadState says why a server cannot answer an inventory read.
enum DockerReadState {
  // In a cleanup preview this means the disk measurement is still underway.
  DOCKER_READ_STATE_UNSPECIFIED = 0;
  DOCKER_READ_STATE_OFFLINE = 1;
  DOCKER_READ_STATE_AGENT_OUTDATED = 2;
  DOCKER_READ_STATE_ENGINE_UNAVAILABLE = 3;
}

// DockerObjectKey identifies an Engine object on one server.
message DockerObjectKey {
  string server_id = 1;
  DockerObjectKind kind = 2;
  // Full Engine ID, or an opaque generation key for a volume.
  string engine_id = 3;
}

// DockerObject combines observed facts with ownership resolved by the control plane.
message DockerObject {
  DockerObjectKey key = 1;
  string name = 2;
  DockerOwnership ownership = 3;
  // Observation time for containers. For Compose, the last saved service
  // revision (managed) or newest container creation observed (outside).
  google.protobuf.Timestamp observed_at = 4;
  ResourceRef managed_resource = 5;
  ContainerState state = 6;
  string managed_resource_id = 7;
  // The managed revision used when planning a run-state change.
  int64 managed_revision = 8;
  oneof detail {
    DockerContainer container = 10;
    DockerCompose compose = 11;
    DockerImage image = 12;
    DockerNetwork network = 13;
    DockerVolume volume = 14;
  }
}

// DockerContainer is a projection of Engine facts. It omits environment,
// commands, raw labels, health check output and arbitrary driver options.
message DockerContainer {
  string image = 1;
  string image_id = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp finished_at = 5;
  DockerHealth health = 6;
  repeated ContainerPort ports = 7;
  repeated DockerEndpoint endpoints = 8;
  repeated ContainerMount mounts = 9;
  string compose_project = 10;
  string compose_service = 11;
  bool one_off = 12;
  optional int32 exit_code = 13;
  bool oom_killed = 14;
  uint32 restart_count = 15;
  string restart_policy = 16;
  uint32 restart_retries = 17;
  uint64 memory_limit_bytes = 18;
  uint64 cpu_limit_nanos = 19;
  string log_driver = 20;
  string log_max_size = 21;
  uint32 log_max_files = 22;
  repeated ContainerPort configured_ports = 23;
  bool details_truncated = 24;
  // An untrusted absolute path hint from Compose. Read it only through FileService.
  string compose_directory = 25;
  repeated DockerVolumeMountRef volume_mounts = 26;
  DockerLogRotationState log_rotation = 27;
}

// DockerEndpoint is a container’s current address on one Docker network.
message DockerEndpoint {
  string network = 1;
  string ipv4 = 2;
  string ipv6 = 3;
  string network_id = 4;
}

// DockerCompose groups distinct Compose services on one server.
message DockerCompose {
  string environment_id = 1;
  uint32 running_services = 2;
  uint32 total_services = 3;
  string source_directory = 4;
  string engine_project = 5;
  uint32 services_needing_attention = 6;
  bool observation_unavailable = 7;
  bool checking = 8;
}

// DockerSample holds available usage counters for one container.
message DockerSample {
  DockerObjectKey key = 1;
  google.protobuf.Timestamp observed_at = 2;
  // As a percentage of one CPU, over the preceding sample interval.
  optional double cpu_percent = 3;
  optional uint64 memory_bytes = 4;
  optional uint64 memory_limit_bytes = 5;
  optional uint64 network_rx_bytes = 6;
  optional uint64 network_tx_bytes = 7;
  optional uint64 block_read_bytes = 8;
  optional uint64 block_write_bytes = 9;
}

// DockerUnavailable names a server that did not answer a read.
message DockerUnavailable {
  string server_id = 1;
  DockerReadState state = 2;
}

// DockerServerSummary counts the Engine inventory at one point in time.
message DockerServerSummary {
  string server_id = 1;
  google.protobuf.Timestamp observed_at = 2;
  uint32 containers = 3;
  uint32 running = 4;
  uint32 compose_projects = 5;
  uint32 images = 6;
  uint32 networks = 7;
  uint32 volumes = 8;
  string engine_version = 9;
  bool exact_terminal = 10;
  string root_directory = 11;
  string logging_driver = 12;
  optional bool live_restore = 13;
  repeated string registry_mirrors = 14;
  uint32 needs_attention = 15;
  repeated DockerObject attention = 16;
  DockerImageSupport image_operations = 17;
}

// GetDockerOverviewRequest identifies the servers whose counts are wanted.
message GetDockerOverviewRequest {
  // IDs or names, at most 32. Unset selects a lone server.
  repeated string server_ids = 1;
}

// GetDockerOverviewResponse lists the servers that answered and those that could not.
message GetDockerOverviewResponse {
  repeated DockerServerSummary server_summaries = 1;
  repeated DockerUnavailable unavailable = 2;
}

// DockerObjectFilter narrows a read across the selected servers.
message DockerObjectFilter {
  DockerLogRotationState log_rotation = 9;
  string search = 1;
  // Unset includes all lifecycle states.
  ContainerState state = 2;
  DockerOwnership ownership = 3;
  // The Engine's Compose project. With managed ownership, managed:<environment
  // ID> selects verified members regardless of their Engine project label.
  string compose_project = 4;
  // Includes every state except running. Use state for a single exact state.
  bool stopped = 5;
  bool needs_attention = 6;
  string driver = 7;
  // Images whose usage is still unknown stay visible under every state.
  DockerImageState image_state = 8;
}

// ListDockerObjectsRequest selects a page of objects.
message ListDockerObjectsRequest {
  repeated string server_ids = 1;
  DockerObjectKind kind = 2;
  DockerObjectFilter filter = 3;
  uint32 page_size = 4;
  string page_token = 5;
}

// ListDockerObjectsResponse is the page and the cursor for the remainder.
message ListDockerObjectsResponse {
  repeated DockerObject objects = 1;
  string next_page_token = 2;
  string snapshot = 3;
  repeated DockerUnavailable unavailable = 4;
}

// GetDockerObjectRequest identifies the instance to inspect.
message GetDockerObjectRequest {
  DockerObjectKey key = 1;
  // An optional exact name lets a missing ID point to the replacement, if any.
  string last_known_name = 2;
}

// GetDockerObjectResponse gives the requested object or the ID now using its name.
message GetDockerObjectResponse {
  DockerObject object = 1;
  DockerObjectKey replacement_key = 2;
}

// WatchDockerObjectsRequest selects the servers and visible IDs to watch.
message WatchDockerObjectsRequest {
  ListDockerObjectsRequest selection = 1;
  string after_snapshot = 2;
  repeated DockerObjectKey visible_keys = 3;
}

// DockerHealthUpdate changes one row without invalidating the inventory.
message DockerHealthUpdate {
  DockerObjectKey key = 1;
  DockerHealth health = 2;
  google.protobuf.Timestamp observed_at = 3;
}

// DockerWatchStatus describes live updates independently of snapshot reads.
message DockerWatchStatus {
  string server_id = 1;
  bool live = 2;
}

// WatchDockerObjectsResponse describes changes, samples or which reads need resync.
message WatchDockerObjectsResponse {
  string snapshot = 1;
  repeated DockerObjectKey changed_keys = 2;
  repeated DockerSample samples = 3;
  repeated DockerUnavailable unavailable = 4;
  bool resync = 5;
  repeated DockerHealthUpdate health_updates = 6;
  DockerWatchStatus watch_status = 7;
}

// DockerImageState distinguishes a live dependency from a tagged or dangling image.
enum DockerImageState {
  DOCKER_IMAGE_STATE_UNSPECIFIED = 0;
  DOCKER_IMAGE_STATE_USED = 1;
  DOCKER_IMAGE_STATE_UNUSED = 2;
  DOCKER_IMAGE_STATE_DANGLING = 3;
}

// DockerImage is the safe local projection of an image. History omits instructions,
// comments, tags and arbitrary metadata from the Engine's history endpoint.
message DockerImage {
  repeated string tags = 1;
  repeated string digests = 2;
  string platform = 3;
  optional uint64 total_bytes = 4;
  optional uint64 unique_bytes = 5;
  google.protobuf.Timestamp created_at = 6;
  DockerImageState state = 7;
  repeated DockerImageContainer containers = 8;
  repeated DockerImageDeployment deployments = 9;
  repeated DockerImageLayer layers = 10;
  repeated DockerImageHistory history = 11;
  bool details_truncated = 12;
  bool history_unavailable = 13;
}

// DockerImageContainer names a container instance holding the image.
message DockerImageContainer {
  DockerObjectKey key = 1;
  string name = 2;
}

// DockerImageLayer names a root filesystem layer in base-to-top order.
message DockerImageLayer {
  string diff_id = 1;
  optional uint64 size_bytes = 2;
}

// DockerImageDeployment names a revision that holds the image.
message DockerImageDeployment {
  string service_id = 1;
  string service_name = 2;
  int64 revision = 3;
}

// DockerImageHistory contains only the safe fields of an image history entry.
message DockerImageHistory {
  google.protobuf.Timestamp created_at = 1;
  optional uint64 size_bytes = 2;
}

// DockerCleanupFilters opts in to artifacts beyond the default review.
message DockerCleanupFilters {
  bool tagged_images = 1;
  bool networks = 2;
  // Include unused local volumes (anonymous and named) with per-volume protection checks.
  bool volumes = 3;
  // Optional kind filter. Empty previews every supported kind for the active flags.
  repeated DockerCleanupKind kinds = 4;
}

// PreviewDockerCleanupRequest selects the servers and artifact filters to read.
message PreviewDockerCleanupRequest {
  repeated string server_ids = 1;
  DockerCleanupFilters filters = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

// PreviewDockerCleanupResponse reports eligible and protected artifacts on one page.
message PreviewDockerCleanupResponse {
  repeated DockerCleanupTarget candidates = 1;
  repeated DockerCleanupTarget exclusions = 2;
  string snapshot = 3;
  repeated DockerUnavailable unavailable = 4;
  string next_page_token = 5;
  repeated DockerCleanupPause pauses = 6;
  repeated DockerCleanupServerLimits server_limits = 20;
  uint32 max_targets_total = 21;
}

// DockerCleanupServerLimits reports one server's cleanup capacity and supported kinds.
message DockerCleanupServerLimits {
  string server_id = 1;
  uint32 max_targets = 2;
  repeated DockerCleanupKind supported_kinds = 3;
}

// DockerCleanupPause identifies a cache incident that must be reviewed before enabling cleanup.
message DockerCleanupPause {
  string server_id = 1;
  string token = 2;
  DockerReceiptReason reason = 3;
}

// PlanDockerMaintenanceRequest names exact reviewed targets or the pause to clear.
message PlanDockerMaintenanceRequest {
  string summary = 1;
  repeated string server_ids = 2;
  string expected_snapshot = 3;
  oneof operation {
    DockerCleanupSelection cleanup = 10;
    string resume_cleanup_token = 11;
    DockerImageTag tag = 12;
    DockerImageLoad load = 13;
    DockerImageBuild build = 14;
    DockerImagePush push = 15;
    DockerImageExport export = 17;
    DockerImagePull pull = 18;
  }
}

// DockerCleanupSelection is the user's selection from a cleanup preview.
message DockerCleanupSelection {
  DockerCleanupFilters filters = 1;
  repeated DockerCleanupTarget targets = 2;
}

// PlanDockerMaintenanceResponse carries a standard reviewable change.
message PlanDockerMaintenanceResponse {
  Change change = 1;
  DockerImageDigestCheck digest_check = 2;
}

// DockerImageSupport describes image controls available from the connected Engine and agent.
message DockerImageSupport {
  string default_registry = 1;
  bool can_pull = 2;
  bool can_tag = 3;
  bool can_build = 4;
  bool can_import = 5;
  bool can_export = 6;
  bool can_push = 7;
}

// DockerImageDigestCheck compares a local binding with the native registry manifest.
message DockerImageDigestCheck {
  DockerRegistryDescriptor current = 1;
  DockerRegistryDescriptor candidate = 2;
  bool same_content = 3;
}

// DockerNetwork projects network facts without driver option values.
message DockerNetwork {
  string driver = 1;
  string scope = 2;
  optional bool ipv6_enabled = 3;
  bool internal = 4;
  repeated dockwell.resource.v1alpha1.NetworkIPAMPool pools = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated DockerNetworkEndpoint attachments = 7;
  optional uint32 attachment_count = 8;
  repeated string label_keys = 9;
  repeated string option_keys = 10;
  bool attachments_partial = 11;
  DockerStorageProtection protection = 12;
}

// DockerNetworkEndpoint identifies one attached container.
message DockerNetworkEndpoint {
  string container_id = 1;
  string name = 2;
  string ipv4 = 3;
  string ipv6 = 4;
  ContainerState state = 5;
}

// DockerVolume projects volume facts without arbitrary label or option values.
message DockerVolume {
  string driver = 1;
  string mountpoint = 2;
  optional uint64 size_bytes = 3;
  google.protobuf.Timestamp size_observed_at = 4;
  google.protobuf.Timestamp created_at = 5;
  repeated DockerVolumeAttachment attachments = 6;
  optional uint32 attachment_count = 7;
  repeated string label_keys = 8;
  repeated string option_keys = 9;
  bool anonymous = 10;
  bool attachments_partial = 11;
  DockerStorageProtection protection = 12;
}

// DockerVolumeAttachment identifies a container mount.
message DockerVolumeAttachment {
  string container_id = 1;
  string name = 2;
  string mount_target = 3;
  bool read_only = 4;
  ContainerState state = 5;
}

// DockerVolumeMountRef points to the volume at one container mount target.
message DockerVolumeMountRef {
  string mount_target = 1;
  DockerObjectKey volume_key = 2;
}

// DockerStorageProtection explains why a network or volume is protected.
enum DockerStorageProtection {
  DOCKER_STORAGE_PROTECTION_UNSPECIFIED = 0;
  DOCKER_STORAGE_PROTECTION_BUILT_IN = 1;
  DOCKER_STORAGE_PROTECTION_INFRASTRUCTURE = 2;
  DOCKER_STORAGE_PROTECTION_SHARED_LINK = 3;
  DOCKER_STORAGE_PROTECTION_RETAINED_VOLUME = 4;
}

// DockerNetworkCandidate describes a new network in an environment.
message DockerNetworkCandidate {
  string environment_id = 1;
  string name = 2;
  dockwell.resource.v1alpha1.Network spec = 3;
}

// CheckDockerNetworkRequest names the candidate and the Engines that would host it.
message CheckDockerNetworkRequest {
  repeated string server_ids = 1;
  DockerNetworkCandidate candidate = 2;
}

// CheckDockerNetworkResponse returns live conflicts and lists Engines that could not answer.
message CheckDockerNetworkResponse {
  repeated DockerNetworkFinding findings = 1;
  repeated DockerUnavailable unavailable = 2;
}

// DockerNetworkFinding identifies a rejected field and an optional conflict.
message DockerNetworkFinding {
  string server_id = 1;
  DockerNetworkCheckCode code = 2;
  string field_path = 3;
  string conflicting_network = 4;
  string conflicting_subnet = 5;
}

// DockerNetworkCheckCode identifies a field or Engine conflict that needs attention.
enum DockerNetworkCheckCode {
  DOCKER_NETWORK_CHECK_CODE_UNSPECIFIED = 0;
  DOCKER_NETWORK_CHECK_CODE_NAME_IN_USE = 1;
  DOCKER_NETWORK_CHECK_CODE_DRIVER_UNSUPPORTED = 2;
  DOCKER_NETWORK_CHECK_CODE_INVALID_POOL = 3;
  DOCKER_NETWORK_CHECK_CODE_INVALID_GATEWAY = 4;
  DOCKER_NETWORK_CHECK_CODE_SUBNET_OVERLAP = 5;
}

// PlanDockerNetworkAttachmentRequest identifies the workload revision and exact Engine objects.
message PlanDockerNetworkAttachmentRequest {
  DockerObjectKey network = 1;
  DockerObjectKey container = 2;
  int64 base_revision = 3;
  DockerNetworkAttachmentAction action = 4;
}

// PlanDockerNetworkAttachmentResponse returns the reviewed change for application.
message PlanDockerNetworkAttachmentResponse {
  Change change = 1;
}

// DockerArtifactKind is the operation for which bytes are staged.
enum DockerArtifactKind {
  DOCKER_ARTIFACT_KIND_UNSPECIFIED = 0;
  DOCKER_ARTIFACT_KIND_IMAGE_IMPORT = 1;
  DOCKER_ARTIFACT_KIND_BUILD_CONTEXT = 2;
  DOCKER_ARTIFACT_KIND_IMAGE_EXPORT = 3;
  DOCKER_ARTIFACT_KIND_DOCKERFILE = 4;
  DOCKER_ARTIFACT_KIND_PUSH_SOURCE = 5;
}

// DockerArtifactState is the current stage of a lease.
enum DockerArtifactState {
  DOCKER_ARTIFACT_STATE_UNSPECIFIED = 0;
  DOCKER_ARTIFACT_STATE_RECEIVING = 1;
  DOCKER_ARTIFACT_STATE_CHECKING = 2;
  DOCKER_ARTIFACT_STATE_READY = 3;
  DOCKER_ARTIFACT_STATE_EXPIRED = 4;
  DOCKER_ARTIFACT_STATE_ABORTED = 5;
  DOCKER_ARTIFACT_STATE_FAILED = 6;
}

// DockerArtifactInfo is the common lease state returned by each artifact operation.
message DockerArtifactInfo {
  string artifact_id = 1;
  DockerArtifactKind kind = 2;
  DockerArtifactState state = 3;
  uint64 size_bytes = 4;
  uint64 received_bytes = 5;
  string sha256 = 6;
  google.protobuf.Timestamp expires_at = 7;
  uint64 max_bytes = 8;
  repeated DockerArchiveImage images = 9;
  string file_name = 10;
  string committed_prefix_sha256 = 11;
  DockerImageReason failure = 12;
  DockerArtifactSpace failure_space = 13;
}

// DockerArtifactSpace gives the storage needed and available at a quota refusal.
message DockerArtifactSpace {
  uint64 required_bytes = 1;
  uint64 available_bytes = 2;
}

// DockerArchiveImage is the safe preview of one verified image in an archive.
message DockerArchiveImage {
  string image_id = 1;
  string platform = 2;
  repeated string proposed_tags = 3;
  uint64 size_bytes = 4;
}

// BeginDockerArtifactUploadRequest declares the kind and size to reserve.
message BeginDockerArtifactUploadRequest {
  string server_id = 1;
  DockerArtifactKind kind = 2;
  uint64 size_bytes = 3;
  string sha256 = 4;
  bool gzip = 5;
  string file_name = 6;
}

// ListDockerArtifactsRequest selects one server for the session's transfer list.
message ListDockerArtifactsRequest {
  string server_id = 1;
}

// ListDockerArtifactsResponse returns active leases for the current actor and session.
message ListDockerArtifactsResponse {
  repeated DockerArtifactInfo artifacts = 1;
}

// GetDockerArtifactRequest selects a lease on one server.
message GetDockerArtifactRequest {
  string server_id = 1;
  string artifact_id = 2;
}

// FinishDockerArtifactUploadRequest seals a complete upload.
message FinishDockerArtifactUploadRequest {
  string server_id = 1;
  string artifact_id = 2;
}

// AbortDockerArtifactRequest cancels a selected lease.
message AbortDockerArtifactRequest {
  string server_id = 1;
  string artifact_id = 2;
}

// UploadDockerArtifactRequest supplies an extent followed by its byte frames.
message UploadDockerArtifactRequest {
  string server_id = 1;
  string artifact_id = 2;
  uint64 offset = 3;
  google.api.HttpBody content = 4;
}

// DownloadDockerArtifactRequest selects an export and an optional byte extent.
message DownloadDockerArtifactRequest {
  string server_id = 1;
  string artifact_id = 2;
  uint64 offset = 3;
  uint64 length = 4;
}

// DownloadDockerArtifactResponse carries one frame of the sealed export.
message DownloadDockerArtifactResponse {
  google.api.HttpBody body = 1;
}

// DockerLogRotationState classifies the effective rotation of a container log.
enum DockerLogRotationState {
  DOCKER_LOG_ROTATION_STATE_UNSPECIFIED = 0;
  DOCKER_LOG_ROTATION_STATE_BOUNDED = 1;
  DOCKER_LOG_ROTATION_STATE_UNBOUNDED = 2;
  DOCKER_LOG_ROTATION_STATE_DRIVER_MANAGED = 3;
  DOCKER_LOG_ROTATION_STATE_UNKNOWN = 4;
}

// DockerSettings is the safe projection of one Engine and the groups Dockwell manages.
message DockerSettings {
  google.protobuf.Timestamp observed_at = 1;
  string engine_version = 2;
  string api_version = 3;
  string endpoint = 4;
  string mode = 5;
  string manager = 6;
  string source = 7;
  string data_root = 8;
  optional bool live_restore = 9;
  optional bool ipv6 = 10;
  string image_store = 11;
  repeated string mirrors = 12;
  repeated string insecure_entries = 13;
  dockwell.resource.v1alpha1.DockerDaemonLogging logging = 14;
  repeated dockwell.resource.v1alpha1.DockerAddressPool pools = 15;
  map<string, bool> known_features = 16;
  string editability_reason = 17;
  int64 managed_revision = 18;
  repeated DockerSettingSource provenance = 19;
  // Present on a separate logging summary read when all running workloads were checked.
  optional uint32 running_logging_mismatch = 20;
  string recovery_attention = 21;
  bool pending_file_review = 22;
}

// DockerSettingSource describes where a projected setting came from.
message DockerSettingSource {
  string field = 1;
  string source_kind = 2;
  string availability = 3;
}

// DockerSettingsFindingReason classifies a settings validation finding.
enum DockerSettingsFindingReason {
  DOCKER_SETTINGS_FINDING_REASON_UNSPECIFIED = 0;
  DOCKER_SETTINGS_FINDING_REASON_UNSUPPORTED = 1;
  DOCKER_SETTINGS_FINDING_REASON_INVALID = 2;
  DOCKER_SETTINGS_FINDING_REASON_CONFLICT = 3;
}

// DockerSettingsFinding identifies a setting that needs attention before review.
message DockerSettingsFinding {
  string field = 1;
  DockerSettingsFindingReason reason = 2;
  string detail = 3;
  bool review_current_file = 4;
}

// GetDockerSettingsRequest selects one server.
message GetDockerSettingsRequest {
  string server_id = 1;
  bool logging_summary = 2;
}

// GetDockerSettingsResponse returns the selected Engine settings.
message GetDockerSettingsResponse {
  DockerSettings settings = 1;
}

// CheckDockerSettingsRequest identifies the server and the candidate overlay.
message CheckDockerSettingsRequest {
  string server_id = 1;
  dockwell.resource.v1alpha1.DockerDaemon draft = 2;
}

// CheckDockerSettingsResponse reports validation findings or activation impact.
message CheckDockerSettingsResponse {
  repeated DockerSettingsFinding findings = 1;
  DockerDaemonImpact impact = 2;
  // In draft order, after validation.
  repeated DockerMirrorReachability mirror_reachability = 3;
}

// DockerMirrorReachability describes an anonymous HTTPS check from the agent.
enum DockerMirrorReachability {
  DOCKER_MIRROR_REACHABILITY_UNSPECIFIED = 0;
  DOCKER_MIRROR_REACHABILITY_REACHABLE = 1;
  DOCKER_MIRROR_REACHABILITY_UNREACHABLE = 2;
  DOCKER_MIRROR_REACHABILITY_NOT_CHECKED = 3;
}

// PlanDockerContainerLoggingRequest identifies the reviewed container, revision and policy.
message PlanDockerContainerLoggingRequest {
  DockerObjectKey container = 1;
  int64 base_revision = 2;
  dockwell.resource.v1alpha1.ContainerLogging logging = 3;
}

// PlanDockerContainerLoggingResponse returns a reviewed workload change.
message PlanDockerContainerLoggingResponse {
  Change change = 1;
}

// WatchDockerImageBuildRequest identifies the change on one server.
message WatchDockerImageBuildRequest {
  string server_id = 1;
  string change_id = 2;
  int64 after_line = 3;
}

// CancelDockerImageBuildRequest identifies the change on one server.
message CancelDockerImageBuildRequest {
  string server_id = 1;
  string change_id = 2;
}

syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/service.proto";
import "google/api/annotations.proto";

// ComposeService turns a Docker Compose file into a project's services,
// volumes and networks, and any of them back into one. Each file gets a
// project of its own, so two files with a service of one name run side by
// side, on networks of their own, as they do under docker compose. An
// environment is one Compose project: its containers carry the labels Docker
// Compose gives its own, so docker compose sees them, and an exported file
// runs the same with docker compose alone (PRD principle 6). See
// docs/adr/0021-the-docker-driver.md and docs/adr/0026-the-app-screens.md.
service ComposeService {
  // ImportCompose plans a Compose file into a project as a change, ready to
  // apply or discard, as ProposeChange does with edits. Each Compose service
  // becomes a service, and each named volume and network one of its own. A
  // field of the file that Dockwell can't run yet is refused, by name, rather
  // than dropped. The plan brings the project to life if it doesn't exist yet,
  // and importing into one that does shows as updates.
  rpc ImportCompose(ImportComposeRequest) returns (ImportComposeResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (google.api.http) = {
      post: "/v1/compose:import"
      body: "*"
    };
  }

  // CheckCompose reads a Compose file as ImportCompose would and says what
  // it would make, or why it can't, without planning anything or recording a
  // change, so a form can check a file as someone types it. It is a POST, as
  // a file doesn't fit in a URL.
  rpc CheckCompose(CheckComposeRequest) returns (CheckComposeResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (google.api.http) = {
      post: "/v1/compose:check"
      body: "*"
    };
  }

  // ExportCompose writes a Compose file of an environment, or of one service
  // with the volumes and networks it uses. It never includes a secret: an
  // environment variable whose value may hold one is listed by name, for
  // docker compose to take from the shell it runs in. The CLI prints the
  // file alone, so it pipes into docker compose -f -.
  rpc ExportCompose(ExportComposeRequest) returns (ExportComposeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (google.api.http) = {get: "/v1/compose"};
  }
}

// ImportComposeRequest is a Compose file to plan into a project.
message ImportComposeRequest {
  // What the change is for, such as "Run the shop's stack". Empty says it
  // came from a Compose file.
  string summary = 1;
  // The project it belongs to, by name or ID, such as "shop". One that doesn't
  // exist yet comes to life with the plan. Left out, the file's name: names
  // it. With neither, the file goes in the default project, only while that
  // has no apps: otherwise it is refused, as a service of the same name would
  // change the one that is there.
  string project = 2;
  // The environment, by name or ID. Leave it out while its project has
  // only one. A project the plan brings to life starts with this one, or
  // with production. A file exported from here goes back to the environment
  // it came from unless this names another of its project.
  string environment = 3;
  // The Compose file, as YAML, such as --compose "$(cat compose.yaml)", of
  // up to 256 KiB. A path relative to the file needs directory, as it runs on
  // servers where it otherwise means nothing.
  string compose = 4;
  // Values for the variables the file uses, such as ${TAG}. A variable
  // with no value here, in env or as a default in the file is refused. They
  // win over env, as a shell's win over an .env file.
  map<string, string> variables = 5;
  // Where the services, volumes and networks run, by server ID, as an
  // edit's servers. Empty keeps what exists where it runs, and puts what
  // is new on the only server; once there are several, name them.
  repeated string servers = 6;
  // Also deletes the environment's services and networks that aren't in
  // the file, as docker compose up --remove-orphans does. Volumes stay,
  // with their data; delete one on its own to remove it.
  bool remove_orphans = 7;
  // The .env file beside the Compose file, as its text, of up to 64 KiB, for
  // the variables the file uses. The CLI takes it as a file, --env-file .env,
  // as it may hold secrets. It reads as docker compose reads one, except that a
  // value naming a variable with no value is refused, rather than left blank. A
  // value for a secret the file's services use is refused, as any is.
  string env = 8 [(dockwell.resource.v1alpha1.sensitive) = true];
  // The directory the file is in on the servers, as an absolute path, such as
  // /opt/1panel/apps/postgresql/pg. A path relative to the file, such as
  // ./data, starts there. Each is a server path, which a person approves.
  string directory = 9;
}

// ImportComposeResponse carries the planned change.
message ImportComposeResponse {
  // The change, planned, with its plan.
  Change change = 1;
  // Where the file writes a variable's value in plain sight, which the plan's
  // notes say too. It lists 100 at most.
  repeated ExposedVariable exposed_variables = 2;
  // True when the file writes more than exposed_variables lists.
  bool more_exposed = 3;
}

// CheckComposeRequest is a Compose file to read.
message CheckComposeRequest {
  // The Compose file, as YAML, as ImportCompose takes it.
  string compose = 1;
  // Values for the variables the file uses, as ImportCompose takes them.
  map<string, string> variables = 2;
}

// CheckComposeResponse says what a Compose file would make, or why it can't.
message CheckComposeResponse {
  // Why ImportCompose would refuse the file, when it would: the first thing
  // in the way. Fix it and check again for the next. Unset when it would take
  // it. What it would refuse whatever its variables hold comes before a variable
  // with no value, so no one types a secret for a file it then refuses.
  ComposeRefusal refusal = 1;
  // The variables the file uses, whether or not the file can be read
  // further than that.
  repeated ComposeVariable variables = 2;
  // The services it would make, in the order it would make them, with
  // sensitive values blanked. Empty when it is refused.
  repeated ServiceInfo services = 3;
  // The volumes it would make, by name. Empty when it is refused.
  repeated string volumes = 4;
  // The networks it would make, by name. Empty when it is refused.
  repeated string networks = 5;
  // The project the file names for itself, for a form to fill in, whether or
  // not the file can be read further than that: its name:, or, for a file
  // exported from an environment here, that environment's project. Empty when
  // it names none, or names itself with a variable that has no value yet.
  string name = 6;
  // Where the file writes a variable's value in plain sight, whether or not one
  // is given, so a form can say so before anyone types a secret. It lists 100
  // at most.
  repeated ExposedVariable exposed_variables = 7;
  // True when the file writes more than exposed_variables lists.
  bool more_exposed = 8;
}

// ExposedVariable is a variable whose value a Compose file writes where anyone
// who can read what it makes sees it. Only what the schema marks sensitive is
// blanked, such as a service's environment values: a command, a label or a user
// isn't, as seeing them is useful and they rarely hold a secret. It counts every
// field but those docs/security/compose-variables.md lists as not recorded.
message ExposedVariable {
  // The variable, such as "REDIS_PASSWORD".
  string name = 1;
  // The service, volume or network whose spec holds its value, by kind and
  // name.
  ResourceRef resource = 2;
  // The field that holds it, as the file names it, such as "command", "labels",
  // "user", "healthcheck" or "driver_opts". "environment" is a list entry's
  // name, as a value there is blanked and a name isn't.
  string field = 3;
}

// ComposeRefusal is why a Compose file can't be imported.
message ComposeRefusal {
  // What is wrong and how to fix it, for people.
  string message = 1;
  // The line of the file it is about, from 1. 0 when it is about the file
  // as a whole.
  int32 line = 2;
  // The last line it is about, where it is about more than one, as a YAML parser
  // can't always tell which. Otherwise the same as line.
  int32 end_line = 3;
}

// ComposeVariable is a variable a Compose file uses, such as ${TAG}.
message ComposeVariable {
  // Its name, such as "TAG".
  string name = 1;
  // True when it needs a value, as the file gives it no default.
  bool required = 2;
}

// ExportComposeRequest names what to export.
message ExportComposeRequest {
  // The project of the environment, by name or ID. Leave it out while
  // there is only one project, or when environment is an ID.
  string project = 1;
  // The environment, by name or ID. Leave it out while its project has
  // only one.
  string environment = 2;
  // One service to export, by name, with the volumes and networks it uses.
  // Empty exports the whole environment.
  string service = 3;
}

// ExportComposeResponse is a Compose file.
message ExportComposeResponse {
  // The Compose file, as YAML. Its project name is the environment's
  // Compose project, so docker compose -f <file> ps lists what Dockwell
  // runs.
  string compose = 1;
  // What was left out as it may hold secrets. An environment variable's
  // value, as SERVICE.NAME, such as "web.API_KEY": set it in the shell, or
  // in an .env file beside the file, before docker compose up. A volume's
  // driver options, as "volumes.NAME.driver_opts": the file makes that
  // volume with none, so write them in by hand if it isn't on the server.
  repeated string omitted = 2;
}

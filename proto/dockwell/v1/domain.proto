syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// DomainService says where the domains of your routes stand: what each sends
// where, and whether its certificate is pending, issued or failed, with what
// to do when it failed. Change routes with ChangeService, as kind "route". See
// docs/adr/0024-the-caddy-ingress-driver.md.
service DomainService {
  option (dockwell.v1.nouns) = {
    name: "domains"
    help: "Where the domains of your routes stand: what each sends where, and whether its certificate is pending, issued or failed, with what to do when it failed. Change routes with ChangeService, as kind route. See docs/adr/0024-the-caddy-ingress-driver.md."
  };
  option (dockwell.v1.nouns) = {
    name: "certificates"
    help: "Certificates the control plane proves by DNS-01 through a DNS provider, and renews: for a wildcard, such as *.example.com, or for names the internet can't reach. Routes whose domains one covers, in the projects it serves, are served with it on any server, and its key goes to those servers alone. A certificate is install-wide: an admin makes it as a change, with a plan. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md."
  };
  option (dockwell.v1.nouns) = {
    name: "dns-providers"
    help: "What writes a DNS zone's records, so the control plane can prove a name by DNS-01 and get its certificate, behind NAT or for a wildcard. A provider is install-wide: an admin connects it as a change, with a plan. Its token stays on the control plane and goes to no server. CheckDnsProvider writes and deletes a TXT record without saving anything. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md."
  };
  option (dockwell.v1.nouns) = {
    name: "signin-providers"
    help: "OpenID Connect providers people sign in to private routes with, such as an Authentik you run, or Google. A provider is install-wide: an admin saves it as a change, with a plan, and decides which projects' routes may use it. CheckSigninProvider reads an issuer's discovery document without saving anything. See docs/adr/0087-private-routes.md."
  };
  // ListDomains returns the domains of the routes that exist now, sorted by
  // name, with each one's routes and where its certificate and DNS stand on
  // each server. A domain whose certificate is on its way answers over HTTPS
  // once it's issued; poll this to follow it.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/domains"};
  }

  // CheckDomain says what DNS says of a name now, against what's known of a
  // server, whether or not any route has the name yet, as adding a domain does.
  // Read it again to see a record arrive. It resolves the name through the
  // control server, so it needs a token that can make changes, a caller can
  // check 60 names a minute, and an answer that's a private address is only
  // shown when it's the server's own.
  rpc CheckDomain(CheckDomainRequest) returns (CheckDomainResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {
      post: "/v1/domains:check"
      body: "*"
    };
  }

  // ListCertificates returns the certificates the control plane proves by DNS-01,
  // sorted by name, with where each stands: issued and until when, on its way, or
  // failed in the provider's or the authority's own words, and when it's tried
  // again. A key is never returned. See
  // docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/certificates"};
  }

  // ListDnsProviders returns the DNS providers an admin connected, sorted by
  // name, with the zones each writes in, so a certificate can name one. A token
  // is never returned. Below an admin, it says each one's ID, name and zones. See
  // docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
  rpc ListDnsProviders(ListDnsProvidersRequest) returns (ListDnsProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/dnsProviders"};
  }

  // SyncDnsProvider reads, now, what Dockwell keeps at a DNS provider, as the drift
  // timer does every five minutes: each tunnel it wrote a rule in and each zone's
  // records it wrote, and marks what it finds. It changes nothing there. A read
  // already running, the timer's or another Sync's, is joined, not repeated, and
  // while Cloudflare says too many requests it waits for that to pass (#820). An
  // admin's, as a provider is install-wide.
  rpc SyncDnsProvider(SyncDnsProviderRequest) returns (SyncDnsProviderResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {post: "/v1/dnsProviders/{id}:sync"};
  }

  // CheckDnsProvider checks a DNS provider's token from the control plane, as a
  // certificate would use it, and saves nothing: with a token as typed, or a
  // saved provider's again. It lists the zones the token reaches, and in each
  // zone asked for writes a TXT record, _dockwell-check-<random>.<zone>, then
  // deletes it. An admin's, signed in, as a provider is install-wide.
  rpc CheckDnsProvider(CheckDnsProviderRequest) returns (CheckDnsProviderResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/dnsProviders:check"
      body: "*"
    };
  }
  // ListSigninProviders lists the providers people sign in to private routes with
  // (ADR 0087): an admin's, every provider with everything but its secret; below an
  // admin, those the caller's projects may use, by name and display name alone.
  rpc ListSigninProviders(ListSigninProvidersRequest) returns (ListSigninProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/signinProviders"};
  }
  // CheckSigninProvider reads an issuer's discovery document from the control
  // server, as saving a provider does, and saves nothing. It says what it found, or
  // why Dockwell can't sign people in with it: an issuer other than the one asked
  // for, an endpoint that isn't HTTPS, no authorization code flow, no PKCE with
  // S256, or no signing algorithm Dockwell takes. An admin's, signed in, as a
  // provider is install-wide. See docs/adr/0087-private-routes.md.
  rpc CheckSigninProvider(CheckSigninProviderRequest) returns (CheckSigninProviderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {get: "/v1/signinProviders:check"};
  }
}

// ListSigninProvidersRequest asks for the sign-in providers the caller may use.
message ListSigninProvidersRequest {
  // Only the providers this project's routes may use, by ID.
  string project = 1;
}

// ListSigninProvidersResponse lists sign-in providers.
message ListSigninProvidersResponse {
  repeated SigninProviderInfo providers = 1;
}

// SigninProviderInfo is a sign-in provider, without its secret.
message SigninProviderInfo {
  // Its ID, such as "sip_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // Its name, which a route names it by.
  string name = 2;
  // What the panel calls it.
  string display_name = 3;
  // Its issuer. Empty below an admin.
  string issuer = 4;
  // The client Dockwell is at the provider. Empty below an admin.
  string client_id = 5;
  // Whether it has a client secret, which is never shown. False below an admin.
  bool has_secret = 6;
  // What sign-in asks for beyond "openid email profile".
  repeated string scopes = 7;
  // The claim that lists someone's groups.
  string groups_claim = 8;
  // Whether every account at the provider is your team's.
  bool any_account = 9;
  // The projects whose routes may use it, by ID. Empty for every project.
  repeated string projects = 10;
  // Whether people sign in to Dockwell with it too (ADR 0095).
  bool panel = 11;
}

// CheckSigninProviderRequest is an issuer to read.
message CheckSigninProviderRequest {
  // The issuer, as typed: "auth.example.com" reads as https://auth.example.com.
  string issuer = 1;
}

// SigninProviderState is what reading an issuer's discovery document found.
enum SigninProviderState {
  SIGNIN_PROVIDER_STATE_UNSPECIFIED = 0;
  // Dockwell can sign people in with it.
  SIGNIN_PROVIDER_STATE_FOUND = 1;
  // Its discovery document couldn't be read: detail says why.
  SIGNIN_PROVIDER_STATE_UNREACHABLE = 2;
  // It answered, with what Dockwell can't sign people in with: detail says what.
  SIGNIN_PROVIDER_STATE_UNUSABLE = 3;
}

// CheckSigninProviderResponse says what an issuer's discovery document holds.
message CheckSigninProviderResponse {
  SigninProviderState state = 1;
  // The issuer as its document says it, which is what a provider saves.
  string issuer = 2;
  // The issuer's host, such as "auth.example.com".
  string host = 3;
  // The signing algorithms it uses that Dockwell takes, such as "ES256".
  repeated string algorithms = 4;
  // Why it can't be used, in a sentence, when it can't.
  string detail = 5;
  // Whether anyone can have an account there, as at Google's or Entra's common
  // issuer, so a route needs someone named.
  bool public = 6;
}

// ListCertificatesRequest asks for every certificate by DNS-01.
message ListCertificatesRequest {}

// ListCertificatesResponse holds the certificates by DNS-01.
message ListCertificatesResponse {
  // Sorted by name.
  repeated CertificateInfo certificates = 1;
}

// CertificateInfo is a certificate by DNS-01 and where it stands, without its key.
message CertificateInfo {
  // Its ID, crt_….
  string id = 1;
  // Its name.
  string name = 2;
  // The names it covers.
  repeated string domains = 3;
  // The DNS provider that proves them, by name.
  string dns_provider = 4;
  // Where it stands.
  CertificateState state = 5;
  // When the one issued expires, once one is.
  google.protobuf.Timestamp expire_time = 6;
  // For people, when the last try failed: the provider's or the authority's own
  // words, and what to do. A failed renewal leaves the one issued serving.
  string message = 7;
  // When it's tried again, while it's on its way or failing; when it renews,
  // once it's issued.
  google.protobuf.Timestamp next_time = 8;
}

// ListDnsProvidersRequest asks for every DNS provider the caller may see.
message ListDnsProvidersRequest {
  // A project's ID: with one, only the providers that serve it are listed, as a
  // domain in it can be published through those alone (ADR 0104). The caller
  // must be able to read the project.
  string project_id = 1;
}

// ListDnsProvidersResponse holds the DNS providers.
message ListDnsProvidersResponse {
  // Sorted by name.
  repeated DnsProviderInfo providers = 1;
}

// SyncDnsProviderRequest names the DNS provider to read now.
message SyncDnsProviderRequest {
  // The provider's ID.
  string id = 1;
}

// SyncDnsProviderResponse holds the provider as the read left it.
message SyncDnsProviderResponse {
  // With managed_records and read_at as of the read.
  DnsProviderInfo provider = 1;
}

// DnsProviderInfo is a DNS provider, without its token.
message DnsProviderInfo {
  // Its ID, dnp_….
  string id = 1;
  // Its name.
  string name = 2;
  // Which provider's API, such as "cloudflare".
  string provider = 3;
  // The zones it writes in.
  repeated string zones = 4;
  // Whether it holds a second token, for tunnels alone (ADR 0104).
  bool tunnel_api_token_set = 5;
  // Records made by hand that Dockwell replaced and keeps a copy of, which it
  // couldn't put back as the name held something else then. Put back on the
  // provider (DnsProvider.put_back) writes one again where its name is free.
  repeated KeptRecord kept = 6;
  // The projects whose routes it proves and publishes names for, by ID: an admin's
  // alone. A form that changes the provider sends them back, as an edit is the whole
  // spec.
  repeated string projects = 7;
  // The zones it set to Full (strict), and keeps so: an admin's alone. A form that
  // changes the provider sends them back, or the plan puts their mode back.
  repeated string strict_zones = 8;
  // How many DNS records Dockwell wrote and keeps at it, made or taken on, not
  // counting one still being written: an admin's alone (#820).
  int32 managed_records = 9;
  // When Dockwell last read what it keeps at it, as the drift timer or Sync now
  // does; unset before the first read: an admin's alone (#820).
  google.protobuf.Timestamp read_at = 10;
}

// KeptRecord is a copy of a record made by hand that Dockwell keeps (ADR 0104).
message KeptRecord {
  // Its ID, pending:…, as DnsProvider.put_back names it.
  string id = 1;
  // The name it was at, such as "vpn.example.com".
  string name = 2;
  // The record, in words, such as "CNAME elsewhere.example.net": an admin's alone.
  string record = 3;
  // When it was kept.
  google.protobuf.Timestamp kept_at = 4;
  // Whether nothing is at its name now, so putting it back writes it.
  bool name_free = 5;
}

// CheckDnsProviderRequest is a token to check, or a saved provider to check
// again.
message CheckDnsProviderRequest {
  // Which provider's API: "cloudflare". Unset when name says which.
  string provider = 1;
  // The token, as typed. Unset to check a saved provider's.
  string api_token = 2 [(dockwell.resource.v1alpha1.sensitive) = true];
  // The zones to write a record in. Empty lists the zones the token reaches and
  // writes in none.
  repeated string zones = 3;
  // A saved provider to check again, by name, with what it saved for anything
  // left unset here.
  string name = 4;
}

// CheckDnsProviderResponse says what the token may do.
message CheckDnsProviderResponse {
  // How the provider answered, taken together.
  DnsProviderState state = 1;
  // The zones the token reaches, sorted, which a form offers to pick from.
  repeated string reaches = 2;
  // For each zone asked for, whether a record could be written there.
  repeated DnsZoneCheck zones = 3;
  // The provider's own words, when it said no or couldn't be reached, in a line.
  string detail = 4;
  // Each thing the token can do, checked on its own from its own rights (ADR 0104).
  repeated ProviderCapability capabilities = 5;
  // How many tunnels the token may edit: Cloudflare Tunnel Edit covers every
  // tunnel in its account.
  int32 tunnels = 6;
  // The token holds a right that makes credentials, such as API Tokens Write, which
  // a token Dockwell holds shouldn't (ADR 0099).
  bool makes_tokens = 7;
}

// ProviderCapability is one thing a provider's token can do, checked on its own.
message ProviderCapability {
  // What it is.
  Capability capability = 1;
  // Whether the token has it.
  CapabilityState state = 2;
  // What's missing, in Cloudflare's words as its dashboard has them, such as "the
  // token lacks Cloudflare Tunnel edit".
  string detail = 3;
  // Where the person fixes it: Cloudflare's page for editing the token, or making
  // one.
  string fix_url = 4;
}

// Capability is one thing a provider's token can do (ADR 0104, section 6).
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  // Writes DNS in the zones asked for.
  CAPABILITY_DNS = 1 [(dockwell.v1.word) = "Can write DNS"];
  // Publishes through the account's tunnels.
  CAPABILITY_TUNNELS = 2 [(dockwell.v1.word) = "Can publish through tunnels"];
  // Reads each zone's SSL mode.
  CAPABILITY_ZONE_SETTINGS = 3 [(dockwell.v1.word) = "Reads zone settings"];
  // Reads its own rights, which is what makes the rest checkable.
  CAPABILITY_OWN_RIGHTS = 4 [(dockwell.v1.word) = "Checks its own rights"];
}

// CapabilityState is whether a token has a capability.
enum CapabilityState {
  CAPABILITY_STATE_UNSPECIFIED = 0;
  // Its rights say it has it.
  CAPABILITY_STATE_HAS = 1 [(dockwell.v1.word) = "Yes"];
  // Its rights say it doesn't.
  CAPABILITY_STATE_LACKS = 2 [(dockwell.v1.word) = "Missing"];
  // Its rights couldn't be read, so it isn't known: never taken as present.
  CAPABILITY_STATE_UNKNOWN = 3 [(dockwell.v1.word) = "Can't check"];
}

// DnsZoneCheck is what writing a record in one zone came to.
message DnsZoneCheck {
  // The zone, such as "example.com".
  string zone = 1;
  // Whether a record was written there, and deleted.
  bool writes = 2;
  // The provider's own words, when it couldn't.
  string detail = 3;
  // Its SSL/TLS mode at Cloudflare, such as "flexible", "full" or "strict", or
  // empty where it couldn't be read.
  string ssl_mode = 4;
  // The account that holds it: one token can reach zones in several.
  string account_id = 5;
}

// DnsProviderState is what a DNS provider said of a token.
enum DnsProviderState {
  DNS_PROVIDER_STATE_UNSPECIFIED = 0;
  // It wrote and deleted a record in every zone asked for.
  DNS_PROVIDER_STATE_WRITES = 1 [(dockwell.v1.word) = "Can write DNS"];
  // The provider refused the token, or it isn't an API token.
  DNS_PROVIDER_STATE_REFUSED = 2 [(dockwell.v1.word) = "Wrong token"];
  // The token is good, but couldn't write in a zone asked for, or reaches no
  // zone.
  DNS_PROVIDER_STATE_CANT_WRITE = 3 [(dockwell.v1.word) = "Can't write DNS"];
  // The provider couldn't be reached, or didn't answer in time.
  DNS_PROVIDER_STATE_UNREACHABLE = 4 [(dockwell.v1.word) = "Can't reach the provider"];
  // The token is good and reaches these zones; no zone was asked for, so
  // nothing was written.
  DNS_PROVIDER_STATE_REACHES = 5 [(dockwell.v1.word) = "Token works"];
}

// CheckDomainRequest names a domain and the server it's meant to reach.
message CheckDomainRequest {
  // The server, by ID.
  string server_id = 1;
  // The domain, such as "app.example.com".
  string domain = 2;
  // The project it's for, by ID, so a shared wildcard certificate that serves that
  // project counts as covering the domain's companion. Empty for one not made yet.
  string project_id = 3;
  // The way the person picked, to check that way. Unset, the check picks the
  // default and says why (ADR 0104).
  dockwell.resource.v1alpha1.RoutePublish publish = 4;
}

// CheckDomainResponse says what DNS says of it.
message CheckDomainResponse {
  // What DNS says, as the control plane reads it.
  DomainCheck check = 1;
  // The domain's other half, which a site is also expected to answer on: its
  // www name for a registered domain, such as "www.example.co.uk" for
  // "example.co.uk", or the registered domain for its www name. Empty for any
  // other name, such as "blog.example.com" (ADR 0070).
  string companion = 2;
  // Where the companion stands. Unset when there's no companion.
  CompanionCheck companion_check = 3;
  // What Cloudflare holds at the name, and the ways in, where a connected DNS
  // provider's zone holds it for the project, or, for an admin who names no project,
  // as for a new website whose plan adds its project to the provider, where any
  // provider's zone holds it. Unset otherwise (ADR 0104).
  CloudflareCheck cloudflare = 4;
}

// CloudflareCheck is what a connected Cloudflare zone, and the server's tunnel, say
// of a name, before any plan (ADR 0104, section 1). Below an admin it says only
// whether the name is taken: a record's content is the origin address public DNS
// hides.
message CloudflareCheck {
  // The connected zone that holds the name, such as "example.com".
  string zone = 1;
  // The DNS provider that writes it, by name.
  string provider = 2;
  // What's at the name.
  CloudflareName state = 3;
  // The record there, in words, such as "A 203.0.113.9": an admin's alone.
  string record = 4;
  // That record's ID, to agree to replace or take on: an admin's alone.
  string record_id = 5;
  // Every type at the name, such as "TXT" and "MX", which a CNAME sits beside: an
  // admin's alone.
  repeated string types = 6;
  // The way the check would take, unless the person picks another.
  dockwell.resource.v1alpha1.RouteWay way = 7;
  // Each way, with why one can't be taken and what fixes it.
  repeated WayOption ways = 8;
  // The zone's SSL mode, such as "flexible".
  string ssl_mode = 9;
  // When checks read Cloudflare again, while it asks Dockwell to wait (state
  // CLOUDFLARE_NAME_WAITING).
  google.protobuf.Timestamp checks_again = 10;
  // The tunnel's rule made by hand that serves the name now, when one does: an
  // admin's alone, so Take it on or Move it to Dockwell can name it in the route's
  // takes_over (ADR 0104, section 8). Unset below an admin.
  HandRule hand_rule = 11;
}

// HandRule is a tunnel's rule made in Cloudflare by hand that serves a name.
message HandRule {
  // The tunnel holding it, by ID.
  string tunnel = 1;
  // The tunnel's name, such as "web-1".
  string tunnel_name = 2;
  // The rule's hostname, such as "wiki.example.com".
  string hostname = 3;
  // The rule's path, if it has one.
  string path = 4;
  // Where it sends, such as "http://127.0.0.1:8080".
  string service = 5;
  // Whether it reaches the server's proxy already, so taking it on writes nothing;
  // false where it reaches an app's own port, so Move it to Dockwell points it at
  // the proxy.
  bool reaches_proxy = 6;
}

// CloudflareName is what Cloudflare holds at a name.
enum CloudflareName {
  CLOUDFLARE_NAME_UNSPECIFIED = 0;
  // Nothing that stops a domain: free, or only records a CNAME sits beside.
  CLOUDFLARE_NAME_FREE = 1 [(dockwell.v1.word) = "Free at Cloudflare"];
  // An A, AAAA or CNAME someone else made, which an admin may replace.
  CLOUDFLARE_NAME_TAKEN = 2 [(dockwell.v1.word) = "Taken at Cloudflare"];
  // Records Dockwell wrote for this route already.
  CLOUDFLARE_NAME_OURS = 3 [(dockwell.v1.word) = "Already published"];
  // Two labels or more below the zone, past Cloudflare's free certificate, so the
  // tunnel and the proxy can't serve it over HTTPS.
  CLOUDFLARE_NAME_PAST_CERTIFICATE = 4 [(dockwell.v1.word) = "Past Cloudflare's free certificate"];
  // The record there points at this tunnel or server already, made by hand: an
  // admin may take it on.
  CLOUDFLARE_NAME_TAKE_ON = 5 [(dockwell.v1.word) = "Made in Cloudflare"];
  // Cloudflare answered too many requests, so checks read nothing until
  // checks_again, leaving the token's rate to renewals and plans.
  CLOUDFLARE_NAME_WAITING = 6 [(dockwell.v1.word) = "Cloudflare asked Dockwell to wait"];
}

// WayOption is one way in for a domain, and whether it can be taken now.
message WayOption {
  // The way.
  dockwell.resource.v1alpha1.RouteWay way = 1;
  // The tunnel, by ID, for a tunnel's way.
  string tunnel = 2;
  // The tunnel's name, such as "web-1".
  string tunnel_name = 3;
  // Why it can't be taken now, as a state, such as "hz-1's tunnel is managed in a
  // file, so Dockwell writes nothing at Cloudflare". Empty when it can.
  string off = 4;
  // What fixes it, such as "Add it to this token". Empty when nothing here does.
  string action = 5;
  // Where that action goes, such as Cloudflare's page for editing the token.
  string action_url = 6;
  // The rule the tunnel needs first, such as "*.example.com", added once per zone.
  // Empty when a rule there reaches the server's proxy already.
  string adds_rule = 7;
  // The rule that catches the name first, when another does, such as
  // "*.example.com, to http://127.0.0.1:8080": an admin's alone.
  string caught_by = 8;
  // Where the server's tunnel reaches its proxy, such as "http://127.0.0.1:80", for
  // a server tunnel's option, as the agent found its run.
  string reaches = 9;
}

// CompanionCheck is where a domain's companion stands: what DNS says of it, whether
// another environment serves it already, and whether a wildcard covers it.
message CompanionCheck {
  // What DNS says of it, as the control plane reads it.
  DomainCheck check = 1;
  // It answers as the domain does: both point at the server, or both point at the
  // same addresses elsewhere, as behind a tunnel or Cloudflare's proxy.
  bool answers_alike = 2;
  // The environment that serves it already, by ID. Empty when none does, or when
  // it's in a project the caller can't read.
  string held_by_environment_id = 3;
  // The project that serves it already, by name, such as "shop", or "another
  // project" for one the caller can't read. Empty when none does.
  string held_by = 4;
  // The shared wildcard certificate that covers it, by name, such as
  // "example-com", so it needs no certificate of its own (ADR 0088). Empty when
  // none does.
  string wildcard = 5;
  // What serves it there, in words, such as "the app web", "a redirect to
  // example.org" or "port 3000 on the server". Empty when none does, or when it's
  // in a project the caller can't read.
  string held_for = 6;
}

// ListDomainsRequest says which domains to return.
message ListDomainsRequest {
  // Only domains with a route in this environment, by ID. Empty means every
  // environment.
  string environment = 1;
  // Only domains with a route to this service, by name. It needs environment,
  // as a service's name is unique only in its environment.
  string service = 2;
  // Read what DNS says of each domain now, in Domain.dns: from its connected
  // zone's records, read once per zone, or from public DNS for a name in no
  // connected zone. Each read is cached, so a page that opens costs a zone list,
  // never a check per domain (ADR 0104, #791).
  bool read_dns = 3;
}

// ListDomainsResponse lists domains.
message ListDomainsResponse {
  // The domains, sorted by name.
  repeated Domain domains = 1;
}

// Domain is one domain the routes of an environment serve.
message Domain {
  // The domain, such as "app.example.com".
  string name = 1;
  // The environment that holds it, by ID. A domain lives in one environment.
  string environment_id = 2;
  // Where it answers, such as "https://app.example.com". A domain whose routes
  // take no certificate reads "http://app.example.com", which is what this server
  // serves, and whatever ends TLS in front of it may answer HTTPS too.
  string url = 3;
  // Its routes, by path.
  repeated DomainRoute routes = 4;
  // Where it stands on each server its routes run on.
  repeated DomainServer servers = 5;
  // What Dockwell published for it at Cloudflare, and whether it's still there
  // (ADR 0104). Empty for a domain published by hand, or not at all.
  repeated DomainPublished published = 6;
  // What DNS says of it now, where the list was asked to read it (read_dns). Below
  // an admin it says nothing of a proxied record's content, the origin address
  // public DNS hides. Unset otherwise.
  DomainCheck dns = 7;
}

// DomainPublished is one name Dockwell published at Cloudflare, as the drift timer
// last read it.
message DomainPublished {
  // The name, such as "wiki.example.com", or its companion.
  string name = 1;
  // The way in.
  dockwell.resource.v1alpha1.RouteWay way = 2;
  // The tunnel's name, for a tunnel's way.
  string tunnel = 3;
  // Its DNS record, in words, such as "CNAME to web-1's tunnel, proxied".
  string record = 4;
  // Where it stands.
  PublishedState state = 5;
  // When it was taken on, for a record or rule made in Cloudflare and taken on.
  google.protobuf.Timestamp taken_on = 6;
}

// PublishedState is where a name Dockwell published stands at Cloudflare.
enum PublishedState {
  PUBLISHED_STATE_UNSPECIFIED = 0;
  // Its record and the tunnel's rule are there, as written.
  PUBLISHED_STATE_PUBLISHED = 1 [(dockwell.v1.word) = "Published"];
  // The tunnel's rule that served it is gone.
  PUBLISHED_STATE_GONE_FROM_TUNNEL = 2 [(dockwell.v1.word) = "Not in the tunnel any more"];
  // Its DNS record is gone.
  PUBLISHED_STATE_RECORD_GONE = 3 [(dockwell.v1.word) = "Its DNS record is gone at Cloudflare"];
  // Its record was changed in Cloudflare since Dockwell wrote it, so removal leaves
  // it.
  PUBLISHED_STATE_CHANGED = 4 [(dockwell.v1.word) = "Changed in Cloudflare"];
  // Its tunnel runs on more than the route's server now.
  PUBLISHED_STATE_TUNNEL_SHARED = 5 [(dockwell.v1.word) = "Its tunnel runs on another server too"];
  // Made in Cloudflare by hand, pointing at this tunnel or server: Manage in
  // Dockwell takes it on.
  PUBLISHED_STATE_CAN_TAKE_ON = 6 [(dockwell.v1.word) = "Made in Cloudflare"];
  // A tunnel's rule made by hand that points at the app's own port: Move it to
  // Dockwell sends it through the server's proxy.
  PUBLISHED_STATE_CAN_MOVE = 7 [(dockwell.v1.word) = "Points at the app's own port"];
  // The tunnel that served it was deleted in Cloudflare.
  PUBLISHED_STATE_TUNNEL_DELETED = 8 [(dockwell.v1.word) = "Its tunnel was deleted in Cloudflare"];
  // Dockwell can't read it: its DNS provider isn't connected, or Cloudflare refuses
  // the token.
  PUBLISHED_STATE_UNREADABLE = 9 [(dockwell.v1.word) = "Dockwell can't read it at Cloudflare"];
  // Dockwell can't prove its tunnel runs on the route's server alone: run more than
  // once there in ways that disagree, or not connected.
  PUBLISHED_STATE_TUNNEL_UNPROVEN = 10 [(dockwell.v1.word) = "Dockwell can't prove its tunnel runs on this server"];
}

// DomainRoute is one route of a domain.
message DomainRoute {
  // The route's ID.
  string id = 1;
  // The route's name, unique in its environment.
  string name = 2;
  // The path it covers. Empty covers the whole domain.
  string path = 3;
  // The service it sends to, by name. Empty when host_port is set.
  string service = 4;
  // The service's port it sends to. Empty when host_port is set.
  uint32 port = 5;
  // Where it answers, such as "https://app.example.com/api".
  string url = 6;
  // "off" when TLS ends before this server, as Route.tls says.
  string tls = 7;
  // The port on the server itself it sends to, in place of a service's.
  uint32 host_port = 8;
  // True when a route with tls off answers anyone who can reach the server, as
  // Route.plain_for_anyone says.
  bool plain_for_anyone = 9;
  // True while it answers that the app isn't open yet, as Route.held says (ADR 0084).
  bool held = 80;
  // The proxies in front it believes, as Route.trusted_proxies names them, so what
  // reads a route has all of it.
  repeated string trusted_proxies = 81;
  // When its setup link stops working, in Unix seconds, while it's held and has
  // one; 0 otherwise. Never the link's key, nor its hash (ADR 0105).
  int64 setup_until = 114;
  // Who it lets in, as addresses and ranges, as Route.access says: anyone else
  // gets 403. Empty lets in everyone it answers (ADR 0087).
  repeated string allow = 110;
  // Who may sign in to it with a password, by name, in its order. A password,
  // or its hash, is never shown: an edit that names a user with no password
  // keeps theirs.
  repeated string users = 111;
  // How people sign in to it with a provider, if they do: the provider by name and
  // who may, with nothing of the provider's own, which the control plane fills in as
  // it plans (ADR 0087).
  dockwell.resource.v1alpha1.RouteSignIn sign_in = 112;
  // Where it redirects, for a route that answers with a redirect in place of a
  // service (ADR 0070). Unset for any other route.
  dockwell.resource.v1alpha1.RouteRedirect redirect = 10;
  // How its domain is published at Cloudflare, as the route's spec has it (ADR
  // 0104). A form that sends the route as it is sends this back, or the plan takes
  // the domain's records away.
  dockwell.resource.v1alpha1.RoutePublish publish = 113;
  // How its domain proves itself for its certificate, as the route's spec has it
  // (ADR 0088): a form that sends the route as it is sends this back.
  string proof = 120;
}

// DomainServer is where a domain stands on one server.
message DomainServer {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // Where the certificate and DNS stand, as the server last said. Unset until
  // it has said.
  DomainStatus status = 3;
  // True when the server isn't connected, so status is what it last said.
  bool stale = 4;
  // Where the server's ingress stands, as it last said. A domain with an issued
  // certificate still doesn't answer while problem is set here.
  IngressStatus ingress = 5;
  // True when a route of the domain redirects, and the server's agent, as it
  // last connected, is too old to serve a redirect, as after a downgrade: the
  // redirect isn't served there until its agent is updated (ADR 0070).
  bool redirect_unserved = 10;
}

// IngressStatus is where a server's ingress stands, on a server with routes.
message IngressStatus {
  // The proxy, such as "Caddy".
  string proxy = 1;
  // True when the proxy runs.
  bool running = 2;
  // Why its routes aren't being served. Unset while they are.
  IngressProblem problem = 3;
  // For people: what is wrong, what follows, and how to fix it. Empty while
  // nothing is.
  string message = 4;
  // What holds the proxy's ports, by name, for PORTS_TAKEN: containers, where
  // they are in one, so a client can offer what to do about each.
  repeated string holders = 5;
  // The version the proxy runs, such as "2.11.7-alpine". Empty when the server
  // can't say.
  string version = 6;
  // The version this server's Dockwell pins.
  string pinned_version = 7;
  // True when the proxy isn't the version this server's Dockwell pins. It may
  // be missing security fixes, and moves on the server's next route change.
  bool outdated = 8;
}

// IngressProblem is why a server's routes aren't being served.
enum IngressProblem {
  INGRESS_PROBLEM_UNSPECIFIED = 0;
  // Something else holds port 80 or 443, so the proxy can't start, as after a
  // reboot brings back another proxy that was stopped for it.
  INGRESS_PROBLEM_PORTS_TAKEN = 1;
  // The ingress network has gone, and another network has its subnet, so the
  // routes could reach that network's containers. Each answers 503 until the
  // network is back.
  INGRESS_PROBLEM_SUBNET_TAKEN = 2;
  // The proxy isn't running, for any other reason.
  INGRESS_PROBLEM_NOT_RUNNING = 3;
}

// DomainStatus is where one domain's certificate and DNS stand on a server.
message DomainStatus {
  // The domain.
  string domain = 1;
  // Its certificate.
  Certificate certificate = 2;
  // What DNS says of it.
  DomainCheck dns = 3;
  // What a stranger gets from each of its routes that keeps anyone out, by path,
  // as the server last asked them (ADR 0087).
  repeated StrangerCheck strangers = 110;
}

// StrangerCheck is what a stranger gets from a private route, as its server asks
// it about once a minute, and at once after a change: from the server itself,
// with no password, as an address no list names. A request from there can't be
// told apart from a stranger's where the server is on the route's list, or where
// the route answers only proxies the server isn't.
message StrangerCheck {
  // The route's path. Empty is the whole domain.
  string path = 1;
  // What came of it.
  StrangerOutcome outcome = 2;
  // The HTTP status it answered with, such as 403, or 0 when nothing answered
  // or the server can't tell.
  uint32 status = 3;
  // What it said, in a line, such as "403 Forbidden", or why the server can't
  // tell, for people.
  string said = 4;
}

// StrangerOutcome is what a stranger gets from a private route.
enum StrangerOutcome {
  // Not asked yet.
  STRANGER_OUTCOME_UNSPECIFIED = 0;
  // 403: kept out, with nothing else said.
  STRANGER_OUTCOME_KEPT_OUT = 1;
  // 401: asked for a name and password.
  STRANGER_OUTCOME_ASKED_FOR_PASSWORD = 2;
  // Anything below 400: let in, which a private route shouldn't.
  STRANGER_OUTCOME_LET_IN = 3;
  // Another answer, such as a 502 from an app that's down, or none at all.
  STRANGER_OUTCOME_OTHER = 4;
  // The server can't tell what a stranger gets from where it asks: said says
  // why.
  STRANGER_OUTCOME_CANT_TELL = 5;
  // A redirect to the provider's own origin: a stranger is sent to sign in there,
  // and said names the provider's host.
  STRANGER_OUTCOME_SENT_TO_SIGN_IN = 6;
}

// Certificate is where a domain's certificate stands on a server.
message Certificate {
  // Where it stands.
  CertificateState state = 1;
  // Why it failed, or why renewing it is failing while an issued one still
  // serves. Unset otherwise.
  CertificateProblem problem = 2;
  // For people: what is happening or what went wrong, what follows, and how
  // to fix it. Dockwell keeps trying a failed certificate by itself.
  string message = 3;
  // When an issued certificate expires. Renewing it is automatic.
  google.protobuf.Timestamp expire_time = 4;
  // The certificate by DNS-01 that serves it, by name, when one does (ADR 0088).
  // Unset for one Caddy got over HTTP. Numbered in the block DNS-01 holds, 120 to
  // 129.
  string by_dns = 120;
}

// CertificateState is where a domain's certificate stands.
enum CertificateState {
  // Not known yet.
  CERTIFICATE_STATE_UNSPECIFIED = 0;
  // On its way: the domain doesn't answer over HTTPS yet.
  CERTIFICATE_STATE_PENDING = 1;
  // On the server, and serving.
  CERTIFICATE_STATE_ISSUED = 2;
  // The last try failed. Dockwell tries again by itself, and at once when the
  // domain's DNS starts pointing here.
  CERTIFICATE_STATE_FAILED = 3;
  // None, as TLS ends before this server: its routes say tls off, so it has no
  // certificate here, and none is asked for.
  CERTIFICATE_STATE_NONE = 4;
}

// CertificateProblem is why a certificate failed.
enum CertificateProblem {
  CERTIFICATE_PROBLEM_UNSPECIFIED = 0;
  // DNS has no record for the domain, or didn't answer.
  CERTIFICATE_PROBLEM_DNS = 1;
  // The certificate authority couldn't reach port 80 or 443 on the server,
  // as when a firewall blocks them.
  CERTIFICATE_PROBLEM_CONNECTION = 2;
  // Something other than this server answered for the domain, as when DNS
  // points elsewhere or a CDN is in front.
  CERTIFICATE_PROBLEM_WRONG_SERVER = 3;
  // The certificate authority's rate limit was hit.
  CERTIFICATE_PROBLEM_RATE_LIMITED = 4;
  // A CAA record forbids this certificate authority.
  CERTIFICATE_PROBLEM_CAA = 5;
  // The certificate authority won't issue for this name.
  CERTIFICATE_PROBLEM_REFUSED = 6;
  // Anything else; the message has the certificate authority's words.
  CERTIFICATE_PROBLEM_OTHER = 7;
  // The server couldn't reach the certificate authority at all, as when its
  // own resolver or outbound network fails. Nothing is known of the domain.
  CERTIFICATE_PROBLEM_CANT_REACH_CA = 8;
}

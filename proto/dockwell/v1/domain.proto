syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// DomainService says where the domains of your routes stand: what each sends
// where, and whether its certificate is pending, issued or failed, with what
// to do when it failed. Change routes with ChangeService, as kind "route". See
// docs/adr/0024-the-caddy-ingress-driver.md.
service DomainService {
  option (dockwell.v1.nouns) = {
    name: "domains"
    help: "Where the domains of your routes stand: what each sends where, and whether its certificate is pending, issued or failed, with what to do when it failed. Change routes with ChangeService, as kind route. See docs/adr/0024-the-caddy-ingress-driver.md."
  };
  option (dockwell.v1.nouns) = {
    name: "certificates"
    help: "Certificates the control plane proves by DNS-01 through a DNS provider, and renews: for a wildcard, such as *.example.com, or for names the internet can't reach. Routes whose domains one covers, in the projects it serves, are served with it on any server, and its key goes to those servers alone. A certificate is install-wide: an admin makes it as a change, with a plan. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md."
  };
  option (dockwell.v1.nouns) = {
    name: "dns-providers"
    help: "What writes a DNS zone's records, so the control plane can prove a name by DNS-01 and get its certificate, behind NAT or for a wildcard. A provider is install-wide: an admin connects it as a change, with a plan. Its token stays on the control plane and goes to no server. CheckDnsProvider writes and deletes a TXT record without saving anything. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md."
  };
  // ListDomains returns the domains of the routes that exist now, sorted by
  // name, with each one's routes and where its certificate and DNS stand on
  // each server. A domain whose certificate is on its way answers over HTTPS
  // once it's issued; poll this to follow it.
  rpc ListDomains(ListDomainsRequest) returns (ListDomainsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/domains"};
  }

  // CheckDomain says what DNS says of a name now, against what's known of a
  // server, whether or not any route has the name yet, as adding a domain does.
  // Read it again to see a record arrive. It resolves the name through the
  // control server, so it needs a token that can make changes, a caller can
  // check 60 names a minute, and an answer that's a private address is only
  // shown when it's the server's own.
  rpc CheckDomain(CheckDomainRequest) returns (CheckDomainResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {
      post: "/v1/domains:check"
      body: "*"
    };
  }

  // ListCertificates returns the certificates the control plane proves by DNS-01,
  // sorted by name, with where each stands: issued and until when, on its way, or
  // failed in the provider's or the authority's own words, and when it's tried
  // again. A key is never returned. See
  // docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
  rpc ListCertificates(ListCertificatesRequest) returns (ListCertificatesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/certificates"};
  }

  // ListDnsProviders returns the DNS providers an admin connected, sorted by
  // name, with the zones each writes in, so a certificate can name one. A token
  // is never returned. Below an admin, it says each one's ID, name and zones. See
  // docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
  rpc ListDnsProviders(ListDnsProvidersRequest) returns (ListDnsProvidersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/dnsProviders"};
  }

  // CheckDnsProvider checks a DNS provider's token from the control plane, as a
  // certificate would use it, and saves nothing: with a token as typed, or a
  // saved provider's again. It lists the zones the token reaches, and in each
  // zone asked for writes a TXT record, _dockwell-check-<random>.<zone>, then
  // deletes it. An admin's, signed in, as a provider is install-wide.
  rpc CheckDnsProvider(CheckDnsProviderRequest) returns (CheckDnsProviderResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/dnsProviders:check"
      body: "*"
    };
  }
}

// ListCertificatesRequest asks for every certificate by DNS-01.
message ListCertificatesRequest {}

// ListCertificatesResponse holds the certificates by DNS-01.
message ListCertificatesResponse {
  // Sorted by name.
  repeated CertificateInfo certificates = 1;
}

// CertificateInfo is a certificate by DNS-01 and where it stands, without its key.
message CertificateInfo {
  // Its ID, crt_….
  string id = 1;
  // Its name.
  string name = 2;
  // The names it covers.
  repeated string domains = 3;
  // The DNS provider that proves them, by name.
  string dns_provider = 4;
  // Where it stands.
  CertificateState state = 5;
  // When the one issued expires, once one is.
  google.protobuf.Timestamp expire_time = 6;
  // For people, when the last try failed: the provider's or the authority's own
  // words, and what to do. A failed renewal leaves the one issued serving.
  string message = 7;
  // When it's tried again, while it's on its way or failing; when it renews,
  // once it's issued.
  google.protobuf.Timestamp next_time = 8;
}

// ListDnsProvidersRequest asks for every DNS provider the caller may see.
message ListDnsProvidersRequest {}

// ListDnsProvidersResponse holds the DNS providers.
message ListDnsProvidersResponse {
  // Sorted by name.
  repeated DnsProviderInfo providers = 1;
}

// DnsProviderInfo is a DNS provider, without its token.
message DnsProviderInfo {
  // Its ID, dnp_….
  string id = 1;
  // Its name.
  string name = 2;
  // Which provider's API, such as "cloudflare".
  string provider = 3;
  // The zones it writes in.
  repeated string zones = 4;
}

// CheckDnsProviderRequest is a token to check, or a saved provider to check
// again.
message CheckDnsProviderRequest {
  // Which provider's API: "cloudflare". Unset when name says which.
  string provider = 1;
  // The token, as typed. Unset to check a saved provider's.
  string api_token = 2 [(dockwell.resource.v1alpha1.sensitive) = true];
  // The zones to write a record in. Empty lists the zones the token reaches and
  // writes in none.
  repeated string zones = 3;
  // A saved provider to check again, by name, with what it saved for anything
  // left unset here.
  string name = 4;
}

// CheckDnsProviderResponse says what the token may do.
message CheckDnsProviderResponse {
  // How the provider answered, taken together.
  DnsProviderState state = 1;
  // The zones the token reaches, sorted, which a form offers to pick from.
  repeated string reaches = 2;
  // For each zone asked for, whether a record could be written there.
  repeated DnsZoneCheck zones = 3;
  // The provider's own words, when it said no or couldn't be reached, in a line.
  string detail = 4;
}

// DnsZoneCheck is what writing a record in one zone came to.
message DnsZoneCheck {
  // The zone, such as "example.com".
  string zone = 1;
  // Whether a record was written there, and deleted.
  bool writes = 2;
  // The provider's own words, when it couldn't.
  string detail = 3;
}

// DnsProviderState is what a DNS provider said of a token.
enum DnsProviderState {
  DNS_PROVIDER_STATE_UNSPECIFIED = 0;
  // It wrote and deleted a record in every zone asked for.
  DNS_PROVIDER_STATE_WRITES = 1 [(dockwell.v1.word) = "Can write DNS"];
  // The provider refused the token, or it isn't an API token.
  DNS_PROVIDER_STATE_REFUSED = 2 [(dockwell.v1.word) = "Wrong token"];
  // The token is good, but couldn't write in a zone asked for, or reaches no
  // zone.
  DNS_PROVIDER_STATE_CANT_WRITE = 3 [(dockwell.v1.word) = "Can't write DNS"];
  // The provider couldn't be reached, or didn't answer in time.
  DNS_PROVIDER_STATE_UNREACHABLE = 4 [(dockwell.v1.word) = "Can't reach the provider"];
  // The token is good and reaches these zones; no zone was asked for, so
  // nothing was written.
  DNS_PROVIDER_STATE_REACHES = 5 [(dockwell.v1.word) = "Token works"];
}

// CheckDomainRequest names a domain and the server it's meant to reach.
message CheckDomainRequest {
  // The server, by ID.
  string server_id = 1;
  // The domain, such as "app.example.com".
  string domain = 2;
}

// CheckDomainResponse says what DNS says of it.
message CheckDomainResponse {
  // What DNS says, as the control plane reads it.
  DomainCheck check = 1;
}

// ListDomainsRequest says which domains to return.
message ListDomainsRequest {
  // Only domains with a route in this environment, by ID. Empty means every
  // environment.
  string environment = 1;
  // Only domains with a route to this service, by name. It needs environment,
  // as a service's name is unique only in its environment.
  string service = 2;
}

// ListDomainsResponse lists domains.
message ListDomainsResponse {
  // The domains, sorted by name.
  repeated Domain domains = 1;
}

// Domain is one domain the routes of an environment serve.
message Domain {
  // The domain, such as "app.example.com".
  string name = 1;
  // The environment that holds it, by ID. A domain lives in one environment.
  string environment_id = 2;
  // Where it answers, such as "https://app.example.com". A domain whose routes
  // take no certificate reads "http://app.example.com", which is what this server
  // serves, and whatever ends TLS in front of it may answer HTTPS too.
  string url = 3;
  // Its routes, by path.
  repeated DomainRoute routes = 4;
  // Where it stands on each server its routes run on.
  repeated DomainServer servers = 5;
}

// DomainRoute is one route of a domain.
message DomainRoute {
  // The route's ID.
  string id = 1;
  // The route's name, unique in its environment.
  string name = 2;
  // The path it covers. Empty covers the whole domain.
  string path = 3;
  // The service it sends to, by name. Empty when host_port is set.
  string service = 4;
  // The service's port it sends to. Empty when host_port is set.
  uint32 port = 5;
  // Where it answers, such as "https://app.example.com/api".
  string url = 6;
  // "off" when TLS ends before this server, as Route.tls says.
  string tls = 7;
  // The port on the server itself it sends to, in place of a service's.
  uint32 host_port = 8;
  // True when a route with tls off answers anyone who can reach the server, as
  // Route.plain_for_anyone says.
  bool plain_for_anyone = 9;
  // True while it answers that the app isn't open yet, as Route.held says (ADR 0084).
  bool held = 80;
  // The proxies in front it believes, as Route.trusted_proxies names them, so what
  // reads a route has all of it.
  repeated string trusted_proxies = 81;
  // Who it lets in, as addresses and ranges, as Route.access says: anyone else
  // gets 403. Empty lets in everyone it answers (ADR 0087).
  repeated string allow = 110;
  // Who may sign in to it with a password, by name, in its order. A password,
  // or its hash, is never shown: an edit that names a user with no password
  // keeps theirs.
  repeated string users = 111;
}

// DomainServer is where a domain stands on one server.
message DomainServer {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // Where the certificate and DNS stand, as the server last said. Unset until
  // it has said.
  DomainStatus status = 3;
  // True when the server isn't connected, so status is what it last said.
  bool stale = 4;
  // Where the server's ingress stands, as it last said. A domain with an issued
  // certificate still doesn't answer while problem is set here.
  IngressStatus ingress = 5;
}

// IngressStatus is where a server's ingress stands, on a server with routes.
message IngressStatus {
  // The proxy, such as "Caddy".
  string proxy = 1;
  // True when the proxy runs.
  bool running = 2;
  // Why its routes aren't being served. Unset while they are.
  IngressProblem problem = 3;
  // For people: what is wrong, what follows, and how to fix it. Empty while
  // nothing is.
  string message = 4;
  // What holds the proxy's ports, by name, for PORTS_TAKEN: containers, where
  // they are in one, so a client can offer what to do about each.
  repeated string holders = 5;
  // The version the proxy runs, such as "2.11.7-alpine". Empty when the server
  // can't say.
  string version = 6;
  // The version this server's Dockwell pins.
  string pinned_version = 7;
  // True when the proxy isn't the version this server's Dockwell pins. It may
  // be missing security fixes, and moves on the server's next route change.
  bool outdated = 8;
}

// IngressProblem is why a server's routes aren't being served.
enum IngressProblem {
  INGRESS_PROBLEM_UNSPECIFIED = 0;
  // Something else holds port 80 or 443, so the proxy can't start, as after a
  // reboot brings back another proxy that was stopped for it.
  INGRESS_PROBLEM_PORTS_TAKEN = 1;
  // The ingress network has gone, and another network has its subnet, so the
  // routes could reach that network's containers. Each answers 503 until the
  // network is back.
  INGRESS_PROBLEM_SUBNET_TAKEN = 2;
  // The proxy isn't running, for any other reason.
  INGRESS_PROBLEM_NOT_RUNNING = 3;
}

// DomainStatus is where one domain's certificate and DNS stand on a server.
message DomainStatus {
  // The domain.
  string domain = 1;
  // Its certificate.
  Certificate certificate = 2;
  // What DNS says of it.
  DomainCheck dns = 3;
  // What a stranger gets from each of its routes that keeps anyone out, by path,
  // as the server last asked them (ADR 0087).
  repeated StrangerCheck strangers = 110;
}

// StrangerCheck is what a stranger gets from a private route, as its server asks
// it about once a minute, and at once after a change: from the server itself,
// with no password, as an address no list names. A request from there can't be
// told apart from a stranger's where the server is on the route's list, or where
// the route answers only proxies the server isn't.
message StrangerCheck {
  // The route's path. Empty is the whole domain.
  string path = 1;
  // What came of it.
  StrangerOutcome outcome = 2;
  // The HTTP status it answered with, such as 403, or 0 when nothing answered
  // or the server can't tell.
  uint32 status = 3;
  // What it said, in a line, such as "403 Forbidden", or why the server can't
  // tell, for people.
  string said = 4;
}

// StrangerOutcome is what a stranger gets from a private route.
enum StrangerOutcome {
  // Not asked yet.
  STRANGER_OUTCOME_UNSPECIFIED = 0;
  // 403: kept out, with nothing else said.
  STRANGER_OUTCOME_KEPT_OUT = 1;
  // 401: asked for a name and password.
  STRANGER_OUTCOME_ASKED_FOR_PASSWORD = 2;
  // Anything below 400: let in, which a private route shouldn't.
  STRANGER_OUTCOME_LET_IN = 3;
  // Another answer, such as a 502 from an app that's down, or none at all.
  STRANGER_OUTCOME_OTHER = 4;
  // The server can't tell what a stranger gets from where it asks: said says
  // why.
  STRANGER_OUTCOME_CANT_TELL = 5;
}

// Certificate is where a domain's certificate stands on a server.
message Certificate {
  // Where it stands.
  CertificateState state = 1;
  // Why it failed, or why renewing it is failing while an issued one still
  // serves. Unset otherwise.
  CertificateProblem problem = 2;
  // For people: what is happening or what went wrong, what follows, and how
  // to fix it. Dockwell keeps trying a failed certificate by itself.
  string message = 3;
  // When an issued certificate expires. Renewing it is automatic.
  google.protobuf.Timestamp expire_time = 4;
  // The certificate by DNS-01 that serves it, by name, when one does (ADR 0088).
  // Unset for one Caddy got over HTTP. Numbered in the block DNS-01 holds, 120 to
  // 129.
  string by_dns = 120;
}

// CertificateState is where a domain's certificate stands.
enum CertificateState {
  // Not known yet.
  CERTIFICATE_STATE_UNSPECIFIED = 0;
  // On its way: the domain doesn't answer over HTTPS yet.
  CERTIFICATE_STATE_PENDING = 1;
  // On the server, and serving.
  CERTIFICATE_STATE_ISSUED = 2;
  // The last try failed. Dockwell tries again by itself, and at once when the
  // domain's DNS starts pointing here.
  CERTIFICATE_STATE_FAILED = 3;
  // None, as TLS ends before this server: its routes say tls off, so it has no
  // certificate here, and none is asked for.
  CERTIFICATE_STATE_NONE = 4;
}

// CertificateProblem is why a certificate failed.
enum CertificateProblem {
  CERTIFICATE_PROBLEM_UNSPECIFIED = 0;
  // DNS has no record for the domain, or didn't answer.
  CERTIFICATE_PROBLEM_DNS = 1;
  // The certificate authority couldn't reach port 80 or 443 on the server,
  // as when a firewall blocks them.
  CERTIFICATE_PROBLEM_CONNECTION = 2;
  // Something other than this server answered for the domain, as when DNS
  // points elsewhere or a CDN is in front.
  CERTIFICATE_PROBLEM_WRONG_SERVER = 3;
  // The certificate authority's rate limit was hit.
  CERTIFICATE_PROBLEM_RATE_LIMITED = 4;
  // A CAA record forbids this certificate authority.
  CERTIFICATE_PROBLEM_CAA = 5;
  // The certificate authority won't issue for this name.
  CERTIFICATE_PROBLEM_REFUSED = 6;
  // Anything else; the message has the certificate authority's words.
  CERTIFICATE_PROBLEM_OTHER = 7;
  // The server couldn't reach the certificate authority at all, as when its
  // own resolver or outbound network fails. Nothing is known of the domain.
  CERTIFICATE_PROBLEM_CANT_REACH_CA = 8;
}

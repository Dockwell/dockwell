syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/backup.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

// DatabaseService is the services that run a database Dockwell knows:
// PostgreSQL, MySQL, MariaDB, Redis, Valkey and MongoDB, from their official images,
// whether Dockwell made them or took them on. A database is a service, so it
// changes as any service does, by a change with a plan. What this adds is what
// the database itself says, read in its own container with its own tools, which
// sign in with what its environment already holds, so no password passes
// through Dockwell. See docs/adr/0038-databases.md.
//
// Nothing here carries a password, nor a value of a database's environment.
service DatabaseService {
  // ListDatabases returns every database, by name, with how each stands on each
  // server it runs on, as far as each server can say within a few seconds, and
  // the newest backup of its data.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/databases"};
  }

  // GetDatabase returns one database, by its service's ID or its name, with what
  // it holds: the databases inside it, and who can sign in to it.
  rpc GetDatabase(GetDatabaseRequest) returns (GetDatabaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/databases/{id}"};
  }

  // CreateDatabaseUser plans a database inside a database server, with a user who
  // owns it, and a password for them that the control plane generates and keeps as a
  // secret of the environment, which nobody sees unless they reveal it. The user is a
  // resource, of kind "database.user", so it's a change with a plan, a revision and an
  // undo, and setting the secret anew changes the password. Only PostgreSQL, MySQL
  // and MariaDB have users of their own.
  rpc CreateDatabaseUser(CreateDatabaseUserRequest) returns (CreateDatabaseUserResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "add-user"};
    option (google.api.http) = {
      post: "/v1/databases/{id}/users"
      body: "*"
    };
  }
  // ChangeDatabasePassword plans a new password for one of a database's users: its
  // first user, such as MariaDB's root or PostgreSQL's postgres, whose password is in
  // the secret the service starts with (Database.password_secret), or a user Dockwell
  // made (CreateDatabaseUser). The control plane generates it, as it does a new
  // user's, and sets the secret to it, so the plan restarts the database and every
  // app that uses the secret, and nobody sees the password unless they reveal it. The
  // agent changes it in the database as it restarts, so what signs in with the secret
  // keeps signing in (ADR 0038). A database whose password isn't in a secret has
  // none to change here.
  rpc ChangeDatabasePassword(ChangeDatabasePasswordRequest) returns (ChangeDatabasePasswordResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "change-password"};
    option (google.api.http) = {
      post: "/v1/databases/{id}:changePassword"
      body: "*"
    };
  }

  // SetDatabaseExternalAccess plans letting apps and people beyond a database's
  // server reach it, from the addresses listed and nowhere else, or taking that
  // away. It's three edits that go together: the database publishes its engine's
  // port on every address of its server, and two firewall rules there let the
  // listed addresses in and keep everyone else out. Turning it off removes all
  // three. The rules are a server's, so it's an admin's, as any firewall rule is.
  // The port is public on purpose, which a person approves, and the rules change
  // who reaches the server, which takes a passkey, so no API token may apply it.
  // It changes nothing until the plan is applied, and a list that's empty, or
  // reaches everyone, is refused (ADR 0038, "External access, as built").
  rpc SetDatabaseExternalAccess(SetDatabaseExternalAccessRequest) returns (SetDatabaseExternalAccessResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "external-access"};
    option (google.api.http) = {
      post: "/v1/databases/{id}:externalAccess"
      body: "*"
    };
  }

  // CheckDatabaseSignIn asks whether a user of a PostgreSQL, MySQL or MariaDB server
  // Dockwell runs signs in to one of its databases with the password an app's secret
  // holds, from another host, as connecting the app takes that user on (ADR 0084,
  // Connect a database). It changes nothing. The password stays on the control plane
  // and the server's agent, and nothing it answers holds it. It takes a developer's
  // role in the app's environment and in the server's, and an admin's where the
  // server's is protected, as revealing its secrets does. One check runs at a time on
  // a server, and an answer is given again for 30 seconds.
  rpc CheckDatabaseSignIn(CheckDatabaseSignInRequest) returns (CheckDatabaseSignInResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "check-sign-in"};
    option (google.api.http) = {get: "/v1/databases/{id}:checkSignIn"};
  }
  // ConnectDatabase plans an app's link to a PostgreSQL, MySQL, MariaDB or ClickHouse server
  // Dockwell runs, for an app from no catalog entry, such as one a Compose file or
  // an import brought (ADR 0084, Connect a database). The link is a resource in the
  // app's environment, and what meets it is a new database with a user of the app's
  // own, made in the plan with a generated password, or a database and user the
  // server has already, taken on with the password the app signs in with now. That
  // user stays the server's: Dockwell checks it signs in from another host, and
  // never changes its rights or its password, nor drops it. Each name of the app's
  // environment the request names is set from the link, the password as a value
  // read from the user's own secret, and a URL written from the parts. A server in
  // another project is reached on a link network of the app's own, which it joins
  // in place. The app runs on the server the database runs on. ClickHouse uses
  // an existing database and the credentials the service already uses.
  rpc ConnectDatabase(ConnectDatabaseRequest) returns (ConnectDatabaseResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "connect"};
    option (google.api.http) = {
      post: "/v1/databases/{id}:connect"
      body: "*"
    };
  }

  // CreateLogicalDatabase plans a new logical database inside a PostgreSQL, MySQL
  // or MariaDB server, owned either by an existing user picked on that server
  // (kind "database.logical") or by a new owner user with a generated password
  // kept as a secret (kind "database.user").
  rpc CreateLogicalDatabase(CreateLogicalDatabaseRequest) returns (CreateLogicalDatabaseResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "add-database"};
    option (google.api.http) = {
      post: "/v1/databases/{id}/databases"
      body: "*"
    };
  }

  // DeleteLogicalDatabase plans dropping a logical database Dockwell manages on a
  // PostgreSQL, MySQL or MariaDB server. Refused while any app uses it.
  rpc DeleteLogicalDatabase(DeleteLogicalDatabaseRequest) returns (DeleteLogicalDatabaseResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {verb: "delete-database"};
    option (google.api.http) = {
      post: "/v1/databases/{id}/databases/{database}:delete"
      body: "*"
    };
  }

  // BeginDatabaseImport starts a staged dump upload (.sql, .sql.gz, .dump, .tar)
  // for a database on its server, or reports how far an existing upload got so
  // the client can resume it. Admin-only; no API token can call it.
  rpc BeginDatabaseImport(BeginDatabaseImportRequest) returns (BeginDatabaseImportResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {verb: "begin-import"};
    option (google.api.http) = {
      post: "/v1/databases/{id}/imports"
      body: "*"
    };
  }

  // UploadDatabaseImport streams bounded chunks of a staged dump upload from
  // offset to the database's server. Over REST it is a PUT whose body is the
  // raw bytes of that chunk. Admin-only; no API token can call it.
  rpc UploadDatabaseImport(stream UploadDatabaseImportRequest) returns (UploadDatabaseImportResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {verb: "upload-import"};
    option (google.api.http) = {
      put: "/v1/databases/{id}/imports/{import_id}"
      body: "content"
    };
  }

  // PlanDatabaseImport plans importing a completed staged dump into the chosen
  // logical database, backing up that database first (as restores do). Admin-only.
  rpc PlanDatabaseImport(PlanDatabaseImportRequest) returns (PlanDatabaseImportResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {verb: "plan-import"};
    option (google.api.http) = {
      post: "/v1/databases/{id}/imports/{import_id}:plan"
      body: "*"
    };
  }

  // CancelDatabaseImport discards a staged dump upload on the server. Admin-only.
  rpc CancelDatabaseImport(CancelDatabaseImportRequest) returns (CancelDatabaseImportResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {verb: "cancel-import"};
    option (google.api.http) = {delete: "/v1/databases/{id}/imports/{import_id}"};
  }
}

// DatabaseEngine is which database a service runs.
enum DatabaseEngine {
  DATABASE_ENGINE_UNSPECIFIED = 0;
  // PostgreSQL, from the image postgres.
  DATABASE_ENGINE_POSTGRESQL = 1 [(dockwell.v1.word) = "PostgreSQL"];
  // MySQL, from the image mysql.
  DATABASE_ENGINE_MYSQL = 2 [(dockwell.v1.word) = "MySQL"];
  // MariaDB, from the image mariadb.
  DATABASE_ENGINE_MARIADB = 3 [(dockwell.v1.word) = "MariaDB"];
  // Redis, from the image redis.
  DATABASE_ENGINE_REDIS = 4 [(dockwell.v1.word) = "Redis"];
  // Valkey, from the image valkey/valkey.
  DATABASE_ENGINE_VALKEY = 5 [(dockwell.v1.word) = "Valkey"];
  // MongoDB, from the image mongo.
  DATABASE_ENGINE_MONGODB = 6 [(dockwell.v1.word) = "MongoDB"];
  // ClickHouse, from clickhouse/clickhouse-server or clickhouse.
  DATABASE_ENGINE_CLICKHOUSE = 7 [(dockwell.v1.word) = "ClickHouse"];
}

// Database is a service that runs a database.
message Database {
  // The service's ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // The service: its kind, its environment's ID, and its name.
  ResourceRef resource = 2;
  // Which database it runs.
  DatabaseEngine engine = 3;
  // The image it runs, such as "postgres:17.2".
  string image = 4;
  // The version its image's tag names, such as "17.2", or the tag itself where
  // it names none, such as "latest". What each server's database says is in
  // readings.
  string version = 5;
  // The volume that holds its data, by name. Empty when none does, so its data
  // is in the container, and goes when the container is replaced.
  string volume = 6;
  // The volume's ID. Empty for a volume Dockwell didn't make, as one a container
  // came with when it was taken on.
  string volume_id = 7;
  // True when its data is in a volume Dockwell didn't make (Mount.external).
  bool volume_external = 8;
  // The port it listens on in its container, such as 5432.
  uint32 port = 9;
  // The name the other services in its environment reach it by: its service's.
  string host = 10;
  // The environment's secret its first user's password is in, by name, when the
  // service uses one, such as "POSTGRES_PASSWORD". Empty when the password is in
  // its own environment, or there is none.
  string password_secret = 11;
  // How it stands on each server it is placed on, as each said when asked, by
  // server name.
  repeated DatabaseReading readings = 12;
  // Its volume's newest backup that's whole, on any server. Unset when there's
  // none, or no volume.
  Backup newest_backup = 13;
  // Its volume's newest backup, whatever came of it, when that's newer than
  // newest_backup: one running now, or one that failed.
  Backup latest_backup = 14;
  // The other services in its environment, by name, as those are what a Compose
  // file or a catalog install puts beside a database to use it.
  repeated string beside = 15;
  // The catalog entry it was installed from, by ID, such as "postgres". Empty
  // for anything else.
  string catalog_entry = 16;
  // How apps and people beyond its server reach it, where they do: the port it
  // publishes on every address of its server, and the addresses its firewall
  // lets in there. Unset while it has no external access
  // (SetDatabaseExternalAccess).
  DatabaseExternalAccess external_access = 17;
  // The HTTP port in a ClickHouse container. Its native port is in port.
  uint32 http_port = 18;
}

// DatabaseExternalAccess is a database's port on its server's every address, and
// who its firewall lets in there: the listed addresses, and nobody else.
message DatabaseExternalAccess {
  // The port on the server, such as 5432.
  uint32 port = 1;
  // The addresses let in, each an address or a range, such as "203.0.113.0/24".
  repeated string allow_from = 2;
}

// DatabaseReading is what a database said of itself on one server.
message DatabaseReading {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // When it was read. A reading is kept for a few seconds, so several readers
  // ask the database once.
  google.protobuf.Timestamp read_time = 3;
  // Why it couldn't be read, for people, such as "PostgreSQL isn't running". The
  // rest is then unset.
  string unread = 4;
  // The version it says it is, such as "17.2".
  string version = 5;
  // How much its data takes, in bytes: its databases on disk, or for Redis and
  // Valkey, its data in memory.
  int64 size_bytes = 6;
  // How many clients are connected now.
  int64 connections = 7;
  // How many it takes at most. Zero where it says none.
  int64 max_connections = 8;
  // The user Dockwell signed in as, such as "postgres" or "root". Empty for
  // Redis and Valkey.
  string user = 9;
  // How long it has been up, in seconds.
  int64 uptime_seconds = 10;
  // Of what clients read since it started, how much came from memory rather than
  // disk, from 0 to 1: PostgreSQL's shared buffers, InnoDB's buffer pool,
  // MongoDB's WiredTiger cache, or the keys Redis found. Unset until anything
  // was read.
  optional double cache_hit = 11;
  // The databases in it, by name. Redis and Valkey have none of their own.
  repeated InnerDatabase databases = 12;
  // Who can sign in to it, by name. Redis and Valkey list none.
  repeated DatabaseAccount users = 13;
  // How many keys it holds, for Redis and Valkey.
  int64 keys = 14;
  // How many more databases or users it has than this lists.
  int32 unlisted = 15;
  // MongoDB's feature compatibility version, such as "7.0": the release whose
  // features its data may use. An upgrade leaves it where it was, so the release
  // before can still run the data, and the next upgrade raises it first.
  string feature_compatibility = 16;
  // The replica set it's a member of, by name, for MongoDB. Empty for one that
  // runs alone, whose backups aren't one moment if something writes while they
  // run.
  string replica_set = 17;
  // True when it checks no one, as MongoDB does without --auth: anything that
  // reaches its port signs in as anyone.
  bool checks_no_one = 18;
  // The container running this database on the server, by name, for opening a
  // console in it.
  string container = 19;
}

// InnerDatabase is one database inside a database server, as PostgreSQL has
// them, or a schema, as MySQL and MariaDB call one.
message InnerDatabase {
  // Its name, such as "shop".
  string name = 1;
  // The user that owns it, for PostgreSQL, or is granted full rights on it, for MySQL and MariaDB.
  string owner = 2;
  // How much it takes on disk, in bytes.
  int64 size_bytes = 3;
  // True for one the server made for itself, such as PostgreSQL's postgres.
  bool system = 4;
  // How many client connections are open to this database now.
  int64 connections = 5;
  // The resource's ID, for a database Dockwell made (kind "database.logical" or "database.user").
  string resource_id = 6;
  // The resource's kind ("database.logical" or "database.user") when Dockwell manages it.
  string resource_kind = 7;
  // The apps linking to this database, where visible to the caller.
  repeated string linked_by = 8;
  // The database engine reported by ClickHouse, such as Atomic.
  string engine = 9;
}

// DatabaseAccount is someone who can sign in to a database server: a user, as
// MySQL and MariaDB call one, or a role, as PostgreSQL does.
message DatabaseAccount {
  // Their name, such as "shop".
  string name = 1;
  // Where they may sign in from, for MySQL and MariaDB, such as "%" for
  // anywhere.
  string host = 2;
  // True for a user who can do anything, as PostgreSQL's postgres and MySQL's
  // root can.
  bool superuser = 3;
  // False for a role that can't sign in, as PostgreSQL has for groups.
  bool can_sign_in = 4;
  // The databases that are theirs, by name: those they own, in PostgreSQL, or
  // those they're granted on by name, in MySQL and MariaDB.
  repeated string databases = 5;
  // True for one the server made for itself, such as mysql.sys.
  bool system = 6;
  // For a user Dockwell made, a resource of kind "database.user": the secret their
  // password is in, by name.
  string secret = 7;
  // The services that use that secret, by name, which are what signs in as them.
  repeated string used_by = 8;
  // The resource's ID, for a user Dockwell made.
  string resource_id = 9;
  // The database they sign in to, for MongoDB, as an app names it in authSource,
  // such as "admin" for its root user.
  string auth_database = 10;
  // On a Redis or Valkey, it signs in with no password, so anyone who reaches the
  // server signs in as it. Numbered in the block connectable apps hold in other
  // messages, 80 to 89.
  bool no_password = 80;
}

// ListDatabasesRequest asks for the databases.
message ListDatabasesRequest {}

// ListDatabasesResponse lists them.
message ListDatabasesResponse {
  // The databases, by name.
  repeated Database databases = 1;
}

// GetDatabaseRequest names a database.
message GetDatabaseRequest {
  // Its service, by ID or by name.
  string id = 1;
  // The project of a service named by name, by name or ID, when more than one
  // has a service of that name.
  string project = 2;
  // The environment of a service named by name, by name or ID, when its project
  // has more than one.
  string environment = 3;
}

// CheckDatabaseSignInRequest names a database server, a user and database there, and
// the app's secret that holds the user's password.
message CheckDatabaseSignInRequest {
  // The service that runs the database, by ID or by name.
  string id = 1;
  // The project of a database named by name, by name or ID.
  string project = 2;
  // The environment of a database named by name, by name or ID.
  string environment = 3;
  // The user who signs in, one the server has.
  string user = 4;
  // The database they sign in to, one the server has.
  string database = 5 [(dockwell.v1.flag) = "database-name"];
  // The app's project, by name or ID. Empty is the database's.
  string app_project = 6;
  // The app's environment, by name or ID. Empty is the only one its project has.
  string app_environment = 7;
  // The secret of the app's environment that holds the user's password, as the app
  // signs in with it now.
  string password_secret = 8;
}

// CheckDatabaseSignInResponse says how the server answered.
message CheckDatabaseSignInResponse {
  // True where the user signs in with the password.
  bool signs_in = 1;
  // What the server's client said where it didn't, with nothing of the password.
  string said = 2;
  // True where the user reaches past its database, as an administrator does, and so
  // every other app's data, which no app is connected as.
  bool administrator = 3;
  // True where the user has no rights in the database: it neither owns it nor may
  // make things in it.
  bool no_rights = 4;
}

// ConnectDatabaseRequest names a database server, the app to connect to it, and
// what the app reads of it.
message ConnectDatabaseRequest {
  // The service that runs the database, by ID or by name.
  string id = 1;
  // The project of a database named by name, by name or ID, when more than one has
  // a service of that name.
  string project = 2;
  // The environment of a database named by name, by name or ID, when its project
  // has more than one.
  string environment = 3;
  // The app, by its service's name in its environment.
  string app = 4;
  // The app's project, by name or ID. Empty is the database's.
  string app_project = 5;
  // The app's environment, by name or ID. Empty is the only one its project has.
  string app_environment = 6;
  // The link's name in the app's environment, such as "db". Empty is "db".
  string link = 7;
  // The database the app uses there: one the server has, which keeps the app's
  // data where it is, or a new one. Empty makes a new one, named for the app.
  string database = 8 [(dockwell.v1.flag) = "database-name"];
  // The user the app signs in as. With a new database, a new user who owns it,
  // named as the database unless set. With one the server has, a user there that
  // isn't its administrator, which is taken on.
  string user = 9;
  // With a database the server has: the secret of the app's environment that holds
  // the user's password, as the app signs in with it now.
  string password_secret = 10;
  // The names of the app's environment the link sets, each with what it holds,
  // such as DB_HOST=host or DATABASE_URL=url. Each is a variable or secret the app
  // has, and a password or a URL is a secret.
  map<string, dockwell.resource.v1alpha1.LinkPart> sets = 11;
  // How a URL the link sets is written, by its name, with {host}, {port},
  // {address}, {database}, {user} and {password}, such as
  // "postgres://{user}:{password}@{host}:{port}/{database}?sslmode=disable". Empty is
  // the engine's own form.
  map<string, string> templates = 12;
}

// ConnectDatabaseResponse carries the planned change.
message ConnectDatabaseResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// CreateDatabaseUserRequest names a database server, and the user and database to
// make in it.
message CreateDatabaseUserRequest {
  // The service that runs it, by ID or by name.
  string id = 1;
  // The user's name, such as "shop": lowercase letters, digits and underscores,
  // starting with a letter, at most 32.
  string user = 2;
  // The database they own, named as a user is. Empty takes the user's name.
  string database = 3 [(dockwell.v1.flag) = "database-name"];
  // The secret their password goes in, such as "SHOP_DATABASE_PASSWORD". Empty
  // takes the user's name in capitals, then "_DATABASE_PASSWORD". It must not be
  // there already.
  string secret = 4;
  // The project of a service named by name, by name or ID, when more than one has a
  // service of that name.
  string project = 5;
  // The environment of a service named by name, by name or ID, when its project has
  // more than one.
  string environment = 6;
}

// CreateDatabaseUserResponse carries the planned change.
message CreateDatabaseUserResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// ChangeDatabasePasswordRequest names a database, and the user whose password changes.
message ChangeDatabasePasswordRequest {
  // The service that runs it, by ID or by name.
  string id = 1;
  // The user, by name: one Dockwell made, such as "shop". Empty is its first user,
  // whose password is in Database.password_secret.
  string user = 2;
  // The project of a service named by name, by name or ID, when more than one has a
  // service of that name.
  string project = 3;
  // The environment of a service named by name, by name or ID, when its project has
  // more than one.
  string environment = 4;
}

// ChangeDatabasePasswordResponse is the change that gives the user a new password.
message ChangeDatabasePasswordResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// SetDatabaseExternalAccessRequest names a database, and who reaches it from
// beyond its server, or that nobody does.
message SetDatabaseExternalAccessRequest {
  // The service that runs it, by ID or by name.
  string id = 1;
  // The project of a database named by name, by name or ID, when more than one has
  // a service of that name.
  string project = 2;
  // The environment of a database named by name, by name or ID, when its project
  // has more than one.
  string environment = 3;
  // The addresses its firewall lets in, each an address or a range, such as
  // "203.0.113.7" or "203.0.113.0/24": at least one, unless off, and at most 32,
  // none wider than a /8 for IPv4 or a /32 for IPv6, so no list reaches everyone.
  repeated string allow_from = 4;
  // Takes external access away: the port and both rules, in one change.
  bool off = 5;
}

// SetDatabaseExternalAccessResponse is the change that gives or takes external
// access, planned.
message SetDatabaseExternalAccessResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// GetDatabaseResponse is one database.
message GetDatabaseResponse {
  // The database.
  Database database = 1;
}

// CreateLogicalDatabaseRequest names a database server and a new logical database
// to make in it, owned either by an existing user or by a new user Dockwell makes.
message CreateLogicalDatabaseRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The database's name, such as "shop": lowercase letters, digits and underscores,
  // starting with a letter, at most 32.
  string database = 2 [(dockwell.v1.flag) = "database-name"];
  // An existing user on the server to own the database. Empty creates a new user
  // with a generated password kept as a secret.
  string owner = 3;
  // When owner is empty: the new user's name. Empty takes the database's name.
  string user = 4;
  // When owner is empty: the secret their password goes in. Empty takes the user's
  // name in capitals followed by "_DATABASE_PASSWORD".
  string secret = 5;
  // The project of a service named by name, by name or ID.
  string project = 6;
  // The environment of a service named by name, by name or ID.
  string environment = 7;
}

// CreateLogicalDatabaseResponse carries the planned change.
message CreateLogicalDatabaseResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// DeleteLogicalDatabaseRequest names a database server and a logical database
// Dockwell manages in it to drop.
message DeleteLogicalDatabaseRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The database's name inside the server.
  string database = 2 [(dockwell.v1.flag) = "database-name"];
  // The project of a service named by name, by name or ID.
  string project = 3;
  // The environment of a service named by name, by name or ID.
  string environment = 4;
}

// DeleteLogicalDatabaseResponse carries the planned change.
message DeleteLogicalDatabaseResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// BeginDatabaseImportRequest begins staging a dump file to import into a
// logical database on a PostgreSQL, MySQL or MariaDB server, or asks how far an
// existing upload got when import_id is set.
message BeginDatabaseImportRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The project of a service named by name, by name or ID.
  string project = 2;
  // The environment of a service named by name, by name or ID.
  string environment = 3;
  // The logical database inside the server to import into.
  string database = 4 [(dockwell.v1.flag) = "database-name"];
  // The dump filename (used to pick format: .sql, .sql.gz, .dump, .tar).
  string filename = 5;
  // Total size of the dump file in bytes.
  uint64 size_bytes = 6;
  // The server to stage the upload on when the database runs on more than one.
  string server = 7;
  // An existing staged upload ID to inspect for resume.
  string import_id = 8;
}

// BeginDatabaseImportResponse reports the staged upload state and chunk sizing.
message BeginDatabaseImportResponse {
  // The staged upload's identifier.
  string import_id = 1;
  // How many bytes the server already holds.
  uint64 offset = 2;
  // Suggested chunk size in bytes for each PUT request.
  uint64 part_bytes = 3;
  // Maximum accepted dump size in bytes.
  uint64 max_bytes = 4;
  // The server holding this staged upload.
  string server_id = 5;
  // Normalized dump format: sql, sql.gz, dump, or tar.
  string format = 6;
}

// UploadDatabaseImportRequest carries a chunk of a staged dump upload.
message UploadDatabaseImportRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The staged upload's identifier from BeginDatabaseImport.
  string import_id = 2;
  // Byte offset where this chunk starts; must match the server's offset.
  uint64 offset = 3;
  // Raw bytes of this chunk.
  google.api.HttpBody content = 4;
  // The project of a service named by name, by name or ID.
  string project = 5;
  // The environment of a service named by name, by name or ID.
  string environment = 6;
}

// UploadDatabaseImportResponse reports how far the staged upload has progressed.
message UploadDatabaseImportResponse {
  // The staged upload's identifier.
  string import_id = 1;
  // Total bytes received by the server so far.
  uint64 offset = 2;
  // Expected total size in bytes.
  uint64 size_bytes = 3;
  // True once all size_bytes have been received.
  bool complete = 4;
}

// PlanDatabaseImportRequest plans importing a completed staged dump upload.
message PlanDatabaseImportRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The staged upload's identifier.
  string import_id = 2;
  // The project of a service named by name, by name or ID.
  string project = 3;
  // The environment of a service named by name, by name or ID.
  string environment = 4;
  // Optional custom change summary.
  string summary = 5;
}

// PlanDatabaseImportResponse carries the planned import change.
message PlanDatabaseImportResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// CancelDatabaseImportRequest discards a staged dump upload on its server.
message CancelDatabaseImportRequest {
  // The service that runs the database server, by ID or by name.
  string id = 1;
  // The staged upload's identifier.
  string import_id = 2;
  // The project of a service named by name, by name or ID.
  string project = 3;
  // The environment of a service named by name, by name or ID.
  string environment = 4;
}

// CancelDatabaseImportResponse is empty.
message CancelDatabaseImportResponse {}

// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/change.proto";
import "dockwell/v1/domain.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/system.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ServerService lists the servers Dockwell manages and streams their live
// state, as each server's agent reports it.
//
// WatchServers has no REST path: REST has no way to stream messages, so a
// REST client polls ListServers or GetServer instead, and anything that wants
// the stream opens it with Connect, gRPC or gRPC-Web. See
// docs/adr/0015-rest-and-openapi-from-the-schema.md.
service ServerService {
  option (dockwell.v1.nouns) = {
    name: "servers"
    help: "The servers Dockwell manages, with their live state as each server's agent reports it. WatchServers has no REST path: REST has no way to stream messages, so a REST client polls ListServers or GetServer instead, and anything that wants the stream opens it with Connect, gRPC or gRPC-Web. See docs/adr/0015-rest-and-openapi-from-the-schema.md."
  };
  option (dockwell.v1.nouns) = {
    name: "join-tickets"
    help: "A join ticket adds one server: dockwell join with it, on the new server, gives that server a name and a certificate, and its agent connects. CreateJoinTicket makes one with a passkey, and GetJoinTicket says whether a server has used it. dockwell token create makes the same ticket on the control server."
  };

  // ListServers returns every server, connected or not, without history.
  rpc ListServers(ListServersRequest) returns (ListServersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/servers"};
  }

  // GetServer returns one server, with its recent history.
  rpc GetServer(GetServerRequest) returns (GetServerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/servers/{id}"};
  }

  // WatchServers streams every server once, with recent history, marks the
  // end of that snapshot, and then streams each change within a second of
  // the agent reporting it. It has no REST path, as streams have none.
  rpc WatchServers(WatchServersRequest) returns (stream WatchServersResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
  }

  // GetServerDiskUse says what takes the room on the disk that holds Docker's
  // data: images, containers, volumes, the build cache and logs, and the rest.
  // The server's agent asks Docker when this is called, and only then, as
  // Docker adds up every volume to answer, which takes a while on a big disk.
  // An answer stands for 30 s, so a page opened twice asks once. See
  // docs/adr/0040-a-servers-live-use.md.
  rpc GetServerDiskUse(GetServerDiskUseRequest) returns (GetServerDiskUseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "disk-use"};
    option (google.api.http) = {get: "/v1/servers/{id}/diskUse"};
  }

  // CheckServerPorts says what holds each of some ports on a server, as its
  // kernel and Docker say: a process, a container, or nothing, so a form can
  // offer a port that's free and say what holds one someone typed. It reads
  // only when asked. What holds a server's ports is the install's to know (ADR
  // 0048), so it's an admin's.
  rpc CheckServerPorts(CheckServerPortsRequest) returns (CheckServerPortsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (google.api.http) = {get: "/v1/servers/{id}/ports"};
    option (dockwell.v1.command) = {
      noun: "servers"
      verb: "check-ports"
    };
  }

  // SetServerPublicAddress records a server's public address, as a person
  // knows it, which no other way of knowing it overrides. An IPv4 and an IPv6
  // address are kept apart. An empty address goes back to what Dockwell finds
  // out for itself. It's on record in the activity log, with what it replaced.
  // See docs/adr/0034-a-servers-public-address.md.
  rpc SetServerPublicAddress(SetServerPublicAddressRequest) returns (SetServerPublicAddressResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {verb: "set-public-address"};
    option (google.api.http) = {
      post: "/v1/servers/{id}:setPublicAddress"
      body: "*"
    };
  }

  // CreateJoinTicket makes a ticket that adds one server: dockwell join with it,
  // on the new server, gives that server a name and a certificate, and its agent
  // connects. The ticket works once, for an hour unless ttl_seconds says otherwise,
  // and is shown only in this response. It gives a server a place in the fleet, so
  // it takes a passkey just now: call it without a proof first, and it refuses with
  // the reason needs_step_up, then again with the proof from FinishStepUp for
  // STEP_UP_ACTION_ADD_SERVER. It's on the activity log. dockwell token create makes
  // the same ticket on the control server.
  rpc CreateJoinTicket(CreateJoinTicketRequest) returns (CreateJoinTicketResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "join-tickets"
      verb: "create"
    };
    option (google.api.http) = {
      post: "/v1/joinTickets"
      body: "*"
    };
  }

  // GetJoinTicket says whether a ticket is still waiting for a server, which server
  // joined with it, or that it expired. It never returns the ticket itself.
  rpc GetJoinTicket(GetJoinTicketRequest) returns (GetJoinTicketResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "join-tickets"
      verb: "get"
    };
    option (google.api.http) = {get: "/v1/joinTickets/{id}"};
  }
}

// CreateJoinTicketRequest says how long the ticket works.
message CreateJoinTicketRequest {
  // How long it works, in seconds: an hour when unset, and at most a day.
  uint32 ttl_seconds = 1;
  // The proof from FinishStepUp for STEP_UP_ACTION_ADD_SERVER.
  string proof = 2;
}

// CreateJoinTicketResponse carries the ticket, once.
message CreateJoinTicketResponse {
  // What the ticket is and where it leads, as GetJoinTicket reads it.
  JoinTicket ticket = 1;
  // The ticket itself, for dockwell join on the new server. Nothing shows it again.
  string value = 2;
}

// GetJoinTicketRequest names a ticket.
message GetJoinTicketRequest {
  // The ticket's ID, from CreateJoinTicket.
  string id = 1;
}

// GetJoinTicketResponse carries the ticket as it stands.
message GetJoinTicketResponse {
  // The ticket, without its secret.
  JoinTicket ticket = 1;
}

// JoinTicket is a ticket that adds one server, without its secret.
message JoinTicket {
  // Its ID, which starts jtk_.
  string id = 1;
  // Whether a server has joined with it yet.
  JoinTicketState state = 2;
  // When it stops working, used or not.
  google.protobuf.Timestamp expire_time = 3;
  // Where a joining server reaches the control plane, in the order it tries them.
  // Only CreateJoinTicket says it, as the ticket holds it and nothing else keeps it.
  repeated JoinAddress addresses = 4;
  // The server that joined with it, by ID and by name, once one has.
  string server_id = 5;
  string server_name = 6;
}

// JoinTicketState is where a ticket is in its life.
enum JoinTicketState {
  JOIN_TICKET_STATE_UNSPECIFIED = 0;
  // It works, and no server has used it yet.
  JOIN_TICKET_STATE_WAITING = 1 [(dockwell.v1.word) = "Waiting"];
  // A server joined with it.
  JOIN_TICKET_STATE_JOINED = 2 [(dockwell.v1.word) = "Joined"];
  // It ran out before any server used it.
  JOIN_TICKET_STATE_EXPIRED = 3 [(dockwell.v1.word) = "Expired"];
}

// JoinAddress is one address a ticket names, and who can reach it.
message JoinAddress {
  // The control plane's agent URL, such as https://203.0.113.7:7601.
  string url = 1;
  // Who reaches it.
  JoinReach reach = 2;
}

// JoinReach is who can reach an address a ticket names.
enum JoinReach {
  JOIN_REACH_UNSPECIFIED = 0;
  // A public address the control server is reached at, or a name a person gave:
  // a server anywhere reaches it once its port is open.
  JOIN_REACH_ANYWHERE = 1 [(dockwell.v1.word) = "Anywhere"];
  // The public address the control server reaches the internet from, which may
  // not lead back in, as behind a router.
  JOIN_REACH_WAY_OUT = 2 [(dockwell.v1.word) = "Way out only"];
  // A private address: only a server on the same network reaches it.
  JOIN_REACH_SAME_NETWORK = 3 [(dockwell.v1.word) = "Same network"];
}

// ListServersRequest takes no parameters yet.
message ListServersRequest {}

// ListServersResponse lists servers, oldest first.
message ListServersResponse {
  // The servers.
  repeated Server servers = 1;
}

// GetServerRequest names a server.
message GetServerRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
}

// GetServerResponse carries one server.
message GetServerResponse {
  // The server, with history.
  Server server = 1;
}

// CheckServerPortsRequest names a server and the ports to check on it.
message CheckServerPortsRequest {
  // The server, by ID or name.
  string id = 1;
  // The ports, 64 at most.
  repeated ServerPortAsk ports = 2;
}

// ServerPortAsk is a port on a server.
message ServerPortAsk {
  uint32 port = 1;
  // True for UDP.
  bool udp = 2;
}

// CheckServerPortsResponse says what holds each port asked, in the order asked.
message CheckServerPortsResponse {
  repeated ServerPortHeld ports = 1;
}

// ServerPortHeld is what holds one port on a server.
message ServerPortHeld {
  uint32 port = 1;
  bool udp = 2;
  // True when something holds it.
  bool held = 3;
  // What holds it, in words, such as "sshd" or "nginx, in the container
  // legacy-site". Empty when nothing does, and when what does can't be named.
  string by = 4;
}

// GetServerDiskUseRequest names a server.
message GetServerDiskUseRequest {
  // The server's ID.
  string id = 1;
}

// GetServerDiskUseResponse says what takes the room on a server's disk.
message GetServerDiskUseResponse {
  // What takes the room on the disk that holds Docker's data.
  ServerDiskUse disk_use = 1;
}

// ServerDiskUse is what takes the room on the disk that holds Docker's data,
// as Docker and the agent added it up. Docker's parts can come to more than
// the disk holds, when Docker's data spans disks of its own.
message ServerDiskUse {
  // When the agent added it up, on the server's clock.
  google.protobuf.Timestamp time = 1;
  // Where Docker keeps its data, such as "/var/lib/docker".
  string docker_root = 2;
  // Where the disk that holds it is mounted, such as "/".
  string mount_point = 3;
  // How big that disk is, in bytes.
  uint64 size_bytes = 4;
  // How much of it is in use, in bytes, as df counts it.
  uint64 used_bytes = 5;
  // What images take, each layer counted once, as `docker system df` counts
  // them.
  uint64 images_bytes = 6;
  // What of that no container uses, so removing those images would free it.
  uint64 images_unused_bytes = 7;
  // What containers have written to their own layers.
  uint64 containers_bytes = 8;
  // What volumes hold. Docker counts only the volumes it keeps itself.
  uint64 volumes_bytes = 9;
  // What of that is in volumes no container uses.
  uint64 volumes_unused_bytes = 10;
  // What the build cache takes.
  uint64 build_cache_bytes = 11;
  // What containers' logs take, as Docker's json-file and local drivers keep
  // them, rotated files included.
  uint64 logs_bytes = 12;
  // How many images there are.
  uint32 images = 13;
  // How many containers there are, running or not.
  uint32 containers = 14;
  // How many volumes there are.
  uint32 volumes = 15;
}

// SetServerPublicAddressRequest says what a server's public address is.
message SetServerPublicAddressRequest {
  // The server's ID.
  string id = 1;
  // A public IP address, or empty to clear what a person set.
  string address = 2;
  // With an empty address, clears the IPv6 address a person set, not the IPv4
  // one. A person's addresses are kept apart, as DNS records are.
  bool ipv6 = 3;
}

// SetServerPublicAddressResponse carries the server as it now reads.
message SetServerPublicAddressResponse {
  // The server, without history.
  Server server = 1;
}

// WatchServersRequest takes no parameters yet.
message WatchServersRequest {}

// WatchServersResponse is one step of a watch: a server's latest state, or
// the end of the snapshot.
message WatchServersResponse {
  // The server as it is now. The first message for each server carries its
  // history; later ones carry only the newest stats, to append. Unset on the
  // message that ends the snapshot.
  Server server = 1;
  // True when the server was removed; the client should drop it.
  bool removed = 2;
  // True on the one message, without a server, that ends the snapshot: every
  // server that existed when the watch began came before it, and every later
  // message is a change. An empty fleet sends only this.
  bool snapshot_complete = 3;
  // True on a message, without a server, that says only that the watch is
  // alive. One comes every 10 s, whatever else does, so a client that hears
  // nothing for longer knows the stream has stalled, as a frozen control plane
  // or a proxy holding the connection open makes it, and that what it last
  // heard may no longer be so.
  bool heartbeat = 4;
}

// Connection says whether a server's agent is talking to the control plane.
enum Connection {
  CONNECTION_UNSPECIFIED = 0;
  // The agent's stream is open and reporting.
  CONNECTION_CONNECTED = 1;
  // The agent was connected and has gone quiet.
  CONNECTION_UNREACHABLE = 2;
  // The server joined but its agent hasn't connected yet.
  CONNECTION_PENDING = 3;
}

// Server is one machine running the agent.
message Server {
  // The server's ID.
  string id = 1;
  // What the server is called, such as "hz-1".
  string name = 2;
  // When the server joined.
  google.protobuf.Timestamp create_time = 3;
  // Whether its agent is connected.
  Connection connection = 4;
  // When the control plane last heard from the agent. Unset if never.
  google.protobuf.Timestamp last_seen_time = 5;
  // What the server is: OS, hardware, Docker. Unset until the agent reports.
  ServerInventory inventory = 6;
  // The newest stats. Unset until the agent reports.
  ServerStats stats = 7;
  // Recent stats, oldest first, for sparklines: at most 60 samples, from
  // the 5 minutes before the newest by the samples' own times, so a server
  // that reports again after a longer outage starts over. Samples come every
  // 5 s while anyone watches the fleet, and every 15 s while nobody does, so
  // each says its own interval. Empty in lists.
  repeated ServerStats history = 8;
  // The agent's build.
  BuildInfo agent_build = 9;
  // True for the server that runs the control plane.
  bool control_server = 10;
  // When the agent connected, if it is connected now. A connection that
  // moves to a renewed certificate keeps its time. Unset otherwise.
  google.protobuf.Timestamp connect_time = 11;
  // Where its ingress stands, as it last said. Unset for a server with no
  // routes, as nothing on it wants the public ports.
  IngressStatus ingress = 12;
  // Since when its agent hasn't been able to read Docker, on the server's
  // clock, as it last said: Docker isn't running, or doesn't answer. Nobody
  // can say how what runs there is until it can. Unset while it can, and for a
  // server that isn't connected.
  google.protobuf.Timestamp docker_unreadable_since = 13;
  // How the server meets the internet, as far as that's known. The addresses
  // on its own interfaces are in its inventory.
  ServerNetwork network = 14;
  // Since when its memory or CPU has been above 90%, on the server's clock, once
  // that has lasted a minute. It ends once both are below 85%, so a server
  // near the line doesn't flip back and forth. The control plane decides it,
  // from the samples it keeps, so every page, the CLI and alerts read one
  // state. Unset while it isn't, and for a server that isn't connected.
  google.protobuf.Timestamp strained_since = 15;
  // What's above 90%: memory, or else CPU.
  ServerStrain strain = 16;
}

// ServerStrain is what a server is short of.
enum ServerStrain {
  SERVER_STRAIN_UNSPECIFIED = 0;
  // Its memory.
  SERVER_STRAIN_MEMORY = 1;
  // Its CPU.
  SERVER_STRAIN_CPU = 2;
}

// ServerNetwork is what's known of a server beyond its own interfaces. Its
// public address and whether the internet can reach it are separate facts: an
// address can be known and nothing proved of it. IPv4 and IPv6 are picked apart,
// as a server's A and AAAA records go to different places. See
// docs/adr/0034-a-servers-public-address.md.
message ServerNetwork {
  // Its public IPv4 address. Unset when nothing says.
  PublicAddress ipv4 = 1;
  // Its public IPv6 address. Unset when nothing says.
  PublicAddress ipv6 = 2;
  // Whether the internet can reach the server at either.
  Reachable reachable = 3;
  // The domain that shows it, for REACHABLE_YES and REACHABLE_NO.
  string reachable_domain = 4;
  // When that domain's DNS was last read, so what's shown is as of then.
  google.protobuf.Timestamp reachable_time = 5;
  // The cloud provider the machine itself says it runs on, from its firmware's
  // tables. A metadata service answering doesn't say so on its own.
  CloudProvider provider = 6;
  // Which of the shapes a server comes in this one has, as far as can be told.
  NetworkShape shape = 7;
}

// PublicAddress is what's known of one public address of a server.
message PublicAddress {
  // The address the internet knows the server by.
  string address = 1;
  // How that's known.
  PublicAddressSource source = 2;
  // When Dockwell came to know it that way. For a domain's, that's when its DNS
  // was last read.
  google.protobuf.Timestamp known_time = 3;
  // The domain whose certificate proved it, for
  // PUBLIC_ADDRESS_SOURCE_PROVED_BY_DOMAIN.
  string domain = 4;
  // Who set it, for PUBLIC_ADDRESS_SOURCE_SET_BY_PERSON.
  Actor set_by = 5;
  // True when nothing shows the address is a way in, so it's named only with a
  // caveat: a way out, or a metadata service the machine doesn't confirm.
  bool unproven = 6;
}

// NetworkShape is how a server meets the internet. It's read from what's on its
// interfaces and whether a cloud's metadata service answers, and says nothing
// of whether the internet can reach it.
enum NetworkShape {
  // Not known yet: its agent hasn't said what it has, or whether a metadata
  // service answers.
  NETWORK_SHAPE_UNSPECIFIED = 0;
  // A public IPv4 address is on an interface.
  NETWORK_SHAPE_INTERNET = 1;
  // Private IPv4 interfaces on a machine that says it runs on a cloud: its
  // public address is the provider's NAT.
  NETWORK_SHAPE_CLOUD_NAT = 2;
  // Private IPv4 interfaces, on a machine that names no cloud: likely a home or
  // office network, behind a router. Reaching it needs a forwarded port or a
  // tunnel.
  NETWORK_SHAPE_LOCAL_NAT = 3;
  // It reaches the internet from 100.64.0.0/10, so it's behind its provider's
  // carrier-grade NAT, where a forwarded port can't work. Only a tunnel can.
  NETWORK_SHAPE_CARRIER_NAT = 4;
}

// PublicAddressSource is how Dockwell knows a server's public address. In the
// order they win: a person, an interface, a domain, metadata the machine
// confirms, what the control plane sees, metadata it doesn't, and a lookup.
enum PublicAddressSource {
  PUBLIC_ADDRESS_SOURCE_UNSPECIFIED = 0;
  // A person set it.
  PUBLIC_ADDRESS_SOURCE_SET_BY_PERSON = 1;
  // It's on one of the server's interfaces.
  PUBLIC_ADDRESS_SOURCE_ON_INTERFACE = 2;
  // A certificate came for a domain whose one record points there, over
  // HTTP-01 or TLS-ALPN, and a recent read of its DNS still says so.
  PUBLIC_ADDRESS_SOURCE_PROVED_BY_DOMAIN = 3;
  // The control plane saw the agent connect from it. That's the server's way
  // out, which may not be a way in.
  PUBLIC_ADDRESS_SOURCE_SEEN_BY_CONTROL_PLANE = 4;
  // A cloud provider's metadata service gave it. It's a way in only if the
  // machine itself says it runs on that provider.
  PUBLIC_ADDRESS_SOURCE_CLOUD_METADATA = 5;
  // A public STUN server said where the server's packets come from. That's
  // its way out, and behind a router it's the router's shared address. It
  // never says anything of a way in.
  PUBLIC_ADDRESS_SOURCE_LOOKED_UP = 6;
}

// Reachable is whether the internet can reach a server. It's never a guess:
// anything short of proof is REACHABLE_NOT_CHECKED.
enum Reachable {
  REACHABLE_UNSPECIFIED = 0;
  // Nothing has tried, so nobody can say.
  REACHABLE_NOT_CHECKED = 1;
  // A certificate came over HTTP-01 or TLS-ALPN for a domain whose record
  // points at its public address.
  REACHABLE_YES = 2;
  // The certificate authority couldn't connect for a domain whose record
  // points at its public address.
  REACHABLE_NO = 3;
}

// CloudProvider is a cloud provider whose metadata service an agent can read.
enum CloudProvider {
  CLOUD_PROVIDER_UNSPECIFIED = 0;
  CLOUD_PROVIDER_AWS = 1;
  CLOUD_PROVIDER_GCP = 2;
  CLOUD_PROVIDER_AZURE = 3;
  CLOUD_PROVIDER_DIGITALOCEAN = 4;
  CLOUD_PROVIDER_HETZNER = 5;
  CLOUD_PROVIDER_ORACLE = 6;
}

// ServerInventory is what a server is: its system and hardware.
message ServerInventory {
  // The server's hostname.
  string hostname = 1;
  // The operating system's name for people, such as "Ubuntu 24.04.1 LTS".
  string os_name = 2;
  // The OS's ID from os-release, such as "ubuntu" or "debian".
  string os_id = 3;
  // The OS version, such as "24.04".
  string os_version = 4;
  // The kernel release, such as "6.8.0-48-generic".
  string kernel = 5;
  // The CPU architecture, such as "amd64" or "arm64".
  string architecture = 6;
  // The CPU model, such as "AMD EPYC 7763 64-Core Processor".
  string cpu_model = 7;
  // Logical CPUs.
  uint32 cpu_count = 8;
  // Total memory, in bytes.
  uint64 memory_bytes = 9;
  // Mounted filesystems that hold data, largest first.
  repeated Disk disks = 10;
  // The Docker Engine version, such as "28.5.1". Empty when Docker isn't
  // installed or isn't running.
  string docker_version = 11;
  // The server's non-loopback IP addresses: its physical interfaces' alone
  // when addresses_physical says so, and every interface's, Docker's bridges
  // included, from an agent from before that.
  repeated string addresses = 12;
  // The logging driver Docker uses by default, such as "json-file". Empty
  // when Docker isn't running.
  string docker_log_driver = 13;
  // The address its route to the internet leaves from. Empty when it has no
  // such route, or from an agent from before this.
  string outbound_address = 14;
  // True when addresses lists only physical interfaces' addresses, so a
  // private one there is a private network the server is on, as a cloud's is,
  // and never a Docker bridge's.
  bool addresses_physical = 15;
}

// Disk is one mounted filesystem.
message Disk {
  // Where it is mounted, such as "/" or "/var/lib/docker".
  string mount_point = 1;
  // The device, such as "/dev/sda1".
  string device = 2;
  // The filesystem type, such as "ext4".
  string filesystem = 3;
  // Total size, in bytes.
  uint64 size_bytes = 4;
}

// ServerStats is one sample of a server's resource use.
message ServerStats {
  // When the agent took the sample.
  google.protobuf.Timestamp time = 1;
  // CPU busy time across all cores since the previous sample, 0 to 100.
  double cpu_percent = 2;
  // Memory in use (total minus available), in bytes.
  uint64 memory_used_bytes = 3;
  // Total memory, in bytes.
  uint64 memory_total_bytes = 4;
  // Use of each disk in the inventory.
  repeated DiskUsage disks = 5;
  // Load averages over 1, 5 and 15 minutes.
  double load1 = 6;
  // Load average over 5 minutes.
  double load5 = 7;
  // Load average over 15 minutes.
  double load15 = 8;
  // Bytes received per second across physical interfaces.
  uint64 network_rx_bytes_per_second = 9;
  // Bytes sent per second across physical interfaces.
  uint64 network_tx_bytes_per_second = 10;
  // Time since the server booted.
  google.protobuf.Duration uptime = 11;
  // Swap in use, in bytes.
  uint64 swap_used_bytes = 12;
  // Total swap, in bytes. 0 for a server with none.
  uint64 swap_total_bytes = 13;
  // What the agent itself holds in memory (its resident set), in bytes. 0
  // from an agent from before this.
  uint64 agent_memory_bytes = 14;
  // Bytes received across physical interfaces since the server booted.
  uint64 network_rx_bytes = 15;
  // Bytes sent across physical interfaces since the server booted.
  uint64 network_tx_bytes = 16;
  // How long until the agent's next sample, at the pace it was sampling when
  // it took this one: 5 s while anyone watches the fleet, 15 s while nobody
  // does. Unset from an agent from before this, which samples every 5 s.
  google.protobuf.Duration interval = 17;
}

// DiskUsage is one filesystem's use.
message DiskUsage {
  // Where it is mounted.
  string mount_point = 1;
  // Bytes in use.
  uint64 used_bytes = 2;
  // Total size, in bytes.
  uint64 size_bytes = 3;
}

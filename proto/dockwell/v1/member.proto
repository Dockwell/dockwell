syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/auth.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// MemberService says who can sign in to the install, with their roles and how
// they sign in, and invites others: the owner and admins invite someone with
// a role in a place, the install or a project, and the person accepts with a
// passkey (AuthService.FinishAcceptInvite). See
// docs/adr/0048-members-as-far-as-one-owner-goes.md and
// docs/adr/0049-roles-and-invites-by-project.md.
//
// It names people and their emails, so only a person signed in reads it, never
// an API token. How each person signs in is theirs: everyone sees the kinds of
// sign-in each member has, and only the person asking sees their own passkeys'
// addresses, codes and browsers.
service MemberService {
  option (dockwell.v1.nouns) = {
    name: "members"
    help: "Members are the people who sign in to the install, with their roles: on the whole install, or in projects. Listing them names people and their emails, so it needs a signed-in session as an admin or the owner, which no API token gives."
  };
  option (dockwell.v1.nouns) = {
    name: "invites"
    help: "An invite asks someone, by email, to sign in with a role in a place, the install or a project. An admin or the owner makes it in the panel, with a passkey, and sends the link it shows once: Dockwell sends no mail. Making and revoking one needs a signed-in session, which no API token gives."
  };

  // ListMembers returns everyone who can sign in, oldest first.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {get: "/v1/members"};
  }

  // CreateInvite invites someone by email to sign in with a role in a place,
  // and returns the link to send them, once: Dockwell sends no mail. It takes a
  // passkey step-up bound to the email, the role and the place
  // (STEP_UP_ACTION_INVITE), and the panel's domain, which the link always
  // uses. Nobody is invited as owner, an admin's place is the install, and an
  // admin invites no one above admin. An invite to someone who signs in here
  // already is refused; a newer one to the same email replaces an open one.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/invites"
      body: "*"
    };
  }

  // RevokeInvite stops an open invite working.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/invites/{id}:revoke"
      body: "*"
    };
  }
}

// CreateInviteRequest says whom to invite, as what, and where.
message CreateInviteRequest {
  // Who the invite names, such as "ada@example.com". Unverified: it names the
  // invite in Members and on the page that accepts it.
  string email = 1;
  // ROLE_ADMIN, ROLE_DEVELOPER or ROLE_VIEWER.
  Role role = 2;
  // The project's ID or name, for a developer or a viewer of one project.
  // Empty is the whole install, which an admin's invite always is.
  string project = 3;
  // From FinishStepUp, for STEP_UP_ACTION_INVITE with the target the email,
  // lowercased, the role's name and the place, apart by spaces, as "ada@example.com
  // developer prj_…", or "install" for the whole install.
  string proof = 4;
}

// CreateInviteResponse carries the invite and its link, shown once.
message CreateInviteResponse {
  Invite invite = 1;
  // The link to send, as "https://panel.example.com/invite#…". Its secret
  // isn't kept: it can't be shown again.
  string link = 2;
}

// RevokeInviteRequest names an open invite.
message RevokeInviteRequest {
  string id = 1;
}

// RevokeInviteResponse is empty.
message RevokeInviteResponse {}

// Invite is an open invitation to sign in.
message Invite {
  string id = 1;
  // Who it names, unverified.
  string email = 2;
  Role role = 3;
  // The project, for a developer or a viewer of one. Empty for the install.
  string project_id = 4;
  // The project's name. Empty for the install.
  string project_name = 5;
  // Who made it, by name.
  string invited_by = 6;
  google.protobuf.Timestamp create_time = 7;
  // When it stops working: 7 days after it's made for a developer or a
  // viewer, 24 hours for an admin, whose link is a bearer credential to the
  // install.
  google.protobuf.Timestamp expire_time = 8;
}

// MemberGrant is a role someone holds in one project.
message MemberGrant {
  string project_id = 1;
  string project_name = 2;
  Role role = 3;
}

// ListMembersRequest takes no parameters.
message ListMembersRequest {}

// ListMembersResponse lists who can sign in.
message ListMembersResponse {
  // Everyone who can sign in, oldest first.
  repeated Member members = 1;
  // The invites that still work, newest first.
  repeated Invite invites = 2;
}

// Member is a person who can sign in, and how. The details of how are the
// person asking's alone: for anyone else, only the kinds of sign-in they have
// and when they were last active are set.
message Member {
  // Who they are, and their role.
  User user = 1;
  // True for the person asking.
  bool you = 2;
  // How many passkeys sign in at the panel's addresses now: one flagged as
  // copied, or for an address the panel no longer has, doesn't. Only for the
  // person asking.
  int32 passkeys = 3;
  // The addresses those passkeys work at, such as "localhost" or
  // "panel.example.com", each once. Only for the person asking.
  repeated string passkey_addresses = 4;
  // True when they can sign in with codes from an authenticator app now: on,
  // and not locked. Only for the person asking.
  bool authenticator = 5;
  // How many of their recovery codes are left. Zero without an
  // authenticator app. Only for the person asking.
  int32 recovery_codes_left = 6;
  // How many browsers they're signed in on now. Only for the person asking.
  int32 sessions = 7;
  // When one of their browsers was last used. Unset with none.
  google.protobuf.Timestamp last_active_time = 8;
  // The kinds of sign-in that work for them now, as the members list shows
  // them for everyone.
  repeated SignInKind sign_in = 9;
  // True when code sign-in is locked after too many wrong codes, until the
  // owner lifts it. Only for the person asking.
  bool codes_locked = 10;
  // The roles they hold in projects, by project name. Their role on the
  // whole install, which covers every project, is user.role.
  repeated MemberGrant grants = 11;
}

// SignInKind is a kind of sign-in a member has.
enum SignInKind {
  SIGN_IN_KIND_UNSPECIFIED = 0;
  // A passkey that signs in at the panel's addresses now.
  SIGN_IN_KIND_PASSKEY = 1;
  // Codes from an authenticator app, on and not locked.
  SIGN_IN_KIND_AUTHENTICATOR_APP = 2;
}

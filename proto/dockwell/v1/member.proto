syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/auth.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/token.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// MemberService says who can sign in to the install, with their roles and how
// they sign in, and invites others: the owner and admins invite someone with
// a role in a place, the install or a project, and the person accepts with a
// passkey (AuthService.FinishAcceptInvite). See
// docs/adr/0048-members-as-far-as-one-owner-goes.md and
// docs/adr/0049-roles-and-invites-by-project.md.
//
// It names people and their emails, so only a person signed in reads it, never
// an API token. How each person signs in is theirs: everyone sees the kinds of
// sign-in each member has, and only the person asking sees their own passkeys'
// addresses, codes and browsers.
service MemberService {
  option (dockwell.v1.nouns) = {
    name: "members"
    help: "Members are the people who sign in to the install, with their roles: on the whole install, or in projects. Listing them names people and their emails, so it needs a signed-in session as an admin or the owner, which no API token gives."
  };
  option (dockwell.v1.nouns) = {
    name: "invites"
    help: "An invite asks someone, by email, to sign in with a role in a place, the install or a project. An admin or the owner makes it in the panel, with a passkey, and sends the link it shows once: Dockwell sends no mail. Making and revoking one needs a signed-in session, which no API token gives."
  };

  // ListMembers returns everyone who can sign in, oldest first.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {get: "/v1/members"};
  }

  // CreateInvite invites someone by email to sign in with a role in a place,
  // and returns the link to send them, once: Dockwell sends no mail. It takes a
  // passkey step-up bound to the email, the role and the place
  // (STEP_UP_ACTION_INVITE), and the panel's domain, which the link always
  // uses. Nobody is invited as owner, an admin's place is the install, and an
  // admin invites no one above admin. An invite to someone who signs in here
  // already is refused; a newer one to the same email replaces an open one.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/invites"
      body: "*"
    };
  }

  // RevokeInvite stops an open invite working.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/invites/{id}:revoke"
      body: "*"
    };
  }
  // SetMemberRole gives someone a role in a place, the whole install or one
  // project, in place of what they held there; no role takes it back. It takes
  // a passkey step-up bound to the person, the role and the place
  // (STEP_UP_ACTION_CHANGE_ROLE). An admin holds the install, so making someone
  // one takes back their project grants. Nobody changes their own role or the
  // owner's, and taking back the last thing someone holds is refused: remove
  // them instead. Lowering what someone holds ends their sessions and revokes
  // their API tokens, and the open invites they made when they're no longer an
  // admin (docs/adr/0049-roles-and-invites-by-project.md).
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "members"
      verb: "set-role"
    };
    option (google.api.http) = {
      post: "/v1/members/{user_id}:setRole"
      body: "*"
    };
  }

  // PlanMemberRemoval reads what removing someone would end, to see before
  // removing them: their sessions, their API tokens with when each was last
  // used, the open invites they made, and the changes they planned and didn't
  // apply. It changes nothing.
  rpc PlanMemberRemoval(PlanMemberRemovalRequest) returns (PlanMemberRemovalResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "members"
      verb: "plan-removal"
    };
    option (google.api.http) = {get: "/v1/members/{user_id}/removal"};
  }

  // RemoveMember removes someone, with a passkey step-up bound to them
  // (STEP_UP_ACTION_REMOVE_MEMBER). Their sign-in goes, with their passkeys and
  // codes; their sessions end; every API token they made and every open invite
  // they made is revoked; they hold nothing; and the changes they planned and
  // didn't apply are discarded. Their name stays on what they did, and their
  // email is free to invite again. Nobody removes themselves or the owner.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "members"
      verb: "remove"
    };
    option (google.api.http) = {
      post: "/v1/members/{user_id}:remove"
      body: "*"
    };
  }

  // TransferOwnership makes someone who signs in here already the owner, with a
  // passkey step-up bound to them (STEP_UP_ACTION_TRANSFER_OWNERSHIP). Only the
  // owner calls it. The new owner holds the install at once, and whoever was
  // the owner is an admin from then; or nothing changes.
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_OWNER;
    option (dockwell.v1.min_role_protected) = NEEDS_OWNER;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "members"
      verb: "transfer-ownership"
    };
    option (google.api.http) = {
      post: "/v1/members/{user_id}:transferOwnership"
      body: "*"
    };
  }

  // ConfirmProtections records that the caller looked at which environments
  // are protected, which decides whose changes wait once someone else signs
  // in. It goes in the audit log with how each environment stood. Until it's
  // recorded, CreateInvite is refused on an install where one person signs in,
  // with the reason "protections_unconfirmed".
  rpc ConfirmProtections(ConfirmProtectionsRequest) returns (ConfirmProtectionsResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "members"
      verb: "confirm-protections"
    };
    option (google.api.http) = {
      post: "/v1/members:confirmProtections"
      body: "*"
    };
  }
}

// CreateInviteRequest says whom to invite, as what, and where.
message CreateInviteRequest {
  // Who the invite names, such as "ada@example.com". Unverified: it names the
  // invite in Members and on the page that accepts it.
  string email = 1;
  // ROLE_ADMIN, ROLE_DEVELOPER or ROLE_VIEWER.
  Role role = 2;
  // The project's ID or name, for a developer or a viewer of one project.
  // Empty is the whole install, which an admin's invite always is.
  string project = 3;
  // From FinishStepUp, for STEP_UP_ACTION_INVITE with the target the email,
  // lowercased, the role's name and the place, apart by spaces, as "ada@example.com
  // developer prj_…", or "install" for the whole install.
  string proof = 4;
}

// CreateInviteResponse carries the invite and its link, shown once.
message CreateInviteResponse {
  Invite invite = 1;
  // The link to send, as "https://panel.example.com/invite#…". Its secret
  // isn't kept: it can't be shown again.
  string link = 2;
}

// RevokeInviteRequest names an open invite.
message RevokeInviteRequest {
  string id = 1;
}

// RevokeInviteResponse is empty.
message RevokeInviteResponse {}

// Invite is an open invitation to sign in.
message Invite {
  string id = 1;
  // Who it names, unverified.
  string email = 2;
  Role role = 3;
  // The project, for a developer or a viewer of one. Empty for the install.
  string project_id = 4;
  // The project's name. Empty for the install.
  string project_name = 5;
  // Who made it, by name.
  string invited_by = 6;
  google.protobuf.Timestamp create_time = 7;
  // When it stops working: 7 days after it's made for a developer or a
  // viewer, 24 hours for an admin, whose link is a bearer credential to the
  // install.
  google.protobuf.Timestamp expire_time = 8;
}

// MemberGrant is a role someone holds in one project.
message MemberGrant {
  string project_id = 1;
  string project_name = 2;
  Role role = 3;
}

// ListMembersRequest takes no parameters.
message ListMembersRequest {}

// ListMembersResponse lists who can sign in.
message ListMembersResponse {
  // Everyone who can sign in, oldest first.
  repeated Member members = 1;
  // When someone confirmed which environments are protected, and who, by
  // name. Unset until someone has: the first invite waits for it.
  google.protobuf.Timestamp protections_confirm_time = 3;
  string protections_confirmed_by = 4;
  // The invites that still work, newest first.
  repeated Invite invites = 2;
}

// Member is a person who can sign in, and how. The details of how are the
// person asking's alone: for anyone else, only the kinds of sign-in they have
// and when they were last active are set.
message Member {
  // Who they are, and their role.
  User user = 1;
  // True for the person asking.
  bool you = 2;
  // How many passkeys sign in at the panel's addresses now: one flagged as
  // copied, or for an address the panel no longer has, doesn't. Only for the
  // person asking.
  int32 passkeys = 3;
  // The addresses those passkeys work at, such as "localhost" or
  // "panel.example.com", each once. Only for the person asking.
  repeated string passkey_addresses = 4;
  // True when they can sign in with codes from an authenticator app now: on,
  // and not locked. Only for the person asking.
  bool authenticator = 5;
  // How many of their recovery codes are left. Zero without an
  // authenticator app. Only for the person asking.
  int32 recovery_codes_left = 6;
  // How many browsers they're signed in on now. Only for the person asking.
  int32 sessions = 7;
  // When one of their browsers was last used. Unset with none.
  google.protobuf.Timestamp last_active_time = 8;
  // The kinds of sign-in that work for them now, as the members list shows
  // them for everyone.
  repeated SignInKind sign_in = 9;
  // True when code sign-in is locked after too many wrong codes, until the
  // owner lifts it. Only for the person asking.
  bool codes_locked = 10;
  // The roles they hold in projects, by project name. Their role on the
  // whole install, which covers every project, is user.role.
  repeated MemberGrant grants = 11;
  // For someone who joined with an invite: who invited them, by name, when
  // they joined, and the address they joined from.
  string invited_by = 12;
  google.protobuf.Timestamp join_time = 13;
  string joined_from = 14;
}

// SignInKind is a kind of sign-in a member has.
enum SignInKind {
  SIGN_IN_KIND_UNSPECIFIED = 0;
  // A passkey that signs in at the panel's addresses now.
  SIGN_IN_KIND_PASSKEY = 1;
  // Codes from an authenticator app, on and not locked.
  SIGN_IN_KIND_AUTHENTICATOR_APP = 2;
}

// SetMemberRoleRequest says whose role to set, to what, and where.
message SetMemberRoleRequest {
  // The person, by ID.
  string user_id = 1;
  // The role: admin, developer or viewer. Leave it unset to take back what
  // they hold in the place.
  Role role = 2;
  // The project, by name or ID, for a developer or a viewer of one. Leave it
  // out for the whole install.
  string project = 3;
  // The proof from AuthService.FinishStepUp, for STEP_UP_ACTION_CHANGE_ROLE
  // with the person's ID, the role's name ("none" for no role) and the place
  // ("install", or the project's ID), apart by spaces.
  string proof = 4;
}

// SetMemberRoleResponse is the person as they now stand, and what the change ended.
message SetMemberRoleResponse {
  Member member = 1;
  // True when the change took something from them, which ended what follows.
  bool lowered = 2;
  // How many of their sessions ended, API tokens were revoked and open invites
  // were revoked.
  int32 sessions_ended = 3;
  int32 tokens_revoked = 4;
  int32 invites_revoked = 5;
  // How many of the deploy-on-push hooks they made were deleted, as a lowering
  // ends them as it does their tokens (ADR 0046).
  int32 hooks_deleted = 6;
}

// PlanMemberRemovalRequest names someone.
message PlanMemberRemovalRequest {
  // The person, by ID.
  string user_id = 1;
}

// PlanMemberRemovalResponse is what removing them would end.
message PlanMemberRemovalResponse {
  // Who, with what they hold.
  Member member = 1;
  // How many browsers they're signed in on.
  int32 sessions = 2;
  // The API tokens they made, which would be revoked.
  repeated RemovalToken tokens = 3;
  // The open invites they made, which would be revoked.
  repeated Invite invites = 4;
  // The changes they planned and didn't apply, which would be discarded.
  repeated RemovalChange changes = 5;
  // Their accounts at sign-in providers, which would be deleted (ADR 0095).
  repeated RemovalLink links = 6;
  // The deploy-on-push hooks they made, which would be deleted (ADR 0046).
  repeated RemovalHook hooks = 7;
}

// RemovalHook is a deploy-on-push hook a removal would delete, by the app it
// deploys.
message RemovalHook {
  string service_id = 1;
  // The app's name, or its ID once it can't be read.
  string service_name = 2;
}

// RemovalToken is an API token a removal would revoke.
message RemovalToken {
  string id = 1;
  string name = 2;
  // When it was last used. Unset when it never was.
  google.protobuf.Timestamp last_used_time = 3;
  // Where it acts and as what, as Token says it (ADR 0071): the projects it's
  // narrowed to, none for every project its maker holds, and the role it acts as
  // at most.
  repeated TokenProject projects = 4;
  TokenRole role = 5;
}

// RemovalLink is an account at a sign-in provider a removal would delete.
message RemovalLink {
  // The provider's name, or its issuer's host once the provider is gone.
  string provider = 1;
  // What the provider calls the account, such as its email address.
  string account = 2;
}

// RemovalChange is a planned change a removal would discard.
message RemovalChange {
  string id = 1;
  string summary = 2;
  google.protobuf.Timestamp create_time = 3;
}

// RemoveMemberRequest names someone to remove.
message RemoveMemberRequest {
  // The person, by ID.
  string user_id = 1;
  // The proof from AuthService.FinishStepUp, for STEP_UP_ACTION_REMOVE_MEMBER
  // with the person's ID.
  string proof = 2;
}

// RemoveMemberResponse says what went with them.
message RemoveMemberResponse {
  int32 sessions_ended = 1;
  int32 tokens_revoked = 2;
  int32 invites_revoked = 3;
  // The changes of theirs that were discarded, and any that couldn't be,
  // which stay planned for whoever may apply them.
  int32 changes_discarded = 4;
  repeated string changes_left = 5;
  // How many of their accounts at sign-in providers were deleted.
  int32 links_deleted = 6;
  // How many of the deploy-on-push hooks they made were deleted (ADR 0046).
  int32 hooks_deleted = 7;
}

// TransferOwnershipRequest names the new owner.
message TransferOwnershipRequest {
  // The person, by ID: someone who signs in here already.
  string user_id = 1;
  // The proof from AuthService.FinishStepUp, for
  // STEP_UP_ACTION_TRANSFER_OWNERSHIP with the person's ID.
  string proof = 2;
}

// TransferOwnershipResponse is the new owner.
message TransferOwnershipResponse {
  Member member = 1;
}

// ConfirmProtectionsRequest takes no parameters.
message ConfirmProtectionsRequest {}

// ConfirmProtectionsResponse says when it was recorded.
message ConfirmProtectionsResponse {
  google.protobuf.Timestamp confirm_time = 1;
}

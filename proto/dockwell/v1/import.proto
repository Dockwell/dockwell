syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ImportService moves what another panel runs on a server into Dockwell: what
// can run as it is is taken on with no restart, what can't is made again, and
// the rest is left with why. Each import is a plan a person applies. See
// docs/adr/0056-importing-a-1panel-server.md.
service ImportService {
  // ImportOnePanel reads what 1Panel keeps on a server: its apps from its store,
  // runtimes, websites, certificates, databases and cron jobs. It says what
  // Dockwell would do with each and why: take it on as it runs, make it again,
  // or leave it, and which issue it waits for where Dockwell can't yet. For a
  // person, it also plans the change that takes on each app and runtime that
  // can come as it runs, reading each container as AdoptCompose does: one that
  // can't come stays, with why. A token gets what was found and no change, as a
  // plan that takes a container on shows what a token can't read. The agent
  // reads 1Panel's records read-only, and nothing secret comes back from them:
  // no password, key, script, environment or URL path.
  rpc ImportOnePanel(ImportOnePanelRequest) returns (ImportOnePanelResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "import"
      verb: "1panel"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/imports:onepanel"
      body: "*"
    };
  }

  // ImportCoolify reads what Coolify runs on a server, from Docker and its
  // folders, never its database or its API: its applications, services and
  // databases, their domains, and its own containers. It says what Dockwell would
  // do with each and why. For a person, it also plans the change that takes on
  // each that runs as a Compose project, as AdoptCompose does, with its volumes
  // where they are. A token gets what was found and no change. Nothing secret
  // comes back from the read: no environment, and no label beyond a domain. See
  // docs/adr/0089-importing-from-coolify-and-dokploy.md.
  rpc ImportCoolify(ImportCoolifyRequest) returns (ImportCoolifyResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "import"
      verb: "coolify"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/imports:coolify"
      body: "*"
    };
  }

  // ImportDokploy reads what Dokploy runs on a server, from Docker and its
  // folders, never its database or its API, as ImportCoolify does: its Compose
  // apps, applications and databases, their domains, and its own services. It
  // plans taking on each Compose app it runs with docker compose; what it runs as
  // a Swarm service stays, with why.
  rpc ImportDokploy(ImportDokployRequest) returns (ImportDokployResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "import"
      verb: "dokploy"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/imports:dokploy"
      body: "*"
    };
  }

  // PlanStartPanel plans starting the panel an import came from again: each of
  // its own containers or services that's stopped starts, a container with the
  // restart policy its installer gives it where a stop left it at no. It's the
  // way back where no undo is: a change that failed partway, or an undo after
  // its window. A person applies it.
  rpc PlanStartPanel(PlanStartPanelRequest) returns (PlanStartPanelResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "import"
      verb: "start-panel"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/imports:startPanel"
      body: "*"
    };
  }

  // PlanStopPanel plans stopping the panel an import came from: Coolify's own
  // containers, or Dokploy's own Swarm services, never what it ran, so its auto
  // deploys and its scheduled tasks stop with it. Its proxy goes on running, as it
  // serves the domains of what was taken on until those come as routes. Each
  // container's restart policy becomes "no", so it stays stopped with Docker and
  // the server. It's an edit of the server's host that makes no revision, as an
  // action on a system service is; nothing of the panel is deleted, and undoing
  // it starts each again as it stood. A person applies it.
  rpc PlanStopPanel(PlanStopPanelRequest) returns (PlanStopPanelResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "import"
      verb: "stop-panel"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/imports:stopPanel"
      body: "*"
    };
  }
}

// PlanStartPanelRequest names the server and the panel to start there again.
message PlanStartPanelRequest {
  // The server the panel runs on, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The panel to start.
  PanelKind panel = 2;
  // What the change is for, for the timeline. Empty says what it starts.
  string summary = 3;
}

// PlanStartPanelResponse carries the planned start.
message PlanStartPanelResponse {
  // The change, planned for a person to apply.
  Change change = 1;
}

// PlanStopPanelRequest names the server and the panel to stop there.
message PlanStopPanelRequest {
  // The server the panel runs on, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The panel to stop.
  PanelKind panel = 2;
  // What the change is for, for the timeline. Empty says what it stops.
  string summary = 3;
}

// PlanStopPanelResponse carries the planned stop.
message PlanStopPanelResponse {
  // The change, planned for a person to apply.
  Change change = 1;
}

// ImportCoolifyRequest names the server to import from.
message ImportCoolifyRequest {
  // The server running Coolify, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Read and say what an import would do, and plan nothing, for a client that
  // plans only when a person asks to review it.
  bool skip_plan = 2;
}

// ImportCoolifyResponse is what Coolify runs on the server, and what an import
// would do with each thing.
message ImportCoolifyResponse {
  // What was found, as Docker and Coolify's folders say.
  Panel found = 1;
  // What an import would do, a step for each thing found, in the order the plan
  // would take them.
  repeated ImportStep steps = 2;
  // The change that takes on what can come now, planned for a person to apply.
  // Empty for a token, where nothing can come, and where Dockwell can't read what
  // runs on the server now.
  Change change = 3;
}

// ImportDokployRequest names the server to import from.
message ImportDokployRequest {
  // The server running Dokploy, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Read and say what an import would do, and plan nothing.
  bool skip_plan = 2;
}

// ImportDokployResponse is what Dokploy runs on the server, and what an import
// would do with each thing, as ImportCoolifyResponse is.
message ImportDokployResponse {
  // What was found, as Docker and Dokploy's folders say.
  Panel found = 1;
  // What an import would do with each thing found.
  repeated ImportStep steps = 2;
  // The change that takes on what can come now, as ImportCoolifyResponse's.
  Change change = 3;
}

// PanelKind is a panel an import reads from Docker and its folders.
enum PanelKind {
  PANEL_KIND_UNSPECIFIED = 0;
  // Coolify, which runs what it deploys with docker compose.
  PANEL_KIND_COOLIFY = 1;
  // Dokploy, which runs Compose apps with docker compose or as Swarm stacks, and
  // its applications and databases as Swarm services.
  PANEL_KIND_DOKPLOY = 2;
}

// Panel is what a panel runs on a server, as Docker and its folders say, with
// nothing secret in it.
message Panel {
  // Which panel it is.
  PanelKind kind = 1;
  // Its version, from its own image's tag, such as "4.7.5" or "v0.31.2". Empty
  // where its own containers aren't there to say.
  string version = 2;
  // True when its version is one this importer was written from: Coolify 4.7 and
  // Dokploy 0.31. Another is read the same way, by its labels and folders.
  bool known_version = 3;
  // The folder it keeps what it runs in, such as "/data/coolify" or
  // "/etc/dokploy".
  string folder = 4;
  // What it runs for people: apps, services and databases.
  repeated PanelApp apps = 5;
  // Its own containers and services, such as coolify-db or dokploy-traefik.
  repeated PanelContainer own = 6;
}

// PanelApp is something a panel runs for people: an app, a service from its
// templates, or a database.
message PanelApp {
  // Its name, as the panel shows it, slugged as its labels have it, such as
  // "blog".
  string name = 1;
  // What it is: "application", "service" or "database" for Coolify; "compose",
  // "stack", "application", or a database engine such as "postgres" for Dokploy.
  string kind = 2;
  // The panel's project and environment it's in, such as "personal" and
  // "production".
  string project = 3;
  string environment = 4;
  // The panel's own ID for it: Coolify's UUID, or Dokploy's appName.
  string id = 5;
  // The Compose project its containers run as, where docker compose runs it.
  string compose_project = 6;
  // Its containers, by name.
  repeated string containers = 7;
  // The domains it answers on, as the panel's proxy has them.
  repeated string domains = 8;
  // Its folder, such as "/data/coolify/services/<uuid>".
  string folder = 9;
  // True when it runs as a Swarm service or stack, which Dockwell can't take on in
  // place.
  bool swarm = 10;
  // True for a pull request's preview, which the panel makes and removes itself.
  bool preview = 11;
  // The image it runs, where it's one: a Swarm service's, or a database's.
  string image = 12;
  // True when the panel deploys it from a Git repository, where a push can deploy
  // it again: Coolify's application built from a commit, or Dokploy's app whose
  // code folder is a Git checkout. Both panels deploy on a push by default.
  bool from_git = 13;
}

// PanelContainer is one of a panel's own containers or Swarm services.
message PanelContainer {
  // Its name, such as "coolify-proxy".
  string name = 1;
  // Its image.
  string image = 2;
  // What it's doing, such as "running" or "exited", or "service" for a Swarm
  // service.
  string state = 3;
}

// ImportOnePanelRequest names the server to import from.
message ImportOnePanelRequest {
  // The server running 1Panel, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Read and say what an import would do, and plan nothing, for a client that
  // plans only when a person asks to review it.
  bool skip_plan = 2;
}

// ImportOnePanelResponse is what 1Panel keeps on the server, and what an import
// would do with each.
message ImportOnePanelResponse {
  // What was found, as 1Panel's records say.
  OnePanel found = 1;
  // What an import would do, a step for each thing found, in the order the
  // plan would take them.
  repeated ImportStep steps = 2;
  // The change that takes on what can come now, planned for a person to apply.
  // Empty for a token, where nothing can come, and where Dockwell can't read
  // what runs on the server now.
  Change change = 3;
}

// ImportStep is one thing found, and what an import would do with it.
message ImportStep {
  // What it is.
  ImportKind kind = 1;
  // Its name, as 1Panel shows it, such as "wordpress" or "blog.example.com".
  string name = 2;
  // What it is, in a few words, such as "mysql 8.4.3 from 1Panel's store".
  string summary = 3;
  // What an import would do with it.
  ImportAction action = 4;
  // What it would become, in a few words, such as "a Compose project, wordpress,
  // taken on as it runs".
  string becomes = 5;
  // Why, and what a person can do about it, where that isn't plain.
  string reason = 6;
  // The part of Dockwell it waits for, where Dockwell can't take it yet.
  ImportWaitsFor waits_for = 7;
}

// ImportWaitsFor is a part of Dockwell an imported thing waits for, which a
// client words in its own language.
enum ImportWaitsFor {
  IMPORT_WAITS_FOR_UNSPECIFIED = 0;
  // Websites, with their domains and certificates.
  IMPORT_WAITS_FOR_WEBSITES = 1;
  // Databases, with their users.
  IMPORT_WAITS_FOR_DATABASES = 2;
  // Scheduled tasks.
  IMPORT_WAITS_FOR_SCHEDULED_TASKS = 3;
  // Firewall rules.
  IMPORT_WAITS_FOR_FIREWALL = 4;
}

// ImportKind is a kind of thing another panel keeps.
enum ImportKind {
  IMPORT_KIND_UNSPECIFIED = 0;
  // An app from the panel's store, which runs as a Compose project.
  IMPORT_KIND_APP = 1;
  // A runtime: PHP, Node, Java, Go, Python or .NET.
  IMPORT_KIND_RUNTIME = 2;
  // A website.
  IMPORT_KIND_WEBSITE = 3;
  // A certificate for a website.
  IMPORT_KIND_CERTIFICATE = 4;
  // A database server, local or remote.
  IMPORT_KIND_DATABASE_SERVER = 5;
  // A database on a server, with its user.
  IMPORT_KIND_DATABASE = 6;
  // A job the panel runs on a schedule.
  IMPORT_KIND_CRON_JOB = 7;
  // What the panel keeps for itself, such as its firewall's or its own settings.
  IMPORT_KIND_PANEL = 8;
  // A Compose project made on the panel's Containers page, outside its store.
  IMPORT_KIND_COMPOSE_PROJECT = 9;
  // Containers the panel started on their own, which it keeps no record of.
  IMPORT_KIND_CONTAINERS = 10;
}

// ImportAction is what an import does with a thing it found.
enum ImportAction {
  IMPORT_ACTION_UNSPECIFIED = 0;
  // Taken on as it runs, with no restart (docs/adr/0031-containers-dockwell-didnt-make.md).
  IMPORT_ACTION_TAKE_ON = 1;
  // Made again in Dockwell, as what it was.
  IMPORT_ACTION_MAKE = 2;
  // Left as it is, with the reason.
  IMPORT_ACTION_LEAVE = 3;
  // In Dockwell already, from an import before: becomes says as what.
  IMPORT_ACTION_DONE = 4;
}

// OnePanel is what 1Panel keeps on a server, as its records say, with nothing
// secret in it.
message OnePanel {
  // Its version, from its own records, such as "v2.4.2".
  string version = 1;
  // The folder it's installed under, "/opt" unless the person chose another.
  string base_dir = 2;
  // Its database, such as "/opt/1panel/db/agent.db".
  string records = 3;
  // True when its version is one this importer was written from: v2.0 to v2.4.2,
  // and v1.10. Another is read the same way, by column names.
  bool known_version = 4;
  // Its apps from its store, the database servers it runs among them.
  repeated OnePanelApp apps = 5;
  // Its runtimes.
  repeated OnePanelRuntime runtimes = 6;
  // Its websites.
  repeated OnePanelWebsite websites = 7;
  // Its certificates.
  repeated OnePanelCertificate certificates = 8;
  // Its database servers.
  repeated OnePanelDatabaseServer database_servers = 9;
  // The databases on them.
  repeated OnePanelDatabase databases = 10;
  // Its cron jobs.
  repeated OnePanelCronJob cron_jobs = 11;
  // The Compose projects made on its Containers page, outside its store.
  repeated OnePanelCompose composes = 12;
}

// OnePanelCompose is a Compose project made on 1Panel's Containers page, which
// runs with its name as its project's.
message OnePanelCompose {
  // Its name, which is its Compose project's.
  string name = 1;
  // Its Compose file.
  string file = 2;
}

// OnePanelApp is an install of an app from 1Panel's store.
message OnePanelApp {
  // The install's name, which is its folder's and its Compose project's.
  string name = 1;
  // The store's key for the app, such as "mysql".
  string app_key = 2;
  // The app's name in the store, such as "MySQL".
  string app_name = 3;
  // The version installed.
  string version = 4;
  // What 1Panel last saw it doing, such as "Running" or "Stopped".
  string status = 5;
  // Which store it came from: "remote", 1Panel's own; "local", one of the
  // person's; or "custom".
  string store = 6;
  // Its folder, with its Compose file.
  string folder = 7;
  // Its main container's name.
  string container = 8;
  // The port it publishes for HTTP, where it has one.
  uint32 http_port = 9;
  // The port it publishes for HTTPS, where it has one.
  uint32 https_port = 10;
}

// OnePanelRuntime is a runtime: a Compose project that runs a language.
message OnePanelRuntime {
  // Its name.
  string name = 1;
  // Its language: "php", "node", "java", "go", "python" or "dotnet".
  string type = 2;
  // The language's version.
  string version = 3;
  // What 1Panel last saw it doing.
  string status = 4;
  // The image it runs.
  string image = 5;
  // Its folder, with its Compose file.
  string folder = 6;
  // The folder of the code it runs, where it has one.
  string code_folder = 7;
  // Its container's name.
  string container = 8;
}

// OnePanelWebsite is a website 1Panel's OpenResty serves.
message OnePanelWebsite {
  // Its alias, which names its folder and its config.
  string alias = 1;
  // Its first domain.
  string primary_domain = 2;
  // What it is: "static", "runtime" for PHP and the like, "proxy",
  // "deployment" for an app's site, "subsite" or "stream".
  string type = 3;
  // The domains and ports it answers.
  repeated OnePanelDomain domains = 4;
  // The folder it serves: its own folder's "index", or the folder under it it
  // runs from, such as "index/public" for a Laravel site.
  string folder = 5;
  // Where a proxy sends, as a scheme, host and port, with no path.
  string proxy = 6;
  // The runtime it runs on, by name.
  string runtime = 7;
  // The app it serves, by install name.
  string app = 8;
  // The certificate it uses, by its first domain.
  string certificate = 9;
  // True when it has rewrite rules.
  bool rewrite = 10;
  // True when it's served over HTTPS.
  bool https = 11;
  // What 1Panel last saw it doing, such as "Running" or "Stopped".
  string status = 12;
  // The site it's under, for a subsite.
  string parent = 13;
}

// OnePanelDomain is a domain a website answers, on a port.
message OnePanelDomain {
  // The domain.
  string domain = 1;
  // The port.
  uint32 port = 2;
  // True when it's served over HTTPS.
  bool https = 3;
}

// OnePanelCertificate is a certificate 1Panel keeps for websites. Its key and
// chain aren't read.
message OnePanelCertificate {
  // Its first domain.
  string primary_domain = 1;
  // The other domains it covers.
  repeated string domains = 2;
  // How it was got, as 1Panel's provider column says it: "http" or
  // "dnsAccount" from an ACME server, "dnsManual" from one with DNS records set
  // by hand, "manual" uploaded, "selfSigned" from 1Panel's own CA, or
  // "fromMaster" from the 1Panel that manages this one.
  string kind = 3;
  // The ACME account's CA, as 1Panel names it, such as "letsencrypt", "zerossl"
  // or "custom", for one got from an ACME server.
  string provider = 4;
  // When it ends.
  google.protobuf.Timestamp expires = 5;
  // True when 1Panel renews it.
  bool auto_renew = 6;
  // Who issued it: the issuer's organization, or its common name.
  string issuer = 7;
}

// OnePanelDatabaseServer is a database server 1Panel knows: one of its store's,
// or one on another machine.
message OnePanelDatabaseServer {
  // Its name in 1Panel.
  string name = 1;
  // Its kind, such as "mysql", "mariadb", "postgresql", "redis" or "mongodb".
  string type = 2;
  // Its version.
  string version = 3;
  // True when it runs on this server, as one of 1Panel's apps.
  bool local = 4;
  // The app it is, by install name, when it's local.
  string app = 5;
  // Its port.
  uint32 port = 6;
}

// OnePanelDatabase is a database on one of 1Panel's database servers, and the
// user 1Panel made for it. The user's password isn't read.
message OnePanelDatabase {
  // The database's name.
  string name = 1;
  // The server it's on, by its name in 1Panel.
  string server = 2;
  // Its server's kind.
  string type = 3;
  // The user 1Panel made for it.
  string user = 4;
  // Its character set or encoding, such as "utf8mb4".
  string format = 5;
}

// OnePanelCronJob is a job 1Panel's own scheduler runs. Its script, command and
// URL path aren't read.
message OnePanelCronJob {
  // Its name.
  string name = 1;
  // Its kind, as 1Panel says it: "shell", "curl", "app", "website",
  // "database", "directory", "snapshot", "log", "ntp", "cutWebsiteLog",
  // "clean", "cleanLog" or "syncIpGroup".
  string type = 2;
  // When it runs, as a cron schedule. 1Panel can keep several, a line each.
  string schedule = 3;
  // What 1Panel last saw it doing, such as "Enable" or "Disable".
  string status = 4;
  // The container a shell job runs in, where it runs in one.
  string container = 5;
  // What it backs up or acts on: apps', websites' or databases' names, comma
  // separated, "all" for every one, or a folder.
  string target = 6;
  // The host a URL job calls, without its path or query.
  string url_host = 7;
  // How many lines a shell job's script has, where it's written in the job or
  // in 1Panel's library.
  uint32 script_lines = 8;
  // Where a shell job's script is: "input", written in the job; "library", one
  // of 1Panel's library scripts, named in script_name; or "select", a file on
  // the server, at script_path.
  string script_from = 9;
  // The name of the library script a shell job runs.
  string script_name = 10;
  // The file on the server a shell job runs.
  string script_path = 11;
  // What runs a shell job's script, such as "bash" or "python3".
  string interpreter = 12;
  // Who a shell job runs as, in its container or on the server, where 1Panel
  // says.
  string user = 13;
  // The kind of database a database backup is of, as 1Panel says it: "mysql",
  // "mariadb", "postgresql" or "mongodb".
  string database_type = 14;
}

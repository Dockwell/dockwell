syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/options.proto";
import "dockwell/v1/system.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// SettingsService reads and changes the install's own settings: what it's
// called, the time zone its schedules start in, and how its panel is served.
// It also says what the control plane is, and how it's doing.
//
// None of these is managed state: they change what Dockwell says and suggests,
// not what runs on a server, so a change needs no plan. Each is on the activity
// log, with what it replaced. How the panel is served comes from how dockwell
// run was started, and changes there. See docs/adr/0042-the-installs-settings.md.
service SettingsService {
  option (dockwell.v1.nouns) = {
    name: "settings"
    help: "The install's settings are what it's called, the time zone new schedules start in, and how its panel is served. They change what Dockwell says and suggests, not what runs, so a change needs no plan, and each is on the activity log with what it replaced."
  };
  option (dockwell.v1.nouns) = {
    name: "control-plane"
    help: "The control plane serves the panel and API, beside an agent of its own. It says the build it runs, where it keeps its state and the install's key, the addresses it answers on, and how it's doing. Most of that comes from how dockwell run was started, and changes there."
  };

  // GetSettings returns the install's settings, and how its panel is served.
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SHARED;
    option (dockwell.v1.command) = {
      noun: "settings"
      verb: "get"
    };
    option (google.api.http) = {get: "/v1/settings"};
  }

  // SetInstallName names the install, as the sign-in screen and the browser's
  // tabs say it. An empty name goes back to none, where they say Dockwell. The
  // sign-in screen shows it to anyone who reaches the panel, so only a person
  // signed in can set it, never an API token.
  rpc SetInstallName(SetInstallNameRequest) returns (SetInstallNameResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "settings"
      verb: "set-name"
    };
    option (google.api.http) = {
      post: "/v1/settings:setName"
      body: "*"
    };
  }

  // SetTimeZone sets the time zone a new schedule starts in, such as a
  // backup's, when it comes without one of its own. A schedule keeps the zone
  // it was made with, so this moves none. An empty zone clears it, and new
  // schedules start in UTC again.
  rpc SetTimeZone(SetTimeZoneRequest) returns (SetTimeZoneResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "settings"
      verb: "set-time-zone"
    };
    option (google.api.http) = {
      post: "/v1/settings:setTimeZone"
      body: "*"
    };
  }

  // GetControlPlane returns what serves the panel and API: its build, where it
  // keeps its state, the addresses it answers on, and how it's doing. Most of
  // it comes from how dockwell run was started, and changes there.
  //
  // A call with an API token gets no paths, no state store location and no
  // agent URLs: they say where the key and the store are, and the panel needs
  // them only for a person signed in, to say how to back the control plane up.
  rpc GetControlPlane(GetControlPlaneRequest) returns (GetControlPlaneResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.command) = {
      noun: "control-plane"
      verb: "get"
    };
    option (google.api.http) = {get: "/v1/controlPlane"};
  }
}

// GetSettingsRequest takes no parameters.
message GetSettingsRequest {}

// GetSettingsResponse carries the install's settings.
message GetSettingsResponse {
  // The settings.
  Settings settings = 1;
}

// Settings are the install's own settings.
message Settings {
  // What the install is called, such as "Acme servers". Empty when nobody has
  // named it, where the panel says Dockwell.
  string name = 1;
  // The time zone a new schedule starts in when it comes without one of its
  // own, as the IANA names it, such as "Europe/Amsterdam" or "UTC". Empty
  // when nobody has set one, and new schedules then start in UTC.
  string time_zone = 2;
  // How the panel is served.
  PanelServing panel = 3;
  // When the install was set up.
  google.protobuf.Timestamp create_time = 4;
}

// PanelServing is how the panel is served, as dockwell run was started.
message PanelServing {
  // The loopback address it always answers on, such as "127.0.0.1:7600", which
  // an SSH tunnel reaches.
  string listen = 1;
  // The domain it also answers on over HTTPS, such as "panel.example.com".
  // Empty when it has none, and answers only on loopback.
  string domain = 2;
  // What serves it over HTTPS on its domain.
  PanelServedBy served_by = 3;
  // The address Dockwell serves HTTPS on itself, such as "[::]:443", with
  // PANEL_SERVED_BY_DOCKWELL. Empty otherwise.
  string https_listen = 4;
  // The panel's address on its domain, with its port when that isn't 443,
  // such as "https://panel.example.com" or "https://panel.example.com:8443".
  // Empty without a domain.
  string url = 5;
  // Who issues the certificate Dockwell serves the domain with: "Let's
  // Encrypt", or the host of the ACME directory dockwell run was given, such
  // as "acme.example.com". Empty without a domain.
  string certificate_authority = 6;
}

// PanelServedBy is what serves the panel over HTTPS on its domain.
enum PanelServedBy {
  PANEL_SERVED_BY_UNSPECIFIED = 0;
  // Nothing: the panel has no domain, and answers only on loopback.
  PANEL_SERVED_BY_NONE = 1;
  // Dockwell itself, with a certificate from an ACME CA, Let's Encrypt unless
  // dockwell run names another, renewed as it runs out.
  PANEL_SERVED_BY_DOCKWELL = 2;
  // The server's ingress, Caddy, which holds ports 80 and 443 while the server
  // has a route, and serves the panel's domain with its own certificate (ADR
  // 0024). The panel takes them back when the last route goes.
  PANEL_SERVED_BY_INGRESS = 3;
}

// SetInstallNameRequest names the install.
message SetInstallNameRequest {
  // The name, at most 64 characters. Empty clears it.
  string name = 1;
}

// SetInstallNameResponse carries the settings as they now are.
message SetInstallNameResponse {
  // The settings.
  Settings settings = 1;
}

// SetTimeZoneRequest sets the time zone new schedules start in.
message SetTimeZoneRequest {
  // The zone as the IANA names it, such as "Europe/Amsterdam" or "UTC". Empty
  // clears it, and new schedules start in UTC again.
  string time_zone = 1;
}

// SetTimeZoneResponse carries the settings as they now are.
message SetTimeZoneResponse {
  // The settings.
  Settings settings = 1;
}

// GetControlPlaneRequest takes no parameters.
message GetControlPlaneRequest {}

// GetControlPlaneResponse describes the control plane that answers.
message GetControlPlaneResponse {
  // The control plane.
  ControlPlane control_plane = 1;
}

// ControlPlane is the dockwell run that serves the panel and API, with the
// agent it runs beside them.
message ControlPlane {
  // The build it runs.
  BuildInfo build = 1;
  // When it started.
  google.protobuf.Timestamp start_time = 2;
  // The directory it keeps its files in, such as "/var/lib/dockwell". Empty
  // for an API token.
  string data_dir = 3;
  // The install's key, which opens every secret the state store keeps, such
  // as "/var/lib/dockwell/control/key". A backup of the store needs it too,
  // kept apart. Empty for an API token.
  string key_file = 4;
  // Where it keeps its state.
  StateStore store = 5;
  // How the panel is served.
  PanelServing panel = 6;
  // Where servers' agents reach it.
  AgentListener agents = 7;
  // The memory it holds, with its own agent's, in bytes: its resident set.
  // Zero where the system doesn't say.
  int64 memory_bytes = 8;
  // What runs it as a service, and so stops and starts it.
  ServiceManager service_manager = 9;
}

// ServiceManager is what runs dockwell run as a service on the control server.
enum ServiceManager {
  SERVICE_MANAGER_UNSPECIFIED = 0;
  // Nothing: it was started by hand, or in a container, and stops as it was
  // started.
  SERVICE_MANAGER_NONE = 1;
  // systemd, as the dockwell unit: systemctl stop dockwell.
  SERVICE_MANAGER_SYSTEMD = 2;
  // OpenRC, as the dockwell service: rc-service dockwell stop.
  SERVICE_MANAGER_OPENRC = 3;
}

// StateStore is the database the control plane keeps its state in.
message StateStore {
  // What kind of database it is.
  StateStoreEngine engine = 1;
  // Where it is: a SQLite file's path, or a Postgres URL without its
  // password. Empty for an API token.
  string location = 2;
  // The database's own version, such as "3.50.4" or "17.2".
  string version = 3;
  // Its size on disk, in bytes.
  int64 size_bytes = 4;
  // How long a query that reads nothing took, just now.
  google.protobuf.Duration round_trip = 5;
}

// StateStoreEngine is a kind of database the control plane can keep its state in.
enum StateStoreEngine {
  STATE_STORE_ENGINE_UNSPECIFIED = 0;
  // A SQLite file beside the control plane, for one control plane.
  STATE_STORE_ENGINE_SQLITE = 1;
  // A Postgres database, ahead of running more than one.
  STATE_STORE_ENGINE_POSTGRES = 2;
}

// AgentListener is where servers' agents reach the control plane.
message AgentListener {
  // The address it listens on, such as ":7443".
  string listen = 1;
  // The URL a server on the control server's own network reaches it at, as
  // a join ticket names it, such as "https://192.0.2.10:7443". Empty for an
  // API token.
  string url = 2;
  // The URLs a server elsewhere reaches it at, in the order a ticket tries
  // them. Empty when that isn't known, and for an API token.
  repeated string public_urls = 3;
}

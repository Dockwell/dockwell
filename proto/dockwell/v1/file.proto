syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/api/httpbody.proto";
import "google/protobuf/timestamp.proto";

// FileService browses, reads, saves, makes, moves and deletes the files on a
// server, through its agent. Files on a server aren't managed state, so
// nothing here is a revision or has a plan. A save can't be undone, and a
// delete can for 7 days where it's on the same filesystem as Dockwell's data.
// See docs/adr/0032-files-on-a-server.md and
// docs/adr/0045-a-file-manager-on-a-server.md.
//
// Every method needs a signed-in session: no API token can call them, whatever
// its scope. The agent refuses what holds Dockwell's keys, secrets' values and
// the server's own credentials for everyone, with the reason "file_refused":
// docs/security/files.md lists them.
service FileService {
  // ListFiles returns what a directory on a server holds, by name. It follows
  // symlinks, and path in the response says where it ended up. It returns at
  // most 5,000 entries. No API token can call it.
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "list"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/files"};
  }

  // ReadFile returns a file on a server as text: its first 1 MiB, or nothing
  // when it isn't UTF-8 text. No API token can call it. Every read is in the
  // audit log.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "read"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:read"
      body: "*"
    };
  }

  // SaveFile replaces a file's text, if the file is still as ReadFile gave it. A
  // file that changed since fails with the reason "file_changed", and nothing is
  // written. It can't be undone. No API token can call it. Every save is in the
  // audit log, and on the timeline.
  rpc SaveFile(SaveFileRequest) returns (SaveFileResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "save"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:save"
      body: "*"
    };
  }

  // MakeFile makes an empty file, or a folder with nothing in it, never over
  // what's there, which fails with the reason "file_exists". It takes its
  // folder's owner and group. No API token can call it. Each one is on the
  // timeline. See docs/adr/0045-a-file-manager-on-a-server.md.
  rpc MakeFile(MakeFileRequest) returns (MakeFileResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "make"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:make"
      body: "*"
    };
  }

  // MoveFile moves or renames a file or a folder, within one filesystem,
  // never over what's there. A symlink moves as itself. A move to another
  // disk fails with the reason "other_disk". No API token can call it. Each
  // one is on the timeline.
  rpc MoveFile(MoveFileRequest) returns (MoveFileResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "move"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:move"
      body: "*"
    };
  }

  // DeleteFile deletes a file or a folder. It goes to Recently deleted for 7
  // days, from where RestoreFile puts it back, when it's on the same
  // filesystem as Dockwell's data. Elsewhere it fails with the reason
  // "delete_for_good" unless for_good is set. A symlink goes as itself. No
  // API token can call it. Each one is on the timeline.
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "delete"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:delete"
      body: "*"
    };
  }

  // ListDeletedFiles returns what's in a server's Recently deleted, newest
  // first. No API token can call it.
  rpc ListDeletedFiles(ListDeletedFilesRequest) returns (ListDeletedFilesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "list-deleted"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/deleted-files"};
  }

  // RestoreFile puts back what was deleted, at the path it was deleted from,
  // never over what's there now. No API token can call it. Each one is on
  // the timeline.
  rpc RestoreFile(RestoreFileRequest) returns (RestoreFileResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "restore"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/deleted-files/{id}:restore"
      body: "*"
    };
  }

  // PurgeDeletedFile deletes for good what's in Recently deleted, which
  // frees its space at once. No API token can call it. Each one is on the
  // timeline.
  rpc PurgeDeletedFile(PurgeDeletedFileRequest) returns (PurgeDeletedFileResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "purge"
    };
    option (google.api.http) = {delete: "/v1/servers/{server_id}/deleted-files/{id}"};
  }

  // BeginUpload starts an upload of a file of size_bytes to path, never over
  // what's there, and says how far an upload got when upload_id names one,
  // to pick it up again after a dropped connection. A file takes at most
  // 16 GB (max_bytes), and what the server's disk has room for. Send it with
  // UploadFile, then put it in place with FinishUpload, or stop it with
  // CancelUpload. An upload is the session's that began it: from any other,
  // each of these says there's no such upload. An upload not finished within
  // a day goes. No API token can call it. See
  // docs/adr/0045-a-file-manager-on-a-server.md.
  rpc BeginUpload(BeginUploadRequest) returns (BeginUploadResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "begin-upload"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/uploads"
      body: "*"
    };
  }

  // UploadFile sends an upload's bytes, from offset, which has to be how far
  // it got, as BeginUpload says. The agent writes them as they come, a part at
  // a time. Over REST it's a PUT whose body is the bytes, which the control
  // plane passes on a frame at a time, and it answers with how far the upload
  // got. A large file can go as several PUTs, each from where the last ended,
  // as a proxy in front may limit how large a request is. A write from
  // elsewhere fails with the reason "upload_offset", and writes nothing. No
  // API token can call it.
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "upload"
    };
    option (google.api.http) = {
      put: "/v1/servers/{server_id}/uploads/{upload_id}"
      body: "content"
    };
  }

  // FinishUpload puts an upload in place, once all of it is there, and
  // unpacks it into a new folder beside it when BeginUpload asked to. It takes
  // its folder's owner and group. No API token can call it. Each one is on the
  // timeline.
  rpc FinishUpload(FinishUploadRequest) returns (FinishUploadResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "finish-upload"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/uploads/{upload_id}:finish"
      body: "*"
    };
  }

  // CancelUpload stops an upload and removes what it has so far, from the
  // session that began it. An upload left alone goes after a day anyway. No API
  // token can call it.
  rpc CancelUpload(CancelUploadRequest) returns (CancelUploadResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "cancel-upload"
    };
    option (google.api.http) = {delete: "/v1/servers/{server_id}/uploads/{upload_id}"};
  }

  // DownloadFile sends a file as it is, or a folder (or several selected paths)
  // as a zip archive, as it reads it. Over REST it's a GET whose body is the
  // file, written as it's read, for a browser to save; one that stops partway
  // cuts the connection, so it can't pass for the whole. What a read refuses, a
  // download does, and one stops at a private key in what it sends. No API
  // token can call it. Each one is on the timeline, before anything goes out.
  rpc DownloadFile(DownloadFileRequest) returns (stream DownloadFileResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "download"
    };
    option (google.api.http) = {
      get: "/v1/servers/{server_id}/files:download"
      response_body: "body"
    };
  }

  // CompressFiles starts a job that packs one or more files or folders into a
  // new zip archive on the server, never over what's there. Preflight checks
  // run first, then the job runs on the agent so it outlives proxy request
  // timeouts. Poll GetArchiveJob or ListArchiveJobs for progress and outcome.
  // What a read refuses is left out and counted, and any private key or
  // password hash stops it. No API token can call it. Each one is on the
  // timeline.
  rpc CompressFiles(CompressFilesRequest) returns (CompressFilesResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "compress"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:compress"
      body: "*"
    };
  }

  // ExtractArchive starts a job that unpacks an existing .zip, .tar.gz or .tgz
  // archive on the server into a new folder beside it, never over what's
  // there. Preflight checks run first, then the job runs on the agent so it
  // outlives proxy request timeouts. Poll GetArchiveJob or ListArchiveJobs for
  // progress and outcome. Symlinks and special files are skipped and counted;
  // unsafe paths and way-in entries stop it all-or-nothing. No API token can
  // call it. Each one is on the timeline.
  rpc ExtractArchive(ExtractArchiveRequest) returns (ExtractArchiveResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "extract"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:extract"
      body: "*"
    };
  }

  // GetArchiveJob returns the current state, progress and outcome of a
  // compress or extract job started by the caller on a server. No API token
  // can call it.
  rpc GetArchiveJob(GetArchiveJobRequest) returns (GetArchiveJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "archive-job"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/archive-jobs/{job_id}"};
  }

  // ListArchiveJobs returns active and recently finished compress and extract
  // jobs started by the caller on a server. No API token can call it.
  rpc ListArchiveJobs(ListArchiveJobsRequest) returns (ListArchiveJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "archive-jobs"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/archive-jobs"};
  }

  // ListFileAccounts lists users and groups on the server.
  rpc ListFileAccounts(ListFileAccountsRequest) returns (ListFileAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "accounts"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/files/accounts"};
  }

  // ChangeFileAccess changes mode or ownership on a file or folder.
  rpc ChangeFileAccess(ChangeFileAccessRequest) returns (ChangeFileAccessResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "change-access"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:changeAccess"
      body: "*"
    };
  }

  // CalculateFolderSize calculates the logical size visible under a folder, up to the scan limits.
  rpc CalculateFolderSize(CalculateFolderSizeRequest) returns (CalculateFolderSizeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "folder-size"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/files/folderSize"};
  }

  // SearchFiles finds matching names or text below a folder, up to the scan limits.
  // Search terms may contain file text, so they go in the body of a POST.
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "search"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:search"
      body: "*"
    };
  }

  // DownloadFileFromURL starts a server-side URL download into a new file.
  rpc DownloadFileFromURL(DownloadFileFromURLRequest) returns (DownloadFileFromURLResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "download-from-url"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/files:downloadFromUrl"
      body: "*"
    };
  }

  // CancelFileDownload stops a URL download started by this session.
  rpc CancelFileDownload(CancelFileDownloadRequest) returns (CancelFileDownloadResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "cancel-download"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/archive-jobs/{job_id}:cancelDownload"
      body: "*"
    };
  }

  // ListPinnedFolders lists the caller's pinned folders on a server.
  rpc ListPinnedFolders(ListPinnedFoldersRequest) returns (ListPinnedFoldersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "list-pins"
    };
    option (google.api.http) = {get: "/v1/servers/{server_id}/pinned-folders"};
  }

  // PinFolder pins a folder for the caller on this server.
  rpc PinFolder(PinFolderRequest) returns (PinFolderResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "pin"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/pinned-folders"
      body: "*"
    };
  }

  // UnpinFolder removes the caller's pin for a folder on this server.
  rpc UnpinFolder(UnpinFolderRequest) returns (UnpinFolderResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "files"
      verb: "unpin"
    };
    option (google.api.http) = {
      post: "/v1/servers/{server_id}/pinned-folders:unpin"
      body: "*"
    };
  }
}

// ListFilesRequest names a directory on a server.
message ListFilesRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The directory's absolute path, without . or .. in it, such as "/var/www".
  string path = 2;
  // Says a form is looking whether a folder is there as you type, such as a
  // website's: a listing it can't have goes on no Activity, as it's a guess at a
  // path, not a person opening one. Files never sets it. Numbered apart, as open
  // work adds to this message.
  bool lookup = 60;
  // Lists only the entries whose names hold this, case aside, such as "error":
  // a search through the whole directory, however large. Empty lists every entry.
  // A server whose agent is older than the control plane can't: update it.
  string match = 230;
  // Lists the page after the one whose next_page this is. Empty lists the first.
  string page = 231;
}

// ListFilesResponse is what a directory holds.
message ListFilesResponse {
  // The directory's path, with every symlink followed.
  string path = 1;
  // The directory itself.
  FileEntry directory = 2;
  // What it holds, by name.
  repeated FileEntry entries = 3;
  // True when the directory holds more than a listing can carry, so these are
  // some of its entries. From an up-to-date agent they're the first in name
  // order after the page asked for, and next_page lists the rest.
  bool truncated = 4;
  // What to pass as page for the entries after these, in name order. Empty when
  // there are no more, and from an agent older than the control plane.
  string next_page = 230;
  // How many entries the directory holds, or how many hold match where one is
  // asked, whatever page this is: so a listing cut short can say how much more
  // there is. Zero from an agent older than the control plane. Numbered apart, as
  // open work adds to this message.
  uint32 total = 60;
}

// ReadFileRequest names a file on a server.
message ReadFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The file's absolute path, without . or .. in it, such as
  // "/etc/nginx/nginx.conf".
  string path = 2;
  // True to also return binary bytes (up to the preview cap of 1 MiB) in
  // raw_content, for image previews through the read path instead of a
  // download.
  bool allow_binary = 3;
}

// ReadFileResponse is a file on a server.
message ReadFileResponse {
  // The file's path, with every symlink followed.
  string path = 1;
  // The file itself.
  FileEntry file = 2;
  // Its text. Empty for a binary file.
  string content = 3;
  // True when the file isn't UTF-8 text, so its contents aren't sent in
  // content (and are in raw_content only when allow_binary was set).
  bool binary = 4;
  // True when the file is longer than 1 MiB, so content is its beginning or
  // raw_content is omitted.
  bool truncated = 5;
  // What SaveFile takes to save over this text: a digest of where the path led,
  // which file that was, and what it held, which tells whether any of it changed
  // since. Empty for what can't be saved here: a binary file, one with more to
  // it than content, or a file on a server whose agent is too old to save.
  string version = 6;
  // True when saving this file takes a passkey, as it's a way back onto the
  // server, such as authorized_keys, a cron job or a systemd unit.
  bool way_back_in = 7;
  // Binary file bytes when allow_binary was set on ReadFileRequest and the
  // file is binary and within the preview cap. Empty otherwise.
  bytes raw_content = 8;
}

// SaveFileRequest replaces a file's text.
message SaveFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The file's absolute path, without . or .. in it. The file must exist:
  // SaveFile doesn't make one.
  string path = 2;
  // The file's new text, 1 MiB at most.
  string content = 3;
  // The version from ReadFile: the file as you last read it.
  string version = 4;
  // The path ReadFile said the file is at, with every symlink followed, which
  // proof confirms. Set it with proof.
  string confirmed_path = 5;
  // The proof from FinishStepUp, for saving this path on this server. A file
  // that's a way back onto the server needs it. Call without it first: it checks
  // everything else, then refuses with the reason needs_step_up.
  string proof = 6;
}

// SaveFileResponse is the file as saved.
message SaveFileResponse {
  // The file's path, with every symlink followed.
  string path = 1;
  // The file itself.
  FileEntry file = 2;
  // What the next save over this text takes.
  string version = 3;
  // True when the file is a way back onto the server, which took a passkey.
  bool way_back_in = 4;
}

// MakeFileRequest makes an empty file or a folder.
message MakeFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The absolute path to make, without . or .. in it, such as
  // "/srv/site/index.html". Its folder must exist.
  string path = 2;
  // FILE_TYPE_FILE or FILE_TYPE_DIRECTORY.
  FileType type = 3;
  // The proof from FinishStepUp, for making this path on this server, where
  // it's a way back onto the server. Call without it first: it checks
  // everything else, then refuses with the reason needs_step_up. With it,
  // path has to be where the server resolves it, as ListFiles gives a
  // folder.
  string proof = 4;
}

// MakeFileResponse is what was made.
message MakeFileResponse {
  // Where it was made, with every symlink in its folder's path followed.
  string path = 1;
  // What was made.
  FileEntry file = 2;
  // True when it's a way back onto the server, which took a passkey.
  bool way_back_in = 3;
}

// MoveFileRequest moves or renames a file or a folder.
message MoveFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Where it is now, as an absolute path, without . or .. in it.
  string from = 2;
  // Where it goes, as the whole new path, such as "/srv/site/old.html" to
  // rename index.html in the same folder. Nothing may be there.
  string to = 3;
  // The proof from FinishStepUp, for this move on this server, where either
  // end is a way back onto the server. Both paths then have to be where the
  // server resolves them.
  string proof = 4;
}

// MoveFileResponse says where it went.
message MoveFileResponse {
  // Where it was, with every symlink in its folder's path followed.
  string from = 1;
  // Where it is now, the same way.
  string to = 2;
  // What moved.
  FileEntry file = 3;
  // True when either end is a way back onto the server, which took a
  // passkey.
  bool way_back_in = 4;
}

// DeleteFileRequest deletes a file or a folder.
message DeleteFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The absolute path, without . or .. in it.
  string path = 2;
  // True to delete it for good, which frees its space at once and can't be
  // undone. What's on another filesystem than Dockwell's data needs it.
  bool for_good = 3;
  // The proof from FinishStepUp, for deleting this path on this server,
  // where it's a way back onto the server or holds one. path then has to be
  // where the server resolves it.
  string proof = 4;
}

// DeleteFileResponse says what was deleted.
message DeleteFileResponse {
  // Where it was, with every symlink in its folder's path followed.
  string path = 1;
  // It in Recently deleted. Unset when it was deleted for good.
  DeletedFile deleted = 2;
  // True when it was a way back onto the server, which took a passkey.
  bool way_back_in = 3;
}

// ListDeletedFilesRequest names a server.
message ListDeletedFilesRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
}

// ListDeletedFilesResponse is what's in a server's Recently deleted.
message ListDeletedFilesResponse {
  // Newest first.
  repeated DeletedFile deleted = 1;
}

// DeletedFile is one file or folder in Recently deleted.
message DeletedFile {
  // Its ID, which RestoreFile and PurgeDeletedFile take.
  string id = 1;
  // Where it was, with every symlink in its folder's path followed.
  string path = 2;
  // What it is.
  FileType type = 3;
  // Its size in bytes, for a file. Zero for a folder.
  uint64 size_bytes = 4;
  // When it was deleted.
  google.protobuf.Timestamp delete_time = 5;
  // When it goes for good, unless it's put back first.
  google.protobuf.Timestamp purge_time = 6;
}

// RestoreFileRequest puts back what was deleted.
message RestoreFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Its ID in Recently deleted.
  string id = 2;
  // The proof from FinishStepUp, for putting back its path on this server,
  // where that's a way back onto the server.
  string proof = 3;
}

// RestoreFileResponse says where it went back.
message RestoreFileResponse {
  // Where it is now, with every symlink in its folder's path followed.
  string path = 1;
  // What went back.
  FileEntry file = 2;
  // True when it's a way back onto the server, which took a passkey.
  bool way_back_in = 3;
}

// PurgeDeletedFileRequest deletes for good what's in Recently deleted.
message PurgeDeletedFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Its ID in Recently deleted.
  string id = 2;
}

// PurgeDeletedFileResponse says what went.
message PurgeDeletedFileResponse {
  // What was deleted for good.
  DeletedFile deleted = 1;
}

// What to unpack an upload as, once it's all there.
enum Unpack {
  // Nothing: it stays as it was sent.
  UNPACK_UNSPECIFIED = 0;
  // A zip archive.
  UNPACK_ZIP = 1;
  // A tar archive compressed with gzip, as .tar.gz or .tgz.
  UNPACK_TAR_GZ = 2;
}

// BeginUploadRequest starts an upload, or asks how far one got.
message BeginUploadRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The absolute path the file takes, without . or .. in it. Its folder must
  // exist, and nothing may be at it.
  string path = 2;
  // How large the file is, in bytes.
  uint64 size_bytes = 3;
  // To unpack it into a new folder beside it, named as it is without .zip,
  // .tar.gz or .tgz, once it's all there.
  Unpack unpack = 4;
  // An upload to pick up again, from BeginUpload. With it, path, size_bytes
  // and unpack are left out.
  string upload_id = 5;
  // The proof from FinishStepUp, with the action STEP_UP_ACTION_MAKE_WAY_BACK_IN,
  // for making this path on this server, where it's a way back onto it.
  string proof = 6;
}

// BeginUploadResponse is the upload begun, or as it stands.
message BeginUploadResponse {
  // The upload.
  Upload upload = 1;
}

// UploadFileResponse is how far an upload got once its bytes stopped coming.
message UploadFileResponse {
  // The upload.
  Upload upload = 1;
}

// DownloadFileResponse is part of what's downloaded.
message DownloadFileResponse {
  // The bytes, as they come. Over REST they're the body.
  google.api.HttpBody body = 1;
}

// Upload is an upload as it stands.
message Upload {
  // Its ID, which UploadFile and FinishUpload take.
  string upload_id = 1;
  // Where the file goes, with every symlink in its folder's path followed.
  string path = 2;
  // How large it is.
  uint64 size_bytes = 3;
  // How much of it is there. Pick it up again from here.
  uint64 received_bytes = 4;
  // The most a file can be, so a person can be told before they start.
  uint64 max_bytes = 5;
  // What it's to be unpacked as.
  Unpack unpack = 6;
  // True when it's a way back onto the server, which took a passkey.
  bool way_back_in = 7;
}

// UploadFileRequest is part of an upload's bytes. The first names the upload
// and where it starts.
message UploadFileRequest {
  // The server's ID, on the first message.
  string server_id = 1;
  // The upload, on the first message.
  string upload_id = 2;
  // Where these bytes start, on the first message: how far the upload got.
  uint64 offset = 3;
  // The bytes.
  google.api.HttpBody content = 4;
}

// FinishUploadRequest puts an upload in place.
message FinishUploadRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The upload.
  string upload_id = 2;
}

// CancelUploadRequest stops an upload.
message CancelUploadRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The upload.
  string upload_id = 2;
}

// CancelUploadResponse is empty: the upload and what it had are gone.
message CancelUploadResponse {}

// FinishUploadResponse is what an upload put in place.
message FinishUploadResponse {
  // Where the file is, with every symlink in its folder's path followed.
  string path = 1;
  // The file.
  FileEntry file = 2;
  // True when it's a way back onto the server, which took a passkey.
  bool way_back_in = 3;
  // The folder it was unpacked into. Empty when it wasn't.
  string unpacked_to = 4;
  // How many files and folders that made.
  uint64 unpacked_entries = 5;
}

// DownloadFileRequest names what to download.
message DownloadFileRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The absolute path of a file or a folder, without . or .. in it.
  string path = 2;
  // Several absolute paths to download together as one zip archive, without .
  // or .. in them. When set, path is left out.
  repeated string paths = 3;
}

// CompressFilesRequest packs one or more files or folders into a new zip
// archive on the server.
message CompressFilesRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // Absolute paths of files or folders to pack, without . or .. in them.
  repeated string paths = 2;
  // The absolute path of the new .zip file to create, without . or .. in it.
  // Nothing may be at it.
  string archive_path = 3;
  // The proof from FinishStepUp, with STEP_UP_ACTION_COMPRESS_WAY_BACK_IN for
  // archive_path on this server, where creating it is a way back onto it.
  string proof = 4;
}

// CompressFilesResponse returns the archive job started for the request.
message CompressFilesResponse {
  // The running or finished compress job.
  ArchiveJob job = 1;
}

// ExtractArchiveRequest unpacks an existing archive on the server.
message ExtractArchiveRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The absolute path of the .zip, .tar.gz or .tgz file, without . or .. in it.
  string path = 2;
  // The proof from FinishStepUp, with STEP_UP_ACTION_EXTRACT_WAY_BACK_IN for
  // the archive and destination folder on this server, where extracting there
  // is a way back onto it.
  string proof = 3;
}

// ExtractArchiveResponse returns the archive job started for the request.
message ExtractArchiveResponse {
  // The running or finished extract job.
  ArchiveJob job = 1;
}

// GetArchiveJobRequest names one archive job on a server.
message GetArchiveJobRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The job's ID, from CompressFiles or ExtractArchive.
  string job_id = 2;
}

// GetArchiveJobResponse is the job's current state.
message GetArchiveJobResponse {
  // The job.
  ArchiveJob job = 1;
}

// ListArchiveJobsRequest names a server.
message ListArchiveJobsRequest {
  // The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
}

// ListArchiveJobsResponse lists active and recently finished archive jobs for
// the caller on that server, newest first.
message ListArchiveJobsResponse {
  // The jobs.
  repeated ArchiveJob jobs = 1;
}

// ArchiveJobKind says whether a job compresses, extracts or downloads.
enum ArchiveJobKind {
  ARCHIVE_JOB_KIND_UNSPECIFIED = 0;
  // Packing selected paths into a new .zip archive.
  ARCHIVE_JOB_KIND_COMPRESS = 1;
  // Extracting an existing .zip, .tar.gz or .tgz archive.
  ARCHIVE_JOB_KIND_EXTRACT = 2;
  // Fetching a URL into a new file on the server.
  ARCHIVE_JOB_KIND_URL_DOWNLOAD = 3;
}

// ArchiveJobState is where an archive job stands.
enum ArchiveJobState {
  ARCHIVE_JOB_STATE_UNSPECIFIED = 0;
  // Running on the agent.
  ARCHIVE_JOB_STATE_RUNNING = 1;
  // Finished and in place on disk.
  ARCHIVE_JOB_STATE_DONE = 2;
  // Stopped with an error; nothing partial was left behind.
  ARCHIVE_JOB_STATE_FAILED = 3;
  // The caller cancelled a URL download before it was put in place.
  ARCHIVE_JOB_STATE_CANCELLED = 4;
}

// ArchiveJob is one server-side compress, extract or URL download job. It
// outlives the request that started it so long jobs survive proxy timeouts.
message ArchiveJob {
  // Its ID, which GetArchiveJob takes.
  string job_id = 1;
  // Whether it compresses, extracts or downloads.
  ArchiveJobKind kind = 2;
  // Running, done, failed or cancelled.
  ArchiveJobState state = 3;
  // The archive's path on the server, with every symlink in its folder's path
  // followed.
  string path = 4;
  // For extract, the new folder the archive unpacks into. Empty for compress.
  string unpacked_to = 5;
  // For compress, the resolved source paths being packed (first 10 when many).
  repeated string source_paths = 6;
  // Total number of top-level source paths for compress.
  uint32 source_count = 7;
  // Files and folders processed so far (or final count when done).
  uint64 entries = 8;
  // Total entries known ahead of time (for zip extract), or zero when unknown.
  uint64 total_entries = 9;
  // Bytes written so far (or final archive / unpacked bytes when done).
  uint64 bytes = 10;
  // For extract: symlinks, hard links, devices and FIFOs skipped in the archive.
  uint64 skipped_links = 11;
  // For compress: entries left out (refused paths, other filesystems, links,
  // or deeper than the depth limit).
  uint64 left_out = 12;
  // For compress when done: the created archive file entry.
  FileEntry file = 13;
  // True when starting the job took a passkey for a way back in.
  bool way_back_in = 14;
  // When failed: the reason for people.
  string error = 15;
  // When failed: the API error reason, such as "unpack_refused" or "disk_full".
  string error_reason = 16;
  // When the job started on the agent.
  google.protobuf.Timestamp start_time = 17;
  // When the job finished or failed. Unset while running.
  google.protobuf.Timestamp finish_time = 18;
  // Expected bytes for a URL download, or zero if the length is unknown.
  uint64 total_bytes = 19;
}

// FileType says what an entry in a directory is.
enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  // A regular file.
  FILE_TYPE_FILE = 1;
  // A directory.
  FILE_TYPE_DIRECTORY = 2;
  // A symbolic link.
  FILE_TYPE_SYMLINK = 3;
  // Anything else: a socket, a FIFO or a device.
  FILE_TYPE_OTHER = 4;
}

// FileEntry is one file or directory on a server.
message FileEntry {
  // Its name. A name that isn't UTF-8 shows as well as it can, with
  // unreadable_name set.
  string name = 1;
  // What it is.
  FileType type = 2;
  // Its size, in bytes.
  uint64 size_bytes = 3;
  // When its contents last changed.
  google.protobuf.Timestamp modify_time = 4;
  // Its type and permissions as ls shows them, such as "-rw-r--r--".
  string mode = 5;
  // The user that owns it, by name, or by ID where the server has no name for
  // it.
  string owner = 6;
  // The group that owns it, the same way.
  string group = 7;
  // Where a symlink points, as the link says.
  string link_target = 8;
  // What a symlink leads to. Unspecified for one that leads nowhere.
  FileType link_type = 9;
  // True when Dockwell doesn't open it, as it holds keys, secrets' values or
  // the server's own credentials. Whatever opening it would say is why.
  bool refused = 10;
  // True when its name isn't UTF-8, so name can't reach it.
  bool unreadable_name = 11;
  // The user and the group that own it, by number, whatever names the server has
  // for them, as what runs in a container goes by the number. Numbered apart, as
  // open work adds to this message.
  uint32 uid = 60;
  uint32 gid = 61;
}

// FileAccount is a local user or group and its numeric ID.
message FileAccount {
  string name = 1;
  uint32 id = 2;
}

// ListFileAccountsRequest names a server whose users and groups to list.
message ListFileAccountsRequest {
  string server_id = 1;
}

// ListFileAccountsResponse lists the local users and groups the server reported.
message ListFileAccountsResponse {
  repeated FileAccount users = 1;
  repeated FileAccount groups = 2;
}

// FileAccessChange leaves each omitted value as it was.
message FileAccessChange {
  // The nine permission bits and, when acknowledged, the special bits.
  optional uint32 mode = 1;
  optional uint32 uid = 2;
  optional uint32 gid = 3;
  bool recursive = 4;
  bool allow_set_id = 5;
  // For recursive changes, mode applies to folders and file_mode to files.
  optional uint32 file_mode = 6;
  // Also keep execute bits that were already set on a file.
  bool keep_file_execute = 7;
  // Restore an earlier change only where the inode and current access still match.
  repeated FileAccessUndoEntry restore = 8;
}

// FileAccessState holds a file or folder's permissions and numeric ownership.
message FileAccessState {
  uint32 mode = 1;
  uint32 uid = 2;
  uint32 gid = 3;
}

// FileAccessUndoEntry identifies an inode and the access change made to it.
message FileAccessUndoEntry {
  string path = 1;
  uint64 device = 2;
  uint64 inode = 3;
  FileAccessState before = 4;
  FileAccessState after = 5;
  // The inode change time after the operation, to detect a stale undo.
  int64 change_time_ns = 6;
}

// ChangeFileAccessRequest names a path and its requested permission or ownership changes.
message ChangeFileAccessRequest {
  string server_id = 1;
  string path = 2;
  FileAccessChange change = 3;
  string proof = 4;
  // The target returned with needs_step_up, alongside its proof.
  string confirmation_target = 5;
}

// ChangeFileAccessResponse includes partial progress if a recursive change stopped.
message ChangeFileAccessResponse {
  string path = 1;
  uint64 changed = 2;
  uint64 skipped = 3;
  bool way_back_in = 4;
  // A failure after at least one entry changed.
  string stopped = 5;
  repeated FileAccessUndoEntry undo = 6;
}

// CalculateFolderSizeRequest names the folder whose visible files to count.
message CalculateFolderSizeRequest {
  string server_id = 1;
  string path = 2;
}

// CalculateFolderSizeResponse returns the logical size of the files counted.
message CalculateFolderSizeResponse {
  uint64 size_bytes = 1;
  // True when only a lower bound could be counted.
  bool partial = 2;
  repeated FolderSizeOmission omissions = 3;
}

// FolderSizeOmission explains why the size is a lower bound.
enum FolderSizeOmission {
  FOLDER_SIZE_OMISSION_UNSPECIFIED = 0;
  FOLDER_SIZE_OMISSION_DOCKER_DATA = 1;
  FOLDER_SIZE_OMISSION_HARD_LINKS = 2;
  FOLDER_SIZE_OMISSION_REFUSED_ENTRIES = 3;
  FOLDER_SIZE_OMISSION_SCAN_LIMIT = 4;
}

// SearchFilesRequest names a folder and a literal term to find below it.
message SearchFilesRequest {
  string server_id = 1;
  string path = 2;
  string query = 3;
  // Also match the contents of small text files, without returning the text.
  bool text = 4;
}

// FileSearchMatch identifies a matching path and, when found, its first matching line.
message FileSearchMatch {
  string path = 1;
  FileType type = 2;
  // The first matching line, or zero when only the name matched.
  uint32 line = 3;
}

// SearchFilesResponse returns the paths found within the search limits.
message SearchFilesResponse {
  repeated FileSearchMatch matches = 1;
  bool partial = 2;
}

// DownloadFileFromURLRequest names a URL and where to put the bytes on the server.
message DownloadFileFromURLRequest {
  string server_id = 1;
  string folder = 2;
  string url = 3 [
    (dockwell.v1.flag) = "download-url",
    (dockwell.v1.from_file) = true
  ];
  // A single filename. Empty uses the last component of the original URL.
  string name = 4;
  string proof = 5;
  // The target returned with needs_step_up, alongside its proof.
  string confirmation_target = 6;
}

// DownloadFileFromURLResponse returns the background download job.
message DownloadFileFromURLResponse {
  ArchiveJob job = 1;
}

// CancelFileDownloadRequest names a download job to stop.
message CancelFileDownloadRequest {
  string server_id = 1;
  string job_id = 2;
}

// CancelFileDownloadResponse returns the state of the download after cancellation was requested.
message CancelFileDownloadResponse {
  ArchiveJob job = 1;
}

// ListPinnedFoldersRequest names a server whose pins to list.
message ListPinnedFoldersRequest {
  string server_id = 1;
}

// ListPinnedFoldersResponse lists the caller's pinned paths on the server.
message ListPinnedFoldersResponse {
  repeated string paths = 1;
}

// PinFolderRequest names a folder to pin.
message PinFolderRequest {
  string server_id = 1;
  string path = 2;
}

// PinFolderResponse is empty once the folder is pinned.
message PinFolderResponse {}

// UnpinFolderRequest names the pinned path to remove.
message UnpinFolderRequest {
  string server_id = 1;
  string path = 2;
}

// UnpinFolderResponse is empty once the pin is gone.
message UnpinFolderResponse {}

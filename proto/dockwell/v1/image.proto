syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// ImageService reads images from their registries for a form, through the
// server an app will run on, so a form can offer names and tags, say whether an
// image is there as it's typed, and fill in what an image declares. Nothing is
// pulled, and nothing changes. Each read goes to that server's agent, which
// reads with the pull's network and mirrors, and keeps what it read for a
// while; the control plane keeps none of it. An answer says nothing of the
// server, such as which images it has, which is the install's (ADR 0048). See
// docs/adr/0062-reading-an-image-from-its-registry.md.
service ImageService {
  option (dockwell.v1.nouns) = {
    name: "images"
    help: "Images read from their registries through the server an app will run on, for a form: Docker Hub's search, a repository's tags, and whether an image is there and what it declares. Nothing is pulled, and nothing changes. An image a registry keeps private is read with the registry login its app's pull would use. See docs/adr/0062-reading-an-image-from-its-registry.md and docs/adr/0086-registry-logins-for-private-images.md."
  };
  option (dockwell.v1.nouns) = {
    name: "registry-logins"
    help: "What signs in to a container registry, so an app can pull an image the registry keeps private. A login is install-wide: an admin saves it as a change, with a plan, and decides which projects' apps may pull with it. It's sent only to the server that pulls, for that call, and from there to its registry and the token service it was saved with. CheckRegistryLogin signs in without saving anything. See docs/adr/0086-registry-logins-for-private-images.md."
  };
  // SearchImages returns Docker Hub's images whose names hold a term, its
  // official ones first.
  rpc SearchImages(SearchImagesRequest) returns (SearchImagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/images:search"};
  }

  // ListImageTags returns a repository's tags, newest first, each with the
  // digest it points at where that's known, so the ones that point where
  // "latest" does can be told. Docker Hub says when each was pushed; any other
  // registry's are ordered by version.
  rpc ListImageTags(ListImageTagsRequest) returns (ListImageTagsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/images:tags"};
  }

  // GetImage says whether an image is there, as a pull would find it, and what
  // it declares for the server's platform: the ports it exposes, its
  // environment variables with their defaults, the paths it keeps data at, its
  // command and its health check.
  rpc GetImage(GetImageRequest) returns (GetImageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/images:inspect"};
  }
  // ListRegistryLogins lists the registry logins the caller may use: an admin's,
  // every login with everything but what signs in; below an admin, the logins
  // the caller's projects may pull with, by name and registry alone. See
  // docs/adr/0086-registry-logins-for-private-images.md.
  rpc ListRegistryLogins(ListRegistryLoginsRequest) returns (ListRegistryLoginsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (google.api.http) = {get: "/v1/registryLogins"};
  }
  // CheckRegistryLogin signs in at a registry from a server's agent, as a pull
  // there would, and saves nothing: with a login as typed, or a saved one again.
  // It says whether it signed in, and the token service the registry sent it to,
  // which a plan saves with the login so it never goes anywhere else. An admin's,
  // signed in, as a login is install-wide. See
  // docs/adr/0086-registry-logins-for-private-images.md.
  rpc CheckRegistryLogin(CheckRegistryLoginRequest) returns (CheckRegistryLoginResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/registryLogins:check"
      body: "*"
    };
  }
}

// ListRegistryLoginsRequest asks for the registry logins the caller may use.
message ListRegistryLoginsRequest {
  // Only those this project's apps may pull with, by name or ID. Empty lists
  // every login the caller may see.
  string project = 1;
  // Only those this environment's project may pull with, by ID, in place of
  // project.
  string environment = 2;
}

// ListRegistryLoginsResponse lists registry logins.
message ListRegistryLoginsResponse {
  repeated RegistryLoginInfo logins = 1;
}

// RegistryLoginInfo is a registry login as a caller may see it: never what signs
// in. Below an admin, its name and registry alone.
message RegistryLoginInfo {
  // Its name, such as "ghcr-ci".
  string name = 1;
  // The registry it signs in to, such as "ghcr.io".
  string registry = 2;
  // Who signs in, for an admin. Empty for ECR, and below an admin.
  string username = 3;
  // True for an Amazon ECR login, which signs in with an access key.
  bool ecr = 4;
  // The token service it was saved with, for an admin.
  string token_host = 5;
  // The projects whose apps may pull with it, by ID, for an admin; empty for every
  // project.
  repeated string projects = 6;
  // Its resource's ID.
  string id = 7;
}

// CheckRegistryLoginRequest is a login to try, as typed or as saved.
message CheckRegistryLoginRequest {
  // The registry's host, such as "ghcr.io". Unset when name says which.
  string registry = 1;
  // Who signs in.
  string username = 2;
  // The password or token, as typed. Unset to check a saved login's.
  string password = 3 [(dockwell.resource.v1alpha1.sensitive) = true];
  // For ECR, the key and its region, as typed.
  dockwell.resource.v1alpha1.RegistryLoginEcr ecr = 4 [(dockwell.resource.v1alpha1.sensitive) = true];
  // A saved login to check again, by name, with what it saved for anything left
  // unset here.
  string name = 5;
  // The server whose agent signs in, by ID. It can be left out while there is one.
  string server = 6;
  // Asks registry's /v2/ with no login, and sends nothing that signs in: whether
  // it's a registry, and what it asks of a client, before a token goes there.
  bool probe = 7;
}

// CheckRegistryLoginResponse says whether the login signs in.
message CheckRegistryLoginResponse {
  // How the registry answered.
  RegistryLoginState state = 1;
  // The host the registry sends clients to for a token, which a plan saves with
  // the login. Empty for a registry that signs in itself.
  string token_host = 2;
  // The registry's own words, when it said no or couldn't be reached, in a line.
  string detail = 3;
  // For ECR, the registry the key's account and region name, which the login
  // pulls from.
  string registry = 4;
}

// RegistryLoginState is what a registry said of a login.
enum RegistryLoginState {
  REGISTRY_LOGIN_STATE_UNSPECIFIED = 0;
  // It signed in.
  REGISTRY_LOGIN_STATE_SIGNED_IN = 1 [(dockwell.v1.word) = "Signed in"];
  // The registry refused the username or the password.
  REGISTRY_LOGIN_STATE_REFUSED = 2 [(dockwell.v1.word) = "Wrong username or password"];
  // The registry couldn't be reached, or didn't answer in time.
  REGISTRY_LOGIN_STATE_UNREACHABLE = 3 [(dockwell.v1.word) = "Can't reach the registry"];
  // The registry sent the login to a token service on another host than the one
  // it was saved with, so nothing was sent.
  REGISTRY_LOGIN_STATE_MOVED = 4 [(dockwell.v1.word) = "Token service moved"];
  // A probe found a registry that asks for a sign-in; nothing was sent.
  REGISTRY_LOGIN_STATE_ASKS = 5 [(dockwell.v1.word) = "Asks for a sign-in"];
}

// ImageAnswer is what a registry said, or why it said nothing.
enum ImageAnswer {
  IMAGE_ANSWER_UNSPECIFIED = 0;
  // It's there, and a pull would get it.
  IMAGE_ANSWER_FOUND = 1;
  // The registry hasn't got it, or keeps it private: a registry answers the
  // two alike, and Dockwell has no registry logins yet.
  IMAGE_ANSWER_NOT_FOUND = 2;
  // The registry couldn't be reached, or didn't answer in time.
  IMAGE_ANSWER_UNREACHABLE = 3;
  // A limit held the question back, such as what the server may ask of Docker
  // Hub in six hours. It says nothing of the image.
  IMAGE_ANSWER_NOT_ASKED = 4;
  // The registry refused the login it was read with, or sent it to a token
  // service other than the one it was saved with (ADR 0086).
  // Numbered in the block registry logins hold, 100 to 109.
  IMAGE_ANSWER_SIGN_IN_FAILED = 100;
}

// SearchImagesRequest says what to look for, and where.
message SearchImagesRequest {
  // What a name holds, such as "postgres".
  string term = 1;
  // The environment the app is for, by name or ID, which says who may ask. It
  // can be left out while its project has only one.
  string environment = 2;
  // The project of the environment, by name or ID. It can be left out while
  // there is only one.
  string project = 3;
  // The server to read from, by ID: the one the app will run on. It can be left
  // out while there is only one.
  string server = 4;
}

// SearchImagesResponse lists what was found.
message SearchImagesResponse {
  // The images, at most 25.
  repeated ImageMatch matches = 1;
  // How Docker Hub answered the search.
  ImageAnswer answer = 2;
}

// ImageMatch is one image a search found.
message ImageMatch {
  // Its name as a reference takes it, such as "postgres" or
  // "ghcr.io/acme/web".
  string name = 1;
  // What Docker Hub says it is.
  string description = 2;
  // True for one of Docker Hub's official images.
  bool official = 3;
  // How many have starred it on Docker Hub.
  int64 stars = 4;
}

// ListImageTagsRequest names a repository.
message ListImageTagsRequest {
  // The repository, such as "nginx" or "ghcr.io/acme/web", with no tag.
  string repository = 1;
  // As SearchImagesRequest's.
  string environment = 2;
  string project = 3;
  string server = 4;
  // As GetImageRequest's. Numbered in the block registry logins hold, 100 to 109.
  string registry_login = 100;
  // As GetImageRequest's.
  bool anonymous = 101;
}

// ListImageTagsResponse lists a repository's tags.
message ListImageTagsResponse {
  // As GetImageResponse's. Numbered in the block registry logins hold, 100 to 109.
  string registry_login = 100;
  // The tags, newest first, at most 200.
  repeated ImageTag tags = 1;
  // How the registry answered.
  ImageAnswer answer = 2;
}

// ImageTag is one of a repository's tags.
message ImageTag {
  // The tag, such as "1.27".
  string name = 1;
  // The digest it points at, such as "sha256:ab12…". Empty where the registry
  // lists names alone and it wasn't asked.
  string digest = 2;
  // When it was last pushed. Unset where the registry doesn't say.
  google.protobuf.Timestamp push_time = 3;
  // True for a tag that points where "latest" does, "latest" among them.
  bool latest = 4;
}

// GetImageRequest names an image.
message GetImageRequest {
  // The image, such as "nginx:1.27" or "ghcr.io/acme/web@sha256:ab12…". With
  // no tag, it's "latest".
  string reference = 1;
  // As SearchImagesRequest's.
  string environment = 2;
  string project = 3;
  string server = 4;
  // Read with this registry login, by name, one the project may use. Empty reads
  // with the login an app's pull would use: the one for the image's registry the
  // project may use, when there's exactly one (ADR 0086). Numbered in the block
  // registry logins hold, 100 to 109.
  string registry_login = 100;
  // Read with no login, whatever the project may use.
  bool anonymous = 101;
}

// GetImageResponse says whether an image is there, and what it declares.
message GetImageResponse {
  // The registry login it was read with, by name, or empty for none (ADR 0086).
  // Numbered in the block registry logins hold, 100 to 109.
  string registry_login = 100;
  // Whether it's there.
  ImageAnswer answer = 1;
  // What its registry calls it, such as "sha256:ab12…". Empty unless found.
  string digest = 2;
  // What it declares, for the server's platform. Unset unless found, and when
  // its settings couldn't be read this time, as unread says.
  ImageConfig config = 3;
  // Why config is unset for an image that was found, such as the server's
  // allowance of Docker Hub reads for the six hours being spent. Unspecified
  // otherwise.
  ImageAnswer unread = 4;
}

// ImageConfig is what an image declares, as its Dockerfile set it.
message ImageConfig {
  // The ports it listens on (EXPOSE), in the order it gives them.
  repeated ImagePort ports = 1;
  // Its environment variables, with the values it gives them (ENV).
  repeated ImageVariable env = 2;
  // The paths it keeps data at (VOLUME).
  repeated string volumes = 3;
  // Its command and entrypoint, word by word.
  repeated string command = 4;
  repeated string entrypoint = 5;
  // The user it runs as, and the directory it runs in. Empty for root and /.
  string user = 6;
  string working_dir = 7;
  // Its health check's command, as Docker takes one. Empty for none.
  repeated string healthcheck = 8;
  // The platform these are for, such as "linux/arm64".
  string platform = 9;
  // The version it says it is, in its org.opencontainers.image.version label,
  // such as "5.3.1". Empty where it says none. Numbered apart, as open work adds
  // to this message (ADR 0080).
  string version = 260;
}

// ImagePort is a port an image exposes.
message ImagePort {
  uint32 port = 1;
  // True for UDP.
  bool udp = 2;
}

// ImageVariable is an environment variable an image sets.
message ImageVariable {
  string name = 1;
  string value = 2;
}

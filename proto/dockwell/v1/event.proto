syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/health.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/task.proto";
import "dockwell/v1/terminal.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// EventService is the timeline: every change to managed state, with who
// made it and from where, beside what servers and people did that belongs
// with it, such as a server joining or someone signing in. See
// docs/adr/0020-the-event-timeline.md.
//
// A change is one event, which moves on as the change does: planned, then
// applying, then applied or failed. Rollbacks and undos are changes of
// their own, each naming the change it reverts. A discarded change isn't
// on the timeline, and nor is the change that set up an install's default
// project and environment. Every other event comes from the audit log, as
// it was recorded.
//
// Events carry no secret, no spec and no address.
//
// WatchEvents streams, so it has no REST path. A REST client polls GET
// /v1/events, or opens the stream with Connect, gRPC or gRPC-Web, with the
// same credentials.
service EventService {
  // ListEvents returns events, newest first, a page at a time.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (google.api.http) = {get: "/v1/events"};
  }

  // WatchEvents sends the newest page of events, as ListEvents would, then
  // each event as it happens, and a change's event again each time the
  // change moves on, such as a step that finishes. Events from another
  // process sharing the store, such as dockwell recover, arrive within a
  // few seconds.
  rpc WatchEvents(WatchEventsRequest) returns (stream WatchEventsResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
  }
}

// ListEventsRequest asks for a page of events. The filters narrow it, and
// combine: an event must pass each one that is set.
message ListEventsRequest {
  // How many events to return: 50 when unset, and at most 200.
  int32 page_size = 1;
  // Where to start: the next_page_token of the page before, or of a
  // watch's snapshot. Empty starts with the newest. Pass the same filters
  // with it.
  string page_token = 2;
  // Only events of these kinds. Empty means every kind.
  repeated EventKind kinds = 3;
  // Only what happened on or to one server, by ID: the changes with steps
  // on it, and its own events, such as joining.
  string server_id = 4;
  // Only the changes to one resource, by ID, or to what lives in it: a
  // service's changes, or a project's with those of its environments and
  // their services.
  string resource_id = 5;
  // Only what one actor did, by the ID their Actor has: a user's
  // ("usr_…"), an API token's ("tok_…"), a server's ("srv_…"), or a
  // shell account's ("mira@hz-1"). A change counts for whoever proposed it
  // and whoever applied it.
  string actor_id = 6;
  // Only what actors of one kind did, such as Dockwell on its own, or
  // someone in a shell on the control server.
  ActorKind actor_kind = 7;
}

// ListEventsResponse is a page of events.
message ListEventsResponse {
  // The events, newest first.
  repeated Event events = 1;
  // Pass it as page_token for the next page. Empty on the last page.
  string next_page_token = 2;
}

// WatchEventsRequest says which events to watch, with the same filters as
// ListEventsRequest.
message WatchEventsRequest {
  // How many events the snapshot holds: 50 when unset, and at most 200.
  int32 page_size = 1;
  // Only events of these kinds. Empty means every kind.
  repeated EventKind kinds = 2;
  // Only what happened on or to one server, by ID.
  string server_id = 3;
  // Only the changes to one resource, by ID, or to what lives in it.
  string resource_id = 4;
  // Only what one actor did, by the ID their Actor has.
  string actor_id = 5;
  // Only what actors of one kind did.
  ActorKind actor_kind = 6;
}

// WatchEventsResponse is one message of a watch: the snapshot, or what
// happened since.
message WatchEventsResponse {
  // Events, newest first. The first message holds the snapshot: the
  // newest page, as ListEvents gives it. Each later one holds the events
  // that are new or moved on since the last. An event sent again replaces
  // the one with its ID, and may have moved in time, as a change does when
  // it starts applying.
  repeated Event events = 1;
  // The IDs of events that left the timeline since the last message, such
  // as a planned change that was discarded: each one the filters keep,
  // whether this watch sent it or the client read it with ListEvents. A
  // client drops those it has and ignores the rest.
  repeated string removed = 2;
  // True on the first message, and only on it.
  bool snapshot = 3;
  // On the snapshot, where ListEvents carries on with older events, with
  // the same filters. Empty when the snapshot holds every event there is.
  string next_page_token = 4;
}

// Event is one thing that happened.
message Event {
  // The event's ID: a change's own ("chg_…") for a change, and the audit
  // log's ("evt_…") for the rest.
  string id = 1;
  // What sort of event it is.
  EventKind kind = 2;
  // What happened, as the audit log names it, such as "server.join",
  // "auth.sign_in", "token.create" or "backup.failed". A change's says where the
  // change is: "change.planned", "change.applying", "change.applied" or
  // "change.failed".
  string action = 3;
  // When it happened. A change is timed from when it started applying, and
  // from when it was planned until then.
  google.protobuf.Timestamp time = 4;
  // Who did it. For a change, whoever applied it, and whoever proposed it
  // until then.
  Actor actor = 5;
  // Where it came from.
  Surface surface = 6;
  // The change, for a change's event: as it stands now, with its plan in
  // brief, each step's progress, its undo deadline, and what undid it or
  // rolled it back. GetChange has the plan in full.
  Change change = 7;
  // What the event is about, other than its actor: the server that joined
  // or was removed, the API token or passkey made or removed, the person a
  // sign-in link is for, or the secret revealed. Unset when there is
  // nothing more to name.
  EventSubject subject = 8;
  // How a service's health changed, for a health event. Its subject is the
  // service.
  EventHealth health = 9;
  // What became of a backup, for a backup event. Its subject is the volume.
  EventBackup backup = 10;
  // What a person set of a server's public address, on such an event.
  EventPublicAddress public_address = 11;
  // The process someone ended on a server, for "process.end". Its subject is
  // the server. Numbered apart, as open work adds to this message.
  EventProcess process = 30;
  // The terminal, for a terminal's event. Its subject is the server. Numbered
  // apart, as open work adds to this message.
  EventTerminal terminal = 20;
  // A setting of the install someone changed, for a settings event. Numbered
  // apart, as open work adds to this message.
  EventSetting setting = 31;
  // The alert that fired or resolved, or the mute that began or ended, for an
  // alert event. Numbered apart, as open work adds to this message.
  EventAlert alert = 90;
  // What became of a scheduled task's run, for a task event. Its subject is the
  // task. Numbered in the block scheduled tasks hold, as open work adds to this
  // message.
  EventTaskRun task_run = 130;
}

// EventTaskRun is a scheduled task's run that failed, or the one that succeeded
// after it (ADR 0053).
message EventTaskRun {
  // The run's ID.
  string id = 1;
  // The task, by name, and what people call it.
  string task = 2;
  string display_name = 3;
  // The server it ran on, by name.
  string server_name = 4;
  // How it ended.
  TaskRunState state = 5;
  // Why it ran.
  TaskRunReason reason = 6;
  // The last attempt's exit status, for a command.
  int32 exit_code = 7;
  // The last attempt's HTTP status, for a request.
  int32 http_status = 8;
  // Why it failed, for people. Empty when it didn't.
  string error = 9;
}

// EventProcess is a process someone ended on a server.
message EventProcess {
  // Its process ID.
  uint32 pid = 1;
  // What the kernel called it, such as "postgres". Its command line isn't
  // kept, as one can hold a password typed with it, and anyone who reads the
  // activity log, an API token too, would read it.
  string name = 2;
  reserved 3;
  reserved "command";
  // Who it ran as.
  string user = 4;
  // The container it ran in, by name. Empty for one that didn't.
  string container = 5;
  // True when it took SIGKILL, as SIGTERM didn't end it within 10 s.
  bool killed = 6;
  // Why it couldn't be ended, for "process.end_failed".
  string error = 7;
}

// EventSetting is a setting of the install as someone changed it.
message EventSetting {
  // Which: "name" or "time_zone".
  string setting = 1;
  // What it is now. Empty when they cleared it.
  string value = 2;
  // What it was. Empty when it wasn't set.
  string previous = 3;
}

// EventAlert is an alert that fired or resolved, or a mute of a rule or a
// server that began or ended. Its subject is what the alert is about, and its
// server is the one it's on.
message EventAlert {
  // The alert's ID, "alt_…". Empty for a mute.
  string id = 1;
  // The rule, by name.
  string rule = 2;
  // How much it matters.
  dockwell.resource.v1alpha1.AlertRule.Severity severity = 3;
  // What it said, such as "web-1's disk is 93% full".
  string title = 4;
  // The server it's on, when it's on one.
  string server_id = 5;
  string server_name = 6;
  // Where the panel shows it.
  string path = 7;
  // When it fired, on a resolved alert's event.
  google.protobuf.Timestamp open_time = 8;
  // When a mute ends, on a mute's event.
  google.protobuf.Timestamp until = 9;
  // Why someone muted it, in their words, on a mute's event.
  string reason = 10;
  // What a firing alert means and how to fix it, as it was sent.
  string detail = 11;
  // What its title says, apart, for the panel to say in its own language: the
  // rule's condition, the app, domain, volume or change it's about, which of the
  // condition's titles it is ("unhealthy", "not_running", "restarting",
  // "flapping"; "failed" or "copy" for a backup), where (a disk's mount point, a
  // backup's destination) and a value (a percent, or days left).
  dockwell.resource.v1alpha1.AlertRule.Condition condition = 12;
  string subject_name = 13;
  string variant = 14;
  string where = 15;
  int32 value = 16;
}

// EventTerminal is a terminal on a server, as its opening or closing tells of it.
// What was typed and printed in it is never kept.
message EventTerminal {
  // The terminal's ID.
  string id = 1;
  // Who it ran as and where, such as "root@hz-1".
  string title = 2;
  // When it opened, on its closing.
  google.protobuf.Timestamp open_time = 3;
  // How it ended, on its closing.
  TerminalEnd end = 4;
  // Why it didn't open, for people, on a terminal that didn't.
  string error = 5;
  // The container it ran in, by name, for a shell in a container.
  string container = 6;
  // That container's full ID.
  string container_id = 7;
}

// EventBackup is what became of one backup.
message EventBackup {
  // The backup's ID.
  string id = 1;
  // The volume, by name.
  string volume = 2;
  // The server, by name.
  string server_name = 3;
  // How it was taken.
  BackupMethod method = 4;
  // Its size, in bytes.
  int64 size_bytes = 5;
  // Why it failed, for people. Empty unless it did.
  string error = 6;
  // The destination it went to or didn't, by name.
  string destination = 7;
}

// EventPublicAddress is a server's public address as a person changed it.
message EventPublicAddress {
  // What it is now. Empty when they cleared it.
  string address = 1;
  // What a person had set before, so it can be put back. Empty when they hadn't.
  string previous = 2;
}

// EventHealth is how a service's health changed on a server, as far as the
// timeline tells of it: when it turned unhealthy or stopped running, and when
// it came back. A state that lasts under 30 s isn't told, and one that lasts is
// told then. A service that went between good and bad 3 times in 5 minutes keeps
// changing, and is one event, whose time, flips and output change as it goes on,
// until it has stayed one way for 5 minutes.
message EventHealth {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // How it is now.
  HealthState state = 3;
  // How it was as the timeline last told of it.
  HealthState previous = 4;
  // What the last check said, in one short line, with the values of the
  // container's environment masked.
  string output = 5;
  // How many times it went between good and bad since since, for a service
  // that keeps changing. 0 for one that changed once.
  int32 flips = 6;
  // When it came to this state, as the control plane heard, which is up to
  // 30 s before the event's time; or, for one that keeps changing, when it began
  // to. Unset on events from before it was kept.
  google.protobuf.Timestamp since = 7;
}

// EventSubject names what an event is about.
message EventSubject {
  // Its ID, such as "srv_…", "tok_…", "pky_…" or "usr_…".
  string id = 1;
  // Its name, such as "hz-2", "GitHub Actions deploy" or "Mira Chen".
  // Empty when it has none, or when it is gone and Dockwell no longer
  // keeps it.
  string name = 2;
  // What it lives in, by ID, for a resource that lives in another: a
  // secret's environment, as "env_…", for a secret revealed. Empty
  // otherwise.
  string scope = 3;
  // Which file on it, for a file read, saved or refused on a server. Empty
  // otherwise.
  string path = 4;
  // Where it went, for a file or folder moved or renamed. Empty otherwise.
  // Numbered apart, as open work adds to this message.
  string to_path = 100;
  // True for a file or folder made, moved, deleted or put back where it's a
  // way back onto the server, which took a passkey.
  bool way_back_in = 101;
  // True for a file or folder deleted for good, which can't be put back.
  bool for_good = 102;
  // How many bytes, for a file uploaded or downloaded.
  uint64 size_bytes = 103;
}

// EventKind sorts events, for filtering.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  // A change to managed state: a plan waiting to be applied, or a change
  // applying, applied or failed, rollbacks and undos included.
  EVENT_KIND_CHANGE = 1;
  // A server joined the fleet, renewed its certificate, or was removed, or
  // someone saved a file on it or ended a process on it.
  EVENT_KIND_SERVER = 2;
  // Someone gained or gave up a way in: claiming the install, signing in,
  // signing other sessions out, passkeys, authenticator codes, API tokens,
  // sign-in and claim links, and join tickets. Someone reading a server's files,
  // and what refused them. Other refusals, such as a wrong code, stay in the
  // audit log.
  EVENT_KIND_ACCESS = 3;
  // A service turned unhealthy, stopped running, or came back, as its server's
  // agent saw, outside any change.
  EVENT_KIND_HEALTH = 4;
  // A backup was taken, failed, was deleted, didn't reach its destination or was
  // fetched from it. Restoring one is a change.
  EVENT_KIND_BACKUP = 5;
  // Someone changed a setting of the install, such as its name or time zone.
  // Numbered apart, as open work adds to this enum.
  EVENT_KIND_SETTINGS = 10;
  // An alert fired or resolved, or someone muted a rule or a server, or ended a
  // mute. Numbered apart, as open work adds to this enum.
  EVENT_KIND_ALERT = 90;
  // A scheduled task's run failed or timed out, or one succeeded after that.
  // Numbered in the block scheduled tasks hold.
  EVENT_KIND_TASK = 130;
}

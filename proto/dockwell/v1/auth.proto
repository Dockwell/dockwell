syntax = "proto3";

package dockwell.v1;

import "dockwell/v1/options.proto";
import "dockwell/v1/server.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// AuthService claims a new install, signs people in and out, and manages how
// they sign in: passkeys, an authenticator app with recovery codes, and
// sessions. See docs/adr/0011-claim-and-sign-in.md.
//
// GetAuthState, the claim calls and the sign-in calls work without a session.
// Every other call needs one, carried in the session cookie the sign-in calls
// set. No API token can call this service: how you sign in is changed only by
// signing in (docs/adr/0016-scoped-api-tokens.md).
//
// Passkey ceremonies take two calls. Begin returns WebAuthn options as JSON
// (PublicKeyCredentialCreationOptionsJSON or
// PublicKeyCredentialRequestOptionsJSON, WebAuthn Level 3) and a ceremony ID;
// Finish takes that ID and the browser's credential as JSON
// (RegistrationResponseJSON or AuthenticationResponseJSON). A ceremony works
// once and expires after 5 minutes.
//
// A failed call's error metadata names the reason under "Dockwell-Error", such
// as "code_rejected" or "claim_link_rejected", so clients can explain it in
// their own words; a slowed-down one also carries "Retry-After" in seconds.
// A call to any service refused for want of a session names one too:
// "unauthenticated" when it came with no session, and "session_ended" when
// its session cookie no longer works or a stream's session ended while it
// was open. A browser's request from another origin gets "origin". A call
// with an API token gets "token_rejected" when the token is unknown, revoked
// or expired, "token_scope" when its scope doesn't cover the call, and
// "needs_session" when no token may make it.
service AuthService {
  option (dockwell.v1.nouns) = {
    name: "auth-state"
    help: "The install's auth state says whether it has an owner yet, who is signed in on a request, and which address passkeys are made for there. GetAuthState needs no sign-in."
  };
  option (dockwell.v1.nouns) = {
    name: "claim-link"
    help: "A claim link, which dockwell run and dockwell claim print, creates the install's owner with a passkey, and works once. CheckClaim describes the server a link claims, and BeginClaim and FinishClaim make the passkey, which takes a browser: open the link in one."
  };
  option (dockwell.v1.nouns) = {
    name: "invite"
    help: "An invite's link, which an admin or the owner makes in the panel's Members, signs in a new person with the role and the place it names, and works once. CheckInvite says who invited them, as what and where, and BeginAcceptInvite and FinishAcceptInvite make their passkey, which takes a browser at the panel's domain: open the link in one."
  };
  option (dockwell.v1.nouns) = {
    name: "passkeys"
    help: "Passkeys are how you sign in to the panel. A browser, a phone or a security key makes each one, for one address, and only it can use it. Adding and removing them needs a signed-in session, which no API token gives, and a passkey you already have to confirm it, so you do it in the panel, under Profile and security."
  };
  option (dockwell.v1.nouns) = {
    name: "sessions"
    help: "A session is a browser you're signed in on. Signing in takes a passkey, a code from an authenticator app, a recovery code, or a one-time link from dockwell recover, and sets a session cookie. No API token can sign in, or list or end sessions: how you sign in changes only by signing in, in the panel."
  };
  option (dockwell.v1.nouns) = {
    name: "step-up-policy"
    help: "How often you're asked for your passkey again: each time, once an hour, or only when you sign in, but never below the least the install's owner allows. Changing how you sign in, this choice, and approving someone else's protected change ask each time. Choosing takes a signed-in session, which no API token gives, and your passkey, so you do it in the panel, under Profile and security."
  };
  option (dockwell.v1.nouns) = {
    name: "totp"
    help: "Code sign-in lets you sign in with a code from an authenticator app, or with a one-time recovery code, beside your passkeys. Wrong codes slow it down, and too many lock it until UnlockCodeSignIn turns it back on. Setting it up needs a signed-in session, which no API token gives, and your passkey to confirm it, so you do it in the panel, under Profile and security."
  };

  // GetAuthState says whether the install has an owner, who is signed in on
  // this request, and which address passkeys are made for here.
  rpc GetAuthState(GetAuthStateRequest) returns (GetAuthStateResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {get: "/v1/authState"};
  }

  // CheckClaim checks a claim link without spending it, and describes the
  // server it claims.
  //
  // It only reads, and is still not marked NO_SIDE_EFFECTS: the panel sends
  // calls so marked as GETs, with the request in the address, and this one's
  // request is a secret (a test in internal/control holds it to that).
  rpc CheckClaim(CheckClaimRequest) returns (CheckClaimResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/claim:check"
      body: "*"
    };
    // dockwell claim prints a claim link.
    option (dockwell.v1.command) = {noun: "claim-link"};
  }

  // BeginClaim starts creating the owner's first passkey.
  rpc BeginClaim(BeginClaimRequest) returns (BeginClaimResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/claim:begin"
      body: "*"
    };
    option (dockwell.v1.command) = {noun: "claim-link"};
  }

  // FinishClaim spends the claim link, creates the owner with the new
  // passkey, and signs them in. It works once per install.
  rpc FinishClaim(FinishClaimRequest) returns (FinishClaimResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/claim:finish"
      body: "*"
    };
    option (dockwell.v1.command) = {noun: "claim-link"};
  }

  // CheckInvite reads an invite's link without spending it: who invited
  // them, as what, and where. It works only at the panel's domain, where the
  // passkey is made.
  //
  // It only reads, and is still not marked NO_SIDE_EFFECTS: the panel sends
  // calls so marked as GETs, with the request in the address, and this one's
  // request is a secret (a test in internal/control holds it to that).
  rpc CheckInvite(CheckInviteRequest) returns (CheckInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/invite:check"
      body: "*"
    };
  }

  // BeginAcceptInvite starts creating the passkey of the person an invite
  // names. It refuses while someone is signed in in the browser: accepting
  // only ever makes a new person.
  rpc BeginAcceptInvite(BeginAcceptInviteRequest) returns (BeginAcceptInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/invite:begin"
      body: "*"
    };
  }

  // FinishAcceptInvite spends the invite, makes the person with the role it
  // names and the new passkey, and signs them in.
  rpc FinishAcceptInvite(FinishAcceptInviteRequest) returns (FinishAcceptInviteResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/invite:finish"
      body: "*"
    };
  }

  // BeginPasskeySignIn starts signing in with a passkey.
  rpc BeginPasskeySignIn(BeginPasskeySignInRequest) returns (BeginPasskeySignInResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/sessions:beginPasskeySignIn"
      body: "*"
    };
  }

  // FinishPasskeySignIn checks the passkey's signature and signs in.
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (FinishPasskeySignInResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/sessions:finishPasskeySignIn"
      body: "*"
    };
  }

  // SignInWithCode signs in with a code from an authenticator app, or with a
  // recovery code. Failed attempts slow down, and too many lock code sign-in
  // for the account.
  rpc SignInWithCode(SignInWithCodeRequest) returns (SignInWithCodeResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/sessions:signInWithCode"
      body: "*"
    };
  }

  // SignInWithLink spends a one-time sign-in link from dockwell recover.
  rpc SignInWithLink(SignInWithLinkRequest) returns (SignInWithLinkResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_ANYONE;
    option (google.api.http) = {
      post: "/v1/sessions:signInWithLink"
      body: "*"
    };
  }

  // SignOut ends this session.
  rpc SignOut(SignOutRequest) returns (SignOutResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_NOTHING;
    option (dockwell.v1.min_role_protected) = NEEDS_NOTHING;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/sessions:signOut"
      body: "*"
    };
  }

  // ListSessions returns your sessions that haven't ended, newest first.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {get: "/v1/sessions"};
  }

  // RevokeSession ends one of your sessions. Its open streams close.
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/sessions/{id}:revoke"
      body: "*"
    };
  }

  // RevokeOtherSessions ends every session of yours except this one.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/sessions:revokeOthers"
      body: "*"
    };
  }

  // BeginStepUp starts confirming, with a passkey you have for the address
  // of this request, an action that needs a person right now: revealing a
  // secret, or changing how you sign in or your API tokens. Pass the
  // passkey's answer to FinishStepUp.
  //
  // Call the action without a proof first. It checks everything else, such
  // as the last way in or a token's name, and only then refuses with the
  // reason needs_step_up. Step up, and call it again with the proof, which
  // the action spends only once nothing else refuses it. For someone who
  // chose to be asked less often (StepUpPolicy), the first call may need no
  // proof at all: their session confirms it.
  rpc BeginStepUp(BeginStepUpRequest) returns (BeginStepUpResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/sessions:beginStepUp"
      body: "*"
    };
  }

  // FinishStepUp checks the passkey's answer and returns a proof for the
  // action it began with. The proof works once, within a minute, in this
  // session alone, for that action on that target. It also opens this
  // session's hour for someone who chose STEP_UP_POLICY_HOURLY.
  rpc FinishStepUp(FinishStepUpRequest) returns (FinishStepUpResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/sessions:finishStepUp"
      body: "*"
    };
  }

  // GetStepUpPolicy says how often you're asked for your passkey again: what
  // you chose, the least the install allows, what applies, and whether this
  // session needs no passkey now, until when
  // (docs/adr/0075-how-often-a-passkey-is-asked-for-again.md).
  rpc GetStepUpPolicy(GetStepUpPolicyRequest) returns (GetStepUpPolicyResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {get: "/v1/stepUpPolicy"};
  }

  // SetStepUpPolicy chooses how often you're asked for your passkey again. It
  // needs a proof from FinishStepUp for STEP_UP_ACTION_SET_STEP_UP_POLICY,
  // whichever way it goes, and refuses a choice below the install's floor
  // with the reason below_floor.
  rpc SetStepUpPolicy(SetStepUpPolicyRequest) returns (SetStepUpPolicyResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/stepUpPolicy:set"
      body: "*"
    };
  }

  // ListPasskeys returns your passkeys, oldest first.
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {get: "/v1/passkeys"};
  }

  // BeginAddPasskey starts adding a passkey for the address of this request.
  // It needs a proof from FinishStepUp for adding a passkey, made with a
  // passkey you have for this address. A sign-in in the last 10 minutes
  // that needed no passkey here confirms one passkey instead, so you can
  // add one when you have none here: a link from dockwell recover, a
  // recovery code, or a code from an authenticator app when no passkey is
  // registered for this address.
  rpc BeginAddPasskey(BeginAddPasskeyRequest) returns (BeginAddPasskeyResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/passkeys:beginAdd"
      body: "*"
    };
  }

  // FinishAddPasskey saves the new passkey. One a sign-in confirmed is
  // checked again: still within its 10 minutes, and the first since.
  rpc FinishAddPasskey(FinishAddPasskeyRequest) returns (FinishAddPasskeyResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/passkeys:finishAdd"
      body: "*"
    };
  }

  // RemovePasskey removes one of your passkeys. It needs a proof from
  // FinishStepUp for removing it. It refuses to remove your last way to sign
  // in.
  rpc RemovePasskey(RemovePasskeyRequest) returns (RemovePasskeyResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/passkeys/{id}:remove"
      body: "*"
    };
  }

  // GetTotp says whether you sign in with an authenticator app, and how many
  // recovery codes are left.
  rpc GetTotp(GetTotpRequest) returns (GetTotpResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {get: "/v1/totp"};
  }

  // BeginTotpSetup makes a new authenticator secret. It needs a proof from
  // FinishStepUp for setting up code sign-in. The secret takes effect only
  // once ConfirmTotpSetup checks a code from it, in this session, within
  // 10 minutes.
  rpc BeginTotpSetup(BeginTotpSetupRequest) returns (BeginTotpSetupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:beginSetup"
      body: "*"
    };
  }

  // ConfirmTotpSetup checks a code from the new secret, turns code sign-in
  // on, and returns new recovery codes. They are shown once. Only the
  // session that began the setup can, and 5 wrong codes end it, so it needs
  // a new step-up.
  rpc ConfirmTotpSetup(ConfirmTotpSetupRequest) returns (ConfirmTotpSetupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:confirmSetup"
      body: "*"
    };
  }

  // CancelTotpSetup forgets the setup this session began, so its secret
  // works nowhere. It does nothing when none is waiting.
  rpc CancelTotpSetup(CancelTotpSetupRequest) returns (CancelTotpSetupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:cancelSetup"
      body: "*"
    };
  }

  // DisableTotp turns code sign-in off and deletes the secret and recovery
  // codes. It needs a proof from FinishStepUp for turning code sign-in off.
  // It refuses when that would leave no way to sign in.
  rpc DisableTotp(DisableTotpRequest) returns (DisableTotpResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:disable"
      body: "*"
    };
  }

  // RegenerateRecoveryCodes replaces your recovery codes. The old ones stop
  // working. It needs a proof from FinishStepUp for making recovery codes.
  rpc RegenerateRecoveryCodes(RegenerateRecoveryCodesRequest) returns (RegenerateRecoveryCodesResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:regenerateRecoveryCodes"
      body: "*"
    };
  }

  // UnlockCodeSignIn turns code sign-in back on after too many wrong codes
  // locked it.
  rpc UnlockCodeSignIn(UnlockCodeSignInRequest) returns (UnlockCodeSignInResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_SELF;
    option (google.api.http) = {
      post: "/v1/totp:unlock"
      body: "*"
    };
  }
}

// Role is what a person may do.
enum Role {
  // No role on the whole install: someone who holds projects alone, or
  // nothing.
  ROLE_UNSPECIFIED = 0;
  // Everything, on every server. One person, who claimed the install or had
  // it transferred to them.
  ROLE_OWNER = 1;
  // Everything but what's the owner's alone: transferring ownership, and the
  // owner's own sign-in.
  ROLE_ADMIN = 2;
  // Plans, and applies outside protected environments, in the projects held.
  ROLE_DEVELOPER = 3;
  // Reads, in the projects held.
  ROLE_VIEWER = 4;
}

// SignInMethod is how a session began.
enum SignInMethod {
  SIGN_IN_METHOD_UNSPECIFIED = 0;
  // Claiming the install, which creates the first passkey.
  SIGN_IN_METHOD_CLAIM = 1;
  // A passkey.
  SIGN_IN_METHOD_PASSKEY = 2;
  // A code from an authenticator app.
  SIGN_IN_METHOD_AUTHENTICATOR_CODE = 3;
  // A one-time recovery code.
  SIGN_IN_METHOD_RECOVERY_CODE = 4;
  // A one-time link from dockwell recover.
  SIGN_IN_METHOD_LINK = 5;
  // Accepting an invite, with the passkey it made.
  SIGN_IN_METHOD_INVITE = 6;
}

// User is a person who signs in to the panel.
message User {
  // The user's ID, such as "usr_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // What they are called, such as "Mira Chen".
  string name = 2;
  // Their email, which signs in with a code.
  string email = 3;
  // What they may do.
  Role role = 4;
  // When the account was made.
  google.protobuf.Timestamp create_time = 5;
}

// GetAuthStateRequest takes no parameters.
message GetAuthStateRequest {}

// GetAuthStateResponse describes the install and this request's session.
message GetAuthStateResponse {
  // True once the install has an owner. Until then, only a claim link from
  // dockwell run or dockwell claim can create one.
  bool claimed = 1;
  // The signed-in user. Unset when the request has no valid session.
  User user = 2;
  // This session's ID. Empty when not signed in.
  string session_id = 3;
  // The control server's name, such as "hz-1".
  string server_name = 4;
  // The WebAuthn relying party ID for this address: "localhost", or the
  // panel's domain. Passkeys made here work only here.
  string rp_id = 5;
  // The panel's own domain, such as "panel.acme.dev". Empty when the panel is
  // reachable only on loopback.
  string domain = 6;
  // How this session began. Unset when not signed in.
  SignInMethod sign_in_method = 7;
  // The command that prints a new claim link on the control server, as
  // Dockwell runs there, such as "sudo dockwell claim" for the system service,
  // or "dockwell claim" for a control plane a user runs themselves. Set only
  // while the install has no owner.
  string claim_command = 8;
  // What the install is called, as its settings have it, for the sign-in screen
  // to say. Empty when nobody has named it.
  string install_name = 9;
  // What the signed-in person holds: a role on the whole install, on projects,
  // or both. The panel reads from these, and from each method's
  // (dockwell.v1.min_role) and (dockwell.v1.reach), what to offer
  // (docs/adr/0059-what-the-panel-knows-of-what-you-may-do.md). Empty when
  // not signed in, and for someone with no role left.
  repeated RoleGrant grants = 10;
}

// RoleGrant is a role someone holds, and where.
message RoleGrant {
  // The project it's on, by ID. Empty for the whole install, which covers
  // every project.
  string project_id = 1;
  // The role.
  Role role = 2;
}

// CheckClaimRequest carries a claim link's token.
message CheckClaimRequest {
  // The token from the claim link, the part after "#".
  string token = 1 [(dockwell.v1.flag) = "claim-token"];
}

// CheckClaimResponse describes the server a valid claim link claims.
message CheckClaimResponse {
  // The control server, as its agent last reported it.
  Server server = 1;
  // This server's public IP address, such as "203.0.113.7", for pointing a
  // domain at: an A record, or AAAA for an IPv6 address. Empty when the
  // server doesn't know one, as behind NAT, where its own address is private.
  string public_address = 2;
  // When the link stops working.
  google.protobuf.Timestamp expire_time = 3;
}

// BeginClaimRequest names the owner.
message BeginClaimRequest {
  // The token from the claim link.
  string token = 1 [(dockwell.v1.flag) = "claim-token"];
  // The owner's name, such as "Mira Chen".
  string name = 2;
  // The owner's email.
  string email = 3;
}

// BeginClaimResponse carries the options for creating the passkey.
message BeginClaimResponse {
  // Pass back to FinishClaim.
  string ceremony_id = 1;
  // PublicKeyCredentialCreationOptionsJSON.
  string options_json = 2;
}

// FinishClaimRequest carries the new passkey.
message FinishClaimRequest {
  // From BeginClaim.
  string ceremony_id = 1;
  // The token from the claim link, again: it is spent only here.
  string token = 2 [(dockwell.v1.flag) = "claim-token"];
  // RegistrationResponseJSON from navigator.credentials.create.
  string credential_json = 3;
  // What to call the passkey, such as "Chrome on macOS". Optional.
  string passkey_name = 4;
}

// FinishClaimResponse carries the new owner. The response sets the session
// cookie.
message FinishClaimResponse {
  // The owner.
  User user = 1;
}

// CheckInviteRequest carries an invite's secret, from after the # in its link.
message CheckInviteRequest {
  string secret = 1;
}

// CheckInviteResponse says what an invite offers.
message CheckInviteResponse {
  // Who it names.
  string email = 1;
  Role role = 2;
  // The project's name, for a developer or a viewer of one. Empty for the
  // whole install.
  string project_name = 3;
  // Who made it, by name.
  string invited_by = 4;
  google.protobuf.Timestamp expire_time = 5;
  // The project's ID, for a developer or a viewer of one. Empty for the whole
  // install: what says "every project" is this, never an empty name.
  string project_id = 6;
}

// BeginAcceptInviteRequest names the person accepting.
message BeginAcceptInviteRequest {
  string secret = 1;
  // Their name, such as "Ada Lovelace".
  string name = 2;
}

// BeginAcceptInviteResponse carries the passkey ceremony to finish.
message BeginAcceptInviteResponse {
  string ceremony_id = 1;
  // PublicKeyCredentialCreationOptionsJSON, for navigator.credentials.create.
  string options_json = 2;
}

// FinishAcceptInviteRequest finishes the passkey and spends the invite.
message FinishAcceptInviteRequest {
  // From BeginAcceptInvite.
  string ceremony_id = 1;
  // The invite's secret, again: it is spent only here.
  string secret = 2;
  // RegistrationResponseJSON from navigator.credentials.create.
  string credential_json = 3;
  // What to call the passkey, such as "Chrome on macOS". Optional.
  string passkey_name = 4;
}

// FinishAcceptInviteResponse carries the new person. The response sets the
// session cookie.
message FinishAcceptInviteResponse {
  User user = 1;
}

// BeginPasskeySignInRequest takes no parameters: the browser offers the
// passkeys it holds for this address.
message BeginPasskeySignInRequest {}

// BeginPasskeySignInResponse carries the options for the passkey assertion.
message BeginPasskeySignInResponse {
  // Pass back to FinishPasskeySignIn.
  string ceremony_id = 1;
  // PublicKeyCredentialRequestOptionsJSON.
  string options_json = 2;
}

// FinishPasskeySignInRequest carries the passkey's assertion.
message FinishPasskeySignInRequest {
  // From BeginPasskeySignIn.
  string ceremony_id = 1;
  // AuthenticationResponseJSON from navigator.credentials.get.
  string credential_json = 2;
}

// FinishPasskeySignInResponse carries who signed in. The response sets the
// session cookie.
message FinishPasskeySignInResponse {
  // The user.
  User user = 1;
}

// SignInWithCodeRequest carries an email and a code.
message SignInWithCodeRequest {
  // The account's email.
  string email = 1;
  // A 6-digit code from the authenticator app, or a recovery code such as
  // "7KQ2-M9XD-4TPA-ZR3C".
  string code = 2;
}

// SignInWithCodeResponse carries who signed in. The response sets the session
// cookie.
message SignInWithCodeResponse {
  // The user.
  User user = 1;
  // True when a recovery code was used. It now no longer works.
  bool used_recovery_code = 2;
  // Recovery codes still unused.
  int32 recovery_codes_left = 3;
}

// SignInWithLinkRequest carries a sign-in link's token.
message SignInWithLinkRequest {
  // The token from the link, the part after "#".
  string token = 1 [(dockwell.v1.flag) = "link-token"];
}

// SignInWithLinkResponse carries who signed in. The response sets the session
// cookie.
message SignInWithLinkResponse {
  // The user.
  User user = 1;
}

// SignOutRequest takes no parameters.
message SignOutRequest {}

// SignOutResponse is empty. The response clears the session cookie.
message SignOutResponse {}

// ListSessionsRequest takes no parameters.
message ListSessionsRequest {}

// ListSessionsResponse lists sessions.
message ListSessionsResponse {
  // Sessions, newest first.
  repeated Session sessions = 1;
}

// Session is one signed-in browser.
message Session {
  // The session's ID, such as "ses_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // The browser's User-Agent when it signed in.
  string user_agent = 2;
  // The address it was last seen from.
  string address = 3;
  // When it signed in.
  google.protobuf.Timestamp create_time = 4;
  // When it last made a request.
  google.protobuf.Timestamp last_seen_time = 5;
  // When it ends unless it is revoked first: the earlier of its idle and
  // absolute limits.
  google.protobuf.Timestamp expire_time = 6;
  // True for the session making this request.
  bool current = 7;
  // How it signed in.
  SignInMethod sign_in_method = 8;
  // The address it works on: "localhost" or the panel's domain.
  string rp_id = 9;
}

// RevokeSessionRequest names a session.
message RevokeSessionRequest {
  // The session's ID.
  string id = 1;
}

// RevokeSessionResponse is empty.
message RevokeSessionResponse {}

// RevokeOtherSessionsRequest takes no parameters.
message RevokeOtherSessionsRequest {}

// RevokeOtherSessionsResponse says how many sessions ended.
message RevokeOtherSessionsResponse {
  // How many sessions were revoked.
  int32 revoked = 1;
}

// ListPasskeysRequest takes no parameters.
message ListPasskeysRequest {}

// ListPasskeysResponse lists passkeys.
message ListPasskeysResponse {
  // Passkeys, oldest first.
  repeated Passkey passkeys = 1;
}

// Passkey is one of a user's passkeys.
message Passkey {
  // The passkey's ID, such as "pky_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // What it is called. Empty when it was given no name.
  string name = 2;
  // The address it works on: "localhost" or the panel's domain.
  string rp_id = 3;
  // When it was added.
  google.protobuf.Timestamp create_time = 4;
  // When it last signed in. Unset if never.
  google.protobuf.Timestamp last_used_time = 5;
  // True when the passkey can sync between devices, as with iCloud Keychain
  // or Google Password Manager.
  bool synced = 6;
  // True when it once reported a lower use count than before, which happens
  // when a passkey is copied. It no longer signs in; remove it.
  bool suspected_copy = 7;
}

// StepUpAction is an action that needs a fresh passkey assertion.
enum StepUpAction {
  STEP_UP_ACTION_UNSPECIFIED = 0;
  // Revealing a secret's value, with RevealSecret. The target is the
  // secret's ID.
  STEP_UP_ACTION_REVEAL_SECRET = 1;
  // Adding a passkey, with BeginAddPasskey. It has no target.
  STEP_UP_ACTION_ADD_PASSKEY = 2;
  // Removing a passkey, with RemovePasskey. The target is the passkey's ID.
  STEP_UP_ACTION_REMOVE_PASSKEY = 3;
  // Setting up code sign-in with a new authenticator secret, with
  // BeginTotpSetup, which ConfirmTotpSetup finishes with new recovery
  // codes. It has no target.
  STEP_UP_ACTION_SET_UP_CODES = 4;
  // Turning code sign-in off, with DisableTotp. It has no target.
  STEP_UP_ACTION_DISABLE_CODES = 5;
  // Making new recovery codes, with RegenerateRecoveryCodes. It has no
  // target.
  STEP_UP_ACTION_REGENERATE_RECOVERY_CODES = 6;
  // Creating an API token, with TokenService.CreateToken. It has no target.
  STEP_UP_ACTION_CREATE_TOKEN = 7;
  // Applying a change that gives something as much as root on a server, with
  // ChangeService.ApplyChange. The target is the change's ID.
  STEP_UP_ACTION_APPLY_ROOT_CHANGE = 8;
  // Saving a file that's a way back onto a server, with FileService.SaveFile.
  // The target is the server's ID and the path ReadFile gave, as "srv_…:/path".
  STEP_UP_ACTION_SAVE_WAY_BACK_IN = 9;
  // End a process on a server (ProcessService.EndProcess), whose target is
  // "<server ID>:<PID>:<start ticks>", so a proof ends no other process that
  // gets the PID once it has gone. Numbered apart, as open work adds to this enum.
  STEP_UP_ACTION_END_PROCESS = 20;
  // Opening a terminal on a server, with TerminalService.OpenTerminal. The
  // target is the server's ID, or for a shell in a container, the server's ID and
  // the container as the request names it, as "srv_…:web".
  STEP_UP_ACTION_OPEN_TERMINAL = 10;
  // Making a file or a folder that's a way back onto a server, with
  // FileService.MakeFile. The target is the server's ID and the path, as
  // "srv_…:/path". Numbered apart, as open work adds to this enum.
  STEP_UP_ACTION_MAKE_WAY_BACK_IN = 90;
  // Moving or renaming a file or a folder where either end is a way back
  // onto a server, with FileService.MoveFile. The target is the server's ID
  // and both paths, on two lines, as "srv_…:/from\n/to".
  STEP_UP_ACTION_MOVE_WAY_BACK_IN = 91;
  // Deleting a file or a folder that's a way back onto a server, or holds
  // one, with FileService.DeleteFile. The target is "srv_…:/path".
  STEP_UP_ACTION_DELETE_WAY_BACK_IN = 92;
  // Putting back a file or a folder where it's a way back onto a server,
  // with FileService.RestoreFile. The target is "srv_…:/path", the path it
  // goes back to.
  STEP_UP_ACTION_RESTORE_WAY_BACK_IN = 93;
  // Approving someone else's change in a protected environment, as an admin
  // or the owner, by applying it with ChangeService.ApplyChange. The target is
  // the change's ID and the fingerprint of the plan reviewed, as
  // "chg_…:fingerprint", so the proof is good for that plan alone. It also
  // stands for applying a change that gives something as much as root.
  STEP_UP_ACTION_APPROVE_CHANGE = 114;
  // Inviting someone, with MemberService.CreateInvite. The target is the
  // email, lowercased, the role's name and the place, apart by spaces, as
  // "ada@example.com developer prj_…", or "install" for the whole install.
  STEP_UP_ACTION_INVITE = 110;
  // Making a ticket that adds a server, with ServerService.CreateJoinTicket. It
  // has no target of its own: the person's ID, which BeginStepUp fills in.
  STEP_UP_ACTION_ADD_SERVER = 130;
  // Opening a service's web UI through the panel, with
  // ServiceService.OpenService, as many an admin tool signs whoever reaches it
  // in by itself (ADR 0061). The target is the service's ID. Numbered apart, as
  // open work adds to this enum.
  STEP_UP_ACTION_OPEN_SERVICE = 200;
  // Setting or clearing the panel's domain, which decides where everyone signs
  // in (ADR 0063). The target is the domain, or the one it clears.
  STEP_UP_ACTION_SET_PANEL_DOMAIN = 230;
  // A one-time sign-in link to the panel on its domain, for the person asking.
  // The target is the domain.
  STEP_UP_ACTION_SIGN_IN_ON_PANEL_DOMAIN = 231;
  // Choosing how often your passkey is asked for again, with SetStepUpPolicy.
  // It has no target. It asks each time, whatever the choice.
  STEP_UP_ACTION_SET_STEP_UP_POLICY = 240;
  // Setting the least anyone may choose, with SettingsService.SetStepUpFloor.
  // It has no target. It asks each time, whatever the choice.
  STEP_UP_ACTION_SET_STEP_UP_FLOOR = 241;
  // Reveals one of a service's own environment variables that reads hidden.
  // Its target is the service's ID and the name, as "svc_…:NAME". Numbered
  // apart, as open work adds to this enum.
  STEP_UP_ACTION_REVEAL_SERVICE_VALUE = 60;
}

// StepUpPolicy is how often someone is asked for their passkey again, for
// the actions a step-up confirms. Whatever it is, adding or removing a
// passkey, setting up or turning off codes, making recovery codes, changing
// this choice or the floor, and approving someone else's change in a
// protected environment ask each time. Only a signed-in session is ever
// covered; an API token never is.
enum StepUpPolicy {
  STEP_UP_POLICY_UNSPECIFIED = 0;
  // A passkey for each action, once, within a minute. The default.
  STEP_UP_POLICY_EACH_TIME = 1;
  // A passkey in this session within the last hour confirms each action:
  // signing in with one, or any step-up. The hour doesn't grow with use.
  STEP_UP_POLICY_HOURLY = 2;
  // Signing in with a passkey or an authenticator code confirms each action
  // for the session's life. A session begun with a recovery code or a link
  // from dockwell recover is as for STEP_UP_POLICY_HOURLY.
  STEP_UP_POLICY_AT_SIGN_IN = 3;
}

// StepUpChoice is how often someone is asked for their passkey again, and
// what that comes to in this session.
message StepUpChoice {
  // What they chose. STEP_UP_POLICY_EACH_TIME until they choose.
  StepUpPolicy policy = 1;
  // The least the install lets anyone choose, which the owner sets.
  StepUpPolicy floor = 2;
  // What applies: the stricter of policy and floor.
  StepUpPolicy effective = 3;
  // When this session's cover began: the passkey that opened the hour, or
  // signing in. Unset when it has none now, as for each time.
  google.protobuf.Timestamp cover_time = 4;
  // When it ends: an hour after that passkey, or when the session does.
  // Unset with cover_time.
  google.protobuf.Timestamp cover_expire_time = 5;
  // True when signing in is what covers this session, for its life, rather
  // than a passkey's hour.
  bool cover_at_sign_in = 6;
}

// GetStepUpPolicyRequest takes no parameters.
message GetStepUpPolicyRequest {}

// GetStepUpPolicyResponse carries the choice.
message GetStepUpPolicyResponse {
  StepUpChoice choice = 1;
}

// SetStepUpPolicyRequest carries the new choice.
message SetStepUpPolicyRequest {
  // The choice. Not below the install's floor.
  StepUpPolicy policy = 1;
  // The proof from FinishStepUp, for STEP_UP_ACTION_SET_STEP_UP_POLICY.
  string proof = 2;
}

// SetStepUpPolicyResponse carries the choice as it now is.
message SetStepUpPolicyResponse {
  StepUpChoice choice = 1;
}

// StepUpNeeded is the detail of an error whose reason is "needs_step_up",
// when the call says which step-up it takes: its action and target, to pass
// to BeginStepUp as they are. Applying someone else's change in a protected
// environment, for one, takes STEP_UP_ACTION_APPROVE_CHANGE, bound to the
// plan's fingerprint.
message StepUpNeeded {
  StepUpAction action = 1;
  string target = 2;
}

// BeginStepUpRequest says what the passkey confirms.
message BeginStepUpRequest {
  // The action.
  StepUpAction action = 1;
  // What it acts on: a secret's ID to reveal it, a passkey's to remove it.
  // Leave it out for an action on your own account, such as adding a
  // passkey.
  string target = 2;
}

// BeginStepUpResponse carries the options for the passkey's assertion.
message BeginStepUpResponse {
  // Pass back to FinishStepUp.
  string ceremony_id = 1;
  // PublicKeyCredentialRequestOptionsJSON, which allows only your passkeys
  // for this address.
  string options_json = 2;
}

// FinishStepUpRequest carries the passkey's answer.
message FinishStepUpRequest {
  // From BeginStepUp.
  string ceremony_id = 1;
  // AuthenticationResponseJSON from navigator.credentials.get.
  string credential_json = 2;
}

// FinishStepUpResponse carries the proof.
message FinishStepUpResponse {
  // Pass it to the action's method, such as RevealSecret's proof.
  string proof = 1;
  // When it stops working, a minute from now.
  google.protobuf.Timestamp expire_time = 2;
}

// BeginAddPasskeyRequest confirms adding a passkey.
message BeginAddPasskeyRequest {
  // The proof from FinishStepUp, for adding a passkey. Leave it out within
  // 10 minutes of signing in with a code, a recovery code or a link from
  // dockwell recover.
  string proof = 1;
}

// BeginAddPasskeyResponse carries the options for creating the passkey.
message BeginAddPasskeyResponse {
  // Pass back to FinishAddPasskey.
  string ceremony_id = 1;
  // PublicKeyCredentialCreationOptionsJSON.
  string options_json = 2;
}

// FinishAddPasskeyRequest carries the new passkey.
message FinishAddPasskeyRequest {
  // From BeginAddPasskey.
  string ceremony_id = 1;
  // RegistrationResponseJSON from navigator.credentials.create.
  string credential_json = 2;
  // What to call it, such as "YubiKey 5C". Optional.
  string name = 3;
}

// FinishAddPasskeyResponse carries the saved passkey.
message FinishAddPasskeyResponse {
  // The passkey.
  Passkey passkey = 1;
}

// RemovePasskeyRequest names a passkey.
message RemovePasskeyRequest {
  // The passkey's ID.
  string id = 1;
  // The proof from FinishStepUp, for removing this passkey.
  string proof = 2;
}

// RemovePasskeyResponse is empty.
message RemovePasskeyResponse {}

// GetTotpRequest takes no parameters.
message GetTotpRequest {}

// GetTotpResponse describes code sign-in.
message GetTotpResponse {
  // Code sign-in.
  Totp totp = 1;
}

// Totp is the state of signing in with an authenticator app.
message Totp {
  // True when code sign-in is on.
  bool enabled = 1;
  // Recovery codes still unused.
  int32 recovery_codes_left = 2;
  // Wrong codes in a row since the last good one.
  int32 failed_attempts = 3;
  // When too many wrong codes locked code sign-in. Unset when it isn't locked.
  // Recovery codes still work while it is locked.
  google.protobuf.Timestamp lock_time = 4;
}

// BeginTotpSetupRequest confirms setting up code sign-in.
message BeginTotpSetupRequest {
  // The proof from FinishStepUp, for setting up code sign-in.
  string proof = 1;
}

// BeginTotpSetupResponse carries the new secret.
message BeginTotpSetupResponse {
  // The secret in base32, for typing into an authenticator app.
  string secret = 1;
  // The otpauth:// URI, for a QR code.
  string uri = 2;
}

// ConfirmTotpSetupRequest carries a code from the new secret.
message ConfirmTotpSetupRequest {
  // A 6-digit code from the authenticator app.
  string code = 1;
}

// ConfirmTotpSetupResponse carries the recovery codes.
message ConfirmTotpSetupResponse {
  // Ten one-time recovery codes. They are shown only now; store them safely.
  repeated string recovery_codes = 1;
}

// CancelTotpSetupRequest takes nothing.
message CancelTotpSetupRequest {}

// CancelTotpSetupResponse is empty.
message CancelTotpSetupResponse {}

// DisableTotpRequest confirms turning code sign-in off.
message DisableTotpRequest {
  // The proof from FinishStepUp, for turning code sign-in off.
  string proof = 1;
}

// DisableTotpResponse is empty.
message DisableTotpResponse {}

// RegenerateRecoveryCodesRequest confirms making new recovery codes.
message RegenerateRecoveryCodesRequest {
  // The proof from FinishStepUp, for making recovery codes.
  string proof = 1;
}

// RegenerateRecoveryCodesResponse carries the new codes.
message RegenerateRecoveryCodesResponse {
  // Ten one-time recovery codes. They are shown only now.
  repeated string recovery_codes = 1;
}

// UnlockCodeSignInRequest takes no parameters.
message UnlockCodeSignInRequest {}

// UnlockCodeSignInResponse is empty.
message UnlockCodeSignInResponse {}

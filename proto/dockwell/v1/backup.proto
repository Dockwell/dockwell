syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/options.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// BackupService is an app's volumes and databases, backed up on the server that
// has them. Taking a backup is an event: it changes no desired state, so it makes
// no revision, and a failed one shows on the timeline. Restoring one is a change
// with a plan, which says what it replaces and what stops, and which only a person
// can apply. See docs/adr/0033-backups-of-volumes-and-databases.md.
//
// A backup holds what its app stored, secrets among them, so nothing here gives
// anyone its bytes.
service BackupService {
  // ListBackups returns backups, newest first, a page at a time. It reads the
  // control plane's records, so it answers with a server offline.
  rpc ListBackups(ListBackupsRequest) returns (ListBackupsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/backups"};
  }

  // GetBackup returns one backup, with how far one under way has got.
  rpc GetBackup(GetBackupRequest) returns (GetBackupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/backups/{id}"};
  }

  // PreviewBackup says what backing up a volume would do, asking its server, and
  // changes nothing: the database's own dump, or a copy of its files, and what
  // runs on it now. A copy of a running app's files can hold half a write, so
  // when something runs on a volume that has no dump, ask CreateBackup to stop it.
  rpc PreviewBackup(PreviewBackupRequest) returns (PreviewBackupResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/backups:preview"};
  }

  // CreateBackup starts a backup of a volume on its server, which has to be
  // connected. It returns the backup running, and the backup ends whether or not
  // the caller waits: follow it with GetBackup.
  rpc CreateBackup(CreateBackupRequest) returns (CreateBackupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/backups"
      body: "*"
    };
  }

  // DeleteBackup removes a backup from its server and from the record. Nothing
  // brings it back, so it needs a person. A backup that failed has nothing on the
  // server, and its record goes all the same.
  rpc DeleteBackup(DeleteBackupRequest) returns (DeleteBackupResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {delete: "/v1/backups/{id}"};
  }

  // ListBackupPolicies returns the schedules of backups, with when each next runs
  // and how its last run went. A policy is a resource: create, change and delete
  // one as a change, of kind "backup.policy".
  rpc ListBackupPolicies(ListBackupPoliciesRequest) returns (ListBackupPoliciesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (dockwell.v1.command) = {
      noun: "backups"
      verb: "policies"
    };
    option (google.api.http) = {get: "/v1/backup-policies"};
  }

  // ListBackupDestinations returns the S3-compatible storage backups can go to, and
  // never what signs in to it. A destination is a resource: create and delete one as
  // a change, of kind "backup.destination".
  rpc ListBackupDestinations(ListBackupDestinationsRequest) returns (ListBackupDestinationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_NAMED;
    option (dockwell.v1.command) = {
      noun: "backups"
      verb: "destinations"
    };
    option (google.api.http) = {get: "/v1/backup-destinations"};
  }

  // FetchBackup brings a backup back from its destination onto a server that has the
  // volume, to restore there: the one it came from, or another once that's gone. It
  // returns the backup, whose server is the one it's fetching to. It reads the backup
  // back whole before it counts. The server has to be connected.
  rpc FetchBackup(FetchBackupRequest) returns (FetchBackupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/backups/{id}:fetch"
      body: "*"
    };
  }

  // RestoreBackup plans replacing what's in a backup's volume with what the
  // backup holds, as a change. Its plan says what it replaces and what stops, and
  // it destroys data, so only a person can apply it, with the plan's fingerprint.
  // The server keeps a copy of what's replaced for 7 days, and undoing the change
  // puts that back.
  rpc RestoreBackup(RestoreBackupRequest) returns (RestoreBackupResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/backups/{id}:restore"
      body: "*"
    };
  }

  // DrillBackup checks that a backup on its server restores, in a container and a
  // volume of its own that nothing reaches and that it throws away, whatever comes
  // of it (ADR 0068). It replaces nothing, so it takes the roles a backup does. It
  // returns the drill running; follow it with GetBackup, whose drill says how it
  // ended. A server runs one at a time, and an API token starts at most one drill of
  // a volume an hour.
  rpc DrillBackup(DrillBackupRequest) returns (DrillBackupResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/backups/{id}:drill"
      body: "*"
    };
  }
}

// DrillBackupRequest names a backup to check.
message DrillBackupRequest {
  // The backup's ID.
  string id = 1;
}

// DrillBackupResponse is the drill, running.
message DrillBackupResponse {
  // The drill.
  BackupDrill drill = 1;
}

// BackupDrill is a check that a backup restores (ADR 0068).
message BackupDrill {
  // The drill's ID.
  string id = 1;
  // How it went.
  DrillResult result = 2;
  // What failed, or why it wasn't checked, in a line: "orders.items has no rows; the
  // dump fills it", or "the disk had no room". Empty once it passed.
  string why = 3;
  // What the database printed last, for a drill that failed or wasn't checked,
  // without what it quoted.
  string detail = 4;
  // How much came back, in bytes.
  int64 restored_bytes = 5;
  // How many tables it checked, for a database's dump.
  int32 tables = 6;
  // True for a copy of files it could only unpack, which proves the archive restores
  // whole, and not that the app makes sense of it: "Unpacked whole".
  bool unpacked_only = 7;
  google.protobuf.Timestamp started_at = 8;
  // Unset while it runs.
  google.protobuf.Timestamp finished_at = 9;
  // Who started it.
  Actor actor = 10;
}

// DrillResult says how a restore drill went.
enum DrillResult {
  DRILL_RESULT_UNSPECIFIED = 0;
  // It's under way.
  DRILL_RESULT_RUNNING = 1;
  // The backup restored, and held what it should.
  DRILL_RESULT_PASSED = 2;
  // The backup didn't restore, or failed a check.
  DRILL_RESULT_FAILED = 3;
  // It was cut short, or couldn't run, which says nothing about the backup: no
  // room, no memory, out of time, the server or the control plane went away.
  DRILL_RESULT_NOT_CHECKED = 4;
}

// BackupState says where a backup is.
enum BackupState {
  BACKUP_STATE_UNSPECIFIED = 0;
  // It's being taken.
  BACKUP_STATE_RUNNING = 1 [(dockwell.v1.word) = "Running"];
  // It's on its server, and it read back whole.
  BACKUP_STATE_DONE = 2 [(dockwell.v1.word) = "Done"];
  // It failed, and left nothing on its server.
  BACKUP_STATE_FAILED = 3 [(dockwell.v1.word) = "Failed"];
}

// Backup is one backup of one volume.
message Backup {
  // The backup's ID, such as "bkp_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // The environment its volume is in, by ID.
  string environment_id = 2;
  // The volume, by name. It stays after the volume is deleted.
  string volume = 3;
  // The volume's ID.
  string volume_id = 4;
  // The server that holds it, by ID.
  string server_id = 5;
  // The server's name, such as "hz-1".
  string server_name = 6;
  // Where it is.
  BackupState state = 7;
  // How it's taken. Unset until the server says.
  BackupMethod method = 8;
  // The database it's a dump of, such as "PostgreSQL". Empty for any other.
  string database = 9;
  // Its size on the server's disk, in bytes.
  int64 size_bytes = 10;
  // Its SHA-256, in hex.
  string sha256 = 11;
  // When it started.
  google.protobuf.Timestamp started_at = 12;
  // When it ended. Unset while it runs.
  google.protobuf.Timestamp finished_at = 13;
  // Who took it.
  Actor actor = 14;
  // Why it failed, for people.
  string error = 15;
  // How many files changed while they were read, for a copy of a running app.
  int64 files_changed = 16;
  // How one under way is going, for people, such as "Copying data: 1.2 GB so far".
  string progress = 17;
  // The policy that took it, by ID. Empty for one someone took.
  string policy_id = 18;
  // The destination it went to, by name. Empty for one that stayed on its server.
  string destination = 19;
  // Where it stands there.
  BackupCopy copy = 20;
  // Why it isn't there, for people. Empty unless the copy failed.
  string copy_error = 21;
  // True while it can be restored where it is: its server has it, is in the fleet and
  // connected, and still has its volume. A backup that's stored has to be fetched
  // otherwise.
  bool on_server = 22;
  // Why it couldn't be fetched back, for people. Empty once it has been.
  string fetch_error = 23;
  // True when its copy won't open with what its destination has now, as the
  // destination was removed, or removed and added again with another passphrase. Only
  // the passphrase that sealed it opens it.
  bool sealed_earlier = 24;
  // The connected servers it can be fetched onto, by name: those its volume is on. Set
  // for a stored backup that isn't on a server that can restore it now.
  repeated string fetch_onto = 25;
  // Its newest restore drill, running or ended. Unset when it was never checked.
  BackupDrill drill = 26;
}

// BackupCopy says where a backup stands on its destination.
enum BackupCopy {
  BACKUP_COPY_UNSPECIFIED = 0;
  // It's on its way, or waits for the backup to finish.
  BACKUP_COPY_PENDING = 1 [(dockwell.v1.word) = "Sending"];
  // It's there, sealed, and it read back the size it was sent.
  BACKUP_COPY_STORED = 2 [(dockwell.v1.word) = "Stored"];
  // It didn't get there. The backup is still on its server.
  BACKUP_COPY_FAILED = 3 [(dockwell.v1.word) = "Failed"];
}

// BackupDestinationInfo is S3-compatible storage, with nothing that signs in to it.
message BackupDestinationInfo {
  // The destination's ID.
  string id = 1;
  // Its name.
  string name = 2;
  // The storage's address.
  string endpoint = 3;
  // The bucket.
  string bucket = 4;
  // What each object's name starts with.
  string prefix = 5;
  // How many backups are there.
  int32 backups = 6;
  // How much those take, in bytes.
  int64 used_bytes = 7;
  // When the last one got there. Unset until one has.
  google.protobuf.Timestamp last_upload = 8;
  // When the newest backup that didn't get there was taken, and why it
  // didn't. Unset until one has failed. The destination is failing when
  // this is newer than last_upload.
  google.protobuf.Timestamp last_failure = 9;
  string last_failure_error = 10;
}

// ListBackupDestinationsRequest asks for the destinations.
message ListBackupDestinationsRequest {}

// ListBackupDestinationsResponse lists them.
message ListBackupDestinationsResponse {
  // The destinations, by name.
  repeated BackupDestinationInfo destinations = 1;
}

// FetchBackupRequest asks to bring a backup back from its destination.
message FetchBackupRequest {
  // The backup's ID.
  string id = 1;
  // The server, by name or ID, when the volume is on several.
  string server = 2;
}

// FetchBackupResponse is the backup, on a server again.
message FetchBackupResponse {
  // The backup.
  Backup backup = 1;
}

// BackupPolicyInfo is a schedule of backups, as it stands.
message BackupPolicyInfo {
  // The policy's ID.
  string id = 1;
  // Its name.
  string name = 2;
  // The environment it's in, by ID.
  string environment_id = 3;
  // What it asks for.
  dockwell.resource.v1alpha1.BackupPolicy spec = 4;
  // When it next runs.
  google.protobuf.Timestamp next_run = 5;
  // Its newest backup, on any server. Unset until it has run.
  Backup last = 6;
  // How many of its backups are kept now.
  int32 kept = 7;
  // How much those take, in bytes.
  int64 kept_bytes = 8;
}

// ListBackupPoliciesRequest asks for the schedules of backups.
message ListBackupPoliciesRequest {}

// ListBackupPoliciesResponse lists them.
message ListBackupPoliciesResponse {
  // The policies, by name.
  repeated BackupPolicyInfo policies = 1;
}

// ListBackupsRequest asks for a page of backups.
message ListBackupsRequest {
  // How many to return: 50 when unset, and at most 200.
  int32 page_size = 1;
  // Where to start: the next_page_token of the page before. Pass the same filters
  // with it.
  string page_token = 2;
  // Only the backups of one volume, by ID.
  string volume_id = 3;
  // Only the backups in one environment, by ID.
  string environment_id = 4;
}

// ListBackupsResponse is a page of backups.
message ListBackupsResponse {
  // The backups, newest first.
  repeated Backup backups = 1;
  // Pass it as page_token for the next page. Empty on the last page.
  string next_page_token = 2;
}

// GetBackupRequest names a backup.
message GetBackupRequest {
  // The backup's ID.
  string id = 1;
}

// GetBackupResponse is one backup.
message GetBackupResponse {
  // The backup.
  Backup backup = 1;
}

// PreviewBackupRequest names a volume.
message PreviewBackupRequest {
  // The volume's ID, such as "vol_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string volume_id = 1;
  // The server, by name or ID, when the volume is on several.
  string server = 2;
}

// PreviewBackupResponse says what backing up a volume would do.
message PreviewBackupResponse {
  // What it would do with nothing else asked.
  BackupMethod method = 1;
  // The database whose dump it takes, such as "PostgreSQL".
  string database = 2;
  // What runs on the volume now: services by name, and anything else by its
  // container's.
  repeated string running = 3;
  // About how much a backup will take on the server's disk, in bytes: the last one's
  // size, or what's in the volume before there's been one. Zero when that took too
  // long to find out.
  int64 estimate_bytes = 4;
  // What's free on the disk that holds backups, in bytes.
  int64 free_bytes = 5;
  // How much of that a backup leaves alone, in bytes: one that would go below this is
  // refused, or stops, so a backup never fills the disk.
  int64 reserve_bytes = 6;
}

// CreateBackupRequest asks to back up a volume.
message CreateBackupRequest {
  // The volume's ID.
  string volume_id = 1;
  // The server, by name or ID, when the volume is on several.
  string server = 2;
  // Stop what runs on the volume for an exact copy of its files, and start it again
  // after, whatever comes of the backup. A database's dump stops nothing.
  bool stop = 3;
  // A backup destination it goes to as well, by name.
  string destination = 4;
}

// CreateBackupResponse is the backup, running.
message CreateBackupResponse {
  // The backup.
  Backup backup = 1;
}

// DeleteBackupRequest names a backup.
message DeleteBackupRequest {
  // The backup's ID.
  string id = 1;
  // Remove it from its server's disk alone, and keep it on its destination, from
  // where it can be fetched. Without this it goes from both.
  bool server_only = 2;
}

// DeleteBackupResponse says it's gone.
message DeleteBackupResponse {}

// RestoreBackupRequest asks to restore a backup.
message RestoreBackupRequest {
  // The backup's ID.
  string id = 1;
  // What it's for, for the timeline. Empty says what it restores.
  string summary = 2;
}

// RestoreBackupResponse is the change that restores it.
message RestoreBackupResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

syntax = "proto3";

package dockwell.v1;

import "google/protobuf/descriptor.proto";

// Effect says how a method touches managed state. The CLI and MCP generators
// read it: read and plan methods run freely, apply methods show their plan and
// ask first, and destructive methods need a typed confirmation.
enum Effect {
  EFFECT_UNSPECIFIED = 0;
  // Reads state and changes nothing. Safe to retry and to cache.
  EFFECT_READ = 1;
  // Computes a plan and changes nothing.
  EFFECT_PLAN = 2;
  // Applies a plan and changes state. Every apply can be undone.
  EFFECT_APPLY = 3;
  // Applies a plan that removes data or cuts off access, so undo may not
  // bring everything back.
  EFFECT_DESTRUCTIVE = 4;
}

// TokenGrant is something an API token may do beyond its scope, which its
// maker has to ask for. A token has none unless it was made with it, so a
// token made for something else never gains it.
enum TokenGrant {
  TOKEN_GRANT_UNSPECIFIED = 0;
  // Reading logs, which often hold secrets and personal data that apps
  // print.
  TOKEN_GRANT_LOGS = 1;
}

// Command names a method's command in the dockwell CLI, dockwell <noun>
// <verb>, where the generator's rules give a name that is taken or
// misleading. By the rules, the noun is the collection in the method's REST
// path, such as "servers" for /v1/servers/{id}, or for a stream the rest of
// its name after the verb, plural; the verb is the path's custom verb, such
// as "apply" for :apply, or else the first word of the method's name, such
// as "list". See docs/adr/0019-a-cli-generated-from-the-schema.md.
message Command {
  // The noun, such as "api-tokens", in place of the rules' one.
  string noun = 1;
  // The verb, such as "version", in place of the rules' one.
  string verb = 2;
}

extend google.protobuf.MethodOptions {
  // How the method affects managed state. Every Dockwell method sets it; a
  // test in internal/control fails the build when one doesn't.
  Effect effect = 50100;
  // How the dockwell CLI names the method's command, where its rules give a
  // name that is taken or misleading. Most methods leave it unset.
  Command command = 50101;
  // True for a method no API token may call, whatever its scope and
  // effect, because it needs a person in a signed-in session: revealing a
  // secret, which also takes a fresh passkey assertion. AuthService and
  // TokenService, which no token may call at all, leave it unset.
  bool needs_session = 50102;
  // What an API token needs for this method, beyond its scope, because of
  // what the method can read. Most methods leave it unset.
  TokenGrant needs_grant = 50103;
  // The lowest role the method needs where its objects are in an open
  // environment, or in none. Every Dockwell method sets it, and a test fails
  // the build on one that doesn't. See
  // docs/adr/0049-roles-and-invites-by-project.md.
  Needs min_role = 50104;
  // The lowest role the method needs where any of its objects is in a
  // protected environment. Every Dockwell method sets it too.
  Needs min_role_protected = 50105;
  // What the method's objects are, which says how its role is checked.
  // Every Dockwell method sets it.
  Reach reach = 50106;
}

// Needs is the lowest role a method needs (ADR 0049). A role holds where its
// grant does: on a project, or on the install, which covers every project.
enum Needs {
  NEEDS_UNSPECIFIED = 0;
  // No role: a call before signing in, or signing out, which someone with no
  // grant left may still do.
  NEEDS_NOTHING = 1;
  // A viewer's grant: reading.
  NEEDS_VIEWER = 2;
  // A developer's grant: planning, and applying outside protected
  // environments.
  NEEDS_DEVELOPER = 3;
  // An admin's grant, which is on the whole install.
  NEEDS_ADMIN = 4;
  // The owner.
  NEEDS_OWNER = 5;
}

// Reach says what a method's objects are, for how its role is checked
// (ADR 0049).
enum Reach {
  REACH_UNSPECIFIED = 0;
  // Nobody's: a call before signing in, such as signing in or the version.
  REACH_ANYONE = 1;
  // The caller's own sign-in, sessions and tokens, and nobody else's.
  REACH_SELF = 2;
  // The same for everyone who holds a grant, such as the catalog's apps.
  REACH_SHARED = 3;
  // A project's own objects, named by ID or listed, each placed by the
  // resolver.
  REACH_PROJECT = 4;
  // What projects name on the install, such as servers and domains, read or
  // checked by name and state.
  REACH_NAMED = 5;
  // The install's own, such as files, terminals and settings.
  REACH_INSTALL = 6;
}

// Noun describes one noun of the dockwell CLI, the command that holds the
// commands of a service's methods, for a service whose methods' commands
// have several nouns, so its own comment describes more than any one of them.
message Noun {
  // The noun, such as "passkeys".
  string name = 1;
  // Its help, in paragraphs as a comment has them. Method names in it read
  // as their commands, as in a comment.
  string help = 2;
}

extend google.protobuf.ServiceOptions {
  // The help of each noun the service's methods' commands have, when they
  // have more than one. A service whose commands have one noun leaves it
  // unset, and its comment is that noun's help.
  repeated Noun nouns = 50100;
}

extend google.protobuf.FieldOptions {
  // The dockwell CLI's flag for a request's field, in place of the field's
  // name in kebab-case, where that would take one of the CLI's own flags,
  // such as --token for a claim link's token. Most fields leave it unset.
  string flag = 50100;
  // The dockwell CLI's flag for a request's text field also reads it from a
  // file, as --compose @compose.yaml, or from standard input with -, as a JSON
  // flag does, so a file that may hold a secret needn't go on the command line.
  bool from_file = 50101;
}

extend google.protobuf.EnumValueOptions {
  // What people read for a value, where that isn't its name in words: the
  // dockwell CLI's word for it, which the panel says too, such as "Running" for
  // HEALTH_STATE_NO_CHECK. Most values leave it unset.
  string word = 50100;
}

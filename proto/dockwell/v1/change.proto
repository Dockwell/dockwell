// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

package dockwell.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/token.proto";
import "dockwell/v1/update.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// ChangeService is the one way to change managed state, for every kind of
// resource: projects, environments, services, volumes, networks, routes,
// containers and firewall rules alike. You propose edits and get a plan back; applying the plan writes
// immutable revisions and runs its steps on the servers; undoing makes a new
// plan that puts things back. See docs/adr/0009-resources-revisions-and-plans.md
// and docs/adr/0017-the-change-api-and-the-agent-stream.md.
//
// Plans never show a secret: a field that may hold one says that it changed,
// never what it holds, and no response carries a spec.
//
// WatchChange streams, so it has no REST path. A REST client follows a
// change by polling GET /v1/changes/{id}, which carries the same progress,
// or opens the stream with Connect, gRPC or gRPC-Web, with the same
// credentials.
service ChangeService {
  option (dockwell.v1.nouns) = {
    name: "changes"
    help: "A change is a set of edits to managed state, with the plan that carries them out. You propose edits and get a plan back; applying it writes immutable revisions and runs its steps on the servers; undoing it makes a new plan that puts things back. A change applies only as it was planned, and a plan never shows a secret, only that it changed.\n\nSee docs/adr/0009-resources-revisions-and-plans.md and docs/adr/0017-the-change-api-and-the-agent-stream.md."
  };
  option (dockwell.v1.nouns) = {
    name: "services"
    help: "A service is anything that runs in an environment, placed on servers. RestartService plans a restart, which is a change with a plan: it records no revision, as a restart changes no spec, and nothing to undo.\n\nSee docs/adr/0027-health-checks-rollouts-and-rollback.md."
  };
  option (dockwell.v1.nouns) = {
    name: "servers"
    help: "The servers Dockwell manages, with their live state as each server's agent reports it. WatchServers has no REST path: REST has no way to stream messages, so a REST client polls ListServers or GetServer instead, and anything that wants the stream opens it with Connect, gRPC or gRPC-Web. PlanReboot plans rebooting servers, a change with a plan that makes no revision and takes a person's passkey to apply. See docs/adr/0015-rest-and-openapi-from-the-schema.md and docs/adr/0064-a-change-on-a-server-installing-updates-and-rebooting.md."
  };
  option (dockwell.v1.nouns) = {
    name: "drift"
    help: "Drift is a difference between what a server has and the latest revision of a resource it should have, as when someone changed it by hand. ListDrift asks each connected server's agent, and changes nothing. RevertDrift plans putting the revision back, and AdoptDrift plans keeping what the server has as a new revision: each is a change, with a plan to apply."
  };

  // ProposeChange plans a set of edits and records them as a planned
  // change, ready to apply or discard. Planning asks each server's agent
  // what the edits would take there, and changes nothing on any server. The
  // same edits against the same state give the same plan, and the same
  // fingerprint unless they edit a kind that may hold secrets, which each
  // change digests for itself.
  //
  // An edit that sets a secret's value is a rotation: it plans as a change,
  // and restarts what uses the secret, whatever the value is. So a plan
  // never says whether it is the value already there. Any other sensitive
  // field, such as a container's environment, compares as usual: an equal
  // value is no change, and a plan masks one that differs.
  rpc ProposeChange(ProposeChangeRequest) returns (ProposeChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/changes"
      body: "*"
    };
  }

  // GetChange returns one change, with its plan and the progress of each of
  // its steps.
  rpc GetChange(GetChangeRequest) returns (GetChangeResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/changes/{id}"};
  }

  // ListChanges returns changes, newest first, a page at a time. Each
  // change's plan is in brief: its fingerprint, summary, undo window and
  // whether it is destructive. GetChange has the plan in full.
  rpc ListChanges(ListChangesRequest) returns (ListChangesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/changes"};
  }

  // ApplyChange carries out a planned change. It plans again, and refuses
  // if any resource changed since, or if the servers no longer match the
  // plan; either way, propose the edits again and review the new plan.
  // Otherwise it commits the change's revisions and starts running its
  // steps, and returns the change as it starts applying. The steps run to
  // an end whether or not the caller waits. Follow them with WatchChange,
  // or by polling GetChange. If a step fails, Dockwell starts rolling back what
  // was done, in a change of its own, named in rolled_back_by. That runs on after
  // this change has failed, may wait for a server, and may fail too, so read
  // rollback_status for how it went.
  //
  // A plan that destroys data, may cut off access, or lets two containers
  // write to one place needs the fingerprint of the plan you reviewed, and a
  // signed-in session: no API token may apply one.
  rpc ApplyChange(ApplyChangeRequest) returns (ApplyChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/changes/{id}:apply"
      body: "*"
    };
  }

  // WatchChange streams a change: first the change as it stands, then each
  // step's progress as it moves on, and the change again whenever its state
  // does. It ends once the change is applied, failed or discarded, so a
  // planned change is watched until someone applies or discards it. Any
  // number of clients can watch one change, whoever applies it.
  rpc WatchChange(WatchChangeRequest) returns (stream WatchChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
  }

  // UndoChange plans putting back everything an applied change did, as a
  // new change; apply it to carry it out. It is refused once the change is
  // older than its undo window, or when a resource it touched has changed
  // again since: undo that later change first, or edit the resource.
  rpc UndoChange(UndoChangeRequest) returns (UndoChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/changes/{id}:undo"
      body: "*"
    };
  }

  // ConfirmChange keeps a change to a server's firewall that waits for its
  // confirmation (Change.confirmation), once you have checked that you can
  // still reach the server as the confirmation says. Only the person who
  // applied it may confirm it, in the session they applied it from. Without a
  // confirmation in time, the server puts back its firewall as it was, and the
  // change rolls back (ADR 0052). A server's firewall is the whole server's,
  // so confirming is an admin's, as applying such a change is, and no API
  // token can call it.
  rpc ConfirmChange(ConfirmChangeRequest) returns (ConfirmChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/changes/{id}:confirm"
      body: "*"
    };
  }

  // DiscardChange drops a planned change without applying it. The change
  // stays on record as discarded.
  rpc DiscardChange(DiscardChangeRequest) returns (DiscardChangeResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/changes/{id}:discard"
      body: "*"
    };
  }

  // RestartService plans restarting a service on every server it runs on: as
  // a deploy does, a new container takes over once it is healthy, where the
  // service can have two at once, and otherwise the old one stops first, and
  // the plan says for how long. It is a change, with a plan to apply or
  // discard. It makes no revision, as the spec stays as it is, so it has
  // nothing to undo, and a restart that fails leaves the revision where it was.
  rpc RestartService(RestartServiceRequest) returns (RestartServiceResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/services/{id}:restart"
      body: "*"
    };
  }

  // PlanInstallUpdates plans installing the package updates waiting on
  // servers: the security fixes, every update, or the packages named. Each
  // server's agent simulates the exact install, versions pinned, and the plan
  // lists every package it installs, those it pulls in too, whether a reboot
  // follows and whether Docker restarts. It's a change with a plan and no
  // revision, as a restart is: an upgrade can't be undone, and the plan says
  // so. Applying it takes a person's passkey, as it runs as root on the
  // server. See
  // docs/adr/0064-a-change-on-a-server-installing-updates-and-rebooting.md.
  rpc PlanInstallUpdates(PlanInstallUpdatesRequest) returns (PlanInstallUpdatesResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "updates"
      verb: "install"
    };
    option (google.api.http) = {
      post: "/v1/updates:planInstall"
      body: "*"
    };
  }

  // PlanReboot plans rebooting servers: an edit of each server's host that makes
  // no revision. The plan says that everything on each server goes offline
  // until it's back, and on the control server that the panel and the API stop
  // with it and come back on their own. Applying it takes a person's passkey,
  // as it acts as root on the server. A reboot's step passes once the server's
  // agent connects from another boot, and fails if none has after 15 minutes.
  // See docs/adr/0064-a-change-on-a-server-installing-updates-and-rebooting.md.
  rpc PlanReboot(PlanRebootRequest) returns (PlanRebootResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "servers"
      verb: "reboot"
    };
    option (google.api.http) = {
      post: "/v1/servers:planReboot"
      body: "*"
    };
  }

  // PlanRemoveServer plans taking a server out of the fleet: a change whose edits
  // move, stop or let go of what runs on it, as apps says, and which revokes the
  // server as its last act. The plan lists what moves, what stops, what stays on
  // the server, which certificates by DNS it re-issues and revokes, and what
  // becomes of its backups. With compromised, it revokes the server as it
  // commits, before any step, and takes none on it. It can't be undone, applying
  // it takes a person's passkey, and the control server can't be removed. See
  // docs/adr/0090-removing-a-server-and-marking-one-compromised.md.
  rpc PlanRemoveServer(PlanRemoveServerRequest) returns (PlanRemoveServerResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (dockwell.v1.command) = {
      noun: "servers"
      verb: "remove"
    };
    option (google.api.http) = {
      post: "/v1/servers:planRemove"
      body: "*"
    };
  }

  // PlanSystemServiceAction plans an action on one of a server's system
  // services, its systemd units or OpenRC services: starting, stopping,
  // restarting or reloading it, or enabling, disabling, masking or unmasking it
  // at boot, on each server named. Each is an edit of the server's host that
  // makes no revision, as a reboot is: Dockwell keeps no desired state for a
  // unit, which the server's packages own, and undoing an action plans the one
  // that puts back how the unit stood. The plan says how the unit stands, what
  // stops or restarts with it and what starts it again. What Dockwell needs on
  // the server is guarded: its own units refuse every action, and Docker, SSH
  // and the network refuse a stop, a disable and a mask. A risky action, such as
  // restarting SSH or Docker, takes a person's passkey to apply. See
  // docs/adr/0082-acting-on-a-servers-system-services.md.
  rpc PlanSystemServiceAction(PlanSystemServiceActionRequest) returns (PlanSystemServiceActionResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_ADMIN;
    option (dockwell.v1.min_role_protected) = NEEDS_ADMIN;
    option (dockwell.v1.reach) = REACH_INSTALL;
    option (dockwell.v1.needs_session) = true;
    option (google.api.http) = {
      post: "/v1/servers:planSystemServiceAction"
      body: "*"
    };
  }

  // ListDrift compares what servers have with the latest revision of each
  // resource they should have, and returns every difference. It asks each
  // connected server's agent, and changes nothing.
  rpc ListDrift(ListDriftRequest) returns (ListDriftResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (dockwell.v1.effect) = EFFECT_READ;
    option (dockwell.v1.min_role) = NEEDS_VIEWER;
    option (dockwell.v1.min_role_protected) = NEEDS_VIEWER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {get: "/v1/drift"};
  }

  // RevertDrift plans putting a drifted resource back to its latest
  // revision on the servers it runs on.
  rpc RevertDrift(RevertDriftRequest) returns (RevertDriftResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/drift:revert"
      body: "*"
    };
  }

  // AdoptDrift plans keeping what a server has for a drifted resource: a
  // new revision that matches it. Nothing changes on that server; any other
  // server the resource runs on is brought to match, and the plan shows it.
  rpc AdoptDrift(AdoptDriftRequest) returns (AdoptDriftResponse) {
    option (dockwell.v1.effect) = EFFECT_PLAN;
    option (dockwell.v1.min_role) = NEEDS_DEVELOPER;
    option (dockwell.v1.min_role_protected) = NEEDS_DEVELOPER;
    option (dockwell.v1.reach) = REACH_PROJECT;
    option (google.api.http) = {
      post: "/v1/drift:adopt"
      body: "*"
    };
  }
}

// ProposeChangeRequest is a set of edits to plan together.
message ProposeChangeRequest {
  // What the change is for, in your words, such as "Add a staging
  // environment". Required: the timeline shows it.
  string summary = 1;
  // The edits, at most one for each resource. They apply in this order,
  // and deletions last, in reverse.
  repeated Edit edits = 2;
  // Leave out the backup that comes first when a database moves to a release
  // its data can't come back from, such as MongoDB raising its feature
  // compatibility version (ADR 0038). The plan says so.
  bool skip_backup = 3;
}

// Edit sets one resource's desired spec, or deletes it.
message Edit {
  // The resource. Its kind may be left out when the spec says it. Its
  // scope may be left out where there is only one to choose, as with the
  // organization of a project, or the environment of a service in an
  // install with one; once there is a choice, leaving it out is an error
  // that names the options.
  ResourceRef resource = 1;
  // What the resource should be. Every field is set as given: an edit
  // replaces the whole spec. Unset only with delete.
  dockwell.resource.v1alpha1.Spec spec = 2;
  // Deletes the resource. An environment goes only once what lives in it has
  // gone, in this change or an earlier one. A project takes its environments
  // with it, and goes only once what lives in them has gone too.
  bool delete = 3;
  // Where a service, volume, network or route runs, by server ID. Empty keeps it
  // where it runs now; a new one runs on the only server, and must name its
  // servers once there are several. Other kinds ignore it: a container or
  // firewall rule lives on its server, and projects and environments run on
  // none.
  repeated string servers = 4;
  // The project of the environment the resource lives in, by name or ID,
  // for a kind that lives in an environment, such as a service. Leave it
  // out while there is only one project, or when resource.scope is an
  // environment's ID; once there are several, an environment named
  // without its project is an error that names the projects. Other kinds
  // name their project, if they live in one, in resource.scope.
  string project = 5;
  // The revision of the resource the spec was made from, as a list gave it,
  // for an edit that read the spec and changed part of it. If the resource has
  // changed since, the edit is stale, an error with the reason "plan_stale", as
  // planning it would quietly undo what came between: read it again, and edit
  // that. 0 checks nothing, for an edit that says the whole spec itself.
  int64 base_revision = 6;
  // A service's own environment variables to keep as they are, by name, for a
  // client that can't read their values back, as no response carries them:
  // it sends the rest of the spec, and names these instead of setting them.
  // Each must be one the service has now, and not one the spec sets too. Only
  // an edit of a service that's there takes it, and only with base_revision,
  // the revision the rest was read at: without one the edit is refused, as a
  // change since the read would be undone. A value kept goes nowhere it hasn't
  // been, so the edit can't place the service on another server: set the value
  // again in the edit to run it there.
  repeated string keep_env = 7;
  // With delete, for a project or an environment: deletes everything that
  // lives in it too, in the same change, so its plan lists each item and
  // undoing it brings them all back. A volume going takes a person's
  // confirmation, as any data loss does, and its server keeps it for 7 days.
  // Refused on any other kind, and without delete. See
  // docs/adr/0074-projects-you-can-see-and-that-go-with-their-last-app.md.
  bool with_contents = 8;
  // A service's own environment variables to make secrets of its environment,
  // by the same name, with the values it has now, which it then uses in their
  // place. The change makes each secret with the value the service holds, so
  // nobody reads a hidden value to make it a secret, which a passkey reveals
  // from then on. Each must be one the service has now, not empty, and not one
  // the spec sets or keep_env keeps; the environment can't have a variable or
  // secret of the name already. Only with base_revision, as for keep_env. See
  // docs/adr/0081-an-apps-own-values-shown-and-its-secrets-kept.md. Numbered
  // apart, as open work adds to this message.
  repeated string env_to_secrets = 60;
}

// ResourceRef names a resource.
message ResourceRef {
  // The kind, such as "project", "environment", "service", "volume",
  // "network", "route", "container" or "firewall.rule".
  string kind = 1;
  // The ID of what it lives in, which its kind says: the organization
  // ("org_…") for a project, a project ("prj_…") for an environment, an
  // environment ("env_…") for a service, volume, network or route, and a server
  // ("srv_…") for a container or firewall rule.
  string scope = 2;
  // Its name, unique among its kind in its scope, such as "web".
  string name = 3;
}

// Choice is the detail of an error whose reason is "choice": a request
// left out something there is more than one of, such as the project of an
// environment once there are two projects (PRD principle 4). Ask which,
// set field to it, and send the request again. Errors carry it as a
// google.rpc.Status detail, over REST too.
message Choice {
  // What to choose: "project", "environment" or "server".
  string level = 1;
  // The request's field that takes the choice, as a path of field names
  // from the request, such as "edits[0].project" or
  // "edits[0].resource.scope".
  string field = 2;
  // The names to choose from. The field takes any of them.
  repeated string options = 3;
  // For a choice of environment, the project they are in.
  string project = 4;
}

// ProposeChangeResponse carries the planned change.
message ProposeChangeResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// GetChangeRequest names a change.
message GetChangeRequest {
  // The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
}

// GetChangeResponse carries one change.
message GetChangeResponse {
  // The change.
  Change change = 1;
}

// ListChangesRequest asks for a page of changes.
message ListChangesRequest {
  // How many changes to return: 50 when unset, and at most 200.
  int32 page_size = 1;
  // Where to start: the next_page_token of the page before. Empty starts
  // with the newest.
  string page_token = 2;
}

// ListChangesResponse is a page of changes.
message ListChangesResponse {
  // The changes, newest first.
  repeated Change changes = 1;
  // Pass it as page_token for the next page. Empty on the last page.
  string next_page_token = 2;
}

// ApplyChangeRequest names a planned change to apply.
message ApplyChangeRequest {
  // The change's ID.
  string id = 1;
  // The fingerprint of the plan you reviewed. When set, the change applies
  // only if its plan has it. A plan that destroys data, may cut off access,
  // or lets two containers write to one place needs it.
  string fingerprint = 2;
  // The proof from FinishStepUp, for applying this change. A plan that gives
  // something as much as root on a server needs it, which is why no API token
  // can apply one. Call without it first: it checks everything else, then
  // refuses with the reason needs_step_up.
  string proof = 3;
}

// ConfirmChangeRequest names a change that waits for its confirmation, and the
// server whose confirmation it is, as a change to several servers waits on each
// in turn.
message ConfirmChangeRequest {
  // The change's ID.
  string id = 1;
  // The server the confirmation is for: the one you checked you can still
  // reach. It's refused unless that server waits now.
  string server_id = 2;
  // The deadline the confirmation answers, as the change said it. When it's
  // set, it's refused unless the server still waits for that deadline, so a
  // confirmation sent twice can't keep a wait it wasn't for.
  google.protobuf.Timestamp deadline = 3;
}

// ConfirmChangeResponse carries the change, which goes on applying, or ends
// applied, once the server has kept what it waited for.
message ConfirmChangeResponse {
  // The change.
  Change change = 1;
}

// ChangeConfirmation is what a change to a server's firewall waits for: that
// the person who applied it confirms they can still reach the server, before
// the server's timer runs out and it puts back its firewall as it was.
message ChangeConfirmation {
  // The server whose firewall changed.
  string server_id = 1;
  // When the server puts back its firewall, unless confirmed first.
  google.protobuf.Timestamp deadline = 2;
  // The ports the server's SSH listens on now, for the test the person runs
  // before confirming: a new SSH session, from where they are, with their key.
  repeated uint32 ssh_ports = 3;
}

// ApplyChangeResponse carries the change as it starts applying.
message ApplyChangeResponse {
  // The change: applying, with its steps queued; or applied, when it had
  // no steps to run.
  Change change = 1;
}

// WatchChangeRequest names a change to watch.
message WatchChangeRequest {
  // The change's ID.
  string id = 1;
}

// WatchChangeResponse is one event of a watch.
message WatchChangeResponse {
  // What happened.
  oneof event {
    // The change as it is now: the first message, and again whenever its
    // state moves on.
    Change change = 1;
    // One step's progress, which replaces the step at its index in the
    // change's steps.
    StepUpdate step = 2;
  }
}

// StepUpdate is one step's latest progress.
message StepUpdate {
  // Where the step is in the change's steps, from 0.
  int32 index = 1;
  // The step as it is now.
  StepProgress step = 2;
}

// UndoChangeRequest names an applied change to undo.
message UndoChangeRequest {
  // The change's ID.
  string id = 1;
}

// UndoChangeResponse carries the planned undo.
message UndoChangeResponse {
  // A new change, planned, that puts back what the undone one did.
  Change change = 1;
}

// DiscardChangeRequest names a planned change to discard.
message DiscardChangeRequest {
  // The change's ID.
  string id = 1;
}

// DiscardChangeResponse carries the discarded change.
message DiscardChangeResponse {
  // The change, discarded.
  Change change = 1;
}

// RestartServiceRequest names a service to restart.
message RestartServiceRequest {
  // The service's ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V", or its name.
  string id = 1;
  // The project of the environment, by name or ID, when id is a name and there
  // are several projects.
  string project = 2;
  // The environment, by name or ID, when id is a name and there are several
  // environments.
  string environment = 3;
  // What the restart is for, for the timeline. Empty says what it restarts.
  string summary = 4;
}

// RestartServiceResponse carries the planned restart.
message RestartServiceResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// PlanInstallUpdatesRequest names the servers and which updates to install.
message PlanInstallUpdatesRequest {
  // The servers, by ID. One server is a set of one.
  repeated string server_ids = 1;
  // Installs every update waiting, not only the security fixes.
  bool all = 2;
  // What the change is for, for the timeline. Empty says what it installs.
  string summary = 3;
  // Installs only these packages, by name as GetServerUpdates lists them, such
  // as "openssl", with what they need: the plan lists those too. A name the
  // server's updates don't list is refused. Leave all unset with it.
  repeated string packages = 4;
}

// PlanInstallUpdatesResponse carries the planned install.
message PlanInstallUpdatesResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// PlanRebootRequest names the servers to reboot.
message PlanRebootRequest {
  // The servers, by ID. One server is a set of one.
  repeated string server_ids = 1;
  // What the change is for, for the timeline. Empty says what it reboots.
  string summary = 2;
}

// PlanRebootResponse carries the planned reboot.
message PlanRebootResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// AppsOnRemoval is what happens to the apps a server runs as it's removed.
enum AppsOnRemoval {
  // As APPS_ON_REMOVAL_LEAVE.
  APPS_ON_REMOVAL_UNSPECIFIED = 0;
  // Dockwell lets go of them, running, and takes no step on the server.
  APPS_ON_REMOVAL_LEAVE = 1;
  // They run on the server move_to names before they come off this one. A
  // volume's data stays here, and it starts empty there.
  APPS_ON_REMOVAL_MOVE = 2;
  // They come off the server. Their volumes' data stays on it.
  APPS_ON_REMOVAL_STOP = 3;
}

// PlanRemoveServerRequest names a server to take out of the fleet, and what
// happens to what it runs.
message PlanRemoveServerRequest {
  // The server, by ID.
  string server_id = 1;
  // What happens to its apps. Unset leaves them running.
  AppsOnRemoval apps = 2;
  // The server they move to, by ID, for APPS_ON_REMOVAL_MOVE.
  string move_to = 3;
  // The server may be in someone else's hands: it's revoked as the change
  // commits, and the change takes no step on it, so its apps can't be stopped.
  bool compromised = 4;
  // What the change is for, for the timeline. Empty says what it removes.
  string summary = 5;
}

// PlanRemoveServerResponse carries the planned removal.
message PlanRemoveServerResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// ServerRemoval is the server a change takes out of the fleet.
message ServerRemoval {
  // The server's ID and name.
  string server_id = 1;
  string server_name = 2;
  // It's revoked as the change commits, as it may be compromised.
  bool compromised = 3;
}

// PlanSystemServiceActionRequest names a system service, what to do to it, and
// the servers to do it on.
message PlanSystemServiceActionRequest {
  // The servers, by ID. One server is a set of one.
  repeated string server_ids = 1;
  // The unit's name, such as "nginx.service", or an OpenRC service's, such as
  // "nginx". An alias acts on the unit it names, and meets that unit's guard.
  string name = 2;
  // What to do to it.
  SystemServiceAction action = 3;
  // What the change is for, for the timeline. Empty says what it does.
  string summary = 4;
}

// PlanSystemServiceActionResponse carries the planned action.
message PlanSystemServiceActionResponse {
  // The change, planned, with its plan.
  Change change = 1;
}

// SystemServiceAction is what a change does to one of a server's system services
// (ADR 0082).
enum SystemServiceAction {
  SYSTEM_SERVICE_ACTION_UNSPECIFIED = 0;
  // Starts it.
  SYSTEM_SERVICE_ACTION_START = 1 [(dockwell.v1.word) = "Start"];
  // Stops it, with what stops with it.
  SYSTEM_SERVICE_ACTION_STOP = 2 [(dockwell.v1.word) = "Stop"];
  // Stops it and starts it again, or starts one that failed or is stopped.
  SYSTEM_SERVICE_ACTION_RESTART = 3 [(dockwell.v1.word) = "Restart"];
  // Has it read its configuration again, where it can, without stopping.
  SYSTEM_SERVICE_ACTION_RELOAD = 4 [(dockwell.v1.word) = "Reload"];
  // Starts it at boot.
  SYSTEM_SERVICE_ACTION_ENABLE = 5 [(dockwell.v1.word) = "Enable"];
  // Keeps it from starting at boot, though another unit may still start it.
  SYSTEM_SERVICE_ACTION_DISABLE = 6 [(dockwell.v1.word) = "Disable"];
  // Keeps it from starting at all, by hand or as another unit needs it. systemd
  // only.
  SYSTEM_SERVICE_ACTION_MASK = 7 [(dockwell.v1.word) = "Mask"];
  // Lets a masked unit start again. systemd only.
  SYSTEM_SERVICE_ACTION_UNMASK = 8 [(dockwell.v1.word) = "Unmask"];
}

// SystemServiceGuard is how Dockwell guards one of a server's system services,
// as it needs it to reach the server or to run what's there (ADR 0082).
enum SystemServiceGuard {
  // Nothing guarded: any action, with no passkey.
  SYSTEM_SERVICE_GUARD_UNSPECIFIED = 0;
  // Dockwell's own agent, or the access that guards it: every action is refused.
  SYSTEM_SERVICE_GUARD_DOCKWELL = 1 [(dockwell.v1.word) = "Dockwell"];
  // Docker or containerd: a stop, a disable and a mask are refused, and a
  // restart takes the passkey and the plan's typed code, as it stops every
  // container on the server.
  SYSTEM_SERVICE_GUARD_DOCKER = 2 [(dockwell.v1.word) = "Docker"];
  // The SSH server: a stop, a disable and a mask are refused, and a restart or
  // a reload takes the passkey, once sshd's config passes its own check.
  SYSTEM_SERVICE_GUARD_SSH = 3 [(dockwell.v1.word) = "SSH"];
  // How the server reaches the network: a stop, a disable and a mask are
  // refused, and a restart takes the passkey and the plan's typed code.
  SYSTEM_SERVICE_GUARD_NETWORK = 4 [(dockwell.v1.word) = "Network"];
  // The server's firewall: every action but an unmask takes the passkey; a
  // stop, a disable or a mask the typed code too, as every port it closes opens;
  // and a start, a restart or a reload the typed code too, as it loads its own
  // rules, which can replace Docker's and Dockwell's.
  SYSTEM_SERVICE_GUARD_FIREWALL = 5 [(dockwell.v1.word) = "Firewall"];
  // What the server's other services and sign-ins go through, D-Bus and
  // systemd-logind: a stop, a disable and a mask are refused, and a restart
  // takes the passkey and the typed code.
  SYSTEM_SERVICE_GUARD_SYSTEM = 6 [(dockwell.v1.word) = "System"];
}

// HostUnit is what an action on one of a server's system services does, as its
// agent planned it (ADR 0082).
message HostUnit {
  // The unit's own name, as its init knows it: an alias reads as the unit it
  // names.
  string name = 1;
  // What the change does to it.
  SystemServiceAction action = 2;
  // True when it ran as the plan was made.
  bool was_running = 3;
  // How it stood, in its init's own word, such as "active", "failed" or
  // "inactive" under systemd, or "started" under OpenRC.
  string was_state = 4;
  // Whether it started at boot, in its init's own word, such as "enabled",
  // "disabled" or "masked", or an OpenRC runlevel, or empty for none: what an
  // undo puts back.
  string was_at_boot = 5;
  // Each running unit that stops or restarts with it, for a stop or a restart:
  // those that need it, are bound to it or are part of it.
  repeated string with = 6;
  // Each active unit that starts it again, for a stop, such as its socket, which
  // starts it on the next connection, or its timer.
  repeated string triggers = 7;
  // How Dockwell guards it.
  SystemServiceGuard guard = 8;
  // True when applying it takes the plan's typed code as well as the passkey:
  // it stops everything on the server, may cut the agent off, or opens every
  // port the firewall closes.
  bool confirm = 9;
  // True when it restarts Docker, with every container on the server.
  bool docker_restarts = 10;
  // True under OpenRC.
  bool openrc = 11;
  // True when applying it takes a person's passkey, as it's as good as root:
  // restarting SSH, Docker or the network, or stopping the firewall.
  bool passkey = 12;
  // True when it has the server's firewall load its own rules, which can
  // replace Docker's and Dockwell's table: Dockwell puts its table back after,
  // and Docker's rules come back only when Docker restarts. It holds the server
  // while it runs, as a Docker restart does.
  bool replaces_rules = 13;
}

// HostReboot is what rebooting a server does (ADR 0064): everything on it goes
// offline until it's back, and Docker starts again what its restart policies say.
message HostReboot {
  // True for the control server: the panel and the API stop with it and come
  // back on their own, and the other servers keep serving meanwhile.
  bool control_server = 1;
  // How long the server's last reboot took, from its step's start until its
  // agent connected from the new boot. Unset until Dockwell has seen one.
  google.protobuf.Duration last_took = 2;
}

// PackageInstall is what installing a server's updates will do, as its package
// manager simulated the exact command.
message PackageInstall {
  // Each package, from the version installed to the one it gets; a package the
  // others pull in has none installed.
  repeated PackageUpdate packages = 1;
  // A package takes effect only after a reboot, which is a change of its own.
  bool reboot = 2;
  // Docker's engine restarts, and with it every container on the server and
  // the domains Caddy serves there, unless keeps_running.
  bool docker_restarts = 3;
  // Docker keeps containers running while it restarts (live-restore), which
  // holds across patch releases of the same version only.
  bool keeps_running = 4;
  // The packages asked for by name, when the install was of a selection: every
  // other package listed is one they need. Empty for the security fixes or
  // every update.
  repeated string asked = 5;
}

// ListDriftRequest says where to look for drift.
message ListDriftRequest {
  // A server's ID. Empty looks on every server.
  string server_id = 1;
}

// ListDriftResponse lists what doesn't match its latest revision.
message ListDriftResponse {
  // Each resource that differs, on each server it differs on.
  repeated Drift drift = 1;
  // Servers that couldn't be checked, each with why, such as an agent that
  // isn't connected. The servers that could be checked are in drift all
  // the same.
  repeated UncheckedServer unchecked_servers = 2;
}

// UncheckedServer is a server whose drift couldn't be checked.
message UncheckedServer {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // Why, as a word an error's reason would be: "server_offline" for an
  // agent that isn't connected, or dropped while it was checked, whose
  // drift is checked once it reconnects; "agent_timeout"; "no_driver";
  // "agent_outdated" for an agent from before a command could name a value,
  // which would read one's command with its values written in, so it reads
  // nothing that names one until it is updated; "spec_unreadable" for a stored spec
  // of what it runs that isn't sealed or can't be opened, which says what to do; or
  // "agent_failed".
  string reason = 3;
  // Why, for people.
  string message = 4;
}

// Drift is a resource on a server that doesn't match its latest revision.
message Drift {
  // The server.
  string server_id = 1;
  // The resource's ID.
  string resource_id = 2;
  // The resource.
  ResourceRef resource = 3;
  // The latest revision, which the server should match.
  int64 revision = 4;
  // True when the resource is gone from the server.
  bool missing = 5;
  // What differs, from the latest revision to what the server has.
  repeated FieldChange changes = 6;
}

// RevertDriftRequest names a drifted resource to put back.
message RevertDriftRequest {
  // The server it drifted on.
  string server_id = 1;
  // The resource's ID.
  string resource_id = 2;
}

// RevertDriftResponse carries the planned revert.
message RevertDriftResponse {
  // A new change, planned, that puts the resource back.
  Change change = 1;
}

// AdoptDriftRequest names a drifted resource to keep as it is.
message AdoptDriftRequest {
  // The server whose version to keep.
  string server_id = 1;
  // The resource's ID.
  string resource_id = 2;
}

// AdoptDriftResponse carries the planned adoption.
message AdoptDriftResponse {
  // A new change, planned, whose revision matches what the server has.
  Change change = 1;
}

// Change is one action's worth of edits to managed resources: planned,
// then applied, failed or discarded.
message Change {
  // The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string id = 1;
  // What it is for, such as "Add a staging environment".
  string summary = 2;
  // Where it is.
  ChangeState state = 3;
  // Who proposed it.
  Actor proposed_by = 4;
  // Where it was proposed from.
  Surface proposed_via = 5;
  // When it was proposed.
  google.protobuf.Timestamp create_time = 6;
  // What applying does, as it was reviewed. It never changes. A rollback,
  // which nobody reviews, has the plan it ran with. ListChanges gives it in
  // brief, without resources and servers.
  Plan plan = 7;
  // The change this one undoes or rolls back, if any.
  string reverts = 8;
  // True for a change Dockwell made to roll back a failed one.
  bool rollback = 9;
  // Who applied it. Unset until it is applied.
  Actor applied_by = 10;
  // Where it was applied from. Unset until it is applied.
  Surface applied_via = 11;
  // When it started applying. Unset until then.
  google.protobuf.Timestamp apply_time = 12;
  // Until when UndoChange works, once it is applied. Unset otherwise.
  google.protobuf.Timestamp undo_deadline = 13;
  // Why it failed, when it did, in plain words: the fact, then the
  // consequence, then the fix. The step that failed has what the server said
  // in its detail.
  string error = 14;
  // Each step of the plan with its progress, once it is applying: servers
  // in plan order, and on each the steps in the order they run.
  repeated StepProgress steps = 15;
  // The change that rolled this one back after it failed, if any. It may
  // still be applying, as when it waits for a server to reconnect, or have
  // failed: rollback_status says how it went.
  string rolled_back_by = 16;
  // The applied change that undid this one, if any.
  string undone_by = 17;
  // How the rollback in rolled_back_by is going, which is what says whether
  // what ran before is back. It moves on after this change has failed, so
  // read it afresh, or follow the rollback with WatchChange. Unset when there
  // is no rollback.
  RollbackStatus rollback_status = 18;
  // Why Dockwell made this change, when it made it on its own: for a rollback,
  // what failed in the change it rolls back, in the plain words of that change's
  // error, with what the health check said where a health check failed: short,
  // cleaned and masked.
  string because = 19;
  // True for a restart, which makes no revision.
  bool restart = 20;
  // True on a planned change with an item in a protected environment: a
  // developer's waits for an admin or the owner to apply it, and someone
  // else's is approved with a passkey (ADR 0049).
  bool protected = 21;
  // On a planned change, for whoever reads it: true when applying it approves
  // someone else's change in a protected environment, which takes a session,
  // the plan's fingerprint and a passkey (STEP_UP_ACTION_APPROVE_CHANGE),
  // whether they planned it in the panel or with an API token.
  bool approves = 22;
  // On a planned change, for whoever reads it below an admin: why it waits for
  // an admin or the owner to apply it, such as "As it changes web in a
  // protected environment, an admin or the owner applies this. Leave it
  // planned for them". Empty when they may apply it, and for a viewer, who
  // applies nothing.
  string waits = 23;
  // What the change waits for, while a change to a server's firewall waits
  // for its confirmation (ConfirmChange). Unset otherwise. Numbered apart, as
  // open work adds to this message.
  ChangeConfirmation confirmation = 40;
  // What of the change is in projects the reader holds no role in, as a count, where
  // it reaches one through a link (ADR 0084, amending ADR 0049): the change shows
  // only what the reader holds. Unset where they hold all of it.
  ChangeElsewhere elsewhere = 80;
}

// RollbackStatus is how the rollback of a failed change is going, for
// whoever has to say what runs now.
message RollbackStatus {
  // The rollback's change, as rolled_back_by says.
  string id = 1;
  // Where it is.
  RollbackState state = 2;
  // How many steps it takes, without one that found the server had what it was
  // to put back. None means the servers still had what was there before, as the
  // failed change stopped before it changed them.
  int32 steps = 3;
  // The servers it waits for, by name, while it waits.
  repeated string waiting_for = 4;
  // Why it failed, in plain words, when it did.
  string error = 5;
  // What the server said, when it failed and error puts that in plain words.
  string detail = 6;
  // The resources its steps put back, by name. What isn't here didn't change,
  // so it never stopped.
  repeated string restored = 7;
}

// RollbackState is where the rollback of a failed change is.
enum RollbackState {
  ROLLBACK_STATE_UNSPECIFIED = 0;
  // Its steps are running.
  ROLLBACK_STATE_APPLYING = 1;
  // A step waits for its server to reconnect, or for its agent to plan it.
  ROLLBACK_STATE_WAITING = 2;
  // Every step ran, so what was there before is back.
  ROLLBACK_STATE_APPLIED = 3;
  // A step failed, so what was there before may not be back.
  ROLLBACK_STATE_FAILED = 4;
}

// ChangeState is where a change is.
enum ChangeState {
  CHANGE_STATE_UNSPECIFIED = 0;
  // Planned and waiting to be applied or discarded.
  CHANGE_STATE_PLANNED = 1;
  // Its revisions are committed and its steps are running, or waiting for
  // a server to reconnect.
  CHANGE_STATE_APPLYING = 2;
  // Every step ran.
  CHANGE_STATE_APPLIED = 3;
  // A step failed, and the change stopped there.
  CHANGE_STATE_FAILED = 4;
  // Dropped without being applied.
  CHANGE_STATE_DISCARDED = 5;
}

// Actor is who made a change, or applied it, or did what an event records.
message Actor {
  // What kind of actor it is.
  ActorKind kind = 1;
  // The user's, token's or server's ID, or a shell account's name, such as
  // "mira@hz-1". Empty for Dockwell.
  string id = 2;
  // The name to show, such as "Mira Chen", a token's name, such as
  // "GitHub Actions deploy", or a server's, such as "hz-2".
  string name = 3;
  // For a token the CLI made for local access on the control server, who
  // asked for it there. Unset for every other actor: a token's name is
  // whatever its maker typed, so only this says a token is local access's.
  LocalAccess local_access = 4;
}

// LocalAccess is how the CLI came by a token on the control server, by
// reading the control plane's data directory, without signing in.
message LocalAccess {
  // The shell account that asked for it, and the server's host name, as
  // "mira@hz-1".
  string account = 1;
  // What the token may do.
  TokenScope scope = 2;
}

// ActorKind says what kind of actor made a change, or did what an event
// records.
enum ActorKind {
  ACTOR_KIND_UNSPECIFIED = 0;
  // A person, signed in.
  ACTOR_KIND_USER = 1;
  // An API token, acting for the person who made it.
  ACTOR_KIND_TOKEN = 2;
  // Dockwell itself, such as for a rollback.
  ACTOR_KIND_DOCKWELL = 3;
  // A server's agent, such as when it joins the fleet or renews its
  // certificate.
  ACTOR_KIND_SERVER = 4;
  // Someone in a shell on the control server, running a dockwell command
  // there, such as dockwell recover, or the CLI making its own API token
  // for local access. They are named by their account and the server's
  // host name, as "mira@hz-1", since Dockwell hasn't signed them in. What
  // the CLI then does with that token is the token's.
  ACTOR_KIND_SHELL = 5;
}

// Surface is where a change, or what an event records, came from. A call
// with an API token is from the CLI or the API, as its User-Agent says, for
// a change and its audit events alike. What someone in a shell on the
// control server does with a dockwell command, and a server joining with
// dockwell join, are from the CLI too.
enum Surface {
  SURFACE_UNSPECIFIED = 0;
  // The panel, with a signed-in session.
  SURFACE_PANEL = 1;
  // The API, with an API token.
  SURFACE_API = 2;
  // Dockwell on its own, such as a rollback after a failure.
  SURFACE_AUTOMATIC = 3;
  // The dockwell CLI, with an API token. The CLI says so in its User-Agent,
  // "dockwell-cli/<version>"; any other client with a token is the API.
  SURFACE_CLI = 4;
}

// Plan is what applying a change would do: what changes, where, and for
// how long.
message Plan {
  // A hash of what the plan does, for this change. Applying checks that a
  // fresh plan still has it. The same edits against the same state have
  // the same fingerprint, unless they edit a kind that may hold secrets:
  // that is digested for each change alone, so no two changes'
  // fingerprints say they set the same value.
  string fingerprint = 1;
  // How many resources it creates, changes, replaces and destroys.
  PlanSummary summary = 2;
  // Each resource the change touches, in the order of its edits.
  repeated PlannedResource resources = 3;
  // Each server with something to do, in the order of the edits, then each
  // removed server the change takes resources off.
  repeated ServerPlan servers = 4;
  // How long the change can be undone once it is applied.
  google.protobuf.Duration undo_window = 5;
  // True when a step destroys data, may cut off access, or lets two
  // containers write to one place. Applying it needs the fingerprint and a
  // signed-in session.
  bool destructive = 6;
  // True when the change adds to, or changes, what a container can reach
  // on its server (host_access), which a person approves: applying it needs
  // the fingerprint and a signed-in session, as a destructive plan does.
  bool host_access = 7;
  // What a person should know before applying it that no step says, as it is
  // about what stays as it is or what can be read, not about what runs. A note
  // never stops anyone applying it.
  repeated PlanNote notes = 8;
  // What the change is for, in a person's terms, when the method that proposed
  // it knows. Unset for a change proposed as plain edits.
  Intent intent = 10;
  // Which project and environment its resources land in, once there's a choice
  // of either, so a plan can't read as another's. Empty while there's one
  // project with one environment. A plan that spans several lists each.
  repeated PlanPlace places = 9;
  // The server it takes out of the fleet, if it does (ADR 0090). Numbered in
  // the block removal holds, 140 to 149.
  ServerRemoval removes = 140;
}

// PlanPlace is where a plan's resources land, naming only what offers a choice.
message PlanPlace {
  // The project's name. Empty while there's only one project.
  string project = 1;
  // The environment's name. Empty while its project has only one.
  string environment = 2;
}

// PlanNote is one thing a person should know before applying a plan.
message PlanNote {
  // What it is about, for a surface that says it in its own words:
  // "named_as_text" for ${NAME} written as text in a field references doesn't
  // list, for a name the resource has a value for, which runs as those words;
  // "exposed_variable" for a variable whose value a Compose file writes in
  // free text, such as a label, where anyone who can read the plan
  // reads it, "exposed_more" for a file that writes more of them than a plan
  // lists, "container_name" for a name a service now answers to as an alias,
  // "no_build" for an image a Compose file builds and Dockwell doesn't,
  // "cpu_reservation" for a CPU reservation Docker has no way to keep,
  // "host_network_ports" for ports the server's own network doesn't publish,
  // "updates_project" for a Compose file that changes a project already running
  // services, "volumes_stay" for a rollback that leaves a service's data as it
  // is, "values_latest" for one that keeps the latest value of what the service
  // uses, "pulls_again" for a deploy of the tag it already names, "leaves_pin" for
  // one of the tag a rollback pinned, which replaces it whatever the pull finds,
  // "starts_stopped" for what isn't running and this plan starts, "digest_pinned"
  // for a rollback that runs exactly the image a revision ran, "digest_gone" for
  // one that can't as neither the server nor its registry has that image,
  // "digest_differs" for one that can't as its servers ran different images,
  // "kept_password" for a volume that keeps the
  // password it was made with, whatever an edit gave, "kept_passphrase" for a backup
  // destination that keeps its passphrase the same way, and "kept_options" for one
  // that keeps its options, as an edit gave none, "first_steps" for what a catalog
  // app needs a person to know and do, "backup_first" for one that backs up its volumes first, as a catalog
  // upgrade or a database's move to a release it can't come back from does, "backup_unmeasured" for a
  // volume whose backup gets a guess at the time it needs, "no_backup" for such an
  // upgrade or move that runs without a backup first, as asked, "upgrade_kept" for what a person changed that the upgrade
  // changes too, which stays, "upgrade_dropped" for what they changed that it
  // drops, which goes, "undo_no_backup" for an undo of a plan that took no backup,
  // whose data stays as the new version left it, "tmpfs_no_size" for a Compose
  // file's tmpfs that nothing stops taking half the server's memory,
  // "tasks_as_root" for an app this makes reach what's as good as root, whose
  // scheduled tasks run in it and reach the same, "raises_features" for a MongoDB
  // this moves to its next release, whose feature compatibility version goes up
  // first, "unbacked_move" for one whose data isn't in a volume Dockwell can back up
  // first, "lowers_release" for one this moves back, which goes only while its
  // data uses nothing newer, and "unbacked_paths" for an update of a service that
  // mounts server paths, which no backup takes first. Another reason may come: its
  // message says what it means.
  string reason = 1;
  // What it says, for people: the fact, what it means, and what to do.
  string message = 2;
  // The resource it is about.
  ResourceRef resource = 3;
  // The names it is about: the variable, then the field that holds it, for
  // "exposed_variable"; the project, then the services it runs, for
  // "updates_project"; the volumes and server paths for "volumes_stay"; the path
  // for "tmpfs_no_size"; each task, then its command, for "tasks_as_root"; the
  // release it leaves, then the one it moves to, for "raises_features" and
  // "lowers_release", which adds the feature compatibility version its last
  // reading said where the release it moves to can't run it; the server paths
  // for "unbacked_paths"; the
  // variables and secrets, by the names the service sees, for "values_latest";
  // the image, the revision and its digest for "digest_pinned" and "digest_gone",
  // and the image and the revision for "digest_differs"; the container_name, or
  // the image, or the ports. Never a variable's value.
  repeated string names = 4;
  // Where the value came from, for "exposed_variable": "env_file" for the .env
  // sent beside the file, which someone may not have read for this, and
  // "variables" for the request's own. Empty otherwise.
  string from = 5;
  // What it says would be deleted, for "updates_project". Empty otherwise.
  repeated string deleted = 6;
  // True when names and deleted hold all that message says, so a surface can say
  // it in its own words. A note kept from before these did has only its message.
  bool named = 7;
}

// PlanSummary counts the resources a plan touches by what it does to them.
message PlanSummary {
  // Resources made for the first time.
  int32 create = 1;
  // Resources changed in place.
  int32 change = 2;
  // Resources removed and made again, such as a recreated container. A
  // replace is counted here alone, never among the changes.
  int32 replace = 3;
  // Resources deleted.
  int32 destroy = 4;
}

// Intent is what a change is for, in a person's terms. A plan says what happens
// to resources, which for a deploy or a new port is that a container is made
// again: this says what that comes to. It isn't in the fingerprint, as it says
// nothing about what the plan does.
message Intent {
  // What it is.
  IntentKind kind = 1;
  // The ID of the resource it is about.
  string resource_id = 2;
  // The image a deploy runs.
  string image = 3;
  // The port on the server that publishing a port opens.
  int32 port = 4;
  // The revision a rollback puts back.
  int64 revision = 5;
  // The commit a deploy builds, for a service that builds from Git, in full.
  // Numbered apart, as open work adds to this message.
  string commit = 130;
  // The branch or tag that commit was read from.
  string ref = 131;
  // The image an update leaves, as the service's spec names it, and the digest
  // it ran, where a server said, for INTENT_KIND_UPGRADE. image is the one it
  // goes to. Numbered apart, as open work adds to this message (ADR 0080).
  string from_image = 260;
  string from_digest = 261;
  // The releases a catalog install's upgrade leaves and goes to, such as "29.0.4"
  // and "30.0.1", for INTENT_KIND_UPGRADE of an install. resource_id is its
  // project's ID then.
  string from_release = 262;
  string release = 263;
}

// IntentKind is what a change is for.
enum IntentKind {
  INTENT_KIND_UNSPECIFIED = 0;
  // It runs another image.
  INTENT_KIND_DEPLOY = 1;
  // It publishes one more port.
  INTENT_KIND_PUBLISH_PORT = 2;
  // A person takes it back to an earlier revision.
  INTENT_KIND_ROLL_BACK = 3;
  // It pulls the image it runs again, as its tag may have moved, and replaces it
  // only if that is a newer image.
  INTENT_KIND_REPULL = 4;
  // It updates an app to a newer version of what it runs: another image, or a
  // catalog install's newer release, with a backup first (ADR 0080).
  INTENT_KIND_UPGRADE = 5;
}

// PlannedResource is what a plan does to one resource as a whole.
message PlannedResource {
  // The resource's ID. A new resource has its ID from when it is planned.
  string id = 1;
  // The resource.
  ResourceRef resource = 2;
  // What happens to it, from its steps on every server: replace if any
  // step replaces it; delete if it is deleted, from every server; create if
  // it is new and every step creates it; otherwise update, if anything
  // changes. A kind that runs on no server takes what its revision does.
  // The summary counts these.
  PlanAction action = 3;
  // The revision it starts from: 0 for a new resource.
  int64 base_revision = 4;
  // The fields that differ from its latest revision.
  repeated FieldChange changes = 5;
  // Where it runs once applied, by server ID.
  repeated string servers = 6;
  // Where it runs now, by server ID.
  repeated string previous_servers = 7;
  // What the change lets it reach on its servers that it couldn't before,
  // or reach in another way, which a person approves. The control plane
  // decides this from the specs, not from what the servers report.
  repeated HostAccess host_access = 8;
  // What installing updates on its server will do, for a server's host the
  // change installs on.
  PackageInstall install = 9;
  // What rebooting its server does, for a server's host the change reboots.
  HostReboot reboot = 10;
  // What an action on one of its server's system services does, for a server's
  // host the change acts on a unit of (ADR 0082). Track S takes 70 to 79 here.
  HostUnit unit = 70;
  // The change takes no step for it on the server it removes from the fleet:
  // what it left there stays as it is, and Dockwell lets go of it (ADR 0090).
  // Numbered in the block removal holds, 140 to 149.
  bool lets_go = 141;
}

// HostAccess is something on a server that a resource reaches beyond what
// Docker keeps for it, such as a server path a container mounts.
message HostAccess {
  // What it is.
  HostAccessKind kind = 1;
  // The server path or socket, the volume's device, the network's parent
  // interface, a network the server has, a capability or a group, such as
  // "/srv/app/config", ":/export/media", "eth0", "1panel-network", "NET_ADMIN"
  // or "999". Empty for the server's network and for privileged mode.
  string path = 2;
  // True when it is reached read-only: mounted so, or mounted so by the
  // service that uses it. False reads and writes.
  bool read_only = 3;
  // A volume's mount type, such as "nfs" or "cifs".
  string type = 4;
  // The remote server of a mount, such as "10.0.0.2". It never holds
  // credentials.
  string address = 5;
  // How Docker relabels a server path for SELinux: "z", shared with other
  // containers, or "Z", private to this one. Empty for none.
  string relabel = 6;
  // The plugin a volume runs on, or a network's driver, such as "macvlan".
  string driver = 7;
  // A network's options beyond the few that keep it to its own bridge, as
  // "name=value" with commas between, sorted. For a network the server has,
  // the other names a service answers to on it, with commas between, sorted.
  // For a server path, an external volume or a mount, read-write, who writes
  // there where that's root or may be: "root", however the user is written;
  // "named", a user by name, which only the image can say is root or not; or
  // "image", whichever user the image runs as. Empty for a user other than
  // root, by number. Written by root, or by another who may be root, reaches
  // more than the same written by someone else.
  string detail = 8;
  // True for what is as good as root on the server, whatever else it says:
  // Docker's socket, the server's own network, a system path such as /etc,
  // privileged mode or the capability SYS_ADMIN. All host access needs a
  // signed-in person; a client should ask for more than a click only for this,
  // so that the warning means something when it comes.
  bool same_as_root = 9;
  // Where the server path leads through symlinks, as its server's agent reads it,
  // when that is somewhere else. Empty when it isn't, or when no agent has said,
  // as for a server that wasn't connected when it was planned.
  string leads_to = 10;
  // True when that isn't where the path led when what runs now was made, as its
  // server's agent reads it. An agent sets it, for the control plane to decide
  // what a plan gains by, and plans don't carry it.
  bool leads_moved = 11;
  // Another mount's source inside path, a read-write server path. What writes path
  // can turn it into a link to anywhere on the server, which what mounts it follows
  // the next time it starts, so this is as good as root.
  string holds = 12;
  // What mounts holds, by name. Empty where that's this resource too.
  string holds_for = 13;
  // The other side of holds: a read-write server path that holds path, and what can
  // write it, by name, which can make path lead anywhere. A change to that asks for a
  // passkey from now on.
  string held_in = 14;
  string held_by = 15;
  // For a server path, an external volume or a mount, read-write, the image
  // repository whose code writes there, such as "ghcr.io/acme/web". A person
  // approves one for what runs there, and any image can hold a program that
  // runs as root, so another repository reaches more, whatever the user.
  // Another tag of the same one doesn't.
  string written_by = 16;
}

// HostAccessKind is what a resource reaches on its server.
enum HostAccessKind {
  HOST_ACCESS_KIND_UNSPECIFIED = 0;
  // A server path, mounted into a container, or by a volume's bind option.
  HOST_ACCESS_KIND_SERVER_PATH = 1;
  // Docker's or containerd's socket, or a path that holds one: control of
  // Docker on the server, which is the same as root.
  HOST_ACCESS_KIND_DOCKER_SOCKET = 2;
  // The server's own network, Docker's host network.
  HOST_ACCESS_KIND_HOST_NETWORK = 3;
  // A mount Docker makes from a volume's driver options, such as an NFS or
  // CIFS share, or whatever a volume plugin reaches.
  HOST_ACCESS_KIND_VOLUME_MOUNT = 4;
  // A network that reaches past the server's own bridge: a driver other
  // than bridge, such as macvlan, which puts containers on the server's
  // LAN, past its firewall, or options that change how a bridge routes.
  HOST_ACCESS_KIND_NETWORK_DRIVER = 5;
  // A domain another environment held within the undo window, in path, and
  // that environment's name, in detail. Claiming it takes that environment's
  // public traffic and certificate if the name still points here.
  HOST_ACCESS_KIND_DOMAIN = 6;
  // The panel's domain, in path, moving behind the server's proxy, named in
  // detail. A token mustn't be able to cut off the panel it can't approve.
  HOST_ACCESS_KIND_PANEL_DOMAIN = 7;
  // A port on the server itself that a route sends to, in path, as
  // "127.0.0.1:8080", at the domain and path in detail, and over plain HTTP when
  // type says "http". It reaches past containers, to whatever listens there, so
  // each of those is approved, not only the port.
  HOST_ACCESS_KIND_SERVER_PORT = 8;
  // A proxy a route believes on where a request came from, in path: an address,
  // a range, or "cloudflare". What it says of a client reaches services as true.
  HOST_ACCESS_KIND_TRUSTED_PROXY = 9;
  // A network on the server that Dockwell didn't make. Whatever else is on
  // it, other projects' services too, can reach the service, and it them.
  HOST_ACCESS_KIND_EXTERNAL_NETWORK = 10;
  // A Linux capability beyond Docker's default ones.
  HOST_ACCESS_KIND_CAPABILITY = 11;
  // A group its command joins, which reaches what that group owns on the
  // paths it mounts. The group that owns Docker's socket is the same as root.
  HOST_ACCESS_KIND_GROUP = 12;
  // Privileged mode: every device and capability on the server, the same as
  // root.
  HOST_ACCESS_KIND_PRIVILEGED = 13;
  // A route with tls off that answers anyone who can reach the server's port 80,
  // on the domain in path. It goes around whatever is in front of the server.
  HOST_ACCESS_KIND_PLAIN_FOR_ANYONE = 14;
  // The domain in path going off HTTPS, as it had a certificate within the undo
  // window. https:// stops answering, and browsers that saw HSTS refuse plain HTTP.
  HOST_ACCESS_KIND_HTTPS_OFF = 15;
  // A volume on the server that Dockwell didn't make, in path. Whatever else
  // mounts it shares what it holds.
  HOST_ACCESS_KIND_EXTERNAL_VOLUME = 16;
  // A container Dockwell didn't make, in path, whose environment comes into
  // Dockwell with it: a token mustn't be able to bring in what it couldn't read.
  HOST_ACCESS_KIND_TAKES_ON = 17;
  // A backup of a volume that reached path, which is as good as root, coming back
  // into a volume that doesn't. What it holds can be read from there.
  HOST_ACCESS_KIND_BACKUP_OF = 18;
  // A private route opened to someone it kept out within the undo window, at the
  // domain and path in path, and how in detail: its address list taken off or
  // widened, its users taken off, a user added, or a password changed. A token
  // could otherwise let itself in. Numbered apart, as open work adds to this enum.
  // See docs/adr/0087-private-routes.md.
  HOST_ACCESS_KIND_ACCESS_OPENED = 110;
  // A shell command the agent runs on the server as root, on a schedule (ADR
  // 0053): the same as root. Numbered in the block scheduled tasks hold, as open
  // work adds to this enum.
  HOST_ACCESS_KIND_SERVER_SHELL = 150;
  // A certificate's key, proven by DNS by the control plane, going to the server
  // for the first time, for the domain in path (ADR 0088). An admin confirms it
  // with a passkey. Numbered in the block DNS-01 holds, 120 to 129.
  HOST_ACCESS_KIND_CERTIFICATE_KEY = 120;
}

// ServerPlan is the part of a plan on one server.
message ServerPlan {
  // The server's ID.
  string server_id = 1;
  // The server's name, such as "hz-1".
  string server_name = 2;
  // True when the server isn't connected: its steps are planned from the
  // state it last had, and the change can't be applied until it reconnects.
  bool offline = 3;
  // True when the server was removed from the fleet. It has no steps: what
  // the change takes off it is only recorded.
  bool removed = 4;
  // The steps' downtime added up, as they run one at a time.
  google.protobuf.Duration downtime = 5;
  // The steps, in the order they run.
  repeated PlanStep steps = 6;
  // How long until everything the steps touch is healthy again, at most,
  // when a health check may take longer than the downtime: each step's
  // until_healthy, or its downtime, added up. Unset when the downtime says
  // it all.
  google.protobuf.Duration until_healthy = 7;
}

// PlanStep is what applying does to one resource on one server.
message PlanStep {
  // The resource's ID.
  string resource_id = 1;
  // The resource.
  ResourceRef resource = 2;
  // What the step does.
  PlanAction action = 3;
  // What it does to what the resource serves.
  StepEffect effect = 4;
  // How long what the resource serves is unavailable. Unset means none.
  google.protobuf.Duration downtime = 5;
  // True when the step removes data its spec can't bring back.
  bool destroys_data = 6;
  // Ways the step may hurt that its action doesn't say.
  repeated PlanWarning warnings = 7;
  // The fields that differ from what the server has now.
  repeated FieldChange changes = 8;
  // How long until what the resource serves is healthy again, at most,
  // counting the downtime, when its health check may take longer than the
  // downtime, as after a container is recreated. Unset when the downtime
  // says it all.
  google.protobuf.Duration until_healthy = 9;
  // Where data was that the step takes out of use, which the server keeps
  // for 7 days: for a container, the paths in it where its image keeps
  // data, which deleting it, or mounting something else there, leaves
  // behind. Undoing the step mounts them again.
  repeated string kept_paths = 10;
  // True when the step brings back data its server kept, as undoing a
  // deletion does. Applying it fails if the server no longer has the data,
  // rather than making the resource anew, empty.
  bool restores = 11;
  // What the step lets the resource reach on its server that it couldn't
  // before, or reach in another way, which a person approves. The control
  // plane decides this from the specs, not from what the server reports.
  repeated HostAccess host_access = 12;
  // True when the server hasn't the image yet, so its own health check
  // isn't known, and until_healthy may be missing or too short.
  bool health_unknown = 13;
  // What the step does to the server's ingress, beside the route itself.
  // Unset for a step that leaves it as it is.
  IngressEffect ingress = 14;
  // What DNS said of a route's domain when this was planned. It never stops
  // a plan, and the fingerprint leaves it out, as people often set DNS after.
  DomainCheck domain_check = 15;
  // Stopped containers that Docker starts again when it next restarts, as after
  // a reboot, and that may then take the ports the server's proxy needs, so
  // its routes stop answering. It never stops a plan, and the fingerprint leaves
  // it out. Keep one stopped with docker update --restart=no.
  repeated string returning_containers = 16;
  // True when the step asks the server for its image again first. With no
  // changes, it replaces what runs only if that finds a newer image, and does
  // nothing otherwise, which its progress says. With nothing but a restart policy
  // to change, it changes that in place otherwise.
  bool pull = 17;
  // True when the digest its spec pins isn't on the server, and its registry
  // won't give it, so applying it could only fail. A registry that doesn't answer
  // says nothing of it, so this stays false.
  bool image_gone = 18;
  // How the step replaces a running service. Unset for a step that replaces
  // nothing, or that was planned without its server, as for an offline one,
  // which can't tell.
  RolloutPlan rollout = 23;
  // Names the restart this step carries out, when it is one.
  string restart = 24;
  // True when the step has a route serve plain HTTP that didn't, as TLS ends
  // before this server, so its traffic reaches the server unencrypted. That is
  // fine on a tunnel or a private network, and not on the open internet. It
  // never stops a plan, and needs no person.
  bool unencrypted = 20;
  // Who a route with tls off, or to a port on the server, answers. Unset for what
  // answers over HTTPS and sends to a service, as every other route does.
  RouteAnswers answers = 21;
  // The port on the server a route sends to, and what listens there as this was
  // planned. It never stops a plan, and the fingerprint leaves what listens out.
  ServerPortCheck server_port = 22;
  // True when the step deletes a service whose server keeps logs of it: from
  // then on they can't be read, and they go in 7 days, unless undoing the
  // step brings them back. Numbered apart, as open work adds to this message.
  bool hides_logs = 30;
  // What someone visiting a route finds once this step takes it away. A route
  // stops nothing a plan counts as downtime, and yet stops people reaching what it
  // served. It never stops a plan, and the fingerprint leaves it out. Numbered
  // apart, as open work adds to this message.
  RouteGoes goes = 31;
  // Set when a route leaves the service it sent to for another, as what a domain
  // reaches changing is easy to miss among a plan's fields. It never stops a plan.
  // Numbered apart, as open work adds to this message.
  RouteMove moves = 32;
  // The full ID of the container this step takes on, which goes on running as it
  // is, with no restart, as what the step's service runs.
  string adopts = 33;
  // True when this deletion lets go of a container that was taken on and hasn't been
  // replaced since: it goes on running as it is, and nothing about it changes.
  bool releases = 34;
  // What else may still run what this step replaces, which came from a Compose
  // project. A plan says what that means in a note.
  ManagedElsewhere managed_elsewhere = 35;
  // Names what this step takes on goes on answering to, that others hold too on a
  // network it's on.
  repeated SharedName shared_names = 36;
  // What a step that restores a volume from a backup does. Numbered apart, as open
  // work adds to this message.
  RestorePlan restore = 40;
  // What a step that backs up a volume before the rest of a change does.
  BackupFirst backup_first = 41;
  // What a step that turns on deny everything else closes: each port that
  // listens on the server, or that Docker publishes, that no rule lets in from
  // anywhere, such as "8080/tcp (shop-web-1)". SSH's ports and the control
  // plane's own stay let in by their pins, and aren't here (ADR 0052).
  repeated string closes = 42;
  // How the server stays reachable once a step that narrows SSH is kept: who
  // SSH stays open from, by name, so a person sees whether their own address
  // is there, and a stranger's. Unset on a step that leaves SSH open to
  // anywhere.
  AccessStays stays = 43;
  // What the step builds, from source, before it replaces what runs. A build
  // that fails leaves what runs as it was. Numbered apart, as open work adds to
  // this message.
  BuildPlan build = 130;
  // What a step that sets a fail2ban jail says of whom it can ban (ADR 0052).
  JailPlan jail = 44;
  // What installing updates will do, for a step that installs them on a
  // server's host: the agent's simulation of the exact command.
  PackageInstall install = 45;
  // What rebooting does, for a step that reboots its server.
  HostReboot reboot = 46;
  // What an action on one of its server's system services does, for a step that
  // takes one (ADR 0082). Track S takes 70 to 79 here.
  HostUnit unit = 70;
  // The registry login the step's pull signs in with, by name, where it pulls with
  // one (ADR 0086). Numbered in the block registry logins hold, 100 to 109.
  string registry_login = 100;
  // The registry logins the step's build may pull its base images with, by name:
  // BuildKit signs in with the one for each registry its Dockerfile pulls from
  // (ADR 0086). Numbered in the block registry logins hold, 100 to 109.
  repeated string build_logins = 101;
  // Which revision of which saved login each of build_logins is, as the plan saw
  // them: an apply refuses one saved again since (ADR 0086). Numbered in the block
  // registry logins hold, 100 to 109.
  repeated string build_login_versions = 102;
  // What a step that moves a database to a newer release does beside replacing
  // its container, by a dump into a new volume (ADR 0080). Numbered in the
  // updates area's block, 260 to 269.
  DatabaseMove database_move = 260;
}

// BuildPlan is what a step builds: a commit of a repository, with its Dockerfile or
// with Railpack, into an image of its own. See docs/adr/0046-builds-from-git.md.
message BuildPlan {
  // The repository, such as "https://github.com/acme/web.git".
  string url = 1;
  // The branch or tag the commit was read from, such as "main".
  string ref = 2;
  // The commit, in full.
  string commit = 3;
  // The folder the build starts from. Empty is the repository's top.
  string context = 4;
  // The Dockerfile, as a path in context.
  string dockerfile = 5;
  // The image it makes.
  string image = 6;
  // What the build settings choose to build with. Unset takes the Dockerfile
  // when the commit has one, and Railpack when it hasn't.
  dockwell.resource.v1alpha1.ImageBuild.Builder builder = 7;
  // What reading the commit found: what builds it, and with Railpack, what it
  // installs and runs. Empty when the build names its Dockerfile, or the server
  // couldn't be asked; the build then reads it as it starts.
  BuildDetection detection = 8;
}

// BuildDetection is what reading a commit of a repository found, before
// anything builds: whether it has a Dockerfile, and what Railpack makes of it.
// See docs/adr/0046-builds-from-git.md.
message BuildDetection {
  // What builds it: BUILDER_DOCKERFILE or BUILDER_RAILPACK.
  dockwell.resource.v1alpha1.ImageBuild.Builder builder = 1;
  // The Dockerfile it builds with, as a path in the repository, when there is
  // one.
  string dockerfile = 2;
  // The version of Railpack that read it, such as "0.43.0".
  string railpack_version = 3;
  // What Railpack found the source is, such as "node", first what decides.
  repeated string providers = 4;
  // The languages and tools it installs, with their versions.
  repeated DetectedPackage packages = 5;
  // What it runs to build, step by step.
  repeated DetectedStep steps = 6;
  // The command the image starts with.
  string start_command = 7;
  // What Railpack warns of, such as "No node package manager detected, using
  // npm", in its words.
  repeated string warnings = 8;
  // Why Railpack can't build it, in its words, when it can't.
  string error = 9;
  // With its Dockerfile, the image its last stage starts from, such as
  // "node:22-alpine", unless a build argument names it.
  string base_image = 10;
  // What kind of problem error is, which says what to do about it.
  DetectionProblem problem = 11;
  // With DETECTION_PROBLEM_VERSION, the language or tool, such as "node".
  string problem_tool = 12;
  // The ports its Dockerfile's last stage says the app listens on (EXPOSE), TCP
  // ones, lowest first, such as 8080. Empty with Railpack, and when it says none.
  repeated int32 exposed_ports = 13;
}

// DetectionProblem is what kind of problem stops Railpack building a commit.
enum DetectionProblem {
  DETECTION_PROBLEM_UNSPECIFIED = 0;
  // It can't tell what language the source is: add a Dockerfile, or set both
  // a build and a start command.
  DETECTION_PROBLEM_NO_PROVIDER = 1;
  // It can't find a version of a language or tool the source asks for: change
  // the version, or set RAILPACK_<TOOL>_VERSION as a build argument.
  DETECTION_PROBLEM_VERSION = 2;
  // Nothing starts the app: set the build's start command.
  DETECTION_PROBLEM_NO_START = 3;
  // The server couldn't reach where versions are listed. A plan goes ahead
  // without the reading, and a build fails until the server can.
  DETECTION_PROBLEM_NETWORK = 4;
  // Anything else, in Railpack's words.
  DETECTION_PROBLEM_OTHER = 5;
}

// DetectedPackage is a language or tool a Railpack build installs.
message DetectedPackage {
  // Its name, such as "node".
  string name = 1;
  // The version the source asks for, such as "22", or empty for Railpack's
  // default.
  string requested = 2;
  // The version that is installed, such as "22.11.0".
  string resolved = 3;
  // Where the version came from, such as "package.json > engines > node".
  string source = 4;
}

// DetectedStep is a step of a Railpack build and the commands it runs.
message DetectedStep {
  // Its name, such as "install" or "build".
  string name = 1;
  // The commands, such as "npm ci", in order.
  repeated string commands = 2;
}

// JailPlan is whom a fail2ban jail, as planned, never bans, and who is signed
// in now that it could.
message JailPlan {
  // What it never bans: the server's loopback, the control server's
  // addresses, and what the jail ignores itself.
  repeated string never_bans = 1;
  // The addresses signed in to the server over SSH as it was planned that it
  // doesn't ignore: a ban can land on each as the change applies, as a jail
  // that starts counts the failures of just before.
  repeated string signed_in_not_ignored = 2;
  // True when what it ignores covers every address, such as 0.0.0.0/0: the
  // jail then bans nobody.
  bool ignores_everything = 3;
}

// AccessStays is who still reaches a server's SSH once a change that narrows
// it is kept (ADR 0052). An address here is all that keeps its person in: if
// it changes, SSH is closed to them until a rule allows its port from where
// they are.
message AccessStays {
  // SSH's ports the change narrows, such as 22.
  repeated uint32 ssh_ports = 1;
  // The addresses pinned to SSH: those signed in over SSH as it was planned,
  // and those kept from earlier changes, such as "203.0.113.7/32".
  repeated string pinned = 2;
  // What rules allow SSH's ports from, such as "198.51.100.0/24". Empty when
  // no rule allows them.
  repeated string allowed = 3;
  // WireGuard tunnels whose port no rule allows, each as "wg0 (51820/udp)", or
  // "wg0" where Dockwell couldn't read its port, when the change turns deny
  // everything else on: the tunnel's next handshake is dropped, and SSH over
  // it with it, though it passes the test while the tunnel's flow is tracked.
  repeated string tunnels = 4;
  // The ports the panel and the control plane listen on, on the control
  // server, when the change turns deny everything else on there: they stay
  // open by their pin, and the test to run is the panel in a new tab too.
  repeated uint32 panel_ports = 5;
}

// BackupFirst is a backup a change takes before anything else it does, as a catalog
// upgrade takes one of what the new version may change. If it fails, the change stops
// there, with nothing else done.
message BackupFirst {
  // The backup's ID, once it's taken.
  string backup_id = 1;
  // How it's taken.
  BackupMethod method = 2;
  // The database of a dump, such as "PostgreSQL".
  string database = 3;
  // What stops while it's copied: services by name, and anything else by its
  // container's. A database's dump stops nothing.
  repeated string stops = 4;
  // About how much it will take on the server's disk, in bytes.
  int64 estimate_bytes = 5;
  // True when nothing could tell: there was no backup before, and measuring the
  // volume took too long. The time the step gets is a guess, and the plan says so.
  bool unmeasured = 6;
  // The one database it dumps alone, an app's on a server it shares, taken for
  // the app before its update (ADR 0084). Empty backs up the whole volume.
  // Numbered apart, as open work adds to this message.
  string database_name = 80;
  // More databases on the same server, each dumped alone after database_name under
  // a backup ID of its own, for apps whose update reads them (ADR 0084).
  repeated DatabaseDump also = 81;
}

// DatabaseDump is one database a step dumps alone, and its backup's ID.
message DatabaseDump {
  string backup_id = 1;
  string database_name = 2;
}

// DatabaseMove is what a step that moves a database to a newer release does
// (ADR 0080): it stops what else of its app runs on the server, dumps the
// database, loads the dump into the new release on a new volume, checks that it
// starts there and answers, then replaces the container and starts what stopped.
// The volume the data was on stays as it was, so undo puts the old release back
// on it.
message DatabaseMove {
  // The dump's ID, kept as a backup of from_volume.
  string backup_id = 1;
  // The database, such as "PostgreSQL".
  string database = 2;
  // The release series it moves from and to, such as "16" and "17".
  string from_series = 3;
  string to_series = 4;
  // The volume its data is on now, which stays as it is, and the new one.
  string from_volume = 5;
  string to_volume = 6;
  // What else stops while it moves: services by name, and anything else by its
  // container's.
  repeated string stops = 7;
  // About how large the dump will be, in bytes.
  int64 estimate_bytes = 8;
  // True when nothing could tell, so the time the step gets is a guess.
  bool unmeasured = 9;
  // True for a step that finishes a move a run cut short after its replace: it
  // starts what the move stopped and records its dump.
  bool finishing = 10;
  // The change that moves it, which names what the move stopped.
  string change_id = 11;
  // Containers Dockwell doesn't manage on the old volume, by name, which stop for
  // the move and stay stopped after it, as they'd go on with the old data.
  repeated string stays_stopped = 12;
}

// SharedName is a name more than one container answers to on a network.
message SharedName {
  // The name, such as "redis".
  string name = 1;
  // The network, such as "1panel-network".
  string network = 2;
  // The other containers that answer to it there, by name.
  repeated string others = 3;
}

// ManagedElsewhere is what else may run a container that was taken on.
message ManagedElsewhere {
  // The tool that runs its Compose project, such as "1Panel". Empty when its labels
  // don't show one.
  string manager = 1;
  // The name it came with.
  string container = 2;
  // Its Compose project.
  string project = 3;
  // Where that project runs from, which may hold what the service mounts.
  string folder = 4;
}

// BackupMethod says how a backup is taken, which says what it's worth.
enum BackupMethod {
  BACKUP_METHOD_UNSPECIFIED = 0;
  // The database's own dump, taken with it running. It restores across versions.
  BACKUP_METHOD_DUMP = 1 [(dockwell.v1.word) = "Dump"];
  // A copy of the volume's files with nothing running on them, so exact. For a
  // database's files, it restores only on the same version.
  BACKUP_METHOD_COPY = 2 [(dockwell.v1.word) = "Copy"];
  // A copy of the volume's files with its app running. Files changed as they
  // were read, so it can hold half a write, and an app may not start from it.
  BACKUP_METHOD_COPY_RUNNING = 3 [(dockwell.v1.word) = "Copy of a running app"];
}

// RestorePlan is what a step that restores a volume does: it says what comes
// back, and what stops while it does. What's in the volume is replaced, and the
// server keeps a copy of it for 7 days.
message RestorePlan {
  // The backup it brings back. Empty for an undo.
  string backup_id = 1;
  // The change it undoes, by putting back what that replaced. Empty otherwise.
  string undoes = 2;
  // How what it brings back was taken.
  BackupMethod method = 3;
  // The database of a dump, such as "PostgreSQL".
  string database = 4;
  // When what it brings back was taken.
  google.protobuf.Timestamp taken_at = 5;
  // How large that is, in bytes.
  int64 size_bytes = 6;
  // What stops while it happens: services by name, and anything else by its
  // container's. It's whatever mounts the volume, and for a dump, the rest of the
  // app on that server too.
  repeated string stops = 7;
  // The image that wrote a copy of a database's files, and the one that would read
  // them, set only when those are different releases, as the database may not
  // start on them.
  string written_by = 8;
  string runs_on = 9;
  // What the backup's volume reached when it was taken that's as good as root. A
  // backup is tied to a volume by name alone, so what it holds may be that, whatever
  // the volume it comes back into reaches.
  repeated string reached = 10;
  // The one database it brings back, alone, for an app's on a server it shares:
  // nothing stops, its user can't sign in while it loads, and the rest of the
  // server stays as it is (ADR 0084). Empty for the whole volume. Numbered apart,
  // as open work adds to this message.
  string database_name = 80;
}

// RouteMove is a route leaving one service for another.
message RouteMove {
  // Its domain and path, as people read them, such as "app.example.com/api".
  string where = 1;
  // The service it sent to.
  string from = 2;
  // The service it goes to. Empty when it goes to to_port on the server.
  string to = 3;
  // The port on the server it goes to, when it goes to no service.
  uint32 to_port = 4;
}

// RouteGoes is a route a step takes away.
message RouteGoes {
  // Its domain and path, as people read them, such as "app.example.com/api".
  string where = 1;
  // The domain alone.
  string domain = 2;
  // What someone visiting it finds.
  VisitorsFind find = 3;
}

// VisitorsFind is what someone visiting a route finds once it's gone.
enum VisitorsFind {
  // That they no longer reach it, with no word from the server on how.
  VISITORS_FIND_UNSPECIFIED = 0;
  // A refused connection, as nothing holds the server's port.
  VISITORS_FIND_REFUSED = 1;
  // A browser's connection error, as the proxy still runs and has nothing for that
  // name over HTTPS.
  VISITORS_FIND_TLS_ERROR = 2;
  // A 404 from the proxy, which is what's in front gets for a route that took no
  // certificate.
  VISITORS_FIND_NOT_FOUND = 3;
  // What the rest of the domain serves, or a 404 if nothing covers that path.
  VISITORS_FIND_REST = 4;
  // Whatever what's in front shows when it can't connect, as the proxy has stopped,
  // and the route took no certificate.
  VISITORS_FIND_NOTHING_BEHIND = 5;
}

// RouteAnswers is who a route answers, as its plan says.
message RouteAnswers {
  // Who.
  RouteReach reach = 1;
  // The proxies it answers, for ROUTE_REACH_PROXIES.
  repeated string proxies = 2;
  // True when it answers over plain HTTP, as tls off says.
  bool plain = 3;
}

// RouteReach is who a route answers.
enum RouteReach {
  ROUTE_REACH_UNSPECIFIED = 0;
  // This server's own loopback alone, as for a tunnel on the server's network.
  ROUTE_REACH_THIS_SERVER = 1;
  // The proxies the route names, and whoever comes through them.
  ROUTE_REACH_PROXIES = 2;
  // Anyone who can reach the server's port.
  ROUTE_REACH_ANYONE = 3;
}

// ServerPortCheck is a port on the server that a route sends to.
message ServerPortCheck {
  // The port.
  uint32 port = 1;
  // What listens there, as the server said when this was planned, such as
  // "nginx, in the container web-1". Empty when nothing does, or it couldn't say.
  string listening = 2;
  // True when the server said nothing listens there yet, so the route answers 502
  // until something does. False, with listening empty, when it couldn't say.
  bool nothing_listening = 3;
}

// RolloutPlan is how a step replaces a running service, and why.
message RolloutPlan {
  // True when a new container takes over once it is healthy, so nothing stops:
  // downtime is unset. False when the old one stops first, so there is
  // downtime, and never two at once.
  bool rolling = 1;
  // Server ports both would publish, which two containers can't, such as
  // "8080/tcp".
  repeated string ports = 2;
  // Volumes both would mount and one of them write to.
  repeated string volumes = 3;
  // Server paths both would mount and one of them write to.
  repeated string paths = 4;
  // Where in the container its image keeps data, in a volume that moves to the
  // new container.
  repeated string image_data = 5;
  // True when the service's rollout.order chose this, rather than the rest of
  // this message. With rolling, it means two containers may write to what the
  // lists above name, for as long as the step takes.
  bool chosen = 6;
  // The most what is in flight gets to finish once no new request goes to the
  // old container. What outlasts it ends with the container.
  google.protobuf.Duration drain = 7;
  // The most the new container gets to be healthy before the change fails and
  // Dockwell rolls it back, while the old one goes on serving.
  google.protobuf.Duration healthy_within = 8;
  // Containers of the service the step also removes, as a rollout that stopped
  // partway or docker compose up --scale left them.
  repeated string others = 10;
  // The most an old container gets to stop, once what it had in flight is
  // done, before Docker kills it.
  google.protobuf.Duration stop_grace = 11;
  // What it mounts whose real place on the server the agent can't read, such as
  // a volume on another driver, so it can't say two containers wouldn't write
  // to the same place, and the old one stops first.
  repeated string cant_tell = 12;
  // Routes someone edited by hand that send to the service. Dockwell leaves them
  // as they are, so the new container has to keep the old one's address, and the
  // old one stops first.
  repeated string edited_routes = 13;
  // Networks of the service. Docker answers the service's name there with every
  // running container that has it, so while a new one starts, other services
  // can reach it by name beside the old one, before it has passed its check.
  repeated string early_networks = 14;
  // The other names it answers to on those networks.
  repeated string early_names = 17;
  // True when the old container or the new one is on the server's own network,
  // where each listens on the server's ports, so the old one stops first.
  bool host_network = 18;
  // What the old container mounts and the new one doesn't. It stays on the
  // server, and the service no longer sees it.
  repeated DroppedMount dropped = 15;
  // How long a new container must stay healthy before anything moves to it or
  // the old one goes.
  google.protobuf.Duration soak = 16;
  // True when nothing checks the new container, neither its spec nor its image,
  // so healthy is only that it runs, and keeps running for soak.
  bool no_check = 19;
  // The port each route this change touches sends to on the service, by the route's
  // name. A route's own step comes after its service's, so the new container is held
  // to these, and traffic moves to them with it, not to what the route dials now.
  map<string, uint32> route_ports = 20;
}

// DroppedMount is something the old container mounts and the new one won't.
message DroppedMount {
  // The volume or server path.
  string source = 1;
  // Where the container sees it, such as "/data".
  string target = 2;
  // True when the new image declares a volume there, so an empty one takes its
  // place.
  bool empty_volume = 3;
}

// IngressEffect is what a step does to the proxy that holds a server's public
// ports.
message IngressEffect {
  // What happens to the proxy.
  IngressChange change = 1;
  // The proxy, such as "Caddy".
  string proxy = 2;
  // The ports it takes or frees, such as "80/tcp", "443/tcp" and "443/udp".
  // A server whose routes all say tls off needs port 80 alone.
  repeated string ports = 3;
  // The panel's domain, when the panel moves behind the proxy as it starts,
  // or takes the ports back as it stops. The address, passkeys and sessions
  // stay; HTTPS on it is down while the certificate comes, and the SSH tunnel
  // keeps working.
  string panel_domain = 4;
}

// IngressChange is what happens to the proxy that holds a server's public
// ports.
enum IngressChange {
  INGRESS_CHANGE_UNSPECIFIED = 0;
  // It starts, as this is the server's first route, and takes the ports.
  INGRESS_CHANGE_STARTS = 1;
  // It stops, as this is the server's last route, and frees the ports. Its
  // certificates stay on the server.
  INGRESS_CHANGE_STOPS = 2;
  // It restarts, to a newer version, so what it serves is down for the step's
  // downtime.
  INGRESS_CHANGE_RESTARTS = 3;
  // It keeps running and takes more ports, as the first route that needs a
  // certificate comes to a server whose routes needed none. Nothing it serves
  // stops.
  INGRESS_CHANGE_TAKES_PORTS = 4;
  // It keeps running and frees ports, as the last route that needs a certificate
  // goes, or stops needing one. Its routes that take none go on answering.
  INGRESS_CHANGE_FREES_PORTS = 5;
}

// DomainCheck is what DNS says of a domain, as a server sees it.
message DomainCheck {
  // The domain.
  string domain = 1;
  // What it means.
  DomainCheckState state = 2;
  // The addresses DNS gives for it.
  repeated string found = 3;
  // The addresses the server has, which it compared them with.
  repeated string here = 4;
  // The server's public addresses known beyond its interfaces, which are the
  // ones to point a record at.
  repeated string public_addresses = 5;
  // Those of public_addresses nothing has shown to be a way in, so a record at
  // one may not reach the server.
  repeated string unproven_addresses = 6;
  // The server is behind carrier-grade NAT with no way in known, so no record
  // can reach it, and no forwarded port either. Only a tunnel can.
  bool carrier_nat = 7;
  // When DNS was read. Unset for a check from an agent from before this.
  google.protobuf.Timestamp read_time = 8;
  // A record points at Cloudflare's proxy, which ends TLS, and blocks a
  // certificate over HTTP-01 or TLS-ALPN.
  bool proxied = 9;
}

// DomainCheckState is whether a domain's DNS points at a server.
enum DomainCheckState {
  // Not known: DNS didn't answer in time, or the check didn't run.
  DOMAIN_CHECK_STATE_UNSPECIFIED = 0;
  // A record points at this server.
  DOMAIN_CHECK_STATE_POINTS_HERE = 1;
  // There's no A or AAAA record yet.
  DOMAIN_CHECK_STATE_NO_RECORD = 2;
  // The records point at other addresses.
  DOMAIN_CHECK_STATE_ELSEWHERE = 3;
  // The server has only private addresses, as behind NAT, so it can't tell
  // whether the public address DNS gives is its own.
  DOMAIN_CHECK_STATE_CANT_TELL = 4;
}

// PlanAction is what a plan does to a resource.
enum PlanAction {
  PLAN_ACTION_UNSPECIFIED = 0;
  // Nothing: it is already as desired.
  PLAN_ACTION_NONE = 1;
  // Made for the first time.
  PLAN_ACTION_CREATE = 2;
  // Changed in place.
  PLAN_ACTION_UPDATE = 3;
  // Removed and made again, such as a recreated container.
  PLAN_ACTION_REPLACE = 4;
  // Removed.
  PLAN_ACTION_DELETE = 5;
}

// StepEffect is what a step does to what the resource serves, beyond the
// change itself.
enum StepEffect {
  STEP_EFFECT_UNSPECIFIED = 0;
  // Nothing stops.
  STEP_EFFECT_NONE = 1;
  // The process restarts in place.
  STEP_EFFECT_RESTART = 2;
  // It is removed and made again.
  STEP_EFFECT_RECREATE = 3;
  // A new one takes over once it is healthy, with nothing stopped.
  STEP_EFFECT_ROLL = 4;
}

// PlanWarning flags a step that may hurt in a way its action doesn't say.
enum PlanWarning {
  PLAN_WARNING_UNSPECIFIED = 0;
  // The step may cut off remote access to the server, such as a rule that
  // blocks SSH from everywhere.
  PLAN_WARNING_MAY_LOCK_OUT = 1;
}

// FieldChange is one field that differs between two specs.
message FieldChange {
  // The field, such as "image", "env[API_KEY]" or "ports[0].host_port".
  string path = 1;
  // How it changed.
  FieldOp op = 2;
  // The value before. Empty when it was unset, and for a sensitive field.
  string from = 3;
  // The value after. Empty when it is unset, and for a sensitive field.
  string to = 4;
  // True for a field that may hold a secret: the plan says it changed,
  // never what it holds.
  bool sensitive = 5;
}

// FieldOp is how a field changed.
enum FieldOp {
  FIELD_OP_UNSPECIFIED = 0;
  // Set where it was unset.
  FIELD_OP_ADDED = 1;
  // Unset where it was set.
  FIELD_OP_REMOVED = 2;
  // Set to another value.
  FIELD_OP_MODIFIED = 3;
}

// StepProgress is one step of an applying change, and how it is going.
message StepProgress {
  // The server it runs on.
  string server_id = 1;
  // The resource's ID.
  string resource_id = 2;
  // The resource.
  ResourceRef resource = 3;
  // What the step does.
  PlanAction action = 4;
  // How it is going.
  StepState state = 5;
  // What is happening, for people, such as "Replacing web on hz-1", or why
  // the step failed, in plain words.
  string message = 6;
  // When it started running. Unset until then.
  google.protobuf.Timestamp start_time = 7;
  // When it finished. Unset until then.
  google.protobuf.Timestamp finish_time = 8;
  // What the step's driver says it is doing right now, such as "Pulling
  // nginx:1.27: 12 of 48 MB". Empty until it says, and once the step ends.
  string activity = 9;
  // What the server said, when a step failed and message puts it in plain
  // words: the whole chain of errors, IDs included. It never holds a secret,
  // as drivers keep them out of their errors.
  string detail = 10;
  // What a failure comes down to, when the driver knows, so a client can say
  // what to do about it where it is: "image", "command", "exits", "unhealthy",
  // "port", "mount", "registry" for a registry that didn't answer a pull
  // properly, where the same pull may work in a while, "disk" for a server
  // without room for the image it would pull, or "database_release" for a
  // database whose new image runs a release its data can't move to in place.
  // Empty when it doesn't, and it may gain others.
  string reason = 11;
  // True when the server went away during the step, so nothing can say whether
  // it ran until the server is back.
  bool lost = 12;
  // What the step did in the end, on this server, once it's done: action says
  // what was planned, and only the step can say this, as a pull finds out as it
  // goes. PLAN_ACTION_NONE left what runs exactly as it was. Unspecified until
  // it's done, for a step that failed, and for one a run that stopped partway had
  // done already.
  PlanAction did = 14;
  // What the step waits for, while a change to who reaches its server waits
  // for the person who applied it to confirm they still can (ConfirmChange).
  // Numbered apart, as open work adds to this message.
  ChangeConfirmation confirmation = 40;
  // What the step is doing right now, as a phase, beside activity: backing up,
  // pulling, starting or checking health. Unset until its driver says, once
  // the step ends, from an older agent, and for what isn't one of them. See
  // docs/adr/0080-updating-an-app-safely-and-automatically.md.
  StepPhase phase = 260;
  // How much of a pull is done, and how much it is in all, in bytes, while
  // phase is pulling and Docker has said. 0 otherwise.
  int64 done_bytes = 261;
  int64 total_bytes = 262;
}

// StepPhase is what a step is doing, of what a person follows an update by.
enum StepPhase {
  STEP_PHASE_UNSPECIFIED = 0;
  // Backing up a volume before anything else changes.
  STEP_PHASE_BACKING_UP = 1;
  // Pulling an image, with what runs still running.
  STEP_PHASE_PULLING = 2;
  // Starting what replaces what ran.
  STEP_PHASE_STARTING = 3;
  // Waiting for what started to pass its health check, and stay up.
  STEP_PHASE_CHECKING = 4;
}

// StepState is how a step is going.
enum StepState {
  STEP_STATE_UNSPECIFIED = 0;
  // Waiting for the steps before it.
  STEP_STATE_QUEUED = 1;
  // Running now.
  STEP_STATE_RUNNING = 2;
  // Done, and the server has what was asked for.
  STEP_STATE_DONE = 3;
  // It failed; message says why.
  STEP_STATE_FAILED = 4;
  // It didn't run, because a step before it failed.
  STEP_STATE_SKIPPED = 5;
  // Waiting for its server to reconnect, as a rollback does.
  STEP_STATE_WAITING = 6;
}

// ChangeElsewhere is what of a change is in projects its reader holds no role in.
message ChangeElsewhere {
  // How many of its items are there, and of those, how many are services that
  // restart with it.
  int32 items = 1;
  int32 restarts = 2;
  // The reader holds none of its edits, only what it takes in, so its summary and
  // who made it are left out, as they'd describe the other project.
  bool edits_elsewhere = 3;
}

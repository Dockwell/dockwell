syntax = "proto3";

// A catalog entry: one app at one version, in the format Dockwell reads,
// whichever catalog it came from. Anyone can publish a catalog in it. See
// docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md. The package is
// alpha while the format settles, as ADR 0029 says it can't be final until
// backups exist, so it may change without notice.
package dockwell.catalog.v1alpha1;

// Entry is one app a catalog offers, at one version. It installs through the
// same plan as any Compose file, into a project of its own. It runs no script
// on a server, and every image in it is pinned by digest.
message Entry {
  // Its ID, which stays the same from one version to the next, such as
  // "postgres". An install is pinned to it.
  string id = 1;
  // What people call the app, such as "PostgreSQL".
  string name = 2;
  // What the app is for, in one line, in the catalog's own words, such as
  // "Relational database, with Adminer to manage it".
  string summary = 3;
  // Where it files under, in lowercase, such as "databases".
  string category = 4;
  // The app's version, for people, such as "17.11". Nothing orders these:
  // release says which entry is newer.
  string version = 5;
  // Goes up each time the entry changes, so a higher one is an upgrade,
  // whether or not the app's version reads as one.
  uint32 release = 6;
  // The app's own site.
  string homepage = 7;
  // The licence of this entry, as an SPDX identifier, which its source sets.
  string license = 8;
  // The licence of the app it installs, which may differ, as an SPDX
  // identifier or its name, such as "PostgreSQL" or "Sustainable Use License".
  string app_license = 9;
  // Where this entry came from.
  Source source = 10;
  // The Compose file it runs, as YAML, whose ${NAME}s are its inputs' names.
  // Each image is pinned by digest. It takes what ImportCompose takes.
  string compose = 11;
  // What it needs to know to install, in the order to ask.
  repeated Input inputs = 12;
  // The service a person opens once it's installed. Unset for an app with
  // nothing to open, such as a tunnel.
  Web web = 13;
  // What to do first once it runs, in one short sentence, where no field below
  // says it: the panel shows sign_in, first_visitor_owns, signups and
  // address_variables as state and actions, and never as words here. Empty when
  // there's nothing more to say, as for most entries.
  string first_steps = 14;
  // What it reaches on its server beyond its own containers, in words, such as
  // "The server's own network, to reach routes on loopback". A person approves
  // it in the plan, which says exactly what. Empty when it reaches nothing.
  string host_access = 15;
  // The services its Compose file runs that are databases the app keeps its data
  // in, by name, such as "db". A page names each as a database rather than an app.
  // Empty leaves that to the images Dockwell knows as databases.
  repeated string databases = 16;
  // What the app does and who it is for, in the catalog's own words. Plain
  // text, with blank lines between paragraphs; never HTML or Markdown.
  string description = 17;
  // The app's own logo, used to identify it. In an entry's file, a WebP, PNG or
  // JPEG image in the folder media beside it, as "media/ghost-icon.webp", or for
  // an entry built into Dockwell, a path under /catalog-media/. In the API, the
  // path the control plane serves it at, under /catalog-media/. Empty when no
  // artwork is available.
  string icon = 18;
  // Genuine previews of the app, with captions identifying what they show.
  // A command-line service need not have a screenshot.
  repeated Screenshot screenshots = 19;
  // The app's documentation, at an HTTPS address.
  string documentation = 20;
  // The app's source repository, distinct from the source of this entry.
  string app_source = 21;
  // A short list of things the app can do, in the catalog's own words.
  repeated string features = 22;
  // How a person signs in to what web opens, which the panel shows with the
  // password to reveal and copy, rather than says. Unset for an app with no
  // sign-in of its own, or whose first visitor makes the account.
  SignIn sign_in = 23;
  // The first person to open what web opens makes its owner account. The
  // panel says so on its page, and before a domain makes it public.
  bool first_visitor_owns = 24;
  // What closes sign-ups once the owner's account is made, for an app that lets
  // anyone who reaches it make one. The panel offers to close them.
  Signups signups = 25;
  // Variables a service builds its links or checks requests from, which follow
  // the domain added to what web opens, such as Ghost's url.
  repeated AddressVariable address_variables = 26;
  // What a person may want to know of the app as it runs here, a line each,
  // such as "Transcodes on the server's CPU". Never steps to follow.
  repeated string notes = 27;
  // Services of its Compose file the app runs without, such as Adminer beside
  // PostgreSQL, each a switch a person turns on or off as they install. The
  // install records which are on, an upgrade keeps that, and a person adds or
  // removes one later as a plan. Empty installs every service, as before. See
  // docs/adr/0076-optional-companions-in-a-catalog-entry.md.
  repeated Companion companions = 28;
  // What the app's catalog writes of it at length, as its README has it, in
  // Markdown: the panel shows its headings, paragraphs, lists, emphasis, code and
  // HTTPS links as text, and nothing else, never HTML or an image. 32 KiB at most.
  // Empty when its catalog keeps none. ListCatalogEntries leaves it out, as
  // GetCatalogEntry has it. Numbered in the block catalog sources' presentation
  // holds (ADR 0083).
  string readme = 30;
  // What it says in other languages, by the language's tag, such as "zh-CN", where
  // its catalog writes them: what a panel in that language shows in place of the
  // entry's own words, field by field, with an empty field reading as the entry's
  // own. Only the languages the panel speaks are kept. ListCatalogEntries leaves out
  // each one's description and readme, as GetCatalogEntry has them.
  map<string, Translation> translations = 31;
  // What the app reads from outside its own containers, such as a MySQL-compatible
  // database, each met as a person installs it: by a new one beside the app, by
  // one Dockwell runs already, or by a connection. Empty needs nothing, as before.
  // Numbered apart, as open work adds to this message. See
  // docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  repeated Need needs = 40;
}

// Need is something an app reads from outside its own containers, such as a
// database, by the names it sets in the app's environment.
message Need {
  // Its name in the entry, such as "db": lowercase letters, digits and dashes,
  // as a service's.
  string name = 1;
  // What people call it, such as "Database".
  string label = 2;
  // What meets it: any of these engines, each at the versions the app takes. At
  // least one.
  repeated NeedAccept accepts = 3;
  // The service of the entry's Compose file that meets it when a person takes a
  // new one, such as "db", which is one of databases and reads the need's names.
  // It's left out of the install when the need is met otherwise, with the
  // volumes and inputs only it uses. Empty: the entry brings none, and a new one
  // comes from the catalog's entry for the engine.
  string service = 4;
  // The database to make for it, such as "wordpress". Empty takes the need's
  // name, with underscores for dashes.
  string database = 5;
  // The user to make for it, who owns that database. Empty takes the
  // database's name.
  string user = 6;
  // The names it sets in the app's environment, which the Compose file uses as
  // ${NAME}, each a whole environment value. At least one.
  repeated NeedSet sets = 7;
  // The app keeps the password it installed with, as Nextcloud does in its
  // config.php, so setting it anew would leave the app with the old one: a
  // rotation of it is refused.
  bool set_once = 8;
}

// NeedAccept is an engine that meets a need, at the versions the app takes.
message NeedAccept {
  // The engine.
  Engine engine = 1;
  // The versions, as comparators on dotted numbers separated by spaces, such as
  // ">=8.0" or ">=10.6 <12". Empty takes any.
  string versions = 2;
}

// NeedSet is a name a need sets in the app's environment, and what it holds.
message NeedSet {
  // The name, as its Compose file uses it, such as "DB_HOST".
  string name = 1;
  // What it holds.
  Part part = 2;
  // How a URL is written, with {host}, {port}, {address}, {database}, {user} and
  // {password} where each goes, such as
  // "postgres://{user}:{password}@{host}:{port}/{database}?schema=public", and
  // {tls} where TLS goes, written as tls says. Each part is percent-encoded for
  // its place. Only for a URL; empty writes the engine's own form.
  string template = 3;
  // How the app reads whether to use TLS, for a TLS part or {tls} in a template:
  // its words for on and off, such as "require" and "disable" for libpq, or
  // "true" and "false" for node-postgres or Go's MySQL driver.
  NeedTls tls = 4;
}

// NeedTls is how an app reads whether to use TLS.
message NeedTls {
  // What it reads as on, such as "require".
  string on = 1;
  // What it reads as off, such as "disable".
  string off = 2;
}

// Engine is what runs a database, as Dockwell knows it (ADR 0038).
enum Engine {
  ENGINE_UNSPECIFIED = 0;
  // PostgreSQL.
  ENGINE_POSTGRESQL = 1;
  // MySQL, and Percona Server for MySQL through a connection.
  ENGINE_MYSQL = 2;
  // MariaDB.
  ENGINE_MARIADB = 3;
  // Redis.
  ENGINE_REDIS = 4;
  // Valkey.
  ENGINE_VALKEY = 5;
  // MongoDB.
  ENGINE_MONGODB = 6;
  // ClickHouse.
  ENGINE_CLICKHOUSE = 7;
}

// Part is what a name a need sets holds.
enum Part {
  PART_UNSPECIFIED = 0;
  // The host the app reaches it at, such as "db".
  PART_HOST = 1;
  // Its port, such as "3306".
  PART_PORT = 2;
  // The host and port together, such as "db:3306".
  PART_ADDRESS = 3;
  // The database's name. For Redis and Valkey, the number of the logical
  // database.
  PART_DATABASE = 4;
  // The user it signs in as.
  PART_USER = 5;
  // The user's password, kept as a secret.
  PART_PASSWORD = 6;
  // A URL with all of it, the password among it, kept as a secret.
  PART_URL = 7;
  // Whether to use TLS, in the app's own words, as the set's tls gives them.
  PART_TLS = 8;
  // A prefix the app puts before each key it keeps, on Redis or Valkey, such as
  // "shop:". Where a need sets one, an app sharing a server keeps to its own keys,
  // and reaches no other app's. Numbered in the block connectable apps hold, 40 to
  // 49. See docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  PART_KEY_PREFIX = 40;
}

// Translation is what an entry says in another language than its own, as its
// catalog writes it (ADR 0083).
message Translation {
  // What the app is for, in one line, as Entry.summary.
  string summary = 1;
  // What the app does and who it is for, as Entry.description: plain text.
  string description = 2;
  // Its README, in Markdown, as Entry.readme.
  string readme = 3;
}

// Companion is a service an app runs without, such as a database's admin tool,
// which a person installs only if they want it.
message Companion {
  // The service, by its name in the entry's Compose file, such as "adminer". No
  // other service depends on it, and it isn't one of the entry's databases.
  string service = 1;
  // What people call it, such as "Adminer".
  string label = 2;
  // What it's for, in a few words, such as "Browse and edit tables in your
  // browser".
  string purpose = 3;
  // It's installed unless a person turns it off. Unset, it's left out until a
  // person turns it on.
  bool on = 4;
  // The inputs it alone uses, by name, such as "ADMIN_PORT", which a form asks
  // for only while it's on. None of them is a secret.
  repeated string inputs = 5;
  // What a person may want to know of it as it runs here, a line each, which a
  // form shows only while it's on, such as "Choose PostgreSQL as Adminer's
  // system".
  repeated string notes = 6;
}

// SignIn is how a person signs in to an app once it's installed.
message SignIn {
  // The user, as the app's sign-in asks for it, such as "root". Empty when
  // user_input holds it.
  string user = 1;
  // The input that holds the user, such as "ADMIN_EMAIL".
  string user_input = 2;
  // The secret input that holds the password, such as
  // "MARIADB_ROOT_PASSWORD".
  string password_input = 3;
  // The server the sign-in asks for, where it asks, such as "db" for Adminer.
  string server = 4;
  // Where in the app a person changes the password, for an app that reads it
  // on its first start alone (the input's set_once), such as "Profile".
  string changed_in = 5;
}

// Signups is the variable that closes an app's sign-ups.
message Signups {
  // The service, by its name in the Compose file, such as "gitea".
  string service = 1;
  // The variable, such as "SIGNUPS_ALLOWED".
  string variable = 2;
  // What closes them, such as "false".
  string closed = 3;
}

// AddressVariable is a variable that follows the domain an app is reached at.
message AddressVariable {
  // The service, by its name in the Compose file, such as "ghost".
  string service = 1;
  // The variable, such as "url".
  string variable = 2;
  // What it's set to, with {domain} where the domain goes, such as
  // "https://{domain}", or a value of its own that goes with a domain, such
  // as "https" for Nextcloud's OVERWRITEPROTOCOL.
  string value = 3;
}

// Screenshot is a preview a person can read before starting an installation.
// Media comes with its catalog, and the control plane serves it; browsing never
// asks a third-party host for it.
message Screenshot {
  // A raster image, named as icon is.
  string path = 1;
  // What the screenshot shows, also used as its accessible description.
  string caption = 2;
  // Where the project published the original, at an HTTPS address.
  string source = 3;
}

// Source is where an entry came from.
message Source {
  // The repository, such as "https://github.com/Dockwell/dockwell".
  string repository = 1;
  // The file in it, such as "internal/catalog/entries/postgres.yaml".
  string path = 2;
  // The commit. An entry built into Dockwell takes the commit of its build.
  string commit = 3;
}

// Input is one thing an entry needs to know to install, named by the ${NAME}
// its Compose file uses.
message Input {
  // The name its Compose file uses, such as "ADMIN_PORT".
  string name = 1;
  // What a person reads above the field, such as "Admin port".
  string label = 2;
  // What a person reads below it, such as what it's for or where to find it.
  string hint = 3;
  // What it takes.
  InputType type = 4;
  // Its value unless someone gives another. Never a secret's: leave a secret
  // for a person to give, or set generate.
  string default_value = 5;
  // Takes no value: it's asked for, but the app runs without one.
  bool optional = 6;
  // How many characters to generate for a secret that no one types, such as 32.
  // The value is sealed as it's made, and nothing shows it but a reveal. 0 asks
  // a person for it. A person may still give one of their own, which is sealed
  // the same way, and must be what min_length, characters and generate_as say.
  uint32 generate = 7;
  // The app writes this secret in its own log, as Nginx Proxy Manager does with
  // its first password. Reading a log takes no passkey, so nothing may call it
  // sealed, and a person hears that before they apply.
  bool logged = 8;
  // How a generated secret is written, for an app that reads it as a key: letters
  // and digits unless set.
  GenerateAs generate_as = 80;
  // The fewest characters a value a person gives may have, where the app takes
  // no shorter one, such as 64 for a key it signs with. Unset, a person's own
  // value for a secret Dockwell generates takes at least 8, and anything else
  // any value. A secret the app decodes, by generate_as, takes exactly the form
  // it generates instead. Never more than generate, which Dockwell's own value
  // must meet.
  uint32 min_length = 81;
  // The characters a value a person gives may hold, where the app writes it into
  // something that reads some as its own, such as a URL. Unset is any printable
  // character on one line.
  Characters characters = 82;
  // The app reads this secret on its first start alone, or encrypts what it
  // keeps with it, so setting the secret anew changes nothing or loses what it
  // encrypted. The panel marks it, and says where to change it, if anywhere.
  bool set_once = 9;
}

// Characters are what a value a person gives may hold.
enum Characters {
  // Any printable character, on one line.
  CHARACTERS_UNSPECIFIED = 0;
  // Letters, digits and - . _ ~ alone, which a URL carries as they are, for a
  // secret the app writes into one, as Umami writes its database's password
  // into DATABASE_URL.
  CHARACTERS_URL_SAFE = 1;
}

// GenerateAs is how a generated secret is written.
enum GenerateAs {
  // Letters and digits, as many as generate says.
  GENERATE_AS_UNSPECIFIED = 0;
  // Hex digits, as many as generate says, as openssl rand -hex writes them.
  GENERATE_AS_HEX = 1;
  // As many random bytes as generate says, in standard base64 with its
  // padding, as openssl rand -base64 writes them, for an app that decodes its
  // key.
  GENERATE_AS_BASE64 = 2;
}

// InputType is what an input takes.
enum InputType {
  // Reads as text.
  INPUT_TYPE_UNSPECIFIED = 0;
  // A line of text.
  INPUT_TYPE_TEXT = 1;
  // An email address.
  INPUT_TYPE_EMAIL = 2;
  // A port on the server, from 1 to 65535. A default that something Dockwell
  // runs has taken moves on to the next one that's free.
  INPUT_TYPE_PORT = 3;
  // A value kept as one of the project's secrets, encrypted and used by
  // reference. Its ${NAME} must be a whole environment value, or a word of a
  // command or a health check, so that a rotation reaches the service. An app
  // that reads it on first start alone keeps what it read, which the input's
  // set_once says.
  INPUT_TYPE_SECRET = 4;
}

// Web says what a person opens once an entry is installed.
message Web {
  // The service, by its name in the entry's Compose file, such as "adminer".
  string service = 1;
}

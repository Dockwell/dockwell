syntax = "proto3";

package dockwell.agent.v1;

import "dockwell/resource/v1alpha1/specs.proto";
import "dockwell/v1/backup.proto";
import "dockwell/v1/build.proto";
import "dockwell/v1/change.proto";
import "dockwell/v1/container.proto";
import "dockwell/v1/database.proto";
import "dockwell/v1/domain.proto";
import "dockwell/v1/file.proto";
import "dockwell/v1/firewall.proto";
import "dockwell/v1/health.proto";
import "dockwell/v1/image.proto";
import "dockwell/v1/import.proto";
import "dockwell/v1/log.proto";
import "dockwell/v1/options.proto";
import "dockwell/v1/process.proto";
import "dockwell/v1/server.proto";
import "dockwell/v1/service_update.proto";
import "dockwell/v1/system.proto";
import "dockwell/v1/task.proto";
import "dockwell/v1/terminal.proto";
import "dockwell/v1/update.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// AgentService is how a server's agent talks to the control plane, over
// mTLS on the control plane's agent listener (ADR 0007). It is an internal
// protocol between dockwell binaries, not part of the public API, so the CLI
// and MCP generators skip it.
service AgentService {
  // Join spends a join ticket to give a new server its identity: the
  // control plane records the server and signs a certificate for the key in
  // the request. It is the only method callable without a client certificate.
  rpc Join(JoinRequest) returns (JoinResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
  }

  // RenewCertificate signs a fresh certificate for the calling server,
  // which proves itself with its current one.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
  }

  // Connect is the agent's long-lived stream. The agent opens it with a
  // hello and then reports samples; the control plane answers with a
  // welcome, and closes the stream if the server is removed. The control
  // plane also calls the agent's drivers over it, to plan, apply and
  // observe resources, and the agent answers each call with its result.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
  }

  // SendLogs carries the log lines of one LogsCall, which the agent opens on
  // a connection of its own for each one, so log lines share nothing with
  // Connect, which must never stall behind them. When the control plane
  // stops reading, as when its reader is slow, flow control stops the agent
  // sending, and the agent drops what it can't send, and says how many. See
  // docs/adr/0025-logs-per-deploy.md.
  rpc SendLogs(stream SendLogsRequest) returns (SendLogsResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
  }

  // Terminal carries one attachment of a terminal (AttachTerminalCall), which the
  // agent opens on a connection of its own for each one, as SendLogs does: what
  // the terminal prints goes up, and what's typed comes down. Flow control is the
  // backpressure, so a reader that's slow holds up this terminal's shell and
  // nothing else. See docs/adr/0037-a-terminal-on-a-server.md.
  rpc Terminal(stream TerminalRequest) returns (stream TerminalResponse) {
    option (dockwell.v1.effect) = EFFECT_DESTRUCTIVE;
  }

  // ReceiveFile carries what's uploaded for one WriteUploadCall, from the
  // control plane to the agent, which opens it on a connection of its own, as
  // SendLogs does, so a file shares nothing with Connect. Flow control bounds
  // what either side holds. See docs/adr/0045-a-file-manager-on-a-server.md.
  rpc ReceiveFile(ReceiveFileRequest) returns (stream ReceiveFileResponse) {
    option (dockwell.v1.effect) = EFFECT_APPLY;
  }

  // SendFile carries what's downloaded for one DownloadFileCall, from the
  // agent to the control plane, on a connection of its own.
  rpc SendFile(stream SendFileRequest) returns (SendFileResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
  }
  // Forward carries one connection to a port a service publishes on its server
  // (ForwardCall), which the agent opens on a connection of its own, as
  // Terminal does: the bytes from the service go up, and those to it come
  // down. Flow control is the backpressure. A person opens an app's web UI
  // this way, through the panel (ADR 0061).
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse) {
    option (dockwell.v1.effect) = EFFECT_READ;
  }
}

// ConnectRequest is one message from the agent.
message ConnectRequest {
  // What the message is.
  oneof message {
    // The first message on every stream.
    Hello hello = 1;
    // A sample of the server's resource use.
    dockwell.v1.ServerStats stats = 2;
    // The answer to a call from the control plane.
    CallResult result = 3;
    // The agent is moving to a new stream, as when its certificate was
    // renewed: it takes no more calls on this one, and refuses those that
    // arrive. It finishes the calls under way, and once the control plane
    // answers with Drained, ends the stream.
    Draining draining = 4;
    // How a call under way is going, such as an image being pulled.
    CallProgress progress = 5;
    // The kinds the agent can run changed since its hello, as when Docker
    // stopped or started.
    Kinds kinds = 6;
    // Where the certificates of the server's routes stand: all of them, when
    // the stream opens and whenever one changes.
    Domains domains = 7;
    // How the server's services are: all of them, when the stream opens,
    // whenever a state changes, and every so often while checks run.
    Health health = 8;
    // Something that held calls up on the agent ended: a step that outlived its
    // call, a call the agent left behind, or a server path that stopped
    // answering. What waited for it, such as a rollback, can go on, as when the
    // agent connects.
    Unstuck unstuck = 9;
    // A save left behind as it wrote has ended, as the control plane stopped
    // waiting for it. It says so on whichever stream is up by then.
    SaveEnded save_ended = 10;
    // What the server finds out of how the internet sees it, as the stream
    // opens, and again every few hours.
    Network network = 11;
    // How a build under way is going: where it stands, and the lines its log
    // gained. Numbered apart, as open work adds to this message.
    BuildUpdate build = 130;
    // A terminal ended, as its shell exited or it timed out, on whichever stream
    // is up then. The terminal's numbers in agent messages are 50 to 59.
    TerminalEnded terminal_ended = 50;
    // The agent's tasks have runs the control plane hasn't read (ADR 0053).
    // Numbered in the block scheduled tasks hold, as open work adds to this
    // message.
    TaskRunsReady task_runs_ready = 150;
    // What the agent did, or couldn't do, on its own while the control plane
    // was away, sent as its stream opens (ADR 0054).
    Reconciled reconciled = 163;
  }
}

// BuildUpdate is how a build on the server is going, sent as it moves on, and
// at most every 250 ms while it prints. See docs/adr/0046-builds-from-git.md.
message BuildUpdate {
  // The change the build is a step of.
  string change_id = 1;
  // The service it builds for.
  dockwell.v1.ResourceRef resource = 2;
  // Where it stands.
  dockwell.v1.BuildState state = 3;
  // The lines its log gained since the last update, oldest first, with the
  // build's secrets masked. Their numbers go on from the last update's.
  repeated dockwell.v1.BuildLine lines = 4;
  // How many lines the agent dropped since the last update, as the build wrote
  // faster than its stream may carry.
  int64 dropped = 5;
  // The commit's subject, once the checkout has read it.
  string commit_subject = 6;
  // The commit's author, by name, once the checkout has read it.
  string commit_author = 7;
  // How many steps the build has, once BuildKit has said.
  int32 steps = 8;
  // How many of its steps came from the cache.
  int32 cached_steps = 9;
  // The step it is on, or that failed, from 1.
  int32 step = 10;
  // What that step does, such as "RUN npm ci".
  string step_name = 11;
  // Why it failed, in plain words, with what to do.
  string error = 12;
  // The last line the failing step printed, with secrets masked.
  string failed_line = 13;
  // When it began building.
  google.protobuf.Timestamp start_time = 14;
  // When it ended.
  google.protobuf.Timestamp end_time = 15;
  // The image it makes.
  string image = 16;
  // What the build found as it read the commit: its Dockerfile, or what
  // Railpack makes of it. Sent once, before it builds.
  dockwell.v1.BuildDetection detection = 17;
}

// TaskRunsReady says a task's run started or ended, so the control plane reads
// the runs with a TaskRunsCall.
message TaskRunsReady {}

// TerminalEnded says how a terminal ended.
message TerminalEnded {
  // The terminal's ID.
  string id = 1;
  // What the control plane called its opening when it asked for it
  // (OpenTerminalCall.record), so it can put the end on record whoever's
  // listening.
  string record = 2;
  // How it ended.
  dockwell.v1.TerminalEnd end = 3;
  // When it opened, by this server's clock.
  google.protobuf.Timestamp opened = 4;
}

// Unstuck says something that held calls up on the agent ended.
message Unstuck {}

// SaveEnded says how a save came out, after nobody was waiting for it.
message SaveEnded {
  // What the control plane called the save, from its SaveFileCall.
  string record = 1;
  // Where it ended, with every symlink before it followed.
  string path = 2;
  // True when the file now holds what was saved.
  bool landed = 3;
  // Why it didn't, for people.
  string reason = 4;
  // True when the file is a way back onto the server.
  bool way_back_in = 5;
}

// Network is what a server can find out for itself beyond its interfaces. An
// agent always sends it, so its coming with no provider says none answered, where
// an agent from before this says nothing at all.
message Network {
  // Which cloud provider's metadata service answered, if any did. Anything on
  // the local network can answer at that address.
  dockwell.v1.CloudProvider provider = 1;
  // The public address that service gives, if it does. Oracle's doesn't.
  string metadata_address = 2;
  // The address a public STUN server saw the server's packets come from, if
  // one answered. Empty when turned off, or with UDP blocked, or when the
  // server has a public IPv4 address of its own and has no need to ask.
  string looked_up_address = 3;
  // When that lookup was made, on the server's clock.
  google.protobuf.Timestamp looked_up_time = 4;
  // Which cloud the machine itself says it runs on, from its firmware's tables.
  dockwell.v1.CloudProvider machine_provider = 5;
}

// Health is how each container of a server's services is, as far as anything
// checked.
message Health {
  // Each container, by project, service and number. Empty with scanned_at set
  // means the server runs none. With no scanned_at, the agent hasn't read Docker
  // yet, so it hasn't said what runs, only, with docker_unreadable_since, that
  // Docker hasn't answered it.
  repeated dockwell.v1.InstanceHealth instances = 1;
  // When the agent last read the list of containers from Docker, on the server's
  // clock.
  google.protobuf.Timestamp scanned_at = 2;
  // When it sent this, on the same clock, so the control plane can tell how old
  // something in it is without their clocks agreeing.
  google.protobuf.Timestamp reported_at = 3;
  // Since when it hasn't been able to read Docker, on the same clock: a list of
  // containers failed, and none has come since, or none has come yet, since the
  // agent started. Unset while it can.
  google.protobuf.Timestamp docker_unreadable_since = 4;
}

// Domains is where the certificate and DNS of each of a server's routes'
// domains stand.
message Domains {
  // Each domain, sorted.
  repeated dockwell.v1.DomainStatus domains = 1;
  // Where the server's ingress stands. Unset for a server with no routes.
  dockwell.v1.IngressStatus ingress = 2;
}

// CallProgress says how a call under way is going.
message CallProgress {
  // The call's ID.
  uint64 id = 1;
  // What is happening, for people, such as "Pulling nginx:1.27: 12 of 48
  // MB".
  string message = 2;
  // What the step found out on its server, which goes on record, sent as soon
  // as it is known, and always before the call's result.
  StepOutcome outcome = 3;
  // What the step is doing, as a phase beside message, such as pulling. Unset
  // from an older agent, and for what isn't one of the phases. Numbered apart,
  // as open work adds to this message (ADR 0080).
  dockwell.v1.StepPhase phase = 260;
  // How much of a pull is done, and how much it is in all, in bytes, while
  // phase is pulling and Docker has said. 0 otherwise.
  int64 done_bytes = 261;
  int64 total_bytes = 262;
}

// StepOutcome is what a step found out on its server.
message StepOutcome {
  // The image it leaves running, as its registry knows it.
  string digest = 1;
  // The digest of the image it replaces, where a pull found a newer one.
  string previous = 2;
  // True when a pull found a newer image, and the step is about to replace what
  // runs with it.
  bool replacing = 3;
  // What the step did, for people, where its usual words wouldn't be true, as
  // when it did nothing.
  string note = 4;
  // True when the step failed before it changed anything on the server, as a
  // pull that can't reach its registry does, so what ran there still runs.
  bool untouched = 5;
  // What the step did in the end, where that isn't what its plan says, as a pull
  // that found nothing newer did nothing.
  dockwell.v1.PlanAction did = 6;
  // The backup it took, for a step that takes one.
  BackupResult backup = 7;
  // What the step waits for, once a change to the firewall has loaded and
  // waits for its confirmation. Numbered in the server overview's block.
  AccessWait waits = 44;
}

// AccessWait is a change to the firewall that waits for its confirmation.
message AccessWait {
  // When the agent puts back the firewall as it was, unless confirmed first.
  google.protobuf.Timestamp deadline = 1;
  // The ports SSH listens on now, for the test the person runs first.
  repeated uint32 ssh_ports = 2;
  // How long there was until the deadline when the agent said it, so the
  // control plane counts down by its own clock, whatever the agent's.
  google.protobuf.Duration left = 3;
}

// Kinds lists the kinds of resource an agent can run now, and why it
// can't run the others it has drivers for.
message Kinds {
  // The kinds it can run, such as "container". The control plane plans no
  // other kind on this server.
  repeated string kinds = 1;
  // Kinds it has drivers for but can't run now, each with why.
  repeated UnavailableKind unavailable = 2;
}

// UnavailableKind is a kind an agent has a driver for, but can't run now.
message UnavailableKind {
  // The kind, such as "service".
  string kind = 1;
  // Why, for people, with how to fix it, such as "Docker isn't running on
  // this server. Start it with systemctl start docker".
  string reason = 2;
}

// Reconciled is what an agent did, or couldn't do, on its own while the control
// plane was away (ADR 0054), as its journal holds it. It holds no value and no
// spec.
message Reconciled {
  // What it did, oldest first.
  repeated LocalEntry entries = 1;
  // How many entries it dropped before these, as its journal keeps at most 500.
  uint32 dropped = 2;
  // The ID of the newest entry it dropped, which names the count, so the same
  // count sent again is one event.
  string dropped_to = 3;
}

// LocalEntry is one thing an agent did, or couldn't do, on its own.
message LocalEntry {
  // The boot's ID and a sequence, so it means one thing however often it's sent.
  string id = 1;
  // The resource.
  dockwell.v1.ResourceRef resource = 2;
  // What it did.
  LocalAction action = 3;
  // Why it couldn't, for people, for LOCAL_ACTION_WAITING.
  string reason = 4;
  // When.
  google.protobuf.Timestamp time = 5;
}

// LocalAction is what an agent did on its own.
enum LocalAction {
  LOCAL_ACTION_UNSPECIFIED = 0;
  // It made the resource again, as it was gone.
  LOCAL_ACTION_MADE = 1;
  // It started the resource, which Docker couldn't.
  LOCAL_ACTION_STARTED = 2;
  // It couldn't put the resource back, and waits for the control plane.
  LOCAL_ACTION_WAITING = 3;
}

// Heard says the control plane has what an agent did on its own, up to and
// including an entry, which the agent then drops, with the count of those it
// dropped before.
message Heard {
  // The last entry the control plane has. Empty when it was sent none.
  string last = 1;
}

// Draining says the agent takes no more calls on this stream.
message Draining {}

// Hello introduces the agent at the start of a stream.
message Hello {
  // The agent's build.
  dockwell.v1.BuildInfo build = 1;
  // What the server is, as the agent sees it now.
  dockwell.v1.ServerInventory inventory = 2;
  // The kinds of resource the agent can run, such as "container". The
  // control plane plans no other kind on this server.
  repeated string kinds = 3;
  // Kinds the agent has drivers for but can't run now, each with why, such
  // as every Docker kind on a server where Docker isn't running.
  repeated UnavailableKind unavailable = 4;
  // A public key for this stream alone, an X25519 key in its 32-byte form,
  // which the control plane seals the values of variables and secrets to
  // with HPKE (ADR 0022). The agent makes a new pair for every stream and
  // keeps the private key in memory only. An agent that sends none can't
  // run a service that uses a variable or a secret.
  bytes delivery_key = 5;
  // Says the agent writes a container's references (Container.references) in
  // as it makes the container. The control plane sends none to one that
  // doesn't say so, which would run ${NAME} as the words it is.
  bool writes_references = 6;
  // True when the agent refuses a save to what can let someone back onto the
  // server unless a passkey confirmed it. Only the agent can tell where a path
  // leads, so the control plane saves through no agent that doesn't.
  bool guards_ways_in = 7;
  // True when the agent makes a mount's missing server folder as the owner the
  // mount names (make_owner), by handle. The control plane plans no such mount on
  // an agent that doesn't say so, which would make it root's. Numbered in the
  // websites' block.
  bool makes_folders = 61;
  // True when the agent reads the server's package updates (ListUpdatesCall).
  // The terminal and updates take 50 to 59 in agent messages, as other work adds
  // to them at once: the terminal 50 to 52, and updates 53, so the next of either
  // takes 54.
  bool updates = 53;
  // True when the agent sends stats at the pace each Pace says, and says the
  // pace on each sample. One that doesn't is welcomed at the pace for
  // watching, and stays there, and the control plane says that pace on its
  // samples. Numbered apart, as open work adds to this message.
  bool follows_pace = 40;
  // True when the agent opens terminals (OpenTerminalCall). The terminal's
  // numbers in agent messages are 50 to 59.
  bool terminals = 50;
  // The terminals the agent has that the control plane hasn't heard the end of:
  // those still open, and those whose TerminalEnded hasn't gone yet. A control
  // plane that doesn't know one asks for it to be closed.
  repeated string open_terminals = 51;
  // True when the agent opens shells in containers (OpenTerminalCall.container),
  // and asks for a passkey for one that's as good as root. One that doesn't would
  // take a call for a container as one for the server, so the control plane sends it
  // none.
  bool container_terminals = 52;
  // True when the agent's proxy keeps out who a route's access doesn't let in,
  // and asks each private route what a stranger gets (ADR 0087). The control
  // plane plans no route with access on an agent that doesn't say so, which
  // would serve it to anyone. Private routes take 110 to 119 in agent messages.
  bool keeps_routes_private = 110;
  // True when the agent reads what 1Panel keeps on the server (ReadOnePanelCall).
  // The importer takes 180 to 189 in agent messages.
  bool reads_onepanel = 180;
  // True when the agent makes, moves, deletes and puts back files, each
  // with the care ADR 0045 says, a passkey where one is a way back in among
  // it. The control plane sends none of those calls to one that doesn't.
  // Numbered apart, as open work adds to this message.
  bool manages_files = 120;
  // True when the agent uploads and downloads files, in bounded chunks over
  // ReceiveFile and SendFile, as ADR 0045 says.
  bool transfers_files = 121;
  // True when a listing goes in name order a page at a time, and takes a name to
  // match (ListFilesCall's match and page). The control plane sends neither to one
  // that doesn't. The servers area takes 230 to 239 in agent messages.
  bool pages_listings = 230;
  // This boot of the server, as /proc/sys/kernel/random/boot_id names it, so a
  // reboot's step passes once the agent connects from another (ADR 0064). Empty
  // from an agent that doesn't reboot, which the control plane sends none.
  string boot_id = 231;
  // True when the agent acts on the server's system services as a server's
  // host plans and applies them (DesiredResource.unit), and reads its system
  // log (SystemLogCall). The control plane plans no action on a unit through
  // one that doesn't, which would ignore it (ADR 0082). Track S takes 280 to 289
  // in agent messages.
  bool acts_on_units = 282;
  // True when the agent changes a database's first user's password in the
  // database as its service restarts with a new one (ADR 0038), so the control
  // plane plans a new one only through an agent that does. Catalog and
  // databases work takes 200 to 202 and 220 to 229 in agent messages.
  bool first_passwords = 200;
  // True when the agent checks that a backup restores, in a container and a
  // volume it throws away (ADR 0068). The control plane sends no DrillBackupCall
  // to one that doesn't. Catalog and databases work takes 200 to 202 and 220 to
  // 229 in agent messages.
  bool drills = 221;
  // True when the agent carries a connection to a port a service publishes
  // (ForwardCall), so the panel opens an app's web UI through it (ADR 0061).
  bool forwards = 202;
  // True when the agent signs in to a registry with a login it's sent
  // (registry_auth), only at the registry's host and the token service the login
  // was saved with (ADR 0086). The control plane sends no login to one that
  // doesn't, which would pull without it. Numbered in the block registry logins
  // hold, 310 to 319.
  bool registry_logins = 314;
  // True when the agent hands a build's BuildKit the registry logins it's sent
  // (DesiredResource.build_registry_auths), so its base images pull with them
  // (ADR 0086). The control plane sends a build none through one that doesn't.
  // Numbered in the block registry logins hold, 310 to 319.
  bool build_logins = 316;
  // True when the agent reads what Coolify or Dokploy runs on the server, from
  // Docker and the panel's folders (ReadPanelCall). Importing from them takes 330
  // to 339 in agent messages (ADR 0089).
  bool reads_panels = 330;
  // True when the agent stops and starts the own containers and services of
  // Coolify or Dokploy as a step of a change (DesiredResource.panel).
  bool stops_panels = 332;
  // What the agent keeps of what its server should run (ADR 0054), so the
  // control plane sends what it lacks. An agent that sends none keeps nothing,
  // and is sent nothing to keep.
  DesiredHeld desired = 160;
  // True when the agent sets what a container asks of itself: its hostname, an
  // init, a terminal, its input kept open, its stop signal, its limits, a
  // read-only filesystem, a most of processes, its DNS servers and
  // no-new-privileges (Container 90 to 99, ADR 0085). The control plane plans none
  // of them on an agent that doesn't say so, which would leave them out. Other
  // stores' work takes 300 to 309 in agent messages.
  bool own_settings = 300;
  // True when the agent joins a database shared with an app to the app's link
  // network in place, and again as it makes the database's container anew (ADR
  // 0084), so the control plane links an app to a database of another project
  // only on a server whose agent does. Connectable apps take 290 to 299 in agent
  // messages.
  bool links = 290;
  // True when the agent writes the files a container mounts (Mount.file), and
  // binds them in, read-only (ADR 0085). The control plane plans no such mount on
  // an agent that doesn't say so.
  bool writes_files = 301;
  // True when the agent gives a volume's empty folder the owner its mount names
  // (Mount.make_owner on a volume, ADR 0085). The control plane plans no such mount
  // on an agent that doesn't say so, which would leave the folder root's.
  bool owns_volumes = 302;
  // True when the agent serves the certificates the control plane proves by
  // DNS-01 (put_certificates, ADR 0088). The control plane gives one that doesn't
  // none, and its routes get their certificates from Caddy, as before. Numbered in
  // the block DNS-01 holds, 320 to 329.
  bool loads_certificates = 321;
}

// DesiredHeld is what an agent keeps of what its server should run.
message DesiredHeld {
  // Each resource it keeps, at the revision it keeps.
  repeated HeldResource held = 1;
  // How many records it found it couldn't open as it started: torn, edited,
  // another server's, or of a format it doesn't know. It acts on none of them,
  // and can't tell which resources they were.
  uint32 damaged = 2;
  // Names this cache, derived from its key, so it changes when the key does: a
  // control plane that hears a new one says so as it sends the cache what it
  // lacks, as after a reinstall, or another holder of the server's identity.
  string cache = 3;
}

// HeldResource is one resource an agent keeps.
message HeldResource {
  // The resource.
  dockwell.v1.ResourceRef resource = 1;
  // The revision it keeps.
  int64 revision = 2;
}

// ConnectResponse is one message from the control plane.
message ConnectResponse {
  // What the message is.
  oneof message {
    // The answer to a hello.
    Welcome welcome = 1;
    // A call for the agent to make with its drivers.
    Call call = 2;
    // Stops a call the control plane no longer waits for.
    CancelCall cancel = 3;
    // The answer to Draining: the control plane sends no more calls on this
    // stream. Every call it sent before arrives first, so the agent has
    // answered each one, if only with a refusal, by the time it ends the
    // stream.
    Drained drained = 4;
    // The server's public address as the control plane knows it: as the
    // stream opens and whenever that changes.
    PublicAddress public_address = 5;
    // How often to send stats from now on, as whether anyone is watching
    // changes, to an agent whose hello says it follows a pace. Numbered apart,
    // as open work adds to this message.
    Pace pace = 40;
    // Says the control plane has what the agent sent of what it did on its own.
    Heard heard = 164;
  }
}

// Pace says how often the agent sends stats: often while someone watches, and
// only as often as its stream needs to stay open while nobody does. See
// docs/adr/0040-a-servers-live-use.md.
message Pace {
  // How often to send stats. The agent sends one at once when this is sooner
  // than it was, so whoever just started watching sees a new sample.
  google.protobuf.Duration stats_interval = 1;
}

// PublicAddress is what the control plane knows of a server's public addresses,
// so the agent's words and its reading of DNS use them.
message PublicAddress {
  // Each address known beyond the server's interfaces, at most one of each
  // family. One on an interface isn't here, as the agent has it.
  repeated KnownAddress addresses = 1;
  // True when the server is behind carrier-grade NAT, with no way in known.
  bool carrier_nat = 2;
  // The cloud the machine says it's on, which tells the agent whose firewall to
  // name when a connection fails.
  dockwell.v1.CloudProvider provider = 3;
}

// KnownAddress is one public address of a server.
message KnownAddress {
  // The address.
  string address = 1;
  // True when it's known to be a way in. Without that, a record that points
  // somewhere else may still be right, and one that points here is named with a
  // caveat.
  bool way_in = 2;
}

// Drained says the control plane sends no more calls on this stream.
message Drained {}

// Welcome accepts an agent's stream.
message Welcome {
  // The name the control plane knows the server by.
  string server_name = 1;
  // How often the agent should send stats, until a Pace says otherwise. An
  // agent that doesn't follow a pace hears the pace for watching.
  google.protobuf.Duration stats_interval = 2;
}

// JoinTicket is what `dockwell join` takes, encoded as "dwj1." followed by
// the message in unpadded base64url. It carries everything a new server
// needs to find and trust the control plane, so adding a server is one paste.
message JoinTicket {
  // The control plane's agent endpoint, such as "https://203.0.113.7:7443".
  string control_url = 1;
  // The control plane CA's public key, "sha256:<hex>", so the first
  // connection is verified without a copy of the CA certificate.
  string ca_pin = 2;
  // The join token to spend.
  string token_id = 3;
  // The token's secret. Only its hash is stored on the control plane.
  bytes secret = 4;
  // Where else to try, in order, when control_url can't be reached: the control
  // server's private address, for a server on its own network, behind a public
  // address it can't come back in on.
  repeated string other_urls = 5;
}

// JoinRequest asks to join with a join token.
message JoinRequest {
  // The join token to spend, from the ticket.
  string token_id = 1;
  // The token's secret, from the ticket.
  bytes secret = 2;
  // A PKCS #10 certificate request (DER) for the key the agent made. Only
  // its public key is used.
  bytes csr = 3;
  // The server's hostname, used to name it. The control plane makes the
  // name unique if another server has it.
  string hostname = 4;
  // The agent's build.
  dockwell.v1.BuildInfo build = 5;
}

// JoinResponse gives a server its identity.
message JoinResponse {
  // The new server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
  string server_id = 1;
  // The name the server is known by, such as "hz-2".
  string server_name = 2;
  // The server's certificate (DER), valid for a short time and renewed by
  // the agent.
  bytes certificate = 3;
  // The control plane's CA certificate (DER), which the agent trusts from
  // now on.
  bytes ca_certificate = 4;
}

// RenewCertificateRequest asks for a fresh certificate.
message RenewCertificateRequest {
  // A PKCS #10 certificate request (DER). The agent may keep its key or
  // send a new one.
  bytes csr = 1;
}

// RenewCertificateResponse carries the fresh certificate.
message RenewCertificateResponse {
  // The server's new certificate (DER).
  bytes certificate = 1;
}

// Call asks the agent to plan, apply or observe with its drivers. The agent
// answers each call with a CallResult of the same ID, and may answer calls
// in any order.
message Call {
  // Names the call on this stream, so its result can be matched to it.
  uint64 id = 1;
  // How long the call may take, from when the agent receives it. It is a
  // duration rather than a deadline, so a server whose clock is off still
  // gets the time it was given.
  google.protobuf.Duration timeout = 2;
  // What to do.
  oneof call {
    // Compare resources with what the server has, and judge each step.
    PlanCall plan = 3;
    // Carry out a step and verify the result.
    ApplyCall apply = 4;
    // Read resources as the server has them.
    ObserveCall observe = 5;
    // List the containers a service has logs from.
    LogSourcesCall log_sources = 6;
    // Read a service's logs, over SendLogs. It has no timeout, as following
    // lasts until the reader leaves, and it ends when the stream does.
    LogsCall logs = 7;
    // Says which services' kept logs are out of reach.
    ForgottenCall forgotten = 8;
    // List the containers Docker has.
    ContainersCall containers = 9;
    // List a directory on the server.
    ListFilesCall list_files = 10;
    // Read a file on the server.
    ReadFileCall read_file = 11;
    // Save a file on the server.
    SaveFileCall save_file = 12;
    // Read a container as the spec of a service that takes it on.
    AdoptionCall adoption = 13;
    // Say what backing up a volume would do. Numbered apart, as open work adds
    // to this message.
    BackupPreviewCall backup_preview = 20;
    // Back up a volume. It has as long as it takes, and ends with the stream.
    BackupCall backup = 21;
    // Remove a backup from the disk.
    DeleteBackupCall delete_backup = 22;
    // Bring a backup back from where it was sent.
    FetchBackupCall fetch_backup = 23;
    // Send a backup that's on the server to its destination.
    SendBackupCall send_backup = 24;
    // Check that a backup on the server restores (ADR 0068).
    DrillBackupCall drill_backup = 220;
    // Say which package updates wait on the server. The terminal and updates take
    // 50 to 59 in agent messages: the terminal 50 to 52, and updates 53, so the
    // next of either takes 54.
    ListUpdatesCall list_updates = 53;
    // Say what each of the server's databases says of itself. Numbered apart, as
    // open work adds to this message.
    DatabaseCall database = 30;
    // Read what filters the server's inbound traffic, changing nothing. Numbered
    // in the block for a server's own pages.
    FirewallCall firewall = 43;
    // Keeps a change to the firewall that waits for its confirmation.
    ConfirmAccessCall confirm_access = 44;
    // Read how SSH lets people in, changing nothing.
    SshCall ssh = 46;
    // Read fail2ban's jails and bans, changing nothing.
    Fail2banCall fail2ban = 47;
    // Ask whether what a website sends to answers, from the server. Numbered in
    // the websites' block, as open work adds to this message.
    ProbeCall probe = 60;
    // Stop a build under way. Numbered apart, as open work adds to this
    // message.
    CancelBuildCall cancel_build = 130;
    // Reads how a commit would build, building nothing.
    DetectBuildCall detect_build = 131;
    // Say what takes the room on the disk that holds Docker's data. Numbered
    // apart, as open work adds to this message.
    DiskUseCall disk_use = 40;
    // List what runs on the server, process by process.
    ProcessesCall processes = 41;
    // End a process.
    EndProcessCall end_process = 42;
    // Start a shell. The terminal's numbers in agent messages are 50 to 59.
    OpenTerminalCall open_terminal = 50;
    // Carry a terminal's bytes over Terminal, until the attachment ends.
    AttachTerminalCall attach_terminal = 51;
    // Hang up a terminal's shell.
    CloseTerminalCall close_terminal = 52;
    // Reads the scheduled tasks' runs since the last read (ADR 0053). Numbered in
    // the block scheduled tasks hold, as open work adds to this message.
    TaskRunsCall task_runs = 150;
    // Runs a scheduled task now.
    RunTaskCall run_task = 151;
    // Read what 1Panel keeps on the server. The importer takes 180 to 189.
    ReadOnePanelCall read_onepanel = 180;
    // Read an image from its registry, for a form. Reading images takes 200 to
    // 209 (ADR 0062).
    ImageCall image = 200;
    // Say what holds some ports on the server, for a form. Ports take 210 to 219.
    PortsCall ports = 210;
    // Carry a connection to a port a service publishes, over Forward (ADR
    // 0061). Catalog and databases work takes 220 to 229.
    ForwardCall forward = 221;
    // Make an empty file or a folder. Numbered apart, as open work adds to
    // this message.
    MakeFileCall make_file = 120;
    // Move or rename a file or a folder.
    MoveFileCall move_file = 121;
    // Delete a file or a folder, to Recently deleted or for good.
    DeleteFileCall delete_file = 122;
    // List what's in Recently deleted.
    ListDeletedCall list_deleted = 123;
    // Put back what was deleted.
    RestoreFileCall restore_file = 124;
    // Delete for good what's in Recently deleted.
    PurgeDeletedCall purge_deleted = 125;
    // Start an upload, or say how far one got.
    BeginUploadCall begin_upload = 126;
    // Write what's uploaded, from ReceiveFile.
    WriteUploadCall write_upload = 127;
    // Put what was uploaded in place, and unpack it if it was asked to.
    FinishUploadCall finish_upload = 128;
    // Send a file, or a folder as an archive, over SendFile.
    DownloadFileCall download_file = 129;
    // Has the agent keep what its server runs, as its desired state.
    RememberCall remember = 161;
    // List the server's system services (ADR 0067). This area's block is 230
    // to 239.
    SystemServicesCall system_services = 235;
    // Read the server's system log back, a page at a time, narrowed to a unit
    // and a level (ADR 0082).
    SystemLogCall system_log = 281;
    // Sign in at a registry with a login, saving nothing (ADR 0086). Numbered in the
    // block registry logins hold, 310 to 319.
    CheckRegistryLoginCall check_registry_login = 313;
    // Serve these certificates, which the control plane proved by DNS-01 for this
    // server's routes, and no others it gave before (ADR 0088). Numbered in the
    // block DNS-01 holds, 320 to 329.
    PutCertificatesCall put_certificates = 320;
    // Read what Coolify or Dokploy runs on the server (ADR 0089).
    ReadPanelCall read_panel = 331;
    // Say what's newer than an image the server runs (ADR 0079). Knowing an
    // app's updates takes 250 to 259.
    ImageUpdatesCall image_updates = 250;
  }
}

// ProbeCall asks whether something answers, from the server, as a website's
// traffic would find it: a port on the server, as the ingress dials it, or a URL,
// as a website's web server sends to it. It reads nothing of what answers but its
// status line, and sends to no link-local address.
message ProbeCall {
  oneof target {
    // A TCP port on the server's loopback, as a route to a port dials it.
    uint32 port = 1;
    // An http or https URL, asked with a GET that follows no redirect.
    string url = 2;
  }
}

// FirewallCall asks what filters the server's inbound traffic. The agent reads
// ufw, firewalld and nftables with their own commands, and Docker's published
// ports, and changes nothing.
message FirewallCall {}

// SshCall asks how SSH lets people in: the values sshd says are in effect, with
// sshd -T, and the files that set them (ADR 0052).
message SshCall {}

// Fail2banCall asks what fail2ban does: whether it's there and running, its
// jails, and the addresses banned now, through fail2ban-client (ADR 0052).
message Fail2banCall {}

// ConfirmAccessCall confirms a change to the firewall that waits on this server
// for its confirmation, so the agent keeps it, rather than put back what was
// there when its timer runs out (ADR 0052).
message ConfirmAccessCall {
  // The change.
  string change_id = 1;
}

// ConfirmAccessResult says what came of a confirmation.
message ConfirmAccessResult {
  // What the agent did.
  AccessVerdict verdict = 1;
}

// AccessVerdict is what came of a change to the firewall under its timer.
enum AccessVerdict {
  ACCESS_VERDICT_UNSPECIFIED = 0;
  // Confirmed before its timer ran out, and kept. The agent recorded it on
  // disk before it said so.
  ACCESS_VERDICT_KEPT = 1;
  // Its timer ran out first, or the agent restarted, and the agent put back
  // the firewall as it was last confirmed.
  ACCESS_VERDICT_ROLLED_BACK = 2;
  // No such change waits on this server, and the agent knows of none.
  ACCESS_VERDICT_NOT_WAITING = 3;
  // The change still waits: the agent couldn't keep it just now, as it couldn't
  // write what its revert would load once kept. Its timer goes on, and the
  // confirmation may be sent again.
  ACCESS_VERDICT_NOT_KEPT = 4;
}

// ProcessesCall asks what runs on the server. CPU covers the time since the last
// such call, which the agent forgets 30 s after it, so nothing is read or held
// while nobody watches.
message ProcessesCall {}

// ProcessesResult is what runs on the server.
message ProcessesResult {
  // What runs.
  dockwell.v1.ProcessList list = 1;
}

// PutCertificatesCall is every certificate the control plane proved by DNS-01 that
// this server's routes are served with (ADR 0088). One the agent loaded before and
// isn't given now goes.
message PutCertificatesCall {
  // Each certificate's chain and key, in PEM, sealed to this stream's delivery key,
  // as a step's values are: "<id>.chain" and "<id>.key".
  bytes sealed = 1;
  // The certificates, by ID, with the names each covers.
  repeated PutCertificate certificates = 2;
}

// PutCertificate is one certificate a server serves.
message PutCertificate {
  // The certificate's ID, crt_….
  string id = 1;
  // The names it covers, such as "*.example.com" and "example.com".
  repeated string names = 2;
}

// PutCertificatesResult says what the agent serves now.
message PutCertificatesResult {
  // How many certificates it loaded into the ingress, which is none on a server
  // with no routes: they're loaded as its first comes.
  int32 loaded = 1;
}

// CheckRegistryLoginCall asks the agent to sign in at a registry, as its pull would,
// and save nothing.
message CheckRegistryLoginCall {
  // The login, sealed to this stream's delivery key as a step's values are.
  bytes registry_auth = 1;
  // True for a login as typed, not yet saved, which may go to the token service
  // the registry names, wherever that is; the answer says where. A saved login goes
  // only to the one it was saved with.
  bool first = 2;
  // A registry's host to ask /v2/ of with no login, in place of registry_auth:
  // whether it's a registry, and what it asks of a client. Nothing signs in.
  string probe = 3;
}

// CheckRegistryLoginResult says how a registry answered a login.
message CheckRegistryLoginResult {
  dockwell.v1.RegistryLoginState state = 1;
  // The host the registry sent the client to for a token, or empty.
  string token_host = 2;
  // The registry's own words, in a line.
  string detail = 3;
}

// SystemServicesCall asks for the server's system services, read now with its
// init system's own tools, on a runner of their own so a firewall change
// waiting on its confirm timer holds up no list (ADR 0067). The agent keeps
// nothing of it after.
message SystemServicesCall {}

// SystemServicesResult is the server's system services.
message SystemServicesResult {
  // Its services.
  dockwell.v1.SystemServiceList list = 1;
}

// SystemLogCall asks for a page of the server's system log, newest first: its
// journal, or /var/log/messages where it keeps none (ADR 0082).
message SystemLogCall {
  // Only what this unit wrote, by its name; empty reads everything. It goes to
  // journalctl as --unit=NAME, never as a match.
  string unit = 1;
  // Only lines at this level or worse; unset reads every level.
  dockwell.v1.LogLevel level = 2;
  // Lines older than the one at this cursor; empty reads the newest.
  string before = 3;
  // How many lines, at most, 1 to 200.
  uint32 limit = 4;
  // Only lines whose message holds this text, in any case.
  string query = 5;
  // Only lines written at or after this time.
  google.protobuf.Timestamp since = 6;
  // Only lines written before this time.
  google.protobuf.Timestamp until = 7;
}

// SystemLogResult is a page of the server's system log.
message SystemLogResult {
  // The lines, newest first.
  repeated dockwell.v1.SystemLogLine lines = 1;
  // True when there are older lines.
  bool more = 2;
  // Where they were read from.
  dockwell.v1.SystemLogSource source = 3;
  // How far back a search looked, when it stopped at its bound before since or
  // the oldest line: the oldest line it read.
  google.protobuf.Timestamp searched_to = 4;
  // True when a search stopped at its bound, so older lines may match.
  bool cut_short = 5;
}

// EndProcessCall ends a process: SIGTERM, then SIGKILL 10 s later if it's still
// there. The agent refuses a process that isn't the one named, as its PID went to
// another, and what Dockwell needs.
message EndProcessCall {
  // The process ID.
  uint32 pid = 1;
  // When it started, in clock ticks after boot.
  uint64 start_ticks = 2;
}

// EndProcessResult says how it went.
message EndProcessResult {
  // True when it took SIGKILL.
  bool killed = 1;
  // The process as it was before it ended, for the record: its PID, name,
  // command, user and container. Its numbers are unset.
  dockwell.v1.Process process = 2;
}

// DiskUseCall asks what takes the room on the disk that holds Docker's data.
// An agent answers from what it added up in the last 30 s, if it did.
message DiskUseCall {}
// TaskRunsCall reads the runs an agent's scheduled tasks have had since the
// control plane last read them. The agent keeps each run until a read past it,
// up to 100 for each task.
message TaskRunsCall {
  // Where the last read ended, which the agent may let go of runs up to. Empty
  // reads all it has.
  string after = 1;
}

// TaskRunsResult is what the agent's tasks ran.
message TaskRunsResult {
  // Each run that started or ended since after, oldest first, with what it
  // printed: a running one, and again when it ends, under the same ID.
  repeated AgentTaskRun runs = 1;
  // Where this read ended, for the next.
  string cursor = 2;
  // More are waiting past these.
  bool more = 3;
  // How many runs the agent let go of before they were read, as it keeps 100 for
  // each task.
  int64 dropped = 4;
}

// AgentTaskRun is one run, and the task it's of.
message AgentTaskRun {
  // The task.
  dockwell.v1.ResourceRef task = 1;
  // The run. Its task and server fields are the control plane's to fill in.
  dockwell.v1.TaskRun run = 2;
}

// RunTaskCall runs a task now, whether or not it's paused.
message RunTaskCall {
  dockwell.v1.ResourceRef task = 1;
}

// RunTaskResult is the run, started.
message RunTaskResult {
  dockwell.v1.TaskRun run = 1;
}

// OpenTerminalCall starts root's login shell on the server, or the first shell a
// container has, in it.
message OpenTerminalCall {
  // The terminal's ID, which the control plane gives it.
  string id = 1;
  // Its width, in characters.
  uint32 columns = 2;
  // Its height, in lines.
  uint32 rows = 3;
  // What the control plane calls its opening, which TerminalEnded hands back.
  string record = 4;
  // A container, by name or full ID, to open a shell in, in place of the server's.
  string container = 5;
  // True when a passkey confirmed opening a shell in container, which one that's as
  // good as root on the server takes.
  bool confirmed = 6;
}

// OpenTerminalResult is the terminal, running.
message OpenTerminalResult {
  // Who it runs as and where, such as "root@hz-1".
  string title = 1;
  // When it opened, by this server's clock.
  google.protobuf.Timestamp opened = 2;
  // True when the container is as good as root on the server and no passkey
  // confirmed it, so nothing was opened.
  bool needs_step_up = 3;
  // For a shell in a container, the container the call named, exactly, as Docker
  // has it: its full ID and its name. Set with needs_step_up too.
  string container_id = 4;
  string container_name = 5;
}

// AttachTerminalCall has the agent open Terminal for a terminal, and carry its
// bytes over it until the attachment ends: the control plane cancels the call, the
// stream drops, the terminal ends, or another attachment takes its place.
message AttachTerminalCall {
  // The terminal's ID.
  string id = 1;
  // Names the call's Terminal stream.
  uint64 stream = 2;
  // The first byte of what the terminal printed to send.
  uint64 offset = 3;
  // Its width now, to set as the attachment starts. 0 leaves it.
  uint32 columns = 4;
  // Its height now. 0 leaves it.
  uint32 rows = 5;
}

// AttachTerminalResult says why an attachment ended.
message AttachTerminalResult {
  // True when another attachment took its place.
  bool moved = 1;
  // How the terminal ended, when it did.
  dockwell.v1.TerminalEnd end = 2;
}

// CloseTerminalCall hangs up a terminal's shell.
message CloseTerminalCall {
  // The terminal's ID.
  string id = 1;
  // Why, as the control plane knows it.
  dockwell.v1.TerminalEndReason reason = 2;
}

// CloseTerminalResult says how the terminal ended.
message CloseTerminalResult {
  dockwell.v1.TerminalEnd end = 1;
}

// ForwardCall has the agent connect to the port a service publishes for one of
// its container's ports, on this server, and carry the connection's bytes over
// Forward until either end closes, or the control plane cancels the call. The
// agent finds the service's running container, and where Docker publishes that
// port, itself: it dials nothing a call names by address.
message ForwardCall {
  // The service's Compose project, as its containers' labels name it.
  string project = 1;
  // The service, by name.
  string service = 2;
  // The port in its container, such as 80, which the container publishes.
  uint32 port = 3;
  // Names the call's Forward stream.
  uint64 stream = 4;
}

// ForwardResult says how a forward ended.
message ForwardResult {
  // How many bytes went each way.
  uint64 sent = 1;
  uint64 received = 2;
}

// ForwardRequest is one message of Forward from the agent.
message ForwardRequest {
  // The call's stream, on the first message.
  uint64 stream = 1;
  // What the service sent.
  bytes data = 2;
  // True once the service has closed its side.
  bool closed = 3;
}

// ForwardResponse is one message of Forward from the control plane.
message ForwardResponse {
  // What to send the service.
  bytes data = 1;
  // True once the client has closed its side.
  bool closed = 2;
}

// TerminalRequest is one message of Terminal from the agent.
message TerminalRequest {
  // The call's stream, on the first message.
  uint64 stream = 1;
  // Where data starts, in all the terminal has printed.
  uint64 offset = 2;
  // What it printed.
  bytes data = 3;
  // How much of what's been typed the terminal has taken, in all: on the first
  // message, and after each TerminalResponse that typed something, in answer.
  uint64 input_offset = 4;
  // True when this answers a TerminalResponse, so input_offset is set.
  bool taken = 5;
}

// TerminalResponse is one message of Terminal from the control plane.
message TerminalResponse {
  // Where data starts in all that's been typed.
  uint64 offset = 1;
  // What's typed. The agent answers each message with input_offset.
  bytes data = 2;
  // The terminal's width, to change it. 0 leaves it.
  uint32 columns = 3;
  // Its height. 0 leaves it.
  uint32 rows = 4;
}

// RememberCall gives an agent what one resource on its server should be, from
// its latest revision placed and applied there, for the agent to keep while the
// control plane is away (ADR 0054), or has it forget one its server no longer
// runs. It changes nothing on the server. The control plane sends it as an agent
// connects, for each resource the agent doesn't keep at that revision, and each
// it keeps that isn't placed there.
message RememberCall {
  // The resource, its spec and its scope's name, as a step's are. With no spec,
  // the agent forgets the resource, if it keeps it at deploy's revision, the
  // one the control plane saw: a step since then has the say.
  DesiredResource desired = 1;
  // The revision, and the change that made it.
  Deploy deploy = 2;
  // The values of the variables and secrets the spec uses, sealed as an
  // ApplyCall's are. Unset when it uses none.
  bytes values = 3;
  // What the image the resource runs is called in its registry, as name@digest,
  // as the control plane kept it when the step ran, for an agent that can't see
  // the image on the server, as when its container is gone.
  string image_digest = 4;
}

// RememberResult answers a RememberCall.
message RememberResult {
  // False when the agent kept what it had: a later revision, as of a step that
  // ended after its stream did, or a deletion at or above it. For a forget, false
  // when it no longer held the resource at that revision.
  bool kept = 1;
}

// AdoptionCall asks what a container would be as a service. It reads the
// container, environment and all, and changes nothing.
message AdoptionCall {
  // The container, by its full ID.
  string container = 1;
  // The service it would be.
  dockwell.v1.ResourceRef resource = 2;
}

// BackupPreviewCall asks what backing up a volume would do.
message BackupPreviewCall {
  // The volume.
  dockwell.v1.ResourceRef volume = 1;
}

// BackupCall asks to back up a volume.
message BackupCall {
  // The backup's ID.
  string id = 1;
  // The volume.
  dockwell.v1.ResourceRef volume = 2;
  // Stop what runs on the volume for an exact copy, and start it again after.
  bool stop = 3;
}

// ListUpdatesCall asks which package updates wait, read with the server's own
// package manager. See docs/adr/0043-package-updates-on-a-server.md.
message ListUpdatesCall {
  // Refresh the package lists first when they're more than a day old.
  bool refresh = 1;
  // Refresh them first whatever their age, as a person asked.
  bool force = 2;
}

// ListUpdatesResult is what the package manager said. The agent sets neither
// checking nor error: those are the control plane's.
message ListUpdatesResult {
  dockwell.v1.ServerUpdates updates = 1;
}

// PortsCall asks what holds some ports on the server, as its kernel and Docker
// say, for a form that offers a free one.
message PortsCall {
  repeated dockwell.v1.ServerPortAsk ports = 1;
}

// PortsResult says what holds each port asked, in the order asked.
message PortsResult {
  repeated dockwell.v1.ServerPortHeld ports = 1;
}

// ImageCall reads an image from its registry, through the server's network and
// mirrors, for a form: Docker Hub's search, a repository's tags, or one image.
// Nothing is pulled. See docs/adr/0062-reading-an-image-from-its-registry.md.
message ImageCall {
  // What to read. The requests' environment and project are the control
  // plane's, and the agent reads neither.
  oneof ask {
    dockwell.v1.SearchImagesRequest search = 1;
    dockwell.v1.ListImageTagsRequest tags = 2;
    dockwell.v1.GetImageRequest image = 3;
    // The digests of images, as a plan pins them. Numbered in the block the catalog
    // formats work holds (ADR 0078).
    ImageDigestsCall digests = 270;
  }
  // The registry login the read signs in with, sealed as a step's values are
  // (ADR 0086). Numbered in the block registry logins hold, 310 to 319.
  bytes registry_auth = 312;
}

// ImageDigestsCall asks for the digests images' tags point at now, each with a HEAD
// of its manifest, which no registry counts as a pull, through the same reader and
// the same short-lived digests as a form's reads (ADR 0062).
message ImageDigestsCall {
  // The images, such as "nginx:1.27", 20 at most.
  repeated string references = 1;
}

// ImageDigests is what an ImageDigestsCall found, in the order it asked.
message ImageDigests {
  repeated ImageDigest digests = 1;
}

// ImageDigest is one image's digest, or why it has none.
message ImageDigest {
  // The image, as asked.
  string reference = 1;
  // How its registry answered.
  dockwell.v1.ImageAnswer answer = 2;
  // What its registry calls it, such as "sha256:ab12…". Empty unless found.
  string digest = 3;
}

// ImageResult is what an ImageCall read.
message ImageResult {
  oneof answer {
    dockwell.v1.SearchImagesResponse search = 1;
    dockwell.v1.ListImageTagsResponse tags = 2;
    dockwell.v1.GetImageResponse image = 3;
    ImageDigests digests = 270;
  }
}

// ImageUpdatesCall asks what's newer than an image the server runs, from its
// registry, as the server's pull would find it: a HEAD of the tag's manifest,
// which no registry counts as a pull, and for a tag that's a version, the
// repository's tags once. See
// docs/adr/0079-knowing-a-newer-version-of-an-app-is-out.md.
message ImageUpdatesCall {
  // The image as a service's spec names it, such as "postgres:16.3".
  string reference = 1;
  // Read the repository's tags for newer versions in the tag's track, for a tag
  // that's a version.
  bool tags = 2;
  // What runs, by repository and digest, such as "postgres@sha256:ab12…", whose
  // labels the server's own copy says, with no network. Empty when it isn't
  // known.
  string running = 3;
  // The registry login the check signs in with, sealed as a step's values are:
  // what the service's pull uses (ADR 0086). Numbered in the block registry logins
  // hold, 310 to 319.
  bytes registry_auth = 311;
}

// ImageUpdatesResult is what an ImageUpdatesCall found.
message ImageUpdatesResult {
  // What the registry said of the tag.
  dockwell.v1.ImageAnswer answer = 1;
  // The digest the tag points at now, when the registry said.
  string digest = 2;
  // When the tag was last pushed, where the registry says.
  google.protobuf.Timestamp push_time = 3;
  // The newest tag of each kind of step newer than the tag, in its track:
  // patch, minor, then major. Empty when tags weren't asked for, or there are
  // none.
  repeated NewerTag newer = 4;
  // What reading the repository's tags said, when they were asked for. The
  // digest stands without them.
  dockwell.v1.ImageAnswer tags_answer = 5;
  // The org.opencontainers.image.source label of what runs, an https address,
  // where its image has one.
  string source = 6;
  // The registry's own words when it didn't answer as it should, in a line.
  string detail = 7;
}

// NewerTag is a tag newer than the one a service runs.
message NewerTag {
  // The tag, such as "16.4".
  string name = 1;
  // How big a step it is.
  dockwell.v1.UpdateKind kind = 2;
  // What it points at, when the registry said.
  string digest = 3;
  // When it was last pushed, where the registry says.
  google.protobuf.Timestamp push_time = 4;
}

// ReadOnePanelCall asks what 1Panel keeps on the server, read from its records,
// read-only, with nothing secret in what comes back. See
// docs/adr/0056-importing-a-1panel-server.md.
message ReadOnePanelCall {}

// ReadOnePanelResult is what 1Panel keeps, or why there's nothing to read.
message ReadOnePanelResult {
  // What it keeps, when it's there.
  dockwell.v1.OnePanel found = 1;
  // Why there's nothing, such as that 1Panel isn't installed here, when it isn't
  // there. A record that can't be read is the call's error.
  string not_here = 2;
}

// ReadPanelCall asks what a panel runs on the server, read from Docker and its
// folders, never its database or its API (ADR 0089).
message ReadPanelCall {
  // Which panel to read.
  dockwell.v1.PanelKind panel = 1;
}

// ReadPanelResult is what the panel runs, or why there's nothing to read.
message ReadPanelResult {
  // What it runs, when it's there.
  dockwell.v1.Panel found = 1;
  // Why there's nothing, such as that Coolify doesn't run here, when it isn't.
  string not_here = 2;
}

// DrillBackupCall asks to check that a backup on the server restores: into a
// container and a volume of its own, from the image the database runs now, with no
// network and none of the service's command, variables or mounts, checked, and
// thrown away whatever comes of it (ADR 0068).
message DrillBackupCall {
  // The drill's ID, which its container and volume are labelled with.
  string id = 1;
  // The backup's ID.
  string backup = 2;
  // Its volume.
  dockwell.v1.ResourceRef volume = 3;
}

// SendBackupCall asks to send a backup that's on the server to its destination, as a
// step of its own once it's whole, so an upload holds nothing up.
message SendBackupCall {
  // The backup's ID.
  string id = 1;
  // The volume it's of.
  dockwell.v1.ResourceRef volume = 2;
  // Where it goes, sealed to this stream's delivery key as a backup destination's
  // values are (ADR 0022).
  bytes destination = 3;
}

// FetchBackupCall asks to bring a backup back from where it was sent.
message FetchBackupCall {
  // The backup's ID.
  string id = 1;
  // The volume it's of, as it's named on the server it came from.
  dockwell.v1.ResourceRef volume = 2;
  // Where it is, sealed as in BackupCall.
  bytes destination = 3;
  // Its name there.
  string key = 4;
  // What the control plane has on record that it hashes to, in hex. What came back
  // is checked against this, and against nothing the storage says.
  string sha256 = 5;
}

// DeleteBackupCall asks to remove a backup from the disk.
message DeleteBackupCall {
  // The backup's ID.
  string id = 1;
  // The volume it's of.
  dockwell.v1.ResourceRef volume = 2;
  // Where it was sent, sealed as in BackupCall, to remove it from there too.
  bytes destination = 3;
  // Its name there.
  string key = 4;
}

// RestoreSource is what a step restores. Exactly one of backup_id and undoes is
// set.
message RestoreSource {
  // The backup.
  string backup_id = 1;
  // A change that restored, whose copy of what it replaced this puts back.
  string undoes = 2;
  // The change that restores, which it does once.
  string change_id = 3;
}

// DatabaseCall asks what databases say of themselves, each read in its own
// container with its own tools, which sign in with what its environment holds,
// so no password passes through the agent. It changes nothing.
message DatabaseCall {
  // The databases, each a service on this server.
  repeated DatabaseAsked databases = 1;
}

// DatabaseAsked is one database to read.
message DatabaseAsked {
  // Its service.
  dockwell.v1.ResourceRef service = 1;
  // Which database it runs.
  dockwell.v1.DatabaseEngine engine = 2;
}

// ContainersCall asks which containers Docker has, as it lists them, so nothing
// is touched and no container's environment is read.
message ContainersCall {
  // Only this container, by its full ID or its exact name. Empty lists them all.
  string container = 1;
}

// ListFilesCall asks what a directory holds.
message ListFilesCall {
  // The directory's absolute path.
  string path = 1;
  // Lists only the names that hold this, case aside, such as "error". Empty lists
  // every name.
  string match = 230;
  // Lists the page after the one whose next_page this is. Empty lists the first.
  string page = 231;
}

// ReadFileCall asks for a file's text.
message ReadFileCall {
  // The file's absolute path.
  string path = 1;
}

// SaveFileCall replaces a file's text, if it is still as it was read.
message SaveFileCall {
  // The file's absolute path.
  string path = 1;
  // The file's new text.
  string content = 2;
  // The version from the read it was edited from.
  string version = 3;
  // What the control plane calls this save on record, for a SaveEnded to name.
  string record = 4;
  // The path a person confirmed with a passkey. The agent writes a way back onto
  // the server only if its walk ended there.
  string confirmed_path = 5;
}

// FileRefusal says why the agent didn't list, read or save a path. It is an
// answer, not a failure: the call ran, and this is what the server has to say.
message FileRefusal {
  // Kind says what went wrong, for the API's reason.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // Nothing is at the path, or a symlink on the way leads nowhere.
    KIND_NOT_FOUND = 1;
    // Dockwell doesn't open what's at the path, whoever asks
    // (docs/security/files.md).
    KIND_REFUSED = 2;
    // The path is something other than a directory, to a list.
    KIND_NOT_A_DIRECTORY = 3;
    // The path is something other than a regular file, to a read.
    KIND_NOT_A_FILE = 4;
    // The server denied the agent, as a mount that squashes root does, or a
    // full disk kept a save out.
    KIND_DENIED = 5;
    // The path stopped answering, as a network mount does when its far end is
    // down, so the agent stopped waiting for it.
    KIND_NOT_ANSWERING = 6;
    // The file isn't as the read a save came from left it, so nothing was
    // written.
    KIND_CHANGED = 7;
    // The path stopped answering after a save began to write it, so the save
    // may still land. A SaveEnded says how it came out.
    KIND_MAY_LAND = 8;
    // The file is a way back onto the server, and no passkey confirmed saving
    // where the walk ended, so nothing was written.
    KIND_NEEDS_STEP_UP = 9;
    // Something is already at the path a make, move or put back would take.
    // Numbered apart, as open work adds to this enum.
    KIND_EXISTS = 120;
    // A move would cross to another filesystem, which a rename can't.
    KIND_OTHER_DISK = 121;
    // A delete can't go to Recently deleted, as it's on another filesystem,
    // so it can only be deleted for good, which the call didn't say.
    KIND_FOR_GOOD = 122;
    // What's put back has nowhere to go, as the folder it was in is gone.
    KIND_FOLDER_GONE = 123;
    // An upload is larger than a server takes, or than its disk has room for.
    KIND_TOO_LARGE = 124;
    // An upload's ID is unknown, finished, or past the day it's kept.
    KIND_UPLOAD_GONE = 125;
    // A write starts somewhere other than where its upload got to, so nothing
    // was written. Ask where with begin_upload.
    KIND_OFFSET = 126;
    // An archive holds what can't be unpacked here, such as a way back in, a
    // path that leaves its folder, or more than an upload may be.
    KIND_UNPACK_REFUSED = 127;
    // Every upload and download the agent runs at once is under way, and one
    // didn't end in time for this one to start.
    KIND_BUSY = 128;
    // The disk filled while an upload was written or unpacked. What was
    // written so far is kept.
    KIND_NO_SPACE = 129;
  }

  // What went wrong.
  Kind kind = 1;
  // The reason, for people, with how to fix it.
  string message = 2;
  // Where the agent stopped, with every symlink before it followed.
  string path = 3;
}

// MakeFileCall makes an empty file or a folder, never over what's there.
message MakeFileCall {
  // The absolute path to make.
  string path = 1;
  // A file or a directory.
  dockwell.v1.FileType type = 2;
  // The path a person confirmed with a passkey, where it's a way back in.
  string confirmed_path = 3;
}

// MakeFileResult answers a MakeFileCall.
message MakeFileResult {
  // What was made. Unset when the agent refused.
  dockwell.v1.MakeFileResponse made = 1;
  // Why it made nothing.
  FileRefusal refusal = 2;
}

// MoveFileCall moves or renames what's at a path, never over what's there.
message MoveFileCall {
  // The absolute path it's at.
  string from = 1;
  // The absolute path it goes to.
  string to = 2;
  // The path it's at, as a person confirmed it with a passkey, where either
  // end is a way back in.
  string confirmed_from = 3;
  // The path it goes to, as a person confirmed it with the same passkey.
  string confirmed_to = 4;
}

// MoveFileResult answers a MoveFileCall.
message MoveFileResult {
  // Where it went. Unset when the agent refused.
  dockwell.v1.MoveFileResponse moved = 1;
  // Why it moved nothing.
  FileRefusal refusal = 2;
}

// DeleteFileCall deletes what's at a path, to Recently deleted, or for good.
message DeleteFileCall {
  // The absolute path.
  string path = 1;
  // True to delete it for good, which frees its space at once.
  bool for_good = 2;
  // The path a person confirmed with a passkey, where it's a way back in.
  string confirmed_path = 3;
}

// DeleteFileResult answers a DeleteFileCall.
message DeleteFileResult {
  // What was deleted. Unset when the agent refused.
  dockwell.v1.DeleteFileResponse deleted = 1;
  // Why it deleted nothing.
  FileRefusal refusal = 2;
}

// ListDeletedCall asks what's in Recently deleted.
message ListDeletedCall {}

// ListDeletedResult answers a ListDeletedCall.
message ListDeletedResult {
  // What's there, newest first.
  dockwell.v1.ListDeletedFilesResponse listing = 1;
}

// RestoreFileCall puts back what was deleted, where it was.
message RestoreFileCall {
  // Its ID in Recently deleted.
  string id = 1;
  // The path a person confirmed with a passkey, where it's a way back in.
  string confirmed_path = 2;
}

// RestoreFileResult answers a RestoreFileCall.
message RestoreFileResult {
  // Where it went back. Unset when the agent refused.
  dockwell.v1.RestoreFileResponse restored = 1;
  // Why it put nothing back.
  FileRefusal refusal = 2;
}

// PurgeDeletedCall deletes for good what's in Recently deleted.
message PurgeDeletedCall {
  // Its ID in Recently deleted.
  string id = 1;
}

// PurgeDeletedResult answers a PurgeDeletedCall.
message PurgeDeletedResult {
  // What went. Unset when the agent refused.
  dockwell.v1.DeletedFile purged = 1;
  // Why nothing went.
  FileRefusal refusal = 2;
}

// BeginUploadCall starts an upload of size_bytes to path, never over what's
// there, or says how far the upload upload_id got.
message BeginUploadCall {
  // The absolute path the file takes once it's all there.
  string path = 1;
  // How large it is.
  uint64 size_bytes = 2;
  // The path a person confirmed with a passkey, where it's a way back in.
  string confirmed_path = 3;
  // An upload to pick up again. With it, the rest is left out.
  string upload_id = 4;
  // What to unpack it as, once it's all there.
  dockwell.v1.Unpack unpack = 5;
  // Who asks: the user and the session, as the control plane names them. An
  // upload is its beginner's: every later call for it has to come from the
  // same, and the agent answers any other as if there were no such upload.
  string owner = 6;
}

// UploadResult is an upload as it stands.
message UploadResult {
  // The upload. Unset when the agent refused.
  dockwell.v1.Upload upload = 1;
  // Why it refused.
  FileRefusal refusal = 2;
}

// WriteUploadCall writes what ReceiveFile carries to an upload, from offset.
message WriteUploadCall {
  // The ReceiveFile stream that carries it.
  uint64 stream = 1;
  // The upload.
  string upload_id = 2;
  // Where it starts, which has to be how far the upload got.
  uint64 offset = 3;
  // Who asks, as BeginUploadCall says.
  string owner = 4;
}

// FinishUploadCall puts an upload in place, once it's all there, or with
// cancel, removes what it has so far.
message FinishUploadCall {
  // The upload.
  string upload_id = 1;
  // Who asks, as BeginUploadCall says.
  string owner = 2;
  // Remove what's there of it, rather than put it in place.
  bool cancel = 3;
}

// FinishUploadResult answers a FinishUploadCall.
message FinishUploadResult {
  // What was put in place. Unset when the agent refused.
  dockwell.v1.FinishUploadResponse finished = 1;
  // Why it didn't.
  FileRefusal refusal = 2;
}

// DownloadFileCall sends what's at path over SendFile: a file as it is, or a
// folder as a zip archive.
message DownloadFileCall {
  // The SendFile stream to send it on.
  uint64 stream = 1;
  // The absolute path.
  string path = 2;
}

// DownloadFileResult answers a DownloadFileCall, once it's all sent.
message DownloadFileResult {
  // How many bytes went. Zero when the agent refused.
  uint64 sent_bytes = 1;
  // Why it sent nothing, or stopped.
  FileRefusal refusal = 2;
}

// ReceiveFileRequest asks for what an upload's write carries.
message ReceiveFileRequest {
  // The WriteUploadCall's stream.
  uint64 stream = 1;
}

// ReceiveFileResponse is part of what's uploaded.
message ReceiveFileResponse {
  // The next bytes, 1 MiB at most.
  bytes data = 1;
}

// SendFileRequest is part of what's downloaded. The first says what it is.
message SendFileRequest {
  // The DownloadFileCall's stream, on every message.
  uint64 stream = 1;
  // What it's called, on the first message: the file's name, or the folder's
  // with .zip after it.
  string name = 2;
  // How large it is, on the first message, for a file. Zero for an archive,
  // which is made as it goes.
  uint64 size_bytes = 3;
  // Where the walk ended, with every link followed, on the first message.
  string path = 4;
  // True for a folder, sent as a zip archive, on the first message.
  bool archive = 5;
  // The next bytes, 1 MiB at most.
  bytes data = 6;
}

// SendFileResponse is empty.
message SendFileResponse {}

// ListFilesResult answers a ListFilesCall.
message ListFilesResult {
  // What the directory holds. Unset when the agent refused.
  dockwell.v1.ListFilesResponse listing = 1;
  // Why it didn't list the directory.
  FileRefusal refusal = 2;
}

// ReadFileResult answers a ReadFileCall.
message ReadFileResult {
  // The file. Unset when the agent refused.
  dockwell.v1.ReadFileResponse file = 1;
  // Why it didn't read the file.
  FileRefusal refusal = 2;
}

// SaveFileResult answers a SaveFileCall.
message SaveFileResult {
  // The file as saved. Unset when the agent refused.
  dockwell.v1.SaveFileResponse saved = 1;
  // Why it didn't save the file.
  FileRefusal refusal = 2;
}

// LogSourcesCall asks which containers a service has logs from.
message LogSourcesCall {
  // The service.
  dockwell.v1.ResourceRef resource = 1;
  // What the server kept of revisions up to this isn't listed, as a deletion put it
  // out of reach.
  int64 forgotten_up_to = 2;
  // In place of a service, a container Dockwell didn't make, by its full ID.
  string container = 3;
}

// ForgottenCall says which services' kept logs a deletion put out of reach, for what
// to remove from the disk: each read says for itself what it can't read. It is all of
// them, and replaces what it last said. A server hears it when it connects and from
// time to time after that, so one that was away or joins later catches up.
message ForgottenCall {
  // The services.
  repeated ForgottenService services = 1;
}

// ForgottenService is what one deleted service left.
message ForgottenService {
  // The service.
  dockwell.v1.ResourceRef resource = 1;
  // What the server kept of revisions up to this is out of reach.
  int64 up_to_revision = 2;
  // True once it can't be undone, so it goes from the disk.
  bool expired = 3;
}

// ForgottenResult answers a ForgottenCall.
message ForgottenResult {}

// LogsCall asks the agent to read a service's logs.
message LogsCall {
  // Names the call's SendLogs stream.
  uint64 stream = 1;
  // The service.
  dockwell.v1.ResourceRef resource = 2;
  // Only lines written at or after this time.
  google.protobuf.Timestamp since = 3;
  // Only lines written at or before this time.
  google.protobuf.Timestamp until = 4;
  // How many of each container's newest lines to read, -1 for none and 0
  // for all.
  int32 tail = 5;
  // Go on with what is written next, and with containers that start later.
  bool follow = 6;
  // Only these sources.
  repeated string source_ids = 7;
  // Only containers this revision made.
  int64 revision = 8;
  // Only containers this change made.
  string change_id = 9;
  // Only lines of these levels.
  repeated dockwell.v1.LogLevel levels = 10;
  // Only lines that hold this text, in any case.
  string query = 11;
  // Carry on after these lines: what a stream already sent of each source.
  repeated LogCursor after = 12;
  // Read only what comes before these lines: what a page already holds.
  repeated LogCursor before = 13;
  // When the stream these cursors came from was last heard from. A
  // container made since, which has no cursor, is read from its start.
  google.protobuf.Timestamp resume_from = 14;
  // Read the containers the server kept the logs of, too, within since and
  // until. Without it only what Docker has now is read, unless the filters
  // name a kept one.
  bool include_kept = 15;
  // Who is reading, as an opaque name, so that one reader can't take every
  // place this server has for reading logs. Empty counts only towards the
  // server's own limit.
  string reader = 16;
  // Only lines from this long ago until now, by this server's clock, which is
  // the clock its lines' times are on. Set in place of since.
  google.protobuf.Duration last = 17;
  // What the server kept of revisions up to this isn't read, as a deletion put it
  // out of reach.
  int64 forgotten_up_to = 18;
  // In place of a service, a container Dockwell didn't make, by its full ID. The
  // server keeps nothing of such a container, so what Docker has is all there is.
  string container = 19;
  // The name that container has. A reader goes by its name, so a follow reads what
  // comes to hold the name too, as docker compose up -d and docker rm then docker
  // run leave a new container under it.
  string container_name = 20;
  // In place of a service, follows the server's system log (ADR 0067): one
  // journalctl for every follow of it, each narrowed here, within the same
  // places and the same share of the server's live rate as a service's follows.
  // Track S takes 280 to 289 in agent messages.
  SystemLogFollow system = 283;
}

// SystemLogFollow narrows a follow of the server's system log.
message SystemLogFollow {
  // Only what this unit wrote, or what systemd wrote of it; empty follows
  // everything.
  string unit = 1;
  // Only lines at this level or worse; unset follows every level.
  dockwell.v1.LogLevel level = 2;
  // Only lines whose message holds this text, in any case.
  string query = 3;
  // Carry on after the line at this cursor, sending what came since first; empty
  // starts with what comes next.
  string after = 4;
}

// LogCursor is a place in one source's lines.
message LogCursor {
  // The source's id.
  string source_id = 1;
  // The time of the line.
  google.protobuf.Timestamp time = 2;
  // How many lines of the source have exactly that time, up to and including
  // the line, as two lines can share one. In before, how many of those the
  // pages so far hold, which are the newest of them.
  uint32 count = 3;
}

// LogScan says what a read that had to look at every line read of one source.
message LogScan {
  // The source's id.
  string source_id = 1;
  // The oldest line it read.
  google.protobuf.Timestamp oldest_time = 2;
  // How many lines it read.
  uint64 lines = 3;
  // True when it stopped at a limit, before the oldest line.
  bool cut_short = 4;
  // True when older lines passed the filters and weren't sent, for lack of
  // room, so another page has more.
  bool older = 5;
  // True when it stopped because its time ran out, rather than at the most
  // lines it reads.
  bool timed_out = 6;
}

// SendLogsRequest is one message of a LogsCall's lines.
message SendLogsRequest {
  // The call's stream, on the first message and every other.
  uint64 stream = 1;
  // Sources that are new or changed.
  repeated dockwell.v1.LogSource sources = 2;
  // Lines, by source.
  repeated dockwell.v1.LogChunk chunks = 3;
  // True once the agent has read what each source had when the call came.
  bool caught_up = 4;
  // What a search read, once it is done.
  repeated LogScan scans = 5;
  // When this stream began, by this server's clock, on its first message: since
  // when a source with no place is read, if the stream has to carry on.
  google.protobuf.Timestamp started = 6;
  // A follow of the system log's lines, oldest first (ADR 0067).
  repeated dockwell.v1.SystemLogLine system_lines = 284;
  // How many lines of the system log the follow dropped since its last message,
  // past its share of the server's rate, or as its reader fell behind.
  uint64 system_dropped = 285;
  // True when more lines came after the follow's cursor than it carries on with:
  // the rest are read back, not followed.
  bool system_gap = 286;
}

// SendLogsResponse is empty.
message SendLogsResponse {}

// PlanCall asks what moving each resource to its desired spec would take.
// It reads the server and changes nothing.
message PlanCall {
  // Each resource as the change wants it on this server.
  repeated DesiredResource desired = 1;
}

// ApplyCall asks the agent to carry out one step.
message ApplyCall {
  // The step, as the plan has it.
  dockwell.v1.PlanStep step = 1;
  // The resource as the step leaves it.
  DesiredResource desired = 2;
  // The values of the variables and secrets the desired spec uses, as a
  // Values message sealed with HPKE to the stream's delivery_key: DHKEM
  // (X25519, HKDF-SHA256), HKDF-SHA256 and AES-256-GCM, with the info
  // "dockwell.values.v1", the server's ID and the resource's kind, scope and
  // name, each after a zero byte. Unset when it uses none. The agent opens
  // it in memory for this step, and writes it nowhere but its cache of
  // desired state, sealed there with its own key (ADR 0054).
  bytes values = 3;
  // True when a run stopped partway had already pulled the step's image on this
  // server, so it compares what the server has, and needs no registry.
  bool pulled = 4;
  // Which deploy the step is part of, if any, which what it makes is labelled
  // with.
  Deploy deploy = 5;
  // True when a run stopped partway took the step as far as it can be seen to have
  // gone, so all the agent does is its check.
  bool finishing = 6;
  // Where the server paths this step mounts led when it was planned, by path,
  // for those that lead elsewhere. What makes a container checks again.
  map<string, string> planned_leads = 7;
}

// Deploy says which revision and change a step carries out.
message Deploy {
  // The revision applying runs toward.
  int64 revision = 1;
  // The change.
  string change_id = 2;
  // True when the change rolls a failed one back, so what the step replaces
  // or removes failed.
  bool rollback = 3;
  // True for the change's last step on this server of a kind under the
  // firewall's timer, such as firewall.rule: the agent waits for the change to
  // be confirmed, or its timer to run out, before the step ends (ADR 0052).
  // Numbered in the server overview's block, as open work adds here.
  bool last_access_step = 45;
}

// Values are what a service's variables and secrets resolve to on the
// server it runs on.
message Values {
  // Each value by the name the service sees it as, such as DATABASE_URL.
  map<string, string> values = 1;
}

// ObserveCall asks for resources as the server has them.
message ObserveCall {
  // The resources.
  repeated dockwell.v1.ResourceRef resources = 1;
}

// DesiredResource is one resource as a change wants it.
message DesiredResource {
  // The resource.
  dockwell.v1.ResourceRef resource = 1;
  // Its spec, encoded as its kind's message. Unset deletes it; an empty
  // spec is set, with no bytes.
  optional bytes spec = 2;
  // Asks the server for its image again as the step applies.
  bool pull = 3;
  // Says the change asks it to run, so one that's there and isn't running is
  // started. A stop by hand stays otherwise, unless the change replaces it anyway.
  bool run = 4;
  // Names a restart this resource is to have, though its spec hasn't changed:
  // the change's ID. A resource that had this restart has no step to take.
  string restart = 5;
  // Says a rollback is planning it, which runs before anyone reads its plan, so it
  // takes nothing only a person may approve.
  bool rollback = 6;
  // Takes on this container, by its full ID, as what the resource runs, in place
  // of making one.
  string adopt = 7;
  // Brings the resource's data back from a backup, with its spec as it is.
  RestoreSource restore = 8;
  // What people call the resource's scope, for what they read on the server: for
  // an environment, "<project>.<environment>", such as "default.production",
  // which a service's containers are named after, as in
  // "default.production.web-1", so docker ps says what each is. Its Compose
  // project stays the environment's ID, which never changes. Empty names a new
  // container as Compose would, "<project>-<service>-<number>", as before.
  string scope_name = 9;
  // Backs up the resource's data as a step of this change, under this ID.
  string backup_id = 10;
  // Installs updates on the server, for its host (ADR 0064). Numbered in the
  // servers area's block, 230 to 239.
  InstallUpdates install_updates = 232;
  // Names a reboot of the server, for its host: the change's ID (ADR 0064). The
  // agent reboots at most once for that change, as a mark it keeps says, and
  // plans nothing once it runs on another boot.
  string reboot = 233;
  // Moves the database a service runs to a newer release, by a dump into a new
  // volume, as its step replaces its container (ADR 0080). Numbered in the updates
  // area's block, 260 to 269.
  MoveDatabase move_database = 260;
  // Acts on one of the server's system services, for its host (ADR 0082).
  // Numbered in Track S's block, 280 to 289.
  UnitAction unit = 280;
  // The registry login the resource's image is pulled with, sealed to this
  // stream's delivery key as a step's values are, for a plan's ask and a step's
  // pull (ADR 0086). Numbered in the block registry logins hold, 310 to 319.
  bytes registry_auth = 310;
  // The registry logins a step's build may pull its base images with, one for
  // each registry, sealed to this stream's delivery key as a step's values are
  // (ADR 0086). Numbered in the block registry logins hold, 310 to 319.
  bytes build_registry_auths = 315;
  // Stops or starts the own containers and services of the panel an import came
  // from, for its host (ADR 0089). Numbered in the import's block, 330 to 339.
  PanelAction panel = 333;
}

// PanelAction is stopping or starting the own containers and services of Coolify
// or Dokploy on the server. The agent acts on none but the panel's own, and never
// its proxy.
message PanelAction {
  // The change.
  string change_id = 1;
  // The panel.
  dockwell.v1.PanelKind panel = 2;
  // True to start them again, as parts say each stood; otherwise a stop.
  bool start = 3;
  // How each stood before a stop, as its plan kept it: what a start puts back,
  // and what a stop that resumes keeps.
  repeated dockwell.v1.HostPanelPart parts = 4;
}

// UnitAction is an action a change asks of one of the server's system services.
message UnitAction {
  // The change, as an install names it.
  string change_id = 1;
  // The unit's name, as asked: the agent acts on the unit it resolves to.
  string name = 2;
  // What to do to it.
  dockwell.v1.SystemServiceAction action = 3;
}

// MoveDatabase is a database a change moves to a newer release on a server.
message MoveDatabase {
  // The ID the dump is kept under, as a backup of from_volume.
  string backup_id = 1;
  // The volume its data is on now, and the one it moves to, by name, in the
  // service's environment.
  string from_volume = 2;
  string to_volume = 3;
  // The change that moves it, which names what the move stops, so a resume finds it.
  string change_id = 4;
  // Asks only to start what the move stopped and report its dump, where it left
  // those, as a rollback of its change does: it never moves anything.
  bool finish_only = 5;
}

// InstallUpdates asks a server's host to install its updates.
message InstallUpdates {
  // The change, which names the install's unit, so a resume finds it.
  string change_id = 1;
  // Every update waiting, not only the security fixes, at planning.
  bool all = 2;
  // The packages the plan fixed, as the plan simulated them: empty at planning,
  // and what a resume checks against.
  repeated dockwell.v1.PackageUpdate packages = 3;
  // At planning, installs only these, by name, with what they need, in place of
  // all: the agent refuses a name its own read didn't list, and says the names
  // back in the plan's asked, which an older agent doesn't.
  repeated string names = 4;
}

// CancelBuildCall stops a build that is waiting or running, which fails the
// step it is part of as cancelled, before anything that runs is touched.
message CancelBuildCall {
  // The change the build is a step of.
  string change_id = 1;
  // The service it builds for.
  dockwell.v1.ResourceRef resource = 2;
  // Who cancelled it, by name, for its log.
  string by = 3;
}

// DetectBuildCall reads a commit of a repository as a build would, in a
// container of its own, and says how it would build. It builds nothing.
message DetectBuildCall {
  // What to read: the repository, its commit, the folder and the builder. The
  // build's secrets' values aren't sent: Railpack reads it with their names.
  dockwell.resource.v1alpha1.ImageBuild build = 1;
  // True when the service starts with a command of its own, so the commit
  // needn't say what starts it.
  bool own_command = 2;
}

// DetectBuildResult is what reading the commit found.
message DetectBuildResult {
  // How it would build.
  dockwell.v1.BuildDetection detection = 1;
}

// CancelBuildResult says whether there was such a build to stop.
message CancelBuildResult {
  // True when the build was waiting or running, and is stopping.
  bool stopping = 1;
}

// CancelCall stops a call: its caller went away, or its time ran out.
message CancelCall {
  // The call's ID.
  uint64 id = 1;
}

// CallResult is the agent's answer to one call.
message CallResult {
  // The call's ID.
  uint64 id = 1;
  // How it went.
  oneof result {
    // The call failed.
    CallError error = 2;
    // The steps a plan call judged, in the order it was given resources.
    PlanResult plan = 3;
    // The step was carried out and verified.
    ApplyResult apply = 4;
    // The resources an observe call read.
    ObserveResult observe = 5;
    // The containers a log sources call found.
    LogSourcesResult log_sources = 6;
    // A logs call read all it was asked for, or its reader left.
    LogsResult logs = 7;
    // Answers forgotten.
    ForgottenResult forgotten = 8;
    // The containers a containers call found.
    ContainersResult containers = 9;
    // What a list files call found.
    ListFilesResult list_files = 10;
    // What a read file call found.
    ReadFileResult read_file = 11;
    // How a save file call went.
    SaveFileResult save_file = 12;
    // What an adoption call read.
    AdoptionResult adoption = 13;
    // What a backup preview call found. Numbered apart, as open work adds to
    // this message.
    BackupPreviewResult backup_preview = 20;
    // What a backup call took.
    BackupResult backup = 21;
    // Answers delete_backup.
    DeleteBackupResult delete_backup = 22;
    // What fetch_backup brought back.
    BackupResult fetch_backup = 23;
    // What send_backup sent.
    SendBackupResult send_backup = 24;
    DrillBackupResult drill_backup = 220;
    ListUpdatesResult list_updates = 53;
    // What a database call read. Numbered apart, as open work adds to this
    // message.
    DatabaseResult database = 30;
    // What a firewall call read.
    dockwell.v1.ServerFirewall firewall = 43;
    ConfirmAccessResult confirm_access = 44;
    dockwell.v1.ServerSsh ssh = 46;
    dockwell.v1.ServerFail2ban fail2ban = 47;
    // What a probe found.
    ProbeResult probe = 60;
    // Answers cancel_build. Numbered apart, as open work adds to this message.
    CancelBuildResult cancel_build = 130;
    // What reading the commit found.
    DetectBuildResult detect_build = 131;
    // What a disk use call added up. Numbered apart, as open work adds to this
    // message.
    dockwell.v1.ServerDiskUse disk_use = 40;
    // What a processes call read.
    ProcessesResult processes = 41;
    // How an end process call went.
    EndProcessResult end_process = 42;
    // The terminal, running. The terminal's numbers in agent messages are 50 to
    // 59.
    OpenTerminalResult open_terminal = 50;
    // The attachment ended.
    AttachTerminalResult attach_terminal = 51;
    // How the terminal ended.
    CloseTerminalResult close_terminal = 52;
    // What task_runs read. Numbered in the block scheduled tasks hold.
    TaskRunsResult task_runs = 150;
    // The run run_task started.
    RunTaskResult run_task = 151;
    // What read_onepanel found.
    ReadOnePanelResult read_onepanel = 180;
    // What image read.
    ImageResult image = 200;
    // What ports found.
    PortsResult ports = 210;
    // How a forward ended.
    ForwardResult forward = 221;
    // What make_file made. Numbered apart, as open work adds to this message.
    MakeFileResult make_file = 120;
    // Where move_file moved it.
    MoveFileResult move_file = 121;
    // What delete_file deleted.
    DeleteFileResult delete_file = 122;
    // What list_deleted found.
    ListDeletedResult list_deleted = 123;
    // Where restore_file put it back.
    RestoreFileResult restore_file = 124;
    // What purge_deleted deleted for good.
    PurgeDeletedResult purge_deleted = 125;
    // The upload begin_upload started or found.
    UploadResult begin_upload = 126;
    // How far write_upload got.
    UploadResult write_upload = 127;
    // What finish_upload put in place.
    FinishUploadResult finish_upload = 128;
    // What download_file sent.
    DownloadFileResult download_file = 129;
    // Whether remember was kept.
    RememberResult remember = 161;
    // What system_services read.
    SystemServicesResult system_services = 235;
    // What system_log read.
    SystemLogResult system_log = 281;
    // How check_registry_login signed in.
    CheckRegistryLoginResult check_registry_login = 313;
    // What put_certificates loaded.
    PutCertificatesResult put_certificates = 320;
    // What read_panel found.
    ReadPanelResult read_panel = 331;
    // What image_updates found.
    ImageUpdatesResult image_updates = 250;
  }
}

// ProbeResult says whether what a probe asked answered.
message ProbeResult {
  // Whether it answered: a port that took a connection, or a URL that gave an
  // HTTP answer below 500.
  bool answered = 1;
  // What it said, in a line, such as "200 OK" or "503 Service Unavailable", or
  // why nothing did, such as "connection refused".
  string said = 2;
}

// AdoptionResult is a container as the spec of a service.
message AdoptionResult {
  // The service's app, encoded as a Container. It holds the container's
  // environment, so what carries it treats it as any spec with sensitive fields.
  bytes spec = 1;
  // What the container runs with that a replace couldn't carry, each in words
  // for people, such as "hostname". With any, it can't be taken on yet, as a change
  // of its image would quietly drop them.
  repeated string refused = 2;
  // Where the spec would show a value of the container's environment, by the
  // variable's name and never the value, such as "the value of DB_PASSWORD in its
  // command". With any, it can't be taken on, as a plan would show them.
  repeated string shows = 3;
  // The tool that runs its Compose project, where its labels show one, such as
  // "1Panel".
  string manager = 4;
  // Where its Compose project runs from.
  string folder = 5;
  // What depends on it in a way a replace would cut off, each with how, such as "app
  // shares its network". With any, it can't be taken on.
  repeated string leaned_on = 6;
  // Why the spec isn't one a service can hold, in words for people. With any, it
  // can't be taken on.
  string invalid = 7;
}

// BackupPreviewResult says what backing up a volume would do.
message BackupPreviewResult {
  // What it would do with nothing else asked.
  dockwell.v1.BackupMethod method = 1;
  // The database whose dump it takes.
  string database = 2;
  // What runs on the volume now.
  repeated string running = 3;
  // About how much a backup will take on the disk, in bytes.
  int64 estimate_bytes = 4;
  // What's free on the disk that holds backups, in bytes.
  int64 free_bytes = 5;
  // How much of that a backup leaves alone, in bytes.
  int64 reserve_bytes = 6;
}

// BackupResult is a backup, whole on the disk.
message BackupResult {
  // How it was taken.
  dockwell.v1.BackupMethod method = 1;
  // The database it's a dump of.
  string database = 2;
  // Its size, in bytes.
  int64 size_bytes = 3;
  // Its SHA-256, in hex.
  string sha256 = 4;
  // How many files changed while they were read.
  int64 files_changed = 5;
  // The backup's ID, where a step took it.
  string id = 6;
}

// DrillBackupResult says how a restore drill went. A drill that couldn't run, or
// was cut short, is DRILL_RESULT_NOT_CHECKED with why, never a failure: that says
// nothing about the backup.
message DrillBackupResult {
  dockwell.v1.DrillResult result = 1;
  // What failed, or why it wasn't checked, in plain words.
  string why = 2;
  // What the database printed last, without what it quoted.
  string detail = 3;
  // How much came back, in bytes.
  int64 restored_bytes = 4;
  // How many tables it checked.
  int32 tables = 5;
  // True for a copy it could only unpack.
  bool unpacked_only = 6;
}

// SendBackupResult says a backup reached its destination.
message SendBackupResult {
  // Its name there.
  string key = 1;
  // How much it takes there, in bytes, sealed.
  int64 stored_bytes = 2;
}

// DeleteBackupResult says the backup is gone from the disk.
message DeleteBackupResult {
  // Why it's still where it was sent, when the call asked for it to go from there too.
  string copy_error = 1;
}

// DatabaseResult is what each database said.
message DatabaseResult {
  // One for each database asked about, in order, with its server left for the
  // control plane to fill in.
  repeated dockwell.v1.DatabaseReading readings = 1;
}

// ContainersResult lists the containers Docker has.
message ContainersResult {
  // The containers, as far as they fit in one message on the agent's stream, and
  // leaving out what runs the server's ingress, which is Dockwell's own whatever
  // the control plane knows of the server.
  repeated dockwell.v1.ServerContainer containers = 1;
  // How many this leaves out for being what runs the ingress.
  int32 ingress = 2;
  // How many more Docker has that didn't fit.
  int32 unlisted = 3;
}

// LogSourcesResult lists the containers a service has logs from.
message LogSourcesResult {
  // The containers, newest first.
  repeated dockwell.v1.LogSource sources = 1;
}

// LogsResult ends a logs call.
message LogsResult {}

// CallError says why a call failed.
message CallError {
  // The reason, for people, such as "can't replace container web: the
  // image doesn't exist".
  string message = 1;
  // True when the agent didn't run the call because it is moving to a new
  // stream, as when its certificate was renewed. Nothing ran, and the
  // control plane sends the call again once the agent reconnects.
  bool draining = 2;
  // The reason in plain words, when the agent has them, such as "nginx:9
  // can't be pulled. ...": the fact, then the consequence, then the fix. It
  // leaves the chain of errors to message, which says more and reads worse.
  // Empty when message says it all, as from an older agent.
  string plain = 3;
  // True when the call failed because its time ran out on the agent, which
  // may answer just before the control plane's own deadline.
  bool out_of_time = 4;
  // What the failure comes down to, when the driver knows, as StepProgress has
  // it.
  string reason = 5;
  // True when the agent didn't run the call because the last step on a resource
  // it names hasn't ended, though that step's call has. Nothing ran, and the
  // agent says Unstuck once that step ends.
  bool unfinished = 6;
}

// PlanResult carries a plan call's steps.
message PlanResult {
  // One step for each desired resource, in order; a resource already as
  // desired has PLAN_ACTION_NONE.
  repeated dockwell.v1.PlanStep steps = 1;
  // The containers on this server that Dockwell didn't make, with the server
  // paths they mount, for a plan that mounts or may mount one. The control
  // plane counts what something it plans can write around as held by it.
  repeated UnmanagedMounts unmanaged = 100;
  // The links each server path on this server passes through on the way to where
  // it leads, for a plan that mounts or may mount one: what moves the path if
  // something rewrites one of them.
  repeated PathVia via = 103;
}

// PathVia is a server path and the links its walk passed through, each by its
// own path in its folder, resolved.
message PathVia {
  string path = 103;
  repeated string links = 104;
}

// UnmanagedMounts is a container Dockwell didn't make and the server paths it
// mounts, as written.
message UnmanagedMounts {
  // Its name in Docker.
  string name = 100;
  repeated string paths = 101;
  // True where what it mounts is as good as root already, so moving one of
  // its paths gives it nothing new.
  bool root = 102;
}

// ApplyResult says a step was carried out and verified.
message ApplyResult {
  // True when the step passed but the agent couldn't keep what it left as what
  // its server runs, as for a full disk, so it forgot what it kept of the
  // resource (ADR 0054). The control plane sends it again as the agent next
  // connects.
  bool unkept = 162;
}

// ObserveResult carries an observe call's resources.
message ObserveResult {
  // One for each resource asked for, in order.
  repeated ObservedResource resources = 1;
}

// ObservedResource is a resource as the server has it.
message ObservedResource {
  // Its spec, encoded as its kind's message. Unset when the server doesn't
  // have it.
  optional bytes spec = 1;
}

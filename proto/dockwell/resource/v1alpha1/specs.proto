// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

// Resource specs: the desired state of each kind of resource Dockwell
// manages. See docs/adr/0009-resources-revisions-and-plans.md. The package
// is alpha while the model settles, so it may change without notice.
package dockwell.resource.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // True for fields that may hold secrets. Plans, history and logs say that
  // such a field changed, but never show its value, and the revision store
  // keeps every spec of a kind that has one encrypted (ADR 0022).
  bool sensitive = 51001;
  // True for fields the dockwell CLI takes no flag for, as a secret's from, which a
  // link writes and whose template a password could be typed into, as a secret's
  // value never comes from a flag's text. A change's edits still set it.
  bool no_flag = 51002;
}

// Container is one Docker container: run by hand on a server, or a
// service's app. Docker fills in from the image what a container leaves
// out, such as its command or working directory, and that isn't drift.
message Container {
  // The image to run, such as "ghcr.io/acme/web:1.4.2".
  string image = 1;
  // Overrides the image's command when set.
  repeated string command = 2;
  // Environment variables, which may hold secrets.
  map<string, string> env = 3 [(sensitive) = true];
  // Ports published on the server.
  repeated PortMapping ports = 4;
  // What Docker does when the container stops.
  RestartPolicy restart = 5;
  // Labels on the container, for tools that read them. Keys that start with
  // "com.docker.compose." or "dev.dockwell." are Dockwell's own.
  map<string, string> labels = 6;
  // Overrides the image's entrypoint when set. Empty takes the image's;
  // no_entrypoint runs none.
  repeated string entrypoint = 7;
  // Volumes and server paths mounted into the container.
  repeated Mount mounts = 8;
  // The networks the container joins, by name. A service's are networks in
  // its environment; a container's on its own are Docker's. Empty joins
  // Docker's default bridge network.
  repeated string networks = 9;
  // The user the command runs as, such as "1000" or "node". Empty takes the
  // image's.
  string user = 10;
  // The directory the command runs in. Empty takes the image's.
  string working_dir = 11;
  // How Docker checks the container is healthy. Unset takes the image's
  // check, if it has one.
  Healthcheck healthcheck = 12;
  // Runs no entrypoint, not even the image's, as Compose's "entrypoint: []"
  // does: the command runs on its own. Takes no entrypoint beside it.
  bool no_entrypoint = 13;
  // How long the container has to stop before Docker kills it, in whole
  // seconds, such as "30s", as Compose's stop_grace_period. Empty takes
  // Docker's default of 10 s.
  string stop_grace_period = 14;
  // How a deploy replaces a service's running container. A container on its
  // own takes none: it is stopped, then made again. See
  // docs/adr/0027-health-checks-rollouts-and-rollback.md.
  Rollout rollout = 15;
  // Networks a service joins that Dockwell didn't make, by their names in
  // Docker, such as "1panel-network". Each must be on the server already:
  // Dockwell never makes, changes or deletes one. Whatever else is on it can
  // reach the service, so joining one is host access, which a person approves.
  // A container on its own names Docker's networks in networks.
  repeated string external_networks = 20;
  // Runs a service on the server's own network, with none of its own, as
  // Compose's "network_mode: host" does. It is host access, and takes no
  // networks, ports or aliases. A container on its own names "host" in networks.
  bool host_network = 21;
  // Other names containers on a service's networks reach it by, beside its
  // service's name, such as a Compose file's container_name. No two services
  // on a network can answer to one name.
  repeated string aliases = 22;
  // What it may use of the server's CPU and memory. Unset has no limits.
  Resources resources = 23;
  // Linux capabilities it gets beyond Docker's default ones, such as
  // "NET_ADMIN", or "ALL". It is host access.
  repeated string cap_add = 24;
  // Linux capabilities it gives up, such as "NET_RAW", or "ALL".
  repeated string cap_drop = 25;
  // Groups its command joins beside its user's, by name or number, such as
  // "audio" or "999". It is host access: joining the group that owns Docker's
  // socket is the same as root.
  repeated string group_add = 26;
  // Runs it with every device and capability on the server, the same as root.
  // It is host access.
  bool privileged = 27;
  // How many times on-failure restarts it before giving up. 0 has no limit.
  // Only on-failure takes one.
  uint32 restart_retries = 28;
  // Which of "command", "entrypoint" and "healthcheck.test" name values rather
  // than hold them. In a field listed here, ${NAME} is the value of NAME in the
  // container's environment, or of what its service uses under that name, and
  // $$ is a $ of its own, as in a Compose file. So a plan, an export and what
  // an agent reports show the name, a rotation reaches it, and the value is
  // written in only as the container is made. In any other field, a $ is a $.
  repeated string references = 29;
  // The size of its /dev/shm, such as "1G", in units of 1024, as Compose's
  // shm_size. What it holds counts against resources.memory. Empty takes
  // Docker's default of 64M, which is too little for Chromium on a heavy page.
  string shm_size = 30;
  // Filesystems held in memory at paths in the container. What is in one goes
  // when the container does, so a deploy starts it empty.
  repeated Tmpfs tmpfs = 31;
  // Ports it exposes to what shares a network with it, beyond what its image exposes
  // and what it publishes, such as "3000/tcp". It opens nothing on the server. What
  // finds containers through Docker reads it, as Traefik does for the port to reach.
  repeated string expose = 32;
  // Names it reaches at an address of its own choosing, as hostname:address,
  // such as "host.docker.internal:host-gateway", where host-gateway is the
  // server as its containers reach it. It adds to the container's /etc/hosts,
  // and reaches nothing a container couldn't without it. Numbered in the
  // catalog's block, 80 to 89, apart from fields other work adds.
  repeated string extra_hosts = 80;
  // What follows is what other stores' apps ask of their containers, as Compose
  // names it (ADR 0085), numbered in that work's block, 90 to 99. Each changes
  // only the container itself, and reaches nothing on the server.
  //
  // Its own hostname, which it sees as its name, such as "mail.example.com".
  // Empty takes Docker's, the first 12 of its ID. What reaches it by name on a
  // network goes by its service's name, whatever this says.
  string hostname = 90;
  // Runs a small init as its first process, Docker's own, which reaps what its
  // processes leave behind and passes signals on, as Compose's init.
  bool init = 91;
  // Gives it a terminal, as Compose's tty, for an app that only starts with one.
  bool tty = 92;
  // Keeps its standard input open, as Compose's stdin_open, for an app that
  // exits when its input ends.
  bool stdin_open = 93;
  // The signal that asks it to stop, such as "SIGQUIT", before stop_grace_period
  // ends with a kill. Empty takes its image's, or SIGTERM.
  string stop_signal = 94;
  // Limits its processes have, such as how many files each may open, as Compose's
  // ulimits. One left out takes Docker's.
  repeated Ulimit ulimits = 95;
  // Mounts its own filesystem read-only, as Compose's read_only, so it writes
  // only to its mounts and tmpfs.
  bool read_only = 96;
  // The most processes it may run at once, as Compose's pids_limit. 0 sets none.
  int64 pids_limit = 97;
  // The DNS servers it asks, by address, such as "1.1.1.1", in order. Empty asks
  // what Docker gives it.
  repeated string dns = 98;
  // Keeps its processes from gaining privileges they didn't start with, as through
  // a setuid program, as Compose's security_opt: [no-new-privileges:true].
  bool no_new_privileges = 99;
  // The registry login its image is pulled with, by name, a login its project may
  // use. Empty pulls with the one login for the image's registry its project may
  // use, when there's exactly one, and with none otherwise. See
  // docs/adr/0086-registry-logins-for-private-images.md. Numbered in the block
  // registry logins hold, 100 to 109.
  string registry_login = 100;
}

// Ulimit is a limit of a container's processes, by its name, as ulimit says it.
message Ulimit {
  // Which limit, such as "nofile" for open files, "nproc" for processes, or
  // "memlock" for locked memory.
  string name = 1;
  // The limit a process starts with, and the most it may raise it to. -1 is no
  // limit.
  int64 soft = 2;
  int64 hard = 3;
}

// Tmpfs is a filesystem held in memory, at a path in a container.
message Tmpfs {
  // Where it appears in the container, as an absolute path.
  string target = 1;
  // The most it may hold, such as "64M", in units of 1024. Empty sets none, so
  // it can take half the server's memory, unless resources.memory stops it first.
  string size = 2;
}

// Resources is what a container may use of its server. Docker changes these on
// a running container, except to lift one: that recreates it.
message Resources {
  // The most CPUs it may use, such as "0.5" or "2", to three decimal places.
  // Empty has no limit.
  string cpus = 1;
  // The most memory it may use, such as "512M" or "2G", from 6M, in units of
  // 1024. Empty has no limit.
  string memory = 2;
  // The memory Docker tries to leave it when the server runs short, such as
  // "256M", from 6M and no more than memory. Empty reserves none.
  string memory_reservation = 3;
}

// Rollout says how a deploy replaces a service's running container.
message Rollout {
  // Which comes first, the new container or stopping the old one. Unset takes
  // the safest there is for what the service publishes and mounts: the new one
  // first, unless both would publish one server port, or a volume, a server
  // path or the data its image keeps would be written to by two containers at
  // once.
  RolloutOrder order = 1;
  // How long what is in flight to the old container has to finish once no new
  // request goes to it, such as "1m". Empty takes 30 s. What outlasts it, such
  // as a long-lived WebSocket, ends with the container.
  string drain = 2;
}

// RolloutOrder is which comes first in a deploy.
enum RolloutOrder {
  // The safest there is for what the service publishes and mounts.
  ROLLOUT_ORDER_UNSPECIFIED = 0;
  // The new container first, so nothing stops. On a service that mounts
  // something read-write, this says the app can have two containers writing
  // to it at once for as long as a deploy takes. It can't publish a port.
  ROLLOUT_ORDER_START_FIRST = 1;
  // The old container stops first, so there is downtime, and never two at
  // once, as for a worker that must run alone.
  ROLLOUT_ORDER_STOP_FIRST = 2;
}

// Mount puts a volume, or a directory on the server, into a container.
message Mount {
  // What is mounted: one of the two.
  oneof source {
    // A volume, by name. A service's are volumes in its environment; a
    // container's on its own are Docker's.
    string volume = 1;
    // An absolute path on the server, such as "/srv/uploads".
    string host_path = 2;
    // A file Dockwell writes for it, such as a config file an app ships beside
    // its Compose file, mounted read-only at target, as Compose's configs. It
    // reaches nothing on the server. Numbered in other stores' block, 90 to 99
    // (ADR 0085).
    MountFile file = 90;
  }
  // Where it appears in the container, as an absolute path.
  string target = 3;
  // Mounts it read-only.
  bool read_only = 4;
  // Relabels a server path for SELinux, as Docker's z and Z options do, so
  // the container can use it on a server that enforces SELinux. Only a
  // server path takes one; elsewhere Docker changes nothing.
  Relabel relabel = 5;
  // Says a service's volume is one Dockwell didn't make, by its name in Docker,
  // as one a container came with when it was taken on. It must be on the server
  // already: Dockwell never makes, changes or deletes one. Whatever else mounts it
  // shares what it holds, so mounting one is host access, which a person approves.
  // A container on its own names Docker's volumes already, so it takes none.
  bool external = 6;
  // For a server path: when it isn't there, the folder Dockwell makes for it
  // before the container starts, owned by this user and group, as "uid:gid", such
  // as "82:82", with mode 0755. Docker would make it root's. A folder that's there
  // keeps its owner. For a volume Dockwell made: whom its folder is given to while
  // it holds nothing, once the container is made and before it starts, as Docker
  // makes it root's (ADR 0085). Numbered apart, as open work adds to this message.
  string make_owner = 60;
}

// MountFile is a file Dockwell writes for a container: what it holds, and who
// may read it.
message MountFile {
  // What it holds, 256 KiB at most, as text: a config file, never a secret,
  // which a plan shows.
  string content = 1;
  // Its permissions, such as 0444 (292), the default when 0. It's always
  // read-only in the container, whatever these say.
  uint32 mode = 2;
}

// Relabel is how Docker labels a server path for SELinux when it mounts
// it.
enum Relabel {
  // Not at all: the path keeps its label.
  RELABEL_UNSPECIFIED = 0;
  // Shared, Docker's z: every container may use the path.
  RELABEL_SHARED = 1;
  // Private, Docker's Z: only this container may use it.
  RELABEL_PRIVATE = 2;
}

// Healthcheck says how to check a container is healthy: a command Docker runs
// in the container, or a request the server's agent makes to it. Give one of
// test, http and tcp.
message Healthcheck {
  // A command, as Docker takes it: ["CMD", "curl", "-f", "http://localhost"],
  // ["CMD-SHELL", "curl -f http://localhost || exit 1"], or ["NONE"] to turn
  // off the image's check.
  repeated string test = 1;
  // How often it runs, such as "30s". Empty takes Docker's default for a
  // command, 30 s, and 10 s for http and tcp. At least 1 s for http and tcp.
  string interval = 2;
  // How long one check may take, such as "5s". Empty takes Docker's default
  // for a command, 30 s, and 5 s for http and tcp. At most 1 min for http and
  // tcp.
  string timeout = 3;
  // How long the container has to start before failures count, such as
  // "1m". Empty takes none.
  string start_period = 4;
  // How many failures in a row make it unhealthy. 0 takes 3.
  uint32 retries = 5;
  // A GET the agent sends to the container, on its own network address. Any
  // status from 200 to 399 passes. It works on an image with no shell or curl
  // in it, and turns the image's own check off.
  HttpCheck http = 6;
  // A connection the agent makes to the container, on its own network address.
  // It passes once the port takes it, and turns the image's own check off.
  TcpCheck tcp = 7;
}

// HttpCheck is a GET the agent sends to a container. It can name nothing but
// the container: it says a port and a path, and the address is Docker's.
message HttpCheck {
  // The port the app listens on inside its container, such as 8080.
  uint32 port = 1;
  // The path to ask for, such as "/healthz". Empty asks for "/".
  string path = 2;
  // The Host header to send, for an app that refuses one it doesn't know, such
  // as "app.example.com". Empty sends the container's address.
  string host = 3;
}

// TcpCheck is a connection the agent makes to a container.
message TcpCheck {
  // The port the app listens on inside its container, such as 5432.
  uint32 port = 1;
}

// PortMapping publishes a container port on the server.
message PortMapping {
  // The port on the server.
  uint32 host_port = 1;
  // The port inside the container.
  uint32 container_port = 2;
  // TCP unless set.
  Protocol protocol = 3;
  // The server address it listens on, such as "127.0.0.1". Empty listens on
  // every address.
  string host_ip = 4;
  // It listens on 127.0.0.1 alone, whatever host_ip says, until a person opens
  // its app: an app that starts on an empty database, whose first visitor makes
  // its owner, is closed to strangers until its owner sets it up (ADR 0084).
  // Numbered apart, as open work adds to this message.
  bool held = 80;
}

// RestartPolicy says when Docker restarts a stopped container.
enum RestartPolicy {
  // The driver's default, unless-stopped.
  RESTART_POLICY_UNSPECIFIED = 0;
  // Never restart.
  RESTART_POLICY_NO = 1;
  // Restart when the container exits with an error.
  RESTART_POLICY_ON_FAILURE = 2;
  // Restart unless someone stopped it.
  RESTART_POLICY_UNLESS_STOPPED = 3;
  // Always restart.
  RESTART_POLICY_ALWAYS = 4;
}

// Protocol is a transport protocol.
enum Protocol {
  // TCP, the default.
  PROTOCOL_UNSPECIFIED = 0;
  // TCP.
  PROTOCOL_TCP = 1;
  // UDP.
  PROTOCOL_UDP = 2;
}

// FirewallRule allows or blocks inbound traffic to a port on a server.
message FirewallRule {
  // Allow or block.
  FirewallAction action = 1;
  // TCP unless set.
  Protocol protocol = 2;
  // The port the rule covers.
  uint32 port = 3;
  // Source addresses in CIDR form, such as "203.0.113.0/24". Empty means
  // anywhere.
  repeated string sources = 4;
  // Why the rule exists, shown next to it.
  string comment = 5;
}

// FirewallPolicy is what a server's firewall does with inbound traffic no rule
// lets in, kind "firewall.policy", named "default", one for each server.
// Without one, or with deny_everything_else off, what no rule drops comes in,
// as it did before Dockwell (ADR 0052).
message FirewallPolicy {
  // Drop inbound traffic no rule lets in. What keeps the server reachable is
  // still let in: connections already open, SSH from where people come in now,
  // and on the control server its own ports.
  bool deny_everything_else = 1;
}

// Jail is one of fail2ban's jails on a server, as Dockwell writes it in
// its own file, /etc/fail2ban/jail.d/dockwell.conf, named as the jail is, such
// as sshd (ADR 0052). fail2ban keeps the last value it reads, so a person's
// jail.local can set it otherwise, and the server's Firewall tab says each jail
// as fail2ban runs it.
message Jail {
  // The filter that says what counts as a failure, as fail2ban names it, such
  // as "sshd".
  string filter = 1;
  // The ports a ban closes to the address, such as 22. Empty closes every
  // port.
  repeated uint32 ports = 2;
  // How many failures within find_time ban an address. 0 takes fail2ban's
  // default, 5.
  uint32 max_retry = 3;
  // How far back failures count, such as "10m". Empty takes fail2ban's
  // default, 10 min.
  string find_time = 4;
  // How long a ban lasts, such as "1h". Empty takes fail2ban's default,
  // 10 min.
  string ban_time = 5;
  // True bans for good, in place of ban_time.
  bool ban_for_good = 6;
  // Where it reads failures: "systemd" for the journal, as an SSH jail does on
  // a server with no /var/log/auth.log, or empty for log_paths.
  string backend = 7;
  // The log files it reads failures from, when it doesn't read the journal.
  repeated string log_paths = 8;
  // Addresses or ranges it never bans, such as 203.0.113.0/24, beside the
  // server's own loopback and the control server's addresses, which it never
  // bans either.
  repeated string ignore = 9;
}

// FirewallAction is what a rule does with matching traffic.
enum FirewallAction {
  // Allow, the default.
  FIREWALL_ACTION_UNSPECIFIED = 0;
  // Let it through.
  FIREWALL_ACTION_ALLOW = 1;
  // Drop it.
  FIREWALL_ACTION_DENY = 2;
}

// Project is a product or client in the organization. It holds
// environments, and scopes members, secrets and domains. An install starts
// with one, named "default", which stays out of sight until there is a
// second. Deleting one takes its environments with it, once nothing lives in
// them.
message Project {
  // How the panel shows it, such as "Acme web". Empty shows its name, which
  // URLs and the CLI use.
  string display_name = 1;
  // The catalog entry this project was installed from. Unset for any other
  // project. See docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
  CatalogPin catalog = 2;
  // What this project serves, for a project made as a website. Dockwell writes
  // the route and the services of its environment from it. Unset for any other
  // project. See docs/adr/0039-websites-as-projects-of-their-own.md.
  Website website = 3;
}

// Website is what a website serves at its domain, as a person chose it.
message Website {
  // What it serves: one of these.
  oneof serves {
    // Sends its requests on to a URL, or to a port on the server.
    WebsiteProxy proxy = 1;
    // Serves the files in a folder on the server, as they are.
    WebsiteFolder folder = 2;
    // Runs the PHP in a folder on the server, and serves its other files.
    WebsitePhp php = 3;
  }
}

// WebsitePhp runs the PHP in a folder on the server with PHP-FPM, of the version
// chosen, and serves its other files as they are. Its web server mounts the folder
// read-only and PHP read-write, so a person approves it.
message WebsitePhp {
  // The folder, as an absolute path on the server, such as "/var/www/shop".
  string root = 1;
  // The PHP version, such as "8.3": one Dockwell offers, as ListWebsiteRuntimes
  // says. Empty takes the newest.
  string version = 2;
  // The files a request for a folder gets, the first there is. Empty takes
  // index.php, then index.html.
  repeated string index = 3;
  // Answers a path with no file of its own with a 404, rather than sending it to
  // the folder's index.php, as WordPress, Laravel and most PHP apps want.
  bool files_only = 4;
  // The most a request may send, in MiB, as PHP's M counts, such as an upload: what
  // PHP takes and what the web server lets through. 0 takes 64.
  uint32 upload_limit_mb = 5;
  // Who PHP runs as, as "uid:gid", such as "1000:1000": the folder's owner, so PHP
  // can write in it, and what it writes, such as uploads, keeps its owner. A number
  // alone is taken for both. Empty is www-data, "82:82". Never root's, nor root's
  // group. PHP-FPM's master runs as it too. A folder that isn't there is made as
  // its.
  string user = 6;
}

// WebsiteFolder serves the files in a folder on the server, as they are. Its web
// server mounts the folder read-only, so a person approves it, and edits to the
// files show at once, with nothing to deploy.
message WebsiteFolder {
  // The folder, as an absolute path on the server, such as "/var/www/blog". Its
  // web server reads it as nobody's user, so what it serves must be readable by
  // everyone. Docker makes a folder that isn't there, empty and owned by root.
  string root = 1;
  // The files a request for a folder gets, the first there is, such as
  // "index.html". Empty takes index.html, then index.htm.
  repeated string index = 2;
  // Answers a path with no file of its own with the index at the folder's top, as
  // an app that routes in the browser needs, rather than with a 404.
  bool single_page_app = 3;
  // Who owns the folder Dockwell makes when it isn't there, as "uid:gid", such as
  // "1000:1000", so you can put the site's files in it as yourself. Empty leaves
  // it to Docker, which makes it root's. A folder that's there keeps its owner.
  string owner = 4;
}

// WebsiteProxy sends a website's requests on, to a URL or to a port on the
// server itself. Give one of url and port.
message WebsiteProxy {
  // Where to send them, such as "https://backend.example.com" or
  // "http://10.0.0.5:8080/app": http or https, a host, and a port and a path if
  // it needs them, with no query. A path goes in front of each request's own.
  // It's reached from a container, as any app reaches the internet, so it
  // can't be the server's own loopback: give port for that.
  string url = 1;
  // A port on the server itself, such as 3000, in place of url. Whatever listens
  // there sees every visitor as local, so a person approves it.
  uint32 port = 2;
  // Sends the url's own host as the Host header, in place of the website's
  // domain, as a target that serves several names needs, such as another site
  // over HTTPS. For a url only.
  bool send_target_host = 3;
}

// CatalogPin is what an install is pinned to: updates come from there, and each
// is a plan. It holds no secret: those are the environment's, by reference.
message CatalogPin {
  // The entry's ID, such as "postgres".
  string entry = 1;
  // The app's version as installed, such as "17.11".
  string version = 2;
  // The entry's release as installed, which a newer one's goes past.
  uint32 release = 3;
  // The repository the entry came from, as the control plane knows it: Dockwell's
  // own for its built-in catalog, or a catalog source's. Never what the entry says.
  string repository = 4;
  // The commit it came from: the build's, or the source's when it was installed.
  string commit = 5;
  // What each input that isn't a secret was given, by name, so an upgrade gives
  // the same.
  map<string, string> values = 6;
  // The entry's Compose file at this release, with its ${NAME}s as written, so it
  // holds no secret. Read with values, it's what the file gave, which an upgrade
  // needs to tell that from what a person changed since. Empty for an install from
  // before Dockwell kept it, which can't be upgraded.
  bytes file = 7;
  // The catalog source it came from, by name, or empty for Dockwell's own. An
  // upgrade comes only from the same catalog, at the same repository and folder,
  // whatever else has an entry of its ID (ADR 0055).
  string catalog = 80;
  // The folder in the repository its source reads, for an entry from a source.
  string path = 81;
  // Which of the entry's companions it runs, by service: true for one it runs,
  // false for one left out, so an upgrade keeps the choice. A companion with no
  // word here runs when file has its service, as an install from before
  // companions ran every service, and is otherwise as its entry says.
  map<string, bool> companions = 8;
  // The build's commit it was installed from, for an install made from the catalog
  // built into Dockwell before Dockwell/catalog: Dockwell moved its pin to the
  // source that reads Dockwell/catalog, which its upgrades come from since (ADR
  // 0077). Empty for any other install.
  string built_in_commit = 9;
  // How each of the entry's needs is met, by the need's name, so an upgrade reads
  // the file as the install did and keeps it so. A need with no word here is met
  // by the entry's own service, as an install from before needs ran it. Numbered
  // apart, as 80 and 81 are taken here. See
  // docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  map<string, PinnedNeed> needs = 82;
}

// PinnedNeed is how an install met one of its entry's needs.
message PinnedNeed {
  // The engine that meets it.
  LinkEngine engine = 1;
  // The catalog entry its new service came from, such as "mysql", where it isn't
  // the entry's own service. Empty: the entry's own service meets it.
  string entry = 2;
  // That entry's version and release, as installed.
  string version = 3;
  uint32 release = 4;
  // The catalog source that entry came from, by name.
  string catalog = 5;
  // The service, with its volumes, as that entry's Compose file gave it and the
  // install added it under the need's name, so an upgrade of the app reads it as
  // it was. Its ${NAME}s are the install's, as written, so it holds no secret.
  bytes file = 6;
  // The entry's own service it left out in its place, such as "db", where the
  // entry brings one. Empty where it brings none.
  string service = 7;
  // A server Dockwell runs already that meets it, shared because a person chose
  // it: its environment, by ID, and its service, with the database and user made
  // for the app there and the secret there that holds the user's password. Empty
  // for a new one.
  string environment = 8;
  string meets = 9;
  string database = 10;
  string user = 11;
  string password = 12;
  // The names the need set that hold no password, as the install ran, which its
  // services use as the environment's variables, so a change that reads the file it
  // ran uses them as it did, whatever a newer release names.
  repeated string plain = 13;
}

// Environment is a stage of a project, such as production or staging, with
// its own config. A project starts with one, named "production", which
// stays out of sight until there is a second.
message Environment {
  // How the panel shows it, such as "Staging". Empty shows its name.
  string display_name = 1;
  // Whether a developer's change here waits for an admin or the owner. Every
  // environment Dockwell makes has it written: protected for one named
  // production, open for any other. An edit that leaves it out keeps what's
  // there. Unset, as on an environment from before, it reads as that default
  // by its name (ADR 0049). Making one with other than the default, or
  // changing it, is an admin's.
  Protection protection = 2;
}

// Protection is whether a developer's change in an environment waits for an
// admin or the owner.
enum Protection {
  PROTECTION_UNSPECIFIED = 0;
  // A developer's change waits for an admin or the owner, who applies it with
  // a passkey.
  PROTECTION_PROTECTED = 1;
  // A developer applies their own changes.
  PROTECTION_OPEN = 2;
}

// Service is anything that runs in an environment, placed on servers: for
// now an app from an image, run as one container on each server it is
// placed on, and two while a deploy rolls, with the labels Docker Compose
// gives a service's container, so docker compose sees it. A Compose file becomes services, volumes and
// networks. Websites, databases, catalog apps and jobs come later. Where it
// runs isn't part of the spec: each revision is deployed on its servers.
//
// A service uses its environment's variables and secrets by reference:
// the environment holds each value once, and a service names the ones it
// uses, under the names it expects. So changing a value changes every
// service that uses it, in one plan.
message Service {
  // What runs.
  oneof runs {
    // An app from an image.
    Container app = 1;
  }
  // The environment's variables the service uses, each under the name the
  // service sees it as: DATABASE_HOST=DB_HOST gives the service the
  // variable DB_HOST as DATABASE_HOST. An empty value means the variable of
  // the same name.
  map<string, string> variables = 2;
  // The environment's secrets the service uses, named as for variables.
  // Using a secret doesn't let anyone read it: its value goes only to the
  // servers the service runs on, and only their agents decrypt it.
  map<string, string> secrets = 3;
  // The revision of each variable and secret the service uses, by the name
  // the service sees it as. Dockwell sets it when a change is planned, so a
  // service whose variable or secret changes gets a revision of its own,
  // and restarts with the new value. An edit's is ignored.
  map<string, int64> revisions = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // How Dockwell builds the image the app runs, from source, on the server it
  // runs on. Unset runs the app's image as it is. With it, the app's image is
  // Dockwell's to set: leave it empty, and a change builds one, under a tag of
  // its own, before it replaces what runs. A build that fails leaves what runs
  // as it was. See docs/adr/0046-builds-from-git.md. Numbered apart, as open
  // work adds to this message.
  ImageBuild build = 130;
  // How an app from a folder on the server runs: a language's official image of
  // a version, with the folder mounted, and the commands that install and start
  // it. With it, the parts of app it decides are written from it whenever the
  // spec is checked, whatever an edit sends there: the image, command,
  // entrypoint, working folder, user, the mount at /app, PORT, what's exposed,
  // the check and the capabilities dropped. The rest of app, such as its
  // environment, ports and networks, is the app's own, as an image app's is. See
  // docs/adr/0058-runtimes-an-app-from-a-folder.md.
  Runtime runtime = 150;
  // The updates Dockwell applies to it on its own, and when. Unset applies none:
  // each waits for a person. Numbered apart, as open work adds to this message.
  // See docs/adr/0080-updating-an-app-safely-and-automatically.md.
  AutoUpdate auto_update = 170;
  // Which of its app's own environment variables hold no secret, by name, so a
  // read, a plan and an export show their values as they are. Every other value
  // of app.env stays hidden, as it may be a secret. A catalog install sets it
  // for the values its entry writes that can't be one, by the input that gives
  // each, its name and its shape. An edit that names one here gives its value,
  // and can't keep it without reading it (keep_env), so nobody shows a value
  // they never saw. Names app.env doesn't have are dropped. Only the control
  // plane keeps it: its servers never see it, so changing it alone restarts
  // nothing. See docs/adr/0081-an-apps-own-values-shown-and-its-secrets-kept.md.
  // Numbered apart, as open work adds to this message.
  repeated string shown_env = 180;
}

// AutoUpdate is how Dockwell updates a service on its own: which updates it
// takes, and in what window. Each is Dockwell's own change, on Activity and
// undoable, with a backup of its volumes first, and the rollout's rollback if
// its health check fails, which alerts as any failed change does. A database's
// major release, a version someone skipped, and an update whose plan needs a
// person, such as one with two writers on a volume, are never taken on their own.
message AutoUpdate {
  // Which updates it takes.
  enum Level {
    // None: each waits for a person. The default.
    LEVEL_UNSPECIFIED = 0;
    // A patch release, or a new image of the tag it runs.
    LEVEL_PATCH = 1;
    // A minor release too.
    LEVEL_MINOR = 2;
    // A major release too, but never a database's.
    LEVEL_ANY = 3;
  }
  // Which updates it takes.
  Level level = 1;
  // The days its window opens, as 0 for Sunday to 6 for Saturday. Empty is
  // every day.
  repeated int32 weekdays = 2;
  // When its window opens, as 24-hour HH:MM: "03:00" unless set.
  string at = 3;
  // How long its window stays open, in minutes: 120 unless set, from 15 to
  // 1440. An update starts only while it's open, and runs to its end after.
  uint32 minutes = 4;
  // The time zone at is in, such as "Europe/Amsterdam". Left out, a change that
  // sets it takes the install's time zone, from Settings, and UTC where the
  // install has none.
  string time_zone = 5;
  // Leaves out the backup of its volumes that comes first.
  bool skip_backup = 6;
}

// ImageBuild says how Dockwell builds a service's image from source, with
// BuildKit and a Dockerfile.
message ImageBuild {
  // Where the source is.
  oneof source {
    // A Git repository.
    GitSource git = 1;
  }
  // The folder in the repository the build starts from, such as "web": what a
  // Dockerfile's COPY reads from. Empty is the repository's top.
  string context = 2;
  // The Dockerfile, as a path in context, such as "deploy/Dockerfile".
  // "Dockerfile" unless set.
  string dockerfile = 3;
  // Build arguments, as docker build's --build-arg, such as NODE_ENV=production.
  // They aren't secret: they end up in the image's history, and plans and the
  // panel show them. Keep a credential in secrets.
  map<string, string> args = 4;
  // The environment's secrets the build uses, by the ID a Dockerfile's
  // RUN --mount=type=secret,id=ID names: NPM_TOKEN=NPM gives the build the secret
  // NPM as NPM_TOKEN. An empty value means the secret of the same name. Its value
  // goes only to the server that builds, as a BuildKit secret, never into the
  // image or its history; the build's log and its failure mask it, line by line
  // for one of more than one line. A step that writes it into a file of the
  // image puts it there, as it would with any secret.
  map<string, string> secrets = 5;
  // The stage to build, as docker build's --target. Empty builds the last.
  string target = 6;

  // Builder is what turns the source into an image.
  enum Builder {
    // The Dockerfile, when the commit has one where dockerfile says, and
    // Railpack when it hasn't.
    BUILDER_UNSPECIFIED = 0;
    // The Dockerfile, which the commit must have.
    BUILDER_DOCKERFILE = 1;
    // Railpack (railpack.com), which reads what the source is, such as a Node
    // app from its package.json, and builds it with no Dockerfile. A plan says
    // what it found before anything builds.
    BUILDER_RAILPACK = 2;
  }
  // What builds the image. Unset takes the Dockerfile when there is one.
  Builder builder = 7;
  // With Railpack, the command that builds the app, such as "npm run build",
  // in place of the one it finds.
  string build_command = 8;
  // With Railpack, the command the image starts with, such as "node server.js",
  // in place of the one it finds.
  string start_command = 9;
  // The registry logins its Dockerfile's images pull with, by name, one for each
  // registry: its FROM lines', COPY --from's and RUN --mount from='s. None unless
  // named, as its Dockerfile can read any image a login it's given can read. A
  // login for a registry on the server's loopback can't be given, and a build with
  // logins reads its Dockerfile with Docker's own frontend (ADR 0086). Numbered in
  // the block registry logins hold, 100 to 109.
  repeated string registry_logins = 100;
}

// GitSource is a Git repository Dockwell builds from.
message GitSource {
  // The repository, such as "https://github.com/acme/web.git", over HTTPS, or
  // HTTP on a private network. It can't hold a user, a password or a token.
  string url = 1;
  // The branch or tag to build, such as "main" or "v1.4.2", or a commit's 40
  // hex digits. Empty takes the repository's default branch.
  string ref = 2;
  // The commit the build is of, in full. Dockwell sets it as a change is
  // planned, from what ref names then, unless the edit names one.
  string commit = 3;
}

// Runtime is an app from a folder on the server, run in a language's official
// image of the version chosen, as a person who edits it there wants it.
message Runtime {
  // The language: "node", "python", "go" or "java".
  string language = 1;
  // Its version, such as "24" for Node.js or "3.14" for Python. Empty takes the
  // newest, and is written as it.
  string version = 2;
  // The folder on the server that holds the app, such as "/srv/shop". It's
  // mounted at /app, read-write, as what the app installs goes there. A folder
  // that isn't there is made as user's.
  string folder = 3;
  // What installs what the app needs, run in /app before each start, such as
  // "npm ci". Empty takes the language's: npm ci or npm install, a virtual
  // environment and pip install -r requirements.txt, go build, or ./mvnw
  // package. "-" installs nothing.
  string install = 4;
  // What starts the app, in /app, such as "npm start". Empty takes the
  // language's: npm start, python app.py, the binary go build made, or java
  // -jar app.jar.
  string start = 5;
  // The port the app listens on, which its domain sends to and its check
  // knocks at, given to it as PORT: 3000 for Node.js, 8000 for Python and 8080
  // for Go and Java unless set.
  uint32 port = 6;
  // Who it runs as, as uid:gid, such as "1000:1000": the folder owner's, as
  // the panel fills it in. Never root's.
  string user = 7;
  // What the runtime wrote into the app's environment, by name: PORT, HOME and
  // where the language's tools keep caches, where the app sets nothing of its own.
  // None of it is secret. Dockwell writes it each time the spec is checked.
  map<string, string> wrote = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Variable is a value of an environment that its services use, such as
// LOG_LEVEL=info. It isn't secret: plans, history and the panel show it.
// Keep anything that is in a Secret.
message Variable {
  // The value. Empty when from says where it comes from.
  string value = 1;
  // Where its value comes from, in place of value: a template of the
  // environment's other values, or for a link, another environment's value,
  // which Dockwell writes out as it's sent. Numbered apart, as open work adds to
  // this message. See
  // docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  ValueFrom from = 80;
  // The revision of each value from names, by its name. Dockwell sets it when a
  // change is planned, so a change to what it names changes it too, and every
  // service that uses it. An edit's is ignored.
  map<string, int64> revisions = 81 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Secret is a value of an environment that its services use without anyone
// reading it back, such as a database password. Dockwell keeps it
// encrypted, sends it only to the servers that run a service that uses it,
// and never shows it in plans, history or logs. Revealing it takes a
// passkey, and is audited.
message Secret {
  // The value. Every edit sets it whole. Empty when from says where it comes
  // from.
  string value = 1 [(sensitive) = true];
  // Where its value comes from, in place of value, as a variable's from says. A
  // template that names a secret is a secret's. Numbered apart, as open work adds
  // to this message.
  ValueFrom from = 80 [(no_flag) = true];
  // The revision of each value from names, by its name, as a variable's.
  map<string, int64> revisions = 81 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ValueFrom is where a variable's or a secret's value comes from, rather than
// one it holds: Dockwell writes it out at the revisions its revisions pin, as
// it's sent to a server or revealed, and again whenever what it names changes.
message ValueFrom {
  oneof source {
    // A template of this environment's other values.
    ValueTemplate template = 1;
    // Another environment's value, which only a link writes, as it would
    // otherwise read that environment's secrets with none of what revealing them
    // asks for (ADR 0084).
    ValueRef value = 2;
  }
}

// ValueTemplate is a value written from the environment's other values, such as
// a URL with a password in it.
message ValueTemplate {
  // The text, with ${NAME} where each value goes, and $$ for a $ of its own,
  // such as "postgres://${DB_USER}:${DB_PASSWORD}@${DB_ADDRESS}/${DB_NAME}".
  string text = 1;
  // Each value it names: whether it's a secret, and how it's written where it
  // stands.
  repeated TemplateName names = 2;
}

// TemplateName is a value a template names.
message TemplateName {
  // Its name in the environment, such as "DB_PASSWORD".
  string name = 1;
  // It's a secret, not a variable.
  bool secret = 2;
  // How it's written where it stands.
  Encoding encoding = 3;
}

// Encoding is how a value is written where it stands in a template.
enum Encoding {
  // As it is.
  ENCODING_UNSPECIFIED = 0;
  // Percent-encoded for a URL's user and password, so "app@server" or a password
  // with @, / or # reads as itself.
  ENCODING_USERINFO = 1;
  // Percent-encoded for a URL's path, such as a database's name.
  ENCODING_PATH = 2;
  // Percent-encoded for a URL's query.
  ENCODING_QUERY = 3;
}

// ValueRef is another environment's value.
message ValueRef {
  // The environment, by ID.
  string environment = 1;
  // It's a secret, not a variable.
  bool secret = 2;
  // Its name there.
  string name = 3;
  // The link in this environment that writes it, by name.
  string link = 4;
}

// Volume is a Docker volume in an environment, which its services mount
// by name, as a Compose file's volumes. Deleting one destroys its data,
// though Dockwell keeps it for 7 days first. Docker can't change a volume,
// so its spec can't change once it is made.
message Volume {
  // The volume driver: "local" unless set.
  string driver = 1;
  // The driver's options, such as type, device and o for an NFS mount. They
  // may hold secrets, as a CIFS mount's password goes in o. The local driver
  // takes type none with bind, nfs, nfs4, cifs or tmpfs.
  map<string, string> options = 2 [(sensitive) = true];
  // Labels on the volume, for tools that read them.
  map<string, string> labels = 3;
}

// DatabaseUser is a database inside a database server that a service of its
// environment runs, with the user who owns it, who signs in with a secret of the
// environment. The service runs PostgreSQL, MySQL or MariaDB from its official image,
// and the user and the database are made in its own container, with its own tools,
// on the servers it runs on (ADR 0038). Its name is the user's, such as "shop".
// Setting the secret anew changes the user's password, and deleting one drops the
// user and the database, with everything in it.
message DatabaseUser {
  // The service that runs the database server, by name, such as "db".
  string service = 1;
  // The database the user owns, which is made with them, such as "shop". Empty
  // takes the user's name. It can't change once made.
  string database_name = 2;
  // The environment's secret the user's password is in, by name, such as
  // "SHOP_DATABASE_PASSWORD".
  string password = 3;
  // The revision of the secret the user was given. Dockwell sets it when a change
  // is planned, so setting the secret anew gives the user its new password. An
  // edit's is ignored.
  map<string, int64> revisions = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // A database to copy into the user's as it's made, from another server on the same
  // server, of the same engine, as Use another database copies an app's across (ADR
  // 0084). Copied once, into the empty database made in the same step; unset copies
  // nothing.
  DatabaseCopy copy_from = 80;
  // On a Redis or Valkey other apps share, its user is refused what reaches past
  // the keys it works with, such as KEYS or FLUSHALL, as a shared server's
  // @dangerous commands are. A user of an app's own server isn't. On other engines
  // it changes nothing. See
  // docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
  bool shared = 81;
  // On a Redis or Valkey, the prefix of the keys its user keeps to, such as "shop:":
  // it reaches only keys, and channels, that start with it. Empty reaches every key,
  // as an app that sets no prefix needs. On other engines it changes nothing (ADR
  // 0084).
  string key_prefix = 82;
}

// DatabaseCopy names a database to copy from: the service that runs its server, in
// an environment, and the database's name there.
message DatabaseCopy {
  string environment = 1;
  string service = 2;
  string database = 3;
}

// BackupPolicy backs up a volume in its environment on a schedule, on every server
// that has it, and keeps the newest of those backups. A backup someone takes by
// hand is theirs, and no policy deletes it. The control plane runs the schedule, so
// a run due while it's down happens when it's back.
message BackupPolicy {
  // How often it runs.
  enum Every {
    EVERY_UNSPECIFIED = 0;
    // Each hour, at the minutes of at.
    EVERY_HOUR = 1;
    // Each day, at at. The default.
    EVERY_DAY = 2;
    // Each week, on weekday, at at.
    EVERY_WEEK = 3;
  }

  // The volume, by name, in this environment.
  string volume = 1;
  // How often it runs.
  Every every = 2;
  // The time it runs, as 24-hour HH:MM: "03:00" unless set.
  string at = 3;
  // The day it runs each week, as 0 for Sunday to 6 for Saturday.
  int32 weekday = 4;
  // The time zone at is in, such as "Europe/Amsterdam". Left out, a change
  // that makes or updates the policy sets the install's time zone, from
  // Settings, and UTC where the install has none.
  string time_zone = 5;
  // How many of its backups to keep, on each server, newest first: 7 unless set.
  uint32 keep = 6;
  // Stop what runs on the volume for an exact copy of its files, and start it again
  // after. A database's dump stops nothing. Without it, a copy of a running app's
  // files can hold half a write.
  bool stop = 7;
  // The backup destination each backup also goes to, by name. Empty keeps them on
  // the server alone, so they go if it does.
  string destination = 8;
  // How often a restore drill checks the newest of its backups that read back
  // whole, on each server it runs on: an hour after its own time on its weekday,
  // Sunday for a daily or hourly policy, or an hour after the month's first run
  // (ADR 0068).
  enum Drill {
    // Never, for a policy made before drills. A policy that's new drills weekly
    // unless it says otherwise.
    DRILL_UNSPECIFIED = 0;
    DRILL_NEVER = 1;
    DRILL_WEEKLY = 2;
    DRILL_MONTHLY = 3;
  }
  Drill drill = 9;
  // An app's database alone, in place of a volume: the link in this environment,
  // by its need's name, whose database on whatever server meets it is dumped, as its
  // owner, on the schedule, and kept as its app's page keeps them (ADR 0084). Such
  // a policy stops nothing and has no drills. Numbered apart, as open work adds to
  // this message.
  string link = 80;
}

// BackupDestination is S3-compatible storage that backups go to as well as the
// server's disk, so they outlive it: Amazon S3, Cloudflare R2, Backblaze B2, MinIO
// and the like. It lives in the organization, and any environment's backups can use
// it. A backup is encrypted on its server before it leaves, so the storage never
// reads what it holds. Dockwell keeps this encrypted, and sends it only to the server
// that's sending a backup, for that one call. See
// docs/adr/0033-backups-of-volumes-and-databases.md.
message BackupDestination {
  // The storage's address, such as "https://<account>.r2.cloudflarestorage.com".
  string endpoint = 1;
  // The bucket's region: "auto" unless set.
  string region = 2;
  // The bucket.
  string bucket = 3;
  // What each object's name starts with, such as "dockwell". Empty uses the bucket
  // from the top.
  string prefix = 4;
  // The access key's ID.
  string access_key = 5 [(sensitive) = true];
  // The access key's secret.
  string secret_key = 6 [(sensitive) = true];
  // What backups are encrypted with before they leave. Nothing but this opens them,
  // and dockwell open-backup needs it: keep a copy somewhere that isn't this install.
  // Set it when you add a destination, and leave it out of an update, which keeps it:
  // an update that sets one is refused, as every copy there is sealed with it.
  string passphrase = 7 [(sensitive) = true];
}

// Network is a Docker network in an environment, which its services join
// by name, as a Compose file's networks. A service reaches another on a
// network they share by the other's name. Docker can't change a network,
// so its spec can't change once it is made.
message Network {
  // The network driver: "bridge" unless set.
  string driver = 1;
  // The driver's options.
  map<string, string> options = 2;
  // Cuts the network off from outside the server: only its containers
  // reach each other.
  bool internal = 3;
  // Labels on the network, for tools that read them.
  map<string, string> labels = 4;
  // Services of other environments that join it, as a database shared with an
  // app joins the app's link network, answering there to the app's name for
  // what it needs (ADR 0084). Recorded here, in the app's environment, so the
  // database's own spec never changes for an app: the agent connects and
  // disconnects its running container in place, and joins it again whenever it
  // makes the container anew. Numbered apart, as open work adds to this message.
  repeated NetworkMember members = 80;
  // The network's addresses, such as "10.233.0.8/29", which Dockwell takes from
  // a range it keeps for link networks, as Docker's own pools hold about 30
  // bridge networks on a server. Empty lets Docker choose.
  string subnet = 81;
}

// NetworkMember is a service of another environment that joins a network.
message NetworkMember {
  // Its environment, by ID.
  string environment = 1;
  // Its name there.
  string service = 2;
  // The name it answers to on the network, such as "db".
  string alias = 3;
}

// Route sends a domain's traffic, or a path under it, to a port of a service
// in the route's environment, or to a port on the server itself. It comes over
// HTTPS with a certificate Dockwell gets for the domain, unless tls says TLS
// ends before this server. A server's first route starts its ingress, which
// takes ports 80 and 443, or port 80 alone while no route on the server takes
// a certificate; its last stops it and frees them. See
// docs/adr/0024-the-caddy-ingress-driver.md and
// docs/adr/0030-routes-behind-a-tunnel-or-a-proxy.md.
message Route {
  // The domain, such as "app.example.com": a lowercase DNS name that a
  // public certificate authority issues for. Wildcards aren't taken.
  string domain = 1;
  // The path it covers, such as "/api": that path and what is under it,
  // which reach the service as they are. Empty covers the whole domain.
  string path = 2;
  // The service to send it to, by name, in the route's environment. With
  // host_port it says whose route this is, as the route dials that port rather than
  // the service's container. Empty only for a host_port that is no service's.
  string service = 3;
  // The port the service listens on inside its container, such as 8080. Empty
  // when host_port names a port on the server instead.
  uint32 port = 4;
  // "off" when TLS ends before this server, as at a tunnel or a proxy in front
  // of it: the domain is served over plain HTTP on port 80, with no certificate
  // and no redirect to HTTPS, so its traffic reaches this server unencrypted.
  // Such a route answers only the proxies in trusted_proxies, or with none, this
  // server's own loopback, unless plain_for_anyone says otherwise. Anyone else
  // gets what a name with no route gets. Empty gets a certificate. A domain's
  // routes all take the same setting. A person approves taking a domain that has
  // had a certificate off it.
  string tls = 5;
  // The proxies in front of this server whose word this route takes on where a
  // request came from, each an address, a range such as "203.0.113.0/24", or
  // "cloudflare" for Cloudflare's published ranges. A request from anywhere else
  // has its address taken from the connection, whatever another route on the
  // server names. From an address or a range, X-Forwarded-For is read from the
  // right. From "cloudflare", CF-Connecting-IP is read, as Cloudflare documents,
  // and it's only as sure as Cloudflare says: see docs/security/ingress.md. A
  // person approves each one a change adds, as a proxy that isn't really one makes
  // client addresses forgeable. A range of Cloudflare's is named by the preset, and
  // a public range wider than /12, or /28 in IPv6, or a private one wider than /8,
  // isn't taken.
  repeated string trusted_proxies = 6;
  // A port on the server itself, such as 8080, in place of port, for a service on
  // the server's own network, which a route can't send to by name, or with no service
  // at all, for something that isn't a Dockwell service. The proxy dials 127.0.0.1 on it,
  // so what's there sees every caller as local. It reaches past containers, so a
  // person approves it, and any change to where it answers. Dockwell's own ports,
  // and Docker's API, on 2375, 2376 or wherever dockerd listens, aren't taken.
  uint32 host_port = 7;
  // True for a route that says tls off to answer anyone who can reach this
  // server's port 80, as for a site on a private network, or a load balancer whose
  // addresses aren't known. It goes around whatever is in front, so a person
  // approves it.
  bool plain_for_anyone = 8;
  // Held: the route answers that the app isn't open yet, and sends nothing on, until
  // a person opens it, as an app whose first visitor makes its owner is held while it
  // starts on an empty database, so its owner sets it up first, opening it through
  // the panel (ADR 0084).
  bool held = 80;
  // How the domain proves itself for its certificate (ADR 0088): empty for
  // automatic, which is DNS-01 where a DNS provider whose zone holds it serves the
  // route's project and the internet can't reach this server at the name, and
  // HTTP-01 otherwise; "http" for HTTP-01 or TLS-ALPN-01 by the server's own
  // proxy; "dns" for DNS-01 by the control plane. Every route of a domain says the
  // same. Numbered in the block DNS-01 holds, 120 to 129.
  string proof = 120;
  // Who gets in: only the addresses on a list, only those who sign in with a
  // password, or both. Unset, the route answers whoever reaches it. A person
  // approves any change that lets in someone it kept out. Numbered apart, as open
  // work adds to this message. See docs/adr/0087-private-routes.md.
  RouteAccess access = 110;
}

// RouteAccess is who a route lets in. With a list and users, a visitor must be on
// the list and sign in; off the list they get 403 before a password is asked.
message RouteAccess {
  // The addresses and ranges that get in, IPv4 and IPv6, such as "203.0.113.7" or
  // "2001:db8:1::/64", up to 64. Anyone else gets 403 Forbidden. The client is the
  // one the route believes: the peer on the connection, or what a proxy it names
  // says. A route that names Cloudflare's preset, or that takes no certificate and
  // names no proxy, as behind a tunnel on the server's own network, can't have a
  // list, as it can't tell its visitors apart; passwords work there.
  repeated string allow = 1;
  // Who may sign in, with a name and a password, up to 20. Anyone without one is
  // asked, with 401. An edit that names a user without a password keeps the one
  // they have.
  repeated RouteUser users = 2;
}

// RouteUser is someone who may sign in to a private route.
message RouteUser {
  // Their name: letters, digits, ".", "_" and "-", up to 64.
  string name = 1;
  // A new password, at least 12 characters, given in an edit. It's hashed before
  // anything keeps it, and never stored or shown.
  string password = 2 [(sensitive) = true];
  // The bcrypt hash of their password, which is what's kept. A client may give one
  // itself, as from an htpasswd file, in place of password.
  string password_hash = 3 [(sensitive) = true];
}

// CatalogSource is a catalog Dockwell reads apps from, beside its own: a folder of
// entries in its format in a public Git repository, or another store's, at one
// commit, with the images its entries name in the folder media inside it. Moving it
// to another commit is a change, so what anyone can install from it moves only with
// a plan: a person's, or for one that follows a branch, Dockwell's own, which can be
// undone. Nothing installed changes with it. See
// docs/adr/0055-catalogs-from-a-git-url.md,
// docs/adr/0077-dockwells-catalog-in-its-own-repository.md and
// docs/adr/0078-other-stores-read-on-the-server.md.
message CatalogSource {
  // The repository's URL, over HTTPS, such as
  // "https://github.com/example/catalog".
  string repository = 1;
  // The folder of entries in it, one <id>.yaml each, such as "entries", or the
  // folder that holds another store's, such as its top for 1Panel's app store.
  // Empty is its top.
  string path = 2;
  // The commit it's read at, in full, as 40 hex digits.
  string commit = 3;
  // The branch it follows, such as "main": when the branch moves, Dockwell moves
  // the source to its new commit by a change of its own. Empty stays at commit
  // until a person moves it.
  string follow = 4;
  // How its folder is laid out: Dockwell's own entries, or another store's, which
  // Dockwell converts as it reads them. Unspecified is Dockwell's own, as a source
  // made before formats has it.
  CatalogFormat format = 10;
}

// CatalogFormat is how a catalog's folder is laid out (ADR 0078).
enum CatalogFormat {
  // Dockwell's own, for a source made before formats.
  CATALOG_FORMAT_UNSPECIFIED = 0;
  // Dockwell's own entries, one <id>.yaml each.
  CATALOG_FORMAT_DOCKWELL = 1;
  // 1Panel's app store: apps/<key>/data.yml, and a folder for each version.
  CATALOG_FORMAT_ONEPANEL = 2;
  // Dokploy's templates: blueprints/<id>/, each with template.toml.
  CATALOG_FORMAT_DOKPLOY = 3;
  // Coolify's templates: templates/compose/<id>.yaml.
  CATALOG_FORMAT_COOLIFY = 4;
  // Runtipi's app store: apps/<id>/config.json beside its docker-compose.yml (ADR 0083).
  CATALOG_FORMAT_RUNTIPI = 5;
  // CasaOS's app store: Apps/<name>/docker-compose.yml, with x-casaos (ADR 0083).
  CATALOG_FORMAT_CASAOS = 6;
  // Umbrel's app store: <id>/umbrel-app.yml beside its docker-compose.yml (ADR 0083).
  CATALOG_FORMAT_UMBREL = 7;
}

// Spec is the desired state of one resource, of any kind: the field that is
// set says which. Edits in the API carry specs in it, so one message takes
// every kind.
message Spec {
  // The kind's spec.
  oneof kind {
    // A project, kind "project".
    Project project = 1;
    // An environment, kind "environment".
    Environment environment = 2;
    // A service, kind "service".
    Service service = 3;
    // A container run by hand on a server, kind "container".
    Container container = 4;
    // A firewall rule on a server, kind "firewall.rule".
    FirewallRule firewall_rule = 5;
    // What a server's firewall does with what no rule lets in, kind
    // "firewall.policy". Numbered apart, as open work adds to this message.
    FirewallPolicy firewall_policy = 40;
    // One of fail2ban's jails on a server, kind "fail2ban.jail". Numbered
    // apart, as open work adds to this message.
    Jail fail2ban_jail = 41;
    // A volume in an environment, kind "volume".
    Volume volume = 6;
    // A network in an environment, kind "network".
    Network network = 7;
    // A variable of an environment, kind "variable".
    Variable variable = 8;
    // A secret of an environment, kind "secret".
    Secret secret = 9;
    // A domain or path sent to a service, kind "route".
    Route route = 10;
    // A schedule of backups of a volume, kind "backup.policy". Numbered apart,
    // as open work adds to this message.
    BackupPolicy backup_policy = 20;
    // S3-compatible storage backups go to, kind "backup.destination".
    BackupDestination backup_destination = 21;
    // A database and the user who owns it, in a database server a service runs,
    // kind "database.user". Numbered apart, as open work adds to this message.
    DatabaseUser database_user = 30;
    // What Dockwell watches for, and who it tells, kind "alert.rule". Numbered
    // apart, as open work adds to this message.
    AlertRule alert_rule = 110;
    // Where alerts are sent, kind "alert.channel".
    AlertChannel alert_channel = 111;
    // An address checked for whether it answers, kind "alert.check" (ADR 0066).
    AlertCheck alert_check = 112;
    // A catalog read from a Git repository, kind "catalog.source". Numbered
    // apart, as open work adds to this message.
    CatalogSource catalog_source = 80;
    // A server's host: what Dockwell does to the server itself, kind
    // "server.host", one for each server, named "host". Its spec is empty for
    // now; installing updates is a flagged edit of it, which makes no revision
    // (ADR 0064).
    ServerHost server_host = 113;
    // Work that runs on a schedule, kind "task". Numbered in the block scheduled
    // tasks hold, as open work adds to this message.
    Task task = 150;
    // How one of an app's needs is met, kind "link" (ADR 0084). Numbered apart,
    // as open work adds to this message.
    Link link = 81;
    // What signs in to a container registry, kind "registry.login". Numbered in
    // the block registry logins hold, 100 to 109.
    RegistryLogin registry_login = 100;
    // What writes a DNS zone's records, so the control plane can prove a name by
    // DNS-01, kind "dns.provider" (ADR 0088). Numbered in the block DNS-01 holds,
    // 120 to 129.
    DnsProvider dns_provider = 120;
    // A certificate the control plane proves by DNS-01, for a wildcard or for
    // names the internet can't reach, kind "certificate" (ADR 0088). Numbered in
    // the block DNS-01 holds, 120 to 129.
    DnsCertificate certificate = 121;
  }
}

// DnsCertificate is a certificate the control plane proves by DNS-01 through a DNS
// provider, and renews, kind "certificate": for a wildcard, such as *.example.com,
// or for names the internet can't reach to prove over HTTP. Routes whose domains it
// covers, in the projects it serves, are served with it on any server, and its key
// goes to those servers alone. It lives in the organization, and only an admin
// makes one. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
message DnsCertificate {
  // The names it covers, such as "*.example.com" and "example.com". A wildcard
  // covers one label, as a certificate authority issues it.
  repeated string domains = 1;
  // The DNS provider that proves them, by name. Each name must be in one of its
  // zones.
  string dns_provider = 2;
  // The projects whose routes it serves, by ID. Empty is none, so making one gives
  // no server its key until an admin says which projects.
  repeated string projects = 3;
}

// DnsProvider is what writes the records of one or more DNS zones through a DNS
// provider's API, so the control plane can prove a name by DNS-01 and get its
// certificate, kind "dns.provider". It lives in the organization, and only an
// admin adds, changes or removes one. Its token stays on the control plane, and
// goes to no server. See docs/adr/0088-certificates-by-dns-01-and-wildcard-domains.md.
message DnsProvider {
  // Which provider's API: "cloudflare".
  string provider = 1;
  // The zones it writes in, such as "example.com", each checked before it's
  // saved.
  repeated string zones = 2;
  // The provider's API token: for Cloudflare, an API token with Zone:Read and
  // DNS:Edit, scoped to its zones, not the Global API Key. Leave it out of an
  // update to keep it.
  string api_token = 3 [(sensitive) = true];
  // The projects whose routes' names it proves, by ID. Empty is none: proving a
  // name by DNS works wherever it points, so an admin says which projects may.
  repeated string projects = 4;
}

// RegistryLogin is what signs in to a container registry, so an app can pull an
// image the registry keeps private, and its update check and the image field can
// read it, kind "registry.login". It lives in the organization; an admin decides
// which projects' apps may pull with it. Dockwell keeps it encrypted, and sends it
// only to the server that pulls or reads an image from that registry, for that one
// call; from there it goes to the registry and to the token service it was saved
// with, and nowhere else. See
// docs/adr/0086-registry-logins-for-private-images.md.
message RegistryLogin {
  // The registry's host, as an image names it, such as "docker.io", "ghcr.io",
  // "registry.gitlab.com" or "registry.example.com:5000"; for Amazon ECR,
  // "<account>.dkr.ecr.<region>.amazonaws.com".
  string registry = 1;
  // Who signs in. Unset for ECR, which signs in as AWS.
  string username = 2;
  // A password, or better a token that only reads images. Unset for ECR. Leave it
  // out of an update to keep it.
  string password = 3 [(sensitive) = true];
  // For Amazon ECR, in place of username and password: an access key that may
  // get ECR's sign-in token, which stays on the control plane.
  RegistryLoginEcr ecr = 4;
  // The host the registry sent a client to for its token when the login was
  // checked, such as "auth.docker.io": the only place beside the registry the
  // login is sent. Empty for a registry that signs in itself.
  string token_host = 5;
  // The projects whose apps may pull with it, by ID. Empty for every project.
  repeated string projects = 6;
}

// RegistryLoginEcr is an AWS access key that may call ECR's GetAuthorizationToken.
message RegistryLoginEcr {
  // The key's ID.
  string access_key = 1 [(sensitive) = true];
  // The key's secret. Leave it out of an update to keep it.
  string secret_key = 2 [(sensitive) = true];
  // The region the registry is in, such as "eu-west-1".
  string region = 3;
}

// Task is work that runs on a schedule, on each server it's placed on, kind "task"
// (ADR 0053): a shell command on the server, a command in an app's image, or an
// HTTP request. Each server's agent keeps its time, so a task runs while the
// control plane is away.
message Task {
  // What it runs.
  oneof runs {
    // A shell command on the server, which the agent runs as root. Making one, or
    // changing what it runs, takes a person and a passkey.
    TaskShell shell = 1;
    // A command in an app's image, as a one-off container with the app's
    // environment, mounts and networks.
    TaskApp app = 2;
    // An HTTP request to a URL, from the server.
    TaskRequest request = 3;
  }
  // When it runs, in cron's five fields, minute, hour, day of the month, month and
  // day of the week, such as "0 4 * * *", or @hourly, @daily, @weekly, @monthly or
  // @yearly. Nothing runs more often than once a minute.
  string schedule = 4;
  // The time zone schedule is in, such as "Europe/Amsterdam". Left out, a change
  // that makes or updates the task sets the install's time zone, from Settings,
  // and UTC where the install has none.
  string time_zone = 5;
  // How long a run may take, in seconds, before it's stopped: 600 unless set, at
  // most 86400.
  uint32 timeout_seconds = 6;
  // How many more times a run that fails or times out tries, a minute apart: 0
  // to 3.
  uint32 retries = 7;
  // Keeps it from running on its schedule. Run now still runs it.
  bool paused = 8;
  // Skips a run missed while its server was off or its agent stopped, rather than
  // running it once when the agent starts.
  bool skip_missed = 9;
  // What people call it, such as "Nightly sales report". Its name when empty.
  string display_name = 10;
}

// TaskShell is a shell command on the server.
message TaskShell {
  // The command, run with /bin/sh -c, such as "find /var/log/app -mtime +7 -delete".
  string command = 1;
  // The folder it runs in: / unless set.
  string working_dir = 2;
}

// TaskApp is a command in an app's image.
message TaskApp {
  // The app, by name, in the task's environment.
  string service = 1;
  // The command, as words split as a shell splits them, run after the app's
  // entrypoint in place of its command, such as "/app/api report sales". It runs
  // without a shell unless it names one.
  string command = 2;
}

// TaskRequest is an HTTP request to a URL. A run keeps the status, the time it
// took and the size of the answer, never the body.
message TaskRequest {
  // The URL, http or https.
  string url = 1;
  // GET unless set, or HEAD or POST, with no body.
  string method = 2;
  // The status it expects, such as 204. Any 2xx unless set.
  uint32 expect_status = 3;
}

// AlertRule is something Dockwell watches for, on every server or app it
// applies to, and who it tells when it holds. It lives in the organization, and
// the control plane evaluates it, from what it hears of servers already. See
// docs/adr/0044-alerts.md.
message AlertRule {
  // What it watches for.
  enum Condition {
    CONDITION_UNSPECIFIED = 0;
    // A service isn't running, or fails its health check.
    CONDITION_SERVICE_DOWN = 1;
    // The control plane hasn't heard from a server's agent.
    CONDITION_SERVER_UNREACHABLE = 2;
    // A server's disk is fuller than threshold percent.
    CONDITION_DISK_FULL = 3;
    // A server's memory is more in use than threshold percent.
    CONDITION_MEMORY_HIGH = 4;
    // A domain's certificate expires within threshold days.
    CONDITION_CERTIFICATE_EXPIRING = 5;
    // A domain's certificate couldn't be issued or renewed.
    CONDITION_CERTIFICATE_FAILED = 6;
    // A volume's last backup failed, or its copy didn't reach its destination.
    CONDITION_BACKUP_FAILED = 7;
    // A backup schedule's run is later than duration says it may be.
    CONDITION_BACKUP_LATE = 8;
    // A change failed or rolled back, a deploy among them.
    CONDITION_CHANGE_FAILED = 9;
    // An address a check watches doesn't answer as it should, as many runs in a
    // row as the check says (ADR 0066).
    CONDITION_CHECK_DOWN = 10;
    // The newest backup of a volume that has been drilled failed its drill: it
    // didn't restore, or didn't hold what it should (ADR 0068).
    CONDITION_RESTORE_DRILL_FAILED = 20;
    // A policy that drills has gone two of its periods without a drill that
    // passed, whether its drills weren't checked or never ran (ADR 0068).
    CONDITION_RESTORE_DRILL_LATE = 21;
    // A catalog source that follows a branch couldn't move to the branch's
    // commit: the branch or its commit can't be read, or all of that commit's
    // entries fail Dockwell's checks (ADR 0077). Numbered apart, as open work
    // adds conditions.
    CONDITION_CATALOG_SOURCE_STUCK = 30;
    // An app has an update that counts: newer than what it runs, not skipped,
    // and not snoozed (ADR 0079). threshold 3 fires for a major alone; 0, for
    // any. Numbered apart, as open work adds to this enum.
    CONDITION_UPDATE_AVAILABLE = 40;
  }
  // How much it matters, which a message says and a channel can choose by.
  enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    // Someone should look soon. The default.
    SEVERITY_WARNING = 1;
    // Something is down, or is about to be.
    SEVERITY_CRITICAL = 2;
  }
  // What it watches for.
  Condition condition = 1;
  // The level, for a condition that has one: a percent for disk and memory, 1 to
  // 100, days for a certificate, 1 to 90, and for an update, 3 for majors alone
  // or 0 for any. Others leave it 0.
  uint32 threshold = 2;
  // How long the condition holds before the alert fires, such as "5m". Empty
  // fires at once. For a late backup, how long after its time a run may start.
  string duration = 3;
  // How much it matters: warning unless set.
  Severity severity = 4;
  // The channels it sends to, by name. Empty sends to every channel, so a rule
  // tells someone as soon as there is one.
  repeated string channels = 5;
  // Sends an alert that's still firing again this often, such as "4h". Empty
  // sends it once, and once more when it resolves.
  string repeat = 6;
  // Keeps the rule without evaluating it.
  bool disabled = 7;
}

// AlertCheck is an address Dockwell asks, every so often, whether it answers as
// it should: an uptime check. It lives in the organization, and the control
// plane runs it. A run is one GET, with no redirect followed, that keeps nothing
// of the answer but its status, how long it took, and whether the keyword was
// there. See docs/adr/0066-checks-of-a-url.md.
message AlertCheck {
  // The address it asks, an http or https URL, such as
  // "https://shop.example.com/".
  string address = 1;
  // How often it's checked: "30s", "1m", "5m" or "15m". "1m" unless set.
  string every = 2;
  // How long a run waits for an answer: "10s" unless set, at most "30s", and
  // less than every.
  string timeout = 3;
  // How many runs in a row have to fail for it to read down: 2 unless set, 1 to 10.
  // Down, it reads up again after 2 runs in a row pass.
  uint32 down_after = 4;
  // The lowest status that counts as up: 200 unless set.
  uint32 expect_from = 5;
  // The highest status that counts as up: 399 unless set, so a redirect is up.
  uint32 expect_to = 6;
  // Text the answer's first 64 KiB has to hold, when set, such as "Welcome".
  string keyword = 7;
  // Says the keyword has to be absent instead, such as "Error".
  bool keyword_absent = 8;
  // Lets the check reach the private networks the control server is on, such as
  // an address only the office's network serves. Unset, it reaches the internet
  // alone, keyword included, and a name that resolves to a private address reads
  // failing with how to allow it. Never this server's loopback, nor a metadata or
  // link-local address. Plans, the Checks tab and Activity show it (ADR 0066).
  bool inside_network = 9;
}

// AlertChannel is somewhere alerts are sent. It lives in the organization. What
// signs in to it is sealed, and a plan says only that it changed (ADR 0022).
message AlertChannel {
  // Where it sends.
  oneof to {
    // An HTTP endpoint of your own, sent JSON.
    AlertWebhook webhook = 1;
    // Email, through an SMTP server.
    AlertEmail email = 2;
    // A topic on an ntfy server, which pushes to phones.
    AlertNtfy ntfy = 3;
    // A Slack channel, through an incoming webhook.
    AlertSlack slack = 4;
    // A Discord channel, through a webhook.
    AlertDiscord discord = 5;
    // A Telegram chat, through a bot.
    AlertTelegram telegram = 6;
  }
}

// AlertWebhook sends each alert, and each that resolves, as JSON in a POST.
message AlertWebhook {
  // The URL, such as "https://hooks.example.com/dockwell". It may hold a token,
  // so it's sealed, and lists show only its host.
  string url = 1 [(sensitive) = true];
  // What signs each request, in a Dockwell-Signature header, so the endpoint
  // can tell it came from this install. Empty signs nothing.
  string secret = 2 [(sensitive) = true];
}

// AlertEmail sends each alert as an email, through an SMTP server such as your
// mail provider's. Dockwell talks TLS to it, unless it's on this server or its
// private network, and sends its password only over TLS.
message AlertEmail {
  // How Dockwell secures its connection to the SMTP server.
  enum Security {
    // STARTTLS, unless set.
    SECURITY_UNSPECIFIED = 0;
    // A plain connection that STARTTLS makes TLS, as on port 587.
    SECURITY_STARTTLS = 1;
    // TLS from the start, as on port 465.
    SECURITY_TLS = 2;
    // No TLS: only for a server on this server or its private network.
    SECURITY_NONE = 3;
  }
  // The SMTP server's name or address, such as "smtp.example.com".
  string host = 1;
  // Its port: 587 for STARTTLS and 465 for TLS unless set, and 25 for none.
  uint32 port = 2;
  // How Dockwell secures the connection.
  Security security = 3;
  // Who Dockwell signs in as, when the server asks for that. Empty signs in as
  // no one.
  string username = 4;
  // The password Dockwell signs in with. Changing the server, its port, its
  // security or the user needs it again.
  string password = 5 [(sensitive) = true];
  // Who the emails come from, such as "Dockwell <alerts@example.com>".
  string from = 6;
  // Who they go to, such as "ops@example.com": one to ten addresses.
  repeated string to = 7;
}

// AlertNtfy publishes each alert to a topic on an ntfy server, such as ntfy.sh
// or one of your own, which pushes it to the phones that subscribe.
message AlertNtfy {
  // The server, such as "https://ntfy.sh", which it is unless set.
  string server = 1;
  // The topic, such as "dockwell-alerts-x7f2". On a public server anyone who
  // knows it can read what's sent, so it's sealed like a password, and lists
  // show only the server.
  string topic = 2 [(sensitive) = true];
  // An access token, for a server or topic that asks for one. Changing the
  // server needs it again.
  string token = 3 [(sensitive) = true];
}

// AlertSlack posts each alert to a Slack channel, through an incoming webhook
// a Slack app gives.
message AlertSlack {
  // The webhook's URL, such as "https://hooks.slack.com/services/T000/B000/XXXX".
  // It's what lets anyone post there, so it's sealed, and lists show only its
  // host.
  string url = 1 [(sensitive) = true];
}

// AlertDiscord posts each alert to a Discord channel, through a webhook the
// channel's settings give.
message AlertDiscord {
  // The webhook's URL, such as "https://discord.com/api/webhooks/0000/XXXX".
  // It's what lets anyone post there, so it's sealed, and lists show only its
  // host.
  string url = 1 [(sensitive) = true];
}

// AlertTelegram sends each alert to a Telegram chat, as a bot you made with
// @BotFather.
message AlertTelegram {
  // The bot's token, such as "123456789:AAE…", which BotFather gives.
  string bot_token = 1 [(sensitive) = true];
  // The chat, by its ID, such as "-1001234567890" for a group, or a channel's
  // name, such as "@example_alerts". The bot has to be in it.
  string chat_id = 2;
}

// ServerHost is a server's host, kind "server.host": one for each server, named
// "host", made as the server joins. Installing its updates is an edit of it that
// makes no revision, as a restart of a service is, with a plan, a passkey and an
// admin (ADR 0064). Later settings of the server itself, such as whether it
// installs updates by itself, become fields here.
message ServerHost {
  // Its labels, such as region:eu and pool:web, by key, as Kubernetes labels:
  // what the fleet groups and selects servers by. The control plane keeps them,
  // and the server never sees them, so a change of them alone takes no step there.
  // See docs/adr/0091-server-labels.md. Numbered in the block labels hold, 20 to
  // 29.
  map<string, string> labels = 20;
}

// Link is how one of an app's needs is met, such as its database: what meets it,
// and the variables and secrets it sets in its environment, which the app's
// services use by name. It lives in the app's environment, named for the need,
// such as "db", and runs on no server: the control plane holds it. See
// docs/adr/0084-what-an-app-needs-met-by-a-new-service-one-you-run-or-a-connection.md.
message Link {
  // What people call the need, such as "Database".
  string label = 1;
  // The service that meets it, by name, in this environment.
  string service = 2;
  // The engine that service runs, and its version as the link was made.
  LinkEngine engine = 3;
  string version = 4;
  // The engines and versions the app takes, so a later change to either end is
  // checked against them.
  repeated LinkAccept accepts = 5;
  // The database and the user who owns it, on what meets it, which the app signs
  // in as. Empty for an engine with no users of its own here, such as Redis.
  string database_name = 6;
  string user = 7;
  // The names it sets in this environment, and what each holds. A plain part is
  // a variable, and the password, or a URL with it, a secret.
  repeated LinkSet sets = 8;
  // The app keeps the password it installed with, so a rotation of it is
  // refused.
  bool set_once = 9;
  // The environment of the service that meets it, by ID, when that isn't this
  // one: a server in another project, shared because a person chose it, on which
  // Dockwell made the app a database and a user of its own. Named apart from the
  // CLI's own --environment, which says where the link is.
  string meets_environment = 10;
}

// LinkAccept is an engine a link's app takes, at the versions it takes.
message LinkAccept {
  LinkEngine engine = 1;
  // Comparators on dotted numbers, such as ">=10.6 <12". Empty takes any.
  string versions = 2;
}

// LinkSet is a name a link sets in its environment, and what it holds.
message LinkSet {
  // The name, such as "DB_HOST".
  string name = 1;
  // What it holds.
  LinkPart part = 2;
  // How a URL is written, with {host}, {port}, {address}, {database}, {user} and
  // {password}, and {tls}, as the app's entry gave it. Empty is the engine's own
  // form.
  string template = 3;
  // The app's words for TLS on and off, for a TLS part or {tls}.
  string tls_on = 4;
  string tls_off = 5;
}

// LinkEngine is what runs a database, as Dockwell knows it (ADR 0038). Its numbers
// are the catalog format's own Engine's.
enum LinkEngine {
  LINK_ENGINE_UNSPECIFIED = 0;
  LINK_ENGINE_POSTGRESQL = 1;
  LINK_ENGINE_MYSQL = 2;
  LINK_ENGINE_MARIADB = 3;
  LINK_ENGINE_REDIS = 4;
  LINK_ENGINE_VALKEY = 5;
  LINK_ENGINE_MONGODB = 6;
  LINK_ENGINE_CLICKHOUSE = 7;
}

// LinkPart is what a name a link sets holds. Its numbers are the catalog format's
// own Part's.
enum LinkPart {
  LINK_PART_UNSPECIFIED = 0;
  LINK_PART_HOST = 1;
  LINK_PART_PORT = 2;
  LINK_PART_ADDRESS = 3;
  LINK_PART_DATABASE = 4;
  LINK_PART_USER = 5;
  LINK_PART_PASSWORD = 6;
  LINK_PART_URL = 7;
  LINK_PART_TLS = 8;
  LINK_PART_KEY_PREFIX = 40;
}

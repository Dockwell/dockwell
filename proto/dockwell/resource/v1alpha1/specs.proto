// SPDX-License-Identifier: Apache-2.0

syntax = "proto3";

// Resource specs: the desired state of each kind of resource Dockwell
// manages. See docs/adr/0009-resources-revisions-and-plans.md. The package
// is alpha while the model settles, so it may change without notice.
package dockwell.resource.v1alpha1;

import "google/api/field_behavior.proto";
import "google/protobuf/descriptor.proto";

extend google.protobuf.FieldOptions {
  // True for fields that may hold secrets. Plans, history and logs say that
  // such a field changed, but never show its value, and the revision store
  // keeps every spec of a kind that has one encrypted (ADR 0022).
  bool sensitive = 51001;
}

// Container is one Docker container: run by hand on a server, or a
// service's app. Docker fills in from the image what a container leaves
// out, such as its command or working directory, and that isn't drift.
message Container {
  // The image to run, such as "ghcr.io/acme/web:1.4.2".
  string image = 1;
  // Overrides the image's command when set.
  repeated string command = 2;
  // Environment variables, which may hold secrets.
  map<string, string> env = 3 [(sensitive) = true];
  // Ports published on the server.
  repeated PortMapping ports = 4;
  // What Docker does when the container stops.
  RestartPolicy restart = 5;
  // Labels on the container, for tools that read them. Keys that start with
  // "com.docker.compose." or "dev.dockwell." are Dockwell's own.
  map<string, string> labels = 6;
  // Overrides the image's entrypoint when set. Empty takes the image's;
  // no_entrypoint runs none.
  repeated string entrypoint = 7;
  // Volumes and server paths mounted into the container.
  repeated Mount mounts = 8;
  // The networks the container joins, by name. A service's are networks in
  // its environment; a container's on its own are Docker's. Empty joins
  // Docker's default bridge network.
  repeated string networks = 9;
  // The user the command runs as, such as "1000" or "node". Empty takes the
  // image's.
  string user = 10;
  // The directory the command runs in. Empty takes the image's.
  string working_dir = 11;
  // How Docker checks the container is healthy. Unset takes the image's
  // check, if it has one.
  Healthcheck healthcheck = 12;
  // Runs no entrypoint, not even the image's, as Compose's "entrypoint: []"
  // does: the command runs on its own. Takes no entrypoint beside it.
  bool no_entrypoint = 13;
  // How long the container has to stop before Docker kills it, in whole
  // seconds, such as "30s", as Compose's stop_grace_period. Empty takes
  // Docker's default of 10 s.
  string stop_grace_period = 14;
  // How a deploy replaces a service's running container. A container on its
  // own takes none: it is stopped, then made again. See
  // docs/adr/0027-health-checks-rollouts-and-rollback.md.
  Rollout rollout = 15;
  // Networks a service joins that Dockwell didn't make, by their names in
  // Docker, such as "1panel-network". Each must be on the server already:
  // Dockwell never makes, changes or deletes one. Whatever else is on it can
  // reach the service, so joining one is host access, which a person approves.
  // A container on its own names Docker's networks in networks.
  repeated string external_networks = 20;
  // Runs a service on the server's own network, with none of its own, as
  // Compose's "network_mode: host" does. It is host access, and takes no
  // networks, ports or aliases. A container on its own names "host" in networks.
  bool host_network = 21;
  // Other names containers on a service's networks reach it by, beside its
  // service's name, such as a Compose file's container_name. No two services
  // on a network can answer to one name.
  repeated string aliases = 22;
  // What it may use of the server's CPU and memory. Unset has no limits.
  Resources resources = 23;
  // Linux capabilities it gets beyond Docker's default ones, such as
  // "NET_ADMIN", or "ALL". It is host access.
  repeated string cap_add = 24;
  // Linux capabilities it gives up, such as "NET_RAW", or "ALL".
  repeated string cap_drop = 25;
  // Groups its command joins beside its user's, by name or number, such as
  // "audio" or "999". It is host access: joining the group that owns Docker's
  // socket is the same as root.
  repeated string group_add = 26;
  // Runs it with every device and capability on the server, the same as root.
  // It is host access.
  bool privileged = 27;
  // How many times on-failure restarts it before giving up. 0 has no limit.
  // Only on-failure takes one.
  uint32 restart_retries = 28;
  // Which of "command", "entrypoint" and "healthcheck.test" name values rather
  // than hold them. In a field listed here, ${NAME} is the value of NAME in the
  // container's environment, or of what its service uses under that name, and
  // $$ is a $ of its own, as in a Compose file. So a plan, an export and what
  // an agent reports show the name, a rotation reaches it, and the value is
  // written in only as the container is made. In any other field, a $ is a $.
  repeated string references = 29;
  // The size of its /dev/shm, such as "1G", in units of 1024, as Compose's
  // shm_size. What it holds counts against resources.memory. Empty takes
  // Docker's default of 64M, which is too little for Chromium on a heavy page.
  string shm_size = 30;
  // Filesystems held in memory at paths in the container. What is in one goes
  // when the container does, so a deploy starts it empty.
  repeated Tmpfs tmpfs = 31;
  // Ports it exposes to what shares a network with it, beyond what its image exposes
  // and what it publishes, such as "3000/tcp". It opens nothing on the server. What
  // finds containers through Docker reads it, as Traefik does for the port to reach.
  repeated string expose = 32;
}

// Tmpfs is a filesystem held in memory, at a path in a container.
message Tmpfs {
  // Where it appears in the container, as an absolute path.
  string target = 1;
  // The most it may hold, such as "64M", in units of 1024. Empty sets none, so
  // it can take half the server's memory, unless resources.memory stops it first.
  string size = 2;
}

// Resources is what a container may use of its server. Docker changes these on
// a running container, except to lift one: that recreates it.
message Resources {
  // The most CPUs it may use, such as "0.5" or "2", to three decimal places.
  // Empty has no limit.
  string cpus = 1;
  // The most memory it may use, such as "512M" or "2G", from 6M, in units of
  // 1024. Empty has no limit.
  string memory = 2;
  // The memory Docker tries to leave it when the server runs short, such as
  // "256M", from 6M and no more than memory. Empty reserves none.
  string memory_reservation = 3;
}

// Rollout says how a deploy replaces a service's running container.
message Rollout {
  // Which comes first, the new container or stopping the old one. Unset takes
  // the safest there is for what the service publishes and mounts: the new one
  // first, unless both would publish one server port, or a volume, a server
  // path or the data its image keeps would be written to by two containers at
  // once.
  RolloutOrder order = 1;
  // How long what is in flight to the old container has to finish once no new
  // request goes to it, such as "1m". Empty takes 30 s. What outlasts it, such
  // as a long-lived WebSocket, ends with the container.
  string drain = 2;
}

// RolloutOrder is which comes first in a deploy.
enum RolloutOrder {
  // The safest there is for what the service publishes and mounts.
  ROLLOUT_ORDER_UNSPECIFIED = 0;
  // The new container first, so nothing stops. On a service that mounts
  // something read-write, this says the app can have two containers writing
  // to it at once for as long as a deploy takes. It can't publish a port.
  ROLLOUT_ORDER_START_FIRST = 1;
  // The old container stops first, so there is downtime, and never two at
  // once, as for a worker that must run alone.
  ROLLOUT_ORDER_STOP_FIRST = 2;
}

// Mount puts a volume, or a directory on the server, into a container.
message Mount {
  // What is mounted: one of the two.
  oneof source {
    // A volume, by name. A service's are volumes in its environment; a
    // container's on its own are Docker's.
    string volume = 1;
    // An absolute path on the server, such as "/srv/uploads".
    string host_path = 2;
  }
  // Where it appears in the container, as an absolute path.
  string target = 3;
  // Mounts it read-only.
  bool read_only = 4;
  // Relabels a server path for SELinux, as Docker's z and Z options do, so
  // the container can use it on a server that enforces SELinux. Only a
  // server path takes one; elsewhere Docker changes nothing.
  Relabel relabel = 5;
  // Says a service's volume is one Dockwell didn't make, by its name in Docker,
  // as one a container came with when it was taken on. It must be on the server
  // already: Dockwell never makes, changes or deletes one. Whatever else mounts it
  // shares what it holds, so mounting one is host access, which a person approves.
  // A container on its own names Docker's volumes already, so it takes none.
  bool external = 6;
}

// Relabel is how Docker labels a server path for SELinux when it mounts
// it.
enum Relabel {
  // Not at all: the path keeps its label.
  RELABEL_UNSPECIFIED = 0;
  // Shared, Docker's z: every container may use the path.
  RELABEL_SHARED = 1;
  // Private, Docker's Z: only this container may use it.
  RELABEL_PRIVATE = 2;
}

// Healthcheck says how to check a container is healthy: a command Docker runs
// in the container, or a request the server's agent makes to it. Give one of
// test, http and tcp.
message Healthcheck {
  // A command, as Docker takes it: ["CMD", "curl", "-f", "http://localhost"],
  // ["CMD-SHELL", "curl -f http://localhost || exit 1"], or ["NONE"] to turn
  // off the image's check.
  repeated string test = 1;
  // How often it runs, such as "30s". Empty takes Docker's default for a
  // command, 30 s, and 10 s for http and tcp. At least 1 s for http and tcp.
  string interval = 2;
  // How long one check may take, such as "5s". Empty takes Docker's default
  // for a command, 30 s, and 5 s for http and tcp. At most 1 min for http and
  // tcp.
  string timeout = 3;
  // How long the container has to start before failures count, such as
  // "1m". Empty takes none.
  string start_period = 4;
  // How many failures in a row make it unhealthy. 0 takes 3.
  uint32 retries = 5;
  // A GET the agent sends to the container, on its own network address. Any
  // status from 200 to 399 passes. It works on an image with no shell or curl
  // in it, and turns the image's own check off.
  HttpCheck http = 6;
  // A connection the agent makes to the container, on its own network address.
  // It passes once the port takes it, and turns the image's own check off.
  TcpCheck tcp = 7;
}

// HttpCheck is a GET the agent sends to a container. It can name nothing but
// the container: it says a port and a path, and the address is Docker's.
message HttpCheck {
  // The port the app listens on inside its container, such as 8080.
  uint32 port = 1;
  // The path to ask for, such as "/healthz". Empty asks for "/".
  string path = 2;
  // The Host header to send, for an app that refuses one it doesn't know, such
  // as "app.example.com". Empty sends the container's address.
  string host = 3;
}

// TcpCheck is a connection the agent makes to a container.
message TcpCheck {
  // The port the app listens on inside its container, such as 5432.
  uint32 port = 1;
}

// PortMapping publishes a container port on the server.
message PortMapping {
  // The port on the server.
  uint32 host_port = 1;
  // The port inside the container.
  uint32 container_port = 2;
  // TCP unless set.
  Protocol protocol = 3;
  // The server address it listens on, such as "127.0.0.1". Empty listens on
  // every address.
  string host_ip = 4;
}

// RestartPolicy says when Docker restarts a stopped container.
enum RestartPolicy {
  // The driver's default, unless-stopped.
  RESTART_POLICY_UNSPECIFIED = 0;
  // Never restart.
  RESTART_POLICY_NO = 1;
  // Restart when the container exits with an error.
  RESTART_POLICY_ON_FAILURE = 2;
  // Restart unless someone stopped it.
  RESTART_POLICY_UNLESS_STOPPED = 3;
  // Always restart.
  RESTART_POLICY_ALWAYS = 4;
}

// Protocol is a transport protocol.
enum Protocol {
  // TCP, the default.
  PROTOCOL_UNSPECIFIED = 0;
  // TCP.
  PROTOCOL_TCP = 1;
  // UDP.
  PROTOCOL_UDP = 2;
}

// FirewallRule allows or blocks inbound traffic to a port on a server.
message FirewallRule {
  // Allow or block.
  FirewallAction action = 1;
  // TCP unless set.
  Protocol protocol = 2;
  // The port the rule covers.
  uint32 port = 3;
  // Source addresses in CIDR form, such as "203.0.113.0/24". Empty means
  // anywhere.
  repeated string sources = 4;
  // Why the rule exists, shown next to it.
  string comment = 5;
}

// FirewallAction is what a rule does with matching traffic.
enum FirewallAction {
  // Allow, the default.
  FIREWALL_ACTION_UNSPECIFIED = 0;
  // Let it through.
  FIREWALL_ACTION_ALLOW = 1;
  // Drop it.
  FIREWALL_ACTION_DENY = 2;
}

// Project is a product or client in the organization. It holds
// environments, and scopes members, secrets and domains. An install starts
// with one, named "default", which stays out of sight until there is a
// second. Deleting one takes its environments with it, once nothing lives in
// them.
message Project {
  // How the panel shows it, such as "Acme web". Empty shows its name, which
  // URLs and the CLI use.
  string display_name = 1;
  // The catalog entry this project was installed from. Unset for any other
  // project. See docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
  CatalogPin catalog = 2;
  // What this project serves, for a project made as a website. Dockwell writes
  // the route and the services of its environment from it. Unset for any other
  // project. See docs/adr/0039-websites-as-projects-of-their-own.md.
  Website website = 3;
}

// Website is what a website serves at its domain, as a person chose it.
message Website {
  // What it serves: one of these.
  oneof serves {
    // Sends its requests on to a URL, or to a port on the server.
    WebsiteProxy proxy = 1;
  }
}

// WebsiteProxy sends a website's requests on, to a URL or to a port on the
// server itself. Give one of url and port.
message WebsiteProxy {
  // Where to send them, such as "https://backend.example.com" or
  // "http://10.0.0.5:8080/app": http or https, a host, and a port and a path if
  // it needs them, with no query. A path goes in front of each request's own.
  // It's reached from a container, as any app reaches the internet, so it
  // can't be the server's own loopback: give port for that.
  string url = 1;
  // A port on the server itself, such as 3000, in place of url. Whatever listens
  // there sees every visitor as local, so a person approves it.
  uint32 port = 2;
  // Sends the url's own host as the Host header, in place of the website's
  // domain, as a target that serves several names needs, such as another site
  // over HTTPS. For a url only.
  bool send_target_host = 3;
}

// CatalogPin is what an install is pinned to: updates come from there, and each
// is a plan. It holds no secret: those are the environment's, by reference.
message CatalogPin {
  // The entry's ID, such as "postgres".
  string entry = 1;
  // The app's version as installed, such as "17.11".
  string version = 2;
  // The entry's release as installed, which a newer one's goes past.
  uint32 release = 3;
  // The repository the entry came from.
  string repository = 4;
  // The commit it came from.
  string commit = 5;
  // What each input that isn't a secret was given, by name, so an upgrade gives
  // the same.
  map<string, string> values = 6;
  // The entry's Compose file at this release, with its ${NAME}s as written, so it
  // holds no secret. Read with values, it's what the file gave, which an upgrade
  // needs to tell that from what a person changed since. Empty for an install from
  // before Dockwell kept it, which can't be upgraded.
  bytes file = 7;
}

// Environment is a stage of a project, such as production or staging, with
// its own config. A project starts with one, named "production", which
// stays out of sight until there is a second.
message Environment {
  // How the panel shows it, such as "Staging". Empty shows its name.
  string display_name = 1;
}

// Service is anything that runs in an environment, placed on servers: for
// now an app from an image, run as one container on each server it is
// placed on, and two while a deploy rolls, with the labels Docker Compose
// gives a service's container, so docker compose sees it. A Compose file becomes services, volumes and
// networks. Websites, databases, catalog apps and jobs come later. Where it
// runs isn't part of the spec: each revision is deployed on its servers.
//
// A service uses its environment's variables and secrets by reference:
// the environment holds each value once, and a service names the ones it
// uses, under the names it expects. So changing a value changes every
// service that uses it, in one plan.
message Service {
  // What runs.
  oneof runs {
    // An app from an image.
    Container app = 1;
  }
  // The environment's variables the service uses, each under the name the
  // service sees it as: DATABASE_HOST=DB_HOST gives the service the
  // variable DB_HOST as DATABASE_HOST. An empty value means the variable of
  // the same name.
  map<string, string> variables = 2;
  // The environment's secrets the service uses, named as for variables.
  // Using a secret doesn't let anyone read it: its value goes only to the
  // servers the service runs on, and only their agents decrypt it.
  map<string, string> secrets = 3;
  // The revision of each variable and secret the service uses, by the name
  // the service sees it as. Dockwell sets it when a change is planned, so a
  // service whose variable or secret changes gets a revision of its own,
  // and restarts with the new value. An edit's is ignored.
  map<string, int64> revisions = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Variable is a value of an environment that its services use, such as
// LOG_LEVEL=info. It isn't secret: plans, history and the panel show it.
// Keep anything that is in a Secret.
message Variable {
  // The value.
  string value = 1;
}

// Secret is a value of an environment that its services use without anyone
// reading it back, such as a database password. Dockwell keeps it
// encrypted, sends it only to the servers that run a service that uses it,
// and never shows it in plans, history or logs. Revealing it takes a
// passkey, and is audited.
message Secret {
  // The value. Every edit sets it whole.
  string value = 1 [(sensitive) = true];
}

// Volume is a Docker volume in an environment, which its services mount
// by name, as a Compose file's volumes. Deleting one destroys its data,
// though Dockwell keeps it for 7 days first. Docker can't change a volume,
// so its spec can't change once it is made.
message Volume {
  // The volume driver: "local" unless set.
  string driver = 1;
  // The driver's options, such as type, device and o for an NFS mount. They
  // may hold secrets, as a CIFS mount's password goes in o. The local driver
  // takes type none with bind, nfs, nfs4, cifs or tmpfs.
  map<string, string> options = 2 [(sensitive) = true];
  // Labels on the volume, for tools that read them.
  map<string, string> labels = 3;
}

// BackupPolicy backs up a volume in its environment on a schedule, on every server
// that has it, and keeps the newest of those backups. A backup someone takes by
// hand is theirs, and no policy deletes it. The control plane runs the schedule, so
// a run due while it's down happens when it's back.
message BackupPolicy {
  // How often it runs.
  enum Every {
    EVERY_UNSPECIFIED = 0;
    // Each hour, at the minutes of at.
    EVERY_HOUR = 1;
    // Each day, at at. The default.
    EVERY_DAY = 2;
    // Each week, on weekday, at at.
    EVERY_WEEK = 3;
  }

  // The volume, by name, in this environment.
  string volume = 1;
  // How often it runs.
  Every every = 2;
  // The time it runs, as 24-hour HH:MM: "03:00" unless set.
  string at = 3;
  // The day it runs each week, as 0 for Sunday to 6 for Saturday.
  int32 weekday = 4;
  // The time zone at is in, such as "Europe/Amsterdam": "UTC" unless set.
  string time_zone = 5;
  // How many of its backups to keep, on each server, newest first: 7 unless set.
  uint32 keep = 6;
  // Stop what runs on the volume for an exact copy of its files, and start it again
  // after. A database's dump stops nothing. Without it, a copy of a running app's
  // files can hold half a write.
  bool stop = 7;
  // The backup destination each backup also goes to, by name. Empty keeps them on
  // the server alone, so they go if it does.
  string destination = 8;
}

// BackupDestination is S3-compatible storage that backups go to as well as the
// server's disk, so they outlive it: Amazon S3, Cloudflare R2, Backblaze B2, MinIO
// and the like. It lives in the organization, and any environment's backups can use
// it. A backup is encrypted on its server before it leaves, so the storage never
// reads what it holds. Dockwell keeps this encrypted, and sends it only to the server
// that's sending a backup, for that one call. See
// docs/adr/0033-backups-of-volumes-and-databases.md.
message BackupDestination {
  // The storage's address, such as "https://<account>.r2.cloudflarestorage.com".
  string endpoint = 1;
  // The bucket's region: "auto" unless set.
  string region = 2;
  // The bucket.
  string bucket = 3;
  // What each object's name starts with, such as "dockwell". Empty uses the bucket
  // from the top.
  string prefix = 4;
  // The access key's ID.
  string access_key = 5 [(sensitive) = true];
  // The access key's secret.
  string secret_key = 6 [(sensitive) = true];
  // What backups are encrypted with before they leave. Nothing but this opens them,
  // and dockwell open-backup needs it: keep a copy somewhere that isn't this install.
  // Set it when you add a destination, and leave it out of an update, which keeps it:
  // an update that sets one is refused, as every copy there is sealed with it.
  string passphrase = 7 [(sensitive) = true];
}

// Network is a Docker network in an environment, which its services join
// by name, as a Compose file's networks. A service reaches another on a
// network they share by the other's name. Docker can't change a network,
// so its spec can't change once it is made.
message Network {
  // The network driver: "bridge" unless set.
  string driver = 1;
  // The driver's options.
  map<string, string> options = 2;
  // Cuts the network off from outside the server: only its containers
  // reach each other.
  bool internal = 3;
  // Labels on the network, for tools that read them.
  map<string, string> labels = 4;
}

// Route sends a domain's traffic, or a path under it, to a port of a service
// in the route's environment, or to a port on the server itself. It comes over
// HTTPS with a certificate Dockwell gets for the domain, unless tls says TLS
// ends before this server. A server's first route starts its ingress, which
// takes ports 80 and 443, or port 80 alone while no route on the server takes
// a certificate; its last stops it and frees them. See
// docs/adr/0024-the-caddy-ingress-driver.md and
// docs/adr/0030-routes-behind-a-tunnel-or-a-proxy.md.
message Route {
  // The domain, such as "app.example.com": a lowercase DNS name that a
  // public certificate authority issues for. Wildcards aren't taken.
  string domain = 1;
  // The path it covers, such as "/api": that path and what is under it,
  // which reach the service as they are. Empty covers the whole domain.
  string path = 2;
  // The service to send it to, by name, in the route's environment. With
  // host_port it says whose route this is, as the route dials that port rather than
  // the service's container. Empty only for a host_port that is no service's.
  string service = 3;
  // The port the service listens on inside its container, such as 8080. Empty
  // when host_port names a port on the server instead.
  uint32 port = 4;
  // "off" when TLS ends before this server, as at a tunnel or a proxy in front
  // of it: the domain is served over plain HTTP on port 80, with no certificate
  // and no redirect to HTTPS, so its traffic reaches this server unencrypted.
  // Such a route answers only the proxies in trusted_proxies, or with none, this
  // server's own loopback, unless plain_for_anyone says otherwise. Anyone else
  // gets what a name with no route gets. Empty gets a certificate. A domain's
  // routes all take the same setting. A person approves taking a domain that has
  // had a certificate off it.
  string tls = 5;
  // The proxies in front of this server whose word this route takes on where a
  // request came from, each an address, a range such as "203.0.113.0/24", or
  // "cloudflare" for Cloudflare's published ranges. A request from anywhere else
  // has its address taken from the connection, whatever another route on the
  // server names. From an address or a range, X-Forwarded-For is read from the
  // right. From "cloudflare", CF-Connecting-IP is read, as Cloudflare documents,
  // and it's only as sure as Cloudflare says: see docs/security/ingress.md. A
  // person approves each one a change adds, as a proxy that isn't really one makes
  // client addresses forgeable. A range of Cloudflare's is named by the preset, and
  // a public range wider than /12, or /28 in IPv6, or a private one wider than /8,
  // isn't taken.
  repeated string trusted_proxies = 6;
  // A port on the server itself, such as 8080, in place of port, for a service on
  // the server's own network, which a route can't send to by name, or with no service
  // at all, for something that isn't a Dockwell service. The proxy dials 127.0.0.1 on it,
  // so what's there sees every caller as local. It reaches past containers, so a
  // person approves it, and any change to where it answers. Dockwell's own ports,
  // and Docker's API, on 2375, 2376 or wherever dockerd listens, aren't taken.
  uint32 host_port = 7;
  // True for a route that says tls off to answer anyone who can reach this
  // server's port 80, as for a site on a private network, or a load balancer whose
  // addresses aren't known. It goes around whatever is in front, so a person
  // approves it.
  bool plain_for_anyone = 8;
}

// Spec is the desired state of one resource, of any kind: the field that is
// set says which. Edits in the API carry specs in it, so one message takes
// every kind.
message Spec {
  // The kind's spec.
  oneof kind {
    // A project, kind "project".
    Project project = 1;
    // An environment, kind "environment".
    Environment environment = 2;
    // A service, kind "service".
    Service service = 3;
    // A container run by hand on a server, kind "container".
    Container container = 4;
    // A firewall rule on a server, kind "firewall.rule".
    FirewallRule firewall_rule = 5;
    // A volume in an environment, kind "volume".
    Volume volume = 6;
    // A network in an environment, kind "network".
    Network network = 7;
    // A variable of an environment, kind "variable".
    Variable variable = 8;
    // A secret of an environment, kind "secret".
    Secret secret = 9;
    // A domain or path sent to a service, kind "route".
    Route route = 10;
    // A schedule of backups of a volume, kind "backup.policy". Numbered apart,
    // as open work adds to this message.
    BackupPolicy backup_policy = 20;
    // S3-compatible storage backups go to, kind "backup.destination".
    BackupDestination backup_destination = 21;
  }
}

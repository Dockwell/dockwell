# SPDX-License-Identifier: AGPL-3.0-only
# Code generated from proto/. Run `make generate`; never edit the output by hand.
version: v2
# Empties each output directory first, gen/LICENSE included, so run buf through
# make generate, which puts the license back.
clean: true
managed:
  enabled: true
  disable:
    # googleapis names its own Go packages, under google.golang.org/genproto.
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/dockwell/dockwell/gen
plugins:
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-connect-go]
    out: gen
    opt: paths=source_relative
  - local: packages/api/node_modules/.bin/protoc-gen-es
    out: packages/api/src/gen
    opt: target=ts
    # The TypeScript client carries the google.api files it imports; Go uses
    # them from google.golang.org/genproto.
    include_imports: true
  # The CLI's API commands (ADR 0019), from every file at once. Its output
  # directory holds only what it writes, as buf empties it first.
  - local: [go, run, ./cmd/protoc-gen-dockwell-cli]
    out: internal/cli/apicmd
    strategy: all
  # Only those commands' names, in a package that imports nothing, for the
  # agent build, which has none of them, to say they are in the full build
  # (ADR 0023).
  - local: [go, run, ./cmd/protoc-gen-dockwell-cli]
    out: internal/cli/apinames
    strategy: all
    opt: output=names
  # The OpenAPI document for the REST paths (ADR 0015), in gen/openapi.
  - local: [go, tool, -modfile=tools/go.mod, protoc-gen-openapi]
    out: gen/openapi
    strategy: all
    types: [dockwell.v1]
    opt:
      - title=Dockwell API
      - version=v1
      - enum_type=string
      - naming=json
      - default_response=true

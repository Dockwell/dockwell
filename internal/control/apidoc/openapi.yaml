                     only one project, or when environment is an ID.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    How many variables and secrets to return: 500 when unset, and at most
                     1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     environment with it.
                  schema:
                    type: string
            responses:

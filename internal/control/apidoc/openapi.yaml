    /v1/compose:
        get:
            tags:
                - ComposeService
            description: |-
                ExportCompose writes a Compose file of an environment, or of one service
                 with the volumes and networks it uses. It never includes a secret: an
                 environment variable whose value may hold one is listed by name, for
                 docker compose to take from the shell it runs in. The CLI prints the
                 file alone, so it pipes into docker compose -f -.
            operationId: ComposeService_ExportCompose
            parameters:
                - name: project
                  in: query
                  description: |-
                    The project of the environment, by name or ID. Leave it out while
                     there is only one project, or when environment is an ID.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment, by name or ID. Leave it out while its project has
                     only one.
                  schema:
                    type: string
                - name: service
                  in: query
                  description: |-
                    One service to export, by name, with the volumes and networks it uses.
                     Empty exports the whole environment.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExportComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:adopt:
        post:
            tags:
                - ComposeService
            description: |-
                AdoptCompose plans taking on a Compose project made elsewhere, whole: each of
                 its containers on a server becomes a service of a project of its own, as
                 AdoptContainer takes one on, in one change a person plans and applies, never a
                 token, as its plan shows what the list of containers leaves out. Nothing about them
                 changes, and none restarts. They stay on the networks and volumes they have,
                 which stay Docker's: Dockwell doesn't make or delete them.
            operationId: ComposeService_AdoptCompose
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdoptComposeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdoptComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:check:
        post:
            tags:
                - ComposeService
            description: |-
                CheckCompose reads a Compose file as ImportCompose would and says what
                 it would make, or why it can't, without planning anything or recording a
                 change, so a form can check a file as someone types it. It is a POST, as
                 a file doesn't fit in a URL.
            operationId: ComposeService_CheckCompose
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckComposeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:import:
        post:
            tags:
                - ComposeService
            description: |-
                ImportCompose plans a Compose file into a project as a change, ready to
                 apply or discard, as ProposeChange does with edits. Each Compose service
                 becomes a service, and each named volume and network one of its own. A
                 field of the file that Dockwell can't run yet is refused, by name, rather
                 than dropped. The plan brings the project to life if it doesn't exist yet,
                 and importing into one that does shows as updates.
            operationId: ComposeService_ImportCompose
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImportComposeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ImportComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/containers:
        get:
            tags:
                - ContainerService
            description: |-
                ListContainers returns the containers on a server that Dockwell didn't
                 make, by name, running or not.
            operationId: ContainerService_ListContainers
            parameters:
                - name: server
                  in: query
                  description: The server, by name or ID. It can be left out while there is only one.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListContainersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/containers/{id}:adopt:
        post:
            tags:
                - ContainerService
            description: |-
                AdoptContainer plans taking on a container Dockwell didn't make, as a service
                 that runs it from then on. Nothing about the container changes: it isn't
                 restarted, and it keeps its name and labels until a change replaces it. Its
                 environment comes in with it, sealed like any service's, and no plan or log
                 shows a value of it. A person plans it and applies it, never a token, as its plan
                 shows what the list of containers leaves out: its command, labels, user and
                 mounts. Deleting the service before anything replaces the container lets go of
                 it again.
            operationId: ContainerService_AdoptContainer
            parameters:
                - name: id
                  in: path
                  description: The container, by its name or its full ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdoptContainerRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdoptContainerResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/controlPlane:
        get:
            tags:
                - SettingsService
            description: |-
                GetControlPlane returns what serves the panel and API: its build, where it
                 keeps its state, the addresses it answers on, and how it's doing. Most of
                 it comes from how dockwell run was started, and changes there.

                 A call with an API token gets no paths, no state store location and no
                 agent URLs: they say where the key and the store are, and the panel needs
                 them only for a person signed in, to say how to back the control plane up.
            operationId: SettingsService_GetControlPlane
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetControlPlaneResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/databases:
        get:
            tags:
                - DatabaseService
            description: |-
                ListDatabases returns every database, by name, with how each stands on each
                 server it runs on, as far as each server can say within a few seconds, and
                 the newest backup of its data.
            operationId: DatabaseService_ListDatabases
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDatabasesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/databases/{id}:
        get:
            tags:
                - DatabaseService
            description: |-
                GetDatabase returns one database, by its service's ID or its name, with what
                 it holds: the databases inside it, and who can sign in to it.
            operationId: DatabaseService_GetDatabase
            parameters:
                - name: id
                  in: path
                  description: Its service, by ID or by name.
                  required: true
                  schema:
                    type: string
                - name: project
                  in: query
                  description: |-
                    The project of a service named by name, by name or ID, when more than one
                     has a service of that name.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment of a service named by name, by name or ID, when its project
                     has more than one.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetDatabaseResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/databases/{id}/users:
        post:
            tags:
                - DatabaseService
            description: |-
                CreateDatabaseUser plans a database inside a database server, with a user who
                 owns it, and a password for them that the control plane generates and keeps as a
                 secret of the environment, which nobody sees unless they reveal it. The user is a
                 resource, of kind "database.user", so it's a change with a plan, a revision and an
                 undo, and setting the secret anew changes the password. Only PostgreSQL, MySQL
                 and MariaDB have users of their own.
            operationId: DatabaseService_CreateDatabaseUser
            parameters:
                - name: id
                  in: path
                  description: The service that runs it, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateDatabaseUserRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateDatabaseUserResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/domains:
        get:
            tags:
                - DomainService
            description: |-
                ListDomains returns the domains of the routes that exist now, sorted by
                 name, with each one's routes and where its certificate and DNS stand on
                 each server. A domain whose certificate is on its way answers over HTTPS
                 once it's issued; poll this to follow it.
            operationId: DomainService_ListDomains
            parameters:
                - name: environment
                  in: query
                  description: |-
                    Only domains with a route in this environment, by ID. Empty means every
                     environment.
                  schema:
                    type: string
                - name: service
                  in: query
                  description: |-
                    Only domains with a route to this service, by name. It needs environment,
                     as a service's name is unique only in its environment.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDomainsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/domains:check:
        post:
            tags:
                - DomainService
            description: |-
                CheckDomain says what DNS says of a name now, against what's known of a
                 server, whether or not any route has the name yet, as adding a domain does.
                 Read it again to see a record arrive. It resolves the name through the
                 control server, so it needs a token that can make changes, a caller can
                 check 60 names a minute, and an answer that's a private address is only
                 shown when it's the server's own.
            operationId: DomainService_CheckDomain
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckDomainRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckDomainResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:
        get:
            tags:
                - ChangeService
            description: |-
                ListDrift compares what servers have with the latest revision of each
                 resource they should have, and returns every difference. It asks each
                 connected server's agent, and changes nothing.
            operationId: ChangeService_ListDrift
            parameters:
                - name: serverId
                  in: query
                  description: A server's ID. Empty looks on every server.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:adopt:
        post:
            tags:
                - ChangeService
            description: |-
                AdoptDrift plans keeping what a server has for a drifted resource: a
                 new revision that matches it. Nothing changes on that server; any other
                 server the resource runs on is brought to match, and the plan shows it.
            operationId: ChangeService_AdoptDrift
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdoptDriftRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdoptDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:revert:
        post:
            tags:
                - ChangeService
            description: |-
                RevertDrift plans putting a drifted resource back to its latest
                 revision on the servers it runs on.
            operationId: ChangeService_RevertDrift
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevertDriftRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevertDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/events:
        get:
            tags:
                - EventService
            description: ListEvents returns events, newest first, a page at a time.
            operationId: EventService_ListEvents
            parameters:
                - name: pageSize
                  in: query
                  description: 'How many events to return: 50 when unset, and at most 200.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before, or of a
                     watch's snapshot. Empty starts with the newest. Pass the same filters
                     with it.
                  schema:
                    type: string
                - name: kinds
                  in: query
                  description: Only events of these kinds. Empty means every kind.
                  schema:
                    type: array
                    items:
                        enum:
                            - EVENT_KIND_UNSPECIFIED
                            - EVENT_KIND_CHANGE
                            - EVENT_KIND_SERVER
                            - EVENT_KIND_ACCESS
                            - EVENT_KIND_HEALTH
                            - EVENT_KIND_BACKUP
                            - EVENT_KIND_SETTINGS
                            - EVENT_KIND_TASK
                        type: string
                        format: enum
                - name: serverId
                  in: query
                  description: |-
                    Only what happened on or to one server, by ID: the changes with steps
                     on it, and its own events, such as joining.
                  schema:
                    type: string
                - name: resourceId
                  in: query
                  description: |-
                    Only the changes to one resource, by ID, or to what lives in it: a
                     service's changes, or a project's with those of its environments and
                     their services.
                  schema:
                    type: string
                - name: actorId
                  in: query
                  description: |-
                    Only what one actor did, by the ID their Actor has: a user's
                     ("usr_…"), an API token's ("tok_…"), a server's ("srv_…"), or a
                     shell account's ("mira@hz-1"). A change counts for whoever proposed it
                     and whoever applied it.
                  schema:
                    type: string
                - name: actorKind
                  in: query
                  description: |-
                    Only what actors of one kind did, such as Dockwell on its own, or
                     someone in a shell on the control server.
                  schema:
                    enum:
                        - ACTOR_KIND_UNSPECIFIED
                        - ACTOR_KIND_USER
                        - ACTOR_KIND_TOKEN
                        - ACTOR_KIND_DOCKWELL
                        - ACTOR_KIND_SERVER
                        - ACTOR_KIND_SHELL
                    type: string
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListEventsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/health:
        get:
            tags:
                - HealthService
            description: |-
                ListHealth returns how each service that exists now is, in every
                 environment or one, a page at a time.
            operationId: HealthService_ListHealth
            parameters:
                - name: project
                  in: query
                  description: |-
                    The project of the environment, by name or ID, when environment is a name
                     and there are several projects.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    Only the services of this environment, by name or ID. Empty means every
                     environment.
                  schema:
                    type: string
                - name: service
                  in: query
                  description: Only this service, by name, with its environment, or by ID alone.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many services to return: 200 when unset, and at most 1000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListHealthResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/members:
        get:
            tags:
                - MemberService
            description: ListMembers returns everyone who can sign in, oldest first.
            operationId: MemberService_ListMembers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMembersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:
        get:
            tags:
                - AuthService
            description: ListPasskeys returns your passkeys, oldest first.
            operationId: AuthService_ListPasskeys
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPasskeysResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys/{id}:remove:
        post:
            tags:
                - AuthService
            description: |-
                RemovePasskey removes one of your passkeys. It needs a proof from
                 FinishStepUp for removing it. It refuses to remove your last way to sign
                 in.
            operationId: AuthService_RemovePasskey
            parameters:
                - name: id
                  in: path
                  description: The passkey's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RemovePasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RemovePasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:beginAdd:
        post:
            tags:
                - AuthService
            description: |-
                BeginAddPasskey starts adding a passkey for the address of this request.
                 It needs a proof from FinishStepUp for adding a passkey, made with a
                 passkey you have for this address. A sign-in in the last 10 minutes
                 that needed no passkey here confirms one passkey instead, so you can
                 add one when you have none here: a link from dockwell recover, a
                 recovery code, or a code from an authenticator app when no passkey is
                 registered for this address.
            operationId: AuthService_BeginAddPasskey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BeginAddPasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BeginAddPasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:finishAdd:
        post:
            tags:
                - AuthService
            description: |-
                FinishAddPasskey saves the new passkey. One a sign-in confirmed is
                 checked again: still within its 10 minutes, and the first since.
            operationId: AuthService_FinishAddPasskey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinishAddPasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FinishAddPasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/resources:
        get:
            tags:
                - ResourceService
            description: |-
                ListResources returns the resources that exist now, of every kind or
                 of one, oldest first, a page at a time. Deleted resources aren't in
                 it.
            operationId: ResourceService_ListResources
            parameters:
                - name: kind
                  in: query
                  description: |-
                    Only resources of this kind, such as "project" or "environment". Empty
                     means every kind.
                  schema:
                    type: string
                - name: scope
                  in: query
                  description: |-
                    Only resources that live in this scope, by ID, such as a project's
                     environments. Empty means every scope.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many resources to return: 200 when unset, and at most 1000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResourcesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/secrets/{id}:reveal:
        post:
            tags:
                - VariableService
            description: |-
                RevealSecret returns a secret's latest value. It needs a signed-in
                 session and a proof from FinishStepUp for this secret, made with a
                 passkey moments before, which works once. No API token can call it.
                 Every reveal is in the audit log.
            operationId: VariableService_RevealSecret
            parameters:
                - name: id
                  in: path
                  description: The secret's ID, such as "sec_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevealSecretRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevealSecretResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers:
        get:
            tags:
                - ServerService
            description: ListServers returns every server, connected or not, without history.
            operationId: ServerService_ListServers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}:
        get:
            tags:
                - ServerService
            description: GetServer returns one server, with its recent history.
            operationId: ServerService_GetServer
            parameters:
                - name: id
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServerResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}/diskUse:
        get:
            tags:
                - ServerService
            description: |-
                GetServerDiskUse says what takes the room on the disk that holds Docker's
                 data: images, containers, volumes, the build cache and logs, and the rest.
                 The server's agent asks Docker when this is called, and only then, as
                 Docker adds up every volume to answer, which takes a while on a big disk.
                 An answer stands for 30 s, so a page opened twice asks once. See
                 docs/adr/0040-a-servers-live-use.md.
            operationId: ServerService_GetServerDiskUse
            parameters:
                - name: id
                  in: path
                  description: The server's ID.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServerDiskUseResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}/updates:
        get:
            tags:
                - UpdateService
            description: |-
                GetServerUpdates says which package updates wait on a server, which are
                 security fixes, whether the server needs a reboot, and Dockwell's own
                 version against its newest release. An answer stands for 10 minutes. Past
                 that, or with none yet, this asks the server's agent, and answers with what
                 it had and checking set when the agent takes more than a few seconds: ask
                 again for the rest. The agent refreshes the server's package lists first
                 when they're more than a day old.
            operationId: UpdateService_GetServerUpdates
            parameters:
                - name: id
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServerUpdatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}/updates:check:
        post:
            tags:
                - UpdateService
            description: |-
                CheckServerUpdates refreshes a server's package lists now, whatever their
                 age, and reads what waits again. It answers at once, with checking set, and
                 GetServerUpdates has the result. A server is refreshed this way at most once
                 a minute: asking again sooner answers with the refresh under way, or the
                 last one. It has the server reach its mirrors, so it takes a person: no API
                 token can call it.
            operationId: UpdateService_CheckServerUpdates
            parameters:
                - name: id
                  in: path
                  description: The server's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckServerUpdatesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckServerUpdatesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}:setPublicAddress:
        post:
            tags:
                - ServerService
            description: |-
                SetServerPublicAddress records a server's public address, as a person
                 knows it, which no other way of knowing it overrides. An IPv4 and an IPv6
                 address are kept apart. An empty address goes back to what Dockwell finds
                 out for itself. It's on record in the activity log, with what it replaced.
                 See docs/adr/0034-a-servers-public-address.md.
            operationId: ServerService_SetServerPublicAddress
            parameters:
                - name: id
                  in: path
                  description: The server's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SetServerPublicAddressRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetServerPublicAddressResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/files:
        get:
            tags:
                - FileService
            description: |-
                ListFiles returns what a directory on a server holds, by name. It follows
                 symlinks, and path in the response says where it ended up. It returns at
                 most 5,000 entries. No API token can call it.
            operationId: FileService_ListFiles
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
                - name: path
                  in: query
                  description: The directory's absolute path, without . or .. in it, such as "/var/www".
                  schema:
                    type: string
                - name: lookup
                  in: query
                  description: |-
                    Says a form is looking whether a folder is there as you type, such as a
                     website's: a listing it can't have goes on no Activity, as it's a guess at a
                     path, not a person opening one. Files never sets it. Numbered apart, as open
                     work adds to this message.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListFilesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/files:read:
        post:
            tags:
                - FileService
            description: |-
                ReadFile returns a file on a server as text: its first 1 MiB, or nothing
                 when it isn't UTF-8 text. No API token can call it. Every read is in the
                 audit log.
            operationId: FileService_ReadFile
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ReadFileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadFileResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/files:save:
        post:
            tags:
                - FileService
            description: |-
                SaveFile replaces a file's text, if the file is still as ReadFile gave it. A
                 file that changed since fails with the reason "file_changed", and nothing is
                 written. It can't be undone. No API token can call it. Every save is in the
                 audit log, and on the timeline.
            operationId: FileService_SaveFile
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SaveFileRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SaveFileResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/imports:onepanel:
        post:
            tags:
                - ImportService
            description: |-
                ImportOnePanel reads what 1Panel keeps on a server: its apps from its store,
                 runtimes, websites, certificates, databases and cron jobs. It says what
                 Dockwell would do with each and why: take it on as it runs, make it again,
                 or leave it, and which issue it waits for where Dockwell can't yet. For a
                 person, it also plans the change that takes on each app and runtime that
                 can come as it runs, reading each container as AdoptCompose does: one that
                 can't come stays, with why. A token gets what was found and no change, as a
                 plan that takes a container on shows what a token can't read. The agent
                 reads 1Panel's records read-only, and nothing secret comes back from them:
                 no password, key, script, environment or URL path.
            operationId: ImportService_ImportOnePanel
            parameters:
                - name: serverId
                  in: path
                  description: The server running 1Panel, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImportOnePanelRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ImportOnePanelResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/processes/{pid}:end:
        post:
            tags:
                - ProcessService
            description: |-
                EndProcess ends a process on a server, as kill does: SIGTERM, and SIGKILL
                 if it's still there 10 s later. It's as much as root on the server, so it
                 takes a passkey just now: call it without a proof first, and it refuses with
                 the reason needs_step_up, then again with the proof from FinishStepUp for
                 STEP_UP_ACTION_END_PROCESS, whose target is "<server ID>:<PID>:<start
                 ticks>", so a proof ends no other process given the PID later. It can't be
                 undone. Refused, with the reason process_protected: PID 1; the process
                 Dockwell's agent runs in, any thread of it, and what it runs under; a
                 thread, which only stops with its process; a thread the kernel runs; and
                 the SSH server that takes new logins. A server whose kernel has no pidfds,
                 before Linux 5.3, ends nothing, as a signal by PID alone could reach
                 whatever took the PID. It's on the activity log, without the command line.
            operationId: ProcessService_EndProcess
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID.
                  required: true
                  schema:
                    type: string
                - name: pid
                  in: path
                  description: The process ID, 4194304 at most, as Linux gives them.
                  required: true
                  schema:
                    type: integer
                    format: uint32
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/EndProcessRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EndProcessResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{serverId}/terminals:
        get:
            tags:
                - TerminalService
            description: |-
                ListTerminals returns your terminals on a server that are still open, from
                 this session, oldest first. No API token can call it.
            operationId: TerminalService_ListTerminals
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID.
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTerminalsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - TerminalService
            description: |-
                OpenTerminal starts root's login shell on a server, or the first of bash, ash
                 and sh a container on it has, in it, as the container's own user. A server's
                 terminal needs a proof from FinishStepUp, for opening a terminal on that
                 server, and so does a container's, for it, where the container is as good as
                 root on the server: call without it first, and it checks everything else, then
                 refuses with the reason needs_step_up. A server has room for 8 terminals. No API
                 token can call it.
            operationId: TerminalService_OpenTerminal
            parameters:
                - name: serverId
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OpenTerminalRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OpenTerminalResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services:
        get:
            tags:
                - ServiceService
            description: |-
                ListServices returns the services that exist now, in every environment
                 or one, oldest first, a page at a time.
            operationId: ServiceService_ListServices
            parameters:
                - name: project
                  in: query
                  description: |-
                    The project of the environment, by name or ID, when environment is a
                     name and there are several projects.

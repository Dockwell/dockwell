        post:
            tags:
                - AuthService
            description: |-
                UnlockCodeSignIn turns code sign-in back on after too many wrong codes
                 locked it.
            operationId: AuthService_UnlockCodeSignIn
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UnlockCodeSignInRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UnlockCodeSignInResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/variables:
        get:
            tags:
                - VariableService
            description: |-
                ListVariables returns an environment's variables and secrets, by name,
                 a page at a time: each variable with its value, each secret without it,
                 and the services that use each.
            operationId: VariableService_ListVariables
            parameters:
                - name: environment
                  in: query
                  description: |-
                    The environment, by name or ID. Leave it out while its project has only
                     one; once there are several, leaving it out is an error that names
                     them.
                  schema:
                    type: string
                - name: project
                  in: query
                  description: |-
                    The environment's project, by name or ID. Leave it out while there is
                     only one project, or when environment is an ID.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: |-
                    How many variables and secrets to return: 500 when unset, and at most
                     1000.
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     environment with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListVariablesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/version:
        get:
            tags:
                - SystemService
            description: GetVersion returns the build of the control plane that answers.
            operationId: SystemService_GetVersion
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetVersionResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/websites:

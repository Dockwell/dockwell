                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}/revisions:
        get:
            tags:
                - ServiceService
            description: |-
                ListServiceRevisions returns a service's revisions, newest first, a page
                 at a time: what each changed, who made it and from where, and how each
                 deployed. A service goes by its ID, or by its name where that is enough
                 to say which.
            operationId: ServiceService_ListServiceRevisions
            parameters:
                - name: id
                  in: path
                  description: The service, by ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V", or by name.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many revisions to return: 20 when unset, and at most 100.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Empty starts
                     with the latest.
                  schema:
                    type: string
                - name: project
                  in: query
                  description: |-
                    The project of a service named by name, by name or ID, when more than one
                     has a service of that name.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment of a service named by name, by name or ID, when its
                     project has more than one.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServiceRevisionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}:deploy:
        post:
            tags:
                - ServiceService
            description: |-
                DeployService plans running another image, with the rest of the service
                 as it is: its environment, ports and mounts need no one to read them
                 back, so anyone may deploy without being able to see a secret.
            operationId: ServiceService_DeployService
            parameters:
                - name: id
                  in: path
                  description: The service, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeployServiceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeployServiceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}:restart:
        post:
            tags:
                - ChangeService
            description: |-
                RestartService plans restarting a service on every server it runs on: as
                 a deploy does, a new container takes over once it is healthy, where the
                 service can have two at once, and otherwise the old one stops first, and
                 the plan says for how long. It is a change, with a plan to apply or
                 discard. It makes no revision, as the spec stays as it is, so it has
                 nothing to undo, and a restart that fails leaves the revision where it was.
            operationId: ChangeService_RestartService
            parameters:
                - name: id
                  in: path
                  description: The service's ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V", or its name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RestartServiceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RestartServiceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}:rollback:
        post:
            tags:
                - ServiceService
            description: |-
                RollBackService plans putting a service back as an earlier revision had
                 it, on the servers that revision ran on that are still in the fleet.
                 Unlike UndoChange it takes any earlier revision, and touches this
                 service alone, whatever else the change that made the revision did. It
                 brings back the spec, not the data in a volume, which the plan's notes
                 say, nor the value of a variable or secret it uses, which stays the latest:
                 change that value to go back on it. It refuses only what would do nothing
                 on the record and on every server. A revision that matches the latest on
                 the record (matches_latest) still plans what puts it back, when a rollback
                 failed or a container was removed by hand.
            operationId: ServiceService_RollBackService
            parameters:
                - name: id
                  in: path
                  description: The service, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RollBackServiceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RollBackServiceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'

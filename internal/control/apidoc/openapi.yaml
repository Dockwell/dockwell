openapi: 3.0.3
info:
    title: Dockwell API
    version: v1
paths:
    /v1/authState:
        get:
            tags:
                - AuthService
            description: |-
                GetAuthState says whether the install has an owner, who is signed in on
                 this request, and which address passkeys are made for here.
            operationId: AuthService_GetAuthState
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetAuthStateResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes:
        get:
            tags:
                - ChangeService
            description: |-
                ListChanges returns changes, newest first, a page at a time. Each
                 change's plan is in brief: its fingerprint, summary, undo window and
                 whether it is destructive. GetChange has the plan in full.
            operationId: ChangeService_ListChanges
            parameters:
                - name: pageSize
                  in: query
                  description: 'How many changes to return: 50 when unset, and at most 200.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Empty starts
                     with the newest.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListChangesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - ChangeService
            description: |-
                ProposeChange plans a set of edits and records them as a planned
                 change, ready to apply or discard. Planning asks each server's agent
                 what the edits would take there, and changes nothing on any server. The
                 same edits against the same state give the same plan, and the same
                 fingerprint unless they edit a kind that may hold secrets, which each
                 change digests for itself.

                 An edit that sets a secret's value is a rotation: it plans as a change,
                 and restarts what uses the secret, whatever the value is. So a plan
                 never says whether it is the value already there. Any other sensitive
                 field, such as a container's environment, compares as usual: an equal
                 value is no change, and a plan masks one that differs.
            operationId: ChangeService_ProposeChange
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProposeChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProposeChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:
        get:
            tags:
                - ChangeService
            description: |-
                GetChange returns one change, with its plan and the progress of each of
                 its steps.
            operationId: ChangeService_GetChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:apply:
        post:
            tags:
                - ChangeService
            description: |-
                ApplyChange carries out a planned change. It plans again, and refuses
                 if any resource changed since, or if the servers no longer match the
                 plan; either way, propose the edits again and review the new plan.
                 Otherwise it commits the change's revisions and starts running its
                 steps, and returns the change as it starts applying. The steps run to
                 an end whether or not the caller waits. Follow them with WatchChange,
                 or by polling GetChange. If a step fails, the steps already done are
                 rolled back in a change of Dockwell's own, named in rolled_back_by.

                 A plan that destroys data or may cut off access needs the fingerprint
                 of the plan you reviewed, and a signed-in session: no API token may
                 apply one.
            operationId: ChangeService_ApplyChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApplyChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplyChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:discard:
        post:
            tags:
                - ChangeService
            description: |-
                DiscardChange drops a planned change without applying it. The change
                 stays on record as discarded.
            operationId: ChangeService_DiscardChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DiscardChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DiscardChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:undo:
        post:
            tags:
                - ChangeService
            description: |-
                UndoChange plans putting back everything an applied change did, as a
                 new change; apply it to carry it out. It is refused once the change is
                 older than its undo window, or when a resource it touched has changed
                 again since: undo that later change first, or edit the resource.
            operationId: ChangeService_UndoChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UndoChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UndoChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/claim:begin:
        post:
            tags:
                - AuthService
            description: BeginClaim starts creating the owner's first passkey.
            operationId: AuthService_BeginClaim
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BeginClaimRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BeginClaimResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/claim:check:
        post:
            tags:
                - AuthService
            description: |-
                CheckClaim checks a claim link without spending it, and describes the
                 server it claims.
            operationId: AuthService_CheckClaim
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckClaimRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckClaimResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/claim:finish:
        post:
            tags:
                - AuthService
            description: |-
                FinishClaim spends the claim link, creates the owner with the new
                 passkey, and signs them in. It works once per install.
            operationId: AuthService_FinishClaim
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinishClaimRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FinishClaimResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:
        get:
            tags:
                - ComposeService
            description: |-
                ExportCompose writes a Compose file of an environment, or of one service
                 with the volumes and networks it uses. It never includes a secret: an
                 environment variable whose value may hold one is listed by name, for
                 docker compose to take from the shell it runs in. The CLI prints the
                 file alone, so it pipes into docker compose -f -.
            operationId: ComposeService_ExportCompose
            parameters:
                - name: project
                  in: query
                  description: |-
                    The project of the environment, by name or ID. Leave it out while
                     there is only one project, or when environment is an ID.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment, by name or ID. Leave it out while its project has
                     only one.
                  schema:
                    type: string
                - name: service
                  in: query
                  description: |-
                    One service to export, by name, with the volumes and networks it uses.
                     Empty exports the whole environment.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ExportComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:check:
        post:
            tags:
                - ComposeService
            description: |-
                CheckCompose reads a Compose file as ImportCompose would and says what
                 it would make, or why it can't, without planning anything or recording a
                 change, so a form can check a file as someone types it. It is a POST, as
                 a file doesn't fit in a URL.
            operationId: ComposeService_CheckCompose
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CheckComposeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CheckComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/compose:import:
        post:
            tags:
                - ComposeService
            description: |-
                ImportCompose plans a Compose file into a project as a change, ready to
                 apply or discard, as ProposeChange does with edits. Each Compose service
                 becomes a service, and each named volume and network one of its own. A
                 field of the file that Dockwell can't run yet is refused, by name, rather
                 than dropped. The plan brings the project to life if it doesn't exist yet,
                 and importing into one that does shows as updates.
            operationId: ComposeService_ImportCompose
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ImportComposeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ImportComposeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/domains:
        get:
            tags:
                - DomainService
            description: |-
                ListDomains returns the domains of the routes that exist now, sorted by
                 name, with each one's routes and where its certificate and DNS stand on
                 each server. A domain whose certificate is on its way answers over HTTPS
                 once it's issued; poll this to follow it.
            operationId: DomainService_ListDomains
            parameters:
                - name: environment
                  in: query
                  description: |-
                    Only domains with a route in this environment, by ID. Empty means every
                     environment.
                  schema:
                    type: string
                - name: service
                  in: query
                  description: |-
                    Only domains with a route to this service, by name. It needs environment,
                     as a service's name is unique only in its environment.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDomainsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:
        get:
            tags:
                - ChangeService
            description: |-
                ListDrift compares what servers have with the latest revision of each
                 resource they should have, and returns every difference. It asks each
                 connected server's agent, and changes nothing.
            operationId: ChangeService_ListDrift
            parameters:
                - name: serverId
                  in: query
                  description: A server's ID. Empty looks on every server.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:adopt:
        post:
            tags:
                - ChangeService
            description: |-
                AdoptDrift plans keeping what a server has for a drifted resource: a
                 new revision that matches it. Nothing changes on that server; any other
                 server the resource runs on is brought to match, and the plan shows it.
            operationId: ChangeService_AdoptDrift
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AdoptDriftRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdoptDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/drift:revert:
        post:
            tags:
                - ChangeService
            description: |-
                RevertDrift plans putting a drifted resource back to its latest
                 revision on the servers it runs on.
            operationId: ChangeService_RevertDrift
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevertDriftRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevertDriftResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/events:
        get:
            tags:
                - EventService
            description: ListEvents returns events, newest first, a page at a time.
            operationId: EventService_ListEvents
            parameters:
                - name: pageSize
                  in: query
                  description: 'How many events to return: 50 when unset, and at most 200.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before, or of a
                     watch's snapshot. Empty starts with the newest. Pass the same filters
                     with it.
                  schema:
                    type: string
                - name: kinds
                  in: query
                  description: Only events of these kinds. Empty means every kind.
                  schema:
                    type: array
                    items:
                        enum:
                            - EVENT_KIND_UNSPECIFIED
                            - EVENT_KIND_CHANGE
                            - EVENT_KIND_SERVER
                            - EVENT_KIND_ACCESS
                        type: string
                        format: enum
                - name: serverId
                  in: query
                  description: |-
                    Only what happened on or to one server, by ID: the changes with steps
                     on it, and its own events, such as joining.
                  schema:
                    type: string
                - name: resourceId
                  in: query
                  description: |-
                    Only the changes to one resource, by ID, or to what lives in it: a
                     service's changes, or a project's with those of its environments and
                     their services.
                  schema:
                    type: string
                - name: actorId
                  in: query
                  description: |-
                    Only what one actor did, by the ID their Actor has: a user's
                     ("usr_…"), an API token's ("tok_…"), a server's ("srv_…"), or a
                     shell account's ("mira@hz-1"). A change counts for whoever proposed it
                     and whoever applied it.
                  schema:
                    type: string
                - name: actorKind
                  in: query
                  description: |-
                    Only what actors of one kind did, such as Dockwell on its own, or
                     someone in a shell on the control server.
                  schema:
                    enum:
                        - ACTOR_KIND_UNSPECIFIED
                        - ACTOR_KIND_USER
                        - ACTOR_KIND_TOKEN
                        - ACTOR_KIND_DOCKWELL
                        - ACTOR_KIND_SERVER
                        - ACTOR_KIND_SHELL
                    type: string
                    format: enum
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListEventsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:
        get:
            tags:
                - AuthService
            description: ListPasskeys returns your passkeys, oldest first.
            operationId: AuthService_ListPasskeys
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPasskeysResponse'

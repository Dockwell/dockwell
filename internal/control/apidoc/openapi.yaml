    /v1/auditEvents:
        get:
            tags:
                - AuditService
            description: |-
                ListAuditEvents returns the audit log, newest first, a page at a time.
                 The filters narrow it, and combine: an event must pass each one that is
                 set.
            operationId: AuditService_ListAuditEvents
            parameters:
                - name: pageSize
                  in: query
                  description: 'How many events to return: 100 when unset, and at most 500.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Empty starts with
                     the newest. Pass the same filters with it.
                  schema:
                    type: string
                - name: since
                  in: query
                  description: Only what happened at or after this. Unset keeps everything.
                  schema:
                    type: string
                    format: date-time
                - name: actor
                  in: query
                  description: Only what one kind of actor did.
                  schema:
                    enum:
                        - AUDIT_ACTOR_UNSPECIFIED
                        - AUDIT_ACTOR_PERSON
                        - AUDIT_ACTOR_TOKEN
                        - AUDIT_ACTOR_DOCKWELL
                        - AUDIT_ACTOR_SERVER
                        - AUDIT_ACTOR_SHELL
                        - AUDIT_ACTOR_STRANGER
                    type: string
                    format: enum
                - name: surface
                  in: query
                  description: Only what came from one place, such as the panel.
                  schema:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    format: enum
                - name: query
                  in: query
                  description: |-
                    Only events this is in, whatever its case: in the action, such as
                     "token.create"; in the actor or what the event acted on, by ID or by the
                     name of the person, token or server; or in the event's words, which name
                     addresses.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListAuditEventsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'

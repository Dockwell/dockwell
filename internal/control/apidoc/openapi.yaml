                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/backups/{id}:restore:
        post:
            tags:
                - BackupService
            description: |-
                RestoreBackup plans replacing what's in a backup's volume with what the
                 backup holds, as a change. Its plan says what it replaces and what stops, and
                 it destroys data, so only a person can apply it, with the plan's fingerprint.
                 The server keeps a copy of what's replaced for 7 days, and undoing the change
                 puts that back.
            operationId: BackupService_RestoreBackup
            parameters:
                - name: id
                  in: path
                  description: The backup's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RestoreBackupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RestoreBackupResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/backups:preview:
        get:
            tags:
                - BackupService
            description: |-
                PreviewBackup says what backing up a volume would do, asking its server, and
                 changes nothing: the database's own dump, or a copy of its files, and what
                 runs on it now. A copy of a running app's files can hold half a write, so

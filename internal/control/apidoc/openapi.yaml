                 its last run went on each of its servers. It reads the control plane's
                 records, so it answers with a server offline.
            operationId: TaskService_ListTasks
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTasksResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/tasks/{id}:
        get:
            tags:
                - TaskService
            description: GetTask returns one task, by ID or by name.
            operationId: TaskService_GetTask
            parameters:
                - name: id
                  in: path
                  description: The task's ID, or its name with project and environment.
                  required: true
                  schema:
                    type: string
                - name: project
                  in: query
                  description: The project, by name or ID, when id is a name. Left out while there's only one.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment, by name or ID, when id is a name. Left out while its project
                     has only one.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTaskResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/tasks/{id}/runs:
        get:
            tags:
                - TaskService
            description: |-
                ListTaskRuns returns a task's runs, newest first, with what each printed. A
                 run's output can hold anything its command prints, so reading it takes what
                 reading logs takes.
            operationId: TaskService_ListTaskRuns
            parameters:
                - name: id
                  in: path
                  description: The task's ID, or its name with project and environment.
                  required: true
                  schema:
                    type: string
                - name: project
                  in: query
                  description: The project, by name or ID, when id is a name. Left out while there's only one.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment, by name or ID, when id is a name. Left out while its project
                     has only one.
                  schema:
                    type: string
                - name: server
                  in: query
                  description: Only its runs on this server, by name or ID.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many, newest first: 20 unless set, at most 100.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: Where the last page ended.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTaskRunsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/tasks/{id}:run:
        post:
            tags:
                - TaskService
            description: |-
                RunTask runs a task now, on one of its servers, which has to be connected. It
                 runs what was approved, as its schedule would, paused or not, and returns
                 once the run has started: follow it with ListTaskRuns.
            operationId: TaskService_RunTask
            parameters:
                - name: id
                  in: path
                  description: The task's ID, or its name with project and environment.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RunTaskRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RunTaskResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/terminals/{terminalId}:close:
        post:
            tags:
                - TerminalService
            description: |-
                CloseTerminal hangs up a terminal's shell, as closing an SSH session does,
                 and ends it. No API token can call it.
            operationId: TerminalService_CloseTerminal
            parameters:
                - name: terminalId
                  in: path
                  description: The terminal's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CloseTerminalRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CloseTerminalResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/terminals/{terminalId}:write:
        post:
            tags:
                - TerminalService
            description: |-
                WriteTerminal types into a terminal you're attached to, and changes its
                 size. Each write says where it starts in all that's been typed, so one sent
                 twice types nothing twice. A write the terminal hasn't room for is taken in
                 part, and offset in the response says how much: send the rest after. No API
                 token can call it.
            operationId: TerminalService_WriteTerminal
            parameters:
                - name: terminalId
                  in: path
                  description: The terminal's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/WriteTerminalRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/WriteTerminalResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/tokens:
        get:
            tags:
                - TokenService
            description: ListTokens returns your tokens that still work, newest first.
            operationId: TokenService_ListTokens
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListTokensResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - TokenService
            description: |-
                CreateToken makes a new token for you. It needs a proof from
                 AuthService.FinishStepUp for creating a token. The secret is in the
                 response, and only there: Dockwell keeps only its hash.
            operationId: TokenService_CreateToken
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateTokenRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateTokenResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/tokens/{id}:revoke:
        post:
            tags:
                - TokenService
            description: |-
                RevokeToken stops one of your tokens working at once. Its open streams
                 close.
            operationId: TokenService_RevokeToken
            parameters:
                - name: id
                  in: path
                  description: The token's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevokeTokenRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevokeTokenResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:
        get:
            tags:
                - AuthService
            description: |-
                GetTotp says whether you sign in with an authenticator app, and how many
                 recovery codes are left.
            operationId: AuthService_GetTotp
            responses:
                "200":
                    description: OK
                    content:
                        application/json:

                DeleteWebsite plans deleting a website: its route, what serves it, and its
                 project. Undoing it brings it all back. Its folder on the server, if it has
                 one, stays where it is.
            operationId: WebsiteService_DeleteWebsite
            parameters:
                - name: id
                  in: path
                  description: The website, by its project's name or ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteWebsiteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteWebsiteResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/websites/{id}:update:
        post:
            tags:
                - WebsiteService
            description: |-
                UpdateWebsite plans changing what a website serves, ready to apply or
                 discard. Its domain, and what's in front of it, stay as they are: change
                 those as for any route.
            operationId: WebsiteService_UpdateWebsite
            parameters:
                - name: id
                  in: path
                  description: The website, by its project's name or ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateWebsiteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateWebsiteResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/websites:preview:
        post:
            tags:
                - WebsiteService
            description: |-
                PreviewWebsite says what a website's own web server would run for what it
                 serves, planning nothing. It refuses what can't be served as CreateWebsite
                 would, so you can check settings before you plan them.
            operationId: WebsiteService_PreviewWebsite
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PreviewWebsiteRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PreviewWebsiteResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        Actor:
            type: object
            properties:
                kind:
                    enum:
                        - ACTOR_KIND_UNSPECIFIED
                        - ACTOR_KIND_USER
                        - ACTOR_KIND_TOKEN
                        - ACTOR_KIND_DOCKWELL
                        - ACTOR_KIND_SERVER
                        - ACTOR_KIND_SHELL
                    type: string
                    description: What kind of actor it is.
                    format: enum
                id:
                    type: string
                    description: |-
                        The user's, token's or server's ID, or a shell account's name, such as
                         "mira@hz-1". Empty for Dockwell.
                name:
                    type: string
                    description: |-
                        The name to show, such as "Mira Chen", a token's name, such as
                         "GitHub Actions deploy", or a server's, such as "hz-2".
                localAccess:
                    allOf:
                        - $ref: '#/components/schemas/LocalAccess'
                    description: |-
                        For a token the CLI made for local access on the control server, who
                         asked for it there. Unset for every other actor: a token's name is
                         whatever its maker typed, so only this says a token is local access's.
            description: Actor is who made a change, or applied it, or did what an event records.
        AddServicePortRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                hostPort:
                    type: integer
                    description: The port on the server, such as 8080.
                    format: uint32
                containerPort:
                    type: integer
                    description: The port in the app, such as 80.
                    format: uint32
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP when unset.
                    format: enum
                hostIp:
                    type: string
                    description: |-
                        The server's address to publish on, such as "127.0.0.1". Empty publishes
                         on every address.
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says which port it adds.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: AddServicePortRequest names a service and the port to publish.
        AddServicePortResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: AddServicePortResponse carries the planned change.
        AdoptComposeRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The Compose project, as its containers' labels name it, such as "shop".
                server:
                    type: string
                    description: |-
                        The server it runs on, by name or ID. It can be left out while there is only
                         one.
                project:
                    type: string
                    description: |-
                        The project its services go in, by name or ID, brought to life if it isn't
                         there. Unset takes one named after it.
                environment:
                    type: string
                    description: The environment its services go in, by name or ID.
            description: AdoptComposeRequest names a Compose project on a server.
        AdoptComposeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned and not applied.
            description: AdoptComposeResponse carries the plan.
        AdoptContainerRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The container, by its name or its full ID.
                server:
                    type: string
                    description: The server it is on, by name or ID. It can be left out while there is only one.
                service:
                    type: string
                    description: |-
                        What to call the service. Unset takes the container's Compose service, or its
                         own name, written as a service's name.
                project:
                    type: string
                    description: The project the service goes in, by name or ID.
                environment:
                    type: string
                    description: The environment the service goes in, by name or ID.
            description: AdoptContainerRequest names a container, and what to make of it.
        AdoptContainerResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned and not applied.
            description: AdoptContainerResponse carries the plan.
        AdoptDriftRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server whose version to keep.
                resourceId:
                    type: string
                    description: The resource's ID.
            description: AdoptDriftRequest names a drifted resource to keep as it is.
        AdoptDriftResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, whose revision matches what the server has.
            description: AdoptDriftResponse carries the planned adoption.
        AgentListener:
            type: object
            properties:
                listen:
                    type: string
                    description: The address it listens on, such as ":7443".
                url:
                    type: string
                    description: |-
                        The URL a server on the control server's own network reaches it at, as
                         a join ticket names it, such as "https://192.0.2.10:7443". Empty for an
                         API token.
                publicUrls:
                    type: array
                    items:
                        type: string
                    description: |-
                        The URLs a server elsewhere reaches it at, in the order a ticket tries
                         them. Empty when that isn't known, and for an API token.
            description: AgentListener is where servers' agents reach the control plane.
        ApplyChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
                fingerprint:
                    type: string
                    description: |-
                        The fingerprint of the plan you reviewed. When set, the change applies
                         only if its plan has it. A plan that destroys data, may cut off access,
                         or lets two containers write to one place needs it.
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for applying this change. A plan that gives
                         something as much as root on a server needs it, which is why no API token
                         can apply one. Call without it first: it checks everything else, then
                         refuses with the reason needs_step_up.
            description: ApplyChangeRequest names a planned change to apply.
        ApplyChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change: applying, with its steps queued; or applied, when it had
                         no steps to run.
            description: ApplyChangeResponse carries the change as it starts applying.
        AuditEvent:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "evt_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                time:
                    type: string
                    description: When it happened.
                    format: date-time
                actor:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: |-
                        Who did it. Unset for someone who wasn't signed in, whose address is in
                         address instead.
                action:
                    type: string
                    description: |-
                        What happened, such as "auth.sign_in", "token.refuse" or
                         "change.applied".
                surface:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it came from.
                    format: enum
                target:
                    allOf:
                        - $ref: '#/components/schemas/EventSubject'
                    description: |-
                        Who or what it acted on, other than its actor, such as the token made or
                         the server that joined, with its name where Dockwell still knows it.
                         Unset when there is nothing more to name.
                subject:
                    type: string
                    description: |-
                        The ID it is about, such as a change's for a change's events, or the
                         person's for signing in. Empty when it is about nothing more.
                detail:
                    type: string
                    description: |-
                        What Dockwell recorded with it, as it was recorded: words for people,
                         such as "passkey on localhost from 203.0.113.9, session ses_…" for a
                         sign-in, or facts for a program, such as a setting's value and the one it
                         replaced. It may name addresses. Empty when there was nothing more. To say
                         the event in words, read event.
                address:
                    type: string
                    description: |-
                        The address someone who wasn't signed in came from, such as
                         "203.0.113.9". Empty for everyone else.
                event:
                    allOf:
                        - $ref: '#/components/schemas/Event'
                    description: |-
                        The same event as Activity has it, with the facts it carries, such as a
                         backup's volume, a health check's state, a setting's value, or a change
                         with its plan, as it is now, for saying the event in words.
            description: AuditEvent is one event of the audit log, as it was recorded.
        AutomaticUpdates:
            type: object
            properties:
                tool:
                    type: string
                    description: |-
                        The tool, such as "unattended-upgrades" or "dnf-automatic". Empty when
                         there's none.
                on:
                    type: boolean
                    description: True when it's on.
            description: |-
                AutomaticUpdates is whether a server installs updates by itself, as the
                 distribution's own tool for that is set.
        Backup:
            type: object
            properties:
                id:
                    type: string
                    description: The backup's ID, such as "bkp_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                environmentId:
                    type: string
                    description: The environment its volume is in, by ID.
                volume:
                    type: string
                    description: The volume, by name. It stays after the volume is deleted.
                volumeId:
                    type: string
                    description: The volume's ID.
                serverId:
                    type: string
                    description: The server that holds it, by ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                state:
                    enum:
                        - BACKUP_STATE_UNSPECIFIED
                        - BACKUP_STATE_RUNNING
                        - BACKUP_STATE_DONE
                        - BACKUP_STATE_FAILED
                    type: string
                    description: Where it is.
                    format: enum
                method:
                    enum:
                        - BACKUP_METHOD_UNSPECIFIED
                        - BACKUP_METHOD_DUMP
                        - BACKUP_METHOD_COPY
                        - BACKUP_METHOD_COPY_RUNNING
                    type: string
                    description: How it's taken. Unset until the server says.
                    format: enum
                database:
                    type: string
                    description: The database it's a dump of, such as "PostgreSQL". Empty for any other.
                sizeBytes:
                    type: string
                    description: Its size on the server's disk, in bytes.
                sha256:
                    type: string
                    description: Its SHA-256, in hex.
                startedAt:
                    type: string
                    description: When it started.
                    format: date-time
                finishedAt:
                    type: string
                    description: When it ended. Unset while it runs.
                    format: date-time
                actor:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who took it.
                error:
                    type: string
                    description: Why it failed, for people.
                filesChanged:
                    type: string
                    description: How many files changed while they were read, for a copy of a running app.
                progress:
                    type: string
                    description: 'How one under way is going, for people, such as "Copying data: 1.2 GB so far".'
                policyId:
                    type: string
                    description: The policy that took it, by ID. Empty for one someone took.
                destination:
                    type: string
                    description: The destination it went to, by name. Empty for one that stayed on its server.
                copy:
                    enum:
                        - BACKUP_COPY_UNSPECIFIED
                        - BACKUP_COPY_PENDING
                        - BACKUP_COPY_STORED
                        - BACKUP_COPY_FAILED
                    type: string
                    description: Where it stands there.
                    format: enum
                copyError:
                    type: string
                    description: Why it isn't there, for people. Empty unless the copy failed.
                onServer:
                    type: boolean
                    description: |-
                        True while it can be restored where it is: its server has it, is in the fleet and
                         connected, and still has its volume. A backup that's stored has to be fetched
                         otherwise.
                fetchError:
                    type: string
                    description: Why it couldn't be fetched back, for people. Empty once it has been.
                sealedEarlier:
                    type: boolean
                    description: |-
                        True when its copy won't open with what its destination has now, as the
                         destination was removed, or removed and added again with another passphrase. Only
                         the passphrase that sealed it opens it.
                fetchOnto:
                    type: array
                    items:
                        type: string
                    description: |-
                        The connected servers it can be fetched onto, by name: those its volume is on. Set
                         for a stored backup that isn't on a server that can restore it now.
            description: Backup is one backup of one volume.
        BackupDestination:
            type: object
            properties:
                endpoint:
                    type: string
                    description: The storage's address, such as "https://<account>.r2.cloudflarestorage.com".
                region:
                    type: string
                    description: 'The bucket''s region: "auto" unless set.'
                bucket:
                    type: string
                    description: The bucket.
                prefix:
                    type: string
                    description: |-
                        What each object's name starts with, such as "dockwell". Empty uses the bucket
                         from the top.
                accessKey:
                    type: string
                    description: The access key's ID.
                secretKey:
                    type: string
                    description: The access key's secret.
                passphrase:
                    type: string
                    description: |-
                        What backups are encrypted with before they leave. Nothing but this opens them,
                         and dockwell open-backup needs it: keep a copy somewhere that isn't this install.
                         Set it when you add a destination, and leave it out of an update, which keeps it:
                         an update that sets one is refused, as every copy there is sealed with it.
            description: |-
                BackupDestination is S3-compatible storage that backups go to as well as the
                 server's disk, so they outlive it: Amazon S3, Cloudflare R2, Backblaze B2, MinIO
                 and the like. It lives in the organization, and any environment's backups can use
                 it. A backup is encrypted on its server before it leaves, so the storage never
                 reads what it holds. Dockwell keeps this encrypted, and sends it only to the server
                 that's sending a backup, for that one call. See
                 docs/adr/0033-backups-of-volumes-and-databases.md.
        BackupDestinationInfo:
            type: object
            properties:
                id:
                    type: string
                    description: The destination's ID.
                name:
                    type: string
                    description: Its name.
                endpoint:
                    type: string
                    description: The storage's address.
                bucket:
                    type: string
                    description: The bucket.
                prefix:
                    type: string
                    description: What each object's name starts with.
                backups:
                    type: integer
                    description: How many backups are there.
                    format: int32
                usedBytes:
                    type: string
                    description: How much those take, in bytes.
                lastUpload:
                    type: string
                    description: When the last one got there. Unset until one has.
                    format: date-time
                lastFailure:
                    type: string
                    description: |-
                        When the newest backup that didn't get there was taken, and why it
                         didn't. Unset until one has failed. The destination is failing when
                         this is newer than last_upload.
                    format: date-time
                lastFailureError:
                    type: string
            description: BackupDestinationInfo is S3-compatible storage, with nothing that signs in to it.
        BackupFirst:
            type: object
            properties:
                backupId:
                    type: string
                    description: The backup's ID, once it's taken.
                method:
                    enum:
                        - BACKUP_METHOD_UNSPECIFIED
                        - BACKUP_METHOD_DUMP
                        - BACKUP_METHOD_COPY
                        - BACKUP_METHOD_COPY_RUNNING
                    type: string
                    description: How it's taken.
                    format: enum
                database:
                    type: string
                    description: The database of a dump, such as "PostgreSQL".
                stops:
                    type: array
                    items:
                        type: string
                    description: |-
                        What stops while it's copied: services by name, and anything else by its
                         container's. A database's dump stops nothing.
                estimateBytes:
                    type: string
                    description: About how much it will take on the server's disk, in bytes.
                unmeasured:
                    type: boolean
                    description: |-
                        True when nothing could tell: there was no backup before, and measuring the
                         volume took too long. The time the step gets is a guess, and the plan says so.
            description: |-
                BackupFirst is a backup a change takes before anything else it does, as a catalog
                 upgrade takes one of what the new version may change. If it fails, the change stops
                 there, with nothing else done.
        BackupPolicy:
            type: object
            properties:
                volume:
                    type: string
                    description: The volume, by name, in this environment.
                every:
                    enum:
                        - EVERY_UNSPECIFIED
                        - EVERY_HOUR
                        - EVERY_DAY
                        - EVERY_WEEK
                    type: string
                    description: How often it runs.
                    format: enum
                at:
                    type: string
                    description: 'The time it runs, as 24-hour HH:MM: "03:00" unless set.'
                weekday:
                    type: integer
                    description: The day it runs each week, as 0 for Sunday to 6 for Saturday.
                    format: int32
                timeZone:
                    type: string
                    description: |-
                        The time zone at is in, such as "Europe/Amsterdam". Left out, a change
                         that makes or updates the policy sets the install's time zone, from
                         Settings, and UTC where the install has none.
                keep:
                    type: integer
                    description: 'How many of its backups to keep, on each server, newest first: 7 unless set.'
                    format: uint32
                stop:
                    type: boolean
                    description: |-
                        Stop what runs on the volume for an exact copy of its files, and start it again
                         after. A database's dump stops nothing. Without it, a copy of a running app's
                         files can hold half a write.
                destination:
                    type: string
                    description: |-
                        The backup destination each backup also goes to, by name. Empty keeps them on
                         the server alone, so they go if it does.
            description: |-
                BackupPolicy backs up a volume in its environment on a schedule, on every server
                 that has it, and keeps the newest of those backups. A backup someone takes by
                 hand is theirs, and no policy deletes it. The control plane runs the schedule, so
                 a run due while it's down happens when it's back.
        BackupPolicyInfo:
            type: object
            properties:
                id:
                    type: string
                    description: The policy's ID.
                name:
                    type: string
                    description: Its name.
                environmentId:
                    type: string
                    description: The environment it's in, by ID.
                spec:
                    allOf:
                        - $ref: '#/components/schemas/BackupPolicy'
                    description: What it asks for.
                nextRun:
                    type: string
                    description: When it next runs.
                    format: date-time
                last:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: Its newest backup, on any server. Unset until it has run.
                kept:
                    type: integer
                    description: How many of its backups are kept now.
                    format: int32
                keptBytes:
                    type: string
                    description: How much those take, in bytes.
            description: BackupPolicyInfo is a schedule of backups, as it stands.
        BeginAddPasskeyRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for adding a passkey. Leave it out within
                         10 minutes of signing in with a code, a recovery code or a link from
                         dockwell recover.
            description: BeginAddPasskeyRequest confirms adding a passkey.
        BeginAddPasskeyResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishAddPasskey.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialCreationOptionsJSON.
            description: BeginAddPasskeyResponse carries the options for creating the passkey.
        BeginClaimRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the claim link.
                name:
                    type: string
                    description: The owner's name, such as "Mira Chen".
                email:
                    type: string
                    description: The owner's email.
            description: BeginClaimRequest names the owner.
        BeginClaimResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishClaim.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialCreationOptionsJSON.
            description: BeginClaimResponse carries the options for creating the passkey.
        BeginPasskeySignInRequest:
            type: object
            properties: {}
            description: |-
                BeginPasskeySignInRequest takes no parameters: the browser offers the
                 passkeys it holds for this address.
        BeginPasskeySignInResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishPasskeySignIn.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialRequestOptionsJSON.
            description: BeginPasskeySignInResponse carries the options for the passkey assertion.
        BeginStepUpRequest:
            type: object
            properties:
                action:
                    enum:
                        - STEP_UP_ACTION_UNSPECIFIED
                        - STEP_UP_ACTION_REVEAL_SECRET
                        - STEP_UP_ACTION_ADD_PASSKEY
                        - STEP_UP_ACTION_REMOVE_PASSKEY
                        - STEP_UP_ACTION_SET_UP_CODES
                        - STEP_UP_ACTION_DISABLE_CODES
                        - STEP_UP_ACTION_REGENERATE_RECOVERY_CODES
                        - STEP_UP_ACTION_CREATE_TOKEN
                        - STEP_UP_ACTION_APPLY_ROOT_CHANGE
                        - STEP_UP_ACTION_SAVE_WAY_BACK_IN
                        - STEP_UP_ACTION_END_PROCESS
                        - STEP_UP_ACTION_OPEN_TERMINAL
                    type: string
                    description: The action.
                    format: enum
                target:
                    type: string
                    description: |-
                        What it acts on: a secret's ID to reveal it, a passkey's to remove it.
                         Leave it out for an action on your own account, such as adding a
                         passkey.
            description: BeginStepUpRequest says what the passkey confirms.
        BeginStepUpResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishStepUp.
                optionsJson:
                    type: string
                    description: |-
                        PublicKeyCredentialRequestOptionsJSON, which allows only your passkeys
                         for this address.
            description: BeginStepUpResponse carries the options for the passkey's assertion.
        BeginTotpSetupRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for setting up code sign-in.
            description: BeginTotpSetupRequest confirms setting up code sign-in.
        BeginTotpSetupResponse:
            type: object
            properties:
                secret:
                    type: string
                    description: The secret in base32, for typing into an authenticator app.
                uri:
                    type: string
                    description: The otpauth:// URI, for a QR code.
            description: BeginTotpSetupResponse carries the new secret.
        BuildInfo:
            type: object
            properties:
                version:
                    type: string
                    description: |-
                        Semantic version such as "v0.4.0", a Go pseudo-version for builds
                         between releases such as "v0.4.1-0.20261103214000-3f2a9c1d4e5b", or
                         "devel" when the build carries no version at all. Only the first two
                         parse as semver.
                commit:
                    type: string
                    description: Full commit hash the binary was built from. Empty when unknown.
                commitTime:
                    type: string
                    description: Time of that commit. Unset when unknown.
                    format: date-time
                modified:
                    type: boolean
                    description: True when the working tree had uncommitted changes at build time.
                goVersion:
                    type: string
                    description: Go toolchain that built the binary, such as "go1.27.3".
                platform:
                    type: string
                    description: Target operating system and architecture, such as "linux/amd64".
                edition:
                    enum:
                        - BUILD_EDITION_UNSPECIFIED
                        - BUILD_EDITION_FULL
                        - BUILD_EDITION_AGENT
                    type: string
                    description: |-
                        Which of the two builds of dockwell this is. Unset in builds made before
                         there were two, which are all the full build.
                    format: enum
            description: BuildInfo identifies one build of the dockwell binary.
        CancelTotpSetupRequest:
            type: object
            properties: {}
            description: CancelTotpSetupRequest takes nothing.
        CancelTotpSetupResponse:
            type: object
            properties: {}
            description: CancelTotpSetupResponse is empty.
        CatalogInstall:
            type: object
            properties:
                projectId:
                    type: string
                    description: The project's ID.
                project:
                    type: string
                    description: The project's name, such as "postgres".
                pin:
                    allOf:
                        - $ref: '#/components/schemas/CatalogPin'
                    description: What it's pinned to.
                name:
                    type: string
                    description: |-
                        The app's name, such as "PostgreSQL". Empty once the catalog no longer has
                         the entry, as the install stays pinned to it.
                webServiceId:
                    type: string
                    description: |-
                        The ID of the service a person opens: what its entry names, or one of its
                         services when that names none, as a tunnel's.
                firstSteps:
                    type: string
                    description: What to do first, as the entry says it. Empty when it says nothing.
                environmentId:
                    type: string
                    description: The environment its services run in, by ID, whose secrets it uses.
                upgrade:
                    allOf:
                        - $ref: '#/components/schemas/CatalogUpgrade'
                    description: |-
                        What it can move to, when the catalog has a release that changes what runs. A
                         version the same as the pin's is a change to how that version runs. Unset when
                         it's up to date, when a release changes only an entry's words, when the catalog
                         no longer has its entry, or when the install has no record of its file.
            description: CatalogInstall is one project installed from the catalog.
        CatalogPart:
            type: object
            properties:
                service:
                    type: string
                    description: Its name in the entry's Compose file, such as "db".
                image:
                    type: string
                    description: |-
                        The image it runs, by repository and tag, such as "postgres:17.11". The entry
                         pins it by digest too, which this leaves out.
                database:
                    type: boolean
                    description: |-
                        It's a database the app beside it keeps its data in: one its entry marks as
                         one, or, for an entry that marks none, one of the images Dockwell knows as a
                         database, such as postgres or mariadb.
                volumes:
                    type: array
                    items:
                        type: string
                    description: The volumes it keeps its data on, by name, such as "data".
                opens:
                    type: boolean
                    description: It's what a person opens once it's installed.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What it reaches on its server beyond its own containers, as the plan will say
                         it: a server path, Docker's socket, the server's own network and the like.
                pathInputs:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The input each server path in host_access comes from, by the path as it reads
                         here, which is the input's default, so a form shows what a person typed in its
                         place, such as "MEDIA_DIR" for "/srv/media".
            description: CatalogPart is one service an entry installs.
        CatalogPin:
            type: object
            properties:
                entry:
                    type: string
                    description: The entry's ID, such as "postgres".
                version:
                    type: string
                    description: The app's version as installed, such as "17.11".
                release:
                    type: integer
                    description: The entry's release as installed, which a newer one's goes past.
                    format: uint32
                repository:
                    type: string
                    description: The repository the entry came from.
                commit:
                    type: string
                    description: The commit it came from.
                values:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        What each input that isn't a secret was given, by name, so an upgrade gives
                         the same.
                file:
                    type: string
                    description: |-
                        The entry's Compose file at this release, with its ${NAME}s as written, so it
                         holds no secret. Read with values, it's what the file gave, which an upgrade
                         needs to tell that from what a person changed since. Empty for an install from
                         before Dockwell kept it, which can't be upgraded.
                    format: bytes
            description: |-
                CatalogPin is what an install is pinned to: updates come from there, and each
                 is a plan. It holds no secret: those are the environment's, by reference.
        CatalogUpgrade:
            type: object
            properties:
                version:
                    type: string
                    description: The app's version in it, such as "17.12".
                release:
                    type: integer
                    description: The entry's release.
                    format: uint32
            description: CatalogUpgrade is a newer release of an install's entry.
        Certificate:
            type: object
            properties:
                state:
                    enum:
                        - CERTIFICATE_STATE_UNSPECIFIED
                        - CERTIFICATE_STATE_PENDING
                        - CERTIFICATE_STATE_ISSUED
                        - CERTIFICATE_STATE_FAILED
                        - CERTIFICATE_STATE_NONE
                    type: string
                    description: Where it stands.
                    format: enum
                problem:
                    enum:
                        - CERTIFICATE_PROBLEM_UNSPECIFIED
                        - CERTIFICATE_PROBLEM_DNS
                        - CERTIFICATE_PROBLEM_CONNECTION
                        - CERTIFICATE_PROBLEM_WRONG_SERVER
                        - CERTIFICATE_PROBLEM_RATE_LIMITED
                        - CERTIFICATE_PROBLEM_CAA
                        - CERTIFICATE_PROBLEM_REFUSED
                        - CERTIFICATE_PROBLEM_OTHER
                        - CERTIFICATE_PROBLEM_CANT_REACH_CA
                    type: string
                    description: |-
                        Why it failed, or why renewing it is failing while an issued one still
                         serves. Unset otherwise.
                    format: enum
                message:
                    type: string
                    description: |-
                        For people: what is happening or what went wrong, what follows, and how
                         to fix it. Dockwell keeps trying a failed certificate by itself.
                expireTime:
                    type: string
                    description: When an issued certificate expires. Renewing it is automatic.
                    format: date-time
            description: Certificate is where a domain's certificate stands on a server.
        Change:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                summary:
                    type: string
                    description: What it is for, such as "Add a staging environment".
                state:
                    enum:
                        - CHANGE_STATE_UNSPECIFIED
                        - CHANGE_STATE_PLANNED
                        - CHANGE_STATE_APPLYING
                        - CHANGE_STATE_APPLIED
                        - CHANGE_STATE_FAILED
                        - CHANGE_STATE_DISCARDED
                    type: string
                    description: Where it is.
                    format: enum
                proposedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who proposed it.
                proposedVia:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it was proposed from.
                    format: enum
                createTime:
                    type: string
                    description: When it was proposed.
                    format: date-time
                plan:
                    allOf:
                        - $ref: '#/components/schemas/Plan'
                    description: |-
                        What applying does, as it was reviewed. It never changes. A rollback,
                         which nobody reviews, has the plan it ran with. ListChanges gives it in
                         brief, without resources and servers.
                reverts:
                    type: string
                    description: The change this one undoes or rolls back, if any.
                rollback:
                    type: boolean
                    description: True for a change Dockwell made to roll back a failed one.
                appliedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who applied it. Unset until it is applied.
                appliedVia:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it was applied from. Unset until it is applied.
                    format: enum
                applyTime:
                    type: string
                    description: When it started applying. Unset until then.
                    format: date-time
                undoDeadline:
                    type: string
                    description: Until when UndoChange works, once it is applied. Unset otherwise.
                    format: date-time
                error:
                    type: string
                    description: |-
                        Why it failed, when it did, in plain words: the fact, then the
                         consequence, then the fix. The step that failed has what the server said
                         in its detail.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/StepProgress'
                    description: |-
                        Each step of the plan with its progress, once it is applying: servers
                         in plan order, and on each the steps in the order they run.
                rolledBackBy:
                    type: string
                    description: |-
                        The change that rolled this one back after it failed, if any. It may
                         still be applying, as when it waits for a server to reconnect, or have
                         failed: rollback_status says how it went.
                undoneBy:
                    type: string
                    description: The applied change that undid this one, if any.
                rollbackStatus:
                    allOf:
                        - $ref: '#/components/schemas/RollbackStatus'
                    description: |-
                        How the rollback in rolled_back_by is going, which is what says whether
                         what ran before is back. It moves on after this change has failed, so
                         read it afresh, or follow the rollback with WatchChange. Unset when there
                         is no rollback.
                because:
                    type: string
                    description: |-
                        Why Dockwell made this change, when it made it on its own: for a rollback,
                         what failed in the change it rolls back, in the plain words of that change's
                         error, with what the health check said where a health check failed: short,
                         cleaned and masked.
                restart:
                    type: boolean
                    description: True for a restart, which makes no revision.
            description: |-
                Change is one action's worth of edits to managed resources: planned,
                 then applied, failed or discarded.
        CheckClaimRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the claim link, the part after "#".
            description: CheckClaimRequest carries a claim link's token.
        CheckClaimResponse:
            type: object
            properties:
                server:
                    allOf:
                        - $ref: '#/components/schemas/Server'
                    description: The control server, as its agent last reported it.
                publicAddress:
                    type: string
                    description: |-
                        This server's public IP address, such as "203.0.113.7", for pointing a
                         domain at: an A record, or AAAA for an IPv6 address. Empty when the
                         server doesn't know one, as behind NAT, where its own address is private.
                expireTime:
                    type: string
                    description: When the link stops working.
                    format: date-time
            description: CheckClaimResponse describes the server a valid claim link claims.
        CheckComposeRequest:
            type: object
            properties:
                compose:
                    type: string
                    description: The Compose file, as YAML, as ImportCompose takes it.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: Values for the variables the file uses, as ImportCompose takes them.
                env:
                    type: string
                    description: |-
                        The .env file beside the Compose file, as ImportCompose takes it. A variable
                         it gives needs no other value.
                directory:
                    type: string
                    description: The directory the file is in on the servers, as ImportCompose takes it.
            description: CheckComposeRequest is a Compose file to read.
        CheckComposeResponse:
            type: object
            properties:
                refusal:
                    allOf:
                        - $ref: '#/components/schemas/ComposeRefusal'
                    description: |-
                        Why ImportCompose would refuse the file, when it would: the first thing
                         in the way. Fix it and check again for the next. Unset when it would take
                         it. What it would refuse whatever its variables hold comes before a variable
                         with no value, so no one types a secret for a file it then refuses.
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ComposeVariable'
                    description: |-
                        The variables the file uses, whether or not the file can be read
                         further than that.
                services:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceInfo'
                    description: |-
                        The services it would make, in the order it would make them, with
                         sensitive values blanked. Empty when it is refused.
                volumes:
                    type: array
                    items:
                        type: string
                    description: The volumes it would make, by name. Empty when it is refused.
                networks:
                    type: array
                    items:
                        type: string
                    description: The networks it would make, by name. Empty when it is refused.
                name:
                    type: string
                    description: |-
                        The project the file names for itself, for a form to fill in, whether or
                         not the file can be read further than that: its name:, or, for a file
                         exported from an environment here, that environment's project. Empty when
                         it names none, or names itself with a variable that has no value yet.
                exposedVariables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExposedVariable'
                    description: |-
                        Where the file writes a variable's value in plain sight, whether or not one
                         is given, so a form can say so before anyone types a secret. It lists 100
                         at most.
                moreExposed:
                    type: boolean
                    description: True when the file writes more than exposed_variables lists.
                notes:
                    type: array
                    items:
                        type: string
                    description: |-
                        What Dockwell would take differently from how the file has it, for
                         people, such as a log rotation of its own in place of the file's. A plan's
                         notes say the same.
            description: CheckComposeResponse says what a Compose file would make, or why it can't.
        CheckDomainRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server, by ID.
                domain:
                    type: string
                    description: The domain, such as "app.example.com".
            description: CheckDomainRequest names a domain and the server it's meant to reach.
        CheckDomainResponse:
            type: object
            properties:
                check:
                    allOf:
                        - $ref: '#/components/schemas/DomainCheck'
                    description: What DNS says, as the control plane reads it.
            description: CheckDomainResponse says what DNS says of it.
        CheckServerUpdatesRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The server's ID.
            description: CheckServerUpdatesRequest names a server.
        CheckServerUpdatesResponse:
            type: object
            properties:
                updates:
                    allOf:
                        - $ref: '#/components/schemas/ServerUpdates'
                    description: The server's package updates as they stood, with checking set.
            description: CheckServerUpdatesResponse is what's known as the refresh starts.
        CloseTerminalRequest:
            type: object
            properties:
                terminalId:
                    type: string
                    description: The terminal's ID.
            description: CloseTerminalRequest names a terminal.
        CloseTerminalResponse:
            type: object
            properties:
                end:
                    $ref: '#/components/schemas/TerminalEnd'
            description: CloseTerminalResponse says how it ended.
        ComposeRefusal:
            type: object
            properties:
                message:
                    type: string
                    description: What is wrong and how to fix it, for people.
                line:
                    type: integer
                    description: |-
                        The line of the file it is about, from 1. 0 when it is about the file
                         as a whole.
                    format: int32
                endLine:
                    type: integer
                    description: |-
                        The last line it is about, where it is about more than one, as a YAML parser
                         can't always tell which. Otherwise the same as line.
                    format: int32
            description: ComposeRefusal is why a Compose file can't be imported.
        ComposeVariable:
            type: object
            properties:
                name:
                    type: string
                    description: Its name, such as "TAG".
                required:
                    type: boolean
                    description: True when it needs a value, as the file gives it no default.
            description: ComposeVariable is a variable a Compose file uses, such as ${TAG}.
        ConfirmTotpSetupRequest:
            type: object
            properties:
                code:
                    type: string
                    description: A 6-digit code from the authenticator app.
            description: ConfirmTotpSetupRequest carries a code from the new secret.
        ConfirmTotpSetupResponse:
            type: object
            properties:
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: Ten one-time recovery codes. They are shown only now; store them safely.
            description: ConfirmTotpSetupResponse carries the recovery codes.
        Container:
            type: object
            properties:
                image:
                    type: string
                    description: The image to run, such as "ghcr.io/acme/web:1.4.2".
                command:
                    type: array
                    items:
                        type: string
                    description: Overrides the image's command when set.
                env:
                    type: object
                    additionalProperties:
                        type: string
                    description: Environment variables, which may hold secrets.
                ports:
                    type: array
                    items:
                        $ref: '#/components/schemas/PortMapping'
                    description: Ports published on the server.
                restart:
                    enum:
                        - RESTART_POLICY_UNSPECIFIED
                        - RESTART_POLICY_NO
                        - RESTART_POLICY_ON_FAILURE
                        - RESTART_POLICY_UNLESS_STOPPED
                        - RESTART_POLICY_ALWAYS
                    type: string
                    description: What Docker does when the container stops.
                    format: enum
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Labels on the container, for tools that read them. Keys that start with
                         "com.docker.compose." or "dev.dockwell." are Dockwell's own.
                entrypoint:
                    type: array
                    items:
                        type: string
                    description: |-
                        Overrides the image's entrypoint when set. Empty takes the image's;
                         no_entrypoint runs none.
                mounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mount'
                    description: Volumes and server paths mounted into the container.
                networks:
                    type: array
                    items:
                        type: string
                    description: |-
                        The networks the container joins, by name. A service's are networks in
                         its environment; a container's on its own are Docker's. Empty joins
                         Docker's default bridge network.
                user:
                    type: string
                    description: |-
                        The user the command runs as, such as "1000" or "node". Empty takes the
                         image's.
                workingDir:
                    type: string
                    description: The directory the command runs in. Empty takes the image's.
                healthcheck:
                    allOf:
                        - $ref: '#/components/schemas/Healthcheck'
                    description: |-
                        How Docker checks the container is healthy. Unset takes the image's
                         check, if it has one.
                noEntrypoint:
                    type: boolean
                    description: |-
                        Runs no entrypoint, not even the image's, as Compose's "entrypoint: []"
                         does: the command runs on its own. Takes no entrypoint beside it.
                stopGracePeriod:
                    type: string
                    description: |-
                        How long the container has to stop before Docker kills it, in whole
                         seconds, such as "30s", as Compose's stop_grace_period. Empty takes
                         Docker's default of 10 s.
                rollout:
                    allOf:
                        - $ref: '#/components/schemas/Rollout'
                    description: |-
                        How a deploy replaces a service's running container. A container on its
                         own takes none: it is stopped, then made again. See
                         docs/adr/0027-health-checks-rollouts-and-rollback.md.
                externalNetworks:
                    type: array
                    items:
                        type: string
                    description: |-
                        Networks a service joins that Dockwell didn't make, by their names in
                         Docker, such as "1panel-network". Each must be on the server already:
                         Dockwell never makes, changes or deletes one. Whatever else is on it can
                         reach the service, so joining one is host access, which a person approves.
                         A container on its own names Docker's networks in networks.
                hostNetwork:
                    type: boolean
                    description: |-
                        Runs a service on the server's own network, with none of its own, as
                         Compose's "network_mode: host" does. It is host access, and takes no
                         networks, ports or aliases. A container on its own names "host" in networks.
                aliases:
                    type: array
                    items:
                        type: string
                    description: |-
                        Other names containers on a service's networks reach it by, beside its
                         service's name, such as a Compose file's container_name. No two services
                         on a network can answer to one name.
                resources:
                    allOf:
                        - $ref: '#/components/schemas/Resources'
                    description: What it may use of the server's CPU and memory. Unset has no limits.
                capAdd:
                    type: array
                    items:
                        type: string
                    description: |-
                        Linux capabilities it gets beyond Docker's default ones, such as
                         "NET_ADMIN", or "ALL". It is host access.
                capDrop:
                    type: array
                    items:
                        type: string
                    description: Linux capabilities it gives up, such as "NET_RAW", or "ALL".
                groupAdd:
                    type: array
                    items:
                        type: string
                    description: |-
                        Groups its command joins beside its user's, by name or number, such as
                         "audio" or "999". It is host access: joining the group that owns Docker's
                         socket is the same as root.
                privileged:
                    type: boolean
                    description: |-
                        Runs it with every device and capability on the server, the same as root.
                         It is host access.
                restartRetries:
                    type: integer
                    description: |-
                        How many times on-failure restarts it before giving up. 0 has no limit.
                         Only on-failure takes one.
                    format: uint32
                references:
                    type: array
                    items:
                        type: string
                    description: |-
                        Which of "command", "entrypoint" and "healthcheck.test" name values rather
                         than hold them. In a field listed here, ${NAME} is the value of NAME in the
                         container's environment, or of what its service uses under that name, and
                         $$ is a $ of its own, as in a Compose file. So a plan, an export and what
                         an agent reports show the name, a rotation reaches it, and the value is
                         written in only as the container is made. In any other field, a $ is a $.
                shmSize:
                    type: string
                    description: |-
                        The size of its /dev/shm, such as "1G", in units of 1024, as Compose's
                         shm_size. What it holds counts against resources.memory. Empty takes
                         Docker's default of 64M, which is too little for Chromium on a heavy page.
                tmpfs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Tmpfs'
                    description: |-
                        Filesystems held in memory at paths in the container. What is in one goes
                         when the container does, so a deploy starts it empty.
                expose:
                    type: array
                    items:
                        type: string
                    description: |-
                        Ports it exposes to what shares a network with it, beyond what its image exposes
                         and what it publishes, such as "3000/tcp". It opens nothing on the server. What
                         finds containers through Docker reads it, as Traefik does for the port to reach.
                extraHosts:
                    type: array
                    items:
                        type: string
                    description: |-
                        Names it reaches at an address of its own choosing, as hostname:address,
                         such as "host.docker.internal:host-gateway", where host-gateway is the
                         server as its containers reach it. It adds to the container's /etc/hosts,
                         and reaches nothing a container couldn't without it. Numbered in the
                         catalog's block, 80 to 89, apart from fields other work adds.
            description: |-
                Container is one Docker container: run by hand on a server, or a
                 service's app. Docker fills in from the image what a container leaves
                 out, such as its command or working directory, and that isn't drift.
        ContainerMount:
            type: object
            properties:
                volume:
                    type: string
                    description: The volume's name. Empty for a server path.
                anonymous:
                    type: boolean
                    description: True for a volume Docker made for a path in the image, with no name of its own.
                hostPath:
                    type: string
                    description: The server path. Empty for a volume.
                target:
                    type: string
                    description: Where the container sees it, such as "/var/lib/postgresql/data".
                readOnly:
                    type: boolean
                    description: True when the container can't write to it.
            description: ContainerMount is a volume or a server path mounted in a container.
        ContainerPort:
            type: object
            properties:
                serverPort:
                    type: integer
                    description: The port on the server, such as 8080.
                    format: uint32
                containerPort:
                    type: integer
                    description: The port in the container, such as 80.
                    format: uint32
                address:
                    type: string
                    description: The server address it is bound to. Empty means every address.
                protocol:
                    type: string
                    description: '"tcp" or "udp".'
            description: ContainerPort is a port a container publishes on the server.
        ControlPlane:
            type: object
            properties:
                build:
                    allOf:
                        - $ref: '#/components/schemas/BuildInfo'
                    description: The build it runs.
                startTime:
                    type: string
                    description: When it started.
                    format: date-time
                dataDir:
                    type: string
                    description: |-
                        The directory it keeps its files in, such as "/var/lib/dockwell". Empty
                         for an API token.
                keyFile:
                    type: string
                    description: |-
                        The install's key, which opens every secret the state store keeps, such
                         as "/var/lib/dockwell/control/key". A backup of the store needs it too,
                         kept apart. Empty for an API token.
                store:
                    allOf:
                        - $ref: '#/components/schemas/StateStore'
                    description: Where it keeps its state.
                panel:
                    allOf:
                        - $ref: '#/components/schemas/PanelServing'
                    description: How the panel is served.
                agents:
                    allOf:
                        - $ref: '#/components/schemas/AgentListener'
                    description: Where servers' agents reach it.
                memoryBytes:
                    type: string
                    description: |-
                        The memory it holds, with its own agent's, in bytes: its resident set.
                         Zero where the system doesn't say.
                serviceManager:
                    enum:
                        - SERVICE_MANAGER_UNSPECIFIED
                        - SERVICE_MANAGER_NONE
                        - SERVICE_MANAGER_SYSTEMD
                        - SERVICE_MANAGER_OPENRC
                    type: string
                    description: What runs it as a service, and so stops and starts it.
                    format: enum
            description: |-
                ControlPlane is the dockwell run that serves the panel and API, with the
                 agent it runs beside them.
        CreateBackupRequest:
            type: object
            properties:
                volumeId:
                    type: string
                    description: The volume's ID.
                server:
                    type: string
                    description: The server, by name or ID, when the volume is on several.
                stop:
                    type: boolean
                    description: |-
                        Stop what runs on the volume for an exact copy of its files, and start it again
                         after, whatever comes of the backup. A database's dump stops nothing.
                destination:
                    type: string
                    description: A backup destination it goes to as well, by name.
            description: CreateBackupRequest asks to back up a volume.
        CreateBackupResponse:
            type: object
            properties:
                backup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: The backup.
            description: CreateBackupResponse is the backup, running.
        CreateDatabaseUserRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service that runs it, by ID or by name.
                user:
                    type: string
                    description: |-
                        The user's name, such as "shop": lowercase letters, digits and underscores,
                         starting with a letter, at most 32.
                database:
                    type: string
                    description: The database they own, named as a user is. Empty takes the user's name.
                secret:
                    type: string
                    description: |-
                        The secret their password goes in, such as "SHOP_DATABASE_PASSWORD". Empty
                         takes the user's name in capitals, then "_DATABASE_PASSWORD". It must not be
                         there already.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one has a
                         service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its project has
                         more than one.
            description: |-
                CreateDatabaseUserRequest names a database server, and the user and database to
                 make in it.
        CreateDatabaseUserResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: CreateDatabaseUserResponse carries the planned change.
        CreateTokenRequest:
            type: object
            properties:
                name:
                    type: string
                    description: What it is for, such as "GitHub Actions deploy", up to 100 characters.
                scope:
                    enum:
                        - TOKEN_SCOPE_UNSPECIFIED
                        - TOKEN_SCOPE_READ_ONLY
                        - TOKEN_SCOPE_READ_WRITE
                    type: string
                    description: What it may do. Required.
                    format: enum
                expireTime:
                    type: string
                    description: When it stops working, in the future.
                    format: date-time
                ttl:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long it works for, from when the control plane makes it, such as
                         "7776000s" for 90 days. The control plane's clock sets the expiry, so
                         a client whose clock is off doesn't move it.
                proof:
                    type: string
                    description: The proof from AuthService.FinishStepUp, for creating a token.
                grants:
                    type: array
                    items:
                        enum:
                            - TOKEN_GRANT_UNSPECIFIED
                            - TOKEN_GRANT_LOGS
                        type: string
                        format: enum
                    description: |-
                        What it may do beyond its scope, such as TOKEN_GRANT_LOGS to read logs.
                         Either scope can have it.
            description: CreateTokenRequest describes the new token.
        CreateTokenResponse:
            type: object
            properties:
                token:
                    allOf:
                        - $ref: '#/components/schemas/Token'
                    description: The new token.
                secret:
                    type: string
                    description: |-
                        The secret, such as "dwt_…", 53 characters. Send it as
                         "Authorization: Bearer <secret>". It is shown only now; store it safely.
            description: CreateTokenResponse carries the new token and its secret.
        CreateWebsiteRequest:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain it answers at, such as "blog.example.com", as a route takes one.
                website:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: What it serves, as JSON, such as {"proxy":{"url":"https://backend.example.com"}}, or {"proxy":{"port":3000}} for a port on the server.
                tls:
                    type: string
                    description: |-
                        "off" when TLS ends before this server, at a tunnel or a proxy in front, as
                         a route's tls says. Empty gets a certificate.
                trustedProxies:
                    type: array
                    items:
                        type: string
                    description: |-
                        The proxies in front whose word it takes on a visitor's address, as a
                         route's trusted_proxies.
                plainForAnyone:
                    type: boolean
                    description: |-
                        With tls off, answers anyone who reaches the server's port 80, as a route's
                         plain_for_anyone.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where it runs, by server ID. Empty runs it on the only server; once there
                         are several, name one.
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says what it makes.
            description: CreateWebsiteRequest is a website to make.
        CreateWebsiteResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: CreateWebsiteResponse carries the planned change.
        Database:
            type: object
            properties:
                id:
                    type: string
                    description: The service's ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: 'The service: its kind, its environment''s ID, and its name.'
                engine:
                    enum:
                        - DATABASE_ENGINE_UNSPECIFIED
                        - DATABASE_ENGINE_POSTGRESQL
                        - DATABASE_ENGINE_MYSQL
                        - DATABASE_ENGINE_MARIADB
                        - DATABASE_ENGINE_REDIS
                        - DATABASE_ENGINE_VALKEY
                    type: string
                    description: Which database it runs.
                    format: enum
                image:
                    type: string
                    description: The image it runs, such as "postgres:17.2".
                version:
                    type: string
                    description: |-
                        The version its image's tag names, such as "17.2", or the tag itself where
                         it names none, such as "latest". What each server's database says is in
                         readings.
                volume:
                    type: string
                    description: |-
                        The volume that holds its data, by name. Empty when none does, so its data
                         is in the container, and goes when the container is replaced.
                volumeId:
                    type: string
                    description: |-
                        The volume's ID. Empty for a volume Dockwell didn't make, as one a container
                         came with when it was taken on.
                volumeExternal:
                    type: boolean
                    description: True when its data is in a volume Dockwell didn't make (Mount.external).
                port:
                    type: integer
                    description: The port it listens on in its container, such as 5432.
                    format: uint32
                host:
                    type: string
                    description: 'The name the other services in its environment reach it by: its service''s.'
                passwordSecret:
                    type: string
                    description: |-
                        The environment's secret its first user's password is in, by name, when the
                         service uses one, such as "POSTGRES_PASSWORD". Empty when the password is in
                         its own environment, or there is none.
                readings:
                    type: array
                    items:
                        $ref: '#/components/schemas/DatabaseReading'
                    description: |-
                        How it stands on each server it is placed on, as each said when asked, by
                         server name.
                newestBackup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: |-
                        Its volume's newest backup that's whole, on any server. Unset when there's
                         none, or no volume.
                latestBackup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: |-
                        Its volume's newest backup, whatever came of it, when that's newer than
                         newest_backup: one running now, or one that failed.
                beside:
                    type: array
                    items:
                        type: string
                    description: |-
                        The other services in its environment, by name, as those are what a Compose
                         file or a catalog install puts beside a database to use it.
                catalogEntry:
                    type: string
                    description: |-
                        The catalog entry it was installed from, by ID, such as "postgres". Empty
                         for anything else.
            description: Database is a service that runs a database.
        DatabaseAccount:
            type: object
            properties:
                name:
                    type: string
                    description: Their name, such as "shop".
                host:
                    type: string
                    description: |-
                        Where they may sign in from, for MySQL and MariaDB, such as "%" for
                         anywhere.
                superuser:
                    type: boolean
                    description: |-
                        True for a user who can do anything, as PostgreSQL's postgres and MySQL's
                         root can.
                canSignIn:
                    type: boolean
                    description: False for a role that can't sign in, as PostgreSQL has for groups.
                databases:
                    type: array
                    items:
                        type: string
                    description: |-
                        The databases that are theirs, by name: those they own, in PostgreSQL, or
                         those they're granted on by name, in MySQL and MariaDB.
                system:
                    type: boolean
                    description: True for one the server made for itself, such as mysql.sys.
                secret:
                    type: string
                    description: |-
                        For a user Dockwell made, a resource of kind "database.user": the secret their
                         password is in, by name.
                usedBy:
                    type: array
                    items:
                        type: string
                    description: The services that use that secret, by name, which are what signs in as them.
                resourceId:
                    type: string
                    description: The resource's ID, for a user Dockwell made.
            description: |-
                DatabaseAccount is someone who can sign in to a database server: a user, as
                 MySQL and MariaDB call one, or a role, as PostgreSQL does.
        DatabaseReading:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                readTime:
                    type: string
                    description: |-
                        When it was read. A reading is kept for a few seconds, so several readers
                         ask the database once.
                    format: date-time
                unread:
                    type: string
                    description: |-
                        Why it couldn't be read, for people, such as "PostgreSQL isn't running". The
                         rest is then unset.
                version:
                    type: string
                    description: The version it says it is, such as "17.2".
                sizeBytes:
                    type: string
                    description: |-
                        How much its data takes, in bytes: its databases on disk, or for Redis and
                         Valkey, its data in memory.
                connections:
                    type: string
                    description: How many clients are connected now.
                maxConnections:
                    type: string
                    description: How many it takes at most. Zero where it says none.
                user:
                    type: string
                    description: |-
                        The user Dockwell signed in as, such as "postgres" or "root". Empty for
                         Redis and Valkey.
                uptimeSeconds:
                    type: string
                    description: How long it has been up, in seconds.
                cacheHit:
                    type: number
                    description: |-
                        Of what clients read since it started, how much came from memory rather than
                         disk, from 0 to 1: PostgreSQL's shared buffers, InnoDB's buffer pool, or the
                         keys Redis found. Unset until anything was read.
                    format: double
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/InnerDatabase'
                    description: The databases in it, by name. Redis and Valkey have none of their own.
                users:
                    type: array
                    items:
                        $ref: '#/components/schemas/DatabaseAccount'
                    description: Who can sign in to it, by name. Redis and Valkey list none.
                keys:
                    type: string
                    description: How many keys it holds, for Redis and Valkey.
                unlisted:
                    type: integer
                    description: How many more databases or users it has than this lists.
                    format: int32
            description: DatabaseReading is what a database said of itself on one server.
        DatabaseUser:
            type: object
            properties:
                service:
                    type: string
                    description: The service that runs the database server, by name, such as "db".
                databaseName:
                    type: string
                    description: |-
                        The database the user owns, which is made with them, such as "shop". Empty
                         takes the user's name. It can't change once made.
                password:
                    type: string
                    description: |-
                        The environment's secret the user's password is in, by name, such as
                         "SHOP_DATABASE_PASSWORD".
                revisions:
                    readOnly: true
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The revision of the secret the user was given. Dockwell sets it when a change
                         is planned, so setting the secret anew gives the user its new password. An
                         edit's is ignored.
            description: |-
                DatabaseUser is a database inside a database server that a service of its
                 environment runs, with the user who owns it, who signs in with a secret of the
                 environment. The service runs PostgreSQL, MySQL or MariaDB from its official image,
                 and the user and the database are made in its own container, with its own tools,
                 on the servers it runs on (ADR 0038). Its name is the user's, such as "shop".
                 Setting the secret anew changes the user's password, and deleting one drops the
                 user and the database, with everything in it.
        DeleteBackupResponse:
            type: object
            properties: {}
            description: DeleteBackupResponse says it's gone.
        DeleteWebsiteRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The website, by its project's name or ID.
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says what it deletes.
            description: DeleteWebsiteRequest names a website to delete.
        DeleteWebsiteResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: DeleteWebsiteResponse carries the planned change.
        DeployServiceRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                image:
                    type: string
                    description: The image to run, such as "ghcr.io/acme/web:1.4.2".
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says what it deploys.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: DeployServiceRequest names a service and the image to run.
        DeployServiceResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: DeployServiceResponse carries the planned deploy.
        DisableTotpRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for turning code sign-in off.
            description: DisableTotpRequest confirms turning code sign-in off.
        DisableTotpResponse:
            type: object
            properties: {}
            description: DisableTotpResponse is empty.
        DiscardChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
            description: DiscardChangeRequest names a planned change to discard.
        DiscardChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, discarded.
            description: DiscardChangeResponse carries the discarded change.
        Disk:
            type: object
            properties:
                mountPoint:
                    type: string
                    description: Where it is mounted, such as "/" or "/var/lib/docker".
                device:
                    type: string
                    description: The device, such as "/dev/sda1".
                filesystem:
                    type: string
                    description: The filesystem type, such as "ext4".
                sizeBytes:
                    type: string
                    description: Total size, in bytes.
            description: Disk is one mounted filesystem.
        DiskUsage:
            type: object
            properties:
                mountPoint:
                    type: string
                    description: Where it is mounted.
                usedBytes:
                    type: string
                    description: Bytes in use.
                sizeBytes:
                    type: string
                    description: Total size, in bytes.
            description: DiskUsage is one filesystem's use.
        DockwellRelease:
            type: object
            properties:
                agent:
                    type: string
                    description: The server's agent's version, such as "0.9.4".
                controlPlane:
                    type: string
                    description: The control plane's version.
                newest:
                    type: string
                    description: |-
                        The newest release, as the releases URL says. Empty when that isn't known:
                         the control plane couldn't read it, or doesn't, as in tests.
                newestTime:
                    type: string
                    description: When the control plane read it.
                    format: date-time
                releases:
                    type: string
                    description: |-
                        Where it read it from, such as
                         "https://github.com/Dockwell/dockwell/releases".
            description: |-
                DockwellRelease is Dockwell's version on a server and its control plane, and
                 the newest release.
        Domain:
            type: object
            properties:
                name:
                    type: string
                    description: The domain, such as "app.example.com".
                environmentId:
                    type: string
                    description: The environment that holds it, by ID. A domain lives in one environment.
                url:
                    type: string
                    description: |-
                        Where it answers, such as "https://app.example.com". A domain whose routes
                         take no certificate reads "http://app.example.com", which is what this server
                         serves, and whatever ends TLS in front of it may answer HTTPS too.
                routes:
                    type: array
                    items:
                        $ref: '#/components/schemas/DomainRoute'
                    description: Its routes, by path.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/DomainServer'
                    description: Where it stands on each server its routes run on.
            description: Domain is one domain the routes of an environment serve.
        DomainCheck:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain.
                state:
                    enum:
                        - DOMAIN_CHECK_STATE_UNSPECIFIED
                        - DOMAIN_CHECK_STATE_POINTS_HERE
                        - DOMAIN_CHECK_STATE_NO_RECORD
                        - DOMAIN_CHECK_STATE_ELSEWHERE
                        - DOMAIN_CHECK_STATE_CANT_TELL
                    type: string
                    description: What it means.
                    format: enum
                found:
                    type: array
                    items:
                        type: string
                    description: The addresses DNS gives for it.
                here:
                    type: array
                    items:
                        type: string
                    description: The addresses the server has, which it compared them with.
                publicAddresses:
                    type: array
                    items:
                        type: string
                    description: |-
                        The server's public addresses known beyond its interfaces, which are the
                         ones to point a record at.
                unprovenAddresses:
                    type: array
                    items:
                        type: string
                    description: |-
                        Those of public_addresses nothing has shown to be a way in, so a record at
                         one may not reach the server.
                carrierNat:
                    type: boolean
                    description: |-
                        The server is behind carrier-grade NAT with no way in known, so no record
                         can reach it, and no forwarded port either. Only a tunnel can.
                readTime:
                    type: string
                    description: When DNS was read. Unset for a check from an agent from before this.
                    format: date-time
                proxied:
                    type: boolean
                    description: |-
                        A record points at Cloudflare's proxy, which ends TLS, and blocks a
                         certificate over HTTP-01 or TLS-ALPN.
            description: DomainCheck is what DNS says of a domain, as a server sees it.
        DomainRoute:
            type: object
            properties:
                id:
                    type: string
                    description: The route's ID.
                name:
                    type: string
                    description: The route's name, unique in its environment.
                path:
                    type: string
                    description: The path it covers. Empty covers the whole domain.
                service:
                    type: string
                    description: The service it sends to, by name. Empty when host_port is set.
                port:
                    type: integer
                    description: The service's port it sends to. Empty when host_port is set.
                    format: uint32
                url:
                    type: string
                    description: Where it answers, such as "https://app.example.com/api".
                tls:
                    type: string
                    description: '"off" when TLS ends before this server, as Route.tls says.'
                hostPort:
                    type: integer
                    description: The port on the server itself it sends to, in place of a service's.
                    format: uint32
                plainForAnyone:
                    type: boolean
                    description: |-
                        True when a route with tls off answers anyone who can reach the server, as
                         Route.plain_for_anyone says.
            description: DomainRoute is one route of a domain.
        DomainServer:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                status:
                    allOf:
                        - $ref: '#/components/schemas/DomainStatus'
                    description: |-
                        Where the certificate and DNS stand, as the server last said. Unset until
                         it has said.
                stale:
                    type: boolean
                    description: True when the server isn't connected, so status is what it last said.
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressStatus'
                    description: |-
                        Where the server's ingress stands, as it last said. A domain with an issued
                         certificate still doesn't answer while problem is set here.
            description: DomainServer is where a domain stands on one server.
        DomainStatus:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain.
                certificate:
                    allOf:
                        - $ref: '#/components/schemas/Certificate'
                    description: Its certificate.
                dns:
                    allOf:
                        - $ref: '#/components/schemas/DomainCheck'
                    description: What DNS says of it.
            description: DomainStatus is where one domain's certificate and DNS stand on a server.
        Drift:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server.
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                revision:
                    type: string
                    description: The latest revision, which the server should match.
                missing:
                    type: boolean
                    description: True when the resource is gone from the server.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: What differs, from the latest revision to what the server has.
            description: Drift is a resource on a server that doesn't match its latest revision.
        DroppedMount:
            type: object
            properties:
                source:
                    type: string
                    description: The volume or server path.
                target:
                    type: string
                    description: Where the container sees it, such as "/data".
                emptyVolume:
                    type: boolean
                    description: |-
                        True when the new image declares a volume there, so an empty one takes its
                         place.
            description: DroppedMount is something the old container mounts and the new one won't.
        Edit:
            type: object
            properties:
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: |-
                        The resource. Its kind may be left out when the spec says it. Its
                         scope may be left out where there is only one to choose, as with the
                         organization of a project, or the environment of a service in an
                         install with one; once there is a choice, leaving it out is an error
                         that names the options.
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Spec'
                    description: |-
                        What the resource should be. Every field is set as given: an edit
                         replaces the whole spec. Unset only with delete.
                delete:
                    type: boolean
                    description: |-
                        Deletes the resource. An environment goes only once what lives in it has
                         gone, in this change or an earlier one. A project takes its environments
                         with it, and goes only once what lives in them has gone too.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where a service, volume, network or route runs, by server ID. Empty keeps it
                         where it runs now; a new one runs on the only server, and must name its
                         servers once there are several. Other kinds ignore it: a container or
                         firewall rule lives on its server, and projects and environments run on
                         none.
                project:
                    type: string
                    description: |-
                        The project of the environment the resource lives in, by name or ID,
                         for a kind that lives in an environment, such as a service. Leave it
                         out while there is only one project, or when resource.scope is an
                         environment's ID; once there are several, an environment named
                         without its project is an error that names the projects. Other kinds
                         name their project, if they live in one, in resource.scope.
                baseRevision:
                    type: string
                    description: |-
                        The revision of the resource the spec was made from, as a list gave it,
                         for an edit that read the spec and changed part of it. If the resource has
                         changed since, the edit is stale, an error with the reason "plan_stale", as
                         planning it would quietly undo what came between: read it again, and edit
                         that. 0 checks nothing, for an edit that says the whole spec itself.
                keepEnv:
                    type: array
                    items:
                        type: string
                    description: |-
                        A service's own environment variables to keep as they are, by name, for a
                         client that can't read their values back, as no response carries them:
                         it sends the rest of the spec, and names these instead of setting them.
                         Each must be one the service has now, and not one the spec sets too. Only
                         an edit of a service that's there takes it, and only with base_revision,
                         the revision the rest was read at: without one the edit is refused, as a
                         change since the read would be undone. A value kept goes nowhere it hasn't
                         been, so the edit can't place the service on another server: set the value
                         again in the edit to run it there.
            description: Edit sets one resource's desired spec, or deletes it.
        EndProcessRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                pid:
                    type: integer
                    description: The process ID, 4194304 at most, as Linux gives them.
                    format: uint32
                startTicks:
                    type: string
                    description: |-
                        When it started, as Process.start_ticks has it, so a process that ended
                         and gave its PID to another isn't ended in its place.
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for STEP_UP_ACTION_END_PROCESS on
                         "<server ID>:<PID>:<start ticks>".
            description: EndProcessRequest names a process.
        EndProcessResponse:
            type: object
            properties:
                killed:
                    type: boolean
                    description: True when it took SIGKILL, as SIGTERM didn't end it within 10 s.
            description: EndProcessResponse says how it went.
        Entry:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Its ID, which stays the same from one version to the next, such as
                         "postgres". An install is pinned to it.
                name:
                    type: string
                    description: What people call the app, such as "PostgreSQL".
                summary:
                    type: string
                    description: |-
                        What the app is for, in one line, in the catalog's own words, such as
                         "Relational database, with Adminer to manage it".
                category:
                    type: string
                    description: Where it files under, in lowercase, such as "databases".
                version:
                    type: string
                    description: |-
                        The app's version, for people, such as "17.11". Nothing orders these:
                         release says which entry is newer.
                release:
                    type: integer
                    description: |-
                        Goes up each time the entry changes, so a higher one is an upgrade,
                         whether or not the app's version reads as one.
                    format: uint32
                homepage:
                    type: string
                    description: The app's own site.
                license:
                    type: string
                    description: The licence of this entry, as an SPDX identifier, which its source sets.
                appLicense:
                    type: string
                    description: |-
                        The licence of the app it installs, which may differ, as an SPDX
                         identifier or its name, such as "PostgreSQL" or "Sustainable Use License".
                source:
                    allOf:
                        - $ref: '#/components/schemas/Source'
                    description: Where this entry came from.
                compose:
                    type: string
                    description: |-
                        The Compose file it runs, as YAML, whose ${NAME}s are its inputs' names.
                         Each image is pinned by digest. It takes what ImportCompose takes.
                inputs:
                    type: array
                    items:
                        $ref: '#/components/schemas/Input'
                    description: What it needs to know to install, in the order to ask.
                web:
                    allOf:
                        - $ref: '#/components/schemas/Web'
                    description: |-
                        The service a person opens once it's installed. Unset for an app with
                         nothing to open, such as a tunnel.
                firstSteps:
                    type: string
                    description: |-
                        What to do first once it runs, in a sentence or two, such as how to sign
                         in. Empty when there's nothing to say.
                hostAccess:
                    type: string
                    description: |-
                        What it reaches on its server beyond its own containers, in words, such as
                         "The server's own network, to reach routes on loopback". A person approves
                         it in the plan, which says exactly what. Empty when it reaches nothing.
                databases:
                    type: array
                    items:
                        type: string
                    description: |-
                        The services its Compose file runs that are databases the app keeps its data
                         in, by name, such as "db". A page names each as a database rather than an app.
                         Empty leaves that to the images Dockwell knows as databases.
            description: |-
                Entry is one app a catalog offers, at one version. It installs through the
                 same plan as any Compose file, into a project of its own. It runs no script
                 on a server, and every image in it is pinned by digest.
        Environment:
            type: object
            properties:
                displayName:
                    type: string
                    description: How the panel shows it, such as "Staging". Empty shows its name.
            description: |-
                Environment is a stage of a project, such as production or staging, with
                 its own config. A project starts with one, named "production", which
                 stays out of sight until there is a second.
        EnvironmentVariable:
            type: object
            properties:
                id:
                    type: string
                    description: 'Its ID: "var_…" for a variable, "sec_…" for a secret.'
                name:
                    type: string
                    description: Its name, such as "DATABASE_URL".
                secret:
                    type: boolean
                    description: True for a secret, whose value only RevealSecret returns.
                value:
                    type: string
                    description: A variable's value. Always empty for a secret.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was applied.
                    format: date-time
                updatedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who made its latest revision.
                changeId:
                    type: string
                    description: The change that made its latest revision.
                usedBy:
                    type: array
                    items:
                        $ref: '#/components/schemas/VariableUse'
                    description: The services that use it, by name.
            description: |-
                EnvironmentVariable is one variable or secret of an environment, as its
                 latest revision has it.
        Event:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The event's ID: a change's own ("chg_…") for a change, and the audit
                         log's ("evt_…") for the rest.
                kind:
                    enum:
                        - EVENT_KIND_UNSPECIFIED
                        - EVENT_KIND_CHANGE
                        - EVENT_KIND_SERVER
                        - EVENT_KIND_ACCESS
                        - EVENT_KIND_HEALTH
                        - EVENT_KIND_BACKUP
                        - EVENT_KIND_SETTINGS
                        - EVENT_KIND_TASK
                    type: string
                    description: What sort of event it is.
                    format: enum
                action:
                    type: string
                    description: |-
                        What happened, as the audit log names it, such as "server.join",
                         "auth.sign_in", "token.create" or "backup.failed". A change's says where the
                         change is: "change.planned", "change.applying", "change.applied" or
                         "change.failed".
                time:
                    type: string
                    description: |-
                        When it happened. A change is timed from when it started applying, and
                         from when it was planned until then.
                    format: date-time
                actor:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: |-
                        Who did it. For a change, whoever applied it, and whoever proposed it
                         until then.
                surface:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it came from.
                    format: enum
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change, for a change's event: as it stands now, with its plan in
                         brief, each step's progress, its undo deadline, and what undid it or
                         rolled it back. GetChange has the plan in full.
                subject:
                    allOf:
                        - $ref: '#/components/schemas/EventSubject'
                    description: |-
                        What the event is about, other than its actor: the server that joined
                         or was removed, the API token or passkey made or removed, the person a
                         sign-in link is for, or the secret revealed. Unset when there is
                         nothing more to name.
                health:
                    allOf:
                        - $ref: '#/components/schemas/EventHealth'
                    description: |-
                        How a service's health changed, for a health event. Its subject is the
                         service.
                backup:
                    allOf:
                        - $ref: '#/components/schemas/EventBackup'
                    description: What became of a backup, for a backup event. Its subject is the volume.
                publicAddress:
                    allOf:
                        - $ref: '#/components/schemas/EventPublicAddress'
                    description: What a person set of a server's public address, on such an event.
                process:
                    allOf:
                        - $ref: '#/components/schemas/EventProcess'
                    description: |-
                        The process someone ended on a server, for "process.end". Its subject is
                         the server. Numbered apart, as open work adds to this message.
                terminal:
                    allOf:
                        - $ref: '#/components/schemas/EventTerminal'
                    description: |-
                        The terminal, for a terminal's event. Its subject is the server. Numbered
                         apart, as open work adds to this message.
                setting:
                    allOf:
                        - $ref: '#/components/schemas/EventSetting'
                    description: |-
                        A setting of the install someone changed, for a settings event. Numbered
                         apart, as open work adds to this message.
                taskRun:
                    allOf:
                        - $ref: '#/components/schemas/EventTaskRun'
                    description: |-
                        What became of a scheduled task's run, for a task event. Its subject is the
                         task. Numbered in the block scheduled tasks hold, as open work adds to this
                         message.
            description: Event is one thing that happened.
        EventBackup:
            type: object
            properties:
                id:
                    type: string
                    description: The backup's ID.
                volume:
                    type: string
                    description: The volume, by name.
                serverName:
                    type: string
                    description: The server, by name.
                method:
                    enum:
                        - BACKUP_METHOD_UNSPECIFIED
                        - BACKUP_METHOD_DUMP
                        - BACKUP_METHOD_COPY
                        - BACKUP_METHOD_COPY_RUNNING
                    type: string
                    description: How it was taken.
                    format: enum
                sizeBytes:
                    type: string
                    description: Its size, in bytes.
                error:
                    type: string
                    description: Why it failed, for people. Empty unless it did.
                destination:
                    type: string
                    description: The destination it went to or didn't, by name.
            description: EventBackup is what became of one backup.
        EventHealth:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                state:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UNKNOWN
                        - HEALTH_STATE_NO_CHECK
                        - HEALTH_STATE_STARTING
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_RUNNING
                        - HEALTH_STATE_PAUSED
                    type: string
                    description: How it is now.
                    format: enum
                previous:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UNKNOWN
                        - HEALTH_STATE_NO_CHECK
                        - HEALTH_STATE_STARTING
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_RUNNING
                        - HEALTH_STATE_PAUSED
                    type: string
                    description: How it was as the timeline last told of it.
                    format: enum
                output:
                    type: string
                    description: |-
                        What the last check said, in one short line, with the values of the
                         container's environment masked.
                flips:
                    type: integer
                    description: |-
                        How many times it went between good and bad since since, for a service
                         that keeps changing. 0 for one that changed once.
                    format: int32
                since:
                    type: string
                    description: |-
                        When it came to this state, as the control plane heard, which is up to
                         30 s before the event's time; or, for one that keeps changing, when it began
                         to. Unset on events from before it was kept.
                    format: date-time
            description: |-
                EventHealth is how a service's health changed on a server, as far as the
                 timeline tells of it: when it turned unhealthy or stopped running, and when
                 it came back. A state that lasts under 30 s isn't told, and one that lasts is
                 told then. A service that went between good and bad 3 times in 5 minutes keeps
                 changing, and is one event, whose time, flips and output change as it goes on,
                 until it has stayed one way for 5 minutes.
        EventProcess:
            type: object
            properties:
                pid:
                    type: integer
                    description: Its process ID.
                    format: uint32
                name:
                    type: string
                    description: |-
                        What the kernel called it, such as "postgres". Its command line isn't
                         kept, as one can hold a password typed with it, and anyone who reads the
                         activity log, an API token too, would read it.
                user:
                    type: string
                    description: Who it ran as.
                container:
                    type: string
                    description: The container it ran in, by name. Empty for one that didn't.
                killed:
                    type: boolean
                    description: True when it took SIGKILL, as SIGTERM didn't end it within 10 s.
                error:
                    type: string
                    description: Why it couldn't be ended, for "process.end_failed".
            description: EventProcess is a process someone ended on a server.
        EventPublicAddress:
            type: object
            properties:
                address:
                    type: string
                    description: What it is now. Empty when they cleared it.
                previous:
                    type: string
                    description: What a person had set before, so it can be put back. Empty when they hadn't.
            description: EventPublicAddress is a server's public address as a person changed it.
        EventSetting:
            type: object
            properties:
                setting:
                    type: string
                    description: 'Which: "name" or "time_zone".'
                value:
                    type: string
                    description: What it is now. Empty when they cleared it.
                previous:
                    type: string
                    description: What it was. Empty when it wasn't set.
            description: EventSetting is a setting of the install as someone changed it.
        EventSubject:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "srv_…", "tok_…", "pky_…" or "usr_…".
                name:
                    type: string
                    description: |-
                        Its name, such as "hz-2", "GitHub Actions deploy" or "Mira Chen".
                         Empty when it has none, or when it is gone and Dockwell no longer
                         keeps it.
                scope:
                    type: string
                    description: |-
                        What it lives in, by ID, for a resource that lives in another: a
                         secret's environment, as "env_…", for a secret revealed. Empty
                         otherwise.
                path:
                    type: string
                    description: |-
                        Which file on it, for a file read, saved or refused on a server. Empty
                         otherwise.
            description: EventSubject names what an event is about.
        EventTaskRun:
            type: object
            properties:
                id:
                    type: string
                    description: The run's ID.
                task:
                    type: string
                    description: The task, by name, and what people call it.
                displayName:
                    type: string
                serverName:
                    type: string
                    description: The server it ran on, by name.
                state:
                    enum:
                        - TASK_RUN_STATE_UNSPECIFIED
                        - TASK_RUN_STATE_RUNNING
                        - TASK_RUN_STATE_SUCCEEDED
                        - TASK_RUN_STATE_FAILED
                        - TASK_RUN_STATE_TIMED_OUT
                        - TASK_RUN_STATE_INTERRUPTED
                        - TASK_RUN_STATE_NOT_STARTED
                    type: string
                    description: How it ended.
                    format: enum
                reason:
                    enum:
                        - TASK_RUN_REASON_UNSPECIFIED
                        - TASK_RUN_REASON_SCHEDULE
                        - TASK_RUN_REASON_BY_HAND
                        - TASK_RUN_REASON_MISSED
                    type: string
                    description: Why it ran.
                    format: enum
                exitCode:
                    type: integer
                    description: The last attempt's exit status, for a command.
                    format: int32
                httpStatus:
                    type: integer
                    description: The last attempt's HTTP status, for a request.
                    format: int32
                error:
                    type: string
                    description: Why it failed, for people. Empty when it didn't.
            description: |-
                EventTaskRun is a scheduled task's run that failed, or the one that succeeded
                 after it (ADR 0053).
        EventTerminal:
            type: object
            properties:
                id:
                    type: string
                    description: The terminal's ID.
                title:
                    type: string
                    description: Who it ran as and where, such as "root@hz-1".
                openTime:
                    type: string
                    description: When it opened, on its closing.
                    format: date-time
                end:
                    allOf:
                        - $ref: '#/components/schemas/TerminalEnd'
                    description: How it ended, on its closing.
                error:
                    type: string
                    description: Why it didn't open, for people, on a terminal that didn't.
                container:
                    type: string
                    description: The container it ran in, by name, for a shell in a container.
                containerId:
                    type: string
                    description: That container's full ID.
            description: |-
                EventTerminal is a terminal on a server, as its opening or closing tells of it.
                 What was typed and printed in it is never kept.
        ExportComposeResponse:
            type: object
            properties:
                compose:
                    type: string
                    description: |-
                        The Compose file, as YAML. Its project name is the environment's
                         Compose project, so docker compose -f <file> ps lists what Dockwell
                         runs.
                omitted:
                    type: array
                    items:
                        type: string
                    description: |-
                        What was left out as it may hold secrets. An environment variable's
                         value, as SERVICE.NAME, such as "web.API_KEY": set it in the shell, or
                         in an .env file beside the file, before docker compose up. A volume's
                         driver options, as "volumes.NAME.driver_opts": the file makes that
                         volume with none, so write them in by hand if it isn't on the server.
            description: ExportComposeResponse is a Compose file.
        ExposedVariable:
            type: object
            properties:
                name:
                    type: string
                    description: The variable, such as "REDIS_PASSWORD".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: |-
                        The service, volume or network whose spec holds its value, by kind and
                         name.
                field:
                    type: string
                    description: |-
                        The field that holds it, as the file names it, such as "command",
                         "entrypoint", "labels", "healthcheck" or "driver_opts". "environment" is a
                         list entry's name, as a value there is blanked and a name isn't.
            description: |-
                ExposedVariable is a variable whose value a Compose file writes in free text,
                 where anyone who can read what it makes sees it. Only what the schema marks
                 sensitive is blanked, such as a service's environment values: a label isn't,
                 as seeing it is useful and it rarely holds a secret. What runs keeps a value by
                 name, but for one of several words in a command written as one string. A name,
                 a number or a path doesn't count, as docs/security/compose-variables.md lists.
        FetchBackupRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The backup's ID.
                server:
                    type: string
                    description: The server, by name or ID, when the volume is on several.
            description: FetchBackupRequest asks to bring a backup back from its destination.
        FetchBackupResponse:
            type: object
            properties:
                backup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: The backup.
            description: FetchBackupResponse is the backup, on a server again.
        FieldChange:
            type: object
            properties:
                path:
                    type: string
                    description: The field, such as "image", "env[API_KEY]" or "ports[0].host_port".
                op:
                    enum:
                        - FIELD_OP_UNSPECIFIED
                        - FIELD_OP_ADDED
                        - FIELD_OP_REMOVED
                        - FIELD_OP_MODIFIED
                    type: string
                    description: How it changed.
                    format: enum
                from:
                    type: string
                    description: The value before. Empty when it was unset, and for a sensitive field.
                to:
                    type: string
                    description: The value after. Empty when it is unset, and for a sensitive field.
                sensitive:
                    type: boolean
                    description: |-
                        True for a field that may hold a secret: the plan says it changed,
                         never what it holds.
            description: FieldChange is one field that differs between two specs.
        FileEntry:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        Its name. A name that isn't UTF-8 shows as well as it can, with
                         unreadable_name set.
                type:
                    enum:
                        - FILE_TYPE_UNSPECIFIED
                        - FILE_TYPE_FILE
                        - FILE_TYPE_DIRECTORY
                        - FILE_TYPE_SYMLINK
                        - FILE_TYPE_OTHER
                    type: string
                    description: What it is.
                    format: enum
                sizeBytes:
                    type: string
                    description: Its size, in bytes.
                modifyTime:
                    type: string
                    description: When its contents last changed.
                    format: date-time
                mode:
                    type: string
                    description: Its type and permissions as ls shows them, such as "-rw-r--r--".
                owner:
                    type: string
                    description: |-
                        The user that owns it, by name, or by ID where the server has no name for
                         it.
                group:
                    type: string
                    description: The group that owns it, the same way.
                linkTarget:
                    type: string
                    description: Where a symlink points, as the link says.
                linkType:
                    enum:
                        - FILE_TYPE_UNSPECIFIED
                        - FILE_TYPE_FILE
                        - FILE_TYPE_DIRECTORY
                        - FILE_TYPE_SYMLINK
                        - FILE_TYPE_OTHER
                    type: string
                    description: What a symlink leads to. Unspecified for one that leads nowhere.
                    format: enum
                refused:
                    type: boolean
                    description: |-
                        True when Dockwell doesn't open it, as it holds keys, secrets' values or
                         the server's own credentials. Whatever opening it would say is why.
                unreadableName:
                    type: boolean
                    description: True when its name isn't UTF-8, so name can't reach it.
                uid:
                    type: integer
                    description: |-
                        The user and the group that own it, by number, whatever names the server has
                         for them, as what runs in a container goes by the number. Numbered apart, as
                         open work adds to this message.
                    format: uint32
                gid:
                    type: integer
                    format: uint32
            description: FileEntry is one file or directory on a server.
        FinishAddPasskeyRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginAddPasskey.
                credentialJson:
                    type: string
                    description: RegistrationResponseJSON from navigator.credentials.create.
                name:
                    type: string
                    description: What to call it, such as "YubiKey 5C". Optional.
            description: FinishAddPasskeyRequest carries the new passkey.
        FinishAddPasskeyResponse:
            type: object
            properties:
                passkey:
                    allOf:
                        - $ref: '#/components/schemas/Passkey'
                    description: The passkey.
            description: FinishAddPasskeyResponse carries the saved passkey.
        FinishClaimRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginClaim.
                token:
                    type: string
                    description: 'The token from the claim link, again: it is spent only here.'
                credentialJson:
                    type: string
                    description: RegistrationResponseJSON from navigator.credentials.create.
                passkeyName:
                    type: string
                    description: What to call the passkey, such as "Chrome on macOS". Optional.
            description: FinishClaimRequest carries the new passkey.
        FinishClaimResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The owner.
            description: |-
                FinishClaimResponse carries the new owner. The response sets the session
                 cookie.
        FinishPasskeySignInRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginPasskeySignIn.
                credentialJson:
                    type: string
                    description: AuthenticationResponseJSON from navigator.credentials.get.
            description: FinishPasskeySignInRequest carries the passkey's assertion.
        FinishPasskeySignInResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
            description: |-
                FinishPasskeySignInResponse carries who signed in. The response sets the
                 session cookie.
        FinishStepUpRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginStepUp.
                credentialJson:
                    type: string
                    description: AuthenticationResponseJSON from navigator.credentials.get.
            description: FinishStepUpRequest carries the passkey's answer.
        FinishStepUpResponse:
            type: object
            properties:
                proof:
                    type: string
                    description: Pass it to the action's method, such as RevealSecret's proof.
                expireTime:
                    type: string
                    description: When it stops working, a minute from now.
                    format: date-time
            description: FinishStepUpResponse carries the proof.
        FirewallRule:
            type: object
            properties:
                action:
                    enum:
                        - FIREWALL_ACTION_UNSPECIFIED
                        - FIREWALL_ACTION_ALLOW
                        - FIREWALL_ACTION_DENY
                    type: string
                    description: Allow or block.
                    format: enum
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP unless set.
                    format: enum
                port:
                    type: integer
                    description: The port the rule covers.
                    format: uint32
                sources:
                    type: array
                    items:
                        type: string
                    description: |-
                        Source addresses in CIDR form, such as "203.0.113.0/24". Empty means
                         anywhere.
                comment:
                    type: string
                    description: Why the rule exists, shown next to it.
            description: FirewallRule allows or blocks inbound traffic to a port on a server.
        GetAuthStateResponse:
            type: object
            properties:
                claimed:
                    type: boolean
                    description: |-
                        True once the install has an owner. Until then, only a claim link from
                         dockwell run or dockwell claim can create one.
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The signed-in user. Unset when the request has no valid session.
                sessionId:
                    type: string
                    description: This session's ID. Empty when not signed in.
                serverName:
                    type: string
                    description: The control server's name, such as "hz-1".
                rpId:
                    type: string
                    description: |-
                        The WebAuthn relying party ID for this address: "localhost", or the
                         panel's domain. Passkeys made here work only here.
                domain:
                    type: string
                    description: |-
                        The panel's own domain, such as "panel.acme.dev". Empty when the panel is
                         reachable only on loopback.
                signInMethod:
                    enum:
                        - SIGN_IN_METHOD_UNSPECIFIED
                        - SIGN_IN_METHOD_CLAIM
                        - SIGN_IN_METHOD_PASSKEY
                        - SIGN_IN_METHOD_AUTHENTICATOR_CODE
                        - SIGN_IN_METHOD_RECOVERY_CODE
                        - SIGN_IN_METHOD_LINK
                    type: string
                    description: How this session began. Unset when not signed in.
                    format: enum
                claimCommand:
                    type: string
                    description: |-
                        The command that prints a new claim link on the control server, as
                         Dockwell runs there, such as "sudo dockwell claim" for the system service,
                         or "dockwell claim" for a control plane a user runs themselves. Set only
                         while the install has no owner.
                installName:
                    type: string
                    description: |-
                        What the install is called, as its settings have it, for the sign-in screen
                         to say. Empty when nobody has named it.
            description: GetAuthStateResponse describes the install and this request's session.
        GetBackupResponse:
            type: object
            properties:
                backup:
                    allOf:
                        - $ref: '#/components/schemas/Backup'
                    description: The backup.
            description: GetBackupResponse is one backup.
        GetCatalogEntryResponse:
            type: object
            properties:
                entry:
                    allOf:
                        - $ref: '#/components/schemas/Entry'
                    description: The entry.
                project:
                    type: string
                    description: |-
                        A name for its project that's free, such as "postgres", or "postgres-2"
                         once that's taken.
                values:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        What each input takes if you give it nothing, by name. A port is one that
                         nothing Dockwell runs has taken. A secret isn't here.
                parts:
                    type: array
                    items:
                        $ref: '#/components/schemas/CatalogPart'
                    description: |-
                        What installing it runs, one part for each service its Compose file names: what
                         a person reads before the plan, which says the rest. The one a person opens
                         comes first.
            description: GetCatalogEntryResponse is an entry, with what installing it would use.
        GetChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change.
            description: GetChangeResponse carries one change.
        GetControlPlaneResponse:
            type: object
            properties:
                controlPlane:
                    allOf:
                        - $ref: '#/components/schemas/ControlPlane'
                    description: The control plane.
            description: GetControlPlaneResponse describes the control plane that answers.
        GetDatabaseResponse:
            type: object
            properties:
                database:
                    allOf:
                        - $ref: '#/components/schemas/Database'
                    description: The database.
            description: GetDatabaseResponse is one database.
        GetServerDiskUseResponse:
            type: object
            properties:
                diskUse:
                    allOf:
                        - $ref: '#/components/schemas/ServerDiskUse'
                    description: What takes the room on the disk that holds Docker's data.
            description: GetServerDiskUseResponse says what takes the room on a server's disk.
        GetServerResponse:
            type: object
            properties:
                server:
                    allOf:
                        - $ref: '#/components/schemas/Server'
                    description: The server, with history.
            description: GetServerResponse carries one server.
        GetServerUpdatesResponse:
            type: object
            properties:
                updates:
                    allOf:
                        - $ref: '#/components/schemas/ServerUpdates'
                    description: The server's package updates.
                dockwell:
                    allOf:
                        - $ref: '#/components/schemas/DockwellRelease'
                    description: |-
                        Dockwell's version on the server and the control plane, and its newest
                         release.
            description: GetServerUpdatesResponse is what waits on a server.
        GetSettingsResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/Settings'
                    description: The settings.
            description: GetSettingsResponse carries the install's settings.
        GetTaskResponse:
            type: object
            properties:
                task:
                    $ref: '#/components/schemas/TaskInfo'
            description: GetTaskResponse is the task.
        GetTotpResponse:
            type: object
            properties:
                totp:
                    allOf:
                        - $ref: '#/components/schemas/Totp'
                    description: Code sign-in.
            description: GetTotpResponse describes code sign-in.
        GetVersionResponse:
            type: object
            properties:
                build:
                    allOf:
                        - $ref: '#/components/schemas/BuildInfo'
                    description: The build of the dockwell binary running the control plane.
            description: GetVersionResponse carries the control plane's build.
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        HealthResult:
            type: object
            properties:
                passed:
                    type: boolean
                    description: True when it passed.
                output:
                    type: string
                    description: |-
                        What it said, in one short line: such as "GET /healthz on port 8080
                         answered 503 Service Unavailable", or what a command printed, cut short,
                         with the values of the container's environment masked.
                time:
                    type: string
                    description: When it finished, on the server's clock.
                    format: date-time
                took:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long it took, where the agent ran it.
            description: HealthResult is one check's result.
        Healthcheck:
            type: object
            properties:
                test:
                    type: array
                    items:
                        type: string
                    description: |-
                        A command, as Docker takes it: ["CMD", "curl", "-f", "http://localhost"],
                         ["CMD-SHELL", "curl -f http://localhost || exit 1"], or ["NONE"] to turn
                         off the image's check.
                interval:
                    type: string
                    description: |-
                        How often it runs, such as "30s". Empty takes Docker's default for a
                         command, 30 s, and 10 s for http and tcp. At least 1 s for http and tcp.
                timeout:
                    type: string
                    description: |-
                        How long one check may take, such as "5s". Empty takes Docker's default
                         for a command, 30 s, and 5 s for http and tcp. At most 1 min for http and
                         tcp.
                startPeriod:
                    type: string
                    description: |-
                        How long the container has to start before failures count, such as
                         "1m". Empty takes none.
                retries:
                    type: integer
                    description: How many failures in a row make it unhealthy. 0 takes 3.
                    format: uint32
                http:
                    allOf:
                        - $ref: '#/components/schemas/HttpCheck'
                    description: |-
                        A GET the agent sends to the container, on its own network address. Any
                         status from 200 to 399 passes. It works on an image with no shell or curl
                         in it, and turns the image's own check off.
                tcp:
                    allOf:
                        - $ref: '#/components/schemas/TcpCheck'
                    description: |-
                        A connection the agent makes to the container, on its own network address.
                         It passes once the port takes it, and turns the image's own check off.
            description: |-
                Healthcheck says how to check a container is healthy: a command Docker runs
                 in the container, or a request the server's agent makes to it. Give one of
                 test, http and tcp.
        HostAccess:
            type: object
            properties:
                kind:
                    enum:
                        - HOST_ACCESS_KIND_UNSPECIFIED
                        - HOST_ACCESS_KIND_SERVER_PATH
                        - HOST_ACCESS_KIND_DOCKER_SOCKET
                        - HOST_ACCESS_KIND_HOST_NETWORK
                        - HOST_ACCESS_KIND_VOLUME_MOUNT
                        - HOST_ACCESS_KIND_NETWORK_DRIVER
                        - HOST_ACCESS_KIND_DOMAIN
                        - HOST_ACCESS_KIND_PANEL_DOMAIN
                        - HOST_ACCESS_KIND_SERVER_PORT
                        - HOST_ACCESS_KIND_TRUSTED_PROXY
                        - HOST_ACCESS_KIND_EXTERNAL_NETWORK
                        - HOST_ACCESS_KIND_CAPABILITY
                        - HOST_ACCESS_KIND_GROUP
                        - HOST_ACCESS_KIND_PRIVILEGED
                        - HOST_ACCESS_KIND_PLAIN_FOR_ANYONE
                        - HOST_ACCESS_KIND_HTTPS_OFF
                        - HOST_ACCESS_KIND_EXTERNAL_VOLUME
                        - HOST_ACCESS_KIND_TAKES_ON
                        - HOST_ACCESS_KIND_BACKUP_OF
                        - HOST_ACCESS_KIND_SERVER_SHELL
                    type: string
                    description: What it is.
                    format: enum
                path:
                    type: string
                    description: |-
                        The server path or socket, the volume's device, the network's parent
                         interface, a network the server has, a capability or a group, such as
                         "/srv/app/config", ":/export/media", "eth0", "1panel-network", "NET_ADMIN"
                         or "999". Empty for the server's network and for privileged mode.
                readOnly:
                    type: boolean
                    description: |-
                        True when it is reached read-only: mounted so, or mounted so by the
                         service that uses it. False reads and writes.
                type:
                    type: string
                    description: A volume's mount type, such as "nfs" or "cifs".
                address:
                    type: string
                    description: |-
                        The remote server of a mount, such as "10.0.0.2". It never holds
                         credentials.
                relabel:
                    type: string
                    description: |-
                        How Docker relabels a server path for SELinux: "z", shared with other
                         containers, or "Z", private to this one. Empty for none.
                driver:
                    type: string
                    description: The plugin a volume runs on, or a network's driver, such as "macvlan".
                detail:
                    type: string
                    description: |-
                        A network's options beyond the few that keep it to its own bridge, as
                         "name=value" with commas between, sorted. For a network the server has,
                         the other names a service answers to on it, with commas between, sorted.
                         For a server path, an external volume or a mount, read-write, who writes
                         there where that's root or may be: "root", however the user is written;
                         "named", a user by name, which only the image can say is root or not; or
                         "image", whichever user the image runs as. Empty for a user other than
                         root, by number. Written by root, or by another who may be root, reaches
                         more than the same written by someone else.
                sameAsRoot:
                    type: boolean
                    description: |-
                        True for what is as good as root on the server, whatever else it says:
                         Docker's socket, the server's own network, a system path such as /etc,
                         privileged mode or the capability SYS_ADMIN. All host access needs a
                         signed-in person; a client should ask for more than a click only for this,
                         so that the warning means something when it comes.
                leadsTo:
                    type: string
                    description: |-
                        Where the server path leads through symlinks, as its server's agent reads it,
                         when that is somewhere else. Empty when it isn't, or when no agent has said,
                         as for a server that wasn't connected when it was planned.
                leadsMoved:
                    type: boolean
                    description: |-
                        True when that isn't where the path led when what runs now was made, as its
                         server's agent reads it. An agent sets it, for the control plane to decide
                         what a plan gains by, and plans don't carry it.
                holds:
                    type: string
                    description: |-
                        Another mount's source inside path, a read-write server path. What writes path
                         can turn it into a link to anywhere on the server, which what mounts it follows
                         the next time it starts, so this is as good as root.
                holdsFor:
                    type: string
                    description: What mounts holds, by name. Empty where that's this resource too.
                heldIn:
                    type: string
                    description: |-
                        The other side of holds: a read-write server path that holds path, and what can
                         write it, by name, which can make path lead anywhere. A change to that asks for a
                         passkey from now on.
                heldBy:
                    type: string
                writtenBy:
                    type: string
                    description: |-
                        For a server path, an external volume or a mount, read-write, the image
                         repository whose code writes there, such as "ghcr.io/acme/web". A person
                         approves one for what runs there, and any image can hold a program that
                         runs as root, so another repository reaches more, whatever the user.
                         Another tag of the same one doesn't.
            description: |-
                HostAccess is something on a server that a resource reaches beyond what
                 Docker keeps for it, such as a server path a container mounts.
        HttpCheck:
            type: object
            properties:
                port:
                    type: integer
                    description: The port the app listens on inside its container, such as 8080.
                    format: uint32
                path:
                    type: string
                    description: The path to ask for, such as "/healthz". Empty asks for "/".
                host:
                    type: string
                    description: |-
                        The Host header to send, for an app that refuses one it doesn't know, such
                         as "app.example.com". Empty sends the container's address.
            description: |-
                HttpCheck is a GET the agent sends to a container. It can name nothing but
                 the container: it says a port and a path, and the address is Docker's.
        ImportComposeRequest:
            type: object
            properties:
                summary:
                    type: string
                    description: |-
                        What the change is for, such as "Run the shop's stack". Empty says it
                         came from a Compose file.
                project:
                    type: string
                    description: |-
                        The project it belongs to, by name or ID, such as "shop". One that doesn't
                         exist yet comes to life with the plan. Left out, the file's name: names
                         it. With neither, the file goes in the default project, only while that
                         has no apps: otherwise it is refused, as a service of the same name would
                         change the one that is there.
                environment:
                    type: string
                    description: |-
                        The environment, by name or ID. Leave it out while its project has
                         only one. A project the plan brings to life starts with this one, or
                         with production. A file exported from here goes back to the environment
                         it came from unless this names another of its project.
                compose:
                    type: string
                    description: |-
                        The Compose file, as YAML, of up to 256 KiB. The CLI reads it from a file,
                         --compose @compose.yaml, or standard input, --compose -, and refuses it on
                         the command line when it gives a volume a password, which would stay in
                         shell history and the process list. A path relative to the file needs
                         directory, as it runs on servers where it otherwise means nothing.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Values for the variables the file uses, such as ${TAG}. A variable
                         with no value here, in env or as a default in the file is refused. They
                         win over env, as a shell's win over an .env file.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where the services, volumes and networks run, by server ID, as an
                         edit's servers. Empty keeps what exists where it runs, and puts what
                         is new on the only server; once there are several, name them.
                removeOrphans:
                    type: boolean
                    description: |-
                        Also deletes the environment's services and networks that aren't in
                         the file, as docker compose up --remove-orphans does. Volumes stay,
                         with their data; delete one on its own to remove it.
                env:
                    type: string
                    description: |-
                        The .env file beside the Compose file, as its text, of up to 64 KiB, for
                         the variables the file uses. The CLI takes it as a file, --env-file .env,
                         as it may hold secrets. It reads as docker compose reads one, except that a
                         value naming a variable with no value is refused, rather than left blank. A
                         value for a secret the file's services use is refused, as any is.
                directory:
                    type: string
                    description: |-
                        The directory the file is in on the servers, as an absolute path, such as
                         /opt/1panel/apps/postgresql/pg. A path relative to the file, such as
                         ./data, starts there. Each is a server path, which a person approves.
            description: ImportComposeRequest is a Compose file to plan into a project.
        ImportComposeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
                exposedVariables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExposedVariable'
                    description: |-
                        Where the file writes a variable's value in plain sight, which the plan's
                         notes say too. It lists 100 at most.
                moreExposed:
                    type: boolean
                    description: True when the file writes more than exposed_variables lists.
            description: ImportComposeResponse carries the planned change.
        ImportOnePanelRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server running 1Panel, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                skipPlan:
                    type: boolean
                    description: |-
                        Read and say what an import would do, and plan nothing, for a client that
                         plans only when a person asks to review it.
            description: ImportOnePanelRequest names the server to import from.
        ImportOnePanelResponse:
            type: object
            properties:
                found:
                    allOf:
                        - $ref: '#/components/schemas/OnePanel'
                    description: What was found, as 1Panel's records say.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/ImportStep'
                    description: |-
                        What an import would do, a step for each thing found, in the order the
                         plan would take them.
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change that takes on what can come now, planned for a person to apply.
                         Empty for a token, where nothing can come, and where Dockwell can't read
                         what runs on the server now.
            description: |-
                ImportOnePanelResponse is what 1Panel keeps on the server, and what an import
                 would do with each.
        ImportStep:
            type: object
            properties:
                kind:
                    enum:
                        - IMPORT_KIND_UNSPECIFIED
                        - IMPORT_KIND_APP
                        - IMPORT_KIND_RUNTIME
                        - IMPORT_KIND_WEBSITE
                        - IMPORT_KIND_CERTIFICATE
                        - IMPORT_KIND_DATABASE_SERVER
                        - IMPORT_KIND_DATABASE
                        - IMPORT_KIND_CRON_JOB
                        - IMPORT_KIND_PANEL
                        - IMPORT_KIND_COMPOSE_PROJECT
                        - IMPORT_KIND_CONTAINERS
                    type: string
                    description: What it is.
                    format: enum
                name:
                    type: string
                    description: Its name, as 1Panel shows it, such as "wordpress" or "blog.example.com".
                summary:
                    type: string
                    description: What it is, in a few words, such as "mysql 8.4.3 from 1Panel's store".
                action:
                    enum:
                        - IMPORT_ACTION_UNSPECIFIED
                        - IMPORT_ACTION_TAKE_ON
                        - IMPORT_ACTION_MAKE
                        - IMPORT_ACTION_LEAVE
                        - IMPORT_ACTION_DONE
                    type: string
                    description: What an import would do with it.
                    format: enum
                becomes:
                    type: string
                    description: |-
                        What it would become, in a few words, such as "a Compose project, wordpress,
                         taken on as it runs".
                reason:
                    type: string
                    description: Why, and what a person can do about it, where that isn't plain.
                waitsFor:
                    enum:
                        - IMPORT_WAITS_FOR_UNSPECIFIED
                        - IMPORT_WAITS_FOR_WEBSITES
                        - IMPORT_WAITS_FOR_DATABASES
                        - IMPORT_WAITS_FOR_SCHEDULED_TASKS
                        - IMPORT_WAITS_FOR_FIREWALL
                    type: string
                    description: The part of Dockwell it waits for, where Dockwell can't take it yet.
                    format: enum
            description: ImportStep is one thing found, and what an import would do with it.
        IngressEffect:
            type: object
            properties:
                change:
                    enum:
                        - INGRESS_CHANGE_UNSPECIFIED
                        - INGRESS_CHANGE_STARTS
                        - INGRESS_CHANGE_STOPS
                        - INGRESS_CHANGE_RESTARTS
                        - INGRESS_CHANGE_TAKES_PORTS
                        - INGRESS_CHANGE_FREES_PORTS
                    type: string
                    description: What happens to the proxy.
                    format: enum
                proxy:
                    type: string
                    description: The proxy, such as "Caddy".
                ports:
                    type: array
                    items:
                        type: string
                    description: |-
                        The ports it takes or frees, such as "80/tcp", "443/tcp" and "443/udp".
                         A server whose routes all say tls off needs port 80 alone.
                panelDomain:
                    type: string
                    description: |-
                        The panel's domain, when the panel moves behind the proxy as it starts,
                         or takes the ports back as it stops. The address, passkeys and sessions
                         stay; HTTPS on it is down while the certificate comes, and the SSH tunnel
                         keeps working.
            description: |-
                IngressEffect is what a step does to the proxy that holds a server's public
                 ports.
        IngressStatus:
            type: object
            properties:
                proxy:
                    type: string
                    description: The proxy, such as "Caddy".
                running:
                    type: boolean
                    description: True when the proxy runs.
                problem:
                    enum:
                        - INGRESS_PROBLEM_UNSPECIFIED
                        - INGRESS_PROBLEM_PORTS_TAKEN
                        - INGRESS_PROBLEM_SUBNET_TAKEN
                        - INGRESS_PROBLEM_NOT_RUNNING
                    type: string
                    description: Why its routes aren't being served. Unset while they are.
                    format: enum
                message:
                    type: string
                    description: |-
                        For people: what is wrong, what follows, and how to fix it. Empty while
                         nothing is.
                holders:
                    type: array
                    items:
                        type: string
                    description: |-
                        What holds the proxy's ports, by name, for PORTS_TAKEN: containers, where
                         they are in one, so a client can offer what to do about each.
                version:
                    type: string
                    description: |-
                        The version the proxy runs, such as "2.11.7-alpine". Empty when the server
                         can't say.
                pinnedVersion:
                    type: string
                    description: The version this server's Dockwell pins.
                outdated:
                    type: boolean
                    description: |-
                        True when the proxy isn't the version this server's Dockwell pins. It may
                         be missing security fixes, and moves on the server's next route change.
            description: IngressStatus is where a server's ingress stands, on a server with routes.
        InnerDatabase:
            type: object
            properties:
                name:
                    type: string
                    description: Its name, such as "shop".
                owner:
                    type: string
                    description: The user that owns it, for PostgreSQL.
                sizeBytes:
                    type: string
                    description: How much it takes on disk, in bytes.
                system:
                    type: boolean
                    description: True for one the server made for itself, such as PostgreSQL's postgres.
            description: |-
                InnerDatabase is one database inside a database server, as PostgreSQL has
                 them, or a schema, as MySQL and MariaDB call one.
        Input:
            type: object
            properties:
                name:
                    type: string
                    description: The name its Compose file uses, such as "ADMIN_PORT".
                label:
                    type: string
                    description: What a person reads above the field, such as "Admin port".
                hint:
                    type: string
                    description: What a person reads below it, such as what it's for or where to find it.
                type:
                    enum:
                        - INPUT_TYPE_UNSPECIFIED
                        - INPUT_TYPE_TEXT
                        - INPUT_TYPE_EMAIL
                        - INPUT_TYPE_PORT
                        - INPUT_TYPE_SECRET
                    type: string
                    description: What it takes.
                    format: enum
                defaultValue:
                    type: string
                    description: |-
                        Its value unless someone gives another. Never a secret's: leave a secret
                         for a person to give, or set generate.
                optional:
                    type: boolean
                    description: 'Takes no value: it''s asked for, but the app runs without one.'
                generate:
                    type: integer
                    description: |-
                        How many characters to generate for a secret that no one types, such as 32.
                         The value is sealed as it's made, and nothing shows it but a reveal. 0 asks
                         a person for it.
                    format: uint32
                logged:
                    type: boolean
                    description: |-
                        The app writes this secret in its own log, as Nginx Proxy Manager does with
                         its first password. Reading a log takes no passkey, so nothing may call it
                         sealed, and a person hears that before they apply.
                generateAs:
                    enum:
                        - GENERATE_AS_UNSPECIFIED
                        - GENERATE_AS_HEX
                        - GENERATE_AS_BASE64
                    type: string
                    description: |-
                        How a generated secret is written, for an app that reads it as a key: letters
                         and digits unless set.
                    format: enum
            description: |-
                Input is one thing an entry needs to know to install, named by the ${NAME}
                 its Compose file uses.
        InstallCatalogEntryRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The entry's ID, such as "postgres".
                project:
                    type: string
                    description: |-
                        What to call its project, which must not be taken. Left out, the one
                         GetCatalogEntry suggests.
                values:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        A value for each input, by name. An input left out takes its default; one
                         with neither is refused, unless it's optional. It may hold a secret a person
                         typed, such as a tunnel's token, which the CLI takes only from your environment.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where it runs, by server ID, as an edit's servers. Empty runs it on the only
                         server; once there are several, name them.
            description: InstallCatalogEntryRequest is an app to install.
        InstallCatalogEntryResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: InstallCatalogEntryResponse carries the planned change.
        InstanceHealth:
            type: object
            properties:
                project:
                    type: string
                    description: Its Compose project, its environment's ID in lowercase.
                service:
                    type: string
                    description: Its service's name.
                number:
                    type: integer
                    description: Its number, as Compose's container-number label has it.
                    format: int32
                container:
                    type: string
                    description: |-
                        Its name in Docker now, such as "env_01kat…-web-3", which is what a docker
                         command takes. A rollout has it under another for a moment, such as
                         "stopping_a1b2c3d4e5f6_env_01kat…-web-3" as it goes.
                state:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UNKNOWN
                        - HEALTH_STATE_NO_CHECK
                        - HEALTH_STATE_STARTING
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_RUNNING
                        - HEALTH_STATE_PAUSED
                    type: string
                    description: How it is.
                    format: enum
                check:
                    enum:
                        - HEALTH_CHECK_KIND_UNSPECIFIED
                        - HEALTH_CHECK_KIND_NONE
                        - HEALTH_CHECK_KIND_COMMAND
                        - HEALTH_CHECK_KIND_HTTP
                        - HEALTH_CHECK_KIND_TCP
                    type: string
                    description: What checks it.
                    format: enum
                last:
                    allOf:
                        - $ref: '#/components/schemas/HealthResult'
                    description: The last check's result. Unset when no check has finished yet.
                failing:
                    type: integer
                    description: How many checks in a row have failed.
                    format: int32
                since:
                    type: string
                    description: When it came to this state, on the server's clock.
                    format: date-time
                confirmedAt:
                    type: string
                    description: |-
                        When this state was last known to hold, on the server's clock: the last check
                         the agent made, or the last time it read what Docker says.
                    format: date-time
                goodFor:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How old that may be and the state still stand. Past it, nobody can say.
                containerId:
                    type: string
                    description: |-
                        Its ID in Docker. A replace can keep a container's name and number, and only
                         this says it's another container. Empty from an older agent.
            description: InstanceHealth is how one container of a service is.
        Intent:
            type: object
            properties:
                kind:
                    enum:
                        - INTENT_KIND_UNSPECIFIED
                        - INTENT_KIND_DEPLOY
                        - INTENT_KIND_PUBLISH_PORT
                        - INTENT_KIND_ROLL_BACK
                        - INTENT_KIND_REPULL
                    type: string
                    description: What it is.
                    format: enum
                resourceId:
                    type: string
                    description: The ID of the resource it is about.
                image:
                    type: string
                    description: The image a deploy runs.
                port:
                    type: integer
                    description: The port on the server that publishing a port opens.
                    format: int32
                revision:
                    type: string
                    description: The revision a rollback puts back.
            description: |-
                Intent is what a change is for, in a person's terms. A plan says what happens
                 to resources, which for a deploy or a new port is that a container is made
                 again: this says what that comes to. It isn't in the fingerprint, as it says
                 nothing about what the plan does.
        ListAuditEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/AuditEvent'
                    description: The events, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListAuditEventsResponse is a page of the audit log.
        ListBackupDestinationsResponse:
            type: object
            properties:
                destinations:
                    type: array
                    items:
                        $ref: '#/components/schemas/BackupDestinationInfo'
                    description: The destinations, by name.
            description: ListBackupDestinationsResponse lists them.
        ListBackupPoliciesResponse:
            type: object
            properties:
                policies:
                    type: array
                    items:
                        $ref: '#/components/schemas/BackupPolicyInfo'
                    description: The policies, by name.
            description: ListBackupPoliciesResponse lists them.
        ListBackupsResponse:
            type: object
            properties:
                backups:
                    type: array
                    items:
                        $ref: '#/components/schemas/Backup'
                    description: The backups, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListBackupsResponse is a page of backups.
        ListCatalogEntriesResponse:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/Entry'
                    description: Every entry, sorted by name.
            description: ListCatalogEntriesResponse is the catalog.
        ListCatalogInstallsResponse:
            type: object
            properties:
                installs:
                    type: array
                    items:
                        $ref: '#/components/schemas/CatalogInstall'
                    description: The installs, sorted by project.
            description: ListCatalogInstallsResponse lists what's installed from the catalog.
        ListChangesResponse:
            type: object
            properties:
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Change'
                    description: The changes, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListChangesResponse is a page of changes.
        ListContainersResponse:
            type: object
            properties:
                containers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerContainer'
                    description: The containers, by name.
                ownContainers:
                    type: integer
                    description: |-
                        How many containers on the server are Dockwell's own, which aren't listed:
                         those of its services, and what runs its ingress.
                    format: int32
                unlisted:
                    type: integer
                    description: |-
                        How many more the server has than fit in a list, which are left out, and may
                         be Dockwell's own or not. Zero while the list is whole.
                    format: int32
            description: ListContainersResponse lists a server's containers that Dockwell didn't make.
        ListDatabasesResponse:
            type: object
            properties:
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/Database'
                    description: The databases, by name.
            description: ListDatabasesResponse lists them.
        ListDomainsResponse:
            type: object
            properties:
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/Domain'
                    description: The domains, sorted by name.
            description: ListDomainsResponse lists domains.
        ListDriftResponse:
            type: object
            properties:
                drift:
                    type: array
                    items:
                        $ref: '#/components/schemas/Drift'
                    description: Each resource that differs, on each server it differs on.
                uncheckedServers:
                    type: array
                    items:
                        $ref: '#/components/schemas/UncheckedServer'
                    description: |-
                        Servers that couldn't be checked, each with why, such as an agent that
                         isn't connected. The servers that could be checked are in drift all
                         the same.
            description: ListDriftResponse lists what doesn't match its latest revision.
        ListEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/Event'
                    description: The events, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListEventsResponse is a page of events.
        ListFilesResponse:
            type: object
            properties:
                path:
                    type: string
                    description: The directory's path, with every symlink followed.
                directory:
                    allOf:
                        - $ref: '#/components/schemas/FileEntry'
                    description: The directory itself.
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/FileEntry'
                    description: What it holds, by name.
                truncated:
                    type: boolean
                    description: |-
                        True when the directory holds more than a listing can carry, so these
                         are some of its entries, in no useful order but their names.
            description: ListFilesResponse is what a directory holds.
        ListHealthResponse:
            type: object
            properties:
                services:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceHealth'
                    description: The services, oldest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListHealthResponse is a page of services' health.
        ListLogSourcesResponse:
            type: object
            properties:
                service:
                    allOf:
                        - $ref: '#/components/schemas/LoggedService'
                    description: The service.
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/LogSource'
                    description: Each container with logs, newest first.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerLogStatus'
                    description: Each server the service is on that couldn't answer, with why.
            description: ListLogSourcesResponse lists where a service's logs come from.
        ListMembersResponse:
            type: object
            properties:
                members:
                    type: array
                    items:
                        $ref: '#/components/schemas/Member'
                    description: Everyone who can sign in, oldest first.
            description: ListMembersResponse lists who can sign in.
        ListPasskeysResponse:
            type: object
            properties:
                passkeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/Passkey'
                    description: Passkeys, oldest first.
            description: ListPasskeysResponse lists passkeys.
        ListResourcesResponse:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/Resource'
                    description: The resources, oldest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListResourcesResponse is a page of resources.
        ListServersResponse:
            type: object
            properties:
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/Server'
                    description: The servers.
            description: ListServersResponse lists servers, oldest first.
        ListServiceRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceRevision'
                    description: The revisions, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListServiceRevisionsResponse is a page of a service's revisions.
        ListServicesResponse:
            type: object
            properties:
                services:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceInfo'
                    description: The services, oldest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListServicesResponse is a page of services.
        ListSessionsResponse:
            type: object
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Session'
                    description: Sessions, newest first.
            description: ListSessionsResponse lists sessions.
        ListTaskRunsResponse:
            type: object
            properties:
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/TaskRun'
                    description: The runs, newest first.
                nextPageToken:
                    type: string
                    description: Where the next page starts. Empty after the last.
            description: ListTaskRunsResponse is a page of runs.
        ListTasksResponse:
            type: object
            properties:
                tasks:
                    type: array
                    items:
                        $ref: '#/components/schemas/TaskInfo'
                    description: The tasks, by name.
            description: ListTasksResponse lists them.
        ListTerminalsResponse:
            type: object
            properties:
                terminals:
                    type: array
                    items:
                        $ref: '#/components/schemas/Terminal'
            description: ListTerminalsResponse is your open terminals there.
        ListTokensResponse:
            type: object
            properties:
                tokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/Token'
                    description: Tokens that still work, newest first.
            description: ListTokensResponse lists tokens.
        ListVariablesResponse:
            type: object
            properties:
                environmentId:
                    type: string
                    description: The environment's ID, such as "env_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/EnvironmentVariable'
                    description: Its variables and secrets, by name.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListVariablesResponse is an environment's variables and secrets.
        ListWebsiteRuntimesResponse:
            type: object
            properties:
                runtimes:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebsiteRuntime'
                    description: The runtimes, newest version first.
            description: ListWebsiteRuntimesResponse lists the runtimes.
        ListWebsitesResponse:
            type: object
            properties:
                websites:
                    type: array
                    items:
                        $ref: '#/components/schemas/WebsiteInfo'
                    description: The websites, sorted by domain.
            description: ListWebsitesResponse lists the websites.
        LocalAccess:
            type: object
            properties:
                account:
                    type: string
                    description: |-
                        The shell account that asked for it, and the server's host name, as
                         "mira@hz-1".
                scope:
                    enum:
                        - TOKEN_SCOPE_UNSPECIFIED
                        - TOKEN_SCOPE_READ_ONLY
                        - TOKEN_SCOPE_READ_WRITE
                    type: string
                    description: What the token may do.
                    format: enum
            description: |-
                LocalAccess is how the CLI came by a token on the control server, by
                 reading the control plane's data directory, without signing in.
        LogChunk:
            type: object
            properties:
                sourceId:
                    type: string
                    description: The source's id.
                gap:
                    allOf:
                        - $ref: '#/components/schemas/LogGap'
                    description: Lines that should come before these, and don't, if any.
                lines:
                    type: array
                    items:
                        $ref: '#/components/schemas/LogLine'
                    description: The lines, in the order they were written.
            description: LogChunk is some lines in a row from one source.
        LogGap:
            type: object
            properties:
                reason:
                    enum:
                        - LOG_GAP_REASON_UNSPECIFIED
                        - LOG_GAP_REASON_TOO_FAST
                        - LOG_GAP_REASON_READER_BEHIND
                        - LOG_GAP_REASON_GONE
                        - LOG_GAP_REASON_SHARED
                        - LOG_GAP_REASON_MATCH_LIMIT
                    type: string
                    description: Why.
                    format: enum
                lines:
                    type: string
                    description: How many lines are missing. Zero when that isn't known.
                bytes:
                    type: string
                    description: How many bytes they held. Zero when that isn't known.
                startTime:
                    type: string
                    description: When the first of them was written.
                    format: date-time
                endTime:
                    type: string
                    description: When the last of them was written.
                    format: date-time
            description: |-
                LogGap says lines are missing from a stream, and why. It is where they
                 were, so a reader knows what it isn't seeing.
        LogLine:
            type: object
            properties:
                time:
                    type: string
                    description: |-
                        When Docker received it, by its server's clock. Clocks of different
                         servers may differ, so lines from two servers are ordered only as well
                         as their clocks agree.
                    format: date-time
                stream:
                    enum:
                        - LOG_STREAM_UNSPECIFIED
                        - LOG_STREAM_STDOUT
                        - LOG_STREAM_STDERR
                    type: string
                    description: Which of the container's streams it came from.
                    format: enum
                level:
                    enum:
                        - LOG_LEVEL_UNSPECIFIED
                        - LOG_LEVEL_DEBUG
                        - LOG_LEVEL_INFO
                        - LOG_LEVEL_WARN
                        - LOG_LEVEL_ERROR
                    type: string
                    description: The level read from its text. Unset means it names none.
                    format: enum
                text:
                    type: string
                    description: |-
                        The line as printed, without its newline, with invalid UTF-8 replaced.
                         It may hold terminal escape codes, which a client must never pass on
                         unchecked.
                cutBytes:
                    type: integer
                    description: How many more bytes the line had past text. A line is cut at 16 KiB.
                    format: uint32
            description: LogLine is one line a container printed.
        LogSource:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Names the source in a chunk and in filters. It is the first 12 digits
                         of the container's ID, which is unique within a service.
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                replica:
                    type: integer
                    description: |-
                        The replica it is, from 1, within the service on that server. A service has
                         one for now: the containers a rollout moves between take turns as it, and
                         container_name says which of them this is.
                    format: int32
                containerName:
                    type: string
                    description: |-
                        The name a person knows the container by, such as "env_01kat…-web-3". It goes up
                         with each rolling deploy. Docker has another for a moment as a rollout stops it,
                         which this leaves out.
                revision:
                    type: string
                    description: |-
                        The revision that made this container: 0 when nothing says, as for one
                         made with docker compose. A later revision that didn't recreate it,
                         such as one that only changed its restart policy, doesn't change this.
                changeId:
                    type: string
                    description: The change that made this container, when known.
                state:
                    enum:
                        - LOG_SOURCE_STATE_UNSPECIFIED
                        - LOG_SOURCE_STATE_CREATED
                        - LOG_SOURCE_STATE_RUNNING
                        - LOG_SOURCE_STATE_RESTARTING
                        - LOG_SOURCE_STATE_STOPPED
                        - LOG_SOURCE_STATE_KEPT
                        - LOG_SOURCE_STATE_GONE
                    type: string
                    description: Where the container is now.
                    format: enum
                image:
                    type: string
                    description: The image it runs, as a spec names it, such as "nginx:1.27".
                createTime:
                    type: string
                    description: When it was made.
                    format: date-time
                startTime:
                    type: string
                    description: When it last started. Unset if never.
                    format: date-time
                finishTime:
                    type: string
                    description: When it last stopped. Unset while it runs.
                    format: date-time
                exitCode:
                    type: integer
                    description: The exit code it last stopped with, once stopped.
                    format: int32
                kept:
                    enum:
                        - LOG_KEPT_UNSPECIFIED
                        - LOG_KEPT_REPLACED
                        - LOG_KEPT_FAILED
                    type: string
                    description: Why the server kept its logs, once it was removed.
                    format: enum
                cutShort:
                    type: boolean
                    description: |-
                        True when the server kept only its newest lines, as it wrote more than
                         the server keeps of one container.
                unbounded:
                    type: boolean
                    description: |-
                        True when Docker keeps this container's log without a limit, so it can
                         fill the disk, as for one made before Dockwell set rotation, or by hand.
                         Replacing it, as any deploy does, sets one.
                logError:
                    type: string
                    description: |-
                        Why its log can't be read, as when its logging driver doesn't keep one
                         to read. Empty while it can.
            description: LogSource is one container a service has logs from.
        LoggedService:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID.
                name:
                    type: string
                    description: Its name, such as "web".
                environment:
                    type: string
                    description: The name of its environment, such as "production". Empty for a container.
                deleted:
                    type: boolean
                    description: |-
                        True when the service isn't there now. When its first deploy failed and
                         was rolled back, what its servers kept can still be read. When it was
                         deleted, nothing can, unless undoing the deletion brings it back.
            description: |-
                LoggedService says which service logs are from, or which container, for one
                 Dockwell didn't make.
        ManagedElsewhere:
            type: object
            properties:
                manager:
                    type: string
                    description: |-
                        The tool that runs its Compose project, such as "1Panel". Empty when its labels
                         don't show one.
                container:
                    type: string
                    description: The name it came with.
                project:
                    type: string
                    description: Its Compose project.
                folder:
                    type: string
                    description: Where that project runs from, which may hold what the service mounts.
            description: ManagedElsewhere is what else may run a container that was taken on.
        Member:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: Who they are, and their role.
                you:
                    type: boolean
                    description: True for the person asking.
                passkeys:
                    type: integer
                    description: |-
                        How many passkeys sign in at the panel's addresses now: one flagged as
                         copied, or for an address the panel no longer has, doesn't. Only for the
                         person asking.
                    format: int32
                passkeyAddresses:
                    type: array
                    items:
                        type: string
                    description: |-
                        The addresses those passkeys work at, such as "localhost" or
                         "panel.example.com", each once. Only for the person asking.
                authenticator:
                    type: boolean
                    description: |-
                        True when they can sign in with codes from an authenticator app now: on,
                         and not locked. Only for the person asking.
                recoveryCodesLeft:
                    type: integer
                    description: |-
                        How many of their recovery codes are left. Zero without an
                         authenticator app. Only for the person asking.
                    format: int32
                sessions:
                    type: integer
                    description: How many browsers they're signed in on now. Only for the person asking.
                    format: int32
                lastActiveTime:
                    type: string
                    description: When one of their browsers was last used. Unset with none.
                    format: date-time
                signIn:
                    type: array
                    items:
                        enum:
                            - SIGN_IN_KIND_UNSPECIFIED
                            - SIGN_IN_KIND_PASSKEY
                            - SIGN_IN_KIND_AUTHENTICATOR_APP
                        type: string
                        format: enum
                    description: |-
                        The kinds of sign-in that work for them now, as the members list shows
                         them for everyone.
                codesLocked:
                    type: boolean
                    description: |-
                        True when code sign-in is locked after too many wrong codes, until the
                         owner lifts it. Only for the person asking.
            description: |-
                Member is a person who can sign in, and how. The details of how are the
                 person asking's alone: for anyone else, only the kinds of sign-in they have
                 and when they were last active are set.
        Mount:
            type: object
            properties:
                volume:
                    type: string
                    description: |-
                        A volume, by name. A service's are volumes in its environment; a
                         container's on its own are Docker's.
                hostPath:
                    type: string
                    description: An absolute path on the server, such as "/srv/uploads".
                target:
                    type: string
                    description: Where it appears in the container, as an absolute path.
                readOnly:
                    type: boolean
                    description: Mounts it read-only.
                relabel:
                    enum:
                        - RELABEL_UNSPECIFIED
                        - RELABEL_SHARED
                        - RELABEL_PRIVATE
                    type: string
                    description: |-
                        Relabels a server path for SELinux, as Docker's z and Z options do, so
                         the container can use it on a server that enforces SELinux. Only a
                         server path takes one; elsewhere Docker changes nothing.
                    format: enum
                external:
                    type: boolean
                    description: |-
                        Says a service's volume is one Dockwell didn't make, by its name in Docker,
                         as one a container came with when it was taken on. It must be on the server
                         already: Dockwell never makes, changes or deletes one. Whatever else mounts it
                         shares what it holds, so mounting one is host access, which a person approves.
                         A container on its own names Docker's volumes already, so it takes none.
                makeOwner:
                    type: string
                    description: |-
                        For a server path: when it isn't there, the folder Dockwell makes for it
                         before the container starts, owned by this user and group, as "uid:gid", such
                         as "82:82", with mode 0755. Docker would make it root's. A folder that's there
                         keeps its owner. Numbered apart, as open work adds to this message.
            description: Mount puts a volume, or a directory on the server, into a container.
        Network:
            type: object
            properties:
                driver:
                    type: string
                    description: 'The network driver: "bridge" unless set.'
                options:
                    type: object
                    additionalProperties:
                        type: string
                    description: The driver's options.
                internal:
                    type: boolean
                    description: |-
                        Cuts the network off from outside the server: only its containers
                         reach each other.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: Labels on the network, for tools that read them.
            description: |-
                Network is a Docker network in an environment, which its services join
                 by name, as a Compose file's networks. A service reaches another on a
                 network they share by the other's name. Docker can't change a network,
                 so its spec can't change once it is made.
        OnePanel:
            type: object
            properties:
                version:
                    type: string
                    description: Its version, from its own records, such as "v2.4.2".
                baseDir:
                    type: string
                    description: The folder it's installed under, "/opt" unless the person chose another.
                records:
                    type: string
                    description: Its database, such as "/opt/1panel/db/agent.db".
                knownVersion:
                    type: boolean
                    description: |-
                        True when its version is one this importer was written from: v2.0 to v2.4.2,
                         and v1.10. Another is read the same way, by column names.
                apps:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelApp'
                    description: Its apps from its store, the database servers it runs among them.
                runtimes:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelRuntime'
                    description: Its runtimes.
                websites:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelWebsite'
                    description: Its websites.
                certificates:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelCertificate'
                    description: Its certificates.
                databaseServers:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelDatabaseServer'
                    description: Its database servers.
                databases:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelDatabase'
                    description: The databases on them.
                cronJobs:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelCronJob'
                    description: Its cron jobs.
                composes:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelCompose'
                    description: The Compose projects made on its Containers page, outside its store.
            description: |-
                OnePanel is what 1Panel keeps on a server, as its records say, with nothing
                 secret in it.
        OnePanelApp:
            type: object
            properties:
                name:
                    type: string
                    description: The install's name, which is its folder's and its Compose project's.
                appKey:
                    type: string
                    description: The store's key for the app, such as "mysql".
                appName:
                    type: string
                    description: The app's name in the store, such as "MySQL".
                version:
                    type: string
                    description: The version installed.
                status:
                    type: string
                    description: What 1Panel last saw it doing, such as "Running" or "Stopped".
                store:
                    type: string
                    description: |-
                        Which store it came from: "remote", 1Panel's own; "local", one of the
                         person's; or "custom".
                folder:
                    type: string
                    description: Its folder, with its Compose file.
                container:
                    type: string
                    description: Its main container's name.
                httpPort:
                    type: integer
                    description: The port it publishes for HTTP, where it has one.
                    format: uint32
                httpsPort:
                    type: integer
                    description: The port it publishes for HTTPS, where it has one.
                    format: uint32
            description: OnePanelApp is an install of an app from 1Panel's store.
        OnePanelCertificate:
            type: object
            properties:
                primaryDomain:
                    type: string
                    description: Its first domain.
                domains:
                    type: array
                    items:
                        type: string
                    description: The other domains it covers.
                kind:
                    type: string
                    description: |-
                        How it was got, as 1Panel's provider column says it: "http" or
                         "dnsAccount" from an ACME server, "dnsManual" from one with DNS records set
                         by hand, "manual" uploaded, "selfSigned" from 1Panel's own CA, or
                         "fromMaster" from the 1Panel that manages this one.
                provider:
                    type: string
                    description: |-
                        The ACME account's CA, as 1Panel names it, such as "letsencrypt", "zerossl"
                         or "custom", for one got from an ACME server.
                expires:
                    type: string
                    description: When it ends.
                    format: date-time
                autoRenew:
                    type: boolean
                    description: True when 1Panel renews it.
                issuer:
                    type: string
                    description: 'Who issued it: the issuer''s organization, or its common name.'
            description: |-
                OnePanelCertificate is a certificate 1Panel keeps for websites. Its key and
                 chain aren't read.
        OnePanelCompose:
            type: object
            properties:
                name:
                    type: string
                    description: Its name, which is its Compose project's.
                file:
                    type: string
                    description: Its Compose file.
            description: |-
                OnePanelCompose is a Compose project made on 1Panel's Containers page, which
                 runs with its name as its project's.
        OnePanelCronJob:
            type: object
            properties:
                name:
                    type: string
                    description: Its name.
                type:
                    type: string
                    description: |-
                        Its kind, as 1Panel says it: "shell", "curl", "app", "website",
                         "database", "directory", "snapshot", "log", "ntp", "cutWebsiteLog",
                         "clean", "cleanLog" or "syncIpGroup".
                schedule:
                    type: string
                    description: When it runs, as a cron schedule. 1Panel can keep several, a line each.
                status:
                    type: string
                    description: What 1Panel last saw it doing, such as "Enable" or "Disable".
                container:
                    type: string
                    description: The container a shell job runs in, where it runs in one.
                target:
                    type: string
                    description: |-
                        What it backs up or acts on: apps', websites' or databases' names, comma
                         separated, "all" for every one, or a folder.
                urlHost:
                    type: string
                    description: The host a URL job calls, without its path or query.
                scriptLines:
                    type: integer
                    description: |-
                        How many lines a shell job's script has, where it's written in the job or
                         in 1Panel's library.
                    format: uint32
                scriptFrom:
                    type: string
                    description: |-
                        Where a shell job's script is: "input", written in the job; "library", one
                         of 1Panel's library scripts, named in script_name; or "select", a file on
                         the server, at script_path.
                scriptName:
                    type: string
                    description: The name of the library script a shell job runs.
                scriptPath:
                    type: string
                    description: The file on the server a shell job runs.
                interpreter:
                    type: string
                    description: What runs a shell job's script, such as "bash" or "python3".
                user:
                    type: string
                    description: |-
                        Who a shell job runs as, in its container or on the server, where 1Panel
                         says.
                databaseType:
                    type: string
                    description: |-
                        The kind of database a database backup is of, as 1Panel says it: "mysql",
                         "mariadb", "postgresql" or "mongodb".
            description: |-
                OnePanelCronJob is a job 1Panel's own scheduler runs. Its script, command and
                 URL path aren't read.
        OnePanelDatabase:
            type: object
            properties:
                name:
                    type: string
                    description: The database's name.
                server:
                    type: string
                    description: The server it's on, by its name in 1Panel.
                type:
                    type: string
                    description: Its server's kind.
                user:
                    type: string
                    description: The user 1Panel made for it.
                format:
                    type: string
                    description: Its character set or encoding, such as "utf8mb4".
            description: |-
                OnePanelDatabase is a database on one of 1Panel's database servers, and the
                 user 1Panel made for it. The user's password isn't read.
        OnePanelDatabaseServer:
            type: object
            properties:
                name:
                    type: string
                    description: Its name in 1Panel.
                type:
                    type: string
                    description: Its kind, such as "mysql", "mariadb", "postgresql", "redis" or "mongodb".
                version:
                    type: string
                    description: Its version.
                local:
                    type: boolean
                    description: True when it runs on this server, as one of 1Panel's apps.
                app:
                    type: string
                    description: The app it is, by install name, when it's local.
                port:
                    type: integer
                    description: Its port.
                    format: uint32
            description: |-
                OnePanelDatabaseServer is a database server 1Panel knows: one of its store's,
                 or one on another machine.
        OnePanelDomain:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain.
                port:
                    type: integer
                    description: The port.
                    format: uint32
                https:
                    type: boolean
                    description: True when it's served over HTTPS.
            description: OnePanelDomain is a domain a website answers, on a port.
        OnePanelRuntime:
            type: object
            properties:
                name:
                    type: string
                    description: Its name.
                type:
                    type: string
                    description: 'Its language: "php", "node", "java", "go", "python" or "dotnet".'
                version:
                    type: string
                    description: The language's version.
                status:
                    type: string
                    description: What 1Panel last saw it doing.
                image:
                    type: string
                    description: The image it runs.
                folder:
                    type: string
                    description: Its folder, with its Compose file.
                codeFolder:
                    type: string
                    description: The folder of the code it runs, where it has one.
                container:
                    type: string
                    description: Its container's name.
            description: 'OnePanelRuntime is a runtime: a Compose project that runs a language.'
        OnePanelWebsite:
            type: object
            properties:
                alias:
                    type: string
                    description: Its alias, which names its folder and its config.
                primaryDomain:
                    type: string
                    description: Its first domain.
                type:
                    type: string
                    description: |-
                        What it is: "static", "runtime" for PHP and the like, "proxy",
                         "deployment" for an app's site, "subsite" or "stream".
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/OnePanelDomain'
                    description: The domains and ports it answers.
                folder:
                    type: string
                    description: |-
                        The folder it serves: its own folder's "index", or the folder under it it
                         runs from, such as "index/public" for a Laravel site.
                proxy:
                    type: string
                    description: Where a proxy sends, as a scheme, host and port, with no path.
                runtime:
                    type: string
                    description: The runtime it runs on, by name.
                app:
                    type: string
                    description: The app it serves, by install name.
                certificate:
                    type: string
                    description: The certificate it uses, by its first domain.
                rewrite:
                    type: boolean
                    description: True when it has rewrite rules.
                https:
                    type: boolean
                    description: True when it's served over HTTPS.
                status:
                    type: string
                    description: What 1Panel last saw it doing, such as "Running" or "Stopped".
                parent:
                    type: string
                    description: The site it's under, for a subsite.
            description: OnePanelWebsite is a website 1Panel's OpenResty serves.
        OpenTerminalRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                columns:
                    type: integer
                    description: The terminal's width, from 2 to 500 characters.
                    format: uint32
                rows:
                    type: integer
                    description: Its height, from 1 to 200 lines.
                    format: uint32
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for opening a terminal on this server, as the
                         target "srv_…", or in this container, as "srv_…:container". Call without it
                         first: it checks everything else, then refuses with the reason needs_step_up
                         where it takes one.
                container:
                    type: string
                    description: |-
                        A container on the server, by name or full ID, to open a shell in, in place of
                         the server's own.
            description: OpenTerminalRequest names a server.
        OpenTerminalResponse:
            type: object
            properties:
                terminal:
                    $ref: '#/components/schemas/Terminal'
            description: OpenTerminalResponse is the terminal, running.
        PackageUpdate:
            type: object
            properties:
                name:
                    type: string
                    description: The package's name, such as "openssl".
                architecture:
                    type: string
                    description: Its architecture, where the package manager names one, such as "x86_64".
                summary:
                    type: string
                    description: |-
                        What it is, in the package's own words, such as "Secure Sockets Layer
                         toolkit".
                installed:
                    type: string
                    description: |-
                        The version installed. Empty for a package that installing brings in new,
                         such as the next kernel.
                available:
                    type: string
                    description: The version it would get.
                origin:
                    type: string
                    description: |-
                        Where that version comes from: apt's suite, such as "noble-security", or
                         dnf's repository, such as "baseos". Empty where the tool doesn't say.
                security:
                    type: boolean
                    description: True when the distribution marks it a security fix.
                advisory:
                    type: string
                    description: The advisory that names it, such as "ALSA-2024:9473", where there is one.
                severity:
                    type: string
                    description: The advisory's severity, in its own words, such as "Important".
                effect:
                    enum:
                        - PACKAGE_EFFECT_UNSPECIFIED
                        - PACKAGE_EFFECT_REBOOT
                        - PACKAGE_EFFECT_DOCKER_RESTART
                    type: string
                    description: What installing it does beyond replacing its files.
                    format: enum
            description: PackageUpdate is one package with a newer version waiting.
        PanelServing:
            type: object
            properties:
                listen:
                    type: string
                    description: |-
                        The loopback address it always answers on, such as "127.0.0.1:7600", which
                         an SSH tunnel reaches.
                domain:
                    type: string
                    description: |-
                        The domain it also answers on over HTTPS, such as "panel.example.com".
                         Empty when it has none, and answers only on loopback.
                servedBy:
                    enum:
                        - PANEL_SERVED_BY_UNSPECIFIED
                        - PANEL_SERVED_BY_NONE
                        - PANEL_SERVED_BY_DOCKWELL
                        - PANEL_SERVED_BY_INGRESS
                    type: string
                    description: What serves it over HTTPS on its domain.
                    format: enum
                httpsListen:
                    type: string
                    description: |-
                        The address Dockwell serves HTTPS on itself, such as "[::]:443", with
                         PANEL_SERVED_BY_DOCKWELL. Empty otherwise.
                url:
                    type: string
                    description: |-
                        The panel's address on its domain, with its port when that isn't 443,
                         such as "https://panel.example.com" or "https://panel.example.com:8443".
                         Empty without a domain.
                certificateAuthority:
                    type: string
                    description: |-
                        Who issues the certificate Dockwell serves the domain with: "Let's
                         Encrypt", or the host of the ACME directory dockwell run was given, such
                         as "acme.example.com". Empty without a domain.
            description: PanelServing is how the panel is served, as dockwell run was started.
        Passkey:
            type: object
            properties:
                id:
                    type: string
                    description: The passkey's ID, such as "pky_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                name:
                    type: string
                    description: What it is called. Empty when it was given no name.
                rpId:
                    type: string
                    description: 'The address it works on: "localhost" or the panel''s domain.'
                createTime:
                    type: string
                    description: When it was added.
                    format: date-time
                lastUsedTime:
                    type: string
                    description: When it last signed in. Unset if never.
                    format: date-time
                synced:
                    type: boolean
                    description: |-
                        True when the passkey can sync between devices, as with iCloud Keychain
                         or Google Password Manager.
                suspectedCopy:
                    type: boolean
                    description: |-
                        True when it once reported a lower use count than before, which happens
                         when a passkey is copied. It no longer signs in; remove it.
            description: Passkey is one of a user's passkeys.
        Plan:
            type: object
            properties:
                fingerprint:
                    type: string
                    description: |-
                        A hash of what the plan does, for this change. Applying checks that a
                         fresh plan still has it. The same edits against the same state have
                         the same fingerprint, unless they edit a kind that may hold secrets:
                         that is digested for each change alone, so no two changes'
                         fingerprints say they set the same value.
                summary:
                    allOf:
                        - $ref: '#/components/schemas/PlanSummary'
                    description: How many resources it creates, changes, replaces and destroys.
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlannedResource'
                    description: Each resource the change touches, in the order of its edits.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerPlan'
                    description: |-
                        Each server with something to do, in the order of the edits, then each
                         removed server the change takes resources off.
                undoWindow:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long the change can be undone once it is applied.
                destructive:
                    type: boolean
                    description: |-
                        True when a step destroys data, may cut off access, or lets two
                         containers write to one place. Applying it needs the fingerprint and a
                         signed-in session.
                hostAccess:
                    type: boolean
                    description: |-
                        True when the change adds to, or changes, what a container can reach
                         on its server (host_access), which a person approves: applying it needs
                         the fingerprint and a signed-in session, as a destructive plan does.
                notes:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanNote'
                    description: |-
                        What a person should know before applying it that no step says, as it is
                         about what stays as it is or what can be read, not about what runs. A note
                         never stops anyone applying it.
                intent:
                    allOf:
                        - $ref: '#/components/schemas/Intent'
                    description: |-
                        What the change is for, in a person's terms, when the method that proposed
                         it knows. Unset for a change proposed as plain edits.
                places:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanPlace'
                    description: |-
                        Which project and environment its resources land in, once there's a choice
                         of either, so a plan can't read as another's. Empty while there's one
                         project with one environment. A plan that spans several lists each.
            description: |-
                Plan is what applying a change would do: what changes, where, and for
                 how long.
        PlanNote:
            type: object
            properties:
                reason:
                    type: string
                    description: |-
                        What it is about, for a surface that says it in its own words:
                         "named_as_text" for ${NAME} written as text in a field references doesn't
                         list, for a name the resource has a value for, which runs as those words;
                         "exposed_variable" for a variable whose value a Compose file writes in
                         free text, such as a label, where anyone who can read the plan
                         reads it, "exposed_more" for a file that writes more of them than a plan
                         lists, "container_name" for a name a service now answers to as an alias,
                         "no_build" for an image a Compose file builds and Dockwell doesn't,
                         "cpu_reservation" for a CPU reservation Docker has no way to keep,
                         "host_network_ports" for ports the server's own network doesn't publish,
                         "updates_project" for a Compose file that changes a project already running
                         services, "volumes_stay" for a rollback that leaves a service's data as it
                         is, "values_latest" for one that keeps the latest value of what the service
                         uses, "pulls_again" for a deploy of the tag it already names, "leaves_pin" for
                         one of the tag a rollback pinned, which replaces it whatever the pull finds,
                         "starts_stopped" for what isn't running and this plan starts, "digest_pinned"
                         for a rollback that runs exactly the image a revision ran, "digest_gone" for
                         one that can't as neither the server nor its registry has that image,
                         "digest_differs" for one that can't as its servers ran different images,
                         "kept_password" for a volume that keeps the
                         password it was made with, whatever an edit gave, "kept_passphrase" for a backup
                         destination that keeps its passphrase the same way, and "kept_options" for one
                         that keeps its options, as an edit gave none, "first_steps" for what a catalog
                         app needs a person to know and do, "backup_first" for one that backs up its volumes first, "backup_unmeasured" for a
                         volume whose backup gets a guess at the time it needs, "no_backup" for a catalog
                         upgrade that runs without a backup first, "upgrade_kept" for what a person changed that the upgrade
                         changes too, which stays, "upgrade_dropped" for what they changed that it
                         drops, which goes, "undo_no_backup" for an undo of a plan that took no backup,
                         whose data stays as the new version left it, "tmpfs_no_size" for a Compose
                         file's tmpfs that nothing stops taking half the server's memory, and
                         "tasks_as_root" for an app this makes reach what's as good as root, whose
                         scheduled tasks run in it and reach the same. Another reason may come: its
                         message says what it means.
                message:
                    type: string
                    description: 'What it says, for people: the fact, what it means, and what to do.'
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource it is about.
                names:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names it is about: the variable, then the field that holds it, for
                         "exposed_variable"; the project, then the services it runs, for
                         "updates_project"; the volumes and server paths for "volumes_stay"; the path
                         for "tmpfs_no_size"; each task, then its command, for "tasks_as_root"; the
                         variables and secrets, by the names the service sees, for "values_latest";
                         the image, the revision and its digest for "digest_pinned" and "digest_gone",
                         and the image and the revision for "digest_differs"; the container_name, or
                         the image, or the ports. Never a variable's value.
                from:
                    type: string
                    description: |-
                        Where the value came from, for "exposed_variable": "env_file" for the .env
                         sent beside the file, which someone may not have read for this, and
                         "variables" for the request's own. Empty otherwise.
                deleted:
                    type: array
                    items:
                        type: string
                    description: What it says would be deleted, for "updates_project". Empty otherwise.
                named:
                    type: boolean
                    description: |-
                        True when names and deleted hold all that message says, so a surface can say
                         it in its own words. A note kept from before these did has only its message.
            description: PlanNote is one thing a person should know before applying a plan.
        PlanPlace:
            type: object
            properties:
                project:
                    type: string
                    description: The project's name. Empty while there's only one project.
                environment:
                    type: string
                    description: The environment's name. Empty while its project has only one.
            description: PlanPlace is where a plan's resources land, naming only what offers a choice.
        PlanStep:
            type: object
            properties:
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: What the step does.
                    format: enum
                effect:
                    enum:
                        - STEP_EFFECT_UNSPECIFIED
                        - STEP_EFFECT_NONE
                        - STEP_EFFECT_RESTART
                        - STEP_EFFECT_RECREATE
                        - STEP_EFFECT_ROLL
                    type: string
                    description: What it does to what the resource serves.
                    format: enum
                downtime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long what the resource serves is unavailable. Unset means none.
                destroysData:
                    type: boolean
                    description: True when the step removes data its spec can't bring back.
                warnings:
                    type: array
                    items:
                        enum:
                            - PLAN_WARNING_UNSPECIFIED
                            - PLAN_WARNING_MAY_LOCK_OUT
                        type: string
                        format: enum
                    description: Ways the step may hurt that its action doesn't say.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: The fields that differ from what the server has now.
                untilHealthy:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long until what the resource serves is healthy again, at most,
                         counting the downtime, when its health check may take longer than the
                         downtime, as after a container is recreated. Unset when the downtime
                         says it all.
                keptPaths:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where data was that the step takes out of use, which the server keeps
                         for 7 days: for a container, the paths in it where its image keeps
                         data, which deleting it, or mounting something else there, leaves
                         behind. Undoing the step mounts them again.
                restores:
                    type: boolean
                    description: |-
                        True when the step brings back data its server kept, as undoing a
                         deletion does. Applying it fails if the server no longer has the data,
                         rather than making the resource anew, empty.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What the step lets the resource reach on its server that it couldn't
                         before, or reach in another way, which a person approves. The control
                         plane decides this from the specs, not from what the server reports.
                healthUnknown:
                    type: boolean
                    description: |-
                        True when the server hasn't the image yet, so its own health check
                         isn't known, and until_healthy may be missing or too short.
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressEffect'
                    description: |-
                        What the step does to the server's ingress, beside the route itself.
                         Unset for a step that leaves it as it is.
                domainCheck:
                    allOf:
                        - $ref: '#/components/schemas/DomainCheck'
                    description: |-
                        What DNS said of a route's domain when this was planned. It never stops
                         a plan, and the fingerprint leaves it out, as people often set DNS after.
                returningContainers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Stopped containers that Docker starts again when it next restarts, as after
                         a reboot, and that may then take the ports the server's proxy needs, so
                         its routes stop answering. It never stops a plan, and the fingerprint leaves
                         it out. Keep one stopped with docker update --restart=no.
                pull:
                    type: boolean
                    description: |-
                        True when the step asks the server for its image again first. With no
                         changes, it replaces what runs only if that finds a newer image, and does
                         nothing otherwise, which its progress says. With nothing but a restart policy
                         to change, it changes that in place otherwise.
                imageGone:
                    type: boolean
                    description: |-
                        True when the digest its spec pins isn't on the server, and its registry
                         won't give it, so applying it could only fail. A registry that doesn't answer
                         says nothing of it, so this stays false.
                rollout:
                    allOf:
                        - $ref: '#/components/schemas/RolloutPlan'
                    description: |-
                        How the step replaces a running service. Unset for a step that replaces
                         nothing, or that was planned without its server, as for an offline one,
                         which can't tell.
                restart:
                    type: string
                    description: Names the restart this step carries out, when it is one.
                unencrypted:
                    type: boolean
                    description: |-
                        True when the step has a route serve plain HTTP that didn't, as TLS ends
                         before this server, so its traffic reaches the server unencrypted. That is
                         fine on a tunnel or a private network, and not on the open internet. It
                         never stops a plan, and needs no person.
                answers:
                    allOf:
                        - $ref: '#/components/schemas/RouteAnswers'
                    description: |-
                        Who a route with tls off, or to a port on the server, answers. Unset for what
                         answers over HTTPS and sends to a service, as every other route does.
                serverPort:
                    allOf:
                        - $ref: '#/components/schemas/ServerPortCheck'
                    description: |-
                        The port on the server a route sends to, and what listens there as this was
                         planned. It never stops a plan, and the fingerprint leaves what listens out.
                hidesLogs:
                    type: boolean
                    description: |-
                        True when the step deletes a service whose server keeps logs of it: from
                         then on they can't be read, and they go in 7 days, unless undoing the
                         step brings them back. Numbered apart, as open work adds to this message.
                goes:
                    allOf:
                        - $ref: '#/components/schemas/RouteGoes'
                    description: |-
                        What someone visiting a route finds once this step takes it away. A route
                         stops nothing a plan counts as downtime, and yet stops people reaching what it
                         served. It never stops a plan, and the fingerprint leaves it out. Numbered
                         apart, as open work adds to this message.
                moves:
                    allOf:
                        - $ref: '#/components/schemas/RouteMove'
                    description: |-
                        Set when a route leaves the service it sent to for another, as what a domain
                         reaches changing is easy to miss among a plan's fields. It never stops a plan.
                         Numbered apart, as open work adds to this message.
                adopts:
                    type: string
                    description: |-
                        The full ID of the container this step takes on, which goes on running as it
                         is, with no restart, as what the step's service runs.
                releases:
                    type: boolean
                    description: |-
                        True when this deletion lets go of a container that was taken on and hasn't been
                         replaced since: it goes on running as it is, and nothing about it changes.
                managedElsewhere:
                    allOf:
                        - $ref: '#/components/schemas/ManagedElsewhere'
                    description: |-
                        What else may still run what this step replaces, which came from a Compose
                         project. A plan says what that means in a note.
                sharedNames:
                    type: array
                    items:
                        $ref: '#/components/schemas/SharedName'
                    description: |-
                        Names what this step takes on goes on answering to, that others hold too on a
                         network it's on.
                restore:
                    allOf:
                        - $ref: '#/components/schemas/RestorePlan'
                    description: |-
                        What a step that restores a volume from a backup does. Numbered apart, as open
                         work adds to this message.
                backupFirst:
                    allOf:
                        - $ref: '#/components/schemas/BackupFirst'
                    description: What a step that backs up a volume before the rest of a change does.
            description: PlanStep is what applying does to one resource on one server.
        PlanSummary:
            type: object
            properties:
                create:
                    type: integer
                    description: Resources made for the first time.
                    format: int32
                change:
                    type: integer
                    description: Resources changed in place.
                    format: int32
                replace:
                    type: integer
                    description: |-
                        Resources removed and made again, such as a recreated container. A
                         replace is counted here alone, never among the changes.
                    format: int32
                destroy:
                    type: integer
                    description: Resources deleted.
                    format: int32
            description: PlanSummary counts the resources a plan touches by what it does to them.
        PlannedResource:
            type: object
            properties:
                id:
                    type: string
                    description: The resource's ID. A new resource has its ID from when it is planned.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: |-
                        What happens to it, from its steps on every server: replace if any
                         step replaces it; delete if it is deleted, from every server; create if
                         it is new and every step creates it; otherwise update, if anything
                         changes. A kind that runs on no server takes what its revision does.
                         The summary counts these.
                    format: enum
                baseRevision:
                    type: string
                    description: 'The revision it starts from: 0 for a new resource.'
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: The fields that differ from its latest revision.
                servers:
                    type: array
                    items:
                        type: string
                    description: Where it runs once applied, by server ID.
                previousServers:
                    type: array
                    items:
                        type: string
                    description: Where it runs now, by server ID.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What the change lets it reach on its servers that it couldn't before,
                         or reach in another way, which a person approves. The control plane
                         decides this from the specs, not from what the servers report.
            description: PlannedResource is what a plan does to one resource as a whole.
        PortMapping:
            type: object
            properties:
                hostPort:
                    type: integer
                    description: The port on the server.
                    format: uint32
                containerPort:
                    type: integer
                    description: The port inside the container.
                    format: uint32
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP unless set.
                    format: enum
                hostIp:
                    type: string
                    description: |-
                        The server address it listens on, such as "127.0.0.1". Empty listens on
                         every address.
            description: PortMapping publishes a container port on the server.
        PreviewBackupResponse:
            type: object
            properties:
                method:
                    enum:
                        - BACKUP_METHOD_UNSPECIFIED
                        - BACKUP_METHOD_DUMP
                        - BACKUP_METHOD_COPY
                        - BACKUP_METHOD_COPY_RUNNING
                    type: string
                    description: What it would do with nothing else asked.
                    format: enum
                database:
                    type: string
                    description: The database whose dump it takes, such as "PostgreSQL".
                running:
                    type: array
                    items:
                        type: string
                    description: |-
                        What runs on the volume now: services by name, and anything else by its
                         container's.
                estimateBytes:
                    type: string
                    description: |-
                        About how much a backup will take on the server's disk, in bytes: the last one's
                         size, or what's in the volume before there's been one. Zero when that took too
                         long to find out.
                freeBytes:
                    type: string
                    description: What's free on the disk that holds backups, in bytes.
                reserveBytes:
                    type: string
                    description: |-
                        How much of that a backup leaves alone, in bytes: one that would go below this is
                         refused, or stops, so a backup never fills the disk.
            description: PreviewBackupResponse says what backing up a volume would do.
        PreviewWebsiteRequest:
            type: object
            properties:
                website:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: What it serves, as JSON, such as {"proxy":{"url":"https://backend.example.com"}}, or {"proxy":{"port":3000}} for a port on the server.
            description: PreviewWebsiteRequest is what a website would serve.
        PreviewWebsiteResponse:
            type: object
            properties:
                website:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: What it serves, as Dockwell keeps it, such as a URL written as it's used.
                config:
                    type: string
                    description: |-
                        Its web server's config, a Caddyfile, as its service runs it. Empty for a
                         website that needs no web server of its own, as one that sends to a port on
                         the server.
            description: PreviewWebsiteResponse is what serving it takes.
        Project:
            type: object
            properties:
                displayName:
                    type: string
                    description: |-
                        How the panel shows it, such as "Acme web". Empty shows its name, which
                         URLs and the CLI use.
                catalog:
                    allOf:
                        - $ref: '#/components/schemas/CatalogPin'
                    description: |-
                        The catalog entry this project was installed from. Unset for any other
                         project. See docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
                website:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: |-
                        What this project serves, for a project made as a website. Dockwell writes
                         the route and the services of its environment from it. Unset for any other
                         project. See docs/adr/0039-websites-as-projects-of-their-own.md.
            description: |-
                Project is a product or client in the organization. It holds
                 environments, and scopes members, secrets and domains. An install starts
                 with one, named "default", which stays out of sight until there is a
                 second. Deleting one takes its environments with it, once nothing lives in
                 them.
        ProposeChangeRequest:
            type: object
            properties:
                summary:
                    type: string
                    description: |-
                        What the change is for, in your words, such as "Add a staging
                         environment". Required: the timeline shows it.
                edits:
                    type: array
                    items:
                        $ref: '#/components/schemas/Edit'
                    description: |-
                        The edits, at most one for each resource. They apply in this order,
                         and deletions last, in reverse.
            description: ProposeChangeRequest is a set of edits to plan together.
        ProposeChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: ProposeChangeResponse carries the planned change.
        PublicAddress:
            type: object
            properties:
                address:
                    type: string
                    description: The address the internet knows the server by.
                source:
                    enum:
                        - PUBLIC_ADDRESS_SOURCE_UNSPECIFIED
                        - PUBLIC_ADDRESS_SOURCE_SET_BY_PERSON
                        - PUBLIC_ADDRESS_SOURCE_ON_INTERFACE
                        - PUBLIC_ADDRESS_SOURCE_PROVED_BY_DOMAIN
                        - PUBLIC_ADDRESS_SOURCE_SEEN_BY_CONTROL_PLANE
                        - PUBLIC_ADDRESS_SOURCE_CLOUD_METADATA
                        - PUBLIC_ADDRESS_SOURCE_LOOKED_UP
                    type: string
                    description: How that's known.
                    format: enum
                knownTime:
                    type: string
                    description: |-
                        When Dockwell came to know it that way. For a domain's, that's when its DNS
                         was last read.
                    format: date-time
                domain:
                    type: string
                    description: |-
                        The domain whose certificate proved it, for
                         PUBLIC_ADDRESS_SOURCE_PROVED_BY_DOMAIN.
                setBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who set it, for PUBLIC_ADDRESS_SOURCE_SET_BY_PERSON.
                unproven:
                    type: boolean
                    description: |-
                        True when nothing shows the address is a way in, so it's named only with a
                         caveat: a way out, or a metadata service the machine doesn't confirm.
            description: PublicAddress is what's known of one public address of a server.
        ReadFileRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                path:
                    type: string
                    description: |-
                        The file's absolute path, without . or .. in it, such as
                         "/etc/nginx/nginx.conf".
            description: ReadFileRequest names a file on a server.
        ReadFileResponse:
            type: object
            properties:
                path:
                    type: string
                    description: The file's path, with every symlink followed.
                file:
                    allOf:
                        - $ref: '#/components/schemas/FileEntry'
                    description: The file itself.
                content:
                    type: string
                    description: Its text. Empty for a binary file.
                binary:
                    type: boolean
                    description: True when the file isn't UTF-8 text, so its contents aren't sent.
                truncated:
                    type: boolean
                    description: True when the file is longer than 1 MiB, so content is its beginning.
                version:
                    type: string
                    description: |-
                        What SaveFile takes to save over this text: a digest of where the path led,
                         which file that was, and what it held, which tells whether any of it changed
                         since. Empty for what can't be saved here: a binary file, one with more to
                         it than content, or a file on a server whose agent is too old to save.
                wayBackIn:
                    type: boolean
                    description: |-
                        True when saving this file takes a passkey, as it's a way back onto the
                         server, such as authorized_keys, a cron job or a systemd unit.
            description: ReadFileResponse is a file on a server.
        ReadLogsResponse:
            type: object
            properties:
                chunks:
                    type: array
                    items:
                        $ref: '#/components/schemas/LogChunk'
                    description: |-
                        The lines, by source. Within a source they are in time order, and each
                         source's come before any older page's.
                sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/LogSource'
                    description: The sources the lines come from, and any others that pass the filters.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerLogStatus'
                    description: Each server the service is on that couldn't answer, with why.
                nextPageToken:
                    type: string
                    description: |-
                        Pass it as page_token for the next page, of older lines. Empty on the
                         last page.
                searchedBackTo:
                    type: string
                    description: |-
                        How far back a search reached: the oldest line it looked at. Older
                         lines are gone from the servers, or past what a search reads. Unset
                         without a query or levels.
                    format: date-time
                searchedLines:
                    type: string
                    description: How many lines a search looked at. Zero without a query or levels.
                searchCutShort:
                    type: boolean
                    description: |-
                        True when a search stopped at its limit, of size or of time, before it
                         reached the oldest line a server has.
                searchTimedOut:
                    type: boolean
                    description: |-
                        True when what stopped it was its limit of time, 30 seconds, rather than
                         the most lines it reads.
            description: ReadLogsResponse is a page of log lines.
        RegenerateRecoveryCodesRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for making recovery codes.
            description: RegenerateRecoveryCodesRequest confirms making new recovery codes.
        RegenerateRecoveryCodesResponse:
            type: object
            properties:
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: Ten one-time recovery codes. They are shown only now.
            description: RegenerateRecoveryCodesResponse carries the new codes.
        RemovePasskeyRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The passkey's ID.
                proof:
                    type: string
                    description: The proof from FinishStepUp, for removing this passkey.
            description: RemovePasskeyRequest names a passkey.
        RemovePasskeyResponse:
            type: object
            properties: {}
            description: RemovePasskeyResponse is empty.
        Resource:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "prj_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: Its kind, the ID of what it lives in, and its name.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was applied.
                    format: date-time
                displayName:
                    type: string
                    description: |-
                        The name to show, such as "Storefront", from its spec, for kinds whose
                         spec has one. Empty when it isn't set.
            description: Resource is one managed resource, as its latest revision has it.
        ResourceRef:
            type: object
            properties:
                kind:
                    type: string
                    description: |-
                        The kind, such as "project", "environment", "service", "volume",
                         "network", "route", "container" or "firewall.rule".
                scope:
                    type: string
                    description: |-
                        The ID of what it lives in, which its kind says: the organization
                         ("org_…") for a project, a project ("prj_…") for an environment, an
                         environment ("env_…") for a service, volume, network or route, and a server
                         ("srv_…") for a container or firewall rule.
                name:
                    type: string
                    description: Its name, unique among its kind in its scope, such as "web".
            description: ResourceRef names a resource.
        Resources:
            type: object
            properties:
                cpus:
                    type: string
                    description: |-
                        The most CPUs it may use, such as "0.5" or "2", to three decimal places.
                         Empty has no limit.
                memory:
                    type: string
                    description: |-
                        The most memory it may use, such as "512M" or "2G", from 6M, in units of
                         1024. Empty has no limit.
                memoryReservation:
                    type: string
                    description: |-
                        The memory Docker tries to leave it when the server runs short, such as
                         "256M", from 6M and no more than memory. Empty reserves none.
            description: |-
                Resources is what a container may use of its server. Docker changes these on
                 a running container, except to lift one: that recreates it.
        RestartServiceRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service's ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V", or its name.
                project:
                    type: string
                    description: |-
                        The project of the environment, by name or ID, when id is a name and there
                         are several projects.
                environment:
                    type: string
                    description: |-
                        The environment, by name or ID, when id is a name and there are several
                         environments.
                summary:
                    type: string
                    description: What the restart is for, for the timeline. Empty says what it restarts.
            description: RestartServiceRequest names a service to restart.
        RestartServiceResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: RestartServiceResponse carries the planned restart.
        RestoreBackupRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The backup's ID.
                summary:
                    type: string
                    description: What it's for, for the timeline. Empty says what it restores.
            description: RestoreBackupRequest asks to restore a backup.
        RestoreBackupResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: RestoreBackupResponse is the change that restores it.
        RestorePlan:
            type: object
            properties:
                backupId:
                    type: string
                    description: The backup it brings back. Empty for an undo.
                undoes:
                    type: string
                    description: The change it undoes, by putting back what that replaced. Empty otherwise.
                method:
                    enum:
                        - BACKUP_METHOD_UNSPECIFIED
                        - BACKUP_METHOD_DUMP
                        - BACKUP_METHOD_COPY
                        - BACKUP_METHOD_COPY_RUNNING
                    type: string
                    description: How what it brings back was taken.
                    format: enum
                database:
                    type: string
                    description: The database of a dump, such as "PostgreSQL".
                takenAt:
                    type: string
                    description: When what it brings back was taken.
                    format: date-time
                sizeBytes:
                    type: string
                    description: How large that is, in bytes.
                stops:
                    type: array
                    items:
                        type: string
                    description: |-
                        What stops while it happens: services by name, and anything else by its
                         container's. It's whatever mounts the volume, and for a dump, the rest of the
                         app on that server too.
                writtenBy:
                    type: string
                    description: |-
                        The image that wrote a copy of a database's files, and the one that would read
                         them, set only when those are different releases, as the database may not
                         start on them.
                runsOn:
                    type: string
                reached:
                    type: array
                    items:
                        type: string
                    description: |-
                        What the backup's volume reached when it was taken that's as good as root. A
                         backup is tied to a volume by name alone, so what it holds may be that, whatever
                         the volume it comes back into reaches.
            description: |-
                RestorePlan is what a step that restores a volume does: it says what comes
                 back, and what stops while it does. What's in the volume is replaced, and the
                 server keeps a copy of it for 7 days.
        RevealSecretRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The secret's ID, such as "sec_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for revealing this secret. It works once,
                         within a minute, in the session that made it.
            description: RevealSecretRequest names a secret to reveal.
        RevealSecretResponse:
            type: object
            properties:
                value:
                    type: string
                    description: The value.
                revision:
                    type: string
                    description: The revision it is from.
            description: RevealSecretResponse carries a secret's value.
        RevertDriftRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server it drifted on.
                resourceId:
                    type: string
                    description: The resource's ID.
            description: RevertDriftRequest names a drifted resource to put back.
        RevertDriftResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, that puts the resource back.
            description: RevertDriftResponse carries the planned revert.
        RevokeOtherSessionsRequest:
            type: object
            properties: {}
            description: RevokeOtherSessionsRequest takes no parameters.
        RevokeOtherSessionsResponse:
            type: object
            properties:
                revoked:
                    type: integer
                    description: How many sessions were revoked.
                    format: int32
            description: RevokeOtherSessionsResponse says how many sessions ended.
        RevokeSessionRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The session's ID.
            description: RevokeSessionRequest names a session.
        RevokeSessionResponse:
            type: object
            properties: {}
            description: RevokeSessionResponse is empty.
        RevokeTokenRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The token's ID.
            description: RevokeTokenRequest names a token.
        RevokeTokenResponse:
            type: object
            properties: {}
            description: RevokeTokenResponse is empty.
        RollBackServiceRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                revision:
                    type: string
                    description: The revision to go back to.
                summary:
                    type: string
                    description: |-
                        What the change is for, for the timeline. Empty says which revision it
                         goes back to.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: RollBackServiceRequest names a service and the revision to go back to.
        RollBackServiceResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: RollBackServiceResponse carries the planned rollback.
        RollbackStatus:
            type: object
            properties:
                id:
                    type: string
                    description: The rollback's change, as rolled_back_by says.
                state:
                    enum:
                        - ROLLBACK_STATE_UNSPECIFIED
                        - ROLLBACK_STATE_APPLYING
                        - ROLLBACK_STATE_WAITING
                        - ROLLBACK_STATE_APPLIED
                        - ROLLBACK_STATE_FAILED
                    type: string
                    description: Where it is.
                    format: enum
                steps:
                    type: integer
                    description: |-
                        How many steps it takes, without one that found the server had what it was
                         to put back. None means the servers still had what was there before, as the
                         failed change stopped before it changed them.
                    format: int32
                waitingFor:
                    type: array
                    items:
                        type: string
                    description: The servers it waits for, by name, while it waits.
                error:
                    type: string
                    description: Why it failed, in plain words, when it did.
                detail:
                    type: string
                    description: What the server said, when it failed and error puts that in plain words.
                restored:
                    type: array
                    items:
                        type: string
                    description: |-
                        The resources its steps put back, by name. What isn't here didn't change,
                         so it never stopped.
            description: |-
                RollbackStatus is how the rollback of a failed change is going, for
                 whoever has to say what runs now.
        Rollout:
            type: object
            properties:
                order:
                    enum:
                        - ROLLOUT_ORDER_UNSPECIFIED
                        - ROLLOUT_ORDER_START_FIRST
                        - ROLLOUT_ORDER_STOP_FIRST
                    type: string
                    description: |-
                        Which comes first, the new container or stopping the old one. Unset takes
                         the safest there is for what the service publishes and mounts: the new one
                         first, unless both would publish one server port, or a volume, a server
                         path or the data its image keeps would be written to by two containers at
                         once.
                    format: enum
                drain:
                    type: string
                    description: |-
                        How long what is in flight to the old container has to finish once no new
                         request goes to it, such as "1m". Empty takes 30 s. What outlasts it, such
                         as a long-lived WebSocket, ends with the container.
            description: Rollout says how a deploy replaces a service's running container.
        RolloutPlan:
            type: object
            properties:
                rolling:
                    type: boolean
                    description: |-
                        True when a new container takes over once it is healthy, so nothing stops:
                         downtime is unset. False when the old one stops first, so there is
                         downtime, and never two at once.
                ports:
                    type: array
                    items:
                        type: string
                    description: |-
                        Server ports both would publish, which two containers can't, such as
                         "8080/tcp".
                volumes:
                    type: array
                    items:
                        type: string
                    description: Volumes both would mount and one of them write to.
                paths:
                    type: array
                    items:
                        type: string
                    description: Server paths both would mount and one of them write to.
                imageData:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where in the container its image keeps data, in a volume that moves to the
                         new container.
                chosen:
                    type: boolean
                    description: |-
                        True when the service's rollout.order chose this, rather than the rest of
                         this message. With rolling, it means two containers may write to what the
                         lists above name, for as long as the step takes.
                drain:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        The most what is in flight gets to finish once no new request goes to the
                         old container. What outlasts it ends with the container.
                healthyWithin:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        The most the new container gets to be healthy before the change fails and
                         Dockwell rolls it back, while the old one goes on serving.
                others:
                    type: array
                    items:
                        type: string
                    description: |-
                        Containers of the service the step also removes, as a rollout that stopped
                         partway or docker compose up --scale left them.
                stopGrace:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        The most an old container gets to stop, once what it had in flight is
                         done, before Docker kills it.
                cantTell:
                    type: array
                    items:
                        type: string
                    description: |-
                        What it mounts whose real place on the server the agent can't read, such as
                         a volume on another driver, so it can't say two containers wouldn't write
                         to the same place, and the old one stops first.
                editedRoutes:
                    type: array
                    items:
                        type: string
                    description: |-
                        Routes someone edited by hand that send to the service. Dockwell leaves them
                         as they are, so the new container has to keep the old one's address, and the
                         old one stops first.
                earlyNetworks:
                    type: array
                    items:
                        type: string
                    description: |-
                        Networks of the service. Docker answers the service's name there with every
                         running container that has it, so while a new one starts, other services
                         can reach it by name beside the old one, before it has passed its check.
                earlyNames:
                    type: array
                    items:
                        type: string
                    description: The other names it answers to on those networks.
                hostNetwork:
                    type: boolean
                    description: |-
                        True when the old container or the new one is on the server's own network,
                         where each listens on the server's ports, so the old one stops first.
                dropped:
                    type: array
                    items:
                        $ref: '#/components/schemas/DroppedMount'
                    description: |-
                        What the old container mounts and the new one doesn't. It stays on the
                         server, and the service no longer sees it.
                soak:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long a new container must stay healthy before anything moves to it or
                         the old one goes.
                noCheck:
                    type: boolean
                    description: |-
                        True when nothing checks the new container, neither its spec nor its image,
                         so healthy is only that it runs, and keeps running for soak.
                routePorts:
                    type: object
                    additionalProperties:
                        type: integer
                        format: uint32
                    description: |-
                        The port each route this change touches sends to on the service, by the route's
                         name. A route's own step comes after its service's, so the new container is held
                         to these, and traffic moves to them with it, not to what the route dials now.
            description: RolloutPlan is how a step replaces a running service, and why.
        Route:
            type: object
            properties:
                domain:
                    type: string
                    description: |-
                        The domain, such as "app.example.com": a lowercase DNS name that a
                         public certificate authority issues for. Wildcards aren't taken.
                path:
                    type: string
                    description: |-
                        The path it covers, such as "/api": that path and what is under it,
                         which reach the service as they are. Empty covers the whole domain.
                service:
                    type: string
                    description: |-
                        The service to send it to, by name, in the route's environment. With
                         host_port it says whose route this is, as the route dials that port rather than
                         the service's container. Empty only for a host_port that is no service's.
                port:
                    type: integer
                    description: |-
                        The port the service listens on inside its container, such as 8080. Empty
                         when host_port names a port on the server instead.
                    format: uint32
                tls:
                    type: string
                    description: |-
                        "off" when TLS ends before this server, as at a tunnel or a proxy in front
                         of it: the domain is served over plain HTTP on port 80, with no certificate
                         and no redirect to HTTPS, so its traffic reaches this server unencrypted.
                         Such a route answers only the proxies in trusted_proxies, or with none, this
                         server's own loopback, unless plain_for_anyone says otherwise. Anyone else
                         gets what a name with no route gets. Empty gets a certificate. A domain's
                         routes all take the same setting. A person approves taking a domain that has
                         had a certificate off it.
                trustedProxies:
                    type: array
                    items:
                        type: string
                    description: |-
                        The proxies in front of this server whose word this route takes on where a
                         request came from, each an address, a range such as "203.0.113.0/24", or
                         "cloudflare" for Cloudflare's published ranges. A request from anywhere else
                         has its address taken from the connection, whatever another route on the
                         server names. From an address or a range, X-Forwarded-For is read from the
                         right. From "cloudflare", CF-Connecting-IP is read, as Cloudflare documents,
                         and it's only as sure as Cloudflare says: see docs/security/ingress.md. A
                         person approves each one a change adds, as a proxy that isn't really one makes
                         client addresses forgeable. A range of Cloudflare's is named by the preset, and
                         a public range wider than /12, or /28 in IPv6, or a private one wider than /8,
                         isn't taken.
                hostPort:
                    type: integer
                    description: |-
                        A port on the server itself, such as 8080, in place of port, for a service on
                         the server's own network, which a route can't send to by name, or with no service
                         at all, for something that isn't a Dockwell service. The proxy dials 127.0.0.1 on it,
                         so what's there sees every caller as local. It reaches past containers, so a
                         person approves it, and any change to where it answers. Dockwell's own ports,
                         and Docker's API, on 2375, 2376 or wherever dockerd listens, aren't taken.
                    format: uint32
                plainForAnyone:
                    type: boolean
                    description: |-
                        True for a route that says tls off to answer anyone who can reach this
                         server's port 80, as for a site on a private network, or a load balancer whose
                         addresses aren't known. It goes around whatever is in front, so a person
                         approves it.
            description: |-
                Route sends a domain's traffic, or a path under it, to a port of a service
                 in the route's environment, or to a port on the server itself. It comes over
                 HTTPS with a certificate Dockwell gets for the domain, unless tls says TLS
                 ends before this server. A server's first route starts its ingress, which
                 takes ports 80 and 443, or port 80 alone while no route on the server takes
                 a certificate; its last stops it and frees them. See
                 docs/adr/0024-the-caddy-ingress-driver.md and
                 docs/adr/0030-routes-behind-a-tunnel-or-a-proxy.md.
        RouteAnswers:
            type: object
            properties:
                reach:
                    enum:
                        - ROUTE_REACH_UNSPECIFIED
                        - ROUTE_REACH_THIS_SERVER
                        - ROUTE_REACH_PROXIES
                        - ROUTE_REACH_ANYONE
                    type: string
                    description: Who.
                    format: enum
                proxies:
                    type: array
                    items:
                        type: string
                    description: The proxies it answers, for ROUTE_REACH_PROXIES.
                plain:
                    type: boolean
                    description: True when it answers over plain HTTP, as tls off says.
            description: RouteAnswers is who a route answers, as its plan says.
        RouteGoes:
            type: object
            properties:
                where:
                    type: string
                    description: Its domain and path, as people read them, such as "app.example.com/api".
                domain:
                    type: string
                    description: The domain alone.
                find:
                    enum:
                        - VISITORS_FIND_UNSPECIFIED
                        - VISITORS_FIND_REFUSED
                        - VISITORS_FIND_TLS_ERROR
                        - VISITORS_FIND_NOT_FOUND
                        - VISITORS_FIND_REST
                        - VISITORS_FIND_NOTHING_BEHIND
                    type: string
                    description: What someone visiting it finds.
                    format: enum
            description: RouteGoes is a route a step takes away.
        RouteMove:
            type: object
            properties:
                where:
                    type: string
                    description: Its domain and path, as people read them, such as "app.example.com/api".
                from:
                    type: string
                    description: The service it sent to.
                to:
                    type: string
                    description: The service it goes to. Empty when it goes to to_port on the server.
                toPort:
                    type: integer
                    description: The port on the server it goes to, when it goes to no service.
                    format: uint32
            description: RouteMove is a route leaving one service for another.
        RunTaskRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The task's ID, or its name with project and environment.
                project:
                    type: string
                    description: The project, by name or ID, when id is a name. Left out while there's only one.
                environment:
                    type: string
                    description: |-
                        The environment, by name or ID, when id is a name. Left out while its project
                         has only one.
                server:
                    type: string
                    description: The server to run it on, by name or ID, when it's placed on more than one.
            description: RunTaskRequest names a task to run now.
        RunTaskResponse:
            type: object
            properties:
                run:
                    $ref: '#/components/schemas/TaskRun'
            description: RunTaskResponse is the run, started.
        SaveFileRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                path:
                    type: string
                    description: |-
                        The file's absolute path, without . or .. in it. The file must exist:
                         SaveFile doesn't make one.
                content:
                    type: string
                    description: The file's new text, 1 MiB at most.
                version:
                    type: string
                    description: 'The version from ReadFile: the file as you last read it.'
                confirmedPath:
                    type: string
                    description: |-
                        The path ReadFile said the file is at, with every symlink followed, which
                         proof confirms. Set it with proof.
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for saving this path on this server. A file
                         that's a way back onto the server needs it. Call without it first: it checks
                         everything else, then refuses with the reason needs_step_up.
            description: SaveFileRequest replaces a file's text.
        SaveFileResponse:
            type: object
            properties:
                path:
                    type: string
                    description: The file's path, with every symlink followed.
                file:
                    allOf:
                        - $ref: '#/components/schemas/FileEntry'
                    description: The file itself.
                version:
                    type: string
                    description: What the next save over this text takes.
                wayBackIn:
                    type: boolean
                    description: True when the file is a way back onto the server, which took a passkey.
            description: SaveFileResponse is the file as saved.
        Secret:
            type: object
            properties:
                value:
                    type: string
                    description: The value. Every edit sets it whole.
            description: |-
                Secret is a value of an environment that its services use without anyone
                 reading it back, such as a database password. Dockwell keeps it
                 encrypted, sends it only to the servers that run a service that uses it,
                 and never shows it in plans, history or logs. Revealing it takes a
                 passkey, and is audited.
        Server:
            type: object
            properties:
                id:
                    type: string
                    description: The server's ID.
                name:
                    type: string
                    description: What the server is called, such as "hz-1".
                createTime:
                    type: string
                    description: When the server joined.
                    format: date-time
                connection:
                    enum:
                        - CONNECTION_UNSPECIFIED
                        - CONNECTION_CONNECTED
                        - CONNECTION_UNREACHABLE
                        - CONNECTION_PENDING
                    type: string
                    description: Whether its agent is connected.
                    format: enum
                lastSeenTime:
                    type: string
                    description: When the control plane last heard from the agent. Unset if never.
                    format: date-time
                inventory:
                    allOf:
                        - $ref: '#/components/schemas/ServerInventory'
                    description: 'What the server is: OS, hardware, Docker. Unset until the agent reports.'
                stats:
                    allOf:
                        - $ref: '#/components/schemas/ServerStats'
                    description: The newest stats. Unset until the agent reports.
                history:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerStats'
                    description: |-
                        Recent stats, oldest first, for sparklines: at most 60 samples, from
                         the 5 minutes before the newest by the samples' own times, so a server
                         that reports again after a longer outage starts over. Samples come every
                         5 s while anyone watches the fleet, and every 15 s while nobody does, so
                         each says its own interval. Empty in lists.
                agentBuild:
                    allOf:
                        - $ref: '#/components/schemas/BuildInfo'
                    description: The agent's build.
                controlServer:
                    type: boolean
                    description: True for the server that runs the control plane.
                connectTime:
                    type: string
                    description: |-
                        When the agent connected, if it is connected now. A connection that
                         moves to a renewed certificate keeps its time. Unset otherwise.
                    format: date-time
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressStatus'
                    description: |-
                        Where its ingress stands, as it last said. Unset for a server with no
                         routes, as nothing on it wants the public ports.
                dockerUnreadableSince:
                    type: string
                    description: |-
                        Since when its agent hasn't been able to read Docker, on the server's
                         clock, as it last said: Docker isn't running, or doesn't answer. Nobody
                         can say how what runs there is until it can. Unset while it can, and for a
                         server that isn't connected.
                    format: date-time
                network:
                    allOf:
                        - $ref: '#/components/schemas/ServerNetwork'
                    description: |-
                        How the server meets the internet, as far as that's known. The addresses
                         on its own interfaces are in its inventory.
            description: Server is one machine running the agent.
        ServerContainer:
            type: object
            properties:
                id:
                    type: string
                    description: Its full ID.
                name:
                    type: string
                    description: Its name, such as "nginx".
                image:
                    type: string
                    description: |-
                        The image it was made from, such as "nginx:1.27". Once that name means
                         another image, or none, this is the ID of the one it runs, such as
                         "sha256:3f2a…", as Docker lists it.
                state:
                    enum:
                        - CONTAINER_STATE_UNSPECIFIED
                        - CONTAINER_STATE_CREATED
                        - CONTAINER_STATE_RUNNING
                        - CONTAINER_STATE_PAUSED
                        - CONTAINER_STATE_RESTARTING
                        - CONTAINER_STATE_REMOVING
                        - CONTAINER_STATE_EXITED
                        - CONTAINER_STATE_DEAD
                    type: string
                    description: Where it is now.
                    format: enum
                status:
                    type: string
                    description: |-
                        How it is, in Docker's own words, such as "Up 3 hours (healthy)" or
                         "Exited (137) 2 days ago".
                createTime:
                    type: string
                    description: When it was made.
                    format: date-time
                ports:
                    type: array
                    items:
                        $ref: '#/components/schemas/ContainerPort'
                    description: |-
                        The ports it publishes on the server now, by port. A stopped container
                         publishes none, and one on the server's own network needs none.
                morePorts:
                    type: integer
                    description: How many more ports it publishes than are listed.
                    format: int32
                mounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/ContainerMount'
                    description: The volumes and server paths mounted in it, by where it mounts them.
                moreMounts:
                    type: integer
                    description: How many more it mounts than are listed.
                    format: int32
                composeProject:
                    type: string
                    description: |-
                        The Compose project it is part of, as its labels say. Empty for a
                         container on its own.
                composeService:
                    type: string
                    description: Its service in that project.
                oneOff:
                    type: boolean
                    description: True for a container that docker compose run made for one command.
            description: ServerContainer is a container on a server, as Docker lists it.
        ServerDiskUse:
            type: object
            properties:
                time:
                    type: string
                    description: When the agent added it up, on the server's clock.
                    format: date-time
                dockerRoot:
                    type: string
                    description: Where Docker keeps its data, such as "/var/lib/docker".
                mountPoint:
                    type: string
                    description: Where the disk that holds it is mounted, such as "/".
                sizeBytes:
                    type: string
                    description: How big that disk is, in bytes.
                usedBytes:
                    type: string
                    description: How much of it is in use, in bytes, as df counts it.
                imagesBytes:
                    type: string
                    description: |-
                        What images take, each layer counted once, as `docker system df` counts
                         them.
                imagesUnusedBytes:
                    type: string
                    description: What of that no container uses, so removing those images would free it.
                containersBytes:
                    type: string
                    description: What containers have written to their own layers.
                volumesBytes:
                    type: string
                    description: What volumes hold. Docker counts only the volumes it keeps itself.
                volumesUnusedBytes:
                    type: string
                    description: What of that is in volumes no container uses.
                buildCacheBytes:
                    type: string
                    description: What the build cache takes.
                logsBytes:
                    type: string
                    description: |-
                        What containers' logs take, as Docker's json-file and local drivers keep
                         them, rotated files included.
                images:
                    type: integer
                    description: How many images there are.
                    format: uint32
                containers:
                    type: integer
                    description: How many containers there are, running or not.
                    format: uint32
                volumes:
                    type: integer
                    description: How many volumes there are.
                    format: uint32
            description: |-
                ServerDiskUse is what takes the room on the disk that holds Docker's data,
                 as Docker and the agent added it up. Docker's parts can come to more than
                 the disk holds, when Docker's data spans disks of its own.
        ServerHealth:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                state:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UNKNOWN
                        - HEALTH_STATE_NO_CHECK
                        - HEALTH_STATE_STARTING
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_RUNNING
                        - HEALTH_STATE_PAUSED
                    type: string
                    description: |-
                        How it is there. While a container takes over from another, it is how the
                         better of the two is, as that one serves.
                    format: enum
                stale:
                    type: boolean
                    description: |-
                        True when the server's agent isn't connected, or what it said is too old to
                         stand, so state is HEALTH_STATE_UNKNOWN, and instances are what it last said.
                since:
                    type: string
                    description: Since when it has been in this state, as far as this control plane knows.
                    format: date-time
                instances:
                    type: array
                    items:
                        $ref: '#/components/schemas/InstanceHealth'
                    description: 'Each container of the service there: one, or two while a deploy rolls.'
                scannedAt:
                    type: string
                    description: |-
                        When its agent last read the list of containers from Docker, on the server's
                         clock. Unset until it has.
                    format: date-time
                dockerUnreadableSince:
                    type: string
                    description: |-
                        Since when its agent hasn't been able to read Docker, on the server's
                         clock: Docker isn't running, or doesn't answer, so what only Docker can say
                         is HEALTH_STATE_UNKNOWN while the agent is connected. Unset while it can,
                         and when stale.
                    format: date-time
            description: ServerHealth is how a service is on one server.
        ServerInventory:
            type: object
            properties:
                hostname:
                    type: string
                    description: The server's hostname.
                osName:
                    type: string
                    description: The operating system's name for people, such as "Ubuntu 24.04.1 LTS".
                osId:
                    type: string
                    description: The OS's ID from os-release, such as "ubuntu" or "debian".
                osVersion:
                    type: string
                    description: The OS version, such as "24.04".
                kernel:
                    type: string
                    description: The kernel release, such as "6.8.0-48-generic".
                architecture:
                    type: string
                    description: The CPU architecture, such as "amd64" or "arm64".
                cpuModel:
                    type: string
                    description: The CPU model, such as "AMD EPYC 7763 64-Core Processor".
                cpuCount:
                    type: integer
                    description: Logical CPUs.
                    format: uint32
                memoryBytes:
                    type: string
                    description: Total memory, in bytes.
                disks:
                    type: array
                    items:
                        $ref: '#/components/schemas/Disk'
                    description: Mounted filesystems that hold data, largest first.
                dockerVersion:
                    type: string
                    description: |-
                        The Docker Engine version, such as "28.5.1". Empty when Docker isn't
                         installed or isn't running.
                addresses:
                    type: array
                    items:
                        type: string
                    description: The server's non-loopback IP addresses.
                dockerLogDriver:
                    type: string
                    description: |-
                        The logging driver Docker uses by default, such as "json-file". Empty
                         when Docker isn't running.
                outboundAddress:
                    type: string
                    description: |-
                        The address its route to the internet leaves from. Empty when it has no
                         such route, or from an agent from before this.
            description: 'ServerInventory is what a server is: its system and hardware.'
        ServerLogStatus:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                state:
                    enum:
                        - SERVER_LOG_STATE_UNSPECIFIED
                        - SERVER_LOG_STATE_READING
                        - SERVER_LOG_STATE_DONE
                        - SERVER_LOG_STATE_OFFLINE
                        - SERVER_LOG_STATE_UNAVAILABLE
                    type: string
                    description: How it stands.
                    format: enum
                message:
                    type: string
                    description: Why, for people, with how to fix it, when it isn't reading.
            description: ServerLogStatus is how reading logs from one server stands.
        ServerNetwork:
            type: object
            properties:
                ipv4:
                    allOf:
                        - $ref: '#/components/schemas/PublicAddress'
                    description: Its public IPv4 address. Unset when nothing says.
                ipv6:
                    allOf:
                        - $ref: '#/components/schemas/PublicAddress'
                    description: Its public IPv6 address. Unset when nothing says.
                reachable:
                    enum:
                        - REACHABLE_UNSPECIFIED
                        - REACHABLE_NOT_CHECKED
                        - REACHABLE_YES
                        - REACHABLE_NO
                    type: string
                    description: Whether the internet can reach the server at either.
                    format: enum
                reachableDomain:
                    type: string
                    description: The domain that shows it, for REACHABLE_YES and REACHABLE_NO.
                reachableTime:
                    type: string
                    description: When that domain's DNS was last read, so what's shown is as of then.
                    format: date-time
                provider:
                    enum:
                        - CLOUD_PROVIDER_UNSPECIFIED
                        - CLOUD_PROVIDER_AWS
                        - CLOUD_PROVIDER_GCP
                        - CLOUD_PROVIDER_AZURE
                        - CLOUD_PROVIDER_DIGITALOCEAN
                        - CLOUD_PROVIDER_HETZNER
                        - CLOUD_PROVIDER_ORACLE
                    type: string
                    description: |-
                        The cloud provider the machine itself says it runs on, from its firmware's
                         tables. A metadata service answering doesn't say so on its own.
                    format: enum
                shape:
                    enum:
                        - NETWORK_SHAPE_UNSPECIFIED
                        - NETWORK_SHAPE_INTERNET
                        - NETWORK_SHAPE_CLOUD_NAT
                        - NETWORK_SHAPE_LOCAL_NAT
                        - NETWORK_SHAPE_CARRIER_NAT
                    type: string
                    description: Which of the shapes a server comes in this one has, as far as can be told.
                    format: enum
            description: |-
                ServerNetwork is what's known of a server beyond its own interfaces. Its
                 public address and whether the internet can reach it are separate facts: an
                 address can be known and nothing proved of it. IPv4 and IPv6 are picked apart,
                 as a server's A and AAAA records go to different places. See
                 docs/adr/0034-a-servers-public-address.md.
        ServerPlan:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                offline:
                    type: boolean
                    description: |-
                        True when the server isn't connected: its steps are planned from the
                         state it last had, and the change can't be applied until it reconnects.
                removed:
                    type: boolean
                    description: |-
                        True when the server was removed from the fleet. It has no steps: what
                         the change takes off it is only recorded.
                downtime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: The steps' downtime added up, as they run one at a time.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanStep'
                    description: The steps, in the order they run.
                untilHealthy:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long until everything the steps touch is healthy again, at most,
                         when a health check may take longer than the downtime: each step's
                         until_healthy, or its downtime, added up. Unset when the downtime says
                         it all.
            description: ServerPlan is the part of a plan on one server.
        ServerPortCheck:
            type: object
            properties:
                port:
                    type: integer
                    description: The port.
                    format: uint32
                listening:
                    type: string
                    description: |-
                        What listens there, as the server said when this was planned, such as
                         "nginx, in the container web-1". Empty when nothing does, or it couldn't say.
                nothingListening:
                    type: boolean
                    description: |-
                        True when the server said nothing listens there yet, so the route answers 502
                         until something does. False, with listening empty, when it couldn't say.
            description: ServerPortCheck is a port on the server that a route sends to.
        ServerStats:
            type: object
            properties:
                time:
                    type: string
                    description: When the agent took the sample.
                    format: date-time
                cpuPercent:
                    type: number
                    description: CPU busy time across all cores since the previous sample, 0 to 100.
                    format: double
                memoryUsedBytes:
                    type: string
                    description: Memory in use (total minus available), in bytes.
                memoryTotalBytes:
                    type: string
                    description: Total memory, in bytes.
                disks:
                    type: array
                    items:
                        $ref: '#/components/schemas/DiskUsage'
                    description: Use of each disk in the inventory.
                load1:
                    type: number
                    description: Load averages over 1, 5 and 15 minutes.
                    format: double
                load5:
                    type: number
                    description: Load average over 5 minutes.
                    format: double
                load15:
                    type: number
                    description: Load average over 15 minutes.
                    format: double
                networkRxBytesPerSecond:
                    type: string
                    description: Bytes received per second across physical interfaces.
                networkTxBytesPerSecond:
                    type: string
                    description: Bytes sent per second across physical interfaces.
                uptime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Time since the server booted.
                swapUsedBytes:
                    type: string
                    description: Swap in use, in bytes.
                swapTotalBytes:
                    type: string
                    description: Total swap, in bytes. 0 for a server with none.
                agentMemoryBytes:
                    type: string
                    description: |-
                        What the agent itself holds in memory (its resident set), in bytes. 0
                         from an agent from before this.
                networkRxBytes:
                    type: string
                    description: Bytes received across physical interfaces since the server booted.
                networkTxBytes:
                    type: string
                    description: Bytes sent across physical interfaces since the server booted.
                interval:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long until the agent's next sample, at the pace it was sampling when
                         it took this one: 5 s while anyone watches the fleet, 15 s while nobody
                         does. Unset from an agent from before this, which samples every 5 s.
            description: ServerStats is one sample of a server's resource use.
        ServerUpdates:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                manager:
                    enum:
                        - PACKAGE_MANAGER_UNSPECIFIED
                        - PACKAGE_MANAGER_APT
                        - PACKAGE_MANAGER_DNF
                        - PACKAGE_MANAGER_APK
                    type: string
                    description: The package manager that read them. Unspecified when none could.
                    format: enum
                unavailable:
                    type: string
                    description: |-
                        Set when Dockwell can't read updates on this server, saying why, such as
                         that it has none of apt, dnf and apk. Nothing else is then set, but reason.
                packages:
                    type: array
                    items:
                        $ref: '#/components/schemas/PackageUpdate'
                    description: The updates that wait, security fixes first, then by name.
                held:
                    type: array
                    items:
                        type: string
                    description: |-
                        Packages with a newer version that an upgrade holds back, by name, such as
                         one of Ubuntu's phased updates that hasn't reached this server yet.
                marksSecurity:
                    type: boolean
                    description: |-
                        False where the distribution doesn't mark security fixes, as Alpine
                         doesn't: no package is then marked, whatever it fixes.
                rebootRequired:
                    type: boolean
                    description: True when the server needs a reboot now, for what's already installed.
                rebootPackages:
                    type: array
                    items:
                        type: string
                    description: What the server says asked for the reboot, by package, where it says.
                listsTime:
                    type: string
                    description: |-
                        When the server's package lists were last refreshed, by anyone. Unset when
                         they never were.
                    format: date-time
                readTime:
                    type: string
                    description: When the agent read these.
                    format: date-time
                checking:
                    type: boolean
                    description: |-
                        True while the agent reads them, or refreshes the lists first: what's here
                         is from before, and asking again gives what it finds.
                refreshing:
                    type: boolean
                    description: True while the lists are being refreshed, as part of checking.
                error:
                    type: string
                    description: Why the last read failed, if it did. What's here is from the one before.
                refreshError:
                    type: string
                    description: |-
                        Why refreshing the lists failed, if it did. What's here was read from the
                         lists as they were, at lists_time.
                automatic:
                    allOf:
                        - $ref: '#/components/schemas/AutomaticUpdates'
                    description: Whether the server installs updates by itself.
                dockerLiveRestore:
                    type: boolean
                    description: |-
                        True when Docker keeps containers running while it restarts (live-restore),
                         so updating Docker's engine stops none.
                reason:
                    type: string
                    description: |-
                        Why what's here isn't a read that's current, for a client to word: one of
                         "unsupported" (no package manager Dockwell reads, with unavailable saying
                         which), "agent_outdated" (the server's agent reads no updates; update it),
                         "server_offline" (its agent isn't connected; what's here is from before), and
                         "read_failed" (the last read failed, with error saying why). Empty otherwise.
            description: ServerUpdates is what a server's package manager says waits.
        Service:
            type: object
            properties:
                app:
                    allOf:
                        - $ref: '#/components/schemas/Container'
                    description: An app from an image.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The environment's variables the service uses, each under the name the
                         service sees it as: DATABASE_HOST=DB_HOST gives the service the
                         variable DB_HOST as DATABASE_HOST. An empty value means the variable of
                         the same name.
                secrets:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The environment's secrets the service uses, named as for variables.
                         Using a secret doesn't let anyone read it: its value goes only to the
                         servers the service runs on, and only their agents decrypt it.
                revisions:
                    readOnly: true
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The revision of each variable and secret the service uses, by the name
                         the service sees it as. Dockwell sets it when a change is planned, so a
                         service whose variable or secret changes gets a revision of its own,
                         and restarts with the new value. An edit's is ignored.
            description: |-
                Service is anything that runs in an environment, placed on servers: for
                 now an app from an image, run as one container on each server it is
                 placed on, and two while a deploy rolls, with the labels Docker Compose
                 gives a service's container, so docker compose sees it. A Compose file becomes services, volumes and
                 networks. Websites, databases, catalog apps and jobs come later. Where it
                 runs isn't part of the spec: each revision is deployed on its servers.

                 A service uses its environment's variables and secrets by reference:
                 the environment holds each value once, and a service names the ones it
                 uses, under the names it expects. So changing a value changes every
                 service that uses it, in one plan.
        ServiceDeployment:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1", even once it has left the fleet.
                state:
                    enum:
                        - DEPLOYMENT_STATE_UNSPECIFIED
                        - DEPLOYMENT_STATE_PENDING
                        - DEPLOYMENT_STATE_LIVE
                        - DEPLOYMENT_STATE_FAILED
                        - DEPLOYMENT_STATE_SUPERSEDED
                    type: string
                    description: How the rollout went.
                    format: enum
                error:
                    type: string
                    description: Why it failed, when it did.
                updateTime:
                    type: string
                    description: When its state last moved on.
                    format: date-time
                digest:
                    type: string
                    description: |-
                        The image it ran there, as its registry knows it, such as "sha256:ab12…", so
                         what a moving tag such as :latest really was stays known. Empty until it has
                         run, and for an image no registry knows.
            description: ServiceDeployment is one revision of a service placed on one server.
        ServiceHealth:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: Its kind, its environment's ID, and its name.
                state:
                    enum:
                        - HEALTH_STATE_UNSPECIFIED
                        - HEALTH_STATE_UNKNOWN
                        - HEALTH_STATE_NO_CHECK
                        - HEALTH_STATE_STARTING
                        - HEALTH_STATE_HEALTHY
                        - HEALTH_STATE_UNHEALTHY
                        - HEALTH_STATE_NOT_RUNNING
                        - HEALTH_STATE_PAUSED
                    type: string
                    description: |-
                        How it is as a whole: the worst of its servers. Show "Healthy" only for
                         HEALTH_STATE_HEALTHY.
                    format: enum
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerHealth'
                    description: Each server it is placed on.
            description: ServiceHealth is how one service is, on every server it is placed on.
        ServiceInfo:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Its ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V". Empty for a service a
                         Compose file would make, which has none yet.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: Its kind, its environment's ID, and its name.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was made.
                    format: date-time
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Service'
                    description: |-
                        What it runs, as its latest revision's spec has it, with sensitive values
                         blanked: an environment variable has its name and no value.
                deployments:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceDeployment'
                    description: |-
                        The latest revision on each server it is placed on, even a server that
                         has since left the fleet, which is how a surface tells that no server
                         runs it any more. Empty only on a revision that placed it nowhere.
                changeId:
                    type: string
                    description: The change that made its latest revision.
                rolledBackChangeId:
                    type: string
                    description: |-
                        The failed change that Dockwell made its latest revision to roll back, when
                         it did. That rollback may still be running, may be waiting for a server, or
                         may have failed too: change_state says how it stands, and the deployments
                         where. Only once it has applied does the service have what it had before.
                changeState:
                    enum:
                        - CHANGE_STATE_UNSPECIFIED
                        - CHANGE_STATE_PLANNED
                        - CHANGE_STATE_APPLYING
                        - CHANGE_STATE_APPLIED
                        - CHANGE_STATE_FAILED
                        - CHANGE_STATE_DISCARDED
                    type: string
                    description: |-
                        How the change that made its latest revision stands. A deployment still
                         pending under a change that has failed will not move again.
                    format: enum
                specUnreadable:
                    type: string
                    description: |-
                        Why its latest revision's spec can't be read, in plain words, with what to
                         do: it was changed, moved to another row, or sealed with keys this install
                         hasn't got. Then spec is unset, and the rest of this message and the rest of
                         the list stand.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What its latest revision reaches on its servers beyond its own containers,
                         as its spec says and through the volumes it mounts, as a plan reads it: a
                         server path, Docker's socket, the server's network, a capability. A path is
                         as written, as no agent says here where it leads, so a plan can say more.
                         While one is same_as_root, a change that keeps it, other than another tag
                         of its image or a limit, asks for a passkey, which an editor can say before
                         it plans; one that takes it away asks for none. Empty when it reaches
                         nothing, or its spec can't be read.
            description: |-
                ServiceInfo is what a service runs now and how that went, as its latest
                 revision has it.
        ServiceRevision:
            type: object
            properties:
                number:
                    type: string
                    description: Its number, from 1.
                createTime:
                    type: string
                    description: 'When it was made: when its change started applying.'
                    format: date-time
                image:
                    type: string
                    description: The image it runs. Empty on a revision that deleted the service.
                deleted:
                    type: boolean
                    description: |-
                        True for a revision that deleted the service, which it may come back
                         from later.
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change that made it, with who proposed and applied it, from where,
                         and its plan in brief. GetChange has the plan in full.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: |-
                        What it changed from the revision before, as its plan says. A sensitive
                         field says that it changed, never what it holds.
                deployments:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceDeployment'
                    description: Where it was placed, and how that went.
                matchesLatest:
                    type: boolean
                    description: |-
                        True when going back to it would do nothing: it has the spec of the latest
                         revision, on the same servers.
                rolledBackTo:
                    type: string
                    description: |-
                        The revision it put back, for a revision made by RollBackService. 0 for
                         any other.
                serversAdded:
                    type: array
                    items:
                        type: string
                    description: |-
                        The servers it put the service on, by name. A revision can do that and
                         change no field of its spec, so changes is empty.
                serversLeft:
                    type: array
                    items:
                        type: string
                    description: The servers it took the service off, by name.
            description: ServiceRevision is one immutable revision of a service.
        Session:
            type: object
            properties:
                id:
                    type: string
                    description: The session's ID, such as "ses_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                userAgent:
                    type: string
                    description: The browser's User-Agent when it signed in.
                address:
                    type: string
                    description: The address it was last seen from.
                createTime:
                    type: string
                    description: When it signed in.
                    format: date-time
                lastSeenTime:
                    type: string
                    description: When it last made a request.
                    format: date-time
                expireTime:
                    type: string
                    description: |-
                        When it ends unless it is revoked first: the earlier of its idle and
                         absolute limits.
                    format: date-time
                current:
                    type: boolean
                    description: True for the session making this request.
                signInMethod:
                    enum:
                        - SIGN_IN_METHOD_UNSPECIFIED
                        - SIGN_IN_METHOD_CLAIM
                        - SIGN_IN_METHOD_PASSKEY
                        - SIGN_IN_METHOD_AUTHENTICATOR_CODE
                        - SIGN_IN_METHOD_RECOVERY_CODE
                        - SIGN_IN_METHOD_LINK
                    type: string
                    description: How it signed in.
                    format: enum
                rpId:
                    type: string
                    description: 'The address it works on: "localhost" or the panel''s domain.'
            description: Session is one signed-in browser.
        SetInstallNameRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The name, at most 64 characters. Empty clears it.
            description: SetInstallNameRequest names the install.
        SetInstallNameResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/Settings'
                    description: The settings.
            description: SetInstallNameResponse carries the settings as they now are.
        SetServerPublicAddressRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The server's ID.
                address:
                    type: string
                    description: A public IP address, or empty to clear what a person set.
                ipv6:
                    type: boolean
                    description: |-
                        With an empty address, clears the IPv6 address a person set, not the IPv4
                         one. A person's addresses are kept apart, as DNS records are.
            description: SetServerPublicAddressRequest says what a server's public address is.
        SetServerPublicAddressResponse:
            type: object
            properties:
                server:
                    allOf:
                        - $ref: '#/components/schemas/Server'
                    description: The server, without history.
            description: SetServerPublicAddressResponse carries the server as it now reads.
        SetTimeZoneRequest:
            type: object
            properties:
                timeZone:
                    type: string
                    description: |-
                        The zone as the IANA names it, such as "Europe/Amsterdam" or "UTC". Empty
                         clears it, and new schedules start in UTC again.
            description: SetTimeZoneRequest sets the time zone new schedules start in.
        SetTimeZoneResponse:
            type: object
            properties:
                settings:
                    allOf:
                        - $ref: '#/components/schemas/Settings'
                    description: The settings.
            description: SetTimeZoneResponse carries the settings as they now are.
        Settings:
            type: object
            properties:
                name:
                    type: string
                    description: |-
                        What the install is called, such as "Acme servers". Empty when nobody has
                         named it, where the panel says Dockwell.
                timeZone:
                    type: string
                    description: |-
                        The time zone a new schedule starts in when it comes without one of its
                         own, as the IANA names it, such as "Europe/Amsterdam" or "UTC". Empty
                         when nobody has set one, and new schedules then start in UTC.
                panel:
                    allOf:
                        - $ref: '#/components/schemas/PanelServing'
                    description: How the panel is served.
                createTime:
                    type: string
                    description: When the install was set up.
                    format: date-time
            description: Settings are the install's own settings.
        SharedName:
            type: object
            properties:
                name:
                    type: string
                    description: The name, such as "redis".
                network:
                    type: string
                    description: The network, such as "1panel-network".
                others:
                    type: array
                    items:
                        type: string
                    description: The other containers that answer to it there, by name.
            description: SharedName is a name more than one container answers to on a network.
        SignInWithCodeRequest:
            type: object
            properties:
                email:
                    type: string
                    description: The account's email.
                code:
                    type: string
                    description: |-
                        A 6-digit code from the authenticator app, or a recovery code such as
                         "7KQ2-M9XD-4TPA-ZR3C".
            description: SignInWithCodeRequest carries an email and a code.
        SignInWithCodeResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
                usedRecoveryCode:
                    type: boolean
                    description: True when a recovery code was used. It now no longer works.
                recoveryCodesLeft:
                    type: integer
                    description: Recovery codes still unused.
                    format: int32
            description: |-
                SignInWithCodeResponse carries who signed in. The response sets the session
                 cookie.
        SignInWithLinkRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the link, the part after "#".
            description: SignInWithLinkRequest carries a sign-in link's token.
        SignInWithLinkResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
            description: |-
                SignInWithLinkResponse carries who signed in. The response sets the session
                 cookie.
        SignOutRequest:
            type: object
            properties: {}
            description: SignOutRequest takes no parameters.
        SignOutResponse:
            type: object
            properties: {}
            description: SignOutResponse is empty. The response clears the session cookie.
        Source:
            type: object
            properties:
                repository:
                    type: string
                    description: The repository, such as "https://github.com/Dockwell/dockwell".
                path:
                    type: string
                    description: The file in it, such as "internal/catalog/entries/postgres.yaml".
                commit:
                    type: string
                    description: The commit. An entry built into Dockwell takes the commit of its build.
            description: Source is where an entry came from.
        Spec:
            type: object
            properties:
                project:
                    allOf:
                        - $ref: '#/components/schemas/Project'
                    description: A project, kind "project".
                environment:
                    allOf:
                        - $ref: '#/components/schemas/Environment'
                    description: An environment, kind "environment".
                service:
                    allOf:
                        - $ref: '#/components/schemas/Service'
                    description: A service, kind "service".
                container:
                    allOf:
                        - $ref: '#/components/schemas/Container'
                    description: A container run by hand on a server, kind "container".
                firewallRule:
                    allOf:
                        - $ref: '#/components/schemas/FirewallRule'
                    description: A firewall rule on a server, kind "firewall.rule".
                volume:
                    allOf:
                        - $ref: '#/components/schemas/Volume'
                    description: A volume in an environment, kind "volume".
                network:
                    allOf:
                        - $ref: '#/components/schemas/Network'
                    description: A network in an environment, kind "network".
                variable:
                    allOf:
                        - $ref: '#/components/schemas/Variable'
                    description: A variable of an environment, kind "variable".
                secret:
                    allOf:
                        - $ref: '#/components/schemas/Secret'
                    description: A secret of an environment, kind "secret".
                route:
                    allOf:
                        - $ref: '#/components/schemas/Route'
                    description: A domain or path sent to a service, kind "route".
                backupPolicy:
                    allOf:
                        - $ref: '#/components/schemas/BackupPolicy'
                    description: |-
                        A schedule of backups of a volume, kind "backup.policy". Numbered apart,
                         as open work adds to this message.
                backupDestination:
                    allOf:
                        - $ref: '#/components/schemas/BackupDestination'
                    description: S3-compatible storage backups go to, kind "backup.destination".
                databaseUser:
                    allOf:
                        - $ref: '#/components/schemas/DatabaseUser'
                    description: |-
                        A database and the user who owns it, in a database server a service runs,
                         kind "database.user". Numbered apart, as open work adds to this message.
                task:
                    allOf:
                        - $ref: '#/components/schemas/Task'
                    description: |-
                        Work that runs on a schedule, kind "task". Numbered in the block scheduled
                         tasks hold, as open work adds to this message.
            description: |-
                Spec is the desired state of one resource, of any kind: the field that is
                 set says which. Edits in the API carry specs in it, so one message takes
                 every kind.
        StateStore:
            type: object
            properties:
                engine:
                    enum:
                        - STATE_STORE_ENGINE_UNSPECIFIED
                        - STATE_STORE_ENGINE_SQLITE
                        - STATE_STORE_ENGINE_POSTGRES
                    type: string
                    description: What kind of database it is.
                    format: enum
                location:
                    type: string
                    description: |-
                        Where it is: a SQLite file's path, or a Postgres URL without its
                         password. Empty for an API token.
                version:
                    type: string
                    description: The database's own version, such as "3.50.4" or "17.2".
                sizeBytes:
                    type: string
                    description: Its size on disk, in bytes.
                roundTrip:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long a query that reads nothing took, just now.
            description: StateStore is the database the control plane keeps its state in.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StepProgress:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server it runs on.
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: What the step does.
                    format: enum
                state:
                    enum:
                        - STEP_STATE_UNSPECIFIED
                        - STEP_STATE_QUEUED
                        - STEP_STATE_RUNNING
                        - STEP_STATE_DONE
                        - STEP_STATE_FAILED
                        - STEP_STATE_SKIPPED
                        - STEP_STATE_WAITING
                    type: string
                    description: How it is going.
                    format: enum
                message:
                    type: string
                    description: |-
                        What is happening, for people, such as "Replacing web on hz-1", or why
                         the step failed, in plain words.
                startTime:
                    type: string
                    description: When it started running. Unset until then.
                    format: date-time
                finishTime:
                    type: string
                    description: When it finished. Unset until then.
                    format: date-time
                activity:
                    type: string
                    description: |-
                        What the step's driver says it is doing right now, such as "Pulling
                         nginx:1.27: 12 of 48 MB". Empty until it says, and once the step ends.
                detail:
                    type: string
                    description: |-
                        What the server said, when a step failed and message puts it in plain
                         words: the whole chain of errors, IDs included. It never holds a secret,
                         as drivers keep them out of their errors.
                reason:
                    type: string
                    description: |-
                        What a failure comes down to, when the driver knows, so a client can say
                         what to do about it where it is: "image", "command", "exits", "unhealthy",
                         "port" or "mount". Empty when it doesn't, and it may gain others.
                lost:
                    type: boolean
                    description: |-
                        True when the server went away during the step, so nothing can say whether
                         it ran until the server is back.
                did:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: |-
                        What the step did in the end, on this server, once it's done: action says
                         what was planned, and only the step can say this, as a pull finds out as it
                         goes. PLAN_ACTION_NONE left what runs exactly as it was. Unspecified until
                         it's done, for a step that failed, and for one a run that stopped partway had
                         done already.
                    format: enum
            description: StepProgress is one step of an applying change, and how it is going.
        Task:
            type: object
            properties:
                shell:
                    allOf:
                        - $ref: '#/components/schemas/TaskShell'
                    description: |-
                        A shell command on the server, which the agent runs as root. Making one, or
                         changing what it runs, takes a person and a passkey.
                app:
                    allOf:
                        - $ref: '#/components/schemas/TaskApp'
                    description: |-
                        A command in an app's image, as a one-off container with the app's
                         environment, mounts and networks.
                request:
                    allOf:
                        - $ref: '#/components/schemas/TaskRequest'
                    description: An HTTP request to a URL, from the server.
                schedule:
                    type: string
                    description: |-
                        When it runs, in cron's five fields, minute, hour, day of the month, month and
                         day of the week, such as "0 4 * * *", or @hourly, @daily, @weekly, @monthly or
                         @yearly. Nothing runs more often than once a minute.
                timeZone:
                    type: string
                    description: |-
                        The time zone schedule is in, such as "Europe/Amsterdam". Left out, a change
                         that makes or updates the task sets the install's time zone, from Settings,
                         and UTC where the install has none.
                timeoutSeconds:
                    type: integer
                    description: |-
                        How long a run may take, in seconds, before it's stopped: 600 unless set, at
                         most 86400.
                    format: uint32
                retries:
                    type: integer
                    description: |-
                        How many more times a run that fails or times out tries, a minute apart: 0
                         to 3.
                    format: uint32
                paused:
                    type: boolean
                    description: Keeps it from running on its schedule. Run now still runs it.
                skipMissed:
                    type: boolean
                    description: |-
                        Skips a run missed while its server was off or its agent stopped, rather than
                         running it once when the agent starts.
                displayName:
                    type: string
                    description: What people call it, such as "Nightly sales report". Its name when empty.
            description: |-
                Task is work that runs on a schedule, on each server it's placed on, kind "task"
                 (ADR 0053): a shell command on the server, a command in an app's image, or an
                 HTTP request. Each server's agent keeps its time, so a task runs while the
                 control plane is away.
        TaskApp:
            type: object
            properties:
                service:
                    type: string
                    description: The app, by name, in the task's environment.
                command:
                    type: string
                    description: |-
                        The command, as words split as a shell splits them, run after the app's
                         entrypoint in place of its command, such as "/app/api report sales". It runs
                         without a shell unless it names one.
            description: TaskApp is a command in an app's image.
        TaskAttempt:
            type: object
            properties:
                startTime:
                    type: string
                    format: date-time
                endTime:
                    type: string
                    format: date-time
                exitCode:
                    type: integer
                    description: The exit status of a command. -1 when it was stopped.
                    format: int32
                httpStatus:
                    type: integer
                    description: The HTTP status of a request. 0 when nothing answered.
                    format: int32
                timedOut:
                    type: boolean
                    description: It took longer than the task's timeout, and was stopped.
                responseBytes:
                    type: string
                    description: The size of a request's answer, in bytes.
                outputHeld:
                    type: boolean
                    description: |-
                        Something the command started outlived it and held its output, which was read
                         for a few seconds more, then left as it runs on.
            description: TaskAttempt is one try of a run.
        TaskInfo:
            type: object
            properties:
                id:
                    type: string
                    description: The task's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The task, by kind, environment and name.
                kind:
                    enum:
                        - TASK_KIND_UNSPECIFIED
                        - TASK_KIND_SHELL
                        - TASK_KIND_APP
                        - TASK_KIND_REQUEST
                    type: string
                    description: What it runs.
                    format: enum
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Task'
                    description: What it asks for.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/TaskOnServer'
                    description: How it stands on each server it's placed on, by server name.
            description: TaskInfo is one task, as it's asked for and as it runs.
        TaskOnServer:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID and name.
                serverName:
                    type: string
                connection:
                    enum:
                        - CONNECTION_UNSPECIFIED
                        - CONNECTION_CONNECTED
                        - CONNECTION_UNREACHABLE
                        - CONNECTION_PENDING
                    type: string
                    description: |-
                        Whether its agent is connected. One that isn't runs its tasks all the same,
                         and its runs show once it's back.
                    format: enum
                nextRun:
                    type: string
                    description: When it next runs there. Unset while it's paused.
                    format: date-time
                lastRun:
                    allOf:
                        - $ref: '#/components/schemas/TaskRun'
                    description: Its newest run there, without its output. Unset until it has run.
                recent:
                    type: array
                    items:
                        enum:
                            - TASK_RUN_STATE_UNSPECIFIED
                            - TASK_RUN_STATE_RUNNING
                            - TASK_RUN_STATE_SUCCEEDED
                            - TASK_RUN_STATE_FAILED
                            - TASK_RUN_STATE_TIMED_OUT
                            - TASK_RUN_STATE_INTERRUPTED
                            - TASK_RUN_STATE_NOT_STARTED
                        type: string
                        format: enum
                    description: How its newest runs there ended, newest first, up to 14, without output.
                upcoming:
                    type: array
                    items:
                        type: string
                        format: date-time
                    description: |-
                        When it runs there in the next 24 hours, by its schedule, up to 288 (every 5
                         minutes), for a timeline. Empty while it's paused.
            description: TaskOnServer is how a task stands on one server.
        TaskOutputLine:
            type: object
            properties:
                time:
                    type: string
                    description: When it came.
                    format: date-time
                text:
                    type: string
                    description: The line, without its newline.
            description: |-
                TaskOutputLine is one line a run printed. Lines the agent adds of its own, such
                 as why an attempt stopped, start "Dockwell: ", and its attempts say the same as
                 facts, for a surface to say in its own words.
        TaskRequest:
            type: object
            properties:
                url:
                    type: string
                    description: The URL, http or https.
                method:
                    type: string
                    description: GET unless set, or HEAD or POST, with no body.
                expectStatus:
                    type: integer
                    description: The status it expects, such as 204. Any 2xx unless set.
                    format: uint32
            description: |-
                TaskRequest is an HTTP request to a URL. A run keeps the status, the time it
                 took and the size of the answer, never the body.
        TaskRun:
            type: object
            properties:
                id:
                    type: string
                    description: The run's ID.
                taskId:
                    type: string
                    description: The task's ID.
                serverId:
                    type: string
                    description: The server it ran on, by ID and name.
                serverName:
                    type: string
                state:
                    enum:
                        - TASK_RUN_STATE_UNSPECIFIED
                        - TASK_RUN_STATE_RUNNING
                        - TASK_RUN_STATE_SUCCEEDED
                        - TASK_RUN_STATE_FAILED
                        - TASK_RUN_STATE_TIMED_OUT
                        - TASK_RUN_STATE_INTERRUPTED
                        - TASK_RUN_STATE_NOT_STARTED
                    type: string
                    description: How it is, or how it ended.
                    format: enum
                reason:
                    enum:
                        - TASK_RUN_REASON_UNSPECIFIED
                        - TASK_RUN_REASON_SCHEDULE
                        - TASK_RUN_REASON_BY_HAND
                        - TASK_RUN_REASON_MISSED
                    type: string
                    description: Why it ran.
                    format: enum
                dueTime:
                    type: string
                    description: |-
                        When it was due, and when it started and ended. A run that's still going has
                         no end.
                    format: date-time
                startTime:
                    type: string
                    format: date-time
                endTime:
                    type: string
                    format: date-time
                attempts:
                    type: array
                    items:
                        $ref: '#/components/schemas/TaskAttempt'
                    description: 'Each try, in order: one, and one more for each retry it took.'
                error:
                    type: string
                    description: Why it failed or didn't start, for people. Empty when it succeeded.
                output:
                    type: array
                    items:
                        $ref: '#/components/schemas/TaskOutputLine'
                    description: |-
                        The last 64 KB of what it printed, stdout and stderr together, a line at a
                         time. Only ListTaskRuns has it.
                outputCutBytes:
                    type: string
                    description: How much of what it printed was cut from the start, in bytes.
                skippedSlots:
                    type: integer
                    description: |-
                        How many times its schedule came round while it ran, which ran nothing, as a
                         task's runs never overlap.
                    format: uint32
            description: TaskRun is one run of a task on one server.
        TaskShell:
            type: object
            properties:
                command:
                    type: string
                    description: The command, run with /bin/sh -c, such as "find /var/log/app -mtime +7 -delete".
                workingDir:
                    type: string
                    description: 'The folder it runs in: / unless set.'
            description: TaskShell is a shell command on the server.
        TcpCheck:
            type: object
            properties:
                port:
                    type: integer
                    description: The port the app listens on inside its container, such as 5432.
                    format: uint32
            description: TcpCheck is a connection the agent makes to a container.
        Terminal:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "trm_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                serverId:
                    type: string
                    description: The server it runs on.
                title:
                    type: string
                    description: Who it runs as and where, as a prompt says it, such as "root@hz-1".
                openTime:
                    type: string
                    description: When it opened.
                    format: date-time
                columns:
                    type: integer
                    description: Its width, in characters.
                    format: uint32
                rows:
                    type: integer
                    description: Its height, in lines.
                    format: uint32
                container:
                    type: string
                    description: The container it runs in, by name, for a shell in a container.
            description: Terminal is a shell on a server.
        TerminalEnd:
            type: object
            properties:
                reason:
                    enum:
                        - TERMINAL_END_REASON_UNSPECIFIED
                        - TERMINAL_END_REASON_EXITED
                        - TERMINAL_END_REASON_CLOSED
                        - TERMINAL_END_REASON_DETACHED
                        - TERMINAL_END_REASON_IDLE
                        - TERMINAL_END_REASON_SIGNED_OUT
                        - TERMINAL_END_REASON_AGENT_RESTARTED
                        - TERMINAL_END_REASON_CONTROL_PLANE_RESTARTED
                        - TERMINAL_END_REASON_SERVER_REMOVED
                        - TERMINAL_END_REASON_FAILED
                    type: string
                    description: Why.
                    format: enum
                exitCode:
                    type: integer
                    description: The shell's exit status, when it exited.
                    format: int32
                time:
                    type: string
                    description: When.
                    format: date-time
                message:
                    type: string
                    description: What happened, for people, such as "The shell exited with code 0".
            description: TerminalEnd says how a terminal ended.
        Tmpfs:
            type: object
            properties:
                target:
                    type: string
                    description: Where it appears in the container, as an absolute path.
                size:
                    type: string
                    description: |-
                        The most it may hold, such as "64M", in units of 1024. Empty sets none, so
                         it can take half the server's memory, unless resources.memory stops it first.
            description: Tmpfs is a filesystem held in memory, at a path in a container.
        Token:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The token's ID, such as "tok_01JD6Z3R8M9QF2K7T4XW5BNC0V". It isn't
                         secret, and it names the token in the audit log.
                name:
                    type: string
                    description: What it is for, such as "GitHub Actions deploy".
                hint:
                    type: string
                    description: |-
                        The prefix and the first and last 4 of the secret's 43 random digits,
                         such as "dwt_4f9K…x9Ta", to tell tokens apart and to recognise one in a
                         log. It can't be used to sign in.
                scope:
                    enum:
                        - TOKEN_SCOPE_UNSPECIFIED
                        - TOKEN_SCOPE_READ_ONLY
                        - TOKEN_SCOPE_READ_WRITE
                    type: string
                    description: What it may do.
                    format: enum
                createTime:
                    type: string
                    description: When it was made.
                    format: date-time
                expireTime:
                    type: string
                    description: When it stops working. Unset when it doesn't expire.
                    format: date-time
                lastUsedTime:
                    type: string
                    description: When it was last used. Unset if never.
                    format: date-time
                lastAddress:
                    type: string
                    description: |-
                        The address it was last used from, such as "203.0.113.9". Empty if
                         never.
                grants:
                    type: array
                    items:
                        enum:
                            - TOKEN_GRANT_UNSPECIFIED
                            - TOKEN_GRANT_LOGS
                        type: string
                        format: enum
                    description: What it may do beyond its scope.
            description: Token is an API token, without its secret.
        Totp:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: True when code sign-in is on.
                recoveryCodesLeft:
                    type: integer
                    description: Recovery codes still unused.
                    format: int32
                failedAttempts:
                    type: integer
                    description: Wrong codes in a row since the last good one.
                    format: int32
                lockTime:
                    type: string
                    description: |-
                        When too many wrong codes locked code sign-in. Unset when it isn't locked.
                         Recovery codes still work while it is locked.
                    format: date-time
            description: Totp is the state of signing in with an authenticator app.
        UncheckedServer:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                reason:
                    type: string
                    description: |-
                        Why, as a word an error's reason would be: "server_offline" for an
                         agent that isn't connected, or dropped while it was checked, whose
                         drift is checked once it reconnects; "agent_timeout"; "no_driver";
                         "agent_outdated" for an agent from before a command could name a value,
                         which would read one's command with its values written in, so it reads
                         nothing that names one until it is updated; "spec_unreadable" for a stored spec
                         of what it runs that isn't sealed or can't be opened, which says what to do; or
                         "agent_failed".
                message:
                    type: string
                    description: Why, for people.
            description: UncheckedServer is a server whose drift couldn't be checked.
        UndoChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
            description: UndoChangeRequest names an applied change to undo.
        UndoChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, that puts back what the undone one did.
            description: UndoChangeResponse carries the planned undo.
        UnlockCodeSignInRequest:
            type: object
            properties: {}
            description: UnlockCodeSignInRequest takes no parameters.
        UnlockCodeSignInResponse:
            type: object
            properties: {}
            description: UnlockCodeSignInResponse is empty.
        UpdateWebsiteRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The website, by its project's name or ID.
                website:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: What it serves, whole, as JSON, such as {"proxy":{"url":"https://backend.example.com"}}, or {"proxy":{"port":3000}} for a port on the server.
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says what it changes.
            description: UpdateWebsiteRequest is what a website should serve now.
        UpdateWebsiteResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: UpdateWebsiteResponse carries the planned change.
        UpgradeCatalogInstallRequest:
            type: object
            properties:
                id:
                    type: string
                    description: Its project, by name or ID.
                values:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        A value for each input the newer release adds, by name, as InstallCatalogEntry
                         takes them. What it was installed with carries over, and its secrets stay.
                skipBackup:
                    type: boolean
                    description: Leaves out the backup of its volumes that comes first, and the plan says so.
            description: UpgradeCatalogInstallRequest names an install to upgrade.
        UpgradeCatalogInstallResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: UpgradeCatalogInstallResponse carries the planned change.
        User:
            type: object
            properties:
                id:
                    type: string
                    description: The user's ID, such as "usr_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                name:
                    type: string
                    description: What they are called, such as "Mira Chen".
                email:
                    type: string
                    description: Their email, which signs in with a code.
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ROLE_OWNER
                    type: string
                    description: What they may do.
                    format: enum
                createTime:
                    type: string
                    description: When the account was made.
                    format: date-time
            description: User is a person who signs in to the panel.
        Variable:
            type: object
            properties:
                value:
                    type: string
                    description: The value.
            description: |-
                Variable is a value of an environment that its services use, such as
                 LOG_LEVEL=info. It isn't secret: plans, history and the panel show it.
                 Keep anything that is in a Secret.
        VariableUse:
            type: object
            properties:
                serviceId:
                    type: string
                    description: The service's ID.
                service:
                    type: string
                    description: The service's name, such as "api".
                name:
                    type: string
                    description: The name the service sees it as, such as "DATABASE_URL".
            description: VariableUse is a service that uses a variable or secret.
        Volume:
            type: object
            properties:
                driver:
                    type: string
                    description: 'The volume driver: "local" unless set.'
                options:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The driver's options, such as type, device and o for an NFS mount. They
                         may hold secrets, as a CIFS mount's password goes in o. The local driver
                         takes type none with bind, nfs, nfs4, cifs or tmpfs.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: Labels on the volume, for tools that read them.
            description: |-
                Volume is a Docker volume in an environment, which its services mount
                 by name, as a Compose file's volumes. Deleting one destroys its data,
                 though Dockwell keeps it for 7 days first. Docker can't change a volume,
                 so its spec can't change once it is made.
        Web:
            type: object
            properties:
                service:
                    type: string
                    description: The service, by its name in the entry's Compose file, such as "adminer".
            description: Web says what a person opens once an entry is installed.
        Website:
            type: object
            properties:
                proxy:
                    allOf:
                        - $ref: '#/components/schemas/WebsiteProxy'
                    description: Sends its requests on to a URL, or to a port on the server.
                folder:
                    allOf:
                        - $ref: '#/components/schemas/WebsiteFolder'
                    description: Serves the files in a folder on the server, as they are.
                php:
                    allOf:
                        - $ref: '#/components/schemas/WebsitePhp'
                    description: Runs the PHP in a folder on the server, and serves its other files.
            description: Website is what a website serves at its domain, as a person chose it.
        WebsiteFolder:
            type: object
            properties:
                root:
                    type: string
                    description: |-
                        The folder, as an absolute path on the server, such as "/var/www/blog". Its
                         web server reads it as nobody's user, so what it serves must be readable by
                         everyone. Docker makes a folder that isn't there, empty and owned by root.
                index:
                    type: array
                    items:
                        type: string
                    description: |-
                        The files a request for a folder gets, the first there is, such as
                         "index.html". Empty takes index.html, then index.htm.
                singlePageApp:
                    type: boolean
                    description: |-
                        Answers a path with no file of its own with the index at the folder's top, as
                         an app that routes in the browser needs, rather than with a 404.
                owner:
                    type: string
                    description: |-
                        Who owns the folder Dockwell makes when it isn't there, as "uid:gid", such as
                         "1000:1000", so you can put the site's files in it as yourself. Empty leaves
                         it to Docker, which makes it root's. A folder that's there keeps its owner.
            description: |-
                WebsiteFolder serves the files in a folder on the server, as they are. Its web
                 server mounts the folder read-only, so a person approves it, and edits to the
                 files show at once, with nothing to deploy.
        WebsiteInfo:
            type: object
            properties:
                id:
                    type: string
                    description: Its project's ID, such as "prj_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                name:
                    type: string
                    description: Its project's name, such as "blog-example-com".
                domain:
                    type: string
                    description: |-
                        The domain it answers at, such as "blog.example.com". Empty once its route
                         has gone.
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Website'
                    description: What it serves.
                environmentId:
                    type: string
                    description: The environment its route and services are in, by ID.
                serviceId:
                    type: string
                    description: |-
                        The service that serves it, by ID. Empty for a website that sends to a port
                         on the server, which needs none.
                routeId:
                    type: string
                    description: Its route, by ID. Empty once it has gone.
                updateTime:
                    type: string
                    description: When what serves it last changed.
                    format: date-time
                serverId:
                    type: string
                    description: The server it runs on, by ID. Empty before it's placed.
                serverName:
                    type: string
                    description: That server's name, such as "hz-1".
                phpServiceId:
                    type: string
                    description: The service that runs its PHP, by ID, for a PHP website. Empty for any other.
                config:
                    type: string
                    description: |-
                        The config its web server runs, as its service's spec has it: what's served,
                         whatever Project.website says. Empty for a website with no web server.
                         Numbered apart, as open work adds to this message.
                configDiffers:
                    type: boolean
                    description: |-
                        Whether config differs from what the website's settings write, as when a change
                         edited its web server outside WebsiteService. UpdateWebsite with its settings
                         puts them back in step.
                reach:
                    allOf:
                        - $ref: '#/components/schemas/WebsiteReach'
                    description: |-
                        Whether what it sends to answers, as its server last found by asking, apart
                         from any deploy. Unset until a server has asked, as for one not connected.
                phpImage:
                    type: string
                    description: |-
                        The image its PHP runs, pinned by digest, for a PHP website: its runtime's, or
                         an older build of it, which UpdateWebsite with its settings moves to the
                         runtime's.
            description: WebsiteInfo is one website.
        WebsitePhp:
            type: object
            properties:
                root:
                    type: string
                    description: The folder, as an absolute path on the server, such as "/var/www/shop".
                version:
                    type: string
                    description: |-
                        The PHP version, such as "8.3": one Dockwell offers, as ListWebsiteRuntimes
                         says. Empty takes the newest.
                index:
                    type: array
                    items:
                        type: string
                    description: |-
                        The files a request for a folder gets, the first there is. Empty takes
                         index.php, then index.html.
                filesOnly:
                    type: boolean
                    description: |-
                        Answers a path with no file of its own with a 404, rather than sending it to
                         the folder's index.php, as WordPress, Laravel and most PHP apps want.
                uploadLimitMb:
                    type: integer
                    description: |-
                        The most a request may send, in MiB, as PHP's M counts, such as an upload: what
                         PHP takes and what the web server lets through. 0 takes 64.
                    format: uint32
                user:
                    type: string
                    description: |-
                        Who PHP runs as, as "uid:gid", such as "1000:1000": the folder's owner, so PHP
                         can write in it, and what it writes, such as uploads, keeps its owner. A number
                         alone is taken for both. Empty is www-data, "82:82". Never root's, nor root's
                         group. PHP-FPM's master runs as it too. A folder that isn't there is made as
                         its.
            description: |-
                WebsitePhp runs the PHP in a folder on the server with PHP-FPM, of the version
                 chosen, and serves its other files as they are. Its web server mounts the folder
                 read-only and PHP read-write, so a person approves it.
        WebsiteProxy:
            type: object
            properties:
                url:
                    type: string
                    description: |-
                        Where to send them, such as "https://backend.example.com" or
                         "http://10.0.0.5:8080/app": http or https, a host, and a port and a path if
                         it needs them, with no query. A path goes in front of each request's own.
                         It's reached from a container, as any app reaches the internet, so it
                         can't be the server's own loopback: give port for that.
                port:
                    type: integer
                    description: |-
                        A port on the server itself, such as 3000, in place of url. Whatever listens
                         there sees every visitor as local, so a person approves it.
                    format: uint32
                sendTargetHost:
                    type: boolean
                    description: |-
                        Sends the url's own host as the Host header, in place of the website's
                         domain, as a target that serves several names needs, such as another site
                         over HTTPS. For a url only.
            description: |-
                WebsiteProxy sends a website's requests on, to a URL or to a port on the
                 server itself. Give one of url and port.
        WebsiteReach:
            type: object
            properties:
                answered:
                    type: boolean
                    description: |-
                        Whether it answered: a port that took a connection, or a URL that gave an HTTP
                         answer below 500.
                said:
                    type: string
                    description: |-
                        What it said, in a line, such as "200 OK" or "503 Service Unavailable", or why
                         nothing did, such as "connection refused".
                checkTime:
                    type: string
                    description: When the server asked.
                    format: date-time
            description: |-
                WebsiteReach is whether what a website sends to answers, from its server: the
                 port, as the ingress dials it, or the URL, as its web server sends to it.
        WebsiteRuntime:
            type: object
            properties:
                language:
                    type: string
                    description: The language, such as "PHP".
                version:
                    type: string
                    description: The version a website names, such as "8.3".
                release:
                    type: string
                    description: The release the image has, such as "8.3.36".
                image:
                    type: string
                    description: The image, pinned by digest.
                extensions:
                    type: array
                    items:
                        type: string
                    description: The extensions it has beyond the language's own, such as "mysqli".
            description: WebsiteRuntime is one version of a language a website can run.
        WriteTerminalRequest:
            type: object
            properties:
                terminalId:
                    type: string
                    description: The terminal's ID.
                offset:
                    type: string
                    description: Where data starts in all that's been typed into the terminal.
                data:
                    type: string
                    description: What's typed, 64 KiB at most.
                    format: bytes
                columns:
                    type: integer
                    description: The terminal's width, to change it. 0 leaves it.
                    format: uint32
                rows:
                    type: integer
                    description: Its height, to change it. 0 leaves it.
                    format: uint32
            description: WriteTerminalRequest is what's typed, and the terminal's size.
        WriteTerminalResponse:
            type: object
            properties:
                offset:
                    type: string
                    description: |-
                        How much of what's been typed the terminal has taken, in all. Short of the
                         write's end when it hadn't room for all of it.
            description: WriteTerminalResponse says how much the terminal has taken.
tags:
    - name: AuditService
      description: |-
        AuditService reads the audit log: every event Dockwell records of who did
         what, from where, as it was recorded. That includes what the timeline leaves
         out: refusals, such as a wrong code or a refused token, a token's first use
         from an address, signing out, and the install's own setup. See
         docs/adr/0047-the-audit-log-for-a-person.md.

         Its events carry the words Dockwell wrote for people, which name the
         addresses people signed in from and were refused from, so only a person
         signed in reads it, never an API token.
    - name: AuthService
      description: |-
        AuthService claims a new install, signs people in and out, and manages how
         they sign in: passkeys, an authenticator app with recovery codes, and
         sessions. See docs/adr/0011-claim-and-sign-in.md.

         GetAuthState, the claim calls and the sign-in calls work without a session.
         Every other call needs one, carried in the session cookie the sign-in calls
         set. No API token can call this service: how you sign in is changed only by
         signing in (docs/adr/0016-scoped-api-tokens.md).

         Passkey ceremonies take two calls. Begin returns WebAuthn options as JSON
         (PublicKeyCredentialCreationOptionsJSON or
         PublicKeyCredentialRequestOptionsJSON, WebAuthn Level 3) and a ceremony ID;
         Finish takes that ID and the browser's credential as JSON
         (RegistrationResponseJSON or AuthenticationResponseJSON). A ceremony works
         once and expires after 5 minutes.

         A failed call's error metadata names the reason under "Dockwell-Error", such
         as "code_rejected" or "claim_link_rejected", so clients can explain it in
         their own words; a slowed-down one also carries "Retry-After" in seconds.
         A call to any service refused for want of a session names one too:
         "unauthenticated" when it came with no session, and "session_ended" when
         its session cookie no longer works or a stream's session ended while it
         was open. A browser's request from another origin gets "origin". A call
         with an API token gets "token_rejected" when the token is unknown, revoked
         or expired, "token_scope" when its scope doesn't cover the call, and
         "needs_session" when no token may make it.
    - name: BackupService
      description: |-
        BackupService is an app's volumes and databases, backed up on the server that
         has them. Taking a backup is an event: it changes no desired state, so it makes
         no revision, and a failed one shows on the timeline. Restoring one is a change
         with a plan, which says what it replaces and what stops, and which only a person
         can apply. See docs/adr/0033-backups-of-volumes-and-databases.md.

         A backup holds what its app stored, secrets among them, so nothing here gives
         anyone its bytes.
    - name: CatalogService
      description: |-
        CatalogService lists the apps you can install, and plans installing one as a
         project of its own: a Compose file with sensible ports and generated
         passwords, sealed, through the same plan as any other change. Nothing runs
         until you apply it. See
         docs/adr/0029-a-catalog-format-fed-from-other-catalogs.md.
    - name: ChangeService
      description: |-
        ChangeService is the one way to change managed state, for every kind of
         resource: projects, environments, services, volumes, networks, routes,
         containers and firewall rules alike. You propose edits and get a plan back; applying the plan writes
         immutable revisions and runs its steps on the servers; undoing makes a new
         plan that puts things back. See docs/adr/0009-resources-revisions-and-plans.md
         and docs/adr/0017-the-change-api-and-the-agent-stream.md.

         Plans never show a secret: a field that may hold one says that it changed,
         never what it holds, and no response carries a spec.

         WatchChange streams, so it has no REST path. A REST client follows a
         change by polling GET /v1/changes/{id}, which carries the same progress,
         or opens the stream with Connect, gRPC or gRPC-Web, with the same
         credentials.
    - name: ComposeService
      description: |-
        ComposeService turns a Docker Compose file into a project's services,
         volumes and networks, and any of them back into one. Each file gets a
         project of its own, so two files with a service of one name run side by
         side, on networks of their own, as they do under docker compose. An
         environment is one Compose project: its containers carry the labels Docker
         Compose gives its own, so docker compose sees them, and an exported file
         runs the same with docker compose alone (PRD principle 6). See
         docs/adr/0021-the-docker-driver.md and docs/adr/0026-the-app-screens.md.
    - name: ContainerService
      description: |-
        ContainerService reads the containers on a server that Dockwell didn't make:
         those that were there before it, and those someone runs by hand or with a
         Compose file of their own. Reading them changes nothing, and nothing here
         comes from a container's environment, which may hold secrets, or its labels
         and command, which may too. See docs/adr/0031-containers-dockwell-didnt-make.md.

         A service's containers aren't here: they are the service's. ReadLogs and
         WatchLogs read what one of these prints, given its server.
    - name: DatabaseService
      description: |-
        DatabaseService is the services that run a database Dockwell knows:
         PostgreSQL, MySQL, MariaDB, Redis and Valkey, from their official images,
         whether Dockwell made them or took them on. A database is a service, so it
         changes as any service does, by a change with a plan. What this adds is what
         the database itself says, read in its own container with its own tools, which
         sign in with what its environment already holds, so no password passes
         through Dockwell. See docs/adr/0038-databases.md.

         Nothing here carries a password, nor a value of a database's environment.
    - name: DomainService
      description: |-
        DomainService says where the domains of your routes stand: what each sends
         where, and whether its certificate is pending, issued or failed, with what
         to do when it failed. Change routes with ChangeService, as kind "route". See
         docs/adr/0024-the-caddy-ingress-driver.md.
    - name: EventService
      description: |-
        EventService is the timeline: every change to managed state, with who
         made it and from where, beside what servers and people did that belongs
         with it, such as a server joining or someone signing in. See
         docs/adr/0020-the-event-timeline.md.

         A change is one event, which moves on as the change does: planned, then
         applying, then applied or failed. Rollbacks and undos are changes of
         their own, each naming the change it reverts. A discarded change isn't
         on the timeline, and nor is the change that set up an install's default
         project and environment. Every other event comes from the audit log, as
         it was recorded.

         Events carry no secret, no spec and no address.

         WatchEvents streams, so it has no REST path. A REST client polls GET
         /v1/events, or opens the stream with Connect, gRPC or gRPC-Web, with the
         same credentials.
    - name: FileService
      description: |-
        FileService browses, reads and saves the files on a server, through its
         agent. Files on a server aren't managed state, so nothing here is a revision
         or has a plan, and a save can't be undone. See
         docs/adr/0032-files-on-a-server.md.

         Every method needs a signed-in session: no API token can call them, whatever
         its scope. The agent refuses what holds Dockwell's keys, secrets' values and
         the server's own credentials for everyone, with the reason "file_refused":
         docs/security/files.md lists them.
    - name: HealthService
      description: |-
        HealthService says how services are, as far as anything checked, from what
         each server's agent last said. It never claims health nobody checked: a
         service with no check is HEALTH_STATE_NO_CHECK, and a server whose agent
         isn't connected is HEALTH_STATE_UNKNOWN, with what it last said marked stale.
         See docs/adr/0027-health-checks-rollouts-and-rollback.md.

         Reading it needs the read scope alone, as what a check printed is cut short
         and has what the container's environment holds masked. It isn't a log.
    - name: ImportService
      description: |-
        ImportService moves what another panel runs on a server into Dockwell: what
         can run as it is is taken on with no restart, what can't is made again, and
         the rest is left with why. Each import is a plan a person applies. See
         docs/adr/0056-importing-a-1panel-server.md.
    - name: LogService
      description: |-
        LogService reads what a service's containers print: live, or from what
         each server still has. See docs/adr/0025-logs-per-deploy.md.

         Each server's agent reads Docker's logs as they are asked for, and log
         lines never sit in the control plane's store. A server keeps what Docker
         keeps for a running or stopped container, and the logs of the last failed
         and the last replaced container of each service, within a disk budget.

         Logs often hold secrets and personal data that apps print, and Dockwell
         doesn't redact them. So an API token reads them only with the grant
         TOKEN_GRANT_LOGS, and reading them is on record in the audit log.

         WatchLogs streams, so it has no REST path. A REST client pages through
         ReadLogs, or opens the stream with Connect, gRPC or gRPC-Web, with the
         same credentials.
    - name: MemberService
      description: |-
        MemberService says who can sign in to the install, with their role and how
         they sign in. Today that is one person, the owner, who claimed the install:
         inviting others, and roles beyond the owner, come later. See
         docs/adr/0048-members-as-far-as-one-owner-goes.md.

         It names people and their emails, so only a person signed in reads it, never
         an API token. How each person signs in is theirs: everyone sees the kinds of
         sign-in each member has, and only the person asking sees their own passkeys'
         addresses, codes and browsers.
    - name: ProcessService
      description: |-
        ProcessService shows what runs on a server, process by process, and ends one.
         A server's agent reads its processes only while someone watches them. See
         docs/adr/0041-processes-on-a-server.md.

         Every method needs a signed-in session: no API token can call them, whatever
         its scope, as a process's command line can hold what was typed with it, a
         password included, and ending one is as much as root on the server.
    - name: ResourceService
      description: |-
        ResourceService reads the resources Dockwell manages: projects,
         environments, services, volumes, networks, routes, containers and firewall
         rules.
         Change them with ChangeService.

         It names resources and says where they live, and never carries a spec,
         which may hold secrets. A spec's display_name, which never does, is the
         one exception.
    - name: ServerService
      description: |-
        ServerService lists the servers Dockwell manages and streams their live
         state, as each server's agent reports it.

         WatchServers has no REST path: REST has no way to stream messages, so a
         REST client polls ListServers or GetServer instead, and anything that wants
         the stream opens it with Connect, gRPC or gRPC-Web. See
         docs/adr/0015-rest-and-openapi-from-the-schema.md.
    - name: ServiceService
      description: |-
        ServiceService says what each service runs, where, and how its latest
         deploy went, and plans what is done to one service as a whole: another
         image, or an earlier revision. Each plan is a change, ready to apply or
         discard, as ProposeChange makes. See docs/adr/0026-the-app-screens.md.

         It blanks a spec's sensitive values, so an environment variable shows by name
         alone, and what it uses of its environment's variables and secrets by name.
         What isn't marked sensitive it shows, as seeing a command is useful, with the
         names of the values it uses in it (Container.references). A Compose file that
         writes a variable's value in a label has it read back from there, which
         importing the file says (ExposedVariable).
    - name: SettingsService
      description: |-
        SettingsService reads and changes the install's own settings: what it's
         called, the time zone its schedules start in, and how its panel is served.
         It also says what the control plane is, and how it's doing.

         None of these is managed state: they change what Dockwell says and suggests,
         not what runs on a server, so a change needs no plan. Each is on the activity
         log, with what it replaced. How the panel is served comes from how dockwell
         run was started, and changes there. See docs/adr/0042-the-installs-settings.md.
    - name: SystemService
      description: |-
        SystemService describes the Dockwell install itself. It needs no sign-in, so
         the CLI, agents and other tools can check what they are talking to first.
    - name: TaskService
      description: |-
        TaskService is work that runs on a schedule: a shell command on a server, a
         command in an app's image, or an HTTP request. A task is a resource of kind
         "task", so making, changing, pausing and deleting one is a change with a plan,
         through ChangeService. Each server's agent keeps its own tasks' time, so they run
         while the control plane is away, and the control plane keeps what each run
         did. See docs/adr/0053-scheduled-tasks.md.
    - name: TerminalService
      description: |-
        TerminalService opens a shell on a server, through its agent, and carries
         what's typed and what it prints. A server's shell is root's, so it's as good
         as root: see docs/adr/0037-a-terminal-on-a-server.md and
         docs/security/terminal.md.

         Every method needs a signed-in session: no API token can call them, whatever
         its scope. A terminal belongs to the person and the session that opened it,
         and nobody else can reach it. Opening one takes a passkey, just now. Opening
         and closing one are on record in Activity, and what's typed and printed is
         never recorded.

         A terminal runs on its server apart from any connection, so a client that
         loses its stream attaches again from the last byte it had, and misses
         nothing that fits in what the server keeps. AttachTerminal streams, so it
         has no REST path.
    - name: TokenService
      description: |-
        TokenService manages API tokens: secrets for scripts, the CLI and
         integrations, each acting for the person who made it, within a scope. See
         docs/adr/0016-scoped-api-tokens.md.

         Send a token in the Authorization header, as "Bearer dwt_…", with REST,
         Connect, gRPC or gRPC-Web alike. A read-only token may call the methods
         whose effect is EFFECT_READ; a read-write token may also call EFFECT_PLAN
         and EFFECT_APPLY methods. No token may call an EFFECT_DESTRUCTIVE method,
         AuthService, or this service: they need a signed-in session.
    - name: UpdateService
      description: |-
        UpdateService says which package updates wait on a server, through its
         agent, which reads them with the server's own package manager: apt, dnf or
         apk. Nothing is read while nobody asks, and a server's package lists are
         refreshed at most daily. See docs/adr/0043-package-updates-on-a-server.md.
    - name: VariableService
      description: |-
        VariableService reads an environment's variables and secrets, and reveals
         a secret's value to the person who asks, once they confirm it with a
         passkey. Change them with ChangeService, as edits of kind "variable" or
         "secret": each change is a plan, which lists every service that restarts
         with the new value. See docs/adr/0022-secrets-encrypted-at-rest.md.

         Services use variables and secrets by reference. Using one, which is an
         edit of the service, doesn't let anyone read it: no response carries a
         secret's value but RevealSecret's, which needs a signed-in session, and
         no API token can call it.
    - name: WebsiteService
      description: |-
        WebsiteService lists your websites, and plans making one, changing what it
         serves and deleting it, each as a change to apply or discard. A website is a
         project of its own: Dockwell writes its route, and the service that serves
         it, from what you choose, such as a URL to send its requests to. Its domain
         gets its certificate as any route's does, or none behind a tunnel or a proxy
         that ends TLS. See docs/adr/0039-websites-as-projects-of-their-own.md.

                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/backups/{id}:
        get:
            tags:
                - BackupService
            description: GetBackup returns one backup, with how far one under way has got.
            operationId: BackupService_GetBackup
            parameters:
                - name: id
                  in: path
                  description: The backup's ID.
                  required: true

            operationId: BackupService_CreateBackup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateBackupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:

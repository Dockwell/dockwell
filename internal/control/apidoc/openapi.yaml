components:
    schemas:
        Actor:
            type: object
            properties:
                kind:
                    enum:
                        - ACTOR_KIND_UNSPECIFIED
                        - ACTOR_KIND_USER
                        - ACTOR_KIND_TOKEN
                        - ACTOR_KIND_DOCKWELL
                        - ACTOR_KIND_SERVER
                        - ACTOR_KIND_SHELL
                    type: string
                    description: What kind of actor it is.
                    format: enum
                id:
                    type: string
                    description: |-
                        The user's, token's or server's ID, or a shell account's name, such as
                         "mira@hz-1". Empty for Dockwell.
                name:
                    type: string
                    description: |-
                        The name to show, such as "Mira Chen", a token's name, such as
                         "GitHub Actions deploy", or a server's, such as "hz-2".
            description: Actor is who made a change, or applied it, or did what an event records.
        AddServicePortRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                hostPort:
                    type: integer
                    description: The port on the server, such as 8080.
                    format: uint32
                containerPort:
                    type: integer
                    description: The port in the app, such as 80.
                    format: uint32
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP when unset.
                    format: enum
                hostIp:
                    type: string
                    description: |-
                        The server's address to publish on, such as "127.0.0.1". Empty publishes
                         on every address.
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says which port it adds.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: AddServicePortRequest names a service and the port to publish.
        AddServicePortResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: AddServicePortResponse carries the planned change.
        AdoptDriftRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server whose version to keep.
                resourceId:
                    type: string
                    description: The resource's ID.
            description: AdoptDriftRequest names a drifted resource to keep as it is.
        AdoptDriftResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, whose revision matches what the server has.
            description: AdoptDriftResponse carries the planned adoption.
        ApplyChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
                fingerprint:
                    type: string
                    description: |-
                        The fingerprint of the plan you reviewed. When set, the change applies
                         only if its plan has it. A plan that destroys data or may cut off
                         access needs it.
            description: ApplyChangeRequest names a planned change to apply.
        ApplyChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change: applying, with its steps queued; or applied, when it had
                         no steps to run.
            description: ApplyChangeResponse carries the change as it starts applying.
        BeginAddPasskeyRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for adding a passkey. Leave it out within
                         10 minutes of signing in with a code, a recovery code or a link from
                         dockwell recover.
            description: BeginAddPasskeyRequest confirms adding a passkey.
        BeginAddPasskeyResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishAddPasskey.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialCreationOptionsJSON.
            description: BeginAddPasskeyResponse carries the options for creating the passkey.
        BeginClaimRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the claim link.
                name:
                    type: string
                    description: The owner's name, such as "Mira Chen".
                email:
                    type: string
                    description: The owner's email.
            description: BeginClaimRequest names the owner.
        BeginClaimResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishClaim.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialCreationOptionsJSON.
            description: BeginClaimResponse carries the options for creating the passkey.
        BeginPasskeySignInRequest:
            type: object
            properties: {}
            description: |-
                BeginPasskeySignInRequest takes no parameters: the browser offers the
                 passkeys it holds for this address.
        BeginPasskeySignInResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishPasskeySignIn.
                optionsJson:
                    type: string
                    description: PublicKeyCredentialRequestOptionsJSON.
            description: BeginPasskeySignInResponse carries the options for the passkey assertion.
        BeginStepUpRequest:
            type: object
            properties:
                action:
                    enum:
                        - STEP_UP_ACTION_UNSPECIFIED
                        - STEP_UP_ACTION_REVEAL_SECRET
                        - STEP_UP_ACTION_ADD_PASSKEY
                        - STEP_UP_ACTION_REMOVE_PASSKEY
                        - STEP_UP_ACTION_SET_UP_CODES
                        - STEP_UP_ACTION_DISABLE_CODES
                        - STEP_UP_ACTION_REGENERATE_RECOVERY_CODES
                        - STEP_UP_ACTION_CREATE_TOKEN
                    type: string
                    description: The action.
                    format: enum
                target:
                    type: string
                    description: |-
                        What it acts on: a secret's ID to reveal it, a passkey's to remove it.
                         Leave it out for an action on your own account, such as adding a
                         passkey.
            description: BeginStepUpRequest says what the passkey confirms.
        BeginStepUpResponse:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: Pass back to FinishStepUp.
                optionsJson:
                    type: string
                    description: |-
                        PublicKeyCredentialRequestOptionsJSON, which allows only your passkeys
                         for this address.
            description: BeginStepUpResponse carries the options for the passkey's assertion.
        BeginTotpSetupRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for setting up code sign-in.
            description: BeginTotpSetupRequest confirms setting up code sign-in.
        BeginTotpSetupResponse:
            type: object
            properties:
                secret:
                    type: string
                    description: The secret in base32, for typing into an authenticator app.
                uri:
                    type: string
                    description: The otpauth:// URI, for a QR code.
            description: BeginTotpSetupResponse carries the new secret.
        BuildInfo:
            type: object
            properties:
                version:
                    type: string
                    description: |-
                        Semantic version such as "v0.4.0", a Go pseudo-version for builds
                         between releases such as "v0.4.1-0.20261103214000-3f2a9c1d4e5b", or
                         "devel" when the build carries no version at all. Only the first two
                         parse as semver.
                commit:
                    type: string
                    description: Full commit hash the binary was built from. Empty when unknown.
                commitTime:
                    type: string
                    description: Time of that commit. Unset when unknown.
                    format: date-time
                modified:
                    type: boolean
                    description: True when the working tree had uncommitted changes at build time.
                goVersion:
                    type: string
                    description: Go toolchain that built the binary, such as "go1.27.3".
                platform:
                    type: string
                    description: Target operating system and architecture, such as "linux/amd64".
                edition:
                    enum:
                        - BUILD_EDITION_UNSPECIFIED
                        - BUILD_EDITION_FULL
                        - BUILD_EDITION_AGENT
                    type: string
                    description: |-
                        Which of the two builds of dockwell this is. Unset in builds made before
                         there were two, which are all the full build.
                    format: enum
            description: BuildInfo identifies one build of the dockwell binary.
        CancelTotpSetupRequest:
            type: object
            properties: {}
            description: CancelTotpSetupRequest takes nothing.
        CancelTotpSetupResponse:
            type: object
            properties: {}
            description: CancelTotpSetupResponse is empty.
        Certificate:
            type: object
            properties:
                state:
                    enum:
                        - CERTIFICATE_STATE_UNSPECIFIED
                        - CERTIFICATE_STATE_PENDING
                        - CERTIFICATE_STATE_ISSUED
                        - CERTIFICATE_STATE_FAILED
                        - CERTIFICATE_STATE_NONE
                    type: string
                    description: Where it stands.
                    format: enum
                problem:
                    enum:
                        - CERTIFICATE_PROBLEM_UNSPECIFIED
                        - CERTIFICATE_PROBLEM_DNS
                        - CERTIFICATE_PROBLEM_CONNECTION
                        - CERTIFICATE_PROBLEM_WRONG_SERVER
                        - CERTIFICATE_PROBLEM_RATE_LIMITED
                        - CERTIFICATE_PROBLEM_CAA
                        - CERTIFICATE_PROBLEM_REFUSED
                        - CERTIFICATE_PROBLEM_OTHER
                        - CERTIFICATE_PROBLEM_CANT_REACH_CA
                    type: string
                    description: |-
                        Why it failed, or why renewing it is failing while an issued one still
                         serves. Unset otherwise.
                    format: enum
                message:
                    type: string
                    description: |-
                        For people: what is happening or what went wrong, what follows, and how
                         to fix it. Dockwell keeps trying a failed certificate by itself.
                expireTime:
                    type: string
                    description: When an issued certificate expires. Renewing it is automatic.
                    format: date-time
            description: Certificate is where a domain's certificate stands on a server.
        Change:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                summary:
                    type: string
                    description: What it is for, such as "Add a staging environment".
                state:
                    enum:
                        - CHANGE_STATE_UNSPECIFIED
                        - CHANGE_STATE_PLANNED
                        - CHANGE_STATE_APPLYING
                        - CHANGE_STATE_APPLIED
                        - CHANGE_STATE_FAILED
                        - CHANGE_STATE_DISCARDED
                    type: string
                    description: Where it is.
                    format: enum
                proposedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who proposed it.
                proposedVia:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it was proposed from.
                    format: enum
                createTime:
                    type: string
                    description: When it was proposed.
                    format: date-time
                plan:
                    allOf:
                        - $ref: '#/components/schemas/Plan'
                    description: |-
                        What applying does, as it was reviewed. It never changes. A rollback,
                         which nobody reviews, has the plan it ran with. ListChanges gives it in
                         brief, without resources and servers.
                reverts:
                    type: string
                    description: The change this one undoes or rolls back, if any.
                rollback:
                    type: boolean
                    description: True for a change Dockwell made to roll back a failed one.
                appliedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who applied it. Unset until it is applied.
                appliedVia:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it was applied from. Unset until it is applied.
                    format: enum
                applyTime:
                    type: string
                    description: When it started applying. Unset until then.
                    format: date-time
                undoDeadline:
                    type: string
                    description: Until when UndoChange works, once it is applied. Unset otherwise.
                    format: date-time
                error:
                    type: string
                    description: Why it failed, when it did.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/StepProgress'
                    description: |-
                        Each step of the plan with its progress, once it is applying: servers
                         in plan order, and on each the steps in the order they run.
                rolledBackBy:
                    type: string
                    description: |-
                        The change that rolled this one back after it failed, if any. It may
                         still be applying, as when it waits for a server to reconnect.
                undoneBy:
                    type: string
                    description: The applied change that undid this one, if any.
            description: |-
                Change is one action's worth of edits to managed resources: planned,
                 then applied, failed or discarded.
        CheckClaimRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the claim link, the part after "#".
            description: CheckClaimRequest carries a claim link's token.
        CheckClaimResponse:
            type: object
            properties:
                server:
                    allOf:
                        - $ref: '#/components/schemas/Server'
                    description: The control server, as its agent last reported it.
                publicAddress:
                    type: string
                    description: |-
                        This server's public IP address, such as "203.0.113.7", for pointing a
                         domain at: an A record, or AAAA for an IPv6 address. Empty when the
                         server doesn't know one, as behind NAT, where its own address is private.
                expireTime:
                    type: string
                    description: When the link stops working.
                    format: date-time
            description: CheckClaimResponse describes the server a valid claim link claims.
        CheckComposeRequest:
            type: object
            properties:
                compose:
                    type: string
                    description: The Compose file, as YAML, as ImportCompose takes it.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: Values for the variables the file uses, as ImportCompose takes them.
                env:
                    type: string
                    description: |-
                        The .env file beside the Compose file, as ImportCompose takes it. A variable
                         it gives needs no other value.
                directory:
                    type: string
                    description: The directory the file is in on the servers, as ImportCompose takes it.
            description: CheckComposeRequest is a Compose file to read.
        CheckComposeResponse:
            type: object
            properties:
                refusal:
                    allOf:
                        - $ref: '#/components/schemas/ComposeRefusal'
                    description: |-
                        Why ImportCompose would refuse the file, when it would: the first thing
                         in the way. Fix it and check again for the next. Unset when it would take
                         it. What it would refuse whatever its variables hold comes before a variable
                         with no value, so no one types a secret for a file it then refuses.
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ComposeVariable'
                    description: |-
                        The variables the file uses, whether or not the file can be read
                         further than that.
                services:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceInfo'
                    description: |-
                        The services it would make, in the order it would make them, with
                         sensitive values blanked. Empty when it is refused.
                volumes:
                    type: array
                    items:
                        type: string
                    description: The volumes it would make, by name. Empty when it is refused.
                networks:
                    type: array
                    items:
                        type: string
                    description: The networks it would make, by name. Empty when it is refused.
                name:
                    type: string
                    description: |-
                        The project the file names for itself, for a form to fill in, whether or
                         not the file can be read further than that: its name:, or, for a file
                         exported from an environment here, that environment's project. Empty when
                         it names none, or names itself with a variable that has no value yet.
                exposedVariables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExposedVariable'
                    description: |-
                        Where the file writes a variable's value in plain sight, whether or not one
                         is given, so a form can say so before anyone types a secret. It lists 100
                         at most.
                moreExposed:
                    type: boolean
                    description: True when the file writes more than exposed_variables lists.
            description: CheckComposeResponse says what a Compose file would make, or why it can't.
        ComposeRefusal:
            type: object
            properties:
                message:
                    type: string
                    description: What is wrong and how to fix it, for people.
                line:
                    type: integer
                    description: |-
                        The line of the file it is about, from 1. 0 when it is about the file
                         as a whole.
                    format: int32
                endLine:
                    type: integer
                    description: |-
                        The last line it is about, where it is about more than one, as a YAML parser
                         can't always tell which. Otherwise the same as line.
                    format: int32
            description: ComposeRefusal is why a Compose file can't be imported.
        ComposeVariable:
            type: object
            properties:
                name:
                    type: string
                    description: Its name, such as "TAG".
                required:
                    type: boolean
                    description: True when it needs a value, as the file gives it no default.
            description: ComposeVariable is a variable a Compose file uses, such as ${TAG}.
        ConfirmTotpSetupRequest:
            type: object
            properties:
                code:
                    type: string
                    description: A 6-digit code from the authenticator app.
            description: ConfirmTotpSetupRequest carries a code from the new secret.
        ConfirmTotpSetupResponse:
            type: object
            properties:
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: Ten one-time recovery codes. They are shown only now; store them safely.
            description: ConfirmTotpSetupResponse carries the recovery codes.
        Container:
            type: object
            properties:
                image:
                    type: string
                    description: The image to run, such as "ghcr.io/acme/web:1.4.2".
                command:
                    type: array
                    items:
                        type: string
                    description: Overrides the image's command when set.
                env:
                    type: object
                    additionalProperties:
                        type: string
                    description: Environment variables, which may hold secrets.
                ports:
                    type: array
                    items:
                        $ref: '#/components/schemas/PortMapping'
                    description: Ports published on the server.
                restart:
                    enum:
                        - RESTART_POLICY_UNSPECIFIED
                        - RESTART_POLICY_NO
                        - RESTART_POLICY_ON_FAILURE
                        - RESTART_POLICY_UNLESS_STOPPED
                        - RESTART_POLICY_ALWAYS
                    type: string
                    description: What Docker does when the container stops.
                    format: enum
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Labels on the container, for tools that read them. Keys that start with
                         "com.docker.compose." or "dev.dockwell." are Dockwell's own.
                entrypoint:
                    type: array
                    items:
                        type: string
                    description: |-
                        Overrides the image's entrypoint when set. Empty takes the image's;
                         no_entrypoint runs none.
                mounts:
                    type: array
                    items:
                        $ref: '#/components/schemas/Mount'
                    description: Volumes and server paths mounted into the container.
                networks:
                    type: array
                    items:
                        type: string
                    description: |-
                        The networks the container joins, by name. A service's are networks in
                         its environment; a container's on its own are Docker's. Empty joins
                         Docker's default bridge network.
                user:
                    type: string
                    description: |-
                        The user the command runs as, such as "1000" or "node". Empty takes the
                         image's.
                workingDir:
                    type: string
                    description: The directory the command runs in. Empty takes the image's.
                healthcheck:
                    allOf:
                        - $ref: '#/components/schemas/Healthcheck'
                    description: |-
                        How Docker checks the container is healthy. Unset takes the image's
                         check, if it has one.
                noEntrypoint:
                    type: boolean
                    description: |-
                        Runs no entrypoint, not even the image's, as Compose's "entrypoint: []"
                         does: the command runs on its own. Takes no entrypoint beside it.
                externalNetworks:
                    type: array
                    items:
                        type: string
                    description: |-
                        Networks a service joins that Dockwell didn't make, by their names in
                         Docker, such as "1panel-network". Each must be on the server already:
                         Dockwell never makes, changes or deletes one. Whatever else is on it can
                         reach the service, so joining one is host access, which a person approves.
                         A container on its own names Docker's networks in networks.
                hostNetwork:
                    type: boolean
                    description: |-
                        Runs a service on the server's own network, with none of its own, as
                         Compose's "network_mode: host" does. It is host access, and takes no
                         networks, ports or aliases. A container on its own names "host" in networks.
                aliases:
                    type: array
                    items:
                        type: string
                    description: |-
                        Other names containers on a service's networks reach it by, beside its
                         service's name, such as a Compose file's container_name. No two services
                         on a network can answer to one name.
                resources:
                    allOf:
                        - $ref: '#/components/schemas/Resources'
                    description: What it may use of the server's CPU and memory. Unset has no limits.
                capAdd:
                    type: array
                    items:
                        type: string
                    description: |-
                        Linux capabilities it gets beyond Docker's default ones, such as
                         "NET_ADMIN", or "ALL". It is host access.
                capDrop:
                    type: array
                    items:
                        type: string
                    description: Linux capabilities it gives up, such as "NET_RAW", or "ALL".
                groupAdd:
                    type: array
                    items:
                        type: string
                    description: |-
                        Groups its command joins beside its user's, by name or number, such as
                         "audio" or "999". It is host access: joining the group that owns Docker's
                         socket is the same as root.
                privileged:
                    type: boolean
                    description: |-
                        Runs it with every device and capability on the server, the same as root.
                         It is host access.
                restartRetries:
                    type: integer
                    description: |-
                        How many times on-failure restarts it before giving up. 0 has no limit.
                         Only on-failure takes one.
                    format: uint32
            description: |-
                Container is one Docker container: run by hand on a server, or a
                 service's app. Docker fills in from the image what a container leaves
                 out, such as its command or working directory, and that isn't drift.
        CreateTokenRequest:
            type: object
            properties:
                name:
                    type: string
                    description: What it is for, such as "GitHub Actions deploy", up to 100 characters.
                scope:
                    enum:
                        - TOKEN_SCOPE_UNSPECIFIED
                        - TOKEN_SCOPE_READ_ONLY
                        - TOKEN_SCOPE_READ_WRITE
                    type: string
                    description: What it may do. Required.
                    format: enum
                expireTime:
                    type: string
                    description: When it stops working, in the future.
                    format: date-time
                ttl:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long it works for, from when the control plane makes it, such as
                         "7776000s" for 90 days. The control plane's clock sets the expiry, so
                         a client whose clock is off doesn't move it.
                proof:
                    type: string
                    description: The proof from AuthService.FinishStepUp, for creating a token.
            description: CreateTokenRequest describes the new token.
        CreateTokenResponse:
            type: object
            properties:
                token:
                    allOf:
                        - $ref: '#/components/schemas/Token'
                    description: The new token.
                secret:
                    type: string
                    description: |-
                        The secret, such as "dwt_…", 53 characters. Send it as
                         "Authorization: Bearer <secret>". It is shown only now; store it safely.
            description: CreateTokenResponse carries the new token and its secret.
        DeployServiceRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                image:
                    type: string
                    description: The image to run, such as "ghcr.io/acme/web:1.4.2".
                summary:
                    type: string
                    description: What the change is for, for the timeline. Empty says what it deploys.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: DeployServiceRequest names a service and the image to run.
        DeployServiceResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: DeployServiceResponse carries the planned deploy.
        DisableTotpRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for turning code sign-in off.
            description: DisableTotpRequest confirms turning code sign-in off.
        DisableTotpResponse:
            type: object
            properties: {}
            description: DisableTotpResponse is empty.
        DiscardChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
            description: DiscardChangeRequest names a planned change to discard.
        DiscardChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, discarded.
            description: DiscardChangeResponse carries the discarded change.
        Disk:
            type: object
            properties:
                mountPoint:
                    type: string
                    description: Where it is mounted, such as "/" or "/var/lib/docker".
                device:
                    type: string
                    description: The device, such as "/dev/sda1".
                filesystem:
                    type: string
                    description: The filesystem type, such as "ext4".
                sizeBytes:
                    type: string
                    description: Total size, in bytes.
            description: Disk is one mounted filesystem.
        DiskUsage:
            type: object
            properties:
                mountPoint:
                    type: string
                    description: Where it is mounted.
                usedBytes:
                    type: string
                    description: Bytes in use.
                sizeBytes:
                    type: string
                    description: Total size, in bytes.
            description: DiskUsage is one filesystem's use.
        Domain:
            type: object
            properties:
                name:
                    type: string
                    description: The domain, such as "app.example.com".
                environmentId:
                    type: string
                    description: The environment that holds it, by ID. A domain lives in one environment.
                url:
                    type: string
                    description: |-
                        Where it answers, such as "https://app.example.com". A domain whose routes
                         take no certificate reads "http://app.example.com", which is what this server
                         serves, and whatever ends TLS in front of it may answer HTTPS too.
                routes:
                    type: array
                    items:
                        $ref: '#/components/schemas/DomainRoute'
                    description: Its routes, by path.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/DomainServer'
                    description: Where it stands on each server its routes run on.
            description: Domain is one domain the routes of an environment serve.
        DomainCheck:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain.
                state:
                    enum:
                        - DOMAIN_CHECK_STATE_UNSPECIFIED
                        - DOMAIN_CHECK_STATE_POINTS_HERE
                        - DOMAIN_CHECK_STATE_NO_RECORD
                        - DOMAIN_CHECK_STATE_ELSEWHERE
                        - DOMAIN_CHECK_STATE_CANT_TELL
                    type: string
                    description: What it means.
                    format: enum
                found:
                    type: array
                    items:
                        type: string
                    description: The addresses DNS gives for it.
                here:
                    type: array
                    items:
                        type: string
                    description: The addresses the server has, which it compared them with.
            description: DomainCheck is what DNS says of a domain, as a server sees it.
        DomainRoute:
            type: object
            properties:
                id:
                    type: string
                    description: The route's ID.
                name:
                    type: string
                    description: The route's name, unique in its environment.
                path:
                    type: string
                    description: The path it covers. Empty covers the whole domain.
                service:
                    type: string
                    description: The service it sends to, by name. Empty when host_port is set.
                port:
                    type: integer
                    description: The service's port it sends to. Empty when host_port is set.
                    format: uint32
                url:
                    type: string
                    description: Where it answers, such as "https://app.example.com/api".
                tls:
                    type: string
                    description: '"off" when TLS ends before this server, as Route.tls says.'
                hostPort:
                    type: integer
                    description: The port on the server itself it sends to, in place of a service's.
                    format: uint32
                plainForAnyone:
                    type: boolean
                    description: |-
                        True when a route with tls off answers anyone who can reach the server, as
                         Route.plain_for_anyone says.
            description: DomainRoute is one route of a domain.
        DomainServer:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                status:
                    allOf:
                        - $ref: '#/components/schemas/DomainStatus'
                    description: |-
                        Where the certificate and DNS stand, as the server last said. Unset until
                         it has said.
                stale:
                    type: boolean
                    description: True when the server isn't connected, so status is what it last said.
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressStatus'
                    description: |-
                        Where the server's ingress stands, as it last said. A domain with an issued
                         certificate still doesn't answer while problem is set here.
            description: DomainServer is where a domain stands on one server.
        DomainStatus:
            type: object
            properties:
                domain:
                    type: string
                    description: The domain.
                certificate:
                    allOf:
                        - $ref: '#/components/schemas/Certificate'
                    description: Its certificate.
                dns:
                    allOf:
                        - $ref: '#/components/schemas/DomainCheck'
                    description: What DNS says of it.
            description: DomainStatus is where one domain's certificate and DNS stand on a server.
        Drift:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server.
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                revision:
                    type: string
                    description: The latest revision, which the server should match.
                missing:
                    type: boolean
                    description: True when the resource is gone from the server.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: What differs, from the latest revision to what the server has.
            description: Drift is a resource on a server that doesn't match its latest revision.
        Edit:
            type: object
            properties:
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: |-
                        The resource. Its kind may be left out when the spec says it. Its
                         scope may be left out where there is only one to choose, as with the
                         organization of a project, or the environment of a service in an
                         install with one; once there is a choice, leaving it out is an error
                         that names the options.
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Spec'
                    description: |-
                        What the resource should be. Every field is set as given: an edit
                         replaces the whole spec. Unset only with delete.
                delete:
                    type: boolean
                    description: |-
                        Deletes the resource. A project or environment goes only once what
                         lives in it has gone, in this change or an earlier one.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where a service, volume, network or route runs, by server ID. Empty keeps it
                         where it runs now; a new one runs on the only server, and must name its
                         servers once there are several. Other kinds ignore it: a container or
                         firewall rule lives on its server, and projects and environments run on
                         none.
                project:
                    type: string
                    description: |-
                        The project of the environment the resource lives in, by name or ID,
                         for a kind that lives in an environment, such as a service. Leave it
                         out while there is only one project, or when resource.scope is an
                         environment's ID; once there are several, an environment named
                         without its project is an error that names the projects. Other kinds
                         name their project, if they live in one, in resource.scope.
            description: Edit sets one resource's desired spec, or deletes it.
        Environment:
            type: object
            properties:
                displayName:
                    type: string
                    description: How the panel shows it, such as "Staging". Empty shows its name.
            description: |-
                Environment is a stage of a project, such as production or staging, with
                 its own config. A project starts with one, named "production", which
                 stays out of sight until there is a second.
        EnvironmentVariable:
            type: object
            properties:
                id:
                    type: string
                    description: 'Its ID: "var_…" for a variable, "sec_…" for a secret.'
                name:
                    type: string
                    description: Its name, such as "DATABASE_URL".
                secret:
                    type: boolean
                    description: True for a secret, whose value only RevealSecret returns.
                value:
                    type: string
                    description: A variable's value. Always empty for a secret.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was applied.
                    format: date-time
                updatedBy:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: Who made its latest revision.
                changeId:
                    type: string
                    description: The change that made its latest revision.
                usedBy:
                    type: array
                    items:
                        $ref: '#/components/schemas/VariableUse'
                    description: The services that use it, by name.
            description: |-
                EnvironmentVariable is one variable or secret of an environment, as its
                 latest revision has it.
        Event:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The event's ID: a change's own ("chg_…") for a change, and the audit
                         log's ("evt_…") for the rest.
                kind:
                    enum:
                        - EVENT_KIND_UNSPECIFIED
                        - EVENT_KIND_CHANGE
                        - EVENT_KIND_SERVER
                        - EVENT_KIND_ACCESS
                    type: string
                    description: What sort of event it is.
                    format: enum
                action:
                    type: string
                    description: |-
                        What happened, as the audit log names it, such as "server.join",
                         "auth.sign_in" or "token.create". A change's says where the change is:
                         "change.planned", "change.applying", "change.applied" or
                         "change.failed".
                time:
                    type: string
                    description: |-
                        When it happened. A change is timed from when it started applying, and
                         from when it was planned until then.
                    format: date-time
                actor:
                    allOf:
                        - $ref: '#/components/schemas/Actor'
                    description: |-
                        Who did it. For a change, whoever applied it, and whoever proposed it
                         until then.
                surface:
                    enum:
                        - SURFACE_UNSPECIFIED
                        - SURFACE_PANEL
                        - SURFACE_API
                        - SURFACE_AUTOMATIC
                        - SURFACE_CLI
                    type: string
                    description: Where it came from.
                    format: enum
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change, for a change's event: as it stands now, with its plan in
                         brief, each step's progress, its undo deadline, and what undid it or
                         rolled it back. GetChange has the plan in full.
                subject:
                    allOf:
                        - $ref: '#/components/schemas/EventSubject'
                    description: |-
                        What the event is about, other than its actor: the server that joined
                         or was removed, the API token or passkey made or removed, the person a
                         sign-in link is for, or the secret revealed. Unset when there is
                         nothing more to name.
            description: Event is one thing that happened.
        EventSubject:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "srv_…", "tok_…", "pky_…" or "usr_…".
                name:
                    type: string
                    description: |-
                        Its name, such as "hz-2", "GitHub Actions deploy" or "Mira Chen".
                         Empty when it has none, or when it is gone and Dockwell no longer
                         keeps it.
                scope:
                    type: string
                    description: |-
                        What it lives in, by ID, for a resource that lives in another: a
                         secret's environment, as "env_…", for a secret revealed. Empty
                         otherwise.
            description: EventSubject names what an event is about.
        ExportComposeResponse:
            type: object
            properties:
                compose:
                    type: string
                    description: |-
                        The Compose file, as YAML. Its project name is the environment's
                         Compose project, so docker compose -f <file> ps lists what Dockwell
                         runs.
                omitted:
                    type: array
                    items:
                        type: string
                    description: |-
                        What was left out as it may hold secrets. An environment variable's
                         value, as SERVICE.NAME, such as "web.API_KEY": set it in the shell, or
                         in an .env file beside the file, before docker compose up. A volume's
                         driver options, as "volumes.NAME.driver_opts": the file makes that
                         volume with none, so write them in by hand if it isn't on the server.
            description: ExportComposeResponse is a Compose file.
        ExposedVariable:
            type: object
            properties:
                name:
                    type: string
                    description: The variable, such as "REDIS_PASSWORD".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: |-
                        The service, volume or network whose spec holds its value, by kind and
                         name.
                field:
                    type: string
                    description: |-
                        The field that holds it, as the file names it, such as "command",
                         "entrypoint", "labels", "healthcheck" or "driver_opts". "environment" is a
                         list entry's name, as a value there is blanked and a name isn't.
            description: |-
                ExposedVariable is a variable whose value a Compose file writes in free text,
                 where anyone who can read what it makes sees it. Only what the schema marks
                 sensitive is blanked, such as a service's environment values: a command or a
                 label isn't, as seeing them is useful and they rarely hold a secret. A name, a
                 number or a path doesn't count, as docs/security/compose-variables.md lists.
        FieldChange:
            type: object
            properties:
                path:
                    type: string
                    description: The field, such as "image", "env[API_KEY]" or "ports[0].host_port".
                op:
                    enum:
                        - FIELD_OP_UNSPECIFIED
                        - FIELD_OP_ADDED
                        - FIELD_OP_REMOVED
                        - FIELD_OP_MODIFIED
                    type: string
                    description: How it changed.
                    format: enum
                from:
                    type: string
                    description: The value before. Empty when it was unset, and for a sensitive field.
                to:
                    type: string
                    description: The value after. Empty when it is unset, and for a sensitive field.
                sensitive:
                    type: boolean
                    description: |-
                        True for a field that may hold a secret: the plan says it changed,
                         never what it holds.
            description: FieldChange is one field that differs between two specs.
        FinishAddPasskeyRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginAddPasskey.
                credentialJson:
                    type: string
                    description: RegistrationResponseJSON from navigator.credentials.create.
                name:
                    type: string
                    description: What to call it, such as "YubiKey 5C". Optional.
            description: FinishAddPasskeyRequest carries the new passkey.
        FinishAddPasskeyResponse:
            type: object
            properties:
                passkey:
                    allOf:
                        - $ref: '#/components/schemas/Passkey'
                    description: The passkey.
            description: FinishAddPasskeyResponse carries the saved passkey.
        FinishClaimRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginClaim.
                token:
                    type: string
                    description: 'The token from the claim link, again: it is spent only here.'
                credentialJson:
                    type: string
                    description: RegistrationResponseJSON from navigator.credentials.create.
                passkeyName:
                    type: string
                    description: What to call the passkey, such as "Chrome on macOS". Optional.
            description: FinishClaimRequest carries the new passkey.
        FinishClaimResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The owner.
            description: |-
                FinishClaimResponse carries the new owner. The response sets the session
                 cookie.
        FinishPasskeySignInRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginPasskeySignIn.
                credentialJson:
                    type: string
                    description: AuthenticationResponseJSON from navigator.credentials.get.
            description: FinishPasskeySignInRequest carries the passkey's assertion.
        FinishPasskeySignInResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
            description: |-
                FinishPasskeySignInResponse carries who signed in. The response sets the
                 session cookie.
        FinishStepUpRequest:
            type: object
            properties:
                ceremonyId:
                    type: string
                    description: From BeginStepUp.
                credentialJson:
                    type: string
                    description: AuthenticationResponseJSON from navigator.credentials.get.
            description: FinishStepUpRequest carries the passkey's answer.
        FinishStepUpResponse:
            type: object
            properties:
                proof:
                    type: string
                    description: Pass it to the action's method, such as RevealSecret's proof.
                expireTime:
                    type: string
                    description: When it stops working, a minute from now.
                    format: date-time
            description: FinishStepUpResponse carries the proof.
        FirewallRule:
            type: object
            properties:
                action:
                    enum:
                        - FIREWALL_ACTION_UNSPECIFIED
                        - FIREWALL_ACTION_ALLOW
                        - FIREWALL_ACTION_DENY
                    type: string
                    description: Allow or block.
                    format: enum
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP unless set.
                    format: enum
                port:
                    type: integer
                    description: The port the rule covers.
                    format: uint32
                sources:
                    type: array
                    items:
                        type: string
                    description: |-
                        Source addresses in CIDR form, such as "203.0.113.0/24". Empty means
                         anywhere.
                comment:
                    type: string
                    description: Why the rule exists, shown next to it.
            description: FirewallRule allows or blocks inbound traffic to a port on a server.
        GetAuthStateResponse:
            type: object
            properties:
                claimed:
                    type: boolean
                    description: |-
                        True once the install has an owner. Until then, only a claim link from
                         dockwell run or dockwell claim can create one.
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The signed-in user. Unset when the request has no valid session.
                sessionId:
                    type: string
                    description: This session's ID. Empty when not signed in.
                serverName:
                    type: string
                    description: The control server's name, such as "hz-1".
                rpId:
                    type: string
                    description: |-
                        The WebAuthn relying party ID for this address: "localhost", or the
                         panel's domain. Passkeys made here work only here.
                domain:
                    type: string
                    description: |-
                        The panel's own domain, such as "panel.acme.dev". Empty when the panel is
                         reachable only on loopback.
                signInMethod:
                    enum:
                        - SIGN_IN_METHOD_UNSPECIFIED
                        - SIGN_IN_METHOD_CLAIM
                        - SIGN_IN_METHOD_PASSKEY
                        - SIGN_IN_METHOD_AUTHENTICATOR_CODE
                        - SIGN_IN_METHOD_RECOVERY_CODE
                        - SIGN_IN_METHOD_LINK
                    type: string
                    description: How this session began. Unset when not signed in.
                    format: enum
            description: GetAuthStateResponse describes the install and this request's session.
        GetChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change.
            description: GetChangeResponse carries one change.
        GetServerResponse:
            type: object
            properties:
                server:
                    allOf:
                        - $ref: '#/components/schemas/Server'
                    description: The server, with history.
            description: GetServerResponse carries one server.
        GetTotpResponse:
            type: object
            properties:
                totp:
                    allOf:
                        - $ref: '#/components/schemas/Totp'
                    description: Code sign-in.
            description: GetTotpResponse describes code sign-in.
        GetVersionResponse:
            type: object
            properties:
                build:
                    allOf:
                        - $ref: '#/components/schemas/BuildInfo'
                    description: The build of the dockwell binary running the control plane.
            description: GetVersionResponse carries the control plane's build.
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        Healthcheck:
            type: object
            properties:
                test:
                    type: array
                    items:
                        type: string
                    description: |-
                        The check, as Docker takes it: ["CMD", "curl", "-f", "http://localhost"],
                         ["CMD-SHELL", "curl -f http://localhost || exit 1"], or ["NONE"] to turn
                         off the image's check.
                interval:
                    type: string
                    description: How often it runs, such as "30s". Empty takes Docker's default.
                timeout:
                    type: string
                    description: How long one check may take, such as "5s". Empty takes Docker's default.
                startPeriod:
                    type: string
                    description: |-
                        How long the container has to start before failures count, such as
                         "1m". Empty takes Docker's default.
                retries:
                    type: integer
                    description: How many failures in a row make it unhealthy. 0 takes Docker's default.
                    format: uint32
            description: |-
                Healthcheck is a command Docker runs in the container to check it is
                 healthy.
        HostAccess:
            type: object
            properties:
                kind:
                    enum:
                        - HOST_ACCESS_KIND_UNSPECIFIED
                        - HOST_ACCESS_KIND_SERVER_PATH
                        - HOST_ACCESS_KIND_DOCKER_SOCKET
                        - HOST_ACCESS_KIND_HOST_NETWORK
                        - HOST_ACCESS_KIND_VOLUME_MOUNT
                        - HOST_ACCESS_KIND_NETWORK_DRIVER
                        - HOST_ACCESS_KIND_DOMAIN
                        - HOST_ACCESS_KIND_PANEL_DOMAIN
                        - HOST_ACCESS_KIND_SERVER_PORT
                        - HOST_ACCESS_KIND_TRUSTED_PROXY
                        - HOST_ACCESS_KIND_EXTERNAL_NETWORK
                        - HOST_ACCESS_KIND_CAPABILITY
                        - HOST_ACCESS_KIND_GROUP
                        - HOST_ACCESS_KIND_PRIVILEGED
                        - HOST_ACCESS_KIND_PLAIN_FOR_ANYONE
                        - HOST_ACCESS_KIND_HTTPS_OFF
                    type: string
                    description: What it is.
                    format: enum
                path:
                    type: string
                    description: |-
                        The server path or socket, the volume's device, the network's parent
                         interface, a network the server has, a capability or a group, such as
                         "/srv/app/config", ":/export/media", "eth0", "1panel-network", "NET_ADMIN"
                         or "999". Empty for the server's network and for privileged mode.
                readOnly:
                    type: boolean
                    description: |-
                        True when it is reached read-only: mounted so, or mounted so by the
                         service that uses it. False reads and writes.
                type:
                    type: string
                    description: A volume's mount type, such as "nfs" or "cifs".
                address:
                    type: string
                    description: |-
                        The remote server of a mount, such as "10.0.0.2". It never holds
                         credentials.
                relabel:
                    type: string
                    description: |-
                        How Docker relabels a server path for SELinux: "z", shared with other
                         containers, or "Z", private to this one. Empty for none.
                driver:
                    type: string
                    description: The plugin a volume runs on, or a network's driver, such as "macvlan".
                detail:
                    type: string
                    description: |-
                        A network's options beyond the few that keep it to its own bridge, as
                         "name=value" with commas between, sorted. For a network the server has,
                         the other names a service answers to on it, with commas between, sorted.
                sameAsRoot:
                    type: boolean
                    description: |-
                        True for what is the same as root on the server, whatever else it says,
                         such as privileged mode or the capability SYS_ADMIN.
            description: |-
                HostAccess is something on a server that a resource reaches beyond what
                 Docker keeps for it, such as a server path a container mounts.
        ImportComposeRequest:
            type: object
            properties:
                summary:
                    type: string
                    description: |-
                        What the change is for, such as "Run the shop's stack". Empty says it
                         came from a Compose file.
                project:
                    type: string
                    description: |-
                        The project it belongs to, by name or ID, such as "shop". One that doesn't
                         exist yet comes to life with the plan. Left out, the file's name: names
                         it. With neither, the file goes in the default project, only while that
                         has no apps: otherwise it is refused, as a service of the same name would
                         change the one that is there.
                environment:
                    type: string
                    description: |-
                        The environment, by name or ID. Leave it out while its project has
                         only one. A project the plan brings to life starts with this one, or
                         with production. A file exported from here goes back to the environment
                         it came from unless this names another of its project.
                compose:
                    type: string
                    description: |-
                        The Compose file, as YAML, such as --compose "$(cat compose.yaml)", of
                         up to 256 KiB. A path relative to the file needs directory, as it runs on
                         servers where it otherwise means nothing.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Values for the variables the file uses, such as ${TAG}. A variable
                         with no value here, in env or as a default in the file is refused. They
                         win over env, as a shell's win over an .env file.
                servers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where the services, volumes and networks run, by server ID, as an
                         edit's servers. Empty keeps what exists where it runs, and puts what
                         is new on the only server; once there are several, name them.
                removeOrphans:
                    type: boolean
                    description: |-
                        Also deletes the environment's services and networks that aren't in
                         the file, as docker compose up --remove-orphans does. Volumes stay,
                         with their data; delete one on its own to remove it.
                env:
                    type: string
                    description: |-
                        The .env file beside the Compose file, as its text, of up to 64 KiB, for
                         the variables the file uses. The CLI takes it as a file, --env-file .env,
                         as it may hold secrets. It reads as docker compose reads one, except that a
                         value naming a variable with no value is refused, rather than left blank. A
                         value for a secret the file's services use is refused, as any is.
                directory:
                    type: string
                    description: |-
                        The directory the file is in on the servers, as an absolute path, such as
                         /opt/1panel/apps/postgresql/pg. A path relative to the file, such as
                         ./data, starts there. Each is a server path, which a person approves.
            description: ImportComposeRequest is a Compose file to plan into a project.
        ImportComposeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
                exposedVariables:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExposedVariable'
                    description: |-
                        Where the file writes a variable's value in plain sight, which the plan's
                         notes say too. It lists 100 at most.
                moreExposed:
                    type: boolean
                    description: True when the file writes more than exposed_variables lists.
            description: ImportComposeResponse carries the planned change.
        IngressEffect:
            type: object
            properties:
                change:
                    enum:
                        - INGRESS_CHANGE_UNSPECIFIED
                        - INGRESS_CHANGE_STARTS
                        - INGRESS_CHANGE_STOPS
                        - INGRESS_CHANGE_RESTARTS
                        - INGRESS_CHANGE_TAKES_PORTS
                        - INGRESS_CHANGE_FREES_PORTS
                    type: string
                    description: What happens to the proxy.
                    format: enum
                proxy:
                    type: string
                    description: The proxy, such as "Caddy".
                ports:
                    type: array
                    items:
                        type: string
                    description: |-
                        The ports it takes or frees, such as "80/tcp", "443/tcp" and "443/udp".
                         A server whose routes all say tls off needs port 80 alone.
                panelDomain:
                    type: string
                    description: |-
                        The panel's domain, when the panel moves behind the proxy as it starts,
                         or takes the ports back as it stops. The address, passkeys and sessions
                         stay; HTTPS on it is down while the certificate comes, and the SSH tunnel
                         keeps working.
            description: |-
                IngressEffect is what a step does to the proxy that holds a server's public
                 ports.
        IngressStatus:
            type: object
            properties:
                proxy:
                    type: string
                    description: The proxy, such as "Caddy".
                running:
                    type: boolean
                    description: True when the proxy runs.
                problem:
                    enum:
                        - INGRESS_PROBLEM_UNSPECIFIED
                        - INGRESS_PROBLEM_PORTS_TAKEN
                        - INGRESS_PROBLEM_SUBNET_TAKEN
                        - INGRESS_PROBLEM_NOT_RUNNING
                    type: string
                    description: Why its routes aren't being served. Unset while they are.
                    format: enum
                message:
                    type: string
                    description: |-
                        For people: what is wrong, what follows, and how to fix it. Empty while
                         nothing is.
                holders:
                    type: array
                    items:
                        type: string
                    description: |-
                        What holds the proxy's ports, by name, for PORTS_TAKEN: containers, where
                         they are in one, so a client can offer what to do about each.
                version:
                    type: string
                    description: |-
                        The version the proxy runs, such as "2.11.7-alpine". Empty when the server
                         can't say.
                pinnedVersion:
                    type: string
                    description: The version this server's Dockwell pins.
                outdated:
                    type: boolean
                    description: |-
                        True when the proxy isn't the version this server's Dockwell pins. It may
                         be missing security fixes, and moves on the server's next route change.
            description: IngressStatus is where a server's ingress stands, on a server with routes.
        ListChangesResponse:
            type: object
            properties:
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/Change'
                    description: The changes, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListChangesResponse is a page of changes.
        ListDomainsResponse:
            type: object
            properties:
                domains:
                    type: array
                    items:
                        $ref: '#/components/schemas/Domain'
                    description: The domains, sorted by name.
            description: ListDomainsResponse lists domains.
        ListDriftResponse:
            type: object
            properties:
                drift:
                    type: array
                    items:
                        $ref: '#/components/schemas/Drift'
                    description: Each resource that differs, on each server it differs on.
                uncheckedServers:
                    type: array
                    items:
                        $ref: '#/components/schemas/UncheckedServer'
                    description: |-
                        Servers that couldn't be checked, each with why, such as an agent that
                         isn't connected. The servers that could be checked are in drift all
                         the same.
            description: ListDriftResponse lists what doesn't match its latest revision.
        ListEventsResponse:
            type: object
            properties:
                events:
                    type: array
                    items:
                        $ref: '#/components/schemas/Event'
                    description: The events, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListEventsResponse is a page of events.
        ListPasskeysResponse:
            type: object
            properties:
                passkeys:
                    type: array
                    items:
                        $ref: '#/components/schemas/Passkey'
                    description: Passkeys, oldest first.
            description: ListPasskeysResponse lists passkeys.
        ListResourcesResponse:
            type: object
            properties:
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/Resource'
                    description: The resources, oldest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListResourcesResponse is a page of resources.
        ListServersResponse:
            type: object
            properties:
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/Server'
                    description: The servers.
            description: ListServersResponse lists servers, oldest first.
        ListServiceRevisionsResponse:
            type: object
            properties:
                revisions:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceRevision'
                    description: The revisions, newest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListServiceRevisionsResponse is a page of a service's revisions.
        ListServicesResponse:
            type: object
            properties:
                services:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceInfo'
                    description: The services, oldest first.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListServicesResponse is a page of services.
        ListSessionsResponse:
            type: object
            properties:
                sessions:
                    type: array
                    items:
                        $ref: '#/components/schemas/Session'
                    description: Sessions, newest first.
            description: ListSessionsResponse lists sessions.
        ListTokensResponse:
            type: object
            properties:
                tokens:
                    type: array
                    items:
                        $ref: '#/components/schemas/Token'
                    description: Tokens that still work, newest first.
            description: ListTokensResponse lists tokens.
        ListVariablesResponse:
            type: object
            properties:
                environmentId:
                    type: string
                    description: The environment's ID, such as "env_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                variables:
                    type: array
                    items:
                        $ref: '#/components/schemas/EnvironmentVariable'
                    description: Its variables and secrets, by name.
                nextPageToken:
                    type: string
                    description: Pass it as page_token for the next page. Empty on the last page.
            description: ListVariablesResponse is an environment's variables and secrets.
        Mount:
            type: object
            properties:
                volume:
                    type: string
                    description: |-
                        A volume, by name. A service's are volumes in its environment; a
                         container's on its own are Docker's.
                hostPath:
                    type: string
                    description: An absolute path on the server, such as "/srv/uploads".
                target:
                    type: string
                    description: Where it appears in the container, as an absolute path.
                readOnly:
                    type: boolean
                    description: Mounts it read-only.
                relabel:
                    enum:
                        - RELABEL_UNSPECIFIED
                        - RELABEL_SHARED
                        - RELABEL_PRIVATE
                    type: string
                    description: |-
                        Relabels a server path for SELinux, as Docker's z and Z options do, so
                         the container can use it on a server that enforces SELinux. Only a
                         server path takes one; elsewhere Docker changes nothing.
                    format: enum
            description: Mount puts a volume, or a directory on the server, into a container.
        Network:
            type: object
            properties:
                driver:
                    type: string
                    description: 'The network driver: "bridge" unless set.'
                options:
                    type: object
                    additionalProperties:
                        type: string
                    description: The driver's options.
                internal:
                    type: boolean
                    description: |-
                        Cuts the network off from outside the server: only its containers
                         reach each other.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: Labels on the network, for tools that read them.
            description: |-
                Network is a Docker network in an environment, which its services join
                 by name, as a Compose file's networks. A service reaches another on a
                 network they share by the other's name. Docker can't change a network,
                 so its spec can't change once it is made.
        Passkey:
            type: object
            properties:
                id:
                    type: string
                    description: The passkey's ID, such as "pky_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                name:
                    type: string
                    description: What it is called. Empty when it was given no name.
                rpId:
                    type: string
                    description: 'The address it works on: "localhost" or the panel''s domain.'
                createTime:
                    type: string
                    description: When it was added.
                    format: date-time
                lastUsedTime:
                    type: string
                    description: When it last signed in. Unset if never.
                    format: date-time
                synced:
                    type: boolean
                    description: |-
                        True when the passkey can sync between devices, as with iCloud Keychain
                         or Google Password Manager.
                suspectedCopy:
                    type: boolean
                    description: |-
                        True when it once reported a lower use count than before, which happens
                         when a passkey is copied. It no longer signs in; remove it.
            description: Passkey is one of a user's passkeys.
        Plan:
            type: object
            properties:
                fingerprint:
                    type: string
                    description: |-
                        A hash of what the plan does, for this change. Applying checks that a
                         fresh plan still has it. The same edits against the same state have
                         the same fingerprint, unless they edit a kind that may hold secrets:
                         that is digested for each change alone, so no two changes'
                         fingerprints say they set the same value.
                summary:
                    allOf:
                        - $ref: '#/components/schemas/PlanSummary'
                    description: How many resources it creates, changes, replaces and destroys.
                resources:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlannedResource'
                    description: Each resource the change touches, in the order of its edits.
                servers:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerPlan'
                    description: |-
                        Each server with something to do, in the order of the edits, then each
                         removed server the change takes resources off.
                undoWindow:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long the change can be undone once it is applied.
                destructive:
                    type: boolean
                    description: |-
                        True when a step destroys data or may cut off access. Applying it needs
                         the fingerprint and a signed-in session.
                hostAccess:
                    type: boolean
                    description: |-
                        True when the change adds to, or changes, what a container can reach
                         on its server (host_access), which a person approves: applying it needs
                         the fingerprint and a signed-in session, as a destructive plan does.
                notes:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanNote'
                    description: |-
                        What a person should know before applying it that no step says, as it is
                         about what stays as it is or what can be read, not about what runs. A note
                         never stops anyone applying it.
                places:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanPlace'
                    description: |-
                        Which project and environment its resources land in, once there's a choice
                         of either, so a plan can't read as another's. Empty while there's one
                         project with one environment. A plan that spans several lists each.
            description: |-
                Plan is what applying a change would do: what changes, where, and for
                 how long.
        PlanNote:
            type: object
            properties:
                reason:
                    type: string
                    description: |-
                        What it is about, for a surface that says it in its own words:
                         "exposed_variable" for a variable whose value a Compose file writes in
                         free text, such as a command or a label, where anyone who can read the plan
                         reads it, "exposed_more" for a file that writes more of them than a plan
                         lists, "container_name" for a name a service now answers to as an alias,
                         "no_build" for an image a Compose file builds and Dockwell doesn't,
                         "cpu_reservation" for a CPU reservation Docker has no way to keep,
                         "host_network_ports" for ports the server's own network doesn't publish,
                         "updates_project" for a Compose file that changes a project already running
                         services, "volumes_stay" for a rollback that leaves a service's data as it
                         is, "values_latest" for one that keeps the latest value of what the service
                         uses, "pulls_again" for a deploy of the tag it already names, "leaves_pin" for
                         one of the tag a rollback pinned, which replaces it whatever the pull finds,
                         "starts_stopped" for what isn't running and this plan starts, and "digest_pinned" and "digest_gone" for a rollback that does, or can't, run
                         exactly the image a revision ran. Another reason may come: its message says
                         what it means.
                message:
                    type: string
                    description: 'What it says, for people: the fact, what it means, and what to do.'
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource it is about.
                names:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names it is about: the variable, then the field that holds it, for
                         "exposed_variable"; the project, then the services it runs, for
                         "updates_project"; the volumes and server paths for "volumes_stay"; the
                         variables and secrets, by the names the service sees, for "values_latest";
                         the container_name, or the image, or the ports. Never a variable's value.
            description: PlanNote is one thing a person should know before applying a plan.
        PlanPlace:
            type: object
            properties:
                project:
                    type: string
                    description: The project's name. Empty while there's only one project.
                environment:
                    type: string
                    description: The environment's name. Empty while its project has only one.
            description: PlanPlace is where a plan's resources land, naming only what offers a choice.
        PlanStep:
            type: object
            properties:
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: What the step does.
                    format: enum
                effect:
                    enum:
                        - STEP_EFFECT_UNSPECIFIED
                        - STEP_EFFECT_NONE
                        - STEP_EFFECT_RESTART
                        - STEP_EFFECT_RECREATE
                    type: string
                    description: What it does to what the resource serves.
                    format: enum
                downtime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: How long what the resource serves is unavailable. Unset means none.
                destroysData:
                    type: boolean
                    description: True when the step removes data its spec can't bring back.
                warnings:
                    type: array
                    items:
                        enum:
                            - PLAN_WARNING_UNSPECIFIED
                            - PLAN_WARNING_MAY_LOCK_OUT
                        type: string
                        format: enum
                    description: Ways the step may hurt that its action doesn't say.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: The fields that differ from what the server has now.
                untilHealthy:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long until what the resource serves is healthy again, at most,
                         counting the downtime, when its health check may take longer than the
                         downtime, as after a container is recreated. Unset when the downtime
                         says it all.
                keptPaths:
                    type: array
                    items:
                        type: string
                    description: |-
                        Where data was that the step takes out of use, which the server keeps
                         for 7 days: for a container, the paths in it where its image keeps
                         data, which deleting it, or mounting something else there, leaves
                         behind. Undoing the step mounts them again.
                restores:
                    type: boolean
                    description: |-
                        True when the step brings back data its server kept, as undoing a
                         deletion does. Applying it fails if the server no longer has the data,
                         rather than making the resource anew, empty.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What the step lets the resource reach on its server that it couldn't
                         before, or reach in another way, which a person approves. The control
                         plane decides this from the specs, not from what the server reports.
                healthUnknown:
                    type: boolean
                    description: |-
                        True when the server hasn't the image yet, so its own health check
                         isn't known, and until_healthy may be missing or too short.
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressEffect'
                    description: |-
                        What the step does to the server's ingress, beside the route itself.
                         Unset for a step that leaves it as it is.
                domainCheck:
                    allOf:
                        - $ref: '#/components/schemas/DomainCheck'
                    description: |-
                        What DNS said of a route's domain when this was planned. It never stops
                         a plan, and the fingerprint leaves it out, as people often set DNS after.
                returningContainers:
                    type: array
                    items:
                        type: string
                    description: |-
                        Stopped containers that Docker starts again when it next restarts, as after
                         a reboot, and that may then take the ports the server's proxy needs, so
                         its routes stop answering. It never stops a plan, and the fingerprint leaves
                         it out. Keep one stopped with docker update --restart=no.
                pull:
                    type: boolean
                    description: |-
                        True when the step asks the server for its image again first. With no
                         changes, it replaces what runs only if that finds a newer image, and does
                         nothing otherwise, which its progress says. With nothing but a restart policy
                         to change, it changes that in place otherwise.
                imageGone:
                    type: boolean
                    description: |-
                        True when the digest its spec pins isn't on the server, and its registry
                         won't give it, so applying it could only fail. A registry that doesn't answer
                         says nothing of it, so this stays false.
            description: PlanStep is what applying does to one resource on one server.
        PlanSummary:
            type: object
            properties:
                create:
                    type: integer
                    description: Resources made for the first time.
                    format: int32
                change:
                    type: integer
                    description: Resources changed in place.
                    format: int32
                replace:
                    type: integer
                    description: |-
                        Resources removed and made again, such as a recreated container. A
                         replace is counted here alone, never among the changes.
                    format: int32
                destroy:
                    type: integer
                    description: Resources deleted.
                    format: int32
            description: PlanSummary counts the resources a plan touches by what it does to them.
        PlannedResource:
            type: object
            properties:
                id:
                    type: string
                    description: The resource's ID. A new resource has its ID from when it is planned.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: |-
                        What happens to it, from its steps on every server: replace if any
                         step replaces it; delete if it is deleted, from every server; create if
                         it is new and every step creates it; otherwise update, if anything
                         changes. A kind that runs on no server takes what its revision does.
                         The summary counts these.
                    format: enum
                baseRevision:
                    type: string
                    description: 'The revision it starts from: 0 for a new resource.'
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: The fields that differ from its latest revision.
                servers:
                    type: array
                    items:
                        type: string
                    description: Where it runs once applied, by server ID.
                previousServers:
                    type: array
                    items:
                        type: string
                    description: Where it runs now, by server ID.
                hostAccess:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: |-
                        What the change lets it reach on its servers that it couldn't before,
                         or reach in another way, which a person approves. The control plane
                         decides this from the specs, not from what the servers report.
            description: PlannedResource is what a plan does to one resource as a whole.
        PortMapping:
            type: object
            properties:
                hostPort:
                    type: integer
                    description: The port on the server.
                    format: uint32
                containerPort:
                    type: integer
                    description: The port inside the container.
                    format: uint32
                protocol:
                    enum:
                        - PROTOCOL_UNSPECIFIED
                        - PROTOCOL_TCP
                        - PROTOCOL_UDP
                    type: string
                    description: TCP unless set.
                    format: enum
                hostIp:
                    type: string
                    description: |-
                        The server address it listens on, such as "127.0.0.1". Empty listens on
                         every address.
            description: PortMapping publishes a container port on the server.
        Project:
            type: object
            properties:
                displayName:
                    type: string
                    description: |-
                        How the panel shows it, such as "Acme web". Empty shows its name, which
                         URLs and the CLI use.
            description: |-
                Project is a product or client in the organization. It holds
                 environments, and scopes members, secrets and domains. An install starts
                 with one, named "default", which stays out of sight until there is a
                 second.
        ProposeChangeRequest:
            type: object
            properties:
                summary:
                    type: string
                    description: |-
                        What the change is for, in your words, such as "Add a staging
                         environment". Required: the timeline shows it.
                edits:
                    type: array
                    items:
                        $ref: '#/components/schemas/Edit'
                    description: |-
                        The edits, at most one for each resource. They apply in this order,
                         and deletions last, in reverse.
            description: ProposeChangeRequest is a set of edits to plan together.
        ProposeChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: ProposeChangeResponse carries the planned change.
        RegenerateRecoveryCodesRequest:
            type: object
            properties:
                proof:
                    type: string
                    description: The proof from FinishStepUp, for making recovery codes.
            description: RegenerateRecoveryCodesRequest confirms making new recovery codes.
        RegenerateRecoveryCodesResponse:
            type: object
            properties:
                recoveryCodes:
                    type: array
                    items:
                        type: string
                    description: Ten one-time recovery codes. They are shown only now.
            description: RegenerateRecoveryCodesResponse carries the new codes.
        RemovePasskeyRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The passkey's ID.
                proof:
                    type: string
                    description: The proof from FinishStepUp, for removing this passkey.
            description: RemovePasskeyRequest names a passkey.
        RemovePasskeyResponse:
            type: object
            properties: {}
            description: RemovePasskeyResponse is empty.
        Resource:
            type: object
            properties:
                id:
                    type: string
                    description: Its ID, such as "prj_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: Its kind, the ID of what it lives in, and its name.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was applied.
                    format: date-time
                displayName:
                    type: string
                    description: |-
                        The name to show, such as "Storefront", from its spec, for kinds whose
                         spec has one. Empty when it isn't set.
            description: Resource is one managed resource, as its latest revision has it.
        ResourceRef:
            type: object
            properties:
                kind:
                    type: string
                    description: |-
                        The kind, such as "project", "environment", "service", "volume",
                         "network", "route", "container" or "firewall.rule".
                scope:
                    type: string
                    description: |-
                        The ID of what it lives in, which its kind says: the organization
                         ("org_…") for a project, a project ("prj_…") for an environment, an
                         environment ("env_…") for a service, volume, network or route, and a server
                         ("srv_…") for a container or firewall rule.
                name:
                    type: string
                    description: Its name, unique among its kind in its scope, such as "web".
            description: ResourceRef names a resource.
        Resources:
            type: object
            properties:
                cpus:
                    type: string
                    description: |-
                        The most CPUs it may use, such as "0.5" or "2", to three decimal places.
                         Empty has no limit.
                memory:
                    type: string
                    description: |-
                        The most memory it may use, such as "512M" or "2G", from 6M, in units of
                         1024. Empty has no limit.
                memoryReservation:
                    type: string
                    description: |-
                        The memory Docker tries to leave it when the server runs short, such as
                         "256M", from 6M and no more than memory. Empty reserves none.
            description: |-
                Resources is what a container may use of its server. Docker changes these on
                 a running container, except to lift one: that recreates it.
        RevealSecretRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The secret's ID, such as "sec_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                proof:
                    type: string
                    description: |-
                        The proof from FinishStepUp, for revealing this secret. It works once,
                         within a minute, in the session that made it.
            description: RevealSecretRequest names a secret to reveal.
        RevealSecretResponse:
            type: object
            properties:
                value:
                    type: string
                    description: The value.
                revision:
                    type: string
                    description: The revision it is from.
            description: RevealSecretResponse carries a secret's value.
        RevertDriftRequest:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server it drifted on.
                resourceId:
                    type: string
                    description: The resource's ID.
            description: RevertDriftRequest names a drifted resource to put back.
        RevertDriftResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, that puts the resource back.
            description: RevertDriftResponse carries the planned revert.
        RevokeOtherSessionsRequest:
            type: object
            properties: {}
            description: RevokeOtherSessionsRequest takes no parameters.
        RevokeOtherSessionsResponse:
            type: object
            properties:
                revoked:
                    type: integer
                    description: How many sessions were revoked.
                    format: int32
            description: RevokeOtherSessionsResponse says how many sessions ended.
        RevokeSessionRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The session's ID.
            description: RevokeSessionRequest names a session.
        RevokeSessionResponse:
            type: object
            properties: {}
            description: RevokeSessionResponse is empty.
        RevokeTokenRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The token's ID.
            description: RevokeTokenRequest names a token.
        RevokeTokenResponse:
            type: object
            properties: {}
            description: RevokeTokenResponse is empty.
        RollBackServiceRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The service, by ID or by name.
                revision:
                    type: string
                    description: The revision to go back to.
                summary:
                    type: string
                    description: |-
                        What the change is for, for the timeline. Empty says which revision it
                         goes back to.
                project:
                    type: string
                    description: |-
                        The project of a service named by name, by name or ID, when more than one
                         has a service of that name.
                environment:
                    type: string
                    description: |-
                        The environment of a service named by name, by name or ID, when its
                         project has more than one.
            description: RollBackServiceRequest names a service and the revision to go back to.
        RollBackServiceResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: The change, planned, with its plan.
            description: RollBackServiceResponse carries the planned rollback.
        Route:
            type: object
            properties:
                domain:
                    type: string
                    description: |-
                        The domain, such as "app.example.com": a lowercase DNS name that a
                         public certificate authority issues for. Wildcards aren't taken.
                path:
                    type: string
                    description: |-
                        The path it covers, such as "/api": that path and what is under it,
                         which reach the service as they are. Empty covers the whole domain.
                service:
                    type: string
                    description: |-
                        The service to send it to, by name, in the route's environment. Empty when
                         host_port names a port on the server instead.
                port:
                    type: integer
                    description: |-
                        The port the service listens on inside its container, such as 8080. Empty
                         when host_port names a port on the server instead.
                    format: uint32
                tls:
                    type: string
                    description: |-
                        "off" when TLS ends before this server, as at a tunnel or a proxy in front
                         of it: the domain is served over plain HTTP on port 80, with no certificate
                         and no redirect to HTTPS, so its traffic reaches this server unencrypted.
                         Such a route answers only the proxies in trusted_proxies, or with none, this
                         server's own loopback, unless plain_for_anyone says otherwise. Anyone else
                         gets what a name with no route gets. Empty gets a certificate. A domain's
                         routes all take the same setting. A person approves taking a domain that has
                         had a certificate off it.
                trustedProxies:
                    type: array
                    items:
                        type: string
                    description: |-
                        The proxies in front of this server whose word this route takes on where a
                         request came from, each an address, a range such as "203.0.113.0/24", or
                         "cloudflare" for Cloudflare's published ranges. A request from anywhere else
                         has its address taken from the connection, whatever another route on the
                         server names. From an address or a range, X-Forwarded-For is read from the
                         right. From "cloudflare", CF-Connecting-IP is read, as Cloudflare documents,
                         and it's only as sure as Cloudflare says: see docs/security/ingress.md. A
                         person approves each one a change adds, as a proxy that isn't really one makes
                         client addresses forgeable. A range of Cloudflare's is named by the preset, and
                         a public range wider than /12, or /28 in IPv6, or a private one wider than /8,
                         isn't taken.
                hostPort:
                    type: integer
                    description: |-
                        A port on the server itself, such as 8080, in place of service and port, for
                         something that isn't a Dockwell service, or a service on the server's own
                         network, which a route can't send to by name. The proxy dials 127.0.0.1 on it,
                         so what's there sees every caller as local. It reaches past containers, so a
                         person approves it, and any change to where it answers. Dockwell's own ports,
                         and Docker's API on 2375 and 2376, aren't taken.
                    format: uint32
                plainForAnyone:
                    type: boolean
                    description: |-
                        True for a route that says tls off to answer anyone who can reach this
                         server's port 80, as for a site on a private network, or a load balancer whose
                         addresses aren't known. It goes around whatever is in front, so a person
                         approves it.
            description: |-
                Route sends a domain's traffic, or a path under it, to a port of a service
                 in the route's environment, or to a port on the server itself. It comes over
                 HTTPS with a certificate Dockwell gets for the domain, unless tls says TLS
                 ends before this server. A server's first route starts its ingress, which
                 takes ports 80 and 443, or port 80 alone while no route on the server takes
                 a certificate; its last stops it and frees them. See
                 docs/adr/0024-the-caddy-ingress-driver.md and
                 docs/adr/0030-routes-behind-a-tunnel-or-a-proxy.md.
        RouteAnswers:
            type: object
            properties:
                reach:
                    enum:
                        - ROUTE_REACH_UNSPECIFIED
                        - ROUTE_REACH_THIS_SERVER
                        - ROUTE_REACH_PROXIES
                        - ROUTE_REACH_ANYONE
                    type: string
                    description: Who.
                    format: enum
                proxies:
                    type: array
                    items:
                        type: string
                    description: The proxies it answers, for ROUTE_REACH_PROXIES.
                plain:
                    type: boolean
                    description: True when it answers over plain HTTP, as tls off says.
            description: RouteAnswers is who a route answers, as its plan says.
        Secret:
            type: object
            properties:
                value:
                    type: string
                    description: The value. Every edit sets it whole.
            description: |-
                Secret is a value of an environment that its services use without anyone
                 reading it back, such as a database password. Dockwell keeps it
                 encrypted, sends it only to the servers that run a service that uses it,
                 and never shows it in plans, history or logs. Revealing it takes a
                 passkey, and is audited.
        Server:
            type: object
            properties:
                id:
                    type: string
                    description: The server's ID.
                name:
                    type: string
                    description: What the server is called, such as "hz-1".
                createTime:
                    type: string
                    description: When the server joined.
                    format: date-time
                connection:
                    enum:
                        - CONNECTION_UNSPECIFIED
                        - CONNECTION_CONNECTED
                        - CONNECTION_UNREACHABLE
                        - CONNECTION_PENDING
                    type: string
                    description: Whether its agent is connected.
                    format: enum
                lastSeenTime:
                    type: string
                    description: When the control plane last heard from the agent. Unset if never.
                    format: date-time
                inventory:
                    allOf:
                        - $ref: '#/components/schemas/ServerInventory'
                    description: 'What the server is: OS, hardware, Docker. Unset until the agent reports.'
                stats:
                    allOf:
                        - $ref: '#/components/schemas/ServerStats'
                    description: The newest stats. Unset until the agent reports.
                history:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServerStats'
                    description: |-
                        Recent stats, oldest first, for sparklines: at most 60 samples, from
                         the 5 minutes before the newest by the samples' own times, so a server
                         that reports again after a longer outage starts over. Empty in lists.
                agentBuild:
                    allOf:
                        - $ref: '#/components/schemas/BuildInfo'
                    description: The agent's build.
                controlServer:
                    type: boolean
                    description: True for the server that runs the control plane.
                connectTime:
                    type: string
                    description: |-
                        When the agent connected, if it is connected now. A connection that
                         moves to a renewed certificate keeps its time. Unset otherwise.
                    format: date-time
                ingress:
                    allOf:
                        - $ref: '#/components/schemas/IngressStatus'
                    description: |-
                        Where its ingress stands, as it last said. Unset for a server with no
                         routes, as nothing on it wants the public ports.
            description: Server is one machine running the agent.
        ServerInventory:
            type: object
            properties:
                hostname:
                    type: string
                    description: The server's hostname.
                osName:
                    type: string
                    description: The operating system's name for people, such as "Ubuntu 24.04.1 LTS".
                osId:
                    type: string
                    description: The OS's ID from os-release, such as "ubuntu" or "debian".
                osVersion:
                    type: string
                    description: The OS version, such as "24.04".
                kernel:
                    type: string
                    description: The kernel release, such as "6.8.0-48-generic".
                architecture:
                    type: string
                    description: The CPU architecture, such as "amd64" or "arm64".
                cpuModel:
                    type: string
                    description: The CPU model, such as "AMD EPYC 7763 64-Core Processor".
                cpuCount:
                    type: integer
                    description: Logical CPUs.
                    format: uint32
                memoryBytes:
                    type: string
                    description: Total memory, in bytes.
                disks:
                    type: array
                    items:
                        $ref: '#/components/schemas/Disk'
                    description: Mounted filesystems that hold data, largest first.
                dockerVersion:
                    type: string
                    description: |-
                        The Docker Engine version, such as "28.5.1". Empty when Docker isn't
                         installed or isn't running.
                addresses:
                    type: array
                    items:
                        type: string
                    description: The server's non-loopback IP addresses.
            description: 'ServerInventory is what a server is: its system and hardware.'
        ServerPlan:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                offline:
                    type: boolean
                    description: |-
                        True when the server isn't connected: its steps are planned from the
                         state it last had, and the change can't be applied until it reconnects.
                removed:
                    type: boolean
                    description: |-
                        True when the server was removed from the fleet. It has no steps: what
                         the change takes off it is only recorded.
                downtime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: The steps' downtime added up, as they run one at a time.
                steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanStep'
                    description: The steps, in the order they run.
                untilHealthy:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: |-
                        How long until everything the steps touch is healthy again, at most,
                         when a health check may take longer than the downtime: each step's
                         until_healthy, or its downtime, added up. Unset when the downtime says
                         it all.
            description: ServerPlan is the part of a plan on one server.
        ServerPortCheck:
            type: object
            properties:
                port:
                    type: integer
                    description: The port.
                    format: uint32
                listening:
                    type: string
                    description: |-
                        What listens there, as the server said when this was planned, such as
                         "nginx, in the container web-1". Empty when nothing does, or it couldn't say.
                nothingListening:
                    type: boolean
                    description: |-
                        True when the server said nothing listens there yet, so the route answers 502
                         until something does. False, with listening empty, when it couldn't say.
            description: ServerPortCheck is a port on the server that a route sends to.
        ServerStats:
            type: object
            properties:
                time:
                    type: string
                    description: When the agent took the sample.
                    format: date-time
                cpuPercent:
                    type: number
                    description: CPU busy time across all cores since the previous sample, 0 to 100.
                    format: double
                memoryUsedBytes:
                    type: string
                    description: Memory in use (total minus available), in bytes.
                memoryTotalBytes:
                    type: string
                    description: Total memory, in bytes.
                disks:
                    type: array
                    items:
                        $ref: '#/components/schemas/DiskUsage'
                    description: Use of each disk in the inventory.
                load1:
                    type: number
                    description: Load averages over 1, 5 and 15 minutes.
                    format: double
                load5:
                    type: number
                    description: Load average over 5 minutes.
                    format: double
                load15:
                    type: number
                    description: Load average over 15 minutes.
                    format: double
                networkRxBytesPerSecond:
                    type: string
                    description: Bytes received per second across physical interfaces.
                networkTxBytesPerSecond:
                    type: string
                    description: Bytes sent per second across physical interfaces.
                uptime:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Time since the server booted.
            description: ServerStats is one sample of a server's resource use.
        Service:
            type: object
            properties:
                app:
                    allOf:
                        - $ref: '#/components/schemas/Container'
                    description: An app from an image.
                variables:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The environment's variables the service uses, each under the name the
                         service sees it as: DATABASE_HOST=DB_HOST gives the service the
                         variable DB_HOST as DATABASE_HOST. An empty value means the variable of
                         the same name.
                secrets:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The environment's secrets the service uses, named as for variables.
                         Using a secret doesn't let anyone read it: its value goes only to the
                         servers the service runs on, and only their agents decrypt it.
                revisions:
                    readOnly: true
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The revision of each variable and secret the service uses, by the name
                         the service sees it as. Dockwell sets it when a change is planned, so a
                         service whose variable or secret changes gets a revision of its own,
                         and restarts with the new value. An edit's is ignored.
            description: |-
                Service is anything that runs in an environment, placed on servers: for
                 now an app from an image, run as one container on each server it is
                 placed on, with the labels Docker Compose gives a service's container,
                 so docker compose sees it. A Compose file becomes services, volumes and
                 networks. Websites, databases, catalog apps and jobs come later. Where it
                 runs isn't part of the spec: each revision is deployed on its servers.

                 A service uses its environment's variables and secrets by reference:
                 the environment holds each value once, and a service names the ones it
                 uses, under the names it expects. So changing a value changes every
                 service that uses it, in one plan.
        ServiceDeployment:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1", even once it has left the fleet.
                state:
                    enum:
                        - DEPLOYMENT_STATE_UNSPECIFIED
                        - DEPLOYMENT_STATE_PENDING
                        - DEPLOYMENT_STATE_LIVE
                        - DEPLOYMENT_STATE_FAILED
                        - DEPLOYMENT_STATE_SUPERSEDED
                    type: string
                    description: How the rollout went.
                    format: enum
                error:
                    type: string
                    description: Why it failed, when it did.
                updateTime:
                    type: string
                    description: When its state last moved on.
                    format: date-time
                digest:
                    type: string
                    description: |-
                        The image it ran there, as its registry knows it, such as "sha256:ab12…", so
                         what a moving tag such as :latest really was stays known. Empty until it has
                         run, and for an image no registry knows.
            description: ServiceDeployment is one revision of a service placed on one server.
        ServiceInfo:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        Its ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V". Empty for a service a
                         Compose file would make, which has none yet.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: Its kind, its environment's ID, and its name.
                revision:
                    type: string
                    description: Its latest revision.
                updateTime:
                    type: string
                    description: When its latest revision was made.
                    format: date-time
                spec:
                    allOf:
                        - $ref: '#/components/schemas/Service'
                    description: |-
                        What it runs, as its latest revision's spec has it, with sensitive values
                         blanked: an environment variable has its name and no value.
                deployments:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceDeployment'
                    description: |-
                        The latest revision on each server it is placed on, even a server that
                         has since left the fleet, which is how a surface tells that no server
                         runs it any more. Empty only on a revision that placed it nowhere.
                changeId:
                    type: string
                    description: The change that made its latest revision.
                rolledBackChangeId:
                    type: string
                    description: |-
                        The failed change that Dockwell rolled back with its latest revision,
                         when it did: the service runs what it ran before, and the deploy it
                         was asked for didn't happen.
                changeState:
                    enum:
                        - CHANGE_STATE_UNSPECIFIED
                        - CHANGE_STATE_PLANNED
                        - CHANGE_STATE_APPLYING
                        - CHANGE_STATE_APPLIED
                        - CHANGE_STATE_FAILED
                        - CHANGE_STATE_DISCARDED
                    type: string
                    description: |-
                        How the change that made its latest revision stands. A deployment still
                         pending under a change that has failed will not move again.
                    format: enum
            description: |-
                ServiceInfo is what a service runs now and how that went, as its latest
                 revision has it.
        ServiceRevision:
            type: object
            properties:
                number:
                    type: string
                    description: Its number, from 1.
                createTime:
                    type: string
                    description: 'When it was made: when its change started applying.'
                    format: date-time
                image:
                    type: string
                    description: The image it runs. Empty on a revision that deleted the service.
                deleted:
                    type: boolean
                    description: |-
                        True for a revision that deleted the service, which it may come back
                         from later.
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: |-
                        The change that made it, with who proposed and applied it, from where,
                         and its plan in brief. GetChange has the plan in full.
                changes:
                    type: array
                    items:
                        $ref: '#/components/schemas/FieldChange'
                    description: |-
                        What it changed from the revision before, as its plan says. A sensitive
                         field says that it changed, never what it holds.
                deployments:
                    type: array
                    items:
                        $ref: '#/components/schemas/ServiceDeployment'
                    description: Where it was placed, and how that went.
                matchesLatest:
                    type: boolean
                    description: |-
                        True when going back to it would do nothing: it has the spec of the latest
                         revision, on the same servers.
                rolledBackTo:
                    type: string
                    description: |-
                        The revision it put back, for a revision made by RollBackService. 0 for
                         any other.
            description: ServiceRevision is one immutable revision of a service.
        Session:
            type: object
            properties:
                id:
                    type: string
                    description: The session's ID, such as "ses_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                userAgent:
                    type: string
                    description: The browser's User-Agent when it signed in.
                address:
                    type: string
                    description: The address it was last seen from.
                createTime:
                    type: string
                    description: When it signed in.
                    format: date-time
                lastSeenTime:
                    type: string
                    description: When it last made a request.
                    format: date-time
                expireTime:
                    type: string
                    description: |-
                        When it ends unless it is revoked first: the earlier of its idle and
                         absolute limits.
                    format: date-time
                current:
                    type: boolean
                    description: True for the session making this request.
                signInMethod:
                    enum:
                        - SIGN_IN_METHOD_UNSPECIFIED
                        - SIGN_IN_METHOD_CLAIM
                        - SIGN_IN_METHOD_PASSKEY
                        - SIGN_IN_METHOD_AUTHENTICATOR_CODE
                        - SIGN_IN_METHOD_RECOVERY_CODE
                        - SIGN_IN_METHOD_LINK
                    type: string
                    description: How it signed in.
                    format: enum
                rpId:
                    type: string
                    description: 'The address it works on: "localhost" or the panel''s domain.'
            description: Session is one signed-in browser.
        SignInWithCodeRequest:
            type: object
            properties:
                email:
                    type: string
                    description: The account's email.
                code:
                    type: string
                    description: |-
                        A 6-digit code from the authenticator app, or a recovery code such as
                         "7KQ2-M9XD-4TPA-ZR3C".
            description: SignInWithCodeRequest carries an email and a code.
        SignInWithCodeResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
                usedRecoveryCode:
                    type: boolean
                    description: True when a recovery code was used. It now no longer works.
                recoveryCodesLeft:
                    type: integer
                    description: Recovery codes still unused.
                    format: int32
            description: |-
                SignInWithCodeResponse carries who signed in. The response sets the session
                 cookie.
        SignInWithLinkRequest:
            type: object
            properties:
                token:
                    type: string
                    description: The token from the link, the part after "#".
            description: SignInWithLinkRequest carries a sign-in link's token.
        SignInWithLinkResponse:
            type: object
            properties:
                user:
                    allOf:
                        - $ref: '#/components/schemas/User'
                    description: The user.
            description: |-
                SignInWithLinkResponse carries who signed in. The response sets the session
                 cookie.
        SignOutRequest:
            type: object
            properties: {}
            description: SignOutRequest takes no parameters.
        SignOutResponse:
            type: object
            properties: {}
            description: SignOutResponse is empty. The response clears the session cookie.
        Spec:
            type: object
            properties:
                project:
                    allOf:
                        - $ref: '#/components/schemas/Project'
                    description: A project, kind "project".
                environment:
                    allOf:
                        - $ref: '#/components/schemas/Environment'
                    description: An environment, kind "environment".
                service:
                    allOf:
                        - $ref: '#/components/schemas/Service'
                    description: A service, kind "service".
                container:
                    allOf:
                        - $ref: '#/components/schemas/Container'
                    description: A container run by hand on a server, kind "container".
                firewallRule:
                    allOf:
                        - $ref: '#/components/schemas/FirewallRule'
                    description: A firewall rule on a server, kind "firewall.rule".
                volume:
                    allOf:
                        - $ref: '#/components/schemas/Volume'
                    description: A volume in an environment, kind "volume".
                network:
                    allOf:
                        - $ref: '#/components/schemas/Network'
                    description: A network in an environment, kind "network".
                variable:
                    allOf:
                        - $ref: '#/components/schemas/Variable'
                    description: A variable of an environment, kind "variable".
                secret:
                    allOf:
                        - $ref: '#/components/schemas/Secret'
                    description: A secret of an environment, kind "secret".
                route:
                    allOf:
                        - $ref: '#/components/schemas/Route'
                    description: A domain or path sent to a service, kind "route".
            description: |-
                Spec is the desired state of one resource, of any kind: the field that is
                 set says which. Edits in the API carry specs in it, so one message takes
                 every kind.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StepProgress:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server it runs on.
                resourceId:
                    type: string
                    description: The resource's ID.
                resource:
                    allOf:
                        - $ref: '#/components/schemas/ResourceRef'
                    description: The resource.
                action:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: What the step does.
                    format: enum
                state:
                    enum:
                        - STEP_STATE_UNSPECIFIED
                        - STEP_STATE_QUEUED
                        - STEP_STATE_RUNNING
                        - STEP_STATE_DONE
                        - STEP_STATE_FAILED
                        - STEP_STATE_SKIPPED
                        - STEP_STATE_WAITING
                    type: string
                    description: How it is going.
                    format: enum
                message:
                    type: string
                    description: |-
                        What is happening, for people, such as "Replacing web on hz-1", or why
                         the step failed.
                startTime:
                    type: string
                    description: When it started running. Unset until then.
                    format: date-time
                finishTime:
                    type: string
                    description: When it finished. Unset until then.
                    format: date-time
                did:
                    enum:
                        - PLAN_ACTION_UNSPECIFIED
                        - PLAN_ACTION_NONE
                        - PLAN_ACTION_CREATE
                        - PLAN_ACTION_UPDATE
                        - PLAN_ACTION_REPLACE
                        - PLAN_ACTION_DELETE
                    type: string
                    description: |-
                        What the step did in the end, on this server, once it's done: action says
                         what was planned, and only the step can say this, as a pull finds out as it
                         goes. PLAN_ACTION_NONE left what runs exactly as it was. Unspecified until
                         it's done, for a step that failed, and for one a run that stopped partway had
                         done already.
                    format: enum
            description: StepProgress is one step of an applying change, and how it is going.
        Token:
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        The token's ID, such as "tok_01JD6Z3R8M9QF2K7T4XW5BNC0V". It isn't
                         secret, and it names the token in the audit log.
                name:
                    type: string
                    description: What it is for, such as "GitHub Actions deploy".
                hint:
                    type: string
                    description: |-
                        The prefix and the first and last 4 of the secret's 43 random digits,
                         such as "dwt_4f9K…x9Ta", to tell tokens apart and to recognise one in a
                         log. It can't be used to sign in.
                scope:
                    enum:
                        - TOKEN_SCOPE_UNSPECIFIED
                        - TOKEN_SCOPE_READ_ONLY
                        - TOKEN_SCOPE_READ_WRITE
                    type: string
                    description: What it may do.
                    format: enum
                createTime:
                    type: string
                    description: When it was made.
                    format: date-time
                expireTime:
                    type: string
                    description: When it stops working. Unset when it doesn't expire.
                    format: date-time
                lastUsedTime:
                    type: string
                    description: When it was last used. Unset if never.
                    format: date-time
                lastAddress:
                    type: string
                    description: |-
                        The address it was last used from, such as "203.0.113.9". Empty if
                         never.
            description: Token is an API token, without its secret.
        Totp:
            type: object
            properties:
                enabled:
                    type: boolean
                    description: True when code sign-in is on.
                recoveryCodesLeft:
                    type: integer
                    description: Recovery codes still unused.
                    format: int32
                failedAttempts:
                    type: integer
                    description: Wrong codes in a row since the last good one.
                    format: int32
                lockTime:
                    type: string
                    description: |-
                        When too many wrong codes locked code sign-in. Unset when it isn't locked.
                         Recovery codes still work while it is locked.
                    format: date-time
            description: Totp is the state of signing in with an authenticator app.
        UncheckedServer:
            type: object
            properties:
                serverId:
                    type: string
                    description: The server's ID.
                serverName:
                    type: string
                    description: The server's name, such as "hz-1".
                reason:
                    type: string
                    description: |-
                        Why, as a word an error's reason would be: "server_offline" for an
                         agent that isn't connected, or dropped while it was checked, whose
                         drift is checked once it reconnects; "agent_timeout"; "no_driver"; or
                         "agent_failed".
                message:
                    type: string
                    description: Why, for people.
            description: UncheckedServer is a server whose drift couldn't be checked.
        UndoChangeRequest:
            type: object
            properties:
                id:
                    type: string
                    description: The change's ID.
            description: UndoChangeRequest names an applied change to undo.
        UndoChangeResponse:
            type: object
            properties:
                change:
                    allOf:
                        - $ref: '#/components/schemas/Change'
                    description: A new change, planned, that puts back what the undone one did.
            description: UndoChangeResponse carries the planned undo.
        UnlockCodeSignInRequest:
            type: object
            properties: {}
            description: UnlockCodeSignInRequest takes no parameters.
        UnlockCodeSignInResponse:
            type: object
            properties: {}
            description: UnlockCodeSignInResponse is empty.
        User:
            type: object
            properties:
                id:
                    type: string
                    description: The user's ID, such as "usr_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                name:
                    type: string
                    description: What they are called, such as "Mira Chen".
                email:
                    type: string
                    description: Their email, which signs in with a code.
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ROLE_OWNER
                    type: string
                    description: What they may do.
                    format: enum
                createTime:
                    type: string
                    description: When the account was made.
                    format: date-time
            description: User is a person who signs in to the panel.
        Variable:
            type: object
            properties:
                value:
                    type: string
                    description: The value.
            description: |-
                Variable is a value of an environment that its services use, such as
                 LOG_LEVEL=info. It isn't secret: plans, history and the panel show it.
                 Keep anything that is in a Secret.
        VariableUse:
            type: object
            properties:
                serviceId:
                    type: string
                    description: The service's ID.
                service:
                    type: string
                    description: The service's name, such as "api".
                name:
                    type: string
                    description: The name the service sees it as, such as "DATABASE_URL".
            description: VariableUse is a service that uses a variable or secret.
        Volume:
            type: object
            properties:
                driver:
                    type: string
                    description: 'The volume driver: "local" unless set.'
                options:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        The driver's options, such as type, device and o for an NFS mount. They
                         may hold secrets, as a CIFS mount's password goes in o. The local driver
                         takes type none with bind, nfs, nfs4, cifs or tmpfs.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: Labels on the volume, for tools that read them.
            description: |-
                Volume is a Docker volume in an environment, which its services mount
                 by name, as a Compose file's volumes. Deleting one destroys its data,
                 though Dockwell keeps it for 7 days first. Docker can't change a volume,
                 so its spec can't change once it is made.
tags:
    - name: AuthService
      description: |-
        AuthService claims a new install, signs people in and out, and manages how
         they sign in: passkeys, an authenticator app with recovery codes, and
         sessions. See docs/adr/0011-claim-and-sign-in.md.

         GetAuthState, the claim calls and the sign-in calls work without a session.
         Every other call needs one, carried in the session cookie the sign-in calls
         set. No API token can call this service: how you sign in is changed only by
         signing in (docs/adr/0016-scoped-api-tokens.md).

         Passkey ceremonies take two calls. Begin returns WebAuthn options as JSON
         (PublicKeyCredentialCreationOptionsJSON or
         PublicKeyCredentialRequestOptionsJSON, WebAuthn Level 3) and a ceremony ID;
         Finish takes that ID and the browser's credential as JSON
         (RegistrationResponseJSON or AuthenticationResponseJSON). A ceremony works
         once and expires after 5 minutes.

         A failed call's error metadata names the reason under "Dockwell-Error", such
         as "code_rejected" or "claim_link_rejected", so clients can explain it in
         their own words; a slowed-down one also carries "Retry-After" in seconds.
         A call to any service refused for want of a session names one too:
         "unauthenticated" when it came with no session, and "session_ended" when
         its session cookie no longer works or a stream's session ended while it
         was open. A browser's request from another origin gets "origin". A call
         with an API token gets "token_rejected" when the token is unknown, revoked
         or expired, "token_scope" when its scope doesn't cover the call, and
         "needs_session" when no token may make it.
    - name: ChangeService
      description: |-
        ChangeService is the one way to change managed state, for every kind of
         resource: projects, environments, services, volumes, networks, routes,
         containers and firewall rules alike. You propose edits and get a plan back; applying the plan writes
         immutable revisions and runs its steps on the servers; undoing makes a new
         plan that puts things back. See docs/adr/0009-resources-revisions-and-plans.md
         and docs/adr/0017-the-change-api-and-the-agent-stream.md.

         Plans never show a secret: a field that may hold one says that it changed,
         never what it holds, and no response carries a spec.

         WatchChange streams, so it has no REST path. A REST client follows a
         change by polling GET /v1/changes/{id}, which carries the same progress,
         or opens the stream with Connect, gRPC or gRPC-Web, with the same
         credentials.
    - name: ComposeService
      description: |-
        ComposeService turns a Docker Compose file into a project's services,
         volumes and networks, and any of them back into one. Each file gets a
         project of its own, so two files with a service of one name run side by
         side, on networks of their own, as they do under docker compose. An
         environment is one Compose project: its containers carry the labels Docker
         Compose gives its own, so docker compose sees them, and an exported file
         runs the same with docker compose alone (PRD principle 6). See
         docs/adr/0021-the-docker-driver.md and docs/adr/0026-the-app-screens.md.
    - name: DomainService
      description: |-
        DomainService says where the domains of your routes stand: what each sends
         where, and whether its certificate is pending, issued or failed, with what
         to do when it failed. Change routes with ChangeService, as kind "route". See
         docs/adr/0024-the-caddy-ingress-driver.md.
    - name: EventService
      description: |-
        EventService is the timeline: every change to managed state, with who
         made it and from where, beside what servers and people did that belongs
         with it, such as a server joining or someone signing in. See
         docs/adr/0020-the-event-timeline.md.

         A change is one event, which moves on as the change does: planned, then
         applying, then applied or failed. Rollbacks and undos are changes of
         their own, each naming the change it reverts. A discarded change isn't
         on the timeline, and nor is the change that set up an install's default
         project and environment. Every other event comes from the audit log, as
         it was recorded.

         Events carry no secret, no spec and no address.

         WatchEvents streams, so it has no REST path. A REST client polls GET
         /v1/events, or opens the stream with Connect, gRPC or gRPC-Web, with the
         same credentials.
    - name: ResourceService
      description: |-
        ResourceService reads the resources Dockwell manages: projects,
         environments, services, volumes, networks, routes, containers and firewall
         rules.
         Change them with ChangeService.

         It names resources and says where they live, and never carries a spec,
         which may hold secrets. A spec's display_name, which never does, is the
         one exception.
    - name: ServerService
      description: |-
        ServerService lists the servers Dockwell manages and streams their live
         state, as each server's agent reports it.

         WatchServers has no REST path: REST has no way to stream messages, so a
         REST client polls ListServers or GetServer instead, and anything that wants
         the stream opens it with Connect, gRPC or gRPC-Web. See
         docs/adr/0015-rest-and-openapi-from-the-schema.md.
    - name: ServiceService
      description: |-
        ServiceService says what each service runs, where, and how its latest
         deploy went, and plans what is done to one service as a whole: another
         image, or an earlier revision. Each plan is a change, ready to apply or
         discard, as ProposeChange makes. See docs/adr/0026-the-app-screens.md.

         It blanks a spec's sensitive values, so an environment variable shows by name
         alone, and what it uses of its environment's variables and secrets by name.
         What isn't marked sensitive it shows, as seeing a command is useful: a Compose
         file that writes a variable's value there has it read back from there, which
         importing the file says (ExposedVariable).
    - name: SystemService
      description: |-
        SystemService describes the Dockwell install itself. It needs no sign-in, so
         the CLI, agents and other tools can check what they are talking to first.
    - name: TokenService
      description: |-
        TokenService manages API tokens: secrets for scripts, the CLI and
         integrations, each acting for the person who made it, within a scope. See
         docs/adr/0016-scoped-api-tokens.md.

         Send a token in the Authorization header, as "Bearer dwt_…", with REST,
         Connect, gRPC or gRPC-Web alike. A read-only token may call the methods
         whose effect is EFFECT_READ; a read-write token may also call EFFECT_PLAN
         and EFFECT_APPLY methods. No token may call an EFFECT_DESTRUCTIVE method,
         AuthService, or this service: they need a signed-in session.
    - name: VariableService
      description: |-
        VariableService reads an environment's variables and secrets, and reveals
         a secret's value to the person who asks, once they confirm it with a
         passkey. Change them with ChangeService, as edits of kind "variable" or
         "secret": each change is a plan, which lists every service that restarts
         with the new value. See docs/adr/0022-secrets-encrypted-at-rest.md.

         Services use variables and secrets by reference. Using one, which is an
         edit of the service, doesn't let anyone read it: no response carries a
         secret's value but RevealSecret's, which needs a signed-in session, and
         no API token can call it.

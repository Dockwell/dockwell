    /v1/sessions:beginStepUp:
        post:
            tags:
                - AuthService
            description: |-
                BeginStepUp starts confirming, with a passkey you have for the address
                 of this request, an action that needs a person right now: revealing a
                 secret, or changing how you sign in or your API tokens. Pass the
                 passkey's answer to FinishStepUp.

                 Call the action without a proof first. It checks everything else, such
                 as the last way in or a token's name, and only then refuses with the
                 reason needs_step_up. Step up, and call it again with the proof, which
                 the action spends only once nothing else refuses it.
            operationId: AuthService_BeginStepUp
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BeginStepUpRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BeginStepUpResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/sessions:finishPasskeySignIn:
        post:
            tags:
                - AuthService
            description: FinishPasskeySignIn checks the passkey's signature and signs in.
            operationId: AuthService_FinishPasskeySignIn
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinishPasskeySignInRequest'
                required: true
            responses:

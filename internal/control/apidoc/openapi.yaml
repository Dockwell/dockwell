                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys/{id}:remove:
        post:
            tags:
                - AuthService
            description: |-
                RemovePasskey removes one of your passkeys. It needs a proof from
                 FinishStepUp for removing it. It refuses to remove your last way to sign
                 in.
            operationId: AuthService_RemovePasskey
            parameters:
                - name: id
                  in: path
                  description: The passkey's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RemovePasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RemovePasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:beginAdd:
        post:
            tags:
                - AuthService
            description: |-
                BeginAddPasskey starts adding a passkey for the address of this request.
                 It needs a proof from FinishStepUp for adding a passkey, made with a
                 passkey you have for this address. A sign-in in the last 10 minutes
                 that needed no passkey here confirms one passkey instead, so you can
                 add one when you have none here: a link from dockwell recover, a
                 recovery code, or a code from an authenticator app when no passkey is
                 registered for this address.
            operationId: AuthService_BeginAddPasskey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BeginAddPasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BeginAddPasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/passkeys:finishAdd:
        post:
            tags:
                - AuthService
            description: |-
                FinishAddPasskey saves the new passkey. One a sign-in confirmed is
                 checked again: still within its 10 minutes, and the first since.
            operationId: AuthService_FinishAddPasskey
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinishAddPasskeyRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FinishAddPasskeyResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/resources:
        get:
            tags:
                - ResourceService
            description: |-
                ListResources returns the resources that exist now, of every kind or
                 of one, oldest first, a page at a time. Deleted resources aren't in
                 it.
            operationId: ResourceService_ListResources
            parameters:
                - name: kind
                  in: query
                  description: |-
                    Only resources of this kind, such as "project" or "environment". Empty
                     means every kind.
                  schema:
                    type: string
                - name: scope
                  in: query
                  description: |-
                    Only resources that live in this scope, by ID, such as a project's
                     environments. Empty means every scope.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many resources to return: 200 when unset, and at most 1000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListResourcesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/secrets/{id}:reveal:
        post:
            tags:
                - VariableService
            description: |-
                RevealSecret returns a secret's latest value. It needs a signed-in
                 session and a proof from FinishStepUp for this secret, made with a
                 passkey moments before, which works once. No API token can call it.
                 Every reveal is in the audit log.
            operationId: VariableService_RevealSecret
            parameters:
                - name: id
                  in: path
                  description: The secret's ID, such as "sec_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RevealSecretRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RevealSecretResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers:
        get:
            tags:
                - ServerService
            description: ListServers returns every server, connected or not, without history.
            operationId: ServerService_ListServers
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServersResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/servers/{id}:
        get:
            tags:
                - ServerService
            description: GetServer returns one server, with its recent history.
            operationId: ServerService_GetServer
            parameters:
                - name: id
                  in: path
                  description: The server's ID, such as "srv_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetServerResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services:
        get:
            tags:
                - ServiceService
            description: |-
                ListServices returns the services that exist now, in every environment
                 or one, oldest first, a page at a time.
            operationId: ServiceService_ListServices
            parameters:
                - name: project
                  in: query
                  description: |-
                    The project of the environment, by name or ID, when environment is a
                     name and there are several projects.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    Only the services of this environment, by name or ID. Empty means every
                     environment.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many services to return: 200 when unset, and at most 1000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServicesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}/ports:
        post:
            tags:
                - ServiceService
            description: |-
                AddServicePort plans publishing one more port, with the rest of the
                 service as it is: like DeployService, it needs no one to read the service's
                 environment back.
            operationId: ServiceService_AddServicePort
            parameters:
                - name: id
                  in: path
                  description: The service, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AddServicePortRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AddServicePortResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}/revisions:
        get:
            tags:
                - ServiceService
            description: |-
                ListServiceRevisions returns a service's revisions, newest first, a page
                 at a time: what each changed, who made it and from where, and how each
                 deployed. A service goes by its ID, or by its name where that is enough
                 to say which.
            operationId: ServiceService_ListServiceRevisions
            parameters:
                - name: id
                  in: path
                  description: The service, by ID, such as "svc_01JD6Z3R8M9QF2K7T4XW5BNC0V", or by name.
                  required: true
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many revisions to return: 20 when unset, and at most 100.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Empty starts
                     with the latest.
                  schema:
                    type: string
                - name: project
                  in: query
                  description: |-
                    The project of a service named by name, by name or ID, when more than one
                     has a service of that name.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: |-
                    The environment of a service named by name, by name or ID, when its
                     project has more than one.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServiceRevisionsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}:deploy:
        post:
            tags:
                - ServiceService
            description: |-
                DeployService plans running another image, with the rest of the service
                 as it is: its environment, ports and mounts need no one to read them
                 back, so anyone may deploy without being able to see a secret.
            operationId: ServiceService_DeployService
            parameters:
                - name: id
                  in: path
                  description: The service, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeployServiceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeployServiceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}:rollback:
        post:
            tags:
                - ServiceService
            description: |-
                RollBackService plans putting a service back as an earlier revision had
                 it, on the servers that revision ran on that are still in the fleet.
                 Unlike UndoChange it takes any earlier revision, and touches this
                 service alone, whatever else the change that made the revision did. It
                 brings back the spec, not the data in a volume, which the plan's notes
                 say, nor the value of a variable or secret it uses, which stays the latest:
                 change that value to go back on it. It refuses only what would do nothing
                 on the record and on every server. A revision that matches the latest on
                 the record (matches_latest) still plans what puts it back, when a rollback
                 failed or a container was removed by hand.
            operationId: ServiceService_RollBackService
            parameters:
                - name: id
                  in: path
                  description: The service, by ID or by name.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RollBackServiceRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RollBackServiceResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/sessions:

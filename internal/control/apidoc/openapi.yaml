            operationId: BackupService_DeleteBackup
            parameters:
                - name: id
                  in: path
                  description: The backup's ID.
                  required: true
                  schema:
                    type: string
                - name: serverOnly
                  in: query
                  description: |-
                    Remove it from its server's disk alone, and keep it on its destination, from
                     where it can be fetched. Without this it goes from both.
                  schema:
                    type: boolean
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteBackupResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/backups/{id}:fetch:
        post:
            tags:
                - BackupService
            description: |-
                FetchBackup brings a backup back from its destination onto a server that has the
                 volume, to restore there: the one it came from, or another once that's gone. It
                 returns the backup, whose server is the one it's fetching to. It reads the backup
                 back whole before it counts. The server has to be connected.
            operationId: BackupService_FetchBackup
            parameters:
                - name: id
                  in: path
                  description: The backup's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FetchBackupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FetchBackupResponse'

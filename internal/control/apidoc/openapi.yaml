    /v1/catalog/installs/{id}:upgrade:
        post:
            tags:
                - CatalogService
            description: |-
                UpgradeCatalogInstall plans moving an install to the newest release of its
                 entry, ready to apply or discard, as a three-way merge of the entry's old file,
                 its new one and what runs. What the file gave and the new one changes follows
                 the new one, what the new one dropped goes, and what a person added or changed
                 stays, with anything else in the environment left alone. Where a person and the
                 release both changed one thing, the person's stays and the plan says so, but for
                 the image. Its secrets stay as they are, and the plan says that no backup is
                 taken, as Dockwell can't take one yet. Undoing it puts the old version back, but
                 not what the new one changed in its data. It's refused with the reason up_to_date
                 when there's nothing newer, and no_record for an install from before Dockwell
                 kept what its file gave.
            operationId: CatalogService_UpgradeCatalogInstall
            parameters:
                - name: id
                  in: path
                  description: Its project, by name or ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpgradeCatalogInstallRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpgradeCatalogInstallResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes:
        get:
            tags:
                - ChangeService
            description: |-
                ListChanges returns changes, newest first, a page at a time. Each
                 change's plan is in brief: its fingerprint, summary, undo window and
                 whether it is destructive. GetChange has the plan in full.
            operationId: ChangeService_ListChanges
            parameters:
                - name: pageSize
                  in: query
                  description: 'How many changes to return: 50 when unset, and at most 200.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Empty starts
                     with the newest.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListChangesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - ChangeService
            description: |-
                ProposeChange plans a set of edits and records them as a planned
                 change, ready to apply or discard. Planning asks each server's agent
                 what the edits would take there, and changes nothing on any server. The
                 same edits against the same state give the same plan, and the same
                 fingerprint unless they edit a kind that may hold secrets, which each
                 change digests for itself.

                 An edit that sets a secret's value is a rotation: it plans as a change,
                 and restarts what uses the secret, whatever the value is. So a plan
                 never says whether it is the value already there. Any other sensitive
                 field, such as a container's environment, compares as usual: an equal
                 value is no change, and a plan masks one that differs.
            operationId: ChangeService_ProposeChange
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ProposeChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ProposeChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:
        get:
            tags:
                - ChangeService
            description: |-
                GetChange returns one change, with its plan and the progress of each of
                 its steps.
            operationId: ChangeService_GetChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID, such as "chg_01JD6Z3R8M9QF2K7T4XW5BNC0V".
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:apply:
        post:
            tags:
                - ChangeService
            description: |-
                ApplyChange carries out a planned change. It plans again, and refuses
                 if any resource changed since, or if the servers no longer match the
                 plan; either way, propose the edits again and review the new plan.
                 Otherwise it commits the change's revisions and starts running its
                 steps, and returns the change as it starts applying. The steps run to
                 an end whether or not the caller waits. Follow them with WatchChange,
                 or by polling GetChange. If a step fails, Dockwell starts rolling back what
                 was done, in a change of its own, named in rolled_back_by. That runs on after
                 this change has failed, may wait for a server, and may fail too, so read
                 rollback_status for how it went.

                 A plan that destroys data, may cut off access, or lets two containers
                 write to one place needs the fingerprint of the plan you reviewed, and a
                 signed-in session: no API token may apply one.
            operationId: ChangeService_ApplyChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ApplyChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ApplyChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:discard:
        post:
            tags:
                - ChangeService
            description: |-
                DiscardChange drops a planned change without applying it. The change
                 stays on record as discarded.
            operationId: ChangeService_DiscardChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DiscardChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DiscardChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/changes/{id}:undo:
        post:
            tags:
                - ChangeService
            description: |-
                UndoChange plans putting back everything an applied change did, as a
                 new change; apply it to carry it out. It is refused once the change is
                 older than its undo window, or when a resource it touched has changed
                 again since: undo that later change first, or edit the resource.
            operationId: ChangeService_UndoChange
            parameters:
                - name: id
                  in: path
                  description: The change's ID.
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UndoChangeRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UndoChangeResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'

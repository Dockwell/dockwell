                  description: |-
                    Only the services of this environment, by name or ID. Empty means every
                     environment.
                  schema:
                    type: string
                - name: pageSize
                  in: query
                  description: 'How many services to return: 200 when unset, and at most 1000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListServicesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}/logSources:
        get:
            tags:
                - LogService
            description: |-
                ListLogSources returns the containers a service has logs from, on every
                 server it runs on or ran on: those Docker has, running or stopped, and
                 those the server kept after they were removed.
            operationId: LogService_ListLogSources
            parameters:
                - name: id
                  in: path
                  description: |-
                    The service, by ID or by name. A name needs its project and environment
                     only once there is a choice of them.
                  required: true
                  schema:
                    type: string
                - name: project
                  in: query
                  description: The project a service's name is in, by name or ID.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: The environment a service's name is in, by name or ID.
                  schema:
                    type: string
                - name: server
                  in: query
                  description: |-
                    A server's ID or name, to read a container Dockwell didn't make there
                     instead of a service. id is then the container, by its name or its full ID.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListLogSourcesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/services/{id}/logs:
        get:
            tags:
                - LogService
            description: |-
                ReadLogs returns a page of a service's log lines, the newest first
                 among pages, and in time order within one. It can search what the
                 servers still have, by a query or by level.
            operationId: LogService_ReadLogs
            parameters:
                - name: id
                  in: path
                  description: |-
                    The service, by ID or by name. A name needs its project and environment
                     only once there is a choice of them.
                  required: true
                  schema:
                    type: string
                - name: project
                  in: query
                  description: The project a service's name is in, by name or ID.
                  schema:
                    type: string
                - name: environment
                  in: query
                  description: The environment a service's name is in, by name or ID.
                  schema:
                    type: string
                - name: since
                  in: query
                  description: Only lines written at or after this time.
                  schema:
                    type: string
                    format: date-time
                - name: until
                  in: query
                  description: Only lines written at or before this time.
                  schema:
                    type: string
                    format: date-time
                - name: last
                  in: query
                  description: |-
                    Only lines from this long ago until now, by each server's clock, which
                     is the clock its lines' times are on, such as "900s". Set it in place of
                     since.
                  schema:
                    pattern: ^-?(?:0|[1-9][0-9]{0,11})(?:\.[0-9]{1,9})?s$
                    type: string
                    description: Represents a a duration between -315,576,000,000s and 315,576,000,000s (around 10000 years). Precision is in nanoseconds. 1 nanosecond is represented as 0.000000001s
                - name: pageSize
                  in: query
                  description: 'How many lines to return: 1000 when unset, and at most 5000.'
                  schema:
                    type: integer
                    format: int32
                - name: pageToken
                  in: query
                  description: |-
                    Where to start: the next_page_token of the page before. Pass the same
                     filters with it.
                  schema:
                    type: string
                - name: sourceIds
                  in: query
                  description: Only lines from these sources, by LogSource's id.
                  schema:
                    type: array
                    items:
                        type: string
                - name: revision
                  in: query
                  description: Only lines from containers this revision made.
                  schema:
                    type: string
                - name: changeId
                  in: query
                  description: Only lines from containers this change made.
                  schema:
                    type: string
                - name: levels
                  in: query
                  description: |-
                    Only lines of these levels. A line with no level counts as info, and
                     the indented lines after one, such as a stack trace, take its level.
                  schema:
                    type: array
                    items:
                        enum:
                            - LOG_LEVEL_UNSPECIFIED
                            - LOG_LEVEL_DEBUG
                            - LOG_LEVEL_INFO
                            - LOG_LEVEL_WARN
                            - LOG_LEVEL_ERROR
                        type: string
                        format: enum
                - name: query
                  in: query
                  description: |-
                    Only lines that hold this text, in any case, of at most 1 KiB. It is
                     plain text, not a pattern. Each server scans what it still has for it: at
                     most the newest 1,000,000 lines of each container, and for at most 30
                     seconds.
                  schema:
                    type: string
                - name: server
                  in: query
                  description: |-
                    A server's ID or name, to read a container Dockwell didn't make there
                     instead of a service. id is then the container, by its name or its full ID.
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ReadLogsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'

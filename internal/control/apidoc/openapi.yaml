            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/FinishClaimRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/FinishClaimResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:

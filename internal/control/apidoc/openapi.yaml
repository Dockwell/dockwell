                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SetInstallNameResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/settings:setTimeZone:
        post:
            tags:
                - SettingsService
            description: |-
                SetTimeZone sets the time zone a new schedule starts in, such as a
                 backup's, when it comes without one of its own. A schedule keeps the zone
                 it was made with, so this moves none. An empty zone clears it, and new
                 schedules start in UTC again.
            operationId: SettingsService_SetTimeZone
            requestBody:
                content:
                    application/json:

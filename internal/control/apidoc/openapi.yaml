                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:beginSetup:
        post:
            tags:
                - AuthService
            description: |-
                BeginTotpSetup makes a new authenticator secret. It needs a proof from
                 FinishStepUp for setting up code sign-in. The secret takes effect only
                 once ConfirmTotpSetup checks a code from it, in this session, within
                 10 minutes.
            operationId: AuthService_BeginTotpSetup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/BeginTotpSetupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/BeginTotpSetupResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:cancelSetup:
        post:
            tags:
                - AuthService
            description: |-
                CancelTotpSetup forgets the setup this session began, so its secret
                 works nowhere. It does nothing when none is waiting.
            operationId: AuthService_CancelTotpSetup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CancelTotpSetupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CancelTotpSetupResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:confirmSetup:
        post:
            tags:
                - AuthService
            description: |-
                ConfirmTotpSetup checks a code from the new secret, turns code sign-in
                 on, and returns new recovery codes. They are shown once. Only the
                 session that began the setup can, and 5 wrong codes end it, so it needs
                 a new step-up.
            operationId: AuthService_ConfirmTotpSetup
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ConfirmTotpSetupRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ConfirmTotpSetupResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:disable:
        post:
            tags:
                - AuthService
            description: |-
                DisableTotp turns code sign-in off and deletes the secret and recovery
                 codes. It needs a proof from FinishStepUp for turning code sign-in off.
                 It refuses when that would leave no way to sign in.
            operationId: AuthService_DisableTotp
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DisableTotpRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DisableTotpResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/totp:regenerateRecoveryCodes:
        post:
            tags:
                - AuthService
            description: |-
                RegenerateRecoveryCodes replaces your recovery codes. The old ones stop
                 working. It needs a proof from FinishStepUp for making recovery codes.
            operationId: AuthService_RegenerateRecoveryCodes
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RegenerateRecoveryCodesRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/RegenerateRecoveryCodesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'

# SPDX-License-Identifier: AGPL-3.0-only
id: memos
name: Memos
summary: Quick notes you write like posts, and find again
description: |-
  Memos is a place for short notes, ideas and the things you want to find again. Write entries in a timeline, organize them with tags, and attach files without turning every thought into a document.

  This entry stores your notes and uploaded files on a persistent volume. Create the first account after installation and choose which notes to keep private or share.
icon: media/memos-icon.webp
documentation: https://www.usememos.com/docs
appSource: https://github.com/usememos/memos
features:
  - "A timeline for quick notes"
  - "Markdown and tags"
  - "File and image attachments"
  - "Private and shared notes"
screenshots:
  - path: media/memos-timeline.webp
    caption: "Notes and tags in the Memos timeline"
    source: https://raw.githubusercontent.com/usememos/.github/13198225b2ef8e961c615f86b2a04278ffd706cf/assets/previews/timeline-light.png
category: notes
version: "0.31.0"
release: 3
homepage: https://usememos.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/catalog
  path: entries/memos.yaml
web:
  service: memos
firstSteps: "Turn off registration in its settings once your account is made."
firstVisitorOwns: true
inputs:
  - name: PORT
    label: Port on this server
    type: INPUT_TYPE_PORT
    defaultValue: "5230"
compose: |
  services:
    memos:
      image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT}:5230"
      volumes:
        - data:/var/opt/memos
      healthcheck:
        # Its /healthz in this version doesn't ask its database, and its profile does.
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/api/v1/instance/profile"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 10s
  volumes:
    data: {}

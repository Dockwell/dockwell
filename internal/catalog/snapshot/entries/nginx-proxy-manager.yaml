# SPDX-License-Identifier: AGPL-3.0-only
id: nginx-proxy-manager
name: Nginx Proxy Manager
summary: Reverse proxy with a web console and Let's Encrypt
description: |-
  Nginx Proxy Manager gives you a web interface for reverse-proxy routes and TLS certificates. Point hostnames at the services you run, manage access lists, and configure redirects without editing Nginx files by hand.

  This is a separate proxy server. Check its published ports alongside Dockwell's own ingress before applying the installation plan.
icon: media/nginx-proxy-manager-icon.webp
documentation: https://nginxproxymanager.com/guide/
appSource: https://github.com/NginxProxyManager/nginx-proxy-manager
features:
  - "Proxy hosts and redirects"
  - "Let's Encrypt certificate management"
  - "Access lists for protected services"
  - "A web console for proxy configuration"
screenshots:
  - path: media/nginx-proxy-manager-hosts.webp
    caption: "Manage proxy hosts in Nginx Proxy Manager"
    source: https://raw.githubusercontent.com/NginxProxyManager/nginx-proxy-manager/5b7e34eb67d35aa91dd3fe3818525caa42cfeca5/docs/src/public/screenshots/light/04_proxy-hosts.png
  - path: media/nginx-proxy-manager-dashboard.webp
    caption: "Proxy hosts, streams and access lists at a glance"
    source: https://raw.githubusercontent.com/NginxProxyManager/nginx-proxy-manager/5b7e34eb67d35aa91dd3fe3818525caa42cfeca5/docs/src/public/screenshots/light/03_dashboard.png
category: networking
version: "2.16.0"
release: 3
homepage: https://nginxproxymanager.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/catalog
  path: entries/nginx-proxy-manager.yaml
web:
  service: proxy
signIn:
  userInput: "ADMIN_EMAIL"
  passwordInput: "ADMIN_PASSWORD"
  changedIn: "the console"
inputs:
  - name: ADMIN_EMAIL
    label: Your email
    type: INPUT_TYPE_EMAIL
  - name: ADMIN_PORT
    label: Console port
    type: INPUT_TYPE_PORT
    defaultValue: "8881"
  - name: HTTP_PORT
    label: HTTP port
    hint: Choose 80 for public sites, once nothing else holds it.
    type: INPUT_TYPE_PORT
    defaultValue: "8880"
  - name: HTTPS_PORT
    label: HTTPS port
    hint: Choose 443 for public sites, once nothing else holds it.
    type: INPUT_TYPE_PORT
    defaultValue: "8443"
  - name: ADMIN_PASSWORD
    setOnce: true
    label: Console password
    type: INPUT_TYPE_SECRET
    generate: 32
    logged: true
compose: |
  services:
    proxy:
      image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
      restart: unless-stopped
      environment:
        INITIAL_ADMIN_EMAIL: ${ADMIN_EMAIL}
        INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${ADMIN_PORT}:81"
        - "${HTTP_PORT}:80"
        - "${HTTPS_PORT}:443"
      volumes:
        - data:/data
        - letsencrypt:/etc/letsencrypt
      healthcheck:
        test: ["CMD", "/usr/bin/check-health"]
        interval: 10s
        timeout: 5s
        retries: 18
  volumes:
    data: {}
    letsencrypt: {}

# SPDX-License-Identifier: AGPL-3.0-only
id: coder
name: Coder
summary: Development environments on your servers, made from templates
category: developer tools
version: "2.38.2"
release: 1
homepage: https://coder.com
license: AGPL-3.0-only
appLicense: AGPL-3.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/coder.yaml
web:
  service: coder
hostAccess: >-
  Docker's socket, so Coder can start your workspaces as containers on this server.
  Whoever controls Docker controls the server.
firstSteps: >-
  Coder answers over plain HTTP, so signing in from outside this server sends your
  password in clear, and the first person to open it makes its owner account. Add a
  domain first, or reach it another way, such as a VPN or an SSH
  tunnel. Then open it and make your account. Once it has a domain, set
  CODER_ACCESS_URL on the coder service to that address, so your workspaces reach it
  there.
inputs:
  - name: PORT
    label: Coder port
    hint: You open Coder on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "7080"
  - name: ACCESS_URL
    label: Access URL
    hint: >-
      Where you and your workspaces reach Coder. Workspaces on this server reach
      localhost through Docker's host gateway. Once you add a domain, use that, such as
      https://coder.example.com.
    type: INPUT_TYPE_TEXT
    defaultValue: http://localhost:7080
  - name: POSTGRES_PASSWORD
    label: Database password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    coder:
      image: ghcr.io/coder/coder:v2.38.2@sha256:ab17fc8e172e0f489cc1a67f513a506a49583ff692835601a614e20bb83ad34a
      restart: unless-stopped
      # Docker's socket belongs to a group whose number differs on each server, which no
      # form can know. Root in the container reaches it anywhere, and is no more than
      # the socket gives it.
      user: root
      depends_on:
        db:
          condition: service_healthy
      environment:
        CODER_HTTP_ADDRESS: 0.0.0.0:7080
        CODER_ACCESS_URL: ${ACCESS_URL}
        CODER_PG_CONNECTION_URL: postgresql://coder@db:5432/coder?sslmode=disable
        PGPASSWORD: ${POSTGRES_PASSWORD}
      ports:
        - "${PORT}:7080"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
        - home:/home/coder
      healthcheck:
        test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:7080/healthz"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 30s
    db:
      image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
      restart: unless-stopped
      environment:
        POSTGRES_USER: coder
        POSTGRES_DB: coder
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "coder", "-d", "coder"]
        interval: 5s
        timeout: 5s
        retries: 12
  volumes:
    home: {}
    data: {}

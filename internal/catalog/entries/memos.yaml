# SPDX-License-Identifier: AGPL-3.0-only
id: memos
name: Memos
summary: Quick notes you write like posts, and find again
category: notes
version: "0.31.0"
release: 1
homepage: https://usememos.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/memos.yaml
web:
  service: memos
firstSteps: >-
  Memos answers only on this server until you add a domain, as the first person to
  open it makes its admin account. So make yours first, through an SSH tunnel from
  your computer: ssh -N -L 5230:127.0.0.1:5230 you@your-server, using the port you
  gave it, then open http://localhost:5230, and turn off registration in its
  settings, so no one else can make one. Add a domain on its page only after that,
  over HTTPS or behind your tunnel, as a new domain's certificate shows in public
  logs within minutes.
inputs:
  - name: PORT
    label: Port on this server
    hint: Only this server reaches it. To reach it from elsewhere, add a domain once it runs.
    type: INPUT_TYPE_PORT
    defaultValue: "5230"
compose: |
  services:
    memos:
      image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT}:5230"
      volumes:
        - data:/var/opt/memos
      healthcheck:
        # Its /healthz in this version doesn't ask its database, and its profile does.
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/api/v1/instance/profile"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 10s
  volumes:
    data: {}

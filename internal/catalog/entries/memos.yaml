# SPDX-License-Identifier: AGPL-3.0-only
id: memos
name: Memos
summary: Quick notes you write like posts, and find again
category: notes
version: "0.31.0"
release: 1
homepage: https://usememos.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/memos.yaml
web:
  service: memos
firstSteps: >-
  Memos answers over plain HTTP, so signing in from outside this server sends your
  password in clear, and the first person to open it makes its admin account. Add a
  domain first, or reach it another way, such as a VPN or an SSH tunnel. Then open it
  and make your account, and turn off registration in its settings, so no one else
  can make one.
inputs:
  - name: PORT
    label: Memos port
    hint: You open Memos on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "5230"
compose: |
  services:
    memos:
      image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
      restart: unless-stopped
      ports:
        - "${PORT}:5230"
      volumes:
        - data:/var/opt/memos
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5230/healthz"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 10s
  volumes:
    data: {}

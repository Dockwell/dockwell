# SPDX-License-Identifier: AGPL-3.0-only
id: n8n
name: n8n
summary: Automate workflows across your tools
category: automation
version: "2.44.6"
release: 1
homepage: https://n8n.io
license: AGPL-3.0-only
appLicense: Sustainable Use
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/n8n.yaml
web:
  service: n8n
firstSteps: >-
  n8n signs you in only over HTTPS, or from this server itself, so add a domain over
  HTTPS first. Then open it there: the first person to open it makes its owner
  account. Set WEBHOOK_URL on the n8n service to that address, so the webhooks it
  shows use it. n8n keeps the key that encrypts your credentials on its volume, so a
  backup of the volume holds both.
inputs:
  - name: PORT
    label: n8n port
    hint: You open n8n on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "5678"
compose: |
  services:
    n8n:
      image: n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
      restart: unless-stopped
      environment:
        N8N_LISTEN_ADDRESS: 0.0.0.0
        N8N_PORT: "5678"
      ports:
        - "${PORT}:5678"
      volumes:
        - data:/home/node/.n8n
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5678/healthz"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 30s
  volumes:
    data: {}

# SPDX-License-Identifier: AGPL-3.0-only
id: plausible
name: Plausible
summary: Cookie-free web analytics
category: analytics
version: "3.2.1"
release: 1
homepage: https://plausible.io/self-hosted-web-analytics
license: AGPL-3.0-only
appLicense: AGPL-3.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/plausible.yaml
web:
  service: plausible
firstSteps: >-
  Plausible answers over plain HTTP, so signing in from outside this server sends your
  password in clear, and the first person to open it makes its account. Add a domain
  first, or reach it another way, such as a VPN or an SSH tunnel, and set BASE_URL on
  the plausible service to where you open it, as its pages take nothing from anywhere
  else. Then open it and register. Leave the POSTGRES_PASSWORD secret as it is: its
  database keeps the password it started with, and Plausible would then use one it
  doesn't take. Changing SECRET_KEY_BASE signs everyone out and loses two-factor
  sign-in.
inputs:
  - name: PORT
    label: Plausible port
    hint: You open Plausible on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "8000"
  - name: BASE_URL
    label: Address you open it at
    hint: >-
      Plausible's pages and your sites' tracker use this, such as
      https://stats.example.com once you add a domain.
    type: INPUT_TYPE_TEXT
    defaultValue: http://localhost:8000
  - name: SECRET_KEY_BASE
    label: Secret key
    type: INPUT_TYPE_SECRET
    generate: 64
  - name: POSTGRES_PASSWORD
    label: Database password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    plausible:
      image: ghcr.io/plausible/community-edition:v3.2.1@sha256:33e60bfb40f2df5da00f8753b76fad04f67dba3abe6d73eb516e440e3fb62985
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
        events:
          condition: service_healthy
      # Its database is named by a URL alone, so a shell writes that from the secret as
      # it starts, and a rotation reaches it. Then it makes and migrates what it keeps.
      command: ["sh", "-c", "export DATABASE_URL=\"postgres://plausible:$$POSTGRES_PASSWORD@db:5432/plausible\" && /entrypoint.sh db createdb && /entrypoint.sh db migrate && exec /entrypoint.sh run"]
      environment:
        BASE_URL: ${BASE_URL}
        SECRET_KEY_BASE: ${SECRET_KEY_BASE}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        CLICKHOUSE_DATABASE_URL: http://events:8123/plausible_events_db
        TMPDIR: /var/lib/plausible/tmp
      ports:
        - "${PORT}:8000"
      volumes:
        - data:/var/lib/plausible
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/system/health/ready"]
        interval: 10s
        timeout: 5s
        retries: 24
        start_period: 60s
    db:
      image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
      restart: unless-stopped
      environment:
        POSTGRES_USER: plausible
        POSTGRES_DB: plausible
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - db:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "plausible", "-d", "plausible"]
        interval: 5s
        timeout: 5s
        retries: 12
    events:
      image: clickhouse/clickhouse-server:24.12.6.70-alpine@sha256:cd450891db46cc6ffe313ca2b0fb7dbfb897a6873ca74a724cbe050a2cf62621
      restart: unless-stopped
      # Plausible's own settings for a small server, which its Compose file mounts:
      # warnings alone in the log, only the system log it reads, IPv4, and less memory.
      command: ["sh", "-c", "printf '%s' \"$$PLAUSIBLE_SERVER_XML\" >/etc/clickhouse-server/config.d/plausible.xml && printf '%s' \"$$PLAUSIBLE_USERS_XML\" >/etc/clickhouse-server/users.d/plausible.xml && exec /entrypoint.sh"]
      environment:
        CLICKHOUSE_SKIP_USER_SETUP: "1"
        PLAUSIBLE_SERVER_XML: '<clickhouse><logger><level>warning</level><console>true</console></logger><listen_host>0.0.0.0</listen_host><mark_cache_size>524288000</mark_cache_size><query_log replace="1"><database>system</database><table>query_log</table><flush_interval_milliseconds>7500</flush_interval_milliseconds><engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_time) TTL event_date + interval 30 day SETTINGS ttl_only_drop_parts=1</engine></query_log><metric_log remove="remove"/><asynchronous_metric_log remove="remove"/><query_thread_log remove="remove"/><text_log remove="remove"/><trace_log remove="remove"/><session_log remove="remove"/><part_log remove="remove"/></clickhouse>'
        PLAUSIBLE_USERS_XML: '<clickhouse><profiles><default><max_threads>1</max_threads><max_block_size>8192</max_block_size><max_download_threads>1</max_download_threads><input_format_parallel_parsing>0</input_format_parallel_parsing><output_format_parallel_formatting>0</output_format_parallel_formatting></default></profiles></clickhouse>'
      volumes:
        - events:/var/lib/clickhouse
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
        interval: 5s
        timeout: 5s
        retries: 24
  volumes:
    data: {}
    db: {}
    events: {}

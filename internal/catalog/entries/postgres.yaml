# SPDX-License-Identifier: AGPL-3.0-only
id: postgres
name: PostgreSQL
summary: Relational database, with Adminer to manage it
description: |-
  PostgreSQL is a relational database for applications that need reliable SQL storage, transactions and flexible queries. It supports structured records, JSON data and a large ecosystem of extensions and client libraries.

  This entry includes Adminer as a lightweight browser interface. Dockwell generates the initial database password and keeps database files on a persistent volume.
icon: /catalog-media/postgres-icon.webp
documentation: https://www.postgresql.org/docs/
appSource: https://github.com/postgres/postgres
features:
  - "SQL queries and transactions"
  - "JSON data and extensible types"
  - "Included Adminer database browser"
  - "Persistent database storage"
screenshots:
  - path: /catalog-media/adminer-table.webp
    caption: "Table browser in Adminer, included with this install"
    source: https://www.adminer.org/static/screenshots/table.webp
category: databases
version: "17.11"
release: 2
homepage: https://www.postgresql.org
license: AGPL-3.0-only
appLicense: PostgreSQL
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/postgres.yaml
web:
  service: adminer
firstSteps: >-
  Adminer answers over plain HTTP, so signing in from outside this server sends the
  database's password in clear. Add a domain first, or reach it another way, such as
  a VPN or an SSH tunnel. Then open Adminer and choose PostgreSQL as its system. Sign
  in to server db as user postgres, with the password in the POSTGRES_PASSWORD secret.
  That secret sets the password on first start only, so changing it doesn't change
  what signs in. To change the password, run ALTER USER postgres PASSWORD 'new' in
  Adminer, then set the secret to match.
inputs:
  - name: ADMIN_PORT
    label: Adminer port
    hint: You open Adminer on this port of the server. It asks for the database's password.
    type: INPUT_TYPE_PORT
    defaultValue: "8081"
  - name: POSTGRES_PASSWORD
    label: Database password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    db:
      image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
      restart: unless-stopped
      environment:
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "postgres"]
        interval: 5s
        timeout: 5s
        retries: 12
    adminer:
      image: adminer:6.2.0@sha256:400af848ac3f57938abde4867677df1b195674d232c8896a27d111d04b9c088c
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      environment:
        ADMINER_DEFAULT_SERVER: db
      ports:
        - "${ADMIN_PORT}:8080"
      healthcheck:
        test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
        interval: 5s
        timeout: 5s
        retries: 12
  volumes:
    data: {}

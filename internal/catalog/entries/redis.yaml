# SPDX-License-Identifier: AGPL-3.0-only
id: redis
name: Redis
summary: In-memory data store for caches, queues and sessions
category: databases
version: "8.10.2"
release: 1
homepage: https://redis.io
license: AGPL-3.0-only
appLicense: AGPL-3.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/redis.yaml
firstSteps: >-
  Redis asks for the password in the REDIS_PASSWORD secret. A service in its own
  project reaches it at redis:6379, and this server itself at 127.0.0.1 on its port.
  A container in any other project reaches neither, so for one that needs Redis, add a
  port on its page. Redis reads that secret each time it starts, so changing the secret
  changes the password. It keeps what you write on its volume, in an append-only file.
inputs:
  - name: PORT
    label: Port on this server
    hint: This server reaches Redis on 127.0.0.1 at this port. Its containers don't, as its first steps say.
    type: INPUT_TYPE_PORT
    defaultValue: "6379"
  - name: REDIS_PASSWORD
    label: Password
    type: INPUT_TYPE_SECRET
    generate: 32
databases: [redis]
compose: |
  services:
    redis:
      image: redis:8.10.2@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
      restart: unless-stopped
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
      environment:
        REDISCLI_AUTH: ${REDIS_PASSWORD}
      ports:
        - "127.0.0.1:${PORT}:6379"
      volumes:
        - data:/data
      healthcheck:
        test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
        interval: 5s
        timeout: 5s
        retries: 12
  volumes:
    data: {}

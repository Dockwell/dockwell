# SPDX-License-Identifier: AGPL-3.0-only
id: mariadb
name: MariaDB
summary: Relational database, with phpMyAdmin to manage it
category: databases
version: "12.3.3"
release: 1
homepage: https://mariadb.org
license: AGPL-3.0-only
appLicense: GPL-2.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/mariadb.yaml
web:
  service: phpmyadmin
firstSteps: >-
  phpMyAdmin answers over plain HTTP, so signing in from outside this server sends
  MariaDB's root password in clear. Add a domain first, or reach it another way, such
  as a VPN or an SSH tunnel. Then open phpMyAdmin and sign in as user root, with the
  password in the MARIADB_ROOT_PASSWORD secret. That secret sets the password on first
  start only, so changing it doesn't change what signs in. To change the password, run
  ALTER USER for both 'root'@'%' and 'root'@'localhost' in phpMyAdmin, then set the
  secret to match.
inputs:
  - name: ADMIN_PORT
    label: phpMyAdmin port
    hint: You open phpMyAdmin on this port of the server. It asks for the database's password.
    type: INPUT_TYPE_PORT
    defaultValue: "8083"
  - name: MARIADB_ROOT_PASSWORD
    label: Root password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    db:
      image: mariadb:12.3.3@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
      restart: unless-stopped
      environment:
        MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
        MARIADB_AUTO_UPGRADE: "1"
      volumes:
        - data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
        interval: 5s
        timeout: 5s
        retries: 30
        start_period: 30s
    phpmyadmin:
      image: phpmyadmin:5.2.3@sha256:f54a37b908b26caa7032c4eb0c7f3495fdd90208a06eed9c4b2c8e691dd1662c
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      environment:
        PMA_HOST: db
      ports:
        - "${ADMIN_PORT}:80"
      healthcheck:
        test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
        interval: 5s
        timeout: 5s
        retries: 12
  volumes:
    data: {}

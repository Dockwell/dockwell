# SPDX-License-Identifier: AGPL-3.0-only
#
# 2.5.9 goes in ahead of its 14 days, as the lowest release that fixes the published
# advisories 2.5.7 has: GHSA-86ch-2247-gr56, which anyone who reaches it can use
# without signing in, and GHSA-v2p3-6f5h-6hhf, which is high.
id: uptime-kuma
name: Uptime Kuma
summary: Uptime checks and status pages
category: monitoring
version: "2.5.9"
release: 1
homepage: https://uptime.kuma.pet
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/uptime-kuma.yaml
web:
  service: uptime-kuma
firstSteps: >-
  Uptime Kuma answers only on this server until you add a domain, as the first person
  to open it makes its admin account. So make yours first, through an SSH tunnel from
  your computer: ssh -N -L 3001:127.0.0.1:3001 you@your-server, using the port you
  gave it, then open http://localhost:3001. Add a domain on its page only after that,
  over HTTPS or behind your tunnel, as a new domain's certificate shows in public
  logs within minutes.
inputs:
  - name: PORT
    label: Port on this server
    hint: Only this server reaches it. To reach it from elsewhere, add a domain once it runs.
    type: INPUT_TYPE_PORT
    defaultValue: "3001"
compose: |
  services:
    uptime-kuma:
      image: louislam/uptime-kuma:2.5.9@sha256:e88415a90dd2f7efecdbc18de0490aff292764a3ac471531bf1d0481725591bd
      restart: unless-stopped
      environment:
        UPTIME_KUMA_DB_TYPE: sqlite
      ports:
        - "127.0.0.1:${PORT}:3001"
      volumes:
        - data:/app/data
      healthcheck:
        test: ["CMD-SHELL", "extra/healthcheck"]
        interval: 10s
        timeout: 10s
        retries: 18
        start_period: 30s
  volumes:
    data: {}

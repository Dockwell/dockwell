# SPDX-License-Identifier: AGPL-3.0-only
id: jellyfin
name: Jellyfin
summary: Stream your films, shows and music to any device
description: |-
  Jellyfin organizes and streams your own media collection. Browse films, television, music and other libraries from a browser or a compatible client, while keeping the server and files under your control.

  Choose the media folder on your server during installation. Jellyfin can read that folder, and keeps its library metadata and settings in persistent storage. Media content is not included.
icon: /catalog-media/jellyfin-icon.webp
documentation: https://jellyfin.org/docs/
appSource: https://github.com/jellyfin/jellyfin
features:
  - "Film, television and music libraries"
  - "Playback in browsers and compatible apps"
  - "Separate users and viewing access"
  - "Metadata and library organization"
screenshots:
  - path: /catalog-media/jellyfin-home.webp
    caption: "Jellyfin media libraries and recently added titles"
    source: https://raw.githubusercontent.com/jellyfin/jellyfin.org/4acfc64a884ff59aa6b7329724b7c325ddb4580e/static/images/screenshots/home/10.8-home.png
  - path: /catalog-media/jellyfin-library.webp
    caption: "Browse a Jellyfin media library"
    source: https://raw.githubusercontent.com/jellyfin/jellyfin.org/4acfc64a884ff59aa6b7329724b7c325ddb4580e/static/images/screenshots/home/10.8-library.png
category: media
version: "12.3"
release: 2
homepage: https://jellyfin.org
license: AGPL-3.0-only
appLicense: GPL-2.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/jellyfin.yaml
web:
  service: jellyfin
hostAccess: >-
  The folder you give for your media, read-only, so Jellyfin can play what's in it
  and change nothing.
firstSteps: >-
  Jellyfin answers only on this server until you add a domain, as the first person to
  open it sets up its admin account. So set it up first, through an SSH tunnel from
  your computer: ssh -N -L 8096:127.0.0.1:8096 you@your-server, using the port you
  gave it, then open http://localhost:8096, and add a library from /media, which is
  the folder you gave. Add a domain on its page only after that, over HTTPS or behind
  your tunnel, as a new domain's certificate shows in public logs within minutes. It
  transcodes on the server's CPU, as it reaches no graphics card, so a film it has to
  convert plays slower than one it streams as it is.
inputs:
  - name: PORT
    label: Port on this server
    hint: Only this server reaches it. To reach it from elsewhere, add a domain once it runs.
    type: INPUT_TYPE_PORT
    defaultValue: "8096"
  - name: MEDIA_DIR
    label: Media folder
    hint: The folder on this server that holds your media, such as /srv/media. Jellyfin reads it as /media.
    type: INPUT_TYPE_TEXT
    defaultValue: /srv/media
compose: |
  services:
    jellyfin:
      image: jellyfin/jellyfin:12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT}:8096"
      volumes:
        - config:/config
        - cache:/cache
        - ${MEDIA_DIR}:/media:ro
      healthcheck:
        test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8096/health"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 30s
  volumes:
    config: {}
    cache: {}

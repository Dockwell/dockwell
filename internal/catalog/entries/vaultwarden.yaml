# SPDX-License-Identifier: AGPL-3.0-only
id: vaultwarden
name: Vaultwarden
summary: Passwords, Bitwarden-compatible
category: security
version: "1.37.4"
release: 1
homepage: https://github.com/dani-garcia/vaultwarden
license: AGPL-3.0-only
appLicense: AGPL-3.0-only
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/vaultwarden.yaml
web:
  service: vaultwarden
firstSteps: >-
  Vaultwarden answers only on this server until you add a domain, as anyone who
  reaches it can make an account until you stop that, and its web vault signs in only
  over HTTPS. Add a domain on its page, over HTTPS, set DOMAIN on the vaultwarden
  service to its address, such as https://vault.example.com, and open it there. To
  open it before that, use an SSH tunnel from your computer: ssh -N -L
  8222:127.0.0.1:8222 you@your-server, using the port you gave it, then open
  http://localhost:8222. Make your account, then set SIGNUPS_ALLOWED to false on the
  vaultwarden service, so no one else can. Bitwarden's apps sign in at the same
  address. To use its /admin page, add ADMIN_TOKEN to the service as a secret, never
  as a plain variable.
inputs:
  - name: PORT
    label: Port on this server
    hint: Only this server reaches it. To reach it from elsewhere, add a domain once it runs.
    type: INPUT_TYPE_PORT
    defaultValue: "8222"
compose: |
  services:
    vaultwarden:
      image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
      restart: unless-stopped
      ports:
        - "127.0.0.1:${PORT}:80"
      volumes:
        - data:/data
      healthcheck:
        test: ["CMD", "/healthcheck.sh"]
        interval: 10s
        timeout: 5s
        retries: 12
        start_period: 10s
  volumes:
    data: {}

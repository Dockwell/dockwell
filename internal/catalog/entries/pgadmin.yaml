# SPDX-License-Identifier: AGPL-3.0-only
id: pgadmin
name: pgAdmin
summary: Manage PostgreSQL databases from your browser
category: databases
version: "9.18"
release: 1
homepage: https://www.pgadmin.org
license: AGPL-3.0-only
appLicense: PostgreSQL
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/pgadmin.yaml
web:
  service: pgadmin
firstSteps: >-
  pgAdmin answers over plain HTTP, so signing in from outside this server sends your
  password in clear. Add a domain first, or reach it another way, such as a VPN or an
  SSH tunnel. Then open pgAdmin and sign in with your email and the password in the
  PGADMIN_PASSWORD secret. That secret sets the password on first start only, so
  changing it doesn't change what signs in. To change the password, choose Change
  password in pgAdmin's user menu, then set the secret to match. To manage a database
  installed here, add a port to its db service, then register this server's address
  and that port in pgAdmin.
inputs:
  - name: ADMIN_EMAIL
    label: Your email
    hint: You sign in to pgAdmin with this.
    type: INPUT_TYPE_EMAIL
  - name: PORT
    label: pgAdmin port
    hint: You open pgAdmin on this port of the server. It asks for your password.
    type: INPUT_TYPE_PORT
    defaultValue: "5050"
  - name: PGADMIN_PASSWORD
    label: pgAdmin password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    pgadmin:
      image: dpage/pgadmin4:9.18.0@sha256:c332c5f6dfba995d9ebc4af261d93506d6876085d712eaaa3defc8dd1a3f26de
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: ${ADMIN_EMAIL}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
        PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      ports:
        - "${PORT}:80"
      volumes:
        - data:/var/lib/pgadmin
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 20s
  volumes:
    data: {}

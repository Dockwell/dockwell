# SPDX-License-Identifier: AGPL-3.0-only
id: linkding
name: linkding
summary: Bookmarks with tags, search and archived pages
description: |-
  linkding is a bookmark manager you host yourself. Save a link with tags and notes, search across everything, and keep a snapshot of a page in case it changes or disappears.

  This entry runs linkding with a data volume for its bookmarks, snapshots and settings. Dockwell generates the first admin password.
icon: /catalog-media/linkding-icon.webp
documentation: https://linkding.link
appSource: https://github.com/sissbruecker/linkding
features:
  - "Bookmarks with tags and notes"
  - "Search across titles, tags and notes"
  - "Archived snapshots of pages"
  - "A REST API and browser extensions"
screenshots:
  - path: /catalog-media/linkding-bookmarks.webp
    caption: "Bookmarks and tags in linkding"
    source: https://raw.githubusercontent.com/sissbruecker/linkding/27b7303baf41bb28babc610ac8eaa486e1ddfab5/docs/public/linkding-screenshot.png
category: notes
version: "1.47.0"
release: 1
homepage: https://linkding.link
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/linkding.yaml
web:
  service: linkding
firstSteps: >-
  linkding answers only on this server until you add a domain. Add a domain on its page
  and set LD_CSRF_TRUSTED_ORIGINS to its full address, such as
  https://links.example.com, or tunnel: ssh -N -L 9090:127.0.0.1:9090 you@your-server,
  then open http://localhost:9090. Sign in as admin with the LINKDING_PASSWORD secret.
  That secret is read on first start only: to change the password, use Change password
  in linkding's settings, then set the secret to match.
inputs:
  - name: PORT
    label: Port on this server
    hint: Only this server reaches it. To reach it from elsewhere, add a domain once it runs.
    type: INPUT_TYPE_PORT
    defaultValue: "9090"
  - name: URL
    label: Site address
    hint: The full HTTPS address of your domain, if you have one. Leave empty to start through an SSH tunnel.
    type: INPUT_TYPE_TEXT
    optional: true
  - name: LINKDING_PASSWORD
    label: Admin password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    linkding:
      image: sissbruecker/linkding:1.47.0@sha256:e35cb50e0581178f245125ffaa909c565416c94c9f22ace305a7d234a4345522
      restart: unless-stopped
      environment:
        LD_SUPERUSER_NAME: admin
        LD_SUPERUSER_PASSWORD: ${LINKDING_PASSWORD}
        LD_CSRF_TRUSTED_ORIGINS: ${URL:-}
      ports:
        - "127.0.0.1:${PORT}:9090"
      volumes:
        - data:/etc/linkding/data
      healthcheck:
        test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:9090/health"]
        interval: 10s
        timeout: 5s
        retries: 18
        start_period: 20s
  volumes:
    data: {}

# SPDX-License-Identifier: AGPL-3.0-only
id: nginx-proxy-manager
name: Nginx Proxy Manager
summary: Reverse proxy with a web console and Let's Encrypt
category: networking
version: "2.16.0"
release: 1
homepage: https://nginxproxymanager.com
license: AGPL-3.0-only
appLicense: MIT
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/nginx-proxy-manager.yaml
web:
  service: proxy
firstSteps: >-
  Open the console and sign in with your email and the password in the ADMIN_PASSWORD
  secret. That secret sets the password on first start only, and Nginx Proxy Manager
  writes it in its log, so change the password in the console after you first sign in.
inputs:
  - name: ADMIN_EMAIL
    label: Your email
    hint: You sign in to the console with this.
    type: INPUT_TYPE_EMAIL
  - name: ADMIN_PORT
    label: Console port
    type: INPUT_TYPE_PORT
    defaultValue: "8881"
  - name: HTTP_PORT
    label: HTTP port
    hint: Choose 80 for public sites, once nothing else holds it.
    type: INPUT_TYPE_PORT
    defaultValue: "8880"
  - name: HTTPS_PORT
    label: HTTPS port
    hint: Choose 443 for public sites, once nothing else holds it.
    type: INPUT_TYPE_PORT
    defaultValue: "8443"
  - name: ADMIN_PASSWORD
    label: Console password
    type: INPUT_TYPE_SECRET
    generate: 32
    logged: true
compose: |
  services:
    proxy:
      image: jc21/nginx-proxy-manager:2.16.0@sha256:4393e642e233e5efd5adeb7f10918d4aaea71c9ed875b94190273fc8e87f9594
      restart: unless-stopped
      environment:
        INITIAL_ADMIN_EMAIL: ${ADMIN_EMAIL}
        INITIAL_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ports:
        - "${ADMIN_PORT}:81"
        - "${HTTP_PORT}:80"
        - "${HTTPS_PORT}:443"
      volumes:
        - data:/data
        - letsencrypt:/etc/letsencrypt
      healthcheck:
        test: ["CMD", "/usr/bin/check-health"]
        interval: 10s
        timeout: 5s
        retries: 18
  volumes:
    data: {}
    letsencrypt: {}

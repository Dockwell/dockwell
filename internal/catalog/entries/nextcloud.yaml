# SPDX-License-Identifier: AGPL-3.0-only
id: nextcloud
name: Nextcloud
summary: Files, calendars and contacts
category: storage
version: "35.0.2"
release: 1
homepage: https://nextcloud.com
license: AGPL-3.0-only
appLicense: AGPL-3.0-or-later
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/nextcloud.yaml
web:
  service: nextcloud
firstSteps: >-
  Nextcloud answers over plain HTTP, so signing in from outside this server sends your
  password in clear. Add a domain first, or reach it another way, such as a VPN or an
  SSH tunnel, and over HTTPS set OVERWRITEPROTOCOL to https on the nextcloud service.
  Then sign in as your admin user, with the password in the NEXTCLOUD_ADMIN_PASSWORD
  secret. That secret sets the password on first start only, so changing it doesn't
  change what signs in. To change the password, use Nextcloud's personal settings,
  under Security, then set the secret to match. Leave the POSTGRES_PASSWORD secret as
  it is: its database keeps the password it started with. It answers only at the
  addresses you gave, and the first start takes a minute or two.
inputs:
  - name: PORT
    label: Nextcloud port
    hint: You open Nextcloud on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "8084"
  - name: TRUSTED_DOMAINS
    label: Addresses you open it at
    hint: >-
      Nextcloud answers only at these, separated by spaces, such as cloud.example.com
      203.0.113.10. Give the domain you'll add, or this server's address.
    type: INPUT_TYPE_TEXT
  - name: ADMIN_USER
    label: Admin user
    hint: You sign in to Nextcloud with this.
    type: INPUT_TYPE_TEXT
    defaultValue: admin
  - name: NEXTCLOUD_ADMIN_PASSWORD
    label: Admin password
    type: INPUT_TYPE_SECRET
    generate: 32
  - name: POSTGRES_PASSWORD
    label: Database password
    type: INPUT_TYPE_SECRET
    generate: 32
compose: |
  services:
    nextcloud:
      image: nextcloud:35.0.2-apache@sha256:d88929dc8386420b8963f86cabb667fdaf733eef9dcf8fc98e226801a32c023c
      restart: unless-stopped
      depends_on:
        db:
          condition: service_healthy
      environment:
        POSTGRES_HOST: db
        POSTGRES_DB: nextcloud
        POSTGRES_USER: nextcloud
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        NEXTCLOUD_ADMIN_USER: ${ADMIN_USER}
        NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
        NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS}
      ports:
        - "${PORT}:80"
      volumes:
        - html:/var/www/html
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS --max-time 8 -H 'Host: localhost' http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
        interval: 10s
        timeout: 10s
        retries: 30
        start_period: 180s
    db:
      image: postgres:17.11@sha256:748a18a54d3842d43bc156f0840d78029b8d349e0feca98c12b9c4ce3404a6b3
      restart: unless-stopped
      environment:
        POSTGRES_USER: nextcloud
        POSTGRES_DB: nextcloud
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      volumes:
        - data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "nextcloud", "-d", "nextcloud"]
        interval: 5s
        timeout: 5s
        retries: 12
  volumes:
    html: {}
    data: {}

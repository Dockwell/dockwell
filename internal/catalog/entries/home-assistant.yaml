# SPDX-License-Identifier: AGPL-3.0-only
id: home-assistant
name: Home Assistant
summary: Run your home's devices from one place, on your own server
category: automation
version: "2026.10.4"
release: 1
homepage: https://www.home-assistant.io
license: AGPL-3.0-only
appLicense: Apache-2.0
source:
  repository: https://github.com/Dockwell/dockwell
  path: internal/catalog/entries/home-assistant.yaml
web:
  service: home-assistant
firstSteps: >-
  Home Assistant answers over plain HTTP, so signing in from outside this server sends
  your password in clear, and the first person to open it makes its owner account.
  Add a domain first, or reach it another way, such as a VPN or an SSH tunnel. Then
  open it and make your account. It runs on a network of its own rather than the
  server's, so it doesn't find devices on yours by itself: add each by its address.
inputs:
  - name: PORT
    label: Home Assistant port
    hint: You open Home Assistant on this port of the server.
    type: INPUT_TYPE_PORT
    defaultValue: "8123"
compose: |
  services:
    home-assistant:
      image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:23f4dfbb69ce76315dbc4de7915504f1c2dcecd7ca2648113a493a385972e133
      restart: unless-stopped
      ports:
        - "${PORT}:8123"
      volumes:
        - config:/config
      healthcheck:
        test: ["CMD", "curl", "-fsS", "--max-time", "4", "-o", "/dev/null", "http://127.0.0.1:8123/manifest.json"]
        interval: 10s
        timeout: 5s
        retries: 24
        start_period: 60s
  volumes:
    config: {}

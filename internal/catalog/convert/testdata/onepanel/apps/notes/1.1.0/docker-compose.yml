services:
  notes:
    image: example/notes:1.1.0
    container_name: ${CONTAINER_NAME}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8080
      - 0.0.0.0:${PANEL_APP_PORT_SYNC}:9443
    volumes:
      - ./data:/app/data
      - ./data/uploads:/app/uploads
      - /etc/localtime:/etc/localtime:ro
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL}
      - PEER=${CONTAINER_NAME}-worker:7000
    labels:
      createdBy: "Apps"
  worker:
    image: example/notes-worker:1.1.0
    container_name: ${CONTAINER_NAME}-worker
    restart: always
    networks:
      - 1panel-network
    environment:
      - MAIN=${CONTAINER_NAME}
    labels:
      createdBy: "Apps"
networks:
  1panel-network:
    external: true

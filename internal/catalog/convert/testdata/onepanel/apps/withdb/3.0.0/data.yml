additionalProperties:
  formFields:
    - default: 8000
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Port
      required: true
      rule: paramPort
      type: number
    - child:
        default: ""
        envKey: PANEL_DB_HOST
        required: true
        type: service
      default: postgresql
      envKey: PANEL_DB_TYPE
      labelEn: Database Service
      required: true
      type: apps
      values:
        - label: PostgreSQL
          value: postgresql
        - label: MySQL
          value: mysql
    - default: withdb
      envKey: PANEL_DB_NAME
      labelEn: Database
      random: true
      required: true
      type: text
    - default: withdb
      envKey: PANEL_DB_USER
      labelEn: Database User
      random: true
      required: true
      type: text
    - default: withdb
      envKey: PANEL_DB_USER_PASSWORD
      labelEn: Database Password
      random: true
      required: true
      type: password

# SPDX-License-Identifier: AGPL-3.0-only
# The API schema. See docs/adr/0003-one-schema-protobuf-connect.md.
version: v2
modules:
  - path: proto
deps:
  # For google.api.http, which maps each method to a REST path (ADR 0015).
  # Pinned to a commit at least 14 days old, like every other dependency.
  - buf.build/googleapis/googleapis:8ac61b9e502343289c8c42b17aa5b245
lint:
  use:
    - STANDARD
    - COMMENT_ENUM
    - COMMENT_MESSAGE
    - COMMENT_RPC
    - COMMENT_SERVICE
breaking:
  use:
    - FILE
  # Alpha packages, such as dockwell.resource.v1alpha1, may still change.
  ignore_unstable_packages: true

# SPDX-License-Identifier: AGPL-3.0-only
#
# Installs through a mirror check releases against a copy of Sigstore's trust
# root pinned in install.sh, instead of fetching it through TUF. This checks
# that the copy is the trust root Sigstore publishes now, and that keyless
# signatures verify against it with the network cut off, so the pin moves
# before Sigstore signs with what changed (scripts/check-trust-root.sh,
# docs/adr/0013-mirrors-for-releases-and-images.md).
#
# Sigstore changes its trust root on its own schedule, and that would turn
# every open pull request red at once. So this runs nightly, and on pull
# requests that change the install script, its tests, the pin, or the
# workflows and scripts that use them. release.yml runs the same check before
# it publishes. A failed nightly run opens an issue, or comments on the one
# already open.
name: Sigstore trust root

on:
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/install-test/**
      - scripts/sigstore_trusted_root.json
      - scripts/check-trust-root.sh
      - scripts/latest-release.sh
      - .github/workflows/trust-root.yml
      - .github/workflows/install.yml
      - .github/workflows/release.yml
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-root-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Sigstore trust root
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The cosign install.sh pins
        id: pin
        run: echo "cosign=$(sed -n 's/^COSIGN_VERSION=//p' scripts/install.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - name: The pin is the trust root Sigstore publishes now, and verifies keyless signatures offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-trust-root.sh sigstore

  report:
    name: Report a failed nightly check
    needs: check
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the one already open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEPS: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/releasing.md#update-sigstores-trust-root
        run: |
          title="The nightly Sigstore trust root check fails"
          body="The nightly Sigstore trust root check failed: $RUN

          If Sigstore changed its trust root, installs through a mirror fail once Sigstore signs with what changed, and the release workflow won't publish until the pin moves. Update the pin as $STEPS says. If the run failed for another reason, fix that, then run the workflow again."
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

# SPDX-License-Identifier: AGPL-3.0-only
#
# The install script and the footprint budgets from the PRD's non-functional
# requirements, on every pull request and push to main, and nightly:
#
#   Release snapshot       builds the release archives and an older build to
#                          upgrade from, laid out and signed as test releases
#   Memory budgets         idle RSS of an agent, and of a control plane with its
#                          own agent; fails at 40 MB and 250 MB
#   Install on <image>     the install script in stock Debian, Ubuntu,
#                          AlmaLinux and Alpine containers, amd64 and arm64
#   Install with systemd   the same on the runner's own Ubuntu, under systemd
#   Sigstore trust root    the trust root install.sh pins for mirrors is the
#                          one Sigstore publishes, and verifies keyless
#                          signatures with the network cut off
#   Install time           nightly: install to running panel on 1 CPU; fails
#                          at 60 s
#
# footprint-comment.yml posts the memory figures on pull requests that move
# them. See docs/install.md.
name: Install

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    name: Release snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cosign: ${{ steps.pin.outputs.cosign }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The install script pins the cosign that signs releases
        id: pin
        run: |
          pinned=$(sed -n 's/^COSIGN_VERSION=//p' scripts/install.sh)
          signing=$(sed -n 's/^  COSIGN_VERSION: //p' .github/workflows/release.yml)
          if [[ -z "$pinned" || "$pinned" != "$signing" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins cosign ${pinned:-nothing}, but release.yml signs with $signing. Pin the same version, with the SHA-256s from its cosign_checksums.txt."
            exit 1
          fi
          echo "cosign=$pinned" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - name: Build and sign the test releases
        run: make install-test-releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-test
          path: dist/install-test
          if-no-files-found: error
          retention-days: 3

  budgets:
    name: Memory budgets
    needs: snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      - name: Idle memory is within budget
        run: |
          source releases/versions
          tar -xzf "releases/good/download/v$NEW/dockwell_${NEW}_linux_amd64.tar.gz" dockwell
          mkdir -p footprint
          scripts/budgets.sh ./dockwell footprint/budgets.json
      # The figures, and the pull request and commit they belong to, for
      # footprint-comment.yml, which checks both before it posts anything.
      - name: Keep the figures
        if: ${{ !cancelled() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p footprint
          printf '%s\n' "$PR" >footprint/pr
          printf '%s\n' "$SHA" >footprint/sha
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: footprint
          path: footprint
          if-no-files-found: ignore
          retention-days: 90

  install:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: snapshot
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:26.04", "almalinux:9", "alpine:3.24"]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - name: The install script pins the cosign that cosign-installer verified
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          pinned=$(sed -n "s/^COSIGN_SHA256_${ARCH^^}=//p" scripts/install.sh)
          verified=$(sha256sum "$(command -v cosign)" | cut -d ' ' -f 1)
          if [[ "$pinned" != "$verified" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins $pinned for cosign on $ARCH, but the verified cosign is $verified. Pin the SHA-256 from its cosign_checksums.txt."
            exit 1
          fi
      - name: Install, upgrade and uninstall
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/install-test/test.sh releases "$(command -v cosign)" "$IMAGE"

  systemd:
    name: Install with systemd (${{ matrix.arch }})
    needs: snapshot
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - name: Install, upgrade and uninstall under systemd
        run: |
          source releases/versions
          scripts/install-test/mirror.sh releases "$(command -v cosign)" mirror
          sudo env INSTALL="$PWD/scripts/install.sh" RELEASES="file://$PWD/releases" KEY="$PWD/releases/cosign.pub" \
            MIRROR="file://$PWD/mirror" OLD="$OLD" NEW="$NEW" COSIGN="$(command -v cosign)" sh scripts/install-test/run.sh

  # Installs through a mirror check releases against a copy of Sigstore's trust
  # root pinned in install.sh, instead of fetching it through TUF. This fails
  # when Sigstore publishes a new one, so the pin moves before Sigstore signs
  # with what changed (docs/adr/0013-mirrors-for-releases-and-images.md).
  trust-root:
    name: Sigstore trust root
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The install script pins scripts/sigstore_trusted_root.json
        id: pin
        run: |
          pinned=$(sed -n 's/^SIGSTORE_ROOT_SHA256=//p' scripts/install.sh)
          actual=$(sha256sum scripts/sigstore_trusted_root.json | cut -d ' ' -f 1)
          if [[ -z "$pinned" || "$pinned" != "$actual" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins the trust root ${pinned:-nothing}, but scripts/sigstore_trusted_root.json is $actual. Update them together, as docs/releasing.md says."
            exit 1
          fi
          echo "cosign=$(sed -n 's/^COSIGN_VERSION=//p' scripts/install.sh)" >>"$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - name: It is the trust root Sigstore publishes now
        run: |
          tuf=$(mktemp -d)
          TUF_ROOT="$tuf" cosign initialize >/dev/null
          current="$tuf/tuf-repo-cdn.sigstore.dev/targets/trusted_root.json"
          if [[ ! -f "$current" ]]; then
            echo "::error::cosign initialize left no trusted_root.json in $current, so the pin can't be compared. Find where this cosign keeps it, and fix this check."
            exit 1
          fi
          if ! cmp -s "$current" scripts/sigstore_trusted_root.json; then
            echo "::error file=scripts/sigstore_trusted_root.json::Sigstore's trust root is now $(sha256sum <"$current" | cut -d ' ' -f 1), and installs through a mirror will fail once Sigstore signs with what changed. Update scripts/sigstore_trusted_root.json and the pin in install.sh, as docs/releasing.md says."
            exit 1
          fi
      - name: Keyless signatures verify against it with the network cut off
        env:
          COSIGN_VERSION: ${{ steps.pin.outputs.cosign }}
          GH_TOKEN: ${{ github.token }}
        run: |
          work=$(mktemp -d)
          root="$PWD/scripts/sigstore_trusted_root.json"
          # cosign verify-blob in a network namespace of its own, with nothing
          # cached, so it can reach neither Sigstore nor anything else.
          offline() {
            rm -rf "$work/tuf"
            sudo unshare --net -- env HOME="$work" TUF_ROOT="$work/tuf" "$(command -v cosign)" verify-blob "$@"
          }
          for file in cosign_checksums.txt cosign_checksums.txt.sigstore.json; do
            curl -fsSL --retry 3 -o "$work/$file" "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/$file"
          done
          cosign_release=(--bundle "$work/cosign_checksums.txt.sigstore.json"
            --certificate-identity keyless@projectsigstore.iam.gserviceaccount.com
            --certificate-oidc-issuer https://accounts.google.com "$work/cosign_checksums.txt")
          if offline "${cosign_release[@]}" 2>/dev/null; then
            echo "::error::cosign verified through TUF from inside the network namespace, so the network wasn't cut off."
            exit 1
          fi
          # cosign's own release, signed keyless on Sigstore's public instance.
          offline --trusted-root "$root" "${cosign_release[@]}"
          # Dockwell's latest release, as an install through a mirror checks it.
          if ! tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "There's no published release yet, so only cosign's own release was verified offline." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D "$work/release" \
            -p checksums.txt -p checksums.txt.sigstore.json
          offline --trusted-root "$root" --bundle "$work/release/checksums.txt.sigstore.json" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$tag" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$work/release/checksums.txt"

  install-time:
    name: Install time on 1 CPU (${{ matrix.release }})
    needs: snapshot
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # main's snapshot, checked with the test key; and the latest published
        # release, checked as a server would check it, once there is one.
        release: [snapshot, published]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.release == 'snapshot' }}
        with:
          name: install-test
          path: releases
      - name: Install main's snapshot
        if: ${{ matrix.release == 'snapshot' }}
        run: |
          sudo env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            DOCKWELL_RELEASES_URL="file://$PWD/releases/good" DOCKWELL_VERIFY_KEY="$PWD/releases/cosign.pub" \
            scripts/install-test/time.sh "main's snapshot"
      - name: Install the latest release
        if: ${{ matrix.release == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null); then
            echo "There's no published release yet, so only main's snapshot was timed." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/install-test/time.sh "$tag, published"

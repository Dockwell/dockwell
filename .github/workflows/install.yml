# SPDX-License-Identifier: AGPL-3.0-only
#
# The install script and the footprint budgets from the PRD's non-functional
# requirements, on every push to main, nightly, and on each pull request that
# needs them, as scripts/ci-jobs.sh says: the budgets for a change to Go code,
# and the install tests for one to the install script, the release, or what
# the script runs in the binary (docs/adr/0037-ci-runs-what-a-change-needs.md).
# Release snapshot asks first, and the jobs after it run only when they're
# needed. Install, every job is the check a branch rule requires:
#
#   Release snapshot       builds the release archives of both builds, and an
#                          older build to upgrade from, laid out and signed as
#                          test releases
#   Build of main          on pull requests: main's release binaries, built by
#                          main's own release configuration
#   Memory budgets         idle RSS of an agent, with the agent build, and of a
#                          control plane with its own agent, with the full
#                          build; warns when an agent passes 30 MB, and fails
#                          at 40 MB and 250 MB. On pull requests it measures
#                          main's builds beside these, on the same runner
#   Install on <image>     the install script in stock Debian, Ubuntu,
#                          AlmaLinux and Alpine containers, amd64 and arm64
#   Install with systemd   the same on the runner's own Ubuntu, under systemd
#   Install time           nightly: install to running panel on 1 CPU; fails
#                          at 60 s
#
# footprint-comment.yml posts the memory figures on pull requests that move
# them, against main's. trust-root.yml checks the Sigstore trust root that
# install.sh pins for mirrors, on its own schedule. See docs/install.md.
name: Install

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What a step starts asks nothing beyond the runner (ADR 0034).
  DOCKWELL_TEST: "1"

jobs:
  snapshot:
    name: Release snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cosign: ${{ steps.pin.outputs.cosign }}
      budgets: ${{ steps.pick.outputs.budgets }}
      install: ${{ steps.pick.outputs.install }}
      systemd: ${{ steps.pick.outputs.systemd }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request's merge commit and its two parents: main, and the pull request.
          fetch-depth: 2
          persist-credentials: false
      # The steps after this one run only when this change needs a snapshot,
      # and the jobs after this one only when it needs them.
      - name: Whether this change needs this job, and the ones after it
        id: pick
        run: scripts/ci-jobs.sh needs snapshot budgets install systemd
      - name: The install script pins the cosign that signs releases
        if: steps.pick.outputs.run == 'true'
        id: pin
        run: |
          pinned=$(sed -n 's/^COSIGN_VERSION=//p' scripts/install.sh)
          signing=$(sed -n 's/^  COSIGN_VERSION: //p' .github/workflows/release.yml)
          if [[ -z "$pinned" || "$pinned" != "$signing" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins cosign ${pinned:-nothing}, but release.yml signs with $signing. Pin the same version, with the SHA-256s from its cosign_checksums.txt."
            exit 1
          fi
          echo "cosign=$pinned" >>"$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Sigstore's TUF repository sometimes doesn't answer, and the installer then fails
      # before it has verified anything, so it's tried once more.
      - id: cosign
        if: steps.pick.outputs.run == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - if: steps.pick.outputs.run == 'true' && steps.cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ steps.pin.outputs.cosign }}
      - name: Build and sign the test releases
        if: steps.pick.outputs.run == 'true'
        run: make install-test-releases
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pick.outputs.run == 'true'
        with:
          name: install-test
          path: dist/install-test
          if-no-files-found: error
          retention-days: 3

  # main's release binaries, for the Memory budgets job to measure beside this
  # pull request's. Figures from another run would carry the difference
  # between two runners, which is as big as the changes worth reporting.
  base:
    name: Build of main
    if: ${{ github.event_name == 'pull_request' }}
    # Only the pull request's own build can fail it. Without main's, the
    # Memory budgets job measures this one alone, and says so.
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Build main's binaries as its release does
        run: |
          mkdir -p footprint-base
          go tool -modfile=tools/go.mod goreleaser build --snapshot --clean --single-target --id dockwell --output footprint-base/dockwell
          # The agent build, once main has one
          # (docs/adr/0023-a-full-build-and-an-agent-build.md). Until then, the
          # Memory budgets job measures main's full build as its agent too, as
          # a server that joined ran it, and says so.
          if grep -q '^  - id: dockwell-agent$' .goreleaser.yaml; then
            go tool -modfile=tools/go.mod goreleaser build --snapshot --clean --skip=before --single-target --id dockwell-agent --output footprint-base/dockwell-agent
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: footprint-base
          path: footprint-base
          if-no-files-found: error
          retention-days: 3

  budgets:
    name: Memory budgets
    needs: [snapshot, base]
    # base runs only for pull requests, and the budgets hold without it.
    if: ${{ !cancelled() && needs.snapshot.result == 'success' && needs.snapshot.outputs.budgets == 'true' }}
    runs-on: ubuntu-24.04
    # The measurement takes about 7 minutes: each process settles for 3.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.base.result == 'success' }}
        continue-on-error: true
        with:
          name: footprint-base
          path: footprint-base
      - name: Idle memory is within budget
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ needs.base.result == 'success' && github.event.pull_request.base.sha || '' }}
        run: |
          source releases/versions
          mkdir -p full agent footprint
          tar -xzf "releases/good/download/v$NEW/dockwell_${NEW}_linux_amd64.tar.gz" -C full dockwell
          tar -xzf "releases/good/download/v$NEW/dockwell-agent_${NEW}_linux_amd64.tar.gz" -C agent dockwell
          if [[ -n "$BASE" && -f footprint-base/dockwell ]]; then
            # Artifacts don't keep the executable bit.
            chmod +x footprint-base/dockwell
            export BASELINE=footprint-base/dockwell BASELINE_NAME="main at ${BASE:0:7}"
            # Without it, as before main had an agent build, the comparison
            # takes main's full build as its agent, and says so.
            if [[ -f footprint-base/dockwell-agent ]]; then
              chmod +x footprint-base/dockwell-agent
              export BASELINE_AGENT=footprint-base/dockwell-agent
            fi
          elif [[ -n "$PR" ]]; then
            echo "::warning title=No comparison::The Build of main job didn't produce main's build, so there's no comparison with it. Only this pull request's figures can fail this check. Re-run the workflow to compare."
          fi
          scripts/budgets.sh full/dockwell agent/dockwell footprint/budgets.json
      # The figures, and the pull request, commit and main they belong to,
      # for footprint-comment.yml, which checks them before it posts anything.
      - name: Keep the figures
        if: ${{ !cancelled() }}
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ needs.base.result == 'success' && github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p footprint
          printf '%s\n' "$PR" >footprint/pr
          printf '%s\n' "$SHA" >footprint/sha
          printf '%s\n' "$BASE" >footprint/base
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: footprint
          path: footprint
          if-no-files-found: ignore
          retention-days: 90

  install:
    name: Install on ${{ matrix.image }} (${{ matrix.arch }})
    needs: snapshot
    if: needs.snapshot.outputs.install == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:13", "ubuntu:26.04", "almalinux:9", "alpine:3.24"]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      # Sigstore's TUF repository sometimes doesn't answer, and the installer then fails
      # before it has verified anything, so it's tried once more.
      - id: cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - if: steps.cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - name: The install script pins the cosign that cosign-installer verified
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          pinned=$(sed -n "s/^COSIGN_SHA256_${ARCH^^}=//p" scripts/install.sh)
          verified=$(sha256sum "$(command -v cosign)" | cut -d ' ' -f 1)
          if [[ "$pinned" != "$verified" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins $pinned for cosign on $ARCH, but the verified cosign is $verified. Pin the SHA-256 from its cosign_checksums.txt."
            exit 1
          fi
      - name: Install, upgrade and uninstall
        env:
          IMAGE: ${{ matrix.image }}
        run: scripts/install-test/test.sh releases "$(command -v cosign)" "$IMAGE"

  systemd:
    name: Install with systemd (${{ matrix.arch }})
    needs: snapshot
    if: needs.snapshot.outputs.systemd == 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-test
          path: releases
      # Sigstore's TUF repository sometimes doesn't answer, and the installer then fails
      # before it has verified anything, so it's tried once more.
      - id: cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        continue-on-error: true
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - if: steps.cosign.outcome == 'failure'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ needs.snapshot.outputs.cosign }}
      - name: Install, upgrade and uninstall under systemd
        run: |
          source releases/versions
          scripts/install-test/mirror.sh releases "$(command -v cosign)" mirror
          sudo env INSTALL="$PWD/scripts/install.sh" RELEASES="file://$PWD/releases" KEY="$PWD/releases/cosign.pub" \
            MIRROR="file://$PWD/mirror" OLD="$OLD" NEW="$NEW" COSIGN="$(command -v cosign)" sh scripts/install-test/run.sh

  install-time:
    name: Install time on 1 CPU (${{ matrix.release }})
    needs: snapshot
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # main's snapshot, checked with the test key; and the latest published
        # release, checked as a server would check it, once there is one.
        release: [snapshot, published]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ matrix.release == 'snapshot' }}
        with:
          name: install-test
          path: releases
      - name: Install main's snapshot
        if: ${{ matrix.release == 'snapshot' }}
        run: |
          sudo env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" \
            DOCKWELL_RELEASES_URL="file://$PWD/releases/good" DOCKWELL_VERIFY_KEY="$PWD/releases/cosign.pub" \
            scripts/install-test/time.sh "main's snapshot"
      - name: Install the latest release
        if: ${{ matrix.release == 'published' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(scripts/latest-release.sh)
          if [[ -z "$tag" ]]; then
            echo "There's no published release yet, so only main's snapshot was timed." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo env GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" scripts/install-test/time.sh "$tag, published"

  # The one check of this workflow a branch rule requires, as the install legs
  # are a matrix whose checks are named after their image, and are skipped as a
  # whole when the change doesn't need them. A branch rule counts a skipped job
  # as passing, so this fails unless every job the change needs passed, and
  # every other one passed or was skipped. It runs when the rest are cancelled
  # too, and fails, so a cancelled run never reads as green. A failed Build of
  # main only leaves out the comparison.
  every-job:
    name: Install, every job
    needs: [snapshot, base, budgets, install, systemd, install-time]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Every job this change needs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: scripts/ci-jobs.sh check

# SPDX-License-Identifier: AGPL-3.0-only
#
# Posts the idle memory figures on a pull request that moves them, in one
# comment that is updated in place on every push.
#
# It runs after the Install workflow finishes, from main's copy of this file,
# with a token that can comment, so it works for pull requests from forks too.
# It checks out and runs none of the pull request's code. It reads only the
# numbers that the Memory budgets job uploaded, and posts them only on the pull
# request whose head is the commit they were measured on.
name: Footprint comment

on:
  workflow_run:
    workflows: [Install]
    types: [completed]

permissions: {}

concurrency:
  group: footprint-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post the memory figures
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the figures from the Install runs
      pull-requests: write # create or update the one comment
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # A change smaller than this, in bytes, is noise between runs.
      THRESHOLD: 1000000
    steps:
      - name: Post or update the comment
        run: |
          set -euo pipefail
          marker='<!-- dockwell:footprint -->'

          # rss reads one figure, and only a number, from a budgets.json.
          rss() { jq -er --arg k "$2" '.[$k] | numbers | floor' "$1"; }
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f MB", b / 1e6 }'; }
          budget() { awk -v b="$1" 'BEGIN { printf "%d MB", b / 1e6 }'; }
          delta() { awk -v d="$1" 'BEGIN { printf "%+.1f MB", d / 1e6 }'; }

          if ! gh run download "$RUN_ID" -R "$REPO" -n footprint -D pr 2>/dev/null || [[ ! -s pr/budgets.json ]]; then
            echo "Run $RUN_ID has no memory figures, so there's nothing to post."
            exit 0
          fi
          pr=$(head -c 20 pr/pr | tr -d '\n')
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "The figures name no pull request, so there's nothing to post."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [[ "$head" != "$HEAD_SHA" ]]; then
            echo "Pull request #$pr is at $head now, not $HEAD_SHA, so these figures are stale."
            exit 0
          fi
          agent=$(rss pr/budgets.json agent_rss_bytes)
          control=$(rss pr/budgets.json control_rss_bytes)
          agent_budget=$(rss pr/budgets.json agent_budget_bytes)
          control_budget=$(rss pr/budgets.json control_budget_bytes)

          # main's figures: the latest push to main that measured them.
          found=
          base=
          for id in $(gh api "repos/$REPO/actions/workflows/install.yml/runs?branch=main&event=push&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
            if gh run download "$id" -R "$REPO" -n footprint -D "main/$id" 2>/dev/null &&
              base_agent=$(rss "main/$id/budgets.json" agent_rss_bytes) &&
              base_control=$(rss "main/$id/budgets.json" control_rss_bytes); then
              base=$(head -c 40 "main/$id/sha" 2>/dev/null | tr -dc '0-9a-f' || true)
              found=1
              break
            fi
          done

          existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)

          if [[ -z "$found" ]]; then
            echo "main has no memory figures yet, so there's nothing to compare with."
            exit 0
          fi
          moved=
          for d in $((agent - base_agent)) $((control - base_control)); do
            if ((${d#-} >= THRESHOLD)); then moved=1; fi
          done
          if [[ -z "$moved" && -z "$existing" ]]; then
            echo "Pull request #$pr doesn't move idle memory, so there's nothing to post."
            exit 0
          fi

          at=${base:+ at ${base:0:7}}
          if [[ -n "$moved" ]]; then
            lead="This pull request moves idle memory by 1 MB or more, compared with main$at."
          else
            lead="This pull request no longer moves idle memory by 1 MB or more, compared with main$at."
          fi
          body=$(
            cat <<EOF
          $marker
          ### Memory at idle

          $lead

          | Idle, after 30 s | This pull request | main | Change | Budget |
          | --- | ---: | ---: | ---: | ---: |
          | An agent on its own | $(mb "$agent") | $(mb "$base_agent") | $(delta $((agent - base_agent))) | $(budget "$agent_budget") |
          | A control plane with its own agent | $(mb "$control") | $(mb "$base_control") | $(delta $((control - base_control))) | $(budget "$control_budget") |

          Measured at ${HEAD_SHA:0:7} by the Memory budgets job, which fails at the budget. This comment is updated on every push.
          EOF
          )

          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "Updated the comment on pull request #$pr."
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            echo "Commented on pull request #$pr."
          fi

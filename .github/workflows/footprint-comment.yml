# SPDX-License-Identifier: AGPL-3.0-only
#
# Posts the idle memory figures on a pull request that moves them, in one
# comment that is updated in place on every push.
#
# The Memory budgets job measures the pull request's build and main's side
# by side, on one runner, and keeps the medians of several runs of each (see
# scripts/budgets.sh). Comparing those, rather than figures from separate
# runs, leaves out the difference between runners, which was as big as the
# changes worth reporting.
#
# It runs after the Install workflow finishes, from main's copy of this file,
# with a token that can comment, so it works for pull requests from forks too.
# It checks out and runs none of the pull request's code. It reads only the
# numbers that the Memory budgets job uploaded, and the sentence that says
# which build each came from, which it posts only as plain words. It posts them
# only on the pull request whose head is the commit they were measured on.
#
# A pull request that changes no Go code doesn't run the Memory budgets job
# (scripts/ci-jobs.sh), so its comment, if it has one, stays as it was for
# the last commit that did, which it names.
name: Footprint comment

on:
  workflow_run:
    workflows: [Install]
    types: [completed]

permissions: {}

concurrency:
  group: footprint-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post the memory figures
    # A cancelled Install run was replaced by one for a newer push, whose figures
    # are the ones to post.
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # download the figures from the Install run
      pull-requests: write # create or update the one comment
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      # A change smaller than THRESHOLD, in bytes, isn't reported. Between
      # two identical builds, the medians differed by up to NOISE. Sampled
      # after 180 s, as now, 10 comparisons on one machine differed by up to
      # 0.26 MB for an agent and 0.39 MB for a control plane, with standard
      # deviations of 0.13 MB and 0.20 MB (#64). Sampled after 30 s, 20 on
      # CI runners differed by up to 0.34 MB and 0.41 MB (#63). The threshold
      # is five of the larger standard deviation, and over twice the largest
      # difference (#57).
      THRESHOLD: 1000000
      NOISE: 410000
    steps:
      - name: Post or update the comment
        run: |
          set -euo pipefail
          marker='<!-- dockwell:footprint -->'

          # num reads one figure, and only a number, from a budgets.json.
          num() { jq -er "$2 | numbers | floor" "$1"; }
          mb() { awk -v b="$1" 'BEGIN { printf "%.1f MB", b / 1e6 }'; }
          budget() { awk -v b="$1" 'BEGIN { printf "%d MB", b / 1e6 }'; }
          delta() { awk -v d="$1" 'BEGIN { printf "%+.1f MB", d / 1e6 }'; }

          if ! gh run download "$RUN_ID" -R "$REPO" -n footprint -D pr 2>/dev/null || [[ ! -s pr/budgets.json ]]; then
            echo "Run $RUN_ID has no memory figures, so there's nothing to post."
            exit 0
          fi
          pr=$(head -c 20 pr/pr | tr -d '\n')
          if [[ ! "$pr" =~ ^[0-9]+$ ]]; then
            echo "The figures name no pull request, so there's nothing to post."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [[ "$head" != "$HEAD_SHA" ]]; then
            echo "Pull request #$pr is at $head now, not $HEAD_SHA, so these figures are stale."
            exit 0
          fi
          base=$(head -c 40 pr/base 2>/dev/null | tr -dc '0-9a-f' || true)
          if [[ ${#base} -ne 40 ]] ||
            ! base_agent=$(num pr/budgets.json .baseline.agent_rss_bytes) ||
            ! base_control=$(num pr/budgets.json .baseline.control_rss_bytes); then
            echo "Run $RUN_ID measured nothing of main to compare with, so there's nothing to post."
            exit 0
          fi
          agent=$(num pr/budgets.json .agent_rss_bytes)
          control=$(num pr/budgets.json .control_rss_bytes)
          agent_budget=$(num pr/budgets.json .agent_budget_bytes)
          control_budget=$(num pr/budgets.json .control_budget_bytes)
          runs=$(num pr/budgets.json .runs)
          settle=$(num pr/budgets.json .settle_seconds)
          # Which build each figure came from, as budgets.sh says it: each
          # agent its commit's agent build, or for a main from before there
          # was one, its full build running as an agent
          # (docs/adr/0023-a-full-build-and-an-agent-build.md). The pull
          # request's own code wrote it, so it is posted only when it is a
          # short sentence of plain words, which can't link, mention or format
          # anything. Figures from before budgets.sh wrote it have none.
          builds=$(jq -r '.builds // "" | strings' pr/budgets.json)
          plain="^[A-Za-z0-9 .,'()-]{1,400}\$"
          if [[ ! $builds =~ $plain ]]; then
            builds=
          fi

          existing=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)

          moved=
          for d in $((agent - base_agent)) $((control - base_control)); do
            if ((${d#-} >= THRESHOLD)); then moved=1; fi
          done
          if [[ -z "$moved" && -z "$existing" ]]; then
            echo "Pull request #$pr doesn't move idle memory by $(mb "$THRESHOLD") or more, so there's nothing to post."
            exit 0
          fi

          if [[ -n "$moved" ]]; then
            lead="This pull request moves idle memory by $(mb "$THRESHOLD") or more, compared with main at ${base:0:7}."
          else
            lead="This pull request no longer moves idle memory by $(mb "$THRESHOLD") or more, compared with main at ${base:0:7}."
          fi
          body=$(
            cat <<EOF
          $marker
          ### Memory at idle

          $lead

          | Idle, after $settle s, RSS | This pull request | main | Change | Budget |
          | --- | ---: | ---: | ---: | ---: |
          | An agent on its own | $(mb "$agent") | $(mb "$base_agent") | $(delta $((agent - base_agent))) | $(budget "$agent_budget") |
          | A control plane with its own agent | $(mb "$control") | $(mb "$base_control") | $(delta $((control - base_control))) | $(budget "$control_budget") |

          The Memory budgets job measured both commits side by side, on one runner, for ${HEAD_SHA:0:7}. Each figure is the median of $runs runs.${builds:+ $builds}
          This comment appears when a figure moves by $(mb "$THRESHOLD") or more: on changes that can't move memory, they differ by up to $(mb "$NOISE").
          The job fails at the budget, and its summary has PSS and anonymous memory too. This comment is updated on every push.
          EOF
          )

          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            echo "Updated the comment on pull request #$pr."
          else
            gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            echo "Commented on pull request #$pr."
          fi

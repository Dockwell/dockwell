# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOL: go tool -modfile=tools/go.mod
  # What a step starts asks nothing beyond the runner (ADR 0034).
  DOCKWELL_TEST: "1"

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    # It takes about 17 minutes under the race detector on 2026-11-07, and grows with each feature, so this
    # leaves room for a slow runner rather than failing at random. A hang still ends it. #197 is to bring it down.
    timeout-minutes: 35
    # The store's tests run on SQLite and on this Postgres (ADR 0014).
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_PASSWORD: dockwell-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOCKWELL_TEST_POSTGRES: postgres://postgres:dockwell-ci@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Modules are tidy
        if: steps.pick.outputs.run == 'true'
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      # Vet, lint and test run the agent build's packages again with its tag,
      # as it compiles them (docs/adr/0023-a-full-build-and-an-agent-build.md).
      # go list finds them once, for the steps after this one.
      - name: The agent build's packages
        if: steps.pick.outputs.run == 'true'
        run: |
          pkgs=$(scripts/agent-packages.sh)
          echo "AGENT_PKGS=$(echo $pkgs)" >>"$GITHUB_ENV"
      - name: Vet
        if: steps.pick.outputs.run == 'true'
        run: |
          go vet ./...
          go vet -tags agent $AGENT_PKGS
      - name: Lint
        if: steps.pick.outputs.run == 'true'
        run: |
          $GOTOOL golangci-lint run
          $GOTOOL golangci-lint run --build-tags agent $AGENT_PKGS
      - name: Formatting
        if: steps.pick.outputs.run == 'true'
        run: $GOTOOL golangci-lint fmt --diff
      - name: Test
        if: steps.pick.outputs.run == 'true'
        run: go test -timeout 20m -race -coverprofile=coverage.out ./...
      - name: Test the agent build
        if: steps.pick.outputs.run == 'true'
        run: go test -race -tags agent $AGENT_PKGS
      - name: Coverage summary
        if: steps.pick.outputs.run == 'true'
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Static builds of both builds
        if: steps.pick.outputs.run == 'true'
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o "bin/dockwell-linux-$arch" ./cmd/dockwell
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -tags agent -o "bin/dockwell-agent-linux-$arch" ./cmd/dockwell
          done
          ls -lh bin/
      - name: The agent build joins the full build
        if: steps.pick.outputs.run == 'true'
        run: scripts/smoke-agent.sh bin/dockwell-linux-amd64 bin/dockwell-agent-linux-amd64

  # What needs a real Docker Engine or a real Caddy, in four jobs that run side by
  # side. Each limit is twice what the job takes at its slowest: the slowest of
  # ten runs of its part in the job they shared, and its own setup. So a slow
  # runner doesn't fail it, and a hang doesn't hold every PR for long.
  docker-go:
    name: Go on Docker
    runs-on: ubuntu-24.04
    # 4 minutes at most, and half a minute for nftables.
    timeout-minutes: 9
    # The drivers' tests against the runner's Docker Engine, beside docker compose
    # (ADR 0021).
    env:
      DOCKWELL_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs docker-go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The runner image's docker compose changes under the tests, so they
      # run with a version of our own, as docker compose's release has it.
      - name: Docker Compose v2.38.2
        if: steps.pick.outputs.run == 'true'
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.38.2/docker-compose-linux-x86_64
          echo "486b3ffc0f806ca2efbc430cef89955386011662f0c76bad17c103d059cfa9cf  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
      - name: Docker
        if: steps.pick.outputs.run == 'true'
        run: |
          docker version
          docker compose version
      # A disk of a few MiB, for what the log archive does as one fills or turns
      # read-only, which the tests remount.
      - name: A small disk
        if: steps.pick.outputs.run == 'true'
        run: |
          sudo mkdir -p /mnt/dockwell-small
          sudo mount -t tmpfs -o size=2m,mode=1777 tmpfs /mnt/dockwell-small
      - name: Tests against Docker
        if: steps.pick.outputs.run == 'true'
        env:
          DOCKWELL_TEST_SMALL_DISK: /mnt/dockwell-small
        run: go test -race -run 'OnRealDocker' -v ./internal/...
      # Dockwell's nftables table against the runner's kernel, as root, in a
      # network namespace of its own, so the runner's own firewall is never
      # touched (ADR 0052). It has to pass, not skip.
      - name: The table against real nftables
        if: steps.pick.outputs.run == 'true'
        run: |
          set -o pipefail
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nftables; }
          go test -c -o "$RUNNER_TEMP/nftables.test" ./internal/agent/nftables
          sudo unshare -n env DOCKWELL_TEST=1 DOCKWELL_TEST_NFT="$(command -v nft)" \
            "$RUNNER_TEMP/nftables.test" -test.run 'TestTheTableLoadsInRealNftables' -test.v | tee "$RUNNER_TEMP/nftables.out"
          grep -q -- '--- PASS: TestTheTableLoadsInRealNftables' "$RUNNER_TEMP/nftables.out"
          # The revert that fires without the agent: the agent is killed while a
          # change waits, and the kernel's table goes back all the same. In the
          # same kind of namespace, so only its own firewall is touched.
          go test -c -o "$RUNNER_TEMP/access.test" ./internal/agent/access
          sudo unshare -n env DOCKWELL_TEST=1 DOCKWELL_TEST_NFT="$(command -v nft)" \
            "$RUNNER_TEMP/access.test" -test.run 'TestTheRevertOutsideTheAgentWorksOnRealNftablesWithTheAgentKilled' -test.v | tee "$RUNNER_TEMP/access.out"
          grep -q -- '--- PASS: TestTheRevertOutsideTheAgentWorksOnRealNftablesWithTheAgentKilled' "$RUNNER_TEMP/access.out"

  caddy-go:
    name: Go on Caddy
    runs-on: ubuntu-24.04
    # 8.5 minutes at most.
    timeout-minutes: 17
    # The ingress against real Caddy and Pebble, on high ports, with no root and no
    # Docker (ADR 0024).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs caddy-go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Caddy and Pebble, pinned by SHA-256
        if: steps.pick.outputs.run == 'true'
        run: |
          scripts/ingress-tools.sh "$RUNNER_TEMP/ingress-tools"
          echo "DOCKWELL_TEST_CADDY=$RUNNER_TEMP/ingress-tools/caddy" >> "$GITHUB_ENV"
          echo "DOCKWELL_TEST_PEBBLE=$RUNNER_TEMP/ingress-tools" >> "$GITHUB_ENV"
      - name: Tests against Caddy
        if: steps.pick.outputs.run == 'true'
        run: go test -race -run 'OnRealCaddy' -v ./internal/ingress/... ./internal/website/...

  docker-e2e:
    name: Service end to end on Docker
    runs-on: ubuntu-24.04
    # About 18 minutes on 2026-11-07, and it grows with each feature, so this leaves room for a slow runner.
    timeout-minutes: 35
    # A service through the CLI end to end, beside docker compose (ADR 0021), and
    # the ingress in its container on 80 and 443, with a real certificate from
    # Pebble, which the script fetches (ADR 0024), with Dockwell as root, as on a
    # server.
    env:
      # Ubuntu's packages from the mirror beside the runners: the public one took 11 minutes
      # for one read on 2026-11-10, and the step with it its whole deadline (#391).
      E2E_UBUNTU_MIRROR: http://azure.archive.ubuntu.com/ubuntu/
      E2E_PANEL: "1"
      E2E_ROOT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs docker-e2e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Docker Compose v2.38.2
        if: steps.pick.outputs.run == 'true'
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL -o ~/.docker/cli-plugins/docker-compose \
            https://github.com/docker/compose/releases/download/v2.38.2/docker-compose-linux-x86_64
          echo "486b3ffc0f806ca2efbc430cef89955386011662f0c76bad17c103d059cfa9cf  $HOME/.docker/cli-plugins/docker-compose" | sha256sum -c -
          chmod +x ~/.docker/cli-plugins/docker-compose
      - name: Docker
        if: steps.pick.outputs.run == 'true'
        run: |
          docker version
          docker compose version
      - name: A service end to end
        if: steps.pick.outputs.run == 'true'
        run: make docker-e2e

  catalog-docker:
    name: Catalog on Docker (${{ matrix.apps }})
    runs-on: ubuntu-24.04
    # Each group takes up to 10 minutes, most of it pulling images, and runs beside
    # the others, so a slow registry has room.
    timeout-minutes: 25
    # Each app in the catalog installs from its entry, answers and signs in with what
    # Dockwell generated, upgrades from the version before it keeping its data, and
    # goes again, on real Docker, with Dockwell as root, as on a server. The first five
    # are in the Service end to end on Docker job, and internal/catalog's tests hold
    # every entry to one of the two.
    strategy:
      fail-fast: false
      matrix:
        apps:
          - pgadmin redis mariadb coder
          - uptime-kuma n8n gitea vaultwarden
          - nextcloud rustfs grafana umami
          - plausible ghost wordpress memos
          - adminer jellyfin home-assistant
          - openclaw
          - hermes-agent
          - new-api lobechat
          - sftpgo openlist gotify linkding
    env:
      E2E_ROOT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Docker
        run: docker version
      - name: SFTP client
        if: contains(matrix.apps, 'sftpgo')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y sshpass
      - name: The apps end to end
        run: make catalog-e2e APPS="${{ matrix.apps }}"

  # One check of a fixed name for every group above, which a branch rule can require:
  # a matrix's own checks are named by their groups, which change as the catalog grows.
  catalog-docker-all:
    name: Catalog on Docker, every group
    needs: catalog-docker
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every group passed
        env:
          RESULT: ${{ needs.catalog-docker.result }}
        run: |
          echo "The Catalog on Docker groups ended: $RESULT"
          test "$RESULT" = success

  docker-panel:
    name: Panel end to end on Docker
    runs-on: ubuntu-24.04
    # 6 minutes at most.
    timeout-minutes: 11
    # The app screens on real Docker, in headless Chrome, which the runner image
    # has, with certificates from Pebble.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs docker-panel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The script fetches Caddy too, which this doesn't use.
      - name: Caddy and Pebble, pinned by SHA-256
        if: steps.pick.outputs.run == 'true'
        run: |
          scripts/ingress-tools.sh "$RUNNER_TEMP/ingress-tools"
          echo "DOCKWELL_TEST_PEBBLE=$RUNNER_TEMP/ingress-tools" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The app screens end to end
        if: steps.pick.outputs.run == 'true'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: make docker-panel-e2e

  logs-load:
    name: Log load
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs logs-load
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The agent build under a flood, a stuck reader and searches of a million
      # lines, on a fake Docker, held to limits of memory and CPU (ADR 0025).
      - name: An agent's memory and CPU under load
        if: steps.pick.outputs.run == 'true'
        run: make logs-load

  containers-load:
    name: Hundreds of containers
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs containers-load
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The agent build with 500 containers, listed again and again, on a fake
      # Docker, held to its memory budget (ADR 0031).
      - name: An agent's memory with hundreds of containers
        if: steps.pick.outputs.run == 'true'
        run: make containers-load

  transfers-load:
    name: Transfer load
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs transfers-load
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The agent build with four uploads and four downloads at once, every byte
      # checked, held to its memory budget (ADR 0045).
      - name: An agent's memory while files upload and download
        if: steps.pick.outputs.run == 'true'
        run: make transfers-load

  e2e:
    name: Panel end to end
    runs-on: ubuntu-24.04
    # About 14 minutes on 2026-11-07, and it grows with each flow, so this leaves room for a slow runner rather than
    # cutting off a run that's still going.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs e2e
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      # The panel's flows, in headless Chrome, on a fake Docker Engine.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The panel's flows end to end
        if: steps.pick.outputs.run == 'true'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: make e2e

  schema:
    name: API schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs schema
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.pick.outputs.run == 'true'
      - name: Lint
        if: steps.pick.outputs.run == 'true'
        run: $GOTOOL buf lint
      - name: Formatting
        if: steps.pick.outputs.run == 'true'
        run: $GOTOOL buf format --diff --exit-code
      - name: OpenAPI document is valid
        if: steps.pick.outputs.run == 'true'
        run: make check-openapi
      - name: No breaking changes
        if: steps.pick.outputs.run == 'true' && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:proto" 2>/dev/null; then
            $GOTOOL buf breaking --against ".git#ref=$BASE"
          else
            echo "The base branch has no schema yet, so there is nothing to break."
          fi
      - name: Generated code is current
        if: steps.pick.outputs.run == 'true'
        run: make check-generated
      - name: TypeScript client typechecks
        if: steps.pick.outputs.run == 'true'
        run: pnpm -r --if-present typecheck

  panel:
    name: Panel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The steps after this one run only when this change needs this job,
      # from the files it changes (docs/adr/0050-ci-runs-what-a-change-needs.md).
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs panel
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.pick.outputs.run == 'true'
      - name: Lint and format
        if: steps.pick.outputs.run == 'true'
        run: pnpm exec biome ci .
      - name: Typecheck
        if: steps.pick.outputs.run == 'true'
        run: pnpm -r --if-present typecheck
      - name: Tokens match the design system
        if: steps.pick.outputs.run == 'true'
        run: pnpm --filter @dockwell/ui tokens:check
      - name: Translations are complete
        if: steps.pick.outputs.run == 'true'
        run: pnpm --filter @dockwell/web i18n:check
      - name: Test
        if: steps.pick.outputs.run == 'true'
        run: pnpm -r --if-present test
      - name: Build the binary with the panel
        if: steps.pick.outputs.run == 'true'
        run: make build
      - name: Route tree is current
        if: steps.pick.outputs.run == 'true'
        run: git diff --exit-code -- web/src/routeTree.gen.ts
      - name: The binary serves the API and the panel
        if: steps.pick.outputs.run == 'true'
        run: scripts/smoke.sh bin/dockwell
      # The control plane reads the whole build at start, so its size is memory.
      - name: The panel build is within its size
        if: steps.pick.outputs.run == 'true'
        run: scripts/check-panel-size.sh
      - name: Bundle size
        if: steps.pick.outputs.run == 'true'
        run: |
          {
            echo "| Asset | Size | Brotli |"
            echo "| --- | ---: | ---: |"
            for f in internal/panel/dist/app/assets/*.{js,css}; do
              br="$f.br"
              printf '| %s | %s | %s |\n' "$(basename "$f")" "$(numfmt --to=iec --suffix=B "$(stat -c%s "$f")")" \
                "$( [ -f "$br" ] && numfmt --to=iec --suffix=B "$(stat -c%s "$br")" || echo "-")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Licenses and links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - name: License headers
        run: scripts/check-spdx.sh
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Links in docs
        run: go run ./scripts/checklinks
      - name: Release configuration is valid
        run: go tool -modfile=tools/go.mod goreleaser check
      # What each job's first step asks: whether this change needs it.
      - name: The job picker holds to its examples
        run: scripts/ci-jobs-test.sh

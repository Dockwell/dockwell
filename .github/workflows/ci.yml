# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOL: go tool -modfile=tools/go.mod

jobs:
  go:
    name: Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The store's tests run on SQLite and on this Postgres (ADR 0014).
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_PASSWORD: dockwell-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DOCKWELL_TEST_POSTGRES: postgres://postgres:dockwell-ci@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Modules are tidy
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: $GOTOOL golangci-lint run
      - name: Formatting
        run: $GOTOOL golangci-lint fmt --diff
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Static builds
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -o "bin/dockwell-linux-$arch" ./cmd/dockwell
          done
          ls -lh bin/

  schema:
    name: API schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: $GOTOOL buf lint
      - name: Formatting
        run: $GOTOOL buf format --diff --exit-code
      - name: No breaking changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE:proto" 2>/dev/null; then
            $GOTOOL buf breaking --against ".git#ref=$BASE"
          else
            echo "The base branch has no schema yet, so there is nothing to break."
          fi
      - name: Generated code is current
        run: make check-generated
      - name: TypeScript client typechecks
        run: pnpm -r --if-present typecheck

  panel:
    name: Panel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome ci .
      - name: Typecheck
        run: pnpm -r --if-present typecheck
      - name: Tokens match the design system
        run: pnpm --filter @dockwell/ui tokens:check
      - name: Translations are complete
        run: pnpm --filter @dockwell/web i18n:check
      - name: Test
        run: pnpm -r --if-present test
      - name: Build the binary with the panel
        run: make build
      - name: Route tree is current
        run: git diff --exit-code -- web/src/routeTree.gen.ts
      - name: The binary serves the API and the panel
        run: scripts/smoke.sh bin/dockwell
      - name: Bundle size
        run: |
          {
            echo "| Asset | Size | Brotli |"
            echo "| --- | ---: | ---: |"
            for f in internal/panel/dist/app/assets/*.{js,css}; do
              br="$f.br"
              printf '| %s | %s | %s |\n' "$(basename "$f")" "$(numfmt --to=iec --suffix=B "$(stat -c%s "$f")")" \
                "$( [ -f "$br" ] && numfmt --to=iec --suffix=B "$(stat -c%s "$br")" || echo "-")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  hygiene:
    name: Licenses and links
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: tools/go.sum
      - name: License headers
        run: scripts/check-spdx.sh
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
      - name: Links in docs
        run: go run ./scripts/checklinks
      - name: Release configuration is valid
        run: go tool -modfile=tools/go.mod goreleaser check

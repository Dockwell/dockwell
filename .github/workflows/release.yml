# SPDX-License-Identifier: AGPL-3.0-only
#
# Every push to main builds a snapshot. A version tag builds a release in two
# jobs, so no build code ever holds the signing or publishing credentials:
#
#   build    read-only, no caches; checks the tag is a green commit on main,
#            builds with GoReleaser, smoke-tests the binary, uploads dist/.
#   publish  runs no build code; signs the checksums with cosign (keyless),
#            checks the signature against the Sigstore trust root the release
#            carries, attests provenance, and publishes the GitHub release.
#
# See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  SYFT_VERSION: v1.54.1
  COSIGN_VERSION: v3.1.3

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read # to confirm CI passed on the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is a green commit on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/require-green.sh "$GITHUB_SHA"
      # No caches: a release must not build from anything another run wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build
        env:
          SNAPSHOT: ${{ github.ref_type == 'branch' && '--snapshot' || '' }}
        run: go tool -modfile=tools/go.mod goreleaser release --clean $SNAPSHOT
      - name: The binary serves the API and the panel
        run: |
          tar -xzf dist/dockwell_*_linux_amd64.tar.gz -C dist dockwell
          scripts/smoke.sh dist/dockwell
      # Mirrors serve these with the archives (docs/adr/0013-mirrors-for-releases-and-images.md).
      - name: Add the install script and the Sigstore trust root it pins
        run: |
          pinned=$(sed -n 's/^SIGSTORE_ROOT_SHA256=//p' scripts/install.sh)
          actual=$(sha256sum scripts/sigstore_trusted_root.json | cut -d ' ' -f 1)
          if [[ -z "$pinned" || "$pinned" != "$actual" ]]; then
            echo "::error file=scripts/install.sh::install.sh pins the trust root ${pinned:-nothing}, but scripts/sigstore_trusted_root.json is $actual. Update them together, as docs/releasing.md says."
            exit 1
          fi
          cp scripts/install.sh scripts/sigstore_trusted_root.json dist/
          (cd dist && sha256sum --check --strict checksums.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.ref_type == 'tag' && 'dockwell-release' || 'dockwell-snapshot' }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/checksums.txt
            dist/install.sh
            dist/sigstore_trusted_root.json
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 14 }}

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dockwell-release
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      # What an install through a mirror checks, without reaching Sigstore. If
      # Sigstore signed with a key the pinned trust root lacks, this fails
      # before anything is published; update the pin as docs/releasing.md says.
      - name: The signature verifies against the trust root the release carries
        run: |
          cosign verify-blob dist/checksums.txt --bundle dist/checksums.txt.sigstore.json \
            --trusted-root dist/sigstore_trusted_root.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.spdx.json
            dist/checksums.txt
            dist/install.sh
            dist/sigstore_trusted_root.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          cat > notes.md <<EOF
          ## Verify this release

          \`\`\`sh
          gh attestation verify dockwell_${version}_linux_amd64.tar.gz -R ${GITHUB_REPOSITORY}
          \`\`\`

          Or check the signed checksums with cosign, as [docs/releasing.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/releasing.md#verify-a-release) describes.
          EOF
          prerelease=()
          [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Dockwell $TAG" \
            --generate-notes \
            --notes-file notes.md \
            "${prerelease[@]}"

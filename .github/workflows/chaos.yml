# SPDX-License-Identifier: AGPL-3.0-only
name: Chaos

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOCKWELL_TEST: "1"

jobs:
  chaos:
    name: Chaos on Docker
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 30 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Whether this change needs this job
        id: pick
        run: scripts/ci-jobs.sh needs chaos
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.pick.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.pick.outputs.run == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pick.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: The disposable host and its Docker
        if: steps.pick.outputs.run == 'true'
        run: |
          docker version
          sudo -n true
          mkdir -p "$RUNNER_TEMP/dockwell-chaos"
      # Evidence for ADR 0054, printed and not judged: what Docker leaves in a
      # container's state and events when a person stops it, against when the
      # daemon dies under it. It runs first, so the stand starts on a daemon
      # that has settled.
      - name: What a stop and a daemon kill leave behind
        if: steps.pick.outputs.run == 'true'
        env:
          CHAOS_HOST_FAULTS: "1"
        run: scripts/docker-stops-evidence.sh
      - name: Faults during changes and local reconciliation
        if: steps.pick.outputs.run == 'true'
        env:
          CHAOS_HOST_FAULTS: "1"
          CHAOS_REQUIRE_ALL: "1"
          CHAOS_ROUNDS: ${{ github.event_name == 'schedule' && '3' || '1' }}
          TMPDIR: ${{ runner.temp }}/dockwell-chaos
        run: make chaos
      # Keep only process logs and the bounded failure state, never the stand's
      # data folders, which hold its keys, cookies and passkey.
      - name: Failure logs
        if: failure() && steps.pick.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-failure
          path: |
            ${{ runner.temp }}/dockwell-chaos/chaos-*/*.log
            ${{ runner.temp }}/dockwell-chaos/chaos-*/failure-*.json
          if-no-files-found: ignore
          retention-days: 7

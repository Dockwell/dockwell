# SPDX-License-Identifier: AGPL-3.0-only
#
# A route that names the cloudflare preset believes and answers a list of Cloudflare's
# ranges built into the agent (docs/adr/0030-routes-behind-a-tunnel-or-a-proxy.md).
# This checks that list against what Cloudflare publishes.
#
# Cloudflare changes its ranges on its own schedule, and that would turn every open
# pull request red at once. So this runs nightly, and on pull requests that change the
# list. A failed nightly run opens an issue, or comments on the one already open.
name: Cloudflare's ranges

on:
  pull_request:
    paths:
      - internal/ingress/trust.go
      - scripts/check-cloudflare-ranges.sh
      - .github/workflows/cloudflare-ranges.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-ranges-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Cloudflare's ranges
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The list in the agent is what Cloudflare publishes now
        run: scripts/check-cloudflare-ranges.sh

  report:
    name: Report a failed nightly check
    needs: check
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue, or comment on the one already open
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly check of Cloudflare's ranges fails"
          body="The nightly check of Cloudflare's ranges failed: $RUN

          If Cloudflare changed them, a route that names the cloudflare preset doesn't answer or believe what it should. Update cloudflareRanges in internal/ingress/trust.go from https://www.cloudflare.com/ips/. If the run failed for another reason, fix that, then run the workflow again."
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

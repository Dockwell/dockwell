# SPDX-License-Identifier: AGPL-3.0-only
spec:
  inputs:
    panel:
      description: HTTPS address of your Dockwell panel.
    token:
      description: Reference to a masked GitLab CI/CD variable with the Dockwell deploy token.
    service:
      description: Dockwell service ID.
    image:
      description: Published image reference by digest, such as the build job's DOCKWELL_IMAGE.
    version:
      description: Dockwell release tag.
      regex: '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
    build-job:
      description: Job that builds and publishes the image and exports its reference.
      default: build
    stage:
      description: Pipeline stage to run the deploy in.
      default: deploy
    job:
      description: Name of the deploy job.
      default: dockwell-deploy
---
"$[[ inputs.job ]]":
  stage: $[[ inputs.stage ]]
  image: debian:13-slim
  needs:
    - job: $[[ inputs.build-job ]]
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    DOCKWELL_URL: $[[ inputs.panel ]]
    DOCKWELL_TOKEN: $[[ inputs.token ]]
    DOCKWELL_SERVICE: $[[ inputs.service ]]
    DOCKWELL_CI_IMAGE: $[[ inputs.image ]]
    DOCKWELL_VERSION: $[[ inputs.version ]]
    DOCKWELL_CI_PROVIDER: gitlab-ci
  script:
    - apt-get update -qq && apt-get install -y -qq ca-certificates curl jq
    - |
      set -eu
      case "$(uname -m)" in
        x86_64)
          arch=amd64
          cosign_sha=4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
          ;;
        aarch64 | arm64)
          arch=arm64
          cosign_sha=c5d324e091826b0d7a78eb16fef316450b4eb9aaec045611c08ba06f5e73220a
          ;;
        *) printf '%s\n' 'Use an amd64 or arm64 runner.' >&2; exit 1 ;;
      esac
      work=$(mktemp -d)
      trap 'rm -rf -- "$work"' EXIT
      fetch() {
        curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          --connect-timeout 10 --max-time 300 --retry 3 --retry-max-time 360 -o "$2" "$1"
      }
      repo=https://github.com/Dockwell/dockwell
      release="$repo/releases/download/$DOCKWELL_VERSION"
      fetch "https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-$arch" "$work/cosign"
      printf '%s  %s\n' "$cosign_sha" "$work/cosign" | sha256sum --check --status
      chmod +x "$work/cosign"
      fetch "$release/checksums.txt" "$work/checksums.txt"
      fetch "$release/checksums.txt.sigstore.json" "$work/checksums.txt.sigstore.json"
      TUF_ROOT="$work/tuf" "$work/cosign" verify-blob \
        --certificate-identity "$repo/.github/workflows/release.yml@refs/tags/$DOCKWELL_VERSION" \
        --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        --bundle "$work/checksums.txt.sigstore.json" "$work/checksums.txt"
      script_sha=$(awk '$2 == "deploy.sh" { print $1 }' "$work/checksums.txt")
      if ! printf '%s\n' "$script_sha" | grep -Eq '^[0-9a-f]{64}$'; then
        printf '%s\n' 'The signed checksums do not list deploy.sh.' >&2
        exit 1
      fi
      fetch "$release/deploy.sh" "$work/deploy.sh"
      if ! printf '%s  %s\n' "$script_sha" "$work/deploy.sh" | sha256sum --check --status; then
        printf '%s\n' 'The deploy script checksum does not match.' >&2
        exit 1
      fi
      DOCKWELL_IMAGE="$DOCKWELL_CI_IMAGE" bash "$work/deploy.sh"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" role="img" aria-label="Agents keep serving even when the control plane is away" font-size="13" width="760" height="496"><title>Agents keep serving even when the control plane is away</title><style>svg{--ink:#191c1a;--ink-muted:#575e58;--line:#dfe2dd;--line-strong:#878d86;--cobalt:#2450d6;--surface:#ffffff;--surface-sunken:#ebede9;font-family:"Host Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#e8ece8;--ink-muted:#9aa39c;--line:#272c29;--line-strong:#68716b;--cobalt:#809dff;--surface:#161917;--surface-sunken:#0b0d0c}}</style><rect width="760" height="496" rx="12" style="fill:var(--surface)"></rect><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--line-strong)"></path></marker></defs><text x="24" y="32" font-size="15" font-weight="600" style="fill:var(--ink)">Agents keep serving even when the control plane is away</text><text x="24" y="52" font-size="11.5" style="fill:var(--ink-muted)">Public traffic reaches each node's ingress directly; the control plane is never in the data path.</text><g><rect x="24" y="72" width="496" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="40" y="96" font-weight="600" style="fill:var(--ink)">Surfaces</text><text x="40" y="112" font-size="11.5" style="fill:var(--ink)">Web UI · CLI · API · MCP server · Git config</text></g><g><rect x="536" y="72" width="200" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="552" y="96" font-weight="600" style="fill:var(--ink)">Git and CI</text><text x="552" y="112" font-size="11.5" style="fill:var(--ink)">Push and deploy webhooks</text></g><g><rect x="24" y="152" width="712" height="104" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="40" y="174" font-weight="600" style="fill:var(--ink)">Control plane — self-hosted or Dockwell Cloud</text></g><g><rect x="40" y="184" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="54" y="208" font-weight="600" style="fill:var(--ink)">API and auth</text><text x="54" y="224" font-size="11.5" style="fill:var(--ink)">Schema-first, RBAC</text></g><g><rect x="214" y="184" width="158" height="56" rx="8" fill-opacity="0.12" stroke-width="2" style="fill:var(--cobalt);stroke:var(--cobalt)"></rect><text x="228" y="208" font-weight="600" style="fill:var(--ink)">Revision store</text><text x="228" y="224" font-size="11.5" style="fill:var(--ink)">Diff, apply, undo</text></g><g><rect x="388" y="184" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="402" y="208" font-weight="600" style="fill:var(--ink)">Scheduler</text><text x="402" y="224" font-size="11.5" style="fill:var(--ink)">Placement by labels</text></g><g><rect x="562" y="184" width="158" height="56" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="576" y="208" font-weight="600" style="fill:var(--ink)">Builds and events</text><text x="576" y="224" font-size="11.5" style="fill:var(--ink)">Timeline and alerts</text></g><g fill="none" stroke-width="1.25" style="stroke:var(--line-strong)"><path d="M272 128V152" marker-end="url(#arch-arrow)"></path><path d="M636 128V152" marker-end="url(#arch-arrow)"></path><path d="M136 312V256" marker-end="url(#arch-arrow)"></path><path d="M380 312V256" marker-end="url(#arch-arrow)"></path><path d="M624 312V256" marker-end="url(#arch-arrow)"></path></g><text x="148" y="280" font-size="11.5" style="fill:var(--ink-muted)">Outbound mTLS from each agent</text><text x="148" y="296" font-size="11.5" style="fill:var(--ink-muted)">desired state down, status up</text><g><rect x="24" y="312" width="224" height="104" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="40" y="336" font-weight="600" style="fill:var(--ink)">Node · Hetzner VPS</text><text x="40" y="352" font-size="11.5" style="fill:var(--ink)">Docker and Compose workloads</text><text x="40" y="368" font-size="11.5" style="fill:var(--ink)">Ingress: Caddy or OpenResty</text><text x="40" y="384" font-size="11.5" style="fill:var(--ink)">Metrics, logs and backups</text><text x="40" y="400" font-size="11.5" style="fill:var(--ink)">Cached desired state</text></g><g><rect x="268" y="312" width="224" height="104" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="284" y="336" font-weight="600" style="fill:var(--ink)">Node · AWS EC2</text><text x="284" y="352" font-size="11.5" style="fill:var(--ink)">Same single-binary agent</text><text x="284" y="368" font-size="11.5" style="fill:var(--ink)">Joins with one command</text></g><g><rect x="512" y="312" width="224" height="104" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><text x="528" y="336" font-weight="600" style="fill:var(--ink)">Node · on-prem</text><text x="528" y="352" font-size="11.5" style="fill:var(--ink)">Behind NAT is fine</text><text x="528" y="368" font-size="11.5" style="fill:var(--ink)">No inbound ports opened</text></g><g stroke-width="1.25" style="stroke:var(--line-strong)"><line x1="136" y1="416" x2="136" y2="432"></line><line x1="380" y1="416" x2="380" y2="432"></line><line x1="624" y1="416" x2="624" y2="432"></line></g><g><rect x="24" y="432" width="712" height="40" rx="8" stroke-width="1.25" style="fill:var(--surface-sunken);stroke:var(--line-strong)"></rect><text x="380" y="456" text-anchor="middle" style="fill:var(--ink)">WireGuard mesh — private service-to-service traffic across providers and NAT</text></g></svg>

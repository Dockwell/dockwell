<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-label="Each phase ships something people can use and ends at a gate" font-size="11.5" width="760" height="352"><title>Each phase ships something people can use and ends at a gate</title><style>svg{--ink:#191c1a;--ink-muted:#575e58;--line:#dfe2dd;--line-strong:#878d86;--cobalt:#2450d6;--surface:#ffffff;--surface-sunken:#ebede9;font-family:"Host Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}@media (prefers-color-scheme:dark){svg{--ink:#e8ece8;--ink-muted:#9aa39c;--line:#272c29;--line-strong:#68716b;--cobalt:#809dff;--surface:#161917;--surface-sunken:#0b0d0c}}</style><rect width="760" height="352" rx="12" style="fill:var(--surface)"></rect><text x="24" y="32" font-size="15" font-weight="600" style="fill:var(--ink)">Each phase ships something people can use and ends at a gate</text><text x="24" y="52" style="fill:var(--ink-muted)">Estimated for a team of 3–5 engineers; months from project start. Diamonds mark exit gates.</text><g><path d="M196 84l10 10l-10 10l-10 -10z" style="fill:var(--line-strong)"></path><path d="M380 84l10 10l-10 10l-10 -10z" style="fill:var(--line-strong)"></path><path d="M564 84l10 10l-10 10l-10 -10z" style="fill:var(--line-strong)"></path></g><g><rect x="24" y="80" width="160" height="28" rx="14" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><g><rect x="24" y="140" width="160" height="188" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><line x1="36" y1="260" x2="172" y2="260" style="stroke:var(--line)"></line></g><text x="104" y="98" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">1 · Foundations</text><text x="24" y="128" style="fill:var(--ink-muted)">Months 0–3</text><text x="36" y="164" style="fill:var(--ink)">Agent + control plane</text><text x="36" y="180" style="fill:var(--ink)">Revision store, plans</text><text x="36" y="196" style="fill:var(--ink)">API schema, CLI, SDK</text><text x="36" y="212" style="fill:var(--ink)">Single-node deploys</text><text x="36" y="228" style="fill:var(--ink)">Internal alpha</text><text x="36" y="280" font-weight="600" style="fill:var(--ink)">Exit gate</text><text x="36" y="296" style="fill:var(--ink-muted)">Survives control-plane</text><text x="36" y="312" style="fill:var(--ink-muted)">loss in chaos tests</text></g><g><rect x="208" y="80" width="160" height="28" rx="14" fill-opacity="0.12" stroke-width="2" style="fill:var(--cobalt);stroke:var(--cobalt)"></rect><g><rect x="208" y="140" width="160" height="188" rx="8" fill="none" stroke-width="2" style="stroke:var(--cobalt)"></rect><line x1="220" y1="260" x2="356" y2="260" style="stroke:var(--line)"></line></g><text x="288" y="98" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">2 · Solo beta</text><text x="208" y="128" style="fill:var(--ink-muted)">Months 3–7</text><text x="220" y="164" style="fill:var(--ink)">Websites and runtimes</text><text x="220" y="180" style="fill:var(--ink)">Files, terminal, cron</text><text x="220" y="196" style="fill:var(--ink)">Git deploys, CI hooks</text><text x="220" y="212" style="fill:var(--ink)">Multi-node, free</text><text x="220" y="228" style="fill:var(--ink)">Backups and alerts</text><text x="220" y="244" style="fill:var(--ink)">Catalog, importers</text><text x="220" y="280" font-weight="600" style="fill:var(--ink)">Exit gate</text><text x="220" y="296" style="fill:var(--ink-muted)">90 s to a live URL;</text><text x="220" y="312" style="fill:var(--ink-muted)">1Panel import works</text></g><g><rect x="392" y="80" width="160" height="28" rx="14" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><g><rect x="392" y="140" width="160" height="188" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><line x1="404" y1="260" x2="540" y2="260" style="stroke:var(--line)"></line></g><text x="472" y="98" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">3 · Team 1.0</text><text x="392" y="128" style="fill:var(--ink-muted)">Months 7–12</text><text x="404" y="164" style="fill:var(--ink)">Environments</text><text x="404" y="180" style="fill:var(--ink)">PR previews</text><text x="404" y="196" style="fill:var(--ink)">Mesh and replicas</text><text x="404" y="212" style="fill:var(--ink)">Fleet actions in waves</text><text x="404" y="228" style="fill:var(--ink)">GitOps and MCP</text><text x="404" y="244" style="fill:var(--ink)">Cloud beta</text><text x="404" y="280" font-weight="600" style="fill:var(--ink)">Exit gate</text><text x="404" y="296" style="fill:var(--ink-muted)">External security audit;</text><text x="404" y="312" style="fill:var(--ink-muted)">100-node soak test</text></g><g><rect x="576" y="80" width="160" height="28" rx="14" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><g><rect x="576" y="140" width="160" height="188" rx="8" fill="none" stroke-width="1.25" style="stroke:var(--line-strong)"></rect><line x1="588" y1="260" x2="724" y2="260" style="stroke:var(--line)"></line></g><text x="656" y="98" text-anchor="middle" font-size="13" font-weight="600" style="fill:var(--ink)">4 · Fleet</text><text x="576" y="128" style="fill:var(--ink-muted)">Months 12+</text><text x="588" y="164" style="fill:var(--ink)">HA control plane</text><text x="588" y="180" style="fill:var(--ink)">SAML, SCIM, policy</text><text x="588" y="196" style="fill:var(--ink)">Approvals, windows</text><text x="588" y="212" style="fill:var(--ink)">Federation</text><text x="588" y="228" style="fill:var(--ink)">Air-gapped bundles</text><text x="588" y="244" style="fill:var(--ink)">Cloud GA</text><text x="588" y="280" font-weight="600" style="fill:var(--ink)">Exit gate</text><text x="588" y="296" style="fill:var(--ink-muted)">1,000-node scale test;</text><text x="588" y="312" style="fill:var(--ink-muted)">HA failover drill</text></g></svg
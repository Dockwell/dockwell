<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a domain: the way in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="Rail" active="apps" mode="single" hint-size="232px,100%"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line);">
<dc-import name="Topbar" mode="single" hint-size="100%,52px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 24px; max-width: 1360px; width: 100%; box-sizing: border-box;">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 class="title" style="margin: 0;">wordpress</h1>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted);"><code style="font-size: 12.5px;">wordpress:6.8-apache</code> · on hz-1 · no domain yet</p>
</div>
</div>

<section class="dw-panel">
<div class="dw-panel-head"><h2 class="dw-panel-title">What runs</h2><x-import component-from-global-scope="Dockwell.StatusBadge" status="running" label="Running"></x-import></div>
<div class="dw-panel-body" style="font-size: 13px; color: var(--ink-muted);">Port 80 in the app, published on 127.0.0.1:8085 on hz-1</div>
</section>

</div>
</main>

<div style="position: absolute; inset: 0; z-index: var(--z-sheet); background: var(--scrim); display: flex; justify-content: flex-end; padding: 8px; box-sizing: border-box;">
<div style="width: 560px; max-width: 100%; height: 100%;">
<x-import component-from-global-scope="Dockwell.Sheet" inline="{{yes}}" title="Add a domain to wordpress" subtitle="People reach the app at this name" footer="{{footer}}" on-close="{{noop}}">
<div style="display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-direction: column; gap: 6px;">
<span class="dw-field-label">Domain</span>
<div style="display: flex; gap: 8px; align-items: stretch;">
<div style="flex: 1 1 auto; min-width: 0;"><x-import component-from-global-scope="Dockwell.TextField" aria-label="Subdomain" default-value="wiki" mono="{{yes}}"></x-import></div>
<div style="flex: 0 0 200px;"><div class="dw-input" style="position: relative;">
<select class="dw-input-el" aria-label="Zone" style="appearance: none; -webkit-appearance: none; padding-right: 32px; cursor: pointer; font-family: var(--font-mono); font-size: 13px;"><option>.example.com</option><option>.example.org</option><option>Another domain</option></select>
<span style="position: absolute; right: 10px; top: 8px; display: flex; color: var(--ink-muted); pointer-events: none;"><x-import component-from-global-scope="Dockwell.Icon" name="chevron-up-down" size="{{14}}"></x-import></span>
</div></div>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-muted);"><span style="display: flex; color: var(--healthy);"><x-import component-from-global-scope="Dockwell.Glyph" shape="circle" size="{{8}}"></x-import></span>Free in Dockwell and at Cloudflare</span>
</div>

<div role="radiogroup" aria-labelledby="way-label" style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px;"><span id="way-label" class="dw-field-label">Way in</span><span style="font-size: 12.5px; color: var(--ink-muted);">example.com is on Cloudflare</span></div>
{{waysEl}}
</div>

<dl style="margin: 0; display: grid; grid-template-columns: 112px minmax(0, 1fr) max-content; gap: 12px 12px; align-items: baseline; font-size: 14px;">
<dt style="color: var(--ink-muted); font-size: 13px;">Reaches</dt>
<dd style="margin: 0;">wordpress on port 80</dd>
<dd style="margin: 0;"><a href="#" style="font-size: 13px; font-weight: 500;">Change</a></dd>
</dl>

<button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 8px; padding: 10px 0 0; border: 0; border-top: 1px solid var(--line); background: none; color: var(--ink); font: inherit; font-size: 14px; text-align: left; cursor: pointer;"><x-import component-from-global-scope="Dockwell.Icon" name="chevron-right" size="{{14}}"></x-import><span style="font-weight: 550;">Advanced</span><span style="font-size: 12.5px; color: var(--ink-muted);">Path / · Answers only hz-1’s tunnel</span></button>

<div style="display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 1px solid var(--line);">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;"><h3 class="label" style="margin: 0;">Plan</h3><span style="font-size: 12.5px; color: var(--ink-muted);">On hz-1, and at Cloudflare</span></div>
<x-import component-from-global-scope="Dockwell.PlanDiff" resources="{{plan}}" impact="Every other name in web-1, the panel’s among them, goes where it went"></x-import>
</div>

</div>
</x-import>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, DW = window.Dockwell;
    const zones = [
      { value: 'example.com', label: '.example.com' },
      { value: 'example.org', label: '.example.org' },
      { value: '', label: 'Another domain' }
    ];
    const plan = [
      { id: 'dns', action: 'create', kind: 'domain', kindLabel: 'DNS at Cloudflare', name: 'wiki.example.com', expanded: false, changes: [{ path: 'CNAME', to: 'web-1’s tunnel, proxied' }] },
      { id: 'tun', action: 'update', kind: 'route', kindLabel: 'Tunnel at Cloudflare', name: 'web-1', changes: [{ path: 'adds, once for example.com', to: '*.example.com' }, { path: 'to', to: 'http://127.0.0.1:80' }] },
      { id: 'route', action: 'create', kind: 'domain', kindLabel: 'Domain', name: 'wiki.example.com', changes: [{ path: 'reaches', to: 'wordpress:80' }, { path: 'HTTPS', to: 'Ends at Cloudflare' }] },
      { id: 'url', action: 'update', kind: 'app', kindLabel: 'App', name: 'wordpress', changes: [{ path: 'URL follows the app’s address', to: 'https://wiki.example.com' }, { path: 'restarts', to: 'wordpress' }] }
    ];
    const dark = (this.props.theme ?? 'light') === 'dark';
    const radio = 'width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--cobalt); color-scheme: ' + (dark ? 'dark' : 'light') + ';';
    const card = (on, off) => 'display: flex; gap: 12px; align-items: flex-start; padding: 12px; border-radius: var(--radius-sm); cursor: ' + (off ? 'not-allowed' : 'pointer') + '; border: 1px solid ' + (on ? 'var(--cobalt)' : 'var(--line)') + '; background: ' + (on ? 'var(--selection)' : 'var(--surface-raised)') + ';';
    const ways = [
      ['Through the tunnel web-1 on hz-1', 'Cloudflare ends HTTPS, and the tunnel reaches hz-1 at http://127.0.0.1:80.', true, false],
      ['Dockwell’s own tunnel on hz-1', 'A tunnel only Dockwell writes, beside web-1. About 20 MB on hz-1.', false, false, 'Add it'],
      ['Through Cloudflare’s proxy', 'A proxied record to 203.0.113.10, with 80 and 443 open on hz-1.', false, false],
      ['This server’s own HTTPS', 'Port 443 on hz-1 is held by nginx.', false, true, 'See it'],
      ['Something else in front', 'Dockwell writes nothing at Cloudflare. What’s in front ends HTTPS.', false, false]
    ].map(([title, line, on, off, act]) => ({
      title, line, on, off, act, box: card(on, off), radio,
      titleStyle: 'font-size: 14px; line-height: 20px; font-weight: ' + (on ? 550 : 500) + '; color: ' + (off ? 'var(--ink-muted)' : 'var(--ink)') + ';'
    }));
    const css = (str) => Object.fromEntries(str.split(';').map((d) => d.trim()).filter(Boolean).map((d) => {
      const i = d.indexOf(':');
      const k = d.slice(0, i).trim().replace(/-([a-z])/g, (_, c) => c.toUpperCase());
      return [k, d.slice(i + 1).trim()];
    }));
    const waysEl = h(React.Fragment, null, ways.map((w) => h('label', { key: w.title, style: css(w.box) },
      h('input', { type: 'radio', name: 'way', defaultChecked: w.on, disabled: w.off, style: css(w.radio) }),
      h('span', { style: { display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 } },
        h('span', { style: css(w.titleStyle) }, w.title),
        h('span', { style: { fontSize: 13, lineHeight: '18px', color: 'var(--ink-muted)' } }, w.line,
          w.act ? h(React.Fragment, null, ' · ', h('a', { href: '#', style: { fontWeight: 500 } }, w.act)) : null)))));
    const footer = h(React.Fragment, null,
      h('span', { className: 'dw-sheet-note' }, h(DW.Icon, { name: 'clock', size: 14 }), 'Nothing changes until you apply the plan'),
      h(DW.Button, { variant: 'ghost' }, 'Cancel'),
      h(DW.Button, { variant: 'primary', kbd: '⌘↵' }, 'Review plan'));
    return {
      theme: this.props.theme ?? 'light',
      zones, plan, footer, waysEl, yes: true,
      noop: () => {}
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone app</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="MobileHeader" title="api" sub="r128 · 3 replicas" back="M-Apps.dc.html" hint-size="390px,56px"></dc-import>
<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

<section class="dw-panel" aria-label="Status" style="display: flex; flex-direction: column;">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px;">
<div style="display: flex;"><x-import component-from-global-scope="Dockwell.StatusBadge" status="healthy" variant="pill"></x-import></div>
<div style="display: flex; flex-direction: column; gap: 2px;">
<span style="font-size: 14px; line-height: 20px; font-weight: 500;">r128 deployed 4 min ago by Mira Chen</span>
<code style="font-family: var(--font-mono); font-size: 12px; line-height: 18px; color: var(--ink-muted);">ghcr.io/acme/api:8be41d2</code>
</div>
</div>
<button type="button" aria-label="Open api.acme.dev" style="display: grid; grid-template-columns: 16px minmax(0, 1fr) auto 16px; align-items: center; column-gap: 10px; width: 100%; min-height: 48px; padding: 0 12px 0 16px; box-sizing: border-box; border: 0; border-top: 1px solid var(--line); background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer;">
<span style="display: flex; color: var(--ink-muted);"><x-import component-from-global-scope="Dockwell.Icon" name="globe" size="{{16}}"></x-import></span>
<code style="font-family: var(--font-mono); font-size: 13px; color: var(--ink);">api.acme.dev</code>
<span style="font-size: 12.5px; color: var(--ink-muted);">Certificate valid</span>
<span style="display: flex; color: var(--ink-muted);"><x-import component-from-global-scope="Dockwell.Icon" name="external" size="{{16}}"></x-import></span>
</button>
</section>

<section style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px;">
<h2 class="heading" style="margin: 0;">Replicas</h2>
<span style="font-size: 13px; color: var(--ink-muted);">3 of 3 healthy</span>
<span style="flex: 1 1 auto;"></span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); padding-right: 15px;">Memory</span>
</div>
<div class="dw-panel" style="display: flex; flex-direction: column; overflow: hidden;">
<sc-for list="{{replicas}}" as="r">
<div style="display: grid; grid-template-columns: 10px auto minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 48px; padding: 0 16px; box-sizing: border-box; border-top: {{r.sep}};">
<span style="display: flex;"><x-import component-from-global-scope="Dockwell.StatusBadge" status="healthy" label=""></x-import></span>
<span style="font-size: 15px; line-height: 20px; font-weight: 550;">{{r.server}}</span>
<span style="font-size: 12.5px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{r.where}}</span>
<span style="font-size: 13px; font-weight: 500;">{{r.mem}}</span>
</div>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px;">
<h2 class="heading" style="margin: 0;">Recent deploys</h2>
</div>
<div style="padding: 0 2px; --control-sm: 44px;">
<x-import component-from-global-scope="Dockwell.Timeline" events="{{events}}" on-undo="{{noop}}"></x-import>
</div>
</section>

</div>
<div style="flex: none; display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--canvas); --control-md: 48px;">
<a href="M-Logs.dc.html" class="dw-btn dw-btn-secondary dw-btn-md" style="flex: 1 1 0; text-decoration: none; font-size: 14px;"><x-import component-from-global-scope="Dockwell.Icon" name="terminal" size="{{16}}"></x-import><span>Logs</span></a>
<x-import component-from-global-scope="Dockwell.Button" variant="primary" icon="deploy" dc-props="{{deployBtn}}">Deploy</x-import>
</div>
<dc-import name="MobileTabBar" active="apps" mode="fleet" hint-size="390px,78px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement;
    const mono = (t) => h('code', { style: { fontFamily: 'var(--font-mono)', fontSize: 13 } }, t);
    const replicas = [
      { server: 'fra-1-04', where: 'Falkenstein', mem: '214 MB' },
      { server: 'fra-1-11', where: 'Falkenstein', mem: '198 MB' },
      { server: 'ams-1-02', where: 'Amsterdam', mem: '221 MB' }
    ].map((r, i) => Object.assign(r, { sep: i ? '1px solid var(--line)' : '0' }));
    const events = [
      { id: 1, kind: 'deploy', status: 'healthy', title: 'Add order export endpoint', revision: 'r128', actor: 'Mira Chen', time: '4 min ago', undoable: true, undoLabel: 'Roll back' },
      { id: 2, kind: 'deploy', title: 'Cache product lookups in valkey', revision: 'r127', actor: 'Sam Okafor', time: '3 h ago' },
      { id: 3, kind: 'deploy', title: 'Batch inventory sync with smaller pages', revision: 'r126', actor: 'Leo Park', time: '21 h ago' }
    ];
    return {
      theme: this.props.theme ?? 'light',
      replicas, events,
      deployBtn: { style: { flex: '1 1 0', fontSize: 14 } },
      noop: () => {}
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>

<title>App api, logs</title>

<x-import component-from-global-scope="Dockwell.StatusBadge" status="healthy"></x-import>

</div>
</div>
<div class="dw-tabs" role="tablist" aria-label="App sections">

<div style="flex: 1 1 240px; max-width: 320px; min-width: 200px;"><x-import component-from-global-scope="Dockwell.TextField" size="sm" icon="search" mono="{{yes}}" placeholder="status:5xx" aria-label="Search logs"></x-import></div>
<div role="group" aria-label="Levels" style="display: flex; align-items: center; gap: 6px;">
<button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font: 550 12.5px/1 var(--font-sans); cursor: pointer;">Info</button>
<button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font: 550 12.5px/1 var(--font-sans); cursor: pointer;"><span style="display: flex; color: var(--warning);"><x-import component-from-global-scope="Dockwell.Glyph" shape="triangle" size="{{9}}"></x-import></span>Warn</button>
<button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); color: var(--ink); font: 550 12.5px/1 var(--font-sans); cursor: pointer;"><span style="display: flex; color: var(--critical);"><x-import component-from-global-scope="Dockwell.Glyph" shape="square" size="{{9}}"></x-import></span>Error</button>
</div>
<span style="flex: 1 1 0;"></span>
<x-import component-from-global-scope="Dockwell.SegmentedControl" size="sm" label="Replica" options="{{replicas}}" default-value="all"></x-import>
<x-import component-from-global-scope="Dockwell.SegmentedControl" size="sm" label="Time range" options="{{ranges}}" default-value="live"></x-import>
</div>
<x-import component-from-global-scope="Dockwell.LogStream" title="api · production · 3 replicas" live="{{yes}}" height="{{560}}" lines="{{lines}}" toolbar="{{toolbar}}"></x-import>
</section>

</div>
</main>
</div>
</x-dc>

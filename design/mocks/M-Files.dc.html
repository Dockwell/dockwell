<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>File editor, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="MobileHeader" title=".user.ini" sub="/var/www/shop-legacy" back="M-Overview-Single.dc.html" hint-size="390px,56px"></dc-import>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--surface);">
<div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--canvas); font-size: 12.5px; line-height: 16px; color: var(--ink-muted);">
<span>shop-legacy.acme.dev · PHP 8.3</span>
<code style="font-size: 11.5px;">www-data · 644 · 271 B</code>
</div>
<div role="textbox" aria-multiline="true" aria-label="Edit .user.ini" style="position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 8px 0; font: 400 13px/22px var(--font-mono);">
<span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 0; width: 44px; border-right: 1px solid var(--line); background: var(--canvas);"></span>
<sc-for list="{{lines}}" as="l">
<div style="position: relative; display: flex; align-items: center; min-height: 22px; background: {{l.bg}};">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: {{l.bar}};"></span>
<span aria-hidden="true" style="flex: none; width: 44px; padding-right: 10px; box-sizing: border-box; text-align: right; font-size: 12px; color: {{l.num}};">{{l.n}}</span>
<span style="flex: 1 1 auto; min-width: 0; padding-left: 12px; white-space: pre; color: {{l.color}};">{{l.text}}<sc-if value="{{l.caret}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="display: inline-block; width: 2px; height: 17px; margin-left: 1px; vertical-align: -3px; background: var(--cobalt);"></span></sc-if></span>
<sc-if value="{{l.was}}" hint-placeholder-val="{{false}}"><span style="flex: none; padding-right: 16px; font: 500 11.5px/16px var(--font-sans); color: var(--ink-muted);">was <code style="font-size: 11px;">{{l.was}}</code></span></sc-if>
</div>
</sc-for>
</div>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 22px; background: var(--canvas); border-top: 1px solid var(--line);">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px;">
<span aria-hidden="true" style="width: 3px; height: 14px; border-radius: 2px; background: var(--diff-change);"></span>
<span style="font-weight: 600;">2 changes</span>
<span style="color: var(--ink-muted);">Lines 4 and 5 · not saved</span>
<span style="flex: 1 1 auto;"></span>
<span style="display: inline-flex; align-items: center; gap: 5px; color: var(--ink-muted);"><x-import component-from-global-scope="Dockwell.Icon" name="check" size="{{14}}"></x-import>Syntax OK</span>
</div>
<div style="display: flex; gap: 8px;">
<button type="button" class="dw-btn dw-btn-ghost dw-btn-lg" style="--h: 48px; flex: 0 0 auto; min-width: 104px; font-size: 15px; color: var(--ink);">Discard</button>
<button type="button" class="dw-btn dw-btn-primary dw-btn-lg" style="--h: 48px; flex: 1 1 auto; font-size: 15px;"><x-import component-from-global-scope="Dockwell.Icon" name="commit" size="{{18}}"></x-import><span>Review and save</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const src = [
      '; PHP settings for shop-legacy.acme.dev',
      '; PHP-FPM rereads this file every 300 s',
      '',
      'upload_max_filesize = 64M',
      'post_max_size = 64M',
      'memory_limit = 256M',
      'max_execution_time = 120',
      'max_input_vars = 3000',
      '',
      'display_errors = Off',
      'log_errors = On',
      'error_log = /var/log/php/shop-legacy.log'
    ];
    const edited = { 4: '8M', 5: '8M' };
    const lines = src.map((text, i) => {
      const n = i + 1, ch = !!edited[n];
      return {
        n, text,
        color: text.startsWith(';') ? 'var(--ink-muted)' : 'var(--ink)',
        bg: ch ? 'var(--diff-change-soft)' : 'transparent',
        bar: ch ? 'var(--diff-change)' : 'transparent',
        num: ch ? 'var(--ink)' : 'var(--ink-muted)',
        was: edited[n] || '',
        caret: n === 5
      };
    });
    return { theme: this.props.theme ?? 'light', lines };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a domain: its states</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="Rail" active="domains" mode="single" hint-size="232px,100%"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line);">
<dc-import name="Topbar" mode="single" hint-size="100%,52px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 24px; max-width: 1360px; width: 100%; box-sizing: border-box;">

<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 class="title" style="margin: 0;">Add a domain, off the happy path</h1>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted);">Each state is a fact and one action, under the field it belongs to</p>
</div>

{{statesEl}}

<section style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 8px; min-height: 28px;">
<h2 class="heading" style="margin: 0;">All domains</h2>
<span style="font-size: 13px; color: var(--ink-muted);">2 gone at Cloudflare</span>
</div>
<x-import component-from-global-scope="Dockwell.Table" columns="{{cols}}" rows="{{domains}}" caption="Domains" on-row-click="{{noop}}"></x-import>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1830}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, DW = window.Dockwell;
    const muted = { color: 'var(--ink-muted)' };
    const tones = { ok: ['var(--healthy)', 'circle'], warn: ['var(--warning)', 'triangle'], bad: ['var(--critical)', 'square'], info: ['var(--ink-muted)', 'info'] };
    const act = (t) => t ? h(React.Fragment, null, ' · ', h('a', { href: '#', style: { fontWeight: 500 } }, t)) : null;
    const line = (tone, text, action) => h('span', { style: { display: 'inline-flex', alignItems: 'baseline', gap: 6, fontSize: 12.5, lineHeight: '18px', color: 'var(--ink-muted)' } },
      h('span', { style: { display: 'flex', flex: 'none', color: tones[tone][0], alignSelf: 'flex-start', marginTop: 5 } }, h(DW.Glyph, { shape: tones[tone][1], size: 8 })),
      h('span', null, text, act(action)));
    const select = (label) => h('div', { className: 'dw-input', style: { position: 'relative' } },
      h('select', { className: 'dw-input-el', 'aria-label': 'Zone', defaultValue: label, style: { appearance: 'none', WebkitAppearance: 'none', paddingRight: 32, cursor: 'pointer', fontFamily: 'var(--font-mono)', fontSize: 13 } },
        ['.example.com', '.example.org', 'Another domain'].map((o) => h('option', { key: o }, o))),
      h('span', { style: { position: 'absolute', right: 10, top: 8, display: 'flex', color: 'var(--ink-muted)', pointerEvents: 'none' } }, h(DW.Icon, { name: 'chevron-up-down', size: 14 })));
    const field = (sub, zone, check, placeholder) => h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6 } },
      h('span', { className: 'dw-field-label' }, 'Domain'),
      zone === null
        ? h('div', { style: { display: 'flex', gap: 8 } },
            h('div', { style: { flex: '1 1 auto', minWidth: 0 } }, h(DW.TextField, { 'aria-label': 'Domain', defaultValue: sub, mono: true })),
            h('div', { style: { flex: '0 0 160px' } }, select('Another domain')))
        : h('div', { style: { display: 'flex', gap: 8 } },
            h('div', { style: { flex: '1 1 auto', minWidth: 0 } }, h(DW.TextField, { 'aria-label': 'Subdomain', defaultValue: sub, placeholder, mono: true })),
            h('div', { style: { flex: '0 1 160px' } }, select(zone))),
      check);
    const way = (title, check, change) => h('dl', { style: { margin: 0, display: 'grid', gridTemplateColumns: '72px minmax(0, 1fr) max-content', gap: 12, alignItems: 'baseline', fontSize: 14 } },
      h('dt', { style: { color: 'var(--ink-muted)', fontSize: 13 } }, 'Way in'),
      h('dd', { style: { margin: 0, display: 'flex', flexDirection: 'column', gap: 2, minWidth: 0 } }, h('span', null, title), check),
      h('dd', { style: { margin: 0 } }, change === false ? null : h('a', { href: '#', style: { fontSize: 13, fontWeight: 500 } }, 'Change')));
    const states = [
      ['Missing right', null, h(React.Fragment, null,
        field('wiki', '.example.com', line('ok', 'Free in Dockwell and at Cloudflare')),
        way('Through the tunnel web-1 on hz-1', line('warn', 'The token lacks Cloudflare Tunnel edit', 'Add it to this token')))],
      ['A record made by hand', 'An admin', field('vpn', '.example.com', line('warn', 'A record exists: A 203.0.113.9, made in Cloudflare', 'Replace it'))],
      ['A record made by hand', 'A developer', field('vpn', '.example.com', line('bad', 'Taken at Cloudflare', 'Use vpn-2'))],
      ['In Dockwell already', null, field('blog', '.example.com', line('bad', 'Used by blog in Websites', 'Open it'))],
      ['A rule catches it first', 'An admin', field('api', '.example.com', line('bad', '*.example.com in web-1 catches it first, to http://127.0.0.1:8080', 'Change'))],
      ['Two levels down', null, field('a.docs', '.example.com', line('bad', 'a.docs.example.com is past Cloudflare’s free certificate', 'Use a-docs'))],
      ['The zone itself', null, h(React.Fragment, null,
        field('', '.example.com', line('ok', 'example.com, with www.example.com beside it'), 'none'),
        way('Through the tunnel web-1 on hz-1', line('info', 'Adds example.com to web-1, once')))],
      ['A tunnel in a file', null, way('Something else in front', line('info', 'hz-1’s tunnel is managed in a file, so Dockwell writes nothing at Cloudflare'))],
      ['Not this server’s tunnel', null, way('Something else in front', line('info', 'web-1 isn’t connected from hz-2', 'Dockwell’s own tunnel'))],
      ['The zone rule can’t go in', 'An admin', way('Something else in front', line('warn', '*.example.com would move ftp.example.com, which goes to http://127.0.0.1:2121 now', 'Dockwell’s own tunnel'))],
      ['One tunnel, two servers', null, way('Something else in front', line('info', 'web-1 runs on hz-1 and hz-2, so Dockwell can’t send a name to one of them', 'Dockwell’s own tunnel'))],
      ['Two servers, one address', null, way('Something else in front', line('info', 'hz-1 and hz-2 share an address, so Dockwell can’t tell which runs web-1', 'Dockwell’s own tunnel'))],
      ['An edit replaced', 'In the plan', h('div', { style: { display: 'flex', flexDirection: 'column', gap: 6, fontSize: 14 } }, h('span', null, 'Adds *.example.com to web-1'), line('warn', 'An edit made in Cloudflare between 10:42:01 and 10:42:02 was replaced. Dockwell kept what it read', 'Open web-1'))],
      ['No way in', null, way('None yet', line('bad', 'hz-1 has no public address and no tunnel', 'Add a tunnel'), false)],
      ['A zone on Flexible', 'An admin', way('Through Cloudflare’s proxy', line('warn', 'example.org is set to Flexible, so Cloudflare reaches hz-2 over HTTP', 'Use Full (strict)'))],
      ['Another domain', null, h(React.Fragment, null,
        field('shop.example.net', null, line('ok', 'Points at 203.0.113.10, hz-1')),
        way('This server’s own HTTPS', line('info', 'example.net isn’t in a connected zone, so Dockwell writes no DNS', 'Connect it')))]
    ];
    const statesEl = h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(min(100%, 340px), 1fr))', gap: 16 } },
      states.map(([title, who, body], i) => h('section', { key: i, className: 'dw-panel' },
        h('div', { className: 'dw-panel-head' }, h('h2', { className: 'dw-panel-title' }, title), who ? h('span', { style: Object.assign({ fontSize: 12.5 }, muted) }, who) : null),
        h('div', { className: 'dw-panel-body', style: { display: 'flex', flexDirection: 'column', gap: 16 } }, body))));
    const stateCell = (r) => r.gone
      ? h('div', { className: 'dw-cell' }, h(DW.StatusBadge, { status: 'degraded', label: r.gone }), h('span', { style: { paddingLeft: 16, fontSize: 12.5, lineHeight: '16px' } }, h('a', { href: '#', style: { fontWeight: 500 } }, 'Put it back')))
      : h(DW.StatusBadge, { status: 'healthy', label: 'Published', meta: r.meta });
    const domains = [
      { id: 'wiki', name: 'wiki.example.com', target: 'wordpress', way: 'Tunnel web-1', gone: 'Not in the tunnel any more' },
      { id: 'help', name: 'help.example.com', target: 'docs (website)', way: 'Tunnel web-1', gone: 'Its DNS record is gone at Cloudflare' },
      { id: 'docs', name: 'docs.example.com', target: 'docs (website)', way: 'Cloudflare’s proxy', meta: 'proxied' },
      { id: 'status', name: 'status.example.org', target: 'uptime-kuma', way: 'Tunnel web-1', meta: 'by *.example.org' }
    ];
    const cols = [
      { key: 'name', header: 'Domain', render: (r) => h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 13, fontWeight: 500 } }, r.name) },
      { key: 'target', header: 'Routes to', width: 200 },
      { key: 'way', header: 'Way in', width: 200 },
      { key: 'state', header: 'At Cloudflare', width: 280, render: stateCell }
    ];
    return {
      theme: this.props.theme ?? 'light',
      statesEl, domains, cols, yes: true,
      noop: () => {}
    };
  }
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone overview, one server</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="MobileHeader" title="hz-1" sub="Healthy · up 41 days" back="" hint-size="390px,56px"></dc-import>
<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="CPU" value="23.4" unit="%"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Memory" value="3.1" unit="of 8 GB"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Disk" value="61" unit="of 160 GB"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Network" value="12.4" unit="Mbit/s"></x-import></div>
</div>

<section style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px;">
<h2 class="heading" style="margin: 0;">Apps</h2>
<span style="font-size: 13px; color: var(--ink-muted);">5 healthy · 1 deploying</span>
<span style="flex: 1 1 auto;"></span>
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); padding-right: 39px;">Memory</span>
</div>
<div class="dw-panel" style="display: flex; flex-direction: column; overflow: hidden;">
<sc-for list="{{apps}}" as="a">
<a href="M-App.dc.html" style="display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 16px; align-items: center; column-gap: 12px; min-height: 56px; padding: 8px 12px 8px 16px; box-sizing: border-box; border-top: {{a.sep}}; text-decoration: none; color: var(--ink);">
<span style="align-self: start; display: flex; padding-top: 6px;"><x-import component-from-global-scope="Dockwell.StatusBadge" status="{{a.status}}" label=""></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 15px; line-height: 20px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{a.name}}</span>
<span style="font-size: 12.5px; line-height: 16px; color: {{a.tone}};">{{a.word}}</span>
</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: var(--ink);">{{a.mem}}</span>
<span style="display: flex; color: var(--ink-muted);"><x-import component-from-global-scope="Dockwell.Icon" name="chevron-right" size="{{16}}"></x-import></span>
</a>
</sc-for>
</div>
</section>

<a href="Server-Updates.dc.html" class="dw-panel" style="display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; column-gap: 12px; min-height: 64px; padding: 12px 12px 12px 16px; box-sizing: border-box; text-decoration: none; color: var(--ink);">
<span style="align-self: start; display: flex; padding-top: 5px; color: var(--warning);"><x-import component-from-global-scope="Dockwell.Glyph" shape="triangle" size="{{10}}"></x-import></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
<span style="font-size: 15px; line-height: 20px; font-weight: 550;">3 security updates</span>
<span style="font-size: 12.5px; line-height: 16px; color: var(--ink-muted);">openssl, libssh, linux-image</span>
<span style="font-size: 12.5px; line-height: 16px; color: var(--ink-muted);">Needs a reboot, about 40 s</span>
</span>
<span style="display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 550; color: var(--ink);">Review<span style="display: flex; color: var(--ink-muted);"><x-import component-from-global-scope="Dockwell.Icon" name="chevron-right" size="{{16}}"></x-import></span></span>
</a>

</div>
<dc-import name="MobileTabBar" active="overview" mode="single" hint-size="390px,78px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const word = { healthy: 'Healthy', deploying: 'Deploying r57', degraded: 'Degraded', down: 'Down', stopped: 'Stopped' };
    const tone = { healthy: 'var(--ink-muted)', deploying: 'var(--cobalt)', degraded: 'var(--warning)', down: 'var(--critical)', stopped: 'var(--ink-muted)' };
    const apps = [
      { id: 'web', name: 'storefront-web', status: 'healthy', mem: '412 MB' },
      { id: 'api', name: 'api', status: 'healthy', mem: '688 MB' },
      { id: 'worker', name: 'worker', status: 'deploying', mem: '301 MB' },
      { id: 'kuma', name: 'uptime-kuma', status: 'healthy', mem: '142 MB' },
      { id: 'n8n', name: 'n8n', status: 'healthy', mem: '356 MB' },
      { id: 'plausible', name: 'plausible', status: 'healthy', mem: '520 MB' }
    ].map((a, i) => Object.assign(a, { word: word[a.status], tone: tone[a.status], sep: i ? '1px solid var(--line)' : '0' }));
    return {
      theme: this.props.theme ?? 'light',
      apps
    };
  }
}
</script>
</body>
</html>

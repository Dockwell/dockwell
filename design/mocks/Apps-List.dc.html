<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apps</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="Rail" active="apps" mode="fleet" hint-size="232px,100%"></dc-import>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid var(--line);">
<dc-import name="Topbar" mode="fleet" hint-size="100%,52px"></dc-import>
<div style="display: flex; flex-direction: column; gap: 24px; padding: 24px; max-width: 1360px; width: 100%; box-sizing: border-box;">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-direction: column; gap: 4px;">
<h1 class="title" style="margin: 0;">Apps</h1>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted);">8 apps in storefront / production</p>
</div>
<a href="Apps-New.dc.html" class="dw-btn dw-btn-primary dw-btn-md" style="text-decoration: none;"><x-import component-from-global-scope="Dockwell.Icon" name="plus" size="{{16}}"></x-import><span>New app</span></a>
</div>

<section aria-label="Apps in storefront" style="display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;">
<x-import component-from-global-scope="Dockwell.SegmentedControl" options="{{envs}}" default-value="production" label="Environment" size="sm"></x-import>
<span style="flex: 1 1 24px;"></span>
<div style="flex: 0 1 280px; min-width: 200px;"><x-import component-from-global-scope="Dockwell.TextField" size="sm" icon="search" placeholder="Filter by name, image or domain" aria-label="Filter apps"></x-import></div>
<x-import component-from-global-scope="Dockwell.Button" size="sm" icon="filter">Filter</x-import>
</div>
<x-import component-from-global-scope="Dockwell.Table" columns="{{cols}}" rows="{{apps}}" caption="Apps in storefront / production" on-row-click="{{noop}}"></x-import>
<p style="margin: 0; font-size: 13px; color: var(--ink-muted);">14 apps across Acme. The other 6 are in internal-tools and data.</p>
</section>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":710}}'>
class Component extends DCLogic {
  renderVals() {
    const h = React.createElement, DW = window.Dockwell;
    const wave = (n, base, amp, seed) => Array.from({ length: n }, (_, i) => +(base + amp * Math.sin((i + seed) / 3.1) + amp * 0.5 * Math.sin((i * 7 + seed) / 5.3)).toFixed(1));
    const tone = { healthy: 'ink', deploying: 'cobalt', degraded: 'warning', stopped: 'idle', down: 'critical' };
    const mono = { fontFamily: 'var(--font-mono)', fontSize: 12 };
    const cell = (t, s) => h('div', { className: 'dw-cell' }, h('span', { className: 'dw-cell-title' }, t), h('span', { className: 'dw-cell-sub' }, s));
    const ramp = (a, b, n) => Array.from({ length: n }, (_, i) => +(a + (b - a) * Math.pow(i / (n - 1), 1.6) + 2 * Math.sin(i / 1.7)).toFixed(1));
    const apps = [
      { id: 'web', name: 'storefront-web', image: 'ghcr.io/acme/storefront:2c71f09', status: 'deploying', rev: 'r64', replicas: '3 of 3', servers: 'fra-1-15 · fra-1-16 · ams-1-09', cpu: wave(20, 24, 5, 1), domain: 'acme.dev', at: 'now' },
      { id: 'api', name: 'api', image: 'ghcr.io/acme/api:8be41d2', status: 'healthy', rev: 'r128', replicas: '3 of 3', servers: 'fra-1-04 · fra-1-11 · ams-1-02', cpu: wave(20, 31, 5, 2), domain: 'api.acme.dev', at: '4 min ago' },
      { id: 'worker', name: 'worker', image: 'ghcr.io/acme/worker:9a03e1b', status: 'degraded', rev: 'r57', replicas: '4 of 4', servers: '3 servers', cpu: ramp(30, 88, 20), domain: '—', at: '24 min ago' },
      { id: 'checkout', name: 'checkout', image: 'ghcr.io/acme/checkout:e19b2c4', status: 'healthy', rev: 'r212', replicas: '3 of 3', servers: 'fra-1-06 · fra-1-12 · ams-1-07', cpu: wave(20, 19, 4, 3), domain: 'checkout.acme.dev', at: '6 h ago' },
      { id: 'search', name: 'search', image: 'getmeili/meilisearch:v1.11', status: 'healthy', rev: 'r9', replicas: '1 of 1', servers: 'sfo-2-08', cpu: wave(20, 12, 3, 4), domain: '—', at: '28 Oct' },
      { id: 'images', name: 'images', image: 'darthsim/imgproxy:v3.27', status: 'healthy', rev: 'r14', replicas: '2 of 2', servers: 'fra-1-09 · ams-1-06', cpu: wave(20, 16, 4, 5), domain: 'img.acme.dev', at: '21 Oct' },
      { id: 'plausible', name: 'plausible', image: 'ghcr.io/plausible/community-edition:v2.1.4', status: 'healthy', rev: 'r6', replicas: '1 of 1', servers: 'ams-1-10', cpu: wave(20, 8, 2, 6), domain: 'stats.acme.dev', at: '12 Oct' },
      { id: 'kuma', name: 'uptime-kuma', image: 'louislam/uptime-kuma:1.23.16', status: 'healthy', rev: 'r3', replicas: '1 of 1', servers: 'fra-1-07', cpu: wave(20, 5, 1.5, 7), domain: 'status.acme.dev', at: '9 Oct' }
    ];
    const cols = [
      { key: 'name', header: 'App', render: (r) => cell(r.name, r.image) },
      { key: 'status', header: 'Status', render: (r) => h(DW.StatusBadge, { status: r.status }) },
      { key: 'rev', header: 'Revision', mono: true },
      { key: 'replicas', header: 'Replicas' },
      { key: 'servers', header: 'Servers', muted: true, render: (r) => h('span', { style: /^\d/.test(r.servers) ? { fontSize: 13 } : mono }, r.servers) },
      { key: 'cpu', header: 'CPU, last hour', render: (r) => h(DW.Sparkline, { data: r.cpu, width: 88, height: 20, min: 0, max: 100, tone: tone[r.status] }) },
      { key: 'domain', header: 'Domain', mono: true, muted: true },
      { key: 'at', header: 'Deployed', align: 'right', muted: true }
    ];
    const envs = [
      { value: 'production', label: 'Production', count: 8 },
      { value: 'staging', label: 'Staging', count: 8 },
      { value: 'previews', label: 'Previews', count: 3 }
    ];
    return {
      theme: this.props.theme ?? 'light',
      apps, cols, envs,
      noop: () => {}
    };
  }
}
</script>
</body>
</html>

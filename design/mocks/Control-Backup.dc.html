<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings · Backups</title>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<style>
body { margin: 0; padding: clamp(16px, 4vw, 40px); background: var(--canvas); color: var(--ink); font: 14px/1.45 var(--font-sans); }
main { max-width: 760px; margin: auto; }
h1 { font-size: 26px; }
h2, h3, p { margin: 0; }
.head, .primary, .actions, li { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.primary, .actions, li { padding: 16px; border-top: 1px solid var(--line); }
ul { list-style: none; padding: 0; margin: 0; }
small { display: block; color: var(--ink-muted); }
.metric { font-size: 28px; font-weight: 600; }
.warning { color: var(--warning); }
</style>
</head>
<body>
<main>
  <h1>Backups</h1>
  <section class="dw-panel">
    <header class="dw-panel-head head"><h2 class="dw-panel-title">Control plane</h2><button class="dw-btn dw-btn-primary dw-btn-sm">Take one now</button></header>
    <div class="primary"><div><h3>Newest off-site copy</h3><strong class="metric">7 min ago</strong><small>Off-site storage</small></div><button class="dw-btn dw-btn-secondary dw-btn-sm">Change destination</button></div>
    <ul><li><span>hz-1</span><span>7 min ago</span></li><li><span>hz-2<small>Server is disconnected</small></span><span class="warning">3 h ago</span></li></ul>
    <div class="actions"><strong>Recovery passphrase</strong><div><button class="dw-btn dw-btn-secondary dw-btn-sm">Show passphrase</button> <button class="dw-btn dw-btn-secondary dw-btn-sm">Recovery sheet</button></div></div>
  </section>
</main>
</body>
</html>

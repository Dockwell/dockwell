<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone overview, fleet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="MobileHeader" title="Fleet" sub="Acme / storefront / production" back="" hint-size="390px,56px"></dc-import>
<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 16px;">

<x-import component-from-global-scope="Dockwell.Callout" tone="critical" title="ams-1-03 is down">
<span style="display: block;">No heartbeat since 14:02. Its 2 replicas moved to ams-1-04 and ams-1-05.</span>
<span style="display: flex; gap: 8px; margin-top: 12px; --control-md: 44px;">
<a href="M-Servers.dc.html" class="dw-btn dw-btn-secondary dw-btn-md" style="flex: 1 1 0; text-decoration: none;">Inspect</a>
<x-import component-from-global-scope="Dockwell.Button" variant="primary" dc-props="{{replaceBtn}}">Replace server</x-import>
</span>
</x-import>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="CPU" value="38.4" unit="%"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Memory" value="204" unit="of 336 GB"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Requests" value="11.2k" unit="/min"></x-import></div>
<div class="dw-panel" style="padding: 12px 14px;"><x-import component-from-global-scope="Dockwell.Metric" label="Error rate" value="0.42" unit="%" delta="{{errDelta}}" delta-tone="warning"></x-import></div>
</div>

<div class="dw-panel" style="padding: 16px;">
<x-import component-from-global-scope="Dockwell.FleetGrid" servers="{{fleet}}" size="sm" legend="{{yes}}" readout="{{no}}" on-select="{{noop}}"></x-import>
</div>

<section style="display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; align-items: baseline; gap: 8px; padding: 0 2px;">
<h2 class="heading" style="margin: 0;">Recent changes</h2>
</div>
<div style="padding: 4px 2px 0;">
<x-import component-from-global-scope="Dockwell.Timeline" events="{{events}}"></x-import>
</div>
</section>

</div>
<dc-import name="MobileTabBar" active="overview" mode="fleet" hint-size="390px,78px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const servers = (region, net, n, special) => Array.from({ length: n }, (_, k) => {
      const i = k + 1, id = region + '-' + String(i).padStart(2, '0'), sp = special[i] || {}, st = sp.status || 'healthy';
      return { id, name: id, status: st, cpu: st === 'stopped' || st === 'down' ? null : (sp.cpu || 14 + (i * 37) % 52), ip: '10.210.' + net + '.' + i, note: sp.note };
    });
    const groups = [
      { label: 'fra-1', meta: 'Hetzner · 24', servers: servers('fra-1', 4, 24, { 7: { status: 'degraded', cpu: 92, note: 'Memory above 90% since 13:58' }, 15: { status: 'deploying' }, 16: { status: 'deploying' }, 22: { status: 'stopped' } }) },
      { label: 'ams-1', meta: 'DigitalOcean · 16', servers: servers('ams-1', 5, 16, { 3: { status: 'down', note: 'No heartbeat since 14:02' }, 9: { status: 'deploying' }, 12: { status: 'degraded', cpu: 88 } }) },
      { label: 'sfo-2', meta: 'On-prem rack B · 12', servers: servers('sfo-2', 6, 12, { 5: { status: 'stopped' } }) }
    ];
    const events = [
      { id: 1, kind: 'deploy', status: 'deploying', title: 'Deploying storefront-web', revision: 'r64', actor: 'GitHub Actions', time: 'now' },
      { id: 2, kind: 'alert', tone: 'warning', title: 'Error rate rose to 0.42%', meta: 'Since worker r57 · was 0.10%', time: '22 min ago' }
    ];
    return {
      theme: this.props.theme ?? 'dark',
      fleet: groups.reduce((all, g) => all.concat(g.servers), []), events,
      errDelta: React.createElement('span', { style: { color: 'var(--warning)' } }, '+0.32'),
      replaceBtn: { style: { flex: '1 1 0' }, icon: 'server' },
      yes: true, no: false,
      noop: () => {}
    };
  }
}
</script>
</body>
</html>

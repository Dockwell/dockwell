<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/dockwell/tokens.css">
<link rel="stylesheet" href="ds/dockwell/components/bundle.css">
<script src="ds/dockwell/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:var(--link)}a:hover{text-decoration:underline}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 390px; height: 844px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-sans);">
<dc-import name="MobileHeader" title="Terminal" sub="root@hz-1 · through the agent" back="M-Overview-Single.dc.html" hint-size="390px,56px"></dc-import>

<div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--surface-sunken);">
<div role="log" aria-label="Terminal output for root@hz-1" style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 12px 10px; box-sizing: border-box; font: 400 13px/20px var(--font-mono); color: var(--ink);">
<sc-for list="{{lines}}" as="l"><div style="min-height: 20px; white-space: pre;"><span style="color: var(--ink-muted);">{{l.pre}}</span><span style="color: {{l.color}};">{{l.text}}</span></div></sc-for>
<div style="display: flex; align-items: center; white-space: pre;"><span style="color: var(--ink-muted);">root@hz-1:~# </span><span aria-hidden="true" style="display: inline-block; width: 8px; height: 17px; background: var(--ink);"></span></div>
</div>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 8px 22px; background: var(--canvas); border-top: 1px solid var(--line);">
<div role="toolbar" aria-label="Terminal keys, scroll for more" style="position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;">
<div style="display: flex; gap: 6px; width: max-content;">
<button type="button" aria-label="Escape" style="display: grid; place-items: center; min-width: 52px; height: 44px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink); font: 550 14px/1 var(--font-sans);">Esc</button>
<button type="button" aria-label="Tab" style="display: grid; place-items: center; min-width: 52px; height: 44px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink); font: 550 14px/1 var(--font-sans);">Tab</button>
<button type="button" aria-label="Control" aria-pressed="false" style="display: grid; place-items: center; min-width: 52px; height: 44px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink); font: 550 14px/1 var(--font-sans);">Ctrl</button>
<button type="button" aria-label="Left arrow" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink);"><x-import component-from-global-scope="Dockwell.Icon" name="arrow-left" size="{{18}}"></x-import></button>
<button type="button" aria-label="Up arrow" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink);"><span style="display: flex; transform: rotate(-90deg);"><x-import component-from-global-scope="Dockwell.Icon" name="arrow-right" size="{{18}}"></x-import></span></button>
<button type="button" aria-label="Down arrow" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink);"><span style="display: flex; transform: rotate(90deg);"><x-import component-from-global-scope="Dockwell.Icon" name="arrow-right" size="{{18}}"></x-import></span></button>
<button type="button" aria-label="Right arrow" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink);"><x-import component-from-global-scope="Dockwell.Icon" name="arrow-right" size="{{18}}"></x-import></button>
<button type="button" aria-label="Pipe" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 16px/1 var(--font-mono);">|</button>
<button type="button" aria-label="Tilde" style="display: grid; place-items: center; width: 44px; height: 44px; padding: 0; box-sizing: border-box; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 8px; background: var(--surface); color: var(--ink); font: 500 16px/1 var(--font-mono);">~</button>
</div>
</div>
<span aria-hidden="true" style="flex: none; width: 1px; height: 28px; background: var(--line);"></span>
<button type="button" aria-label="Text size" style="flex: none; display: flex; align-items: baseline; justify-content: center; gap: 1px; width: 44px; height: 44px; padding: 13px 0 0; box-sizing: border-box; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-family: var(--font-sans); font-weight: 550;"><span style="font-size: 12px; line-height: 1;">A</span><span style="font-size: 17px; line-height: 1;">a</span></button>
<button type="button" style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font: 550 14px/1 var(--font-sans);"><span>Paste</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const P = 'root@hz-1:~# ', ink = 'var(--ink)', muted = 'var(--ink-muted)';
    const cmd = (c) => ({ pre: P, text: c, color: ink });
    const out = (t) => ({ pre: '', text: t, color: ink });
    const note = (t) => ({ pre: '', text: t, color: muted });
    const lines = [
      note('Connected to hz-1 through the Dockwell agent.'),
      note('This session is recorded in Activity.'),
      out(''),
      cmd('dockwell-agent --version'),
      out('dockwell-agent 0.9.4'),
      cmd('uptime -p'),
      out('up 5 weeks, 6 days, 3 hours, 12 minutes'),
      cmd('df -h /'),
      out('Filesystem      Size  Used Avail Use% Mounted on'),
      out('/dev/sda1       160G   61G   99G  39% /'),
      cmd('docker ps --format \\'),
      { pre: '> ', text: "'table {{.Names}}\\t{{.Status}}'", color: ink },
      out('NAMES               STATUS'),
      out('worker              Up 38 seconds (healthy)'),
      out('api                 Up 4 minutes (healthy)'),
      out('storefront-web      Up 2 days (healthy)'),
      out('n8n                 Up 5 weeks'),
      out('plausible           Up 5 weeks (healthy)'),
      out('uptime-kuma         Up 5 weeks (healthy)'),
      out('valkey              Up 5 weeks (healthy)'),
      out('postgres            Up 5 weeks (healthy)'),
      cmd('docker logs -n 4 worker'),
      out('level=info msg="worker r57 starting"'),
      out('level=info msg="connected to valkey:6379"'),
      out('level=info msg="4 queues, concurrency 8"'),
      out('level=info msg="ready in 1.2 s"')
    ];
    return { theme: this.props.theme ?? 'dark', lines };
  }
}
</script>
</body>
</html>

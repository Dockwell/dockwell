<!-- @dsCard group="Feedback" height=206 subtitle="Confirms a change and keeps the way back one keystroke away" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Toast</title>
<style> .demo { padding: 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; } </style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Dockwell, h = React.createElement, T = H.Toast;
  function Demo() {
    var s = React.useState(0), k = s[0], set = s[1];
    return h('div', { className: 'demo' },
      h(T, { key: k, tone: 'healthy', title: 'Deployed api-gateway r128', description: '3 replicas on 3 servers, no downtime.', duration: 8000,
        action: { label: 'Undo', kbd: '⌘Z', icon: 'undo', onClick: function () { set(k + 1); } }, onClose: function () { set(k + 1); } }),
      h(T, { tone: 'critical', title: 'Build failed for web', description: 'npm ci exited with code 1 at step 3.',
        action: { label: 'View logs', icon: 'terminal' }, onClose: function () {} }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

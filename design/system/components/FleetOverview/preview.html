<!-- @dsCard group="Pages" height=1080 width=1280 page subtitle="The fleet screen, composed only from this system's components and tokens" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Fleet overview</title>
<style>
  .content { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .pagehead h1 { margin: 0; }
  .pagehead p { margin: 4px 0 0; color: var(--ink-muted); font-size: 13px; }
  .pagehead .tools { display: flex; gap: 8px; align-items: center; }
  .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .metrics > div { padding: 16px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 12px; align-items: start; }
  .search { margin-left: auto; width: 320px; justify-content: flex-start; color: var(--ink-muted); font-weight: 450; }
  .search .dw-kbd { margin-left: auto; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Dockwell, h = React.createElement, B = H.Button, I = H.Icon;
  function servers(region, net, n, special) {
    var out = [];
    for (var i = 1; i <= n; i++) {
      var id = region + '-' + (i < 10 ? '0' + i : i), sp = special[i] || {}, st = sp.status || 'healthy';
      out.push({ id: id, name: id, status: st, cpu: st === 'stopped' ? null : (sp.cpu || 14 + (i * 37) % 52), mem: st === 'stopped' ? null : 28 + (i * 23) % 50, ip: '10.210.' + net + '.' + (10 + i), note: sp.note });
    }
    return out;
  }
  var groups = [
    { label: 'fra-1', meta: 'Hetzner · 24 servers', servers: servers('fra-1', 4, 24, { 7: { status: 'degraded', cpu: 92, note: 'Memory above 90% for 6 min' }, 15: { status: 'deploying' }, 16: { status: 'deploying' }, 22: { status: 'stopped' } }) },
    { label: 'ams-1', meta: 'DigitalOcean · 16 servers', servers: servers('ams-1', 5, 16, { 3: { status: 'down', note: 'No heartbeat since 14:02' }, 9: { status: 'deploying' }, 12: { status: 'degraded', cpu: 88 } }) },
    { label: 'sfo-2', meta: 'On-prem rack B · 12 servers', servers: servers('sfo-2', 6, 12, { 5: { status: 'stopped' } }) }
  ];
  function wave(n, base, amp, seed) { var o = []; for (var i = 0; i < n; i++) o.push(base + amp * Math.sin((i + seed) / 3.1) + amp * 0.5 * Math.sin((i * 7 + seed) / 5.3)); return o; }
  var events = [
    { id: 1, kind: 'deploy', status: 'deploying', title: 'Deploying web to production', revision: 'r64', actor: 'GitHub Actions', time: 'now' },
    { id: 2, kind: 'deploy', title: 'Deployed api-gateway', status: 'healthy', revision: 'r128', actor: 'Mira Chen', time: '4 min ago', undoable: true, undoLabel: 'Roll back' },
    { id: 3, kind: 'alert', tone: 'warning', title: 'High memory on fra-1-07', meta: 'Degraded for 6 min', time: '9 min ago' },
    { id: 4, kind: 'alert', tone: 'critical', title: 'ams-1-03 went down', meta: '2 replicas moved', time: '14 min ago' },
    { id: 5, kind: 'server', title: 'ams-1-16 joined', meta: 'arm64 · 4 vCPU', time: '1 h ago' }
  ];
  function sp(seed, base, amp) { var o = []; for (var i = 0; i < 20; i++) o.push(base + amp * Math.sin((i + seed) / 2.4) + amp * 0.4 * Math.cos(i * seed)); return o; }
  var rows = [
    { id: 'api', name: 'api-gateway', image: 'ghcr.io/acme/api:8be41d2', status: 'healthy', replicas: '3/3', cpu: sp(1, 30, 6), domain: 'api.acme.dev', at: '4 min ago' },
    { id: 'web', name: 'web', image: 'ghcr.io/acme/web:2c71f09', status: 'deploying', replicas: '2/3', cpu: sp(2, 22, 4), domain: 'acme.dev', at: 'now' },
    { id: 'worker', name: 'worker', image: 'ghcr.io/acme/worker:9a03e1b', status: 'degraded', replicas: '4/4', cpu: sp(3, 82, 6), domain: '—', at: '2 h ago' },
    { id: 'pg', name: 'postgres', image: 'postgres:17.2', status: 'healthy', replicas: '1/1', cpu: sp(4, 18, 3), domain: 'private', at: '12 days ago' }
  ];
  var tone = { healthy: 'ink', deploying: 'cobalt', degraded: 'warning', stopped: 'idle' };
  var cols = [
    { key: 'name', header: 'App', render: function (r) { return h('div', { className: 'dw-cell' }, h('span', { className: 'dw-cell-title' }, r.name), h('span', { className: 'dw-cell-sub' }, r.image)); } },
    { key: 'status', header: 'Status', width: 130, render: function (r) { return h(H.StatusBadge, { status: r.status }); } },
    { key: 'replicas', header: 'Replicas', width: 84, align: 'right' },
    { key: 'cpu', header: 'CPU, last hour', width: 130, render: function (r) { return h(H.Sparkline, { data: r.cpu, width: 100, height: 20, min: 0, max: 100, tone: tone[r.status] }); } },
    { key: 'domain', header: 'Domain', mono: true, muted: true, width: 130 },
    { key: 'at', header: 'Deployed', align: 'right', muted: true, width: 104 }
  ];
  var nav = [
    ['home', 'Overview'], ['server', 'Fleet', 52], ['service', 'Apps', 14], ['globe', 'Domains', 9],
    ['database', 'Databases', 3], ['archive', 'Backups'], ['terminal', 'Logs'], ['activity', 'Alerts', 2]
  ];
  function Page() {
    var s = React.useState('fra-1-07'), sel = s[0], setSel = s[1];
    return h('div', { className: 'dw-shell' },
      h('aside', { className: 'dw-rail' },
        h('div', { className: 'dw-rail-brand' }, 'Dockwell'),
        nav.map(function (n) {
          return h('a', { key: n[1], className: 'dw-rail-item' + (n[1] === 'Fleet' ? ' is-active' : ''), 'aria-current': n[1] === 'Fleet' ? 'page' : undefined },
            h(I, { name: n[0], size: 16 }), n[1], n[2] != null ? h('span', { className: 'dw-rail-count' }, n[2]) : null);
        }),
        h('div', { className: 'dw-rail-section' }, 'Organization'),
        h('a', { className: 'dw-rail-item' }, h(I, { name: 'shield', size: 16 }), 'Access'),
        h('a', { className: 'dw-rail-item' }, h(I, { name: 'settings', size: 16 }), 'Settings')),
      h('main', { className: 'dw-main' },
        h('div', { className: 'dw-topbar' },
          h(H.ScopeBar, { org: 'Acme', project: 'storefront', environment: 'production', protected: true }),
          h(B, { className: 'search', icon: 'search', kbd: '⌘K' }, 'Search or run a command'),
          h(B, { variant: 'primary', icon: 'deploy' }, 'Deploy')),
        h('div', { className: 'content' },
          h('div', { className: 'pagehead' },
            h('div', null, h('h1', { className: 'title' }, 'Fleet'), h('p', null, '52 servers in 3 regions · agent 0.9.4 on all servers')),
            h('div', { className: 'tools' },
              h(H.SegmentedControl, { size: 'sm', label: 'Region', defaultValue: 'all', options: [{ value: 'all', label: 'All regions' }, { value: 'fra', label: 'fra-1' }, { value: 'ams', label: 'ams-1' }, { value: 'sfo', label: 'sfo-2' }] }),
              h(B, { icon: 'plus' }, 'Add server'))),
          h(H.Callout, { tone: 'critical', title: 'ams-1-03 is down', actions: h(React.Fragment, null, h(B, { size: 'sm', variant: 'ghost' }, 'Inspect'), h(B, { size: 'sm', variant: 'primary' }, 'Replace server')) },
            'Its 2 replicas moved to ams-1-04 and ams-1-05. No requests were dropped.'),
          h('div', { className: 'metrics' },
            h('div', { className: 'dw-panel' }, h(H.Metric, { label: 'Servers serving', value: '48', unit: 'of 52', data: [50, 51, 51, 52, 52, 52, 51, 52, 52, 52, 51, 50, 49, 48], min: 40, max: 52, caption: '2 degraded · 1 down · 2 stopped' })),
            h('div', { className: 'dw-panel' }, h(H.Metric, { label: 'CPU', value: '38.4', unit: '%', data: wave(40, 38, 6, 1), min: 0, max: 100, caption: 'Average, last hour' })),
            h('div', { className: 'dw-panel' }, h(H.Metric, { label: 'Memory', value: '61', unit: '%', data: wave(40, 61, 4, 9), threshold: 80, min: 0, max: 100, caption: '204 GB of 336 GB' })),
            h('div', { className: 'dw-panel' }, h(H.Metric, { label: 'Requests', value: '11.2k', unit: '/min', data: wave(28, 11, 1.1, 4), tone: 'cobalt', delta: '+8% w/w', caption: 'Across 9 domains' }))),
          h('div', { className: 'split' },
            h('section', { className: 'dw-panel' },
              h('div', { className: 'dw-panel-head' }, h('h2', { className: 'dw-panel-title' }, 'Servers'), h(B, { size: 'sm', variant: 'ghost', icon: 'filter' }, 'Group by region')),
              h('div', { className: 'dw-panel-body' }, h(H.FleetGrid, { groups: groups, selectedId: sel, onSelect: function (n) { setSel(n.id); } }))),
            h('section', { className: 'dw-panel' },
              h('div', { className: 'dw-panel-head' }, h('h2', { className: 'dw-panel-title' }, 'Recent changes'), h(B, { size: 'sm', variant: 'ghost', iconAfter: 'arrow-right' }, 'Timeline')),
              h('div', { className: 'dw-panel-body' }, h(H.Timeline, { events: events, onUndo: function () {} })))),
          h('section', null, h(H.Table, { caption: 'Apps', columns: cols, rows: rows, selectedKey: 'worker', onRowClick: function () {} })))));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Page));
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch</title>
<style>
  .demo { padding: 24px; display: flex; flex-direction: column; gap: 18px; max-width: 520px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var H = window.Dockwell, h = React.createElement, S = H.Switch;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'demo' },
    h(S, { label: 'Deploy on push', description: 'Every push to main builds and ships to production.', defaultChecked: true }),
    h(S, { label: 'Preview per pull request', description: 'Each PR gets its own URL and a copy of the staging database.', defaultChecked: true }),
    h(S, { label: 'Sleep idle previews', description: 'After 30 minutes without traffic. The next request wakes them.' }),
    h(S, { label: 'Require approval for production', description: 'Available on the Organization plan.', disabled: true })));
</script>
</body>
</html>
